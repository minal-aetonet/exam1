\/ol>\n<pre><code>ORCLPDB =\n  (DESCRIPTION =\n    (ADDRESS = (PROTOCOL = TCP)(HOST = dbserver)(PORT = 1521))\n    (CONNECT_DATA = (SERVICE_NAME = orclpdb)))\n<\/code><\/pre>\n<p>Connect: <code>sqlplus hr@ORCLPDB<\/code><\/p>\n<ol start=\"2\">\n<li><strong>Easy Connect (EZCONNECT)<\/strong> — no config file: <code>sqlplus hr@//dbserver:1521/orclpdb<\/code><\/li>\n<li><strong>Directory naming<\/strong> — descriptors stored centrally in LDAP (OID / Active Directory).<\/li>\n<li><strong>External naming<\/strong> — third-party naming services (e.g. NIS).<\/li>\n<\/ol>\n<p>The order of methods is set in <code>sqlnet.ora<\/code>: <code>NAMES.DIRECTORY_PATH = (TNSNAMES, EZCONNECT, LDAP)<\/code>.<\/p>"}, {"id": "IT276-16", "t": "Concurrency and locking; detect/resolve contention", "u": 6, "q": "Explain data concurrency and locking in Oracle. How do you detect and resolve lock contention?", "m": 5, "p": "High", "ty": "Explanation + SQL", "seen": {"M26": "Q19"}, "rep": false, "src": "TU Model Question 2026 Q19", "a": "<p><strong>Concurrency<\/strong> allows many users to access data simultaneously while maintaining consistency. Oracle uses <strong>multiversion read consistency<\/strong> (readers use undo to see a consistent snapshot — <em>readers never block writers and writers never block readers<\/em>) and <strong>row-level locking<\/strong> for writers.<\/p>\n<p><strong>Locking levels:<\/strong> row-level (TX) locks for DML · table-level (TM) locks — row share, row exclusive, share, share row exclusive, exclusive · DDL locks · internal latches.\n<strong>DML lock example:<\/strong> session A updates row 10 → TX lock; session B trying to update row 10 waits until A commits or rolls back.<\/p>\n<p><strong>Causes of contention:<\/strong> long uncommitted transactions, unindexed foreign keys, explicit <code>LOCK TABLE<\/code>, applications that don't commit, hot rows.<\/p>\n<p><strong>Detecting<\/strong><\/p>\n<pre><code class=\"language-sql\">SELECT sid, serial#, username, blocking_session, event, seconds_in_wait\nFROM   v$session WHERE blocking_session IS NOT NULL;\nSELECT * FROM v$lock WHERE block = 1;            -- blockers\nSELECT * FROM dba_blockers;  SELECT * FROM dba_waiters;\n<\/code><\/pre>\n<p>Enterprise Manager's <em>Blocking Sessions<\/em> page shows the same visually.<\/p>\n<p><strong>Resolving:<\/strong> ask the blocking user to commit/rollback · kill the blocking session: <code>ALTER SYSTEM KILL SESSION 'sid,serial#' IMMEDIATE;<\/code> · fix the application (commit promptly, index foreign keys, <code>SELECT … FOR UPDATE NOWAIT/WAIT n<\/code>).\n<strong>Deadlocks<\/strong> are detected automatically by Oracle (ORA-00060), which rolls back one statement; a trace is written to the alert log.<\/p>"}, {"id": "IT276-17", "t": "Undo management; retention; flashback query", "u": 6, "q": "What is the undo retention period? Explain undo management and flashback query.", "m": 3, "p": "High", "ty": "Explanation + SQL", "seen": {"M26": "A7, A8"}, "rep": false, "src": "TU Model Question 2026 A7, A8", "a": "<p><strong>Undo data<\/strong> stores old values of changed data. It is used for rollback, read consistency, recovery of uncommitted transactions and Flashback features. It lives in an <strong>undo tablespace<\/strong> (<code>UNDO_MANAGEMENT = AUTO<\/code>).<\/p>\n<p><strong>Undo retention period (<code>UNDO_RETENTION<\/code>, seconds):<\/strong> how long Oracle tries to keep committed undo before overwriting it. Too short → <code>ORA-01555: snapshot too old<\/code>. <strong>Retention guarantee<\/strong> forces Oracle to keep undo for the full period even if new DML must fail:<\/p>\n<pre><code class=\"language-sql\">ALTER SYSTEM SET undo_retention = 1800;\nALTER TABLESPACE undotbs1 RETENTION GUARANTEE;\nSELECT * FROM v$undostat;          -- monitor; Undo Advisor in EM recommends size\n<\/code><\/pre>\n<p><strong>Flashback query<\/strong> — view data as it was at a past time or SCN, using undo:<\/p>\n<pre><code class=\"language-sql\">SELECT * FROM employees AS OF TIMESTAMP (SYSTIMESTAMP - INTERVAL '15' MINUTE)\nWHERE  employee_id = 101;\n-- restore an accidentally deleted row\nINSERT INTO employees\n  SELECT * FROM employees AS OF TIMESTAMP (SYSTIMESTAMP - INTERVAL '15' MINUTE) WHERE employee_id = 101;\n<\/code><\/pre>\n<p>Related: Flashback Version Query, Flashback Table (<code>FLASHBACK TABLE emp TO TIMESTAMP …<\/code>), Flashback Drop (recycle bin).<\/p>"}, {"id": "IT276-18", "t": "Backup & recovery: RMAN, Flashback DB, Data Guard, RAC", "u": 6, "q": "Explain backup and recovery strategies and techniques, including RMAN, Flashback Database, Data Guard and Oracle RAC.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M26": "Q22"}, "rep": false, "src": "TU Model Question 2026 Q22", "a": "<p><strong>Types of failure:<\/strong> statement, user process, network, user error (accidental drop), instance failure, media failure.<\/p>\n<p><strong>Backup strategy<\/strong> depends on RPO (acceptable data loss) and RTO (acceptable downtime): run in <strong>ARCHIVELOG<\/strong> mode; full weekly + incremental daily; back up archived logs; multiplex control files and redo; keep off-site copies; test restores regularly.<\/p>\n<p><strong>Types of backup:<\/strong> physical vs logical · whole vs partial · full vs incremental (level 0, level 1 differential/cumulative) · consistent (cold) vs inconsistent (hot, needs archive logs) · user-managed vs RMAN.<\/p>\n<p><strong>1. User-managed backup:<\/strong> OS copy of files; for hot backup <code>ALTER DATABASE BEGIN BACKUP;<\/code> … copy datafiles … <code>END BACKUP;<\/code>.<\/p>\n<p><strong>2. RMAN (Recovery Manager)<\/strong> — Oracle's built-in backup tool: block-level incremental backups, compression, corruption checking, catalog metadata, automated restore/recovery, Fast Recovery Area.<\/p>\n<pre><code>RMAN&gt; CONFIGURE CONTROLFILE AUTOBACKUP ON;\nRMAN&gt; CONFIGURE RETENTION POLICY TO RECOVERY WINDOW OF 7 DAYS;\nRMAN&gt; BACKUP INCREMENTAL LEVEL 0 DATABASE PLUS ARCHIVELOG;\nRMAN&gt; BACKUP INCREMENTAL LEVEL 1 DATABASE;\nRMAN&gt; LIST BACKUP;   REPORT NEED BACKUP;   DELETE OBSOLETE;\n-- Recovery after loss of a datafile\nRMAN&gt; ALTER DATABASE DATAFILE 5 OFFLINE;\nRMAN&gt; RESTORE DATAFILE 5;  RECOVER DATAFILE 5;\nRMAN&gt; ALTER DATABASE DATAFILE 5 ONLINE;\n-- Point-in-time recovery\nRMAN&gt; RUN { SET UNTIL TIME &quot;TO_DATE('2026-11-30 10:00','YYYY-MM-DD HH24:MI')&quot;;\n            RESTORE DATABASE; RECOVER DATABASE; }\nRMAN&gt; ALTER DATABASE OPEN RESETLOGS;\n<\/code><\/pre>\n<p><strong>3. Data Pump (logical backup):<\/strong> <code>expdp<\/code>/<code>impdp<\/code> of schemas or tables — useful for migration and object recovery.<\/p>\n<p><strong>4. Flashback Database<\/strong> — rewinds the whole database to a past point using flashback logs in the Fast Recovery Area; much faster than restore for logical errors (bad batch job).<\/p>\n<pre><code class=\"language-sql\">ALTER DATABASE FLASHBACK ON;\nCREATE RESTORE POINT before_upgrade GUARANTEE FLASHBACK DATABASE;\n-- later (mounted): FLASHBACK DATABASE TO RESTORE POINT before_upgrade; ALTER DATABASE OPEN RESETLOGS;\n<\/code><\/pre>\n<p>Multitenant: flashback a single <strong>PDB<\/strong> (<code>FLASHBACK PLUGGABLE DATABASE pdb1 TO RESTORE POINT rp1<\/code>).<\/p>\n<p><strong>5. Data Guard<\/strong> — standby database(s) kept synchronised by shipping and applying redo; protection modes (maximum protection / availability / performance); <strong>switchover<\/strong> (planned) and <strong>failover<\/strong> (disaster); Active Data Guard for read-only reporting and automatic block repair.<\/p>\n<p><strong>6. Oracle RAC<\/strong> — multiple instances on clustered servers sharing one database; if one node fails, sessions fail over to the surviving nodes (high availability and scalability), but RAC does <strong>not<\/strong> protect against storage loss or user error — combine it with backups and Data Guard (Oracle's <em>Maximum Availability Architecture<\/em>).<\/p>\n<p><strong>Conclusion:<\/strong> RMAN + archive logs for media recovery, Flashback for logical errors, Data Guard for disasters, RAC for node failure.<\/p>"}, {"id": "IT276-19", "t": "Data Pump export/import; SQL*Loader; external tables", "u": 7, "q": "Explain Data Pump export and import.", "m": 3, "p": "High", "ty": "Commands", "seen": {"M26": "Q16"}, "rep": false, "src": "TU Model Question 2026 Q16", "a": "<p><strong>Oracle Data Pump<\/strong> (<code>expdp<\/code>/<code>impdp<\/code>) is a high-speed server-side utility for <strong>logical<\/strong> export and import of data and metadata into dump files. Modes: full, schema, table, tablespace, transportable. Features: parallelism, filtering (INCLUDE/EXCLUDE, QUERY), compression, remapping, interactive mode (attach, stop, restart), network import over a DB link, and the <code>DBMS_DATAPUMP<\/code> API.<\/p>\n<pre><code class=\"language-sql\">CREATE DIRECTORY dp_dir AS '/u01/dpdump';\nGRANT READ, WRITE ON DIRECTORY dp_dir TO hr;\n<\/code><\/pre>\n<pre><code>expdp hr/password DIRECTORY=dp_dir DUMPFILE=hr.dmp LOGFILE=hr_exp.log SCHEMAS=hr\nimpdp system/password DIRECTORY=dp_dir DUMPFILE=hr.dmp REMAP_SCHEMA=hr:hr_test LOGFILE=hr_imp.log\nexpdp hr/password DIRECTORY=dp_dir DUMPFILE=emp.dmp TABLES=employees QUERY='employees:&quot;WHERE department_id=10&quot;'\n<\/code><\/pre>\n<p>Data Pump uses a master process, a master table and worker processes; views: <code>DBA_DATAPUMP_JOBS<\/code>.<\/p>\n<p><strong>SQL*Loader<\/strong> loads flat files (CSV) into tables using a control file: <code>sqlldr hr/pw control=emp.ctl<\/code> (conventional vs direct-path load).\n<strong>External tables<\/strong> let you query a flat file as if it were a table (<code>ORGANIZATION EXTERNAL<\/code>).<\/p>"}, {"id": "IT276-20", "t": "SQL tuning: optimiser, plan directives, adaptive plans; Explain Plan", "u": 7, "q": "Explain SQL performance tuning: the optimiser, SQL plan directives and adaptive execution plans. What is Explain Plan?", "m": 5, "p": "High", "ty": "Explanation + SQL", "seen": {"M26": "A9, Q20"}, "rep": false, "src": "TU Model Question 2026 A9, Q20", "a": "<p><strong>Optimiser (CBO — Cost-Based Optimiser):<\/strong> chooses the cheapest execution plan for each SQL statement based on <strong>statistics<\/strong> (row counts, column distributions/histograms, index stats) — access paths (full scan, index scan), join methods (nested loops, hash, sort-merge) and join order.<\/p>\n<pre><code class=\"language-sql\">EXEC DBMS_STATS.GATHER_TABLE_STATS('HR', 'EMPLOYEES');\nEXEC DBMS_STATS.GATHER_SCHEMA_STATS('HR');\n<\/code><\/pre>\n<p><strong>Explain Plan<\/strong> shows the plan the optimiser would use:<\/p>\n<pre><code class=\"language-sql\">EXPLAIN PLAN FOR SELECT * FROM employees WHERE department_id = 50;\nSELECT * FROM TABLE(DBMS_XPLAN.DISPLAY);\n-- actual plan of a cached statement:\nSELECT * FROM TABLE(DBMS_XPLAN.DISPLAY_CURSOR('sql_id', NULL, 'ALLSTATS LAST'));\n<\/code><\/pre>\n<p>The <strong>plan hash value<\/strong> identifies a plan, so you can spot plan changes over time.<\/p>\n<p><strong>Adaptive execution plans (12c+):<\/strong> the optimiser can change part of the plan <strong>at run time<\/strong> — e.g. switch from nested loops to a hash join when actual rows differ greatly from estimates — using statistics collectors inside the plan; also adaptive parallel distribution.<\/p>\n<p><strong>SQL plan directives:<\/strong> extra information the optimiser records when it finds misestimates (e.g. correlated columns). Next time, it uses dynamic sampling or creates extended statistics for those expressions — the database learns from its mistakes (view: <code>DBA_SQL_PLAN_DIRECTIVES<\/code>).<\/p>\n<p><strong>SQL advisors:<\/strong> SQL Tuning Advisor (recommends statistics, indexes, SQL profiles, rewrites) and SQL Access Advisor (indexes, materialised views, partitions).<\/p>\n<p><strong>Tuning methodology:<\/strong> identify top SQL (AWR/ADDM) → examine plans → fix statistics / add indexes / rewrite SQL / use bind variables → verify improvement.<\/p>"}, {"id": "IT276-21", "t": "AWR, ADDM, alert log, advisors, memory tuning", "u": 7, "q": "Explain the alert log, AWR, ADDM and advisors in performance management.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li><strong>Alert log:<\/strong> chronological log of major events and errors (startups, ORA- errors, log switches, deadlocks) — first place to check. Location: <code>SELECT value FROM v$diag_info WHERE name = 'Diag Trace';<\/code><\/li>\n<li><strong>AWR (Automatic Workload Repository):<\/strong> MMON takes performance <strong>snapshots<\/strong> (default hourly, kept 8 days); AWR reports compare two snapshots (top wait events, top SQL). <code>@?/rdbms/admin/awrrpt.sql<\/code>; <code>EXEC DBMS_WORKLOAD_REPOSITORY.CREATE_SNAPSHOT;<\/code><\/li>\n<li><strong>Statistics level:<\/strong> <code>STATISTICS_LEVEL = TYPICAL<\/code> (default) enables AWR/advisors; BASIC disables them; ALL adds more detail.<\/li>\n<li><strong>ADDM (Automatic Database Diagnostic Monitor):<\/strong> analyses AWR snapshots automatically and reports findings and recommendations (\"SQL statements consuming significant time\").<\/li>\n<li><strong>Advisors:<\/strong> Memory (SGA/PGA), Segment, Undo, SQL Tuning, SQL Access, MTTR advisors. <strong>Server-generated alerts / notification rules<\/strong> (e.g. tablespace 85% full) via EM.<\/li>\n<li><strong>Temporary tables:<\/strong> global temporary tables hold session- or transaction-private data, reducing redo and contention.<\/li>\n<\/ul>"}, {"id": "IT276-22", "t": "Resource Manager and Scheduler", "u": 8, "q": "What is the role of Oracle Resource Manager? Explain the Scheduler with job creation.", "m": 5, "p": "High", "ty": "Explanation + PL/SQL", "seen": {"M26": "A10"}, "rep": false, "src": "TU Model Question 2026 A10", "a": "<p><strong>Database Resource Manager<\/strong> controls how CPU, parallel servers, sessions and idle time are allocated among groups of users, so critical work is not starved by heavy reports. Components: <strong>consumer groups<\/strong> (OLTP, REPORTS), <strong>resource plans<\/strong>, <strong>plan directives<\/strong> (e.g. OLTP 70% CPU, REPORTS 30%). The <strong>DEFAULT_MAINTENANCE_PLAN<\/strong> limits automated maintenance tasks (statistics gathering, advisors) during maintenance windows.<\/p>\n<pre><code class=\"language-sql\">BEGIN\n  DBMS_RESOURCE_MANAGER.CREATE_PENDING_AREA;\n  DBMS_RESOURCE_MANAGER.CREATE_CONSUMER_GROUP('OLTP', 'online users');\n  DBMS_RESOURCE_MANAGER.CREATE_CONSUMER_GROUP('REPORTS', 'batch reports');\n  DBMS_RESOURCE_MANAGER.CREATE_PLAN('DAY_PLAN', 'daytime plan');\n  DBMS_RESOURCE_MANAGER.CREATE_PLAN_DIRECTIVE('DAY_PLAN', 'OLTP', mgmt_p1 =&gt; 70);\n  DBMS_RESOURCE_MANAGER.CREATE_PLAN_DIRECTIVE('DAY_PLAN', 'REPORTS', mgmt_p1 =&gt; 25);\n  DBMS_RESOURCE_MANAGER.CREATE_PLAN_DIRECTIVE('DAY_PLAN', 'OTHER_GROUPS', mgmt_p1 =&gt; 5);\n  DBMS_RESOURCE_MANAGER.SUBMIT_PENDING_AREA;\nEND;\n/\nALTER SYSTEM SET resource_manager_plan = 'DAY_PLAN';\n<\/code><\/pre>\n<p><strong>Oracle Scheduler (DBMS_SCHEDULER):<\/strong> automates tasks. Components: <strong>program<\/strong> (what), <strong>schedule<\/strong> (when), <strong>job<\/strong> (program + schedule), <strong>job class<\/strong> (group with common resource consumer group/logging), <strong>window<\/strong> (time period with a resource plan), chains. Privilege: <code>CREATE JOB<\/code>.<\/p>\n<pre><code class=\"language-sql\">BEGIN\n  DBMS_SCHEDULER.CREATE_JOB(\n    job_name        =&gt; 'NIGHTLY_STATS',\n    job_type        =&gt; 'PLSQL_BLOCK',\n    job_action      =&gt; 'BEGIN DBMS_STATS.GATHER_SCHEMA_STATS(''HR''); END;',\n    start_date      =&gt; SYSTIMESTAMP,\n    repeat_interval =&gt; 'FREQ=DAILY;BYHOUR=2;BYMINUTE=0',   -- time-based\n    enabled         =&gt; TRUE);\nEND;\n/\nSELECT job_name, state, last_start_date FROM dba_scheduler_jobs;\n<\/code><\/pre>\n<p><strong>Event-based schedules<\/strong> start a job when an event message arrives in a queue (e.g. a file arrives).<\/p>"}], "defs": [["Oracle instance", "SGA memory + background processes that manage a database."], ["Oracle database", "Physical files: datafiles, control files, redo logs."], ["SGA", "Shared memory: buffer cache, shared pool, redo buffer, large/Java pools."], ["PGA", "Private memory of a server process."], ["Tablespace", "Logical storage unit made of datafiles."], ["Control file", "Binary file describing database structure and checkpoints."], ["Redo log", "Files recording all changes for recovery."], ["ARCHIVELOG mode", "Mode that archives filled redo logs, enabling point-in-time recovery."], ["Schema-only account", "User created with NO AUTHENTICATION that cannot log in."], ["Profile", "Set of password and resource limits for users."], ["Unified auditing", "Single, policy-based audit trail for all audit sources."], ["Listener", "Server process that accepts client connection requests (port 1521)."], ["Undo retention", "Time Oracle tries to keep committed undo data."], ["Flashback query", "Query data as of a past time using undo."], ["RMAN", "Recovery Manager — Oracle's backup/restore tool."], ["Data Pump", "expdp/impdp utilities for logical export/import."], ["Explain Plan", "Display of the optimiser's execution plan for SQL."], ["AWR/ADDM", "Performance snapshot repository / automatic diagnostic monitor."], ["Resource Manager", "Allocates CPU and resources among consumer groups."]], "revision": "<p><strong>IT 276 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> instance (SGA + background) vs database (files) · SGA parts · PGA · DBWn, LGWR, CKPT, SMON, PMON, ARCn, MMON · logical: tablespace → segment → extent → block · PFILE vs SPFILE · NOMOUNT → MOUNT → OPEN · RAC, Data Guard, ASM · objects SQL.<\/li>\n<li><strong>U2:<\/strong> CREATE/ALTER TABLESPACE, ADD DATAFILE, RESIZE · v$controlfile, v$log, v$logfile, v$archived_log, ARCHIVE LOG LIST · multiplexing.<\/li>\n<li><strong>U3:<\/strong> CREATE/ALTER/LOCK/DROP USER · NO AUTHENTICATION · authentication methods (password, OS, password file, global, Kerberos/SSL, proxy) · system vs object privileges · roles · v$session + KILL SESSION.<\/li>\n<li><strong>U4:<\/strong> CREATE PROFILE limits · unified audit policy · UNIFIED_AUDIT_TRAIL · AUDIT_ADMIN vs AUDIT_VIEWER.<\/li>\n<li><strong>U5:<\/strong> listener 1521, listener.ora, lsnrctl start/stop/status · tnsnames.ora, EZCONNECT, LDAP · tnsping.<\/li>\n<li><strong>U6:<\/strong> row/table locks, v$session blocking_session, KILL · undo_retention, guarantee, ORA-01555 · AS OF TIMESTAMP · RMAN commands · Flashback DB, Data Guard, RAC · PDB flashback.<\/li>\n<li><strong>U7:<\/strong> alert log, AWR, ADDM, advisors · DBMS_STATS · EXPLAIN PLAN + DBMS_XPLAN · adaptive plans, plan directives · expdp/impdp · SQL*Loader · external tables.<\/li>\n<li><strong>U8:<\/strong> consumer groups, plans, directives · DBMS_SCHEDULER.CREATE_JOB, repeat_interval, job classes, windows.<\/li>\n<\/ul>", "practice": ["[AI practice] Differentiate PFILE and SPFILE. (1)", "[AI practice] Write SQL to create user 'sita', grant CREATE SESSION and SELECT on hr.employees, and lock the account. (3)", "[AI practice] Differentiate cold and hot backup. (3)", "[AI practice] Explain the steps to recover a database after loss of all control files. (5)", "[AI practice] A bank's database slows every morning at 10 a.m. Explain how you would diagnose and fix the problem using AWR, ADDM and SQL tuning tools. (10)"], "checklist": ["Draw the full Oracle architecture", "Name 7 background processes and their jobs", "Explain SGA vs PGA", "Write tablespace/datafile SQL", "Query control file and redo views", "Write user, role and privilege SQL", "Explain 5 authentication methods", "Create a unified audit policy", "Configure listener and tnsnames", "Detect and kill blocking sessions", "Explain undo retention and flashback query", "Write RMAN backup and restore commands", "Explain Data Guard, RAC, Flashback DB", "Write expdp/impdp", "Use EXPLAIN PLAN and DBMS_STATS", "Create a scheduler job"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question 2026 (IT 276)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf"], ["Oracle Database 19c Administrator's Guide / Concepts (syntax reference)", "https://docs.oracle.com/en/database/oracle/oracle-database/19/"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "IT 245", "id": "IT245", "title": "Business Information Systems", "sem": 6, "exam": "2026-12-09", "official": "IT 245: Business Information Systems", "syllabus": "BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH, with lab (Big Data, analytics tools, cloud)", "note": "Matches routine. OC counterpart on the same exam day in Dec 2025 was IT 224 Software Engineering — not used.", "marks": "Full Marks 60. Group A 10×1=10 · Group B 5×3=15 (any 5 of 6) · Group C 3×5=15 (any 3 of 4) · Group D 2×10=20 (2025 paper and TU model).", "objectives": "Teach business information-system concepts and organisational impact: business processes, competitive advantage, Big Data, knowledge management, mobile commerce, social computing, ERP, CRM, SCM, business analytics and cloud computing.", "units": [{"n": 1, "t": "Introduction to Information Systems", "lh": 3, "topics": "Why study IS; computer-based information systems and types; impact of IT on organisations; importance of IS to society."}, {"n": 2, "t": "Organisational Strategy, Competitive Advantage and IS", "lh": 6, "topics": "Business processes; improvement, reengineering (BPR) and management (BPM); business pressures, organisational responses and IT support; competitive advantage and strategic information systems."}, {"n": 3, "t": "Data and Knowledge Management", "lh": 5, "topics": "Managing data; database approach; Big Data; data warehouses and data marts; knowledge management."}, {"n": 4, "t": "Wireless, Mobile Computing and Mobile Commerce", "lh": 5, "topics": "Wireless technologies; wireless networks and Internet access; mobile computing and m-commerce; Internet of Things."}, {"n": 5, "t": "Social Computing", "lh": 4, "topics": "Web 2.0; social computing in business; shopping, marketing, CRM and HRM applications."}, {"n": 6, "t": "Information Systems within Organisations", "lh": 6, "topics": "Transaction processing systems; functional-area IS; ERP systems; ERP support for business processes."}, {"n": 7, "t": "CRM and SCM", "lh": 7, "topics": "Defining CRM; operational CRM; other CRM types; supply chains; SCM; IT support for SCM."}, {"n": 8, "t": "Business Analytics", "lh": 7, "topics": "Managers and decision-making; business-analytics process; descriptive, predictive and prescriptive analytics; presentation tools."}, {"n": 9, "t": "Cloud Computing", "lh": 5, "topics": "Basics; types; services; benefits; concerns and risks; 'Big Three' vendors; web services and SOA."}], "avail": "<p><strong>Actual NC papers found: 1<\/strong> — the 2025 IT 245 paper, transcribed on bimstudies.com (page updated 15 Dec 2025). The exact session (April or December 2025) <strong>could not be confirmed<\/strong>; it is most likely the April 2025 regular paper. No official TU header was visible; bimstudies' other 2025 transcriptions matched TU-headed copies. The Group D case background was not shown (only its three sub-questions).<\/p>\n<p><strong>TU Model Question (6th semester)<\/strong> for IT 245 is fully available via bimstudies (Category C).<\/p>\n<p>A second NC sitting paper (15 Dec 2025) was <strong>not found — unavailable<\/strong>.<\/p>\n<p><strong>Strong repetition signal:<\/strong> the model and the exam overlap on ~9 concepts (see analysis).<\/p>", "pattern": "<p><strong>Model → exam repetitions (concept level):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Model<\/th>\n<th>2025 exam<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Competitive advantage<\/td>\n<td>A2, D21<\/td>\n<td>A2, D21.1<\/td>\n<\/tr>\n<tr>\n<td>Data warehouse / data mart<\/td>\n<td>A3<\/td>\n<td>A3<\/td>\n<\/tr>\n<tr>\n<td>Web 2.0<\/td>\n<td>A5<\/td>\n<td>A5<\/td>\n<\/tr>\n<tr>\n<td>TPS<\/td>\n<td>A7<\/td>\n<td>A6<\/td>\n<\/tr>\n<tr>\n<td>Cloud / SaaS<\/td>\n<td>A10<\/td>\n<td>A9, B16<\/td>\n<\/tr>\n<tr>\n<td>IT support for SCM<\/td>\n<td>B14<\/td>\n<td>A7, C18 (upgraded)<\/td>\n<\/tr>\n<tr>\n<td>ERP<\/td>\n<td>D22<\/td>\n<td>C17<\/td>\n<\/tr>\n<tr>\n<td>Business process ↔ IS / BPR<\/td>\n<td>B11<\/td>\n<td>B12<\/td>\n<\/tr>\n<tr>\n<td>Analytics types (descriptive/predictive), managers &amp; decisions<\/td>\n<td>A9, B15<\/td>\n<td>A8, C19<\/td>\n<\/tr>\n<tr>\n<td>Mobile computing / wireless / IoT<\/td>\n<td>A4, B13, C19<\/td>\n<td>A4, B14, C20<\/td>\n<\/tr>\n<tr>\n<td>Social computing applications<\/td>\n<td>A6, C20<\/td>\n<td>B15, D21.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Every Group A topic of the model reappeared in the exam in some form.<\/strong> Questions are conceptual (Rainer &amp; Prince textbook style) and often ask \"justify with example\". There are no numericals.<\/p>", "papers": [{"id": "E25", "label": "2025 exam", "cat": "A", "session": "2025 (presumed April regular; not confirmed)", "source": "bimstudies.com transcription", "url": "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-information-systems-exam-question-solution-bitm-6th-sem-2025/", "note": "Group D case background not reproduced in the source; sub-question marks not shown.", "qs": [{"no": "1", "g": "A", "t": "List any components of an information system.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "Define the term competitive advantage.", "m": 1, "u": 2}, {"no": "3", "g": "A", "t": "Mention any one difference between a data warehouse and a database.", "m": 1, "u": 3}, {"no": "4", "g": "A", "t": "Define mobile commerce.", "m": 1, "u": 4}, {"no": "5", "g": "A", "t": "Mention any one enhancement in Web 2.0 over Web 1.0.", "m": 1, "u": 5}, {"no": "6", "g": "A", "t": "List any two desirable characteristics of TPS.", "m": 1, "u": 6}, {"no": "7", "g": "A", "t": "What is supply chain management?", "m": 1, "u": 7}, {"no": "8", "g": "A", "t": "What is predictive analytics?", "m": 1, "u": 8}, {"no": "9", "g": "A", "t": "Define cloud computing.", "m": 1, "u": 9}, {"no": "10", "g": "A", "t": "List any two functional-area information systems.", "m": 1, "u": 6}, {"no": "11", "g": "B", "t": "Explain any three types of information system.", "m": 3, "u": 1}, {"no": "12", "g": "B", "t": "Explain the steps of business process reengineering.", "m": 3, "u": 2}, {"no": "13", "g": "B", "t": "What is the importance of knowledge management? Explain with example.", "m": 3, "u": 3}, {"no": "14", "g": "B", "t": "Explain any three contemporary wireless technologies.", "m": 3, "u": 4}, {"no": "15", "g": "B", "t": "Explain the concept of social computing in human resource management.", "m": 3, "u": 5}, {"no": "16", "g": "B", "t": "Mention any three benefits of cloud computing.", "m": 3, "u": 9}, {"no": "17", "g": "C", "t": "How does the implementation of ERP support business processes? Explain with example.", "m": 5, "u": 6}, {"no": "18", "g": "C", "t": "'Supply chain management process can be made efficient with the support of IT.' Justify.", "m": 5, "u": 7}, {"no": "19", "g": "C", "t": "Explain the importance of the stages of business analytics in decision-making with example.", "m": 5, "u": 8}, {"no": "20", "g": "C", "t": "'Advancement in networking technologies and mobile computing has transformed business in various areas.' Justify with example.", "m": 5, "u": 4}, {"no": "21", "g": "D", "t": "Case 'ABC Corp': (21.1) How did ABC Corp use information systems to gain competitive advantage? (21.2) What role did business analytics, cloud computing and knowledge management play in improving operations? (21.3) How did social computing and CRM enhance customer engagement and satisfaction?", "m": 20, "u": 2}]}, {"id": "M", "label": "TU model question", "cat": "C", "session": "TU FOM model question, BIM 6th sem", "source": "bimstudies.com (TU model question with solutions)", "url": "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-information-systems-model-question-solution-bitm-6th-sem/", "note": "", "qs": [{"no": "1", "g": "A", "t": "Define information system.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "What do you mean by competitive advantage?", "m": 1, "u": 2}, {"no": "3", "g": "A", "t": "What is a data mart?", "m": 1, "u": 3}, {"no": "4", "g": "A", "t": "What do you mean by short-range wireless network?", "m": 1, "u": 4}, {"no": "5", "g": "A", "t": "What is Web 2.0?", "m": 1, "u": 5}, {"no": "6", "g": "A", "t": "What do you mean by social shopping?", "m": 1, "u": 5}, {"no": "7", "g": "A", "t": "Define transaction processing system.", "m": 1, "u": 6}, {"no": "8", "g": "A", "t": "Define customer touch point.", "m": 1, "u": 7}, {"no": "9", "g": "A", "t": "Define descriptive analytics.", "m": 1, "u": 8}, {"no": "10", "g": "A", "t": "What is software as a service?", "m": 1, "u": 9}, {"no": "11", "g": "B", "t": "What is the relationship between business process and information system?", "m": 3, "u": 2}, {"no": "12", "g": "B", "t": "Describe the characteristics of Big Data.", "m": 3, "u": 3}, {"no": "13", "g": "B", "t": "What are the major drivers of mobile computing?", "m": 3, "u": 4}, {"no": "14", "g": "B", "t": "How does IT support supply chain management?", "m": 3, "u": 7}, {"no": "15", "g": "B", "t": "Why do managers need IT support?", "m": 3, "u": 8}, {"no": "16", "g": "B", "t": "Explain service-oriented architecture (SOA) in brief.", "m": 3, "u": 9}, {"no": "17", "g": "C", "t": "How does IT impact organisations?", "m": 5, "u": 1}, {"no": "18", "g": "C", "t": "Describe how companies can use Big Data to gain competitive advantage.", "m": 5, "u": 3}, {"no": "19", "g": "C", "t": "Define IoT and give two examples of how it benefits organisations.", "m": 5, "u": 4}, {"no": "20", "g": "C", "t": "What are the benefits and risks of social commerce?", "m": 5, "u": 5}, {"no": "21", "g": "D", "t": "Explain strategic information systems, strategies for achieving competitive advantage, and business–IT alignment.", "m": 10, "u": 2}, {"no": "22", "g": "D", "t": "Define ERP and identify its advantages and drawbacks for businesses.", "m": 10, "u": 6}]}], "notes": {"1": "<p>Every organisation — from a corner shop to a multinational bank — depends on information. Information systems collect and process data so that people can run operations, make decisions and compete.<\/p>\n<h3>1.1 Why study information systems?<\/h3>\n<p>Information systems are everywhere in business: online banking, e-commerce, ride-hailing, payroll. Every manager uses IS, so understanding them helps one be an <strong>informed user<\/strong> — able to choose, use and improve systems, communicate with IT staff and spot opportunities for innovation. IS careers (analyst, developer, data scientist, security specialist) are also in demand.<\/p>\n<h3>1.2 Computer-based information systems (CBIS)<\/h3>\n<p><strong>Definitions:<\/strong> <em>data<\/em> = raw facts; <em>information<\/em> = data organised to be meaningful; <em>knowledge<\/em> = information applied to a problem. An <strong>information system<\/strong> collects, processes, stores, analyses and disseminates information for a specific purpose.\n<strong>Components:<\/strong> hardware · software · database · network · procedures · people.\n<strong>Types (by breadth of support):<\/strong> functional-area IS · ERP · transaction processing systems · inter-organisational systems (SCM) · electronic commerce systems.\n<strong>Types (by organisational level):<\/strong> TPS (operational) · MIS (middle) · DSS/business analytics · executive dashboards / EIS (top) · expert systems.<\/p>\n<h3>1.3 Impact of IT on organisations<\/h3>\n<p>IT may reduce the number of middle managers (flatter organisations), change managers' jobs, threaten some jobs while creating others, raise employee health and safety issues (ergonomics, stress), and create opportunities for people with disabilities.<\/p>\n<h3>1.4 Importance of IS to society<\/h3>\n<p>IT improves quality of life (e-health, e-learning, e-government, remote work), enables robotics and automation, and improves healthcare (telemedicine, diagnostics). It also raises concerns: job displacement, privacy, digital divide, misinformation.<\/p>\n<p><strong>Key points:<\/strong> informed user · data/information/knowledge · six components · IS types · organisational and societal impacts.<\/p>", "2": "<p>Organisations face pressure from markets, technology and society. They respond by improving business processes and by using information systems strategically to gain an edge over competitors.<\/p>\n<h3>2.1 Business processes<\/h3>\n<p>A <strong>business process<\/strong> is an ongoing collection of related activities that create a product or service of value to the organisation, its partners or customers. Examples: procurement (purchase to pay), fulfilment (order to cash), production. Processes are measured by <strong>efficiency<\/strong> (doing things right) and <strong>effectiveness<\/strong> (doing the right things). IS can execute, capture/store, monitor and enable redesign of processes.<\/p>\n<h3>2.2 Process improvement, reengineering and management<\/h3>\n<ul>\n<li><strong>BPR (Business Process Reengineering)<\/strong> — radical redesign for dramatic improvement (Hammer &amp; Champy).<\/li>\n<li><strong>BPI (Business Process Improvement)<\/strong> — incremental improvement; Six Sigma DMAIC: Define, Measure, Analyse, Improve, Control.<\/li>\n<li><strong>BPM (Business Process Management)<\/strong> — a management approach combining methods and tools (process modelling, BPMN, workflow, business activity monitoring) for continuous improvement.<\/li>\n<\/ul>\n<h3>2.3 Business pressures, organisational responses and IT support<\/h3>\n<p><strong>Pressures:<\/strong> market (globalisation, changing workforce, powerful customers), technology (innovation, information overload), societal/political/legal (social responsibility, compliance, protection against terrorism, ethics).\n<strong>Responses:<\/strong> strategic systems · customer focus · make-to-order and mass customisation · e-business and e-commerce.<\/p>\n<h3>2.4 Competitive advantage and strategic information systems<\/h3>\n<p><strong>Competitive advantage<\/strong> — an advantage in cost, quality or speed. <strong>Porter's five forces:<\/strong> new entrants, suppliers, customers, substitutes, rivalry. <strong>Porter's value chain:<\/strong> primary (inbound logistics, operations, outbound logistics, marketing and sales, services) and support activities (infrastructure, HR, product/technology development, procurement).\n<strong>Strategies:<\/strong> cost leadership, differentiation, innovation, operational effectiveness, customer orientation.\n<strong>Business–IT alignment<\/strong> — IT strategy integrated with business strategy; characteristics of excellent alignment and ways to improve it (see answers).<\/p>\n<p><strong>Key points:<\/strong> process definition and examples · BPR/BPI/BPM · pressures and responses · five forces · value chain · five strategies · alignment.<\/p>", "3": "<p>Data is a critical organisational asset, but data grows rapidly, is scattered across systems and changes constantly. Good data and knowledge management turns it into reliable information and shared know-how.<\/p>\n<h3>3.1 Managing data<\/h3>\n<p><strong>Difficulties:<\/strong> data grows exponentially, is scattered and collected by many people and methods, comes from internal, personal and external sources, degrades over time, is subject to security and quality issues, and arrives in many formats. <strong>Data governance<\/strong> sets policies for data handling; <strong>master data management<\/strong> keeps key entities consistent.<\/p>\n<h3>3.2 The database approach<\/h3>\n<p>A database is a group of logically related files that stores data and the associations among them, managed by a <strong>DBMS<\/strong>. It minimises data <strong>redundancy<\/strong>, <strong>isolation<\/strong> and <strong>inconsistency<\/strong>, and maximises <strong>security<\/strong>, <strong>integrity<\/strong> and <strong>independence<\/strong>. The relational model uses tables (entities), rows (records) and columns (attributes) linked by primary and foreign keys.<\/p>\n<h3>3.3 Big Data<\/h3>\n<p>Diverse, high-volume, high-velocity data that traditional databases cannot handle — characterised by volume, velocity, variety, veracity, value. Sources: social media, sensors/IoT, clickstreams, transactions. Uses: customer insight, new products, operations, risk management. Technologies: Hadoop, NoSQL, cloud.<\/p>\n<h3>3.4 Data warehouses and data marts<\/h3>\n<p>A <strong>data warehouse<\/strong> is a repository of historical data organised by subject to support decision-makers (organised by business dimension, integrated, time-variant, non-volatile, multidimensional, relational). A <strong>data mart<\/strong> is a low-cost, scaled-down warehouse for a department. Environment: sources → ETL → storage → metadata → governance → users.<\/p>\n<h3>3.5 Knowledge management<\/h3>\n<p><strong>Knowledge management<\/strong> helps organisations manipulate important knowledge (explicit and tacit). <strong>KMS<\/strong> use IT to systematise and share best practices. <strong>KM cycle:<\/strong> create → capture → refine → store → manage → disseminate. Benefits: best practices available to all, better performance and customer service, retained expertise.<\/p>\n<p><strong>Key points:<\/strong> data difficulties · database approach goals · Big Data Vs · DW characteristics · data mart · tacit/explicit · KM cycle.<\/p>", "4": "<p>Smartphones, wireless networks and connected sensors have made computing mobile and everywhere. Businesses now reach customers anytime, anywhere, and machines communicate with each other through the Internet of Things.<\/p>\n<h3>4.1 Wireless technologies<\/h3>\n<p><strong>Devices:<\/strong> smartphones, tablets, wearables. <strong>Transmission media:<\/strong> microwave (line of sight), satellite (GEO, MEO, LEO — e.g. LEO broadband constellations), radio, infrared.<\/p>\n<h3>4.2 Wireless computer networks and Internet access<\/h3>\n<ul>\n<li><strong>Short-range:<\/strong> Bluetooth, ultra-wideband (UWB), NFC.<\/li>\n<li><strong>Medium-range:<\/strong> Wi-Fi (802.11), mesh networks.<\/li>\n<li><strong>Wide-area:<\/strong> cellular (3G/4G/5G), WiMAX.\nIssues: security of Wi-Fi, coverage, bandwidth.<\/li>\n<\/ul>\n<h3>4.3 Mobile computing and mobile commerce<\/h3>\n<p><strong>Mobile computing<\/strong> — real-time connection between a mobile device and computing environments; attributes <strong>mobility<\/strong> and <strong>broad reach<\/strong> → ubiquity, convenience, instant connectivity, personalisation, localisation.\n<strong>M-commerce<\/strong> drivers: smartphones, no need for a PC, mobile culture, falling prices, bandwidth, mobile payments.\n<strong>Applications:<\/strong> location-based services, mobile financial services (mobile banking, wallets, QR payments), mobile advertising, mobile entertainment, telemetry, healthcare.<\/p>\n<h3>4.4 Internet of Things (IoT)<\/h3>\n<p>A system in which any object, natural or manufactured, has a unique identity and can send and receive information over a network without human interaction. Enablers: RFID, sensors, wireless networks, cloud. Examples: smart homes, smart meters, connected cars, wearables, supply-chain tracking, predictive maintenance, smart agriculture. Concerns: security, privacy, standards, data volume.<\/p>\n<p><strong>Key points:<\/strong> media types · short/medium/wide-range networks · mobile attributes and drivers · m-commerce apps · IoT definition, examples, concerns.<\/p>", "5": "<p>The web has changed from static pages that people only read into an interactive space where users create and share content. Businesses use this social computing for selling, marketing, customer service and human resources.<\/p>\n<h3>5.1 Web 2.0<\/h3>\n<p>Web 1.0 offered static, read-only content. <strong>Web 2.0<\/strong> (Tim O'Reilly) is a loose collection of information technologies and applications plus the websites that use them, which encourage <strong>user participation, collaboration and sharing<\/strong>.\n<strong>Technologies:<\/strong> AJAX, tagging, RSS, blogs, microblogs, wikis. <strong>Websites:<\/strong> social networking, enterprise social networks, mashups.<\/p>\n<h3>5.2 Fundamentals of social computing in business<\/h3>\n<p><strong>Social computing<\/strong> facilitates social interactions and user-generated information. <strong>Social commerce<\/strong> is e-commerce delivered via social computing. Benefits: recommendations, customer feedback, lower marketing cost, crowdsourcing. Risks: negative reviews, privacy, fake content, information security, loss of control.<\/p>\n<h3>5.3 Applications<\/h3>\n<ul>\n<li><strong>Shopping:<\/strong> ratings and reviews, social recommendations, group shopping, shopping communities, social marketplaces, peer-to-peer shopping.<\/li>\n<li><strong>Marketing:<\/strong> social advertising, viral marketing, market research via listening and sentiment analysis.<\/li>\n<li><strong>Customer relationship management:<\/strong> customers use social media for service; firms respond quickly → social CRM.<\/li>\n<li><strong>Human resource management:<\/strong> recruiting on LinkedIn and social networks, onboarding, employee development, collaboration via enterprise social networks.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> Web 1.0 vs 2.0 · Web 2.0 technologies · social commerce benefits/risks · four application areas.<\/p>", "6": "<p>Inside every organisation, systems record transactions, support each department and integrate the whole business. ERP systems in particular break down information silos.<\/p>\n<h3>6.1 Transaction processing systems (TPS)<\/h3>\n<p>A TPS supports the monitoring, collection, storage and processing of data from basic business transactions. Characteristics: high volume, avoids errors, high security, fault tolerance, audit trail. Modes: batch vs online (OLTP). Source-data automation (barcodes, scanners) reduces errors.<\/p>\n<h3>6.2 Functional-area information systems<\/h3>\n<p>Provide information to managers in functional areas:<\/p>\n<ul>\n<li><strong>Accounting and finance:<\/strong> financial planning and budgeting, managing transactions, investments, control and auditing.<\/li>\n<li><strong>Marketing:<\/strong> customer data, product, pricing, promotion, sales analysis.<\/li>\n<li><strong>Production/operations:<\/strong> in-house logistics and materials management, planning production (MRP, MRP II, JIT), CAD/CAM, product lifecycle management.<\/li>\n<li><strong>Human resources:<\/strong> recruitment, development, payroll, benefits.\n<strong>Reports:<\/strong> routine, ad-hoc (on-demand), drill-down, key-indicator, comparative, exception reports.<\/li>\n<\/ul>\n<h3>6.3 Enterprise resource planning (ERP) systems<\/h3>\n<p>ERP integrates functional areas around a common database. <strong>Core modules:<\/strong> financial management, operations management, human resource management. <strong>Extended modules:<\/strong> CRM, SCM, business analytics, e-business. <strong>Benefits:<\/strong> flexibility, better decisions, quality and efficiency, lower costs. <strong>Limitations:<\/strong> complexity, cost, rigid \"best practices\", implementation risk. <strong>Implementation:<\/strong> on-premise (vanilla, custom, best-of-breed) or SaaS ERP.<\/p>\n<h3>6.4 ERP support for business processes<\/h3>\n<ul>\n<li><strong>Procurement (purchase to pay):<\/strong> requisition → PO → goods receipt → invoice → payment.<\/li>\n<li><strong>Fulfilment (order to cash):<\/strong> sales order → stock check → shipment → invoice → payment.<\/li>\n<li><strong>Production (plan to produce):<\/strong> forecast → MRP → production order → finished goods.\nERP also supports <strong>inter-organisational processes<\/strong> with suppliers and customers, and reporting.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> TPS characteristics · functional IS by department · report types · ERP modules, pros/cons · three cross-functional processes.<\/p>", "7": "<p>Keeping customers loyal and getting products to them efficiently are two of the biggest sources of competitive advantage. CRM and SCM systems support these goals.<\/p>\n<h3>7.1 Defining customer relationship management<\/h3>\n<p>CRM is a customer-focused, customer-driven organisational strategy to build long-term, profitable relationships. <strong>Customer touch points:<\/strong> store visits, phone, email, website, chat, social media, apps. <strong>Data consolidation<\/strong> gives a 360° view of the customer.<\/p>\n<h3>7.2 Operational CRM systems<\/h3>\n<ul>\n<li><strong>Customer-facing:<\/strong> customer service and support, sales force automation, marketing, campaign management.<\/li>\n<li><strong>Customer-touching:<\/strong> search and comparison, technical/self-service, personalised web pages, FAQs, email and automated response, loyalty programmes.<\/li>\n<\/ul>\n<h3>7.3 Other types of CRM systems<\/h3>\n<p><strong>Analytical CRM<\/strong> (analyse customer data) · <strong>on-demand/SaaS CRM<\/strong> · <strong>mobile CRM<\/strong> · <strong>open-source CRM<\/strong> · <strong>social CRM<\/strong> · <strong>real-time CRM<\/strong>.<\/p>\n<h3>7.4 Supply chains<\/h3>\n<p>The flow of materials, information, money and services from raw-material suppliers through factories and warehouses to end customers. Segments: <strong>upstream, internal, downstream<\/strong>. Flows: materials, information, financial. Structure: tiers of suppliers.<\/p>\n<h3>7.5 Supply chain management (SCM)<\/h3>\n<p>Plans, organises and optimises supply-chain activities. <strong>Push vs pull<\/strong> models; problems: uncertainty, the <strong>bullwhip effect<\/strong>, poor coordination. Solutions: vertical integration, buffer inventory, information sharing, <strong>vendor-managed inventory<\/strong>.<\/p>\n<h3>7.6 IT support for SCM<\/h3>\n<p><strong>EDI<\/strong>, <strong>extranets<\/strong> (company-centred, industry, joint-venture), <strong>portals<\/strong> (procurement and distribution), RFID and barcodes, ERP/SCM software, analytics, cloud collaboration.<\/p>\n<p><strong>Key points:<\/strong> CRM definition and touch points · operational CRM parts · other CRM types · supply-chain segments and flows · push/pull · bullwhip · IT support.<\/p>", "8": "<p>Managers make decisions every day, often under time pressure and uncertainty. Business analytics uses data and models to support these decisions.<\/p>\n<h3>8.1 Managers and decision-making<\/h3>\n<p>Managerial roles (Mintzberg): interpersonal, informational, decisional. <strong>Decision process (Simon):<\/strong> intelligence → design → choice → implementation. Decision types: structured, semi-structured, unstructured; operational, tactical, strategic. IT support is needed because alternatives are many, time is short, decisions are complex and data must come from many sources.<\/p>\n<h3>8.2 The business analytics process<\/h3>\n<p>Business analytics (BA) develops actionable recommendations from insights generated by historical data. Process: identify the problem → access and prepare data (warehouse, data marts) → analyse with descriptive, predictive and prescriptive methods → present results → act and evaluate.<\/p>\n<h3>8.3 Descriptive analytics<\/h3>\n<p>\"What happened?\" — online analytical processing, data mining, decision-support systems, reports, dashboards.<\/p>\n<h3>8.4 Predictive analytics<\/h3>\n<p>\"What will happen?\" — statistical forecasting, data mining, machine learning, text mining, predictive models (churn, demand, credit risk).<\/p>\n<h3>8.5 Prescriptive analytics<\/h3>\n<p>\"What should we do?\" — optimisation, simulation, decision trees, recommendation engines (pricing, scheduling, routing).<\/p>\n<h3>8.6 Presentation tools<\/h3>\n<p>Dashboards (with capabilities like drill-down, KPIs, status access, trend analysis, exception reporting) · data visualisation · geographic information systems · reality mining.<\/p>\n<p><strong>Key points:<\/strong> Simon's model · decision types · BA process · three analytics types with examples · presentation tools.<\/p>", "9": "<p>Instead of buying and running their own servers, organisations can rent computing power and software over the Internet. Cloud computing has changed how IT is delivered and paid for.<\/p>\n<h3>9.1 Cloud computing basics<\/h3>\n<p><strong>Definition (NIST):<\/strong> on-demand network access to a shared pool of configurable computing resources that can be rapidly provisioned and released with minimal management effort. <strong>Characteristics:<\/strong> on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service. Evolution: mainframes → client/server → cloud; server farms and virtualisation are its foundations.<\/p>\n<h3>9.2 Types of clouds<\/h3>\n<p>Public · private · hybrid · vertical/community.<\/p>\n<h3>9.3 Cloud services<\/h3>\n<p><strong>IaaS<\/strong> (infrastructure), <strong>PaaS<\/strong> (platform), <strong>SaaS<\/strong> (software) — differing in what the customer vs the provider manages.<\/p>\n<h3>9.4 Benefits<\/h3>\n<p>Make individuals more productive, facilitate collaboration, reduce costs (CAPEX → OPEX), scalability, faster time to market, access anywhere, disaster recovery.<\/p>\n<h3>9.5 Concerns and risks<\/h3>\n<p>Legacy IT systems, cost, reliability, privacy, security, regulatory and legal risks, vendor lock-in, dependence on Internet connectivity.<\/p>\n<h3>9.6 The \"Big Three\" cloud vendors<\/h3>\n<p><strong>Amazon Web Services<\/strong>, <strong>Microsoft Azure<\/strong>, <strong>Google Cloud Platform<\/strong>.<\/p>\n<h3>9.7 Web services and service-oriented architecture<\/h3>\n<p>Web services use standards (XML, SOAP, WSDL, UDDI, REST/JSON) to let applications communicate. <strong>SOA<\/strong> builds applications from reusable, loosely coupled services.<\/p>\n<p><strong>Key points:<\/strong> NIST definition · five characteristics · four cloud types · three services · benefits and risks · Big Three · SOA.<\/p>"}, "qa": [{"id": "IT245-01", "t": "Information system: definition, components, types", "u": 1, "q": "Define information system. List its components and explain any three types of information system.", "m": 3, "p": "High", "ty": "Definition/types", "seen": {"E25": "A1, B11", "M": "A1"}, "rep": true, "src": "2025 exam A1, B11; TU model question A1", "a": "<p>An <strong>information system (IS)<\/strong> collects, processes, stores, analyses and disseminates information for a specific purpose. A <strong>computer-based information system (CBIS)<\/strong> uses computer technology.<\/p>\n<p><strong>Components:<\/strong> hardware · software · data/database · network · procedures · people.<\/p>\n<p><strong>Types (by organisational level / breadth of support)<\/strong><\/p>\n<ol>\n<li><strong>Transaction Processing System (TPS):<\/strong> records routine business transactions (sales, payroll, bank deposits) — operational level.<\/li>\n<li><strong>Management Information System (MIS) / functional-area IS:<\/strong> summarises TPS data into routine reports for middle managers (monthly sales by region).<\/li>\n<li><strong>Decision Support System (DSS) / business analytics:<\/strong> interactive models for semi-structured decisions (what-if pricing).<\/li>\n<li><strong>Executive Information System (EIS) / dashboards:<\/strong> top-level KPIs for strategic decisions.<\/li>\n<li><strong>Enterprise Resource Planning (ERP):<\/strong> integrates all functional areas.<\/li>\n<li><strong>Expert systems / AI:<\/strong> capture expert knowledge.<\/li>\n<li><strong>Office automation systems<\/strong>; <strong>inter-organisational systems<\/strong> (SCM, EDI).<\/li>\n<\/ol>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 134\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Strategic: EIS / dashboards<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Tactical: MIS, DSS, business analytics<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Operational: TPS<\/text><\/svg><\/div>"}, {"id": "IT245-02", "t": "Impact of IT on organisations; importance to society", "u": 1, "q": "How does IT impact organisations? Explain the importance of IS to society.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "C17"}, "rep": false, "src": "TU model question C17", "a": "<p><strong>Impacts of IT on organisations<\/strong><\/p>\n<ol>\n<li><strong>Flatter structure<\/strong> — IT reduces the number of middle managers needed; wider span of control.<\/li>\n<li><strong>Changes in managers' jobs<\/strong> — faster, data-driven decisions; remote supervision.<\/li>\n<li><strong>Job changes<\/strong> — some jobs eliminated by automation, new IT jobs created.<\/li>\n<li><strong>Improved efficiency and productivity<\/strong> — automation of processes.<\/li>\n<li><strong>New business models<\/strong> (e-commerce, platforms) and competitive strategies.<\/li>\n<li><strong>Collaboration<\/strong> — virtual teams, cloud tools.<\/li>\n<li><strong>Health and safety<\/strong> — ergonomics, stress, information overload.<\/li>\n<li><strong>Privacy and security challenges.<\/strong><\/li>\n<\/ol>\n<p><strong>Importance to society:<\/strong> better quality of life (e-health, e-learning, e-government), new jobs and opportunities for people with disabilities, but also job displacement, privacy loss and the digital divide.<\/p>"}, {"id": "IT245-03", "t": "Business process, BPR, BPM; relation with IS", "u": 2, "q": "What is the relationship between business process and information system? Explain the steps of business process reengineering (BPR).", "m": 3, "p": "High", "ty": "Process", "seen": {"E25": "B12", "M": "B11"}, "rep": true, "src": "2025 exam B12; TU model question B11", "a": "<p>A <strong>business process<\/strong> is an ongoing collection of related activities that create a product or service of value to customers (e.g. order fulfilment, loan approval). <strong>Relationship:<\/strong> IS <strong>executes<\/strong> process steps (automation), <strong>captures and stores<\/strong> process data, <strong>monitors<\/strong> process performance, and <strong>enables redesign<\/strong> of processes; conversely, process requirements determine what an IS must do.<\/p>\n<p><strong>Business Process Reengineering (BPR)<\/strong> — fundamental, radical redesign of processes to achieve dramatic improvements (Hammer &amp; Champy).<\/p>\n<p><strong>Steps<\/strong><\/p>\n<ol>\n<li><strong>Set objectives / vision<\/strong> — identify the process to redesign.<\/li>\n<li><strong>Map and analyse the existing (\"as-is\") process<\/strong> — find bottlenecks and non-value activities.<\/li>\n<li><strong>Benchmark and identify IT enablers.<\/strong><\/li>\n<li><strong>Design the new (\"to-be\") process<\/strong> — from scratch.<\/li>\n<li><strong>Build a prototype / pilot.<\/strong><\/li>\n<li><strong>Implement<\/strong> — with change management and training.<\/li>\n<li><strong>Monitor and evaluate<\/strong> results.<\/li>\n<\/ol>\n<p><strong>BPI<\/strong> (business process improvement) is incremental (Six Sigma); <strong>BPM<\/strong> (business process management) is the continuous management approach combining BPR and BPI with tools such as BPMN and workflow systems.<\/p>"}, {"id": "IT245-04", "t": "Business pressures, organisational responses, IT support", "u": 2, "q": "Explain business pressures, organisational responses and IT support.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Business pressures:<\/strong> <em>market<\/em> (globalisation, changing workforce, powerful customers) · <em>technology<\/em> (innovation and obsolescence, information overload) · <em>societal/political/legal<\/em> (social responsibility, compliance, terrorism and protection against cyber attacks, ethics).<\/p>\n<p><strong>Organisational responses supported by IT<\/strong><\/p>\n<ul>\n<li><strong>Strategic systems<\/strong> for competitive advantage.<\/li>\n<li><strong>Customer focus<\/strong> — CRM, personalisation.<\/li>\n<li><strong>Make-to-order and mass customisation<\/strong> (online configuration).<\/li>\n<li><strong>E-business and e-commerce.<\/strong><\/li>\n<li><strong>Process improvement<\/strong> (BPR, automation).<\/li>\n<li><strong>Compliance systems<\/strong> and security.<\/li>\n<\/ul>"}, {"id": "IT245-05", "t": "Competitive advantage; strategic IS; business–IT alignment", "u": 2, "q": "Explain strategic information systems, strategies for achieving competitive advantage, and business–IT alignment.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "A2", "M": "A2, D21"}, "rep": true, "src": "2025 exam A2; TU model question A2, D21", "a": "<p><strong>Competitive advantage:<\/strong> an advantage over competitors in some measure such as cost, quality or speed, leading to control of a market and above-average profits.\n<strong>Strategic information system (SIS):<\/strong> any IS that provides competitive advantage or helps achieve strategic goals (e.g. an airline's loyalty and booking system, Amazon's recommendation engine).<\/p>\n<p><strong>Porter's Competitive Forces Model<\/strong> — IT helps a firm counter the five forces: threat of new entrants (IT can raise entry barriers, though the Internet may lower them), supplier power (e-procurement), buyer power (loyalty programmes), substitutes (switching costs), rivalry.\n<strong>Porter's Value Chain<\/strong> — IT supports primary activities (inbound logistics, operations, outbound logistics, marketing and sales, service) and support activities (infrastructure, HR, technology, procurement).<\/p>\n<p><strong>Strategies for competitive advantage<\/strong><\/p>\n<ol>\n<li><strong>Cost leadership<\/strong> — lowest cost (Walmart's automated inventory).<\/li>\n<li><strong>Differentiation<\/strong> — unique products/services (Apple).<\/li>\n<li><strong>Innovation<\/strong> — new products or ways of doing business (online banking, mobile wallets).<\/li>\n<li><strong>Operational effectiveness<\/strong> — improve internal processes faster than rivals.<\/li>\n<li><strong>Customer orientation<\/strong> — make customers happy (personalised websites).\n<em>(Also: niche/focus, alliances, lock-in through switching costs.)<\/em><\/li>\n<\/ol>\n<p><strong>Business–IT alignment:<\/strong> tight integration of the IT function with the organisation's strategy, mission and goals.\n<strong>Characteristics of excellent alignment:<\/strong> IT is viewed as an engine of innovation · internal and external customers are the top priority · IT professionals rotate into business roles · clear, shared goals · IT staff understand how the company makes money · a vibrant, inclusive IT culture.\n<strong>How to improve alignment:<\/strong> organisational commitment, communication, joint planning, frameworks such as COBIT/ITIL.<\/p>"}, {"id": "IT245-06", "t": "Data management; database approach; DW vs database; data mart", "u": 3, "q": "Explain the database approach. Differentiate a data warehouse and a database. What is a data mart?", "m": 3, "p": "High", "ty": "Definitions", "seen": {"E25": "A3", "M": "A3"}, "rep": true, "src": "2025 exam A3; TU model question A3", "a": "<p><strong>Database approach:<\/strong> data stored centrally in an integrated database managed by a DBMS, minimising <strong>redundancy<\/strong>, <strong>inconsistency<\/strong> and <strong>isolation<\/strong>, while improving security, integrity and independence from applications.<\/p>\n<table>\n<thead>\n<tr>\n<th>Database (operational)<\/th>\n<th>Data warehouse<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Current, transactional data<\/td>\n<td>Historical, integrated data<\/td>\n<\/tr>\n<tr>\n<td>Supports day-to-day operations (OLTP)<\/td>\n<td>Supports analysis and decisions (OLAP)<\/td>\n<\/tr>\n<tr>\n<td>Normalised; frequent updates<\/td>\n<td>Denormalised; read-only (non-volatile)<\/td>\n<\/tr>\n<tr>\n<td>Application-oriented<\/td>\n<td>Subject-oriented<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Data mart:<\/strong> a small, low-cost warehouse designed for a strategic business unit or department (e.g. marketing data mart).<\/p>"}, {"id": "IT245-07", "t": "Big Data: characteristics; competitive advantage", "u": 3, "q": "Describe the characteristics of Big Data. How can companies use Big Data to gain competitive advantage?", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "B12, C18"}, "rep": false, "src": "TU model question B12, C18", "a": "<p><strong>Big Data:<\/strong> diverse, high-volume, high-velocity data sets too large or complex for traditional databases.<\/p>\n<p><strong>Characteristics (Vs):<\/strong> <strong>Volume<\/strong> (huge size) · <strong>Velocity<\/strong> (speed of generation, real-time streams) · <strong>Variety<\/strong> (structured, semi-structured, unstructured — text, images, sensor data) · <strong>Veracity<\/strong> (uncertain quality) · <strong>Value<\/strong> (useful insights) · <strong>Variability<\/strong>.<\/p>\n<p><strong>Using Big Data for competitive advantage<\/strong><\/p>\n<ul>\n<li><strong>Customer insights and personalisation<\/strong> — targeted offers, recommendations.<\/li>\n<li><strong>New products and services<\/strong> — data-driven innovation.<\/li>\n<li><strong>Operational efficiency<\/strong> — predictive maintenance, logistics optimisation.<\/li>\n<li><strong>Better, faster decisions<\/strong> — real-time analytics.<\/li>\n<li><strong>Risk management and fraud detection<\/strong> — banks and card companies.<\/li>\n<li><strong>Dynamic pricing<\/strong> — airlines and ride-hailing.<\/li>\n<li><strong>HR analytics<\/strong> — hiring and retention.\n<em>Example:<\/em> telecom operators analyse call and data-usage records to design packages and reduce churn.<\/li>\n<\/ul>"}, {"id": "IT245-08", "t": "Knowledge management: importance", "u": 3, "q": "What is the importance of knowledge management? Explain with example.", "m": 3, "p": "High", "ty": "Explanation + example", "seen": {"E25": "B13"}, "rep": false, "src": "2025 exam B13", "a": "<p><strong>Knowledge management (KM)<\/strong> is the process of creating, capturing, storing, sharing and applying an organisation's knowledge. Knowledge may be <strong>explicit<\/strong> (documented: manuals, reports) or <strong>tacit<\/strong> (in people's heads: experience, know-how).<\/p>\n<p><strong>KM cycle:<\/strong> create → capture → refine → store → manage → disseminate.<\/p>\n<p><strong>Importance<\/strong><\/p>\n<ul>\n<li>Prevents loss of knowledge when employees leave.<\/li>\n<li>Faster problem-solving and decision-making (reuse best practices).<\/li>\n<li>Innovation through shared ideas.<\/li>\n<li>Better customer service — consistent answers.<\/li>\n<li>Reduced training time and duplicated effort.<\/li>\n<li>Competitive advantage from intellectual capital.<\/li>\n<\/ul>\n<p><em>Example:<\/em> a bank's internal knowledge portal of FAQs, policies and solved customer cases lets new staff resolve customer queries quickly; consulting firms keep databases of past project reports to reuse.<\/p>"}, {"id": "IT245-09", "t": "Wireless technologies; short-range networks", "u": 4, "q": "Explain any three contemporary wireless technologies. What is a short-range wireless network?", "m": 3, "p": "High", "ty": "Explanation", "seen": {"E25": "B14", "M": "A4"}, "rep": true, "src": "2025 exam B14; TU model question A4", "a": "<p><strong>Wireless technologies<\/strong><\/p>\n<ol>\n<li><strong>Wi-Fi (IEEE 802.11)<\/strong> — medium-range wireless LAN; hotspots in offices, cafés, campuses.<\/li>\n<li><strong>Bluetooth<\/strong> — short-range (about 10 m) personal-area network for headsets, wearables, file transfer.<\/li>\n<li><strong>Cellular (4G LTE / 5G)<\/strong> — wide-area mobile networks; 5G gives very high speed and low latency for IoT and video.<\/li>\n<li><strong>NFC (Near-Field Communication)<\/strong> — a few centimetres; contactless payments, tap-to-pay cards.<\/li>\n<li><strong>RFID<\/strong> — tags read by radio; inventory and supply-chain tracking.<\/li>\n<li><strong>Satellite<\/strong> — global coverage, remote areas (e.g. Starlink-type broadband).<\/li>\n<li><strong>Ultra-wideband (UWB)<\/strong> — precise short-range positioning.<\/li>\n<\/ol>\n<p><strong>Short-range wireless networks<\/strong> connect devices within a small area (centimetres to tens of metres): <strong>Bluetooth, UWB, NFC<\/strong>. Medium-range: Wi-Fi, mesh networks. Wide-area: cellular, WiMAX, satellite.<\/p>"}, {"id": "IT245-10", "t": "Mobile computing & m-commerce; drivers", "u": 4, "q": "Define mobile commerce. What are the major drivers of mobile computing?", "m": 3, "p": "High", "ty": "Explanation", "seen": {"E25": "A4", "M": "B13"}, "rep": true, "src": "2025 exam A4; TU model question B13", "a": "<p><strong>Mobile computing<\/strong> — real-time connection between a mobile device and computing environments. Attributes: <strong>mobility<\/strong> and <strong>broad reach<\/strong>, giving ubiquity, convenience, instant connectivity, personalisation and localisation.\n<strong>Mobile commerce (m-commerce)<\/strong> — e-commerce transactions conducted through wireless mobile devices (shopping apps, mobile banking, wallet payments, ticket booking).<\/p>\n<p><strong>Drivers of mobile computing / m-commerce<\/strong><\/p>\n<ol>\n<li>Widespread availability of smartphones.<\/li>\n<li>No need for a PC.<\/li>\n<li>The \"cell-phone culture\" among youth.<\/li>\n<li>Declining prices of devices and data.<\/li>\n<li>Improvement in bandwidth (4G/5G).<\/li>\n<li>Mobile payment systems (wallets, QR).<\/li>\n<li>Apps and location-based services.<\/li>\n<\/ol>\n<p><strong>Applications:<\/strong> location-based services, mobile financial services, mobile advertising, mobile entertainment, telemedicine, telemetry.<\/p>"}, {"id": "IT245-11", "t": "Networking & mobile computing transforming business; IoT", "u": 4, "q": "'Advancement in networking technologies and mobile computing has transformed business in various areas.' Justify with examples. Define IoT with two benefits.", "m": 5, "p": "High", "ty": "Justify with examples", "seen": {"E25": "C20", "M": "C19"}, "rep": true, "src": "2025 exam C20; TU model question C19", "a": "<p><strong>Justification — areas transformed<\/strong><\/p>\n<ol>\n<li><strong>Banking and payments:<\/strong> mobile banking and wallets (eSewa, Khalti), QR payments — banking without branches.<\/li>\n<li><strong>Retail and e-commerce:<\/strong> shopping apps, location-based offers, mobile checkout.<\/li>\n<li><strong>Transport and logistics:<\/strong> ride-hailing (Pathao), real-time tracking of deliveries using GPS.<\/li>\n<li><strong>Marketing:<\/strong> mobile advertising, SMS/push notifications, social media.<\/li>\n<li><strong>Workplace:<\/strong> remote work, cloud collaboration, BYOD.<\/li>\n<li><strong>Healthcare:<\/strong> telemedicine, wearables monitoring health.<\/li>\n<li><strong>Education:<\/strong> online classes and learning apps.<\/li>\n<li><strong>Agriculture:<\/strong> SMS price alerts and advisory services for farmers.<\/li>\n<\/ol>\n<p><strong>Internet of Things (IoT):<\/strong> a system in which everyday objects (sensors, machines, vehicles, appliances) are connected to the Internet and can collect and exchange data without human intervention.\n<strong>Benefits for organisations:<\/strong> (1) <strong>asset tracking and supply chain<\/strong> — RFID/GPS sensors track inventory and shipments in real time; (2) <strong>predictive maintenance<\/strong> — machine sensors warn before breakdowns; also smart energy management, smart retail shelves, connected healthcare.<\/p>"}, {"id": "IT245-12", "t": "Web 2.0; social computing; social shopping/commerce", "u": 5, "q": "What is Web 2.0? How is it an enhancement over Web 1.0? What are the benefits and risks of social commerce?", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "A5", "M": "A5, A6, C20"}, "rep": true, "src": "2025 exam A5; TU model question A5, A6, C20", "a": "<p><strong>Web 1.0<\/strong> — static, read-only pages created by a few publishers. <strong>Web 2.0<\/strong> — the interactive, participatory web where users create and share content.\n<strong>Enhancements of Web 2.0:<\/strong> user-generated content · two-way interaction and collaboration · rich internet applications (AJAX) · social networking · tagging, blogs, wikis, mashups · web as a platform (cloud apps).<\/p>\n<p><strong>Social computing:<\/strong> computing that facilitates social interaction and user-generated content; it puts power in the hands of customers.<\/p>\n<p><strong>Social commerce:<\/strong> the delivery of e-commerce activities through social computing. <strong>Social shopping:<\/strong> using social networks to help customers shop — ratings and reviews, recommendations, group buying, shopping communities, social marketplaces (Facebook Marketplace).<\/p>\n<p><strong>Benefits — to customers:<\/strong> better recommendations, community support, quick feedback. <strong>To businesses:<\/strong> viral marketing, low-cost advertising, customer insights, increased sales and loyalty, crowdsourcing ideas.\n<strong>Risks:<\/strong> negative reviews and complaints spreading quickly, privacy and security issues, fake reviews, loss of control over content, intellectual-property theft, legal risks, cost of managing social channels.<\/p>"}, {"id": "IT245-13", "t": "Social computing in HRM (and marketing, CRM)", "u": 5, "q": "Explain the concept of social computing in human resource management.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"E25": "B15, D21.3"}, "rep": false, "src": "2025 exam B15, D21.3", "a": "<p>Social computing changes how organisations recruit, develop and engage employees:<\/p>\n<ol>\n<li><strong>Recruitment:<\/strong> job postings on LinkedIn and Facebook; searching candidates' professional profiles; employee referrals through social networks.<\/li>\n<li><strong>Employer branding:<\/strong> showcasing company culture on social media to attract talent.<\/li>\n<li><strong>Onboarding and training:<\/strong> internal social platforms, video tutorials, wikis.<\/li>\n<li><strong>Collaboration and engagement:<\/strong> enterprise social networks (Microsoft Teams, Slack, Yammer) for communication and recognition.<\/li>\n<li><strong>Knowledge sharing:<\/strong> discussion forums and communities of practice.<\/li>\n<li><strong>Feedback:<\/strong> polls, surveys and suggestions.\n<strong>Concerns:<\/strong> privacy, misuse of social profiles in hiring, discrimination risks.<\/li>\n<\/ol>\n<p><em>Social computing in marketing and CRM:<\/em> social advertising, social-media monitoring (sentiment analysis), and customers using social platforms for service — \"social CRM\".<\/p>"}, {"id": "IT245-14", "t": "TPS: definition and characteristics", "u": 6, "q": "Define transaction processing system. List its desirable characteristics.", "m": 3, "p": "High", "ty": "Definition/list", "seen": {"E25": "A6", "M": "A7"}, "rep": true, "src": "2025 exam A6; TU model question A7", "a": "<p>A <strong>TPS<\/strong> supports the monitoring, collection, storage and processing of data from an organisation's basic business transactions, generating data for other systems.<\/p>\n<p><strong>Desirable characteristics:<\/strong> handles high volumes efficiently · avoids errors (validation, data integrity) · reliable and fault-tolerant (backup and recovery) · fast response · maintains an audit trail · ensures privacy and security · processing is predictable and routine · ACID properties (atomic, consistent, isolated, durable).<\/p>\n<p><strong>Modes:<\/strong> batch processing vs online transaction processing (OLTP).<\/p>"}, {"id": "IT245-15", "t": "Functional-area information systems", "u": 6, "q": "List and explain functional-area information systems.", "m": 3, "p": "Medium", "ty": "List", "seen": {"E25": "A10"}, "rep": false, "src": "2025 exam A10", "a": "<ul>\n<li><strong>Accounting &amp; finance IS:<\/strong> budgeting, financial planning, investment management, auditing, managing assets.<\/li>\n<li><strong>Marketing IS:<\/strong> customer data, sales tracking, pricing, promotion, market research.<\/li>\n<li><strong>Production/Operations management (POM) IS:<\/strong> inventory management, quality control, MRP/MRP II, JIT.<\/li>\n<li><strong>Human resource IS (HRIS):<\/strong> recruitment, payroll, performance, training, benefits.<\/li>\n<li><strong>Logistics IS.<\/strong>\nThey produce <strong>routine, ad-hoc, exception and drill-down reports<\/strong>.<\/li>\n<\/ul>"}, {"id": "IT245-16", "t": "ERP: definition, advantages, drawbacks; support for processes", "u": 6, "q": "Define ERP. How does ERP support business processes? Identify its advantages and drawbacks.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "C17", "M": "D22"}, "rep": true, "src": "2025 exam C17; TU model question D22", "a": "<p><strong>Enterprise Resource Planning (ERP)<\/strong> systems integrate the planning, management and use of all of an organisation's resources by tightly integrating functional areas (finance, HR, production, sales, procurement) around a <strong>common database<\/strong>. They break down <strong>information silos<\/strong>. Examples: SAP S/4HANA, Oracle ERP, Microsoft Dynamics, Odoo.<\/p>\n<p><strong>Core modules:<\/strong> financial management · operations management · human resource management; <strong>extended modules:<\/strong> CRM, SCM, business analytics, e-business.<\/p>\n<p><strong>How ERP supports business processes (with example)<\/strong><\/p>\n<ul>\n<li><strong>Procurement process<\/strong> (purchase to pay): requisition → purchase order → goods receipt → invoice → payment — data flows automatically between purchasing, inventory and accounts.<\/li>\n<li><strong>Fulfilment process<\/strong> (order to cash): sales order → inventory check → shipping → invoice → payment receipt.<\/li>\n<li><strong>Production process<\/strong> (plan to produce): demand → MRP → production order → finished goods.\n<em>Example:<\/em> when a sales clerk enters an order, ERP immediately reserves stock, updates the production plan, informs the warehouse and creates the invoice in accounting — no re-entry of data.<\/li>\n<\/ul>\n<p><strong>Advantages:<\/strong> organisational flexibility and agility · real-time, accurate information for decisions · quality and efficiency (standardised best-practice processes) · reduced cost and redundancy · better customer service · easier compliance and reporting.\n<strong>Drawbacks:<\/strong> very expensive and time-consuming to implement · business processes must change to fit the software (\"best practices\" may not suit the firm) · complexity and risk of implementation failure · dependence on the vendor · training needs and employee resistance · customisation is costly and complicates upgrades.<\/p>\n<p><strong>Implementation options:<\/strong> on-premise vs SaaS ERP (cloud).<\/p>"}, {"id": "IT245-17", "t": "CRM: definition; operational & other types; touch points", "u": 7, "q": "Define CRM and customer touch points. Explain operational CRM and other types of CRM systems.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {"M": "A8"}, "rep": false, "src": "TU model question A8", "a": "<p><strong>CRM (Customer Relationship Management):<\/strong> a customer-focused and customer-driven organisational strategy to build long-term, profitable relationships with customers, supported by IS.\n<strong>Customer touch point:<\/strong> any interaction between a customer and the organisation — traditional (phone, mail, store visit) and digital (website, email, chat, social media, app).<\/p>\n<p><strong>Operational CRM<\/strong> supports front-office processes that interact directly with customers:<\/p>\n<ul>\n<li><strong>Customer-facing applications:<\/strong> customer service and support (call centres, web self-service, FAQs), sales force automation (SFA), marketing (campaign management, cross-selling, upselling), campaign management.<\/li>\n<li><strong>Customer-touching applications:<\/strong> used directly by customers — search and comparison, technical/self-service, personalised web pages, FAQs, email and automated response, loyalty programmes.<\/li>\n<\/ul>\n<p><strong>Analytical CRM:<\/strong> analyses customer data (from operational CRM and the data warehouse) to understand behaviour and segment customers.\n<strong>Other types:<\/strong> <strong>on-demand (SaaS) CRM<\/strong> (e.g. Salesforce), <strong>mobile CRM<\/strong>, <strong>open-source CRM<\/strong>, <strong>social CRM<\/strong>, <strong>real-time CRM<\/strong>.<\/p>"}, {"id": "IT245-18", "t": "SCM and IT support for SCM", "u": 7, "q": "What is supply chain management? 'SCM processes can be made efficient with the support of IT.' Justify.", "m": 5, "p": "High", "ty": "Justify", "seen": {"E25": "A7, C18", "M": "B14"}, "rep": true, "src": "2025 exam A7, C18; TU model question B14", "a": "<p>A <strong>supply chain<\/strong> is the flow of materials, information, money and services from raw-material suppliers through factories and warehouses to end customers. <strong>SCM<\/strong> plans, organises and optimises supply-chain activities to reduce cost and improve service. Three segments: <strong>upstream<\/strong> (suppliers), <strong>internal<\/strong> (production, packaging), <strong>downstream<\/strong> (distribution to customers). Problems include the <strong>bullwhip effect<\/strong> (demand distortion upstream) and uncertainty.<\/p>\n<p><strong>How IT makes SCM efficient (justification)<\/strong><\/p>\n<ol>\n<li><strong>EDI (Electronic Data Interchange):<\/strong> standard electronic exchange of orders and invoices — faster, fewer errors.<\/li>\n<li><strong>Extranets and B2B portals:<\/strong> share inventory and forecasts with partners.<\/li>\n<li><strong>ERP/SCM software:<\/strong> integrated planning — demand forecasting, MRP, procurement.<\/li>\n<li><strong>RFID and barcodes / IoT:<\/strong> real-time tracking of goods and inventory.<\/li>\n<li><strong>Vendor-managed inventory (VMI):<\/strong> suppliers monitor stock and replenish automatically.<\/li>\n<li><strong>Information sharing<\/strong> reduces the bullwhip effect.<\/li>\n<li><strong>GPS and logistics software:<\/strong> route optimisation, delivery tracking.<\/li>\n<li><strong>Analytics:<\/strong> forecasting, supplier performance.<\/li>\n<li><strong>Cloud collaboration and blockchain<\/strong> for transparency.\n<em>Example:<\/em> a retailer shares point-of-sale data with suppliers, who replenish automatically, cutting stock-outs and inventory costs (Walmart's Retail Link).<\/li>\n<\/ol>"}, {"id": "IT245-19", "t": "Managers and decisions; business analytics stages", "u": 8, "q": "Why do managers need IT support? Explain
