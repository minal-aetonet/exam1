ivated in startups? Also explain digital marketing and sales techniques.", "m": 10, "p": "High", "ty": "Multi-part long answer", "seen": {"M26": "Q8, Q20"}, "rep": false, "src": "TU Model Question 2026 Q8, Q20", "a": "<p><strong>1. Motivating employees in startups<\/strong><\/p>\n<ul>\n<li><strong>Shared vision and purpose<\/strong> — explain why the work matters.<\/li>\n<li><strong>Equity / ESOPs<\/strong> (employee stock options) where cash salaries are low.<\/li>\n<li><strong>Recognition and celebration<\/strong> of wins.<\/li>\n<li><strong>Autonomy and ownership<\/strong> of tasks.<\/li>\n<li><strong>Learning and growth<\/strong> opportunities.<\/li>\n<li><strong>Flexible working<\/strong> and good culture.<\/li>\n<li><strong>Fair pay and transparent communication.<\/strong>\nTheories that support this: Maslow's hierarchy, Herzberg's two-factor theory (motivators vs hygiene factors).<\/li>\n<\/ul>\n<p><strong>2. Digital marketing<\/strong> — promoting products through digital channels:<\/p>\n<ul>\n<li>Search engine optimisation (SEO) and search ads (SEM)<\/li>\n<li>Social media marketing (Facebook, Instagram, TikTok, LinkedIn)<\/li>\n<li>Content marketing (blogs, videos)<\/li>\n<li>Email marketing<\/li>\n<li>Influencer and affiliate marketing<\/li>\n<li>Analytics to measure clicks, conversions and CAC<\/li>\n<\/ul>\n<p><strong>3. Sales techniques<\/strong><\/p>\n<ul>\n<li><strong>Consultative selling:<\/strong> understand the customer's problem first.<\/li>\n<li><strong>Solution selling<\/strong> and product demos / free trials (freemium).<\/li>\n<li><strong>Sales funnel:<\/strong> Awareness → Interest → Decision → Action (AIDA).<\/li>\n<li><strong>Upselling and cross-selling.<\/strong><\/li>\n<li><strong>Referral programmes.<\/strong><\/li>\n<li><strong>B2B:<\/strong> relationship building, proposals, follow-ups.<\/li>\n<\/ul>"}, {"id": "IT248-22", "t": "Role of CRM in startups", "u": 5, "q": "Explain the role of CRM in startups.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q16"}, "rep": false, "src": "TU Model Question 2026 Q16", "a": "<p><strong>Customer Relationship Management (CRM)<\/strong> is a strategy, supported by software, to manage interactions with current and potential customers.<\/p>\n<p><strong>Role in startups<\/strong><\/p>\n<ul>\n<li>Stores all customer data and interaction history in one place.<\/li>\n<li>Tracks leads through the sales pipeline.<\/li>\n<li>Personalises marketing and communication.<\/li>\n<li>Improves customer service through ticketing and quick responses.<\/li>\n<li>Increases retention and lifetime value.<\/li>\n<li>Provides analytics to understand customer behaviour.<\/li>\n<li>Automates follow-ups and emails, saving staff time.<\/li>\n<\/ul>\n<p>Examples of tools: HubSpot, Zoho CRM, Salesforce (and free tiers suited to small startups).<\/p>"}, {"id": "IT248-23", "t": "Brand building", "u": 5, "q": "How can a startup build its brand? Explain with reference to MakeMyTrip's marketing strategy.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Brand building<\/strong> creates a distinctive identity and positive perception in customers' minds.<\/p>\n<p><strong>Steps:<\/strong> define brand purpose and values → choose a name, logo and tone → deliver consistent quality → tell stories through content → engage the community → collect reviews.<\/p>\n<p><strong>MakeMyTrip (syllabus case) — main lessons:<\/strong> an early online-first model for travel booking, heavy digital marketing and search presence, offers and loyalty programmes, mobile-app focus, and expansion into hotels, buses and holiday packages to become a one-stop travel brand. The lesson for startups: combine strong digital marketing with trust (secure payments, customer support) and continuous product expansion.<\/p>"}, {"id": "IT248-24", "t": "Leadership styles in startups", "u": 6, "q": "Explain the leadership styles used in startups.", "m": 10, "p": "High", "ty": "List + explain", "seen": {"M26": "Q9, Q19"}, "rep": false, "src": "TU Model Question 2026 Q9, Q19", "a": "<p><strong>Leadership<\/strong> is the ability to influence and guide people towards goals. A <strong>leadership style<\/strong> is a leader's characteristic way of directing and motivating people.<\/p>\n<table>\n<thead>\n<tr>\n<th>Style<\/th>\n<th>Description<\/th>\n<th>When it suits a startup<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Visionary / transformational<\/strong><\/td>\n<td>Inspires with a big vision; encourages innovation<\/td>\n<td>Early stage, attracting talent and investors<\/td>\n<\/tr>\n<tr>\n<td><strong>Democratic / participative<\/strong><\/td>\n<td>Involves the team in decisions<\/td>\n<td>Creative product teams<\/td>\n<\/tr>\n<tr>\n<td><strong>Autocratic / directive<\/strong><\/td>\n<td>Leader decides alone<\/td>\n<td>Crisis, tight deadlines<\/td>\n<\/tr>\n<tr>\n<td><strong>Laissez-faire / delegative<\/strong><\/td>\n<td>High freedom to experts<\/td>\n<td>Experienced, self-driven developers<\/td>\n<\/tr>\n<tr>\n<td><strong>Transactional<\/strong><\/td>\n<td>Rewards and penalties for targets<\/td>\n<td>Sales teams<\/td>\n<\/tr>\n<tr>\n<td><strong>Servant<\/strong><\/td>\n<td>Leader serves the team's growth<\/td>\n<td>Building culture and loyalty<\/td>\n<\/tr>\n<tr>\n<td><strong>Coaching<\/strong><\/td>\n<td>Develops individual skills<\/td>\n<td>Junior teams<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Conclusion:<\/strong> successful founders adapt their style (<em>situational leadership<\/em>) as the startup grows from a small team to a structured company.<\/p>"}, {"id": "IT248-25", "t": "Building teams, conflict resolution, networking", "u": 6, "q": "Explain conflict-resolution techniques within a team.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q17"}, "rep": false, "src": "TU Model Question 2026 Q17", "a": "<p>Conflict is natural in startups because of pressure and limited resources. The <strong>Thomas–Kilmann<\/strong> model gives five approaches:<\/p>\n<ol>\n<li><strong>Collaborating (win–win):<\/strong> work together to find a solution that satisfies everyone. Best for important issues.<\/li>\n<li><strong>Compromising:<\/strong> each side gives up something.<\/li>\n<li><strong>Accommodating:<\/strong> one side yields to preserve the relationship.<\/li>\n<li><strong>Competing / forcing:<\/strong> one side imposes its view; used in emergencies.<\/li>\n<li><strong>Avoiding:<\/strong> postpone minor issues.<\/li>\n<\/ol>\n<p><strong>Practical steps:<\/strong> listen actively → identify the real issue → focus on interests, not positions → generate options → agree and follow up. Clear roles, regular one-to-ones and a transparent culture prevent many conflicts.<\/p>\n<p><strong>Networking skills:<\/strong> attending startup events, LinkedIn, alumni groups, mentors — networks bring customers, investors and talent.<\/p>"}, {"id": "IT248-26", "t": "CSR, sustainability, Tata case", "u": 6, "q": "What is corporate social responsibility (CSR)? Explain sustainability practices with reference to the Tata Group.", "m": 10, "p": "High", "ty": "Explanation + case", "seen": {"M26": "Q10"}, "rep": false, "src": "TU Model Question 2026 Q10", "a": "<p><strong>CSR<\/strong> is a company's commitment to operate ethically and contribute to social and environmental well-being beyond profit.<\/p>\n<p><strong>Carroll's CSR pyramid:<\/strong> economic → legal → ethical → philanthropic responsibilities.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 178\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Philanthropic: be a good corporate citizen<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Ethical: do what is right and fair<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Legal: obey the law<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Economic: be profitable<\/text><\/svg><\/div>\n\n<p><strong>Sustainability practices for IT firms:<\/strong> energy-efficient data centres and green computing, e-waste recycling, remote work to reduce commuting, digital-literacy programmes, inclusive hiring, data privacy.<\/p>\n<p><strong>Tata Group (syllabus case):<\/strong> a large share of Tata Sons' equity is held by philanthropic trusts, so profits fund education, health, rural development and research institutions. It is a well-known example of CSR built into ownership.<\/p>\n<p><strong>Nepal context:<\/strong> the <em>Industrial Enterprises Act, 2076<\/em> requires certain large industries to spend a portion of their profit on CSR — check the Act for the exact thresholds.<\/p>\n<p><strong>Benefits of CSR:<\/strong> reputation, customer loyalty, employee motivation, investor confidence, social licence to operate.<\/p>"}], "defs": [["Entrepreneurship", "Process of identifying opportunities and organising resources, while bearing risk, to create a new value-adding venture."], ["Entrepreneurship ecosystem", "Interconnected network of policy, finance, markets, talent, support organisations and culture that enables startups."], ["Startup", "A young company designed to find a repeatable, scalable business model."], ["MVP", "Minimum Viable Product — the simplest version that real users can use, built to validate learning."], ["Business Model Canvas", "One-page tool with nine building blocks describing how a business creates, delivers and captures value."], ["Target market", "The specific customer group a business chooses to serve."], ["Intellectual property rights", "Legal rights over creations of the mind: copyright, patent, trademark, trade secret."], ["Bootstrapping", "Funding a startup through founders' own savings and early revenue."], ["Angel investor", "An individual who invests personal money in early-stage startups for equity."], ["Venture capital", "Professionally managed funds investing in high-growth startups for equity."], ["Burn rate", "Net cash a startup spends per month."], ["CRM", "Customer Relationship Management: strategy and software for managing customer interactions."], ["Digital marketing", "Promotion of products through digital channels such as search, social media and email."], ["CSR", "Corporate Social Responsibility: a firm's ethical, social and environmental commitments beyond profit."], ["Leadership style", "A leader's characteristic pattern of guiding and motivating people."]], "revision": "<p><strong>IT 248 — one-page revision<\/strong><\/p>\n<ul>\n<li><strong>Unit 1:<\/strong> definition + importance · traits (vision, risk, persistence, creativity) · types · ecosystem (policy, finance, markets, talent, support, culture) · ICT role · e-Sewa/Khalti.<\/li>\n<li><strong>Unit 2 (heavy):<\/strong> creative techniques (brainstorming, mind map, SCAMPER, design thinking) · market needs · idea screening (desirable/feasible/viable) · trend analysis · prototype/MVP · STP · competitor analysis (SWOT, Porter, positioning map) · <strong>Pathao case<\/strong>.<\/li>\n<li><strong>Unit 3:<\/strong> BMC 9 blocks (CS, VP, CH, CR, R$, KR, KA, KP, C$) · revenue models · business-plan elements (10) · financial projections · risk responses (avoid, reduce, transfer, accept).<\/li>\n<li><strong>Unit 4:<\/strong> Companies Act 2063, Industrial Enterprises Act 2076, FITTA 2075, Labour Act 2074, ETA 2063, Privacy Act 2075 · IPR types · tax categories (PAN, VAT, income tax, TDS).<\/li>\n<li><strong>Unit 5 (heavy):<\/strong> funding sources ladder · budgeting, burn rate, runway · digital marketing channels · AIDA · CRM · branding (MakeMyTrip).<\/li>\n<li><strong>Unit 6:<\/strong> leadership styles table · team motivation · Thomas–Kilmann conflict modes · CSR pyramid · Tata case.<\/li>\n<\/ul>\n<p><strong>Model 2026 long-answer topics:<\/strong> funding sources · leadership styles · motivation + digital marketing + sales · ethical marketing + business-plan elements · ride-sharing case.<\/p>", "practice": ["[AI practice] Explain the entrepreneurship ecosystem of Nepal. What are its major weaknesses? (10)", "[AI practice] Differentiate between an entrepreneur and an intrapreneur. (5)", "[AI practice] Prepare a Business Model Canvas for an online pharmacy startup in Nepal. (10)", "[AI practice] What legal challenges do Nepali IT startups face? Suggest remedies. (5)", "[AI practice] Case: A Nepali edtech startup has run out of cash after 18 months. Analyse what went wrong and suggest funding and cash-flow strategies. (20)", "[AI practice] Explain design thinking as a tool for idea generation. (5)", "[AI practice] How does CSR create value for an IT company? (5)"], "checklist": ["I can define entrepreneurship and explain its importance", "I can list and explain 5 traits of entrepreneurs", "I can draw the ecosystem diagram", "I can explain 4 creative-thinking techniques", "I can draw and fill the Business Model Canvas", "I can list 10 elements of a business plan", "I can name the main Nepali laws for startups", "I can explain 6 funding sources with pros/cons", "I can explain CRM and digital marketing", "I can compare 5 leadership styles", "I can explain the 5 conflict-resolution modes", "I can answer the Pathao-type case in 4 parts"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025 (November 2025)", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question for BITM 1st and BBA BIM and BBM 8th Semester Final (Model Question 2026)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "MGT 236", "id": "MGT236", "title": "Business Environment in Nepal", "sem": 6, "exam": "2026-12-02", "official": "MGT 236: Business Environment (official NC title in the BIM 6th Semester Syllabus 2024)", "syllabus": "BIM 6th Semester Syllabus 2024 (TU FOM, Office of the Dean, dated October 2024) — 3 credit hours, 48 LH. Shared with BBM 6th semester (MGT 236).", "note": "DISCREPANCY: your routine says 'Business Environment in Nepal'. In the official NC syllabus and on the April 2025 NC paper the title is 'MGT 236: Business Environment'. 'Business Environment in Nepal' is the OLD-COURSE title (MGT 206); the TU Dec-2025 routine lists 'MGT 206 (OC) Business Environment in Nepal / MGT 236 (NC) Business Environment'. The code MGT 236 is correct for NC, and this guide follows the NC syllabus.", "marks": "Full Marks 100, Pass 50, 3 hrs. Group A 10×2=20 (all) · Group B 6×5=30 (any 6 of Q11–17) · Group C 3×10=30 (any 3 of Q18–21) · Group D case 4×5=20 (Q22 a–d). (April 2025 NC paper.)", "objectives": "Examine the firm-specific and general environmental forces that shape business, and develop analytical tools to scan and forecast them and solve business problems in the Nepalese context.", "units": [{"n": 1, "t": "Introduction and Framework of Business Environment", "lh": 4, "topics": "Components and classification of business environment; framework; environmental scanning — process, techniques, methods, types; emerging business environment in Nepal."}, {"n": 2, "t": "Firm-specific Environment", "lh": 4, "topics": "Scope; organisational structure and culture; role of culture in behaviour and performance; cultural alignment; operations management (production, capacity planning, supply chain and logistics, quality management); HRM."}, {"n": 3, "t": "(Unit 3a) Macroeconomic Environment", "lh": 12, "topics": "Economic dimensions of Nepal; employment and labour market; labour migration; development plans; performance of industry and agriculture; industrial, privatisation, trade, tourism and monetary policies; liberalisation and capital-market reforms; competitiveness; constitutional provisions on the economy."}, {"n": 4, "t": "(Unit 3b) Political-Legal Environment", "lh": 5, "topics": "Political structure of Nepal; business–government relations at federal, provincial and local levels; political risk; laws on start-ups, market regulation and competition; labour, finance, investment, IP, e-business and consumer-protection legislation."}, {"n": 5, "t": "(Unit 3c) Socio-cultural Environment", "lh": 5, "topics": "Changing marriage age; female education; family structure; social organisations; class structure; acculturation and assimilation; socio-cultural change and business impact."}, {"n": 6, "t": "(Unit 3d) Technology, Energy and Natural Environment", "lh": 4, "topics": "Status of technology and technology transfer in Nepal; IT policy; natural-environment issues; energy situation; environment and energy management; AI and the future of business in Nepal."}, {"n": 7, "t": "(Unit 3e) Global Environment and Nepalese Business", "lh": 6, "topics": "Regional groupings; SAARC, SAPTA, SAFTA, BIMSTEC and issues for Nepal; globalisation; FDI trends and reasons for low FDI; WTO membership."}, {"n": 8, "t": "(Unit 4) Business Support Agencies in Nepal", "lh": 8, "topics": "Department of Industry; Nepal Rastra Bank; Nepal Chamber of Commerce; TEPC; FNCCI; SCIDB; Nepal Trade Information Portal; Ministry of Labour, Employment and Social Security; Ministry of Industry, Commerce and Supplies."}], "avail": "<p><strong>Actual NC papers found: 1 (April 2025 regular).<\/strong> TU held a second NC sitting from 8 December 2025 (MGT 236 on 8 Dec 2025, per the published routine), but <strong>that paper could not be found<\/strong> in any repository searched — reported as <strong>unavailable<\/strong>.<\/p>\n<p>A second transcription of the 2025 paper (bimstudies.com) has <strong>identical Groups A–C<\/strong> but a <strong>different case<\/strong> (tea industry instead of tourism). The tea case closely matches the OC 2022 BITM/BIM Business Environment paper (NARC tea research), so the tourism case from the tupapers copy, which shows the official TU header, is treated as authentic. The bimstudies copy is labelled <strong>Category B<\/strong> and its case is shown only for reference.<\/p>\n<p>The TU BBM 6th-semester MGT 236 model question was found only in fragments (two Group A items and Q17), so it is listed as partial. Unit numbers 3–7 in this guide correspond to official sub-units 3a–3e; Unit 8 is official Unit 4.<\/p>", "pattern": "<p><strong>Question types (April 2025):<\/strong> definitions and \"name two\" items (Group A); describe/explain/justify (Group B); concept + analysis (Group C); a Nepal-based industry case with 4×5 sub-parts (Group D). <strong>No numericals.<\/strong> TU strongly prefers <strong>Nepal-specific<\/strong> answers: policies, institutions, FDI, energy and tourism.<\/p>\n<p><strong>Repeated concepts (model → exam):<\/strong> <em>environmental scanning<\/em> methods/techniques (model A1 → exam A1 and A3) and <em>business support agencies<\/em> (model Q17 SCIDB → exam Q16 TEPC and A9). These are the only cross-paper repetitions the evidence supports.<\/p>\n<p><strong>Weighting:<\/strong> the macro environment (official Unit 3, 32 of 48 LH) dominates — 15 of 22 questions in 2025. Expect FDI, energy, tourism, policies, SAFTA/WTO and political risk again in some form.<\/p>", "papers": [{"id": "E25", "label": "Apr 2025 exam", "cat": "A", "session": "April 2025, regular (BBM/BIM 6th sem, MGT 236)", "source": "tupapers.com mirror (shows TU FOM Office of the Dean header)", "url": "https://tupapers-com.pages.dev/course/bbm/sixth-semester/business-environment-in-nepal/business-environment-in-nepal-2025", "note": "Actual TU paper. The case text is summarised because it is long.", "qs": [{"no": "1", "g": "A", "t": "Define environment scanning.", "m": 2, "u": 1}, {"no": "2", "g": "A", "t": "Name two objectives of formulating fiscal policy.", "m": 2, "u": 3}, {"no": "3", "g": "A", "t": "List different techniques of environmental scanning.", "m": 2, "u": 1}, {"no": "4", "g": "A", "t": "Explain the term inflation.", "m": 2, "u": 3}, {"no": "5", "g": "A", "t": "Define acculturation.", "m": 2, "u": 5}, {"no": "6", "g": "A", "t": "Name two objectives of SAFTA.", "m": 2, "u": 7}, {"no": "7", "g": "A", "t": "Define political risk.", "m": 2, "u": 4}, {"no": "8", "g": "A", "t": "Name two key indicators of the macroeconomic environment.", "m": 2, "u": 3}, {"no": "9", "g": "A", "t": "List any four institutions that support business.", "m": 2, "u": 8}, {"no": "10", "g": "A", "t": "Name two advantages of WTO membership for Nepal.", "m": 2, "u": 7}, {"no": "11", "g": "B", "t": "Describe how task environment factors influence business.", "m": 5, "u": 1}, {"no": "12", "g": "B", "t": "Does political stability lead to business development? Justify.", "m": 5, "u": 4}, {"no": "13", "g": "B", "t": "Describe the social changes that influence business.", "m": 5, "u": 5}, {"no": "14", "g": "B", "t": "Describe the major legal provisions for starting a business.", "m": 5, "u": 4}, {"no": "15", "g": "B", "t": "Explain how capital market reforms affect Nepalese business.", "m": 5, "u": 3}, {"no": "16", "g": "B", "t": "Explain the functions of the Trade and Export Promotion Centre (TEPC), Nepal.", "m": 5, "u": 8}, {"no": "17", "g": "B", "t": "Discuss the various issues related to technology transfer.", "m": 5, "u": 6}, {"no": "18", "g": "C", "t": "Discuss the concept of business environment. How do economic development plans influence it?", "m": 10, "u": 1}, {"no": "19", "g": "C", "t": "FDI plays a vital role in economic development: explain its rationale and the reasons for its poor inflow into Nepal.", "m": 10, "u": 7}, {"no": "20", "g": "C", "t": "Highlight Nepal's energy situation. Analyse its opportunities and threats for Nepalese business.", "m": 10, "u": 6}, {"no": "21", "g": "C", "t": "Explain the major firm-specific business environment factors.", "m": 10, "u": 2}, {"no": "22", "g": "D", "t": "Case — tourism in Nepal (role in income, foreign exchange and poverty reduction; arrivals since 1964; Visit Nepal 1998, Nepal Tourism Year 2011, Visit Nepal 2020; post-2015 earthquake reconstruction; weak infrastructure, service quality, trained manpower, emergency and health services). (a) Major issues of the tourism industry (b) Prospects and challenges (c) Action plan for development (d) Does technology support tourism promotion? Explain.", "m": 20, "u": 3}]}, {"id": "B25", "label": "bimstudies '2025' copy", "cat": "B", "session": "Labelled 'BITM 6th Sem 2025' (page updated 7 Dec 2025)", "source": "bimstudies.com", "url": "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-environment-exam-question-solution-bitm-6th-sem-2025/", "note": "Groups A–C are identical to the April 2025 paper and are therefore not repeated (frequency is not double-counted). Only the differing case is listed.", "qs": [{"no": "22", "g": "D", "t": "Case — Tea industry in Nepal (exports, India's organic push, NARC research, trademark/logo, contamination, climate and labour issues). (a) Two components each of task and general environment (b) Opportunities and threats (c) Strategies to stay competitive under globalisation (d) Importance of innovation.", "m": 20, "u": 1}]}, {"id": "M", "label": "TU model (partial)", "cat": "C", "session": "TU FOM model question, BBM 6th semester MGT 236 (fragments only)", "source": "TU FOM 'Model Question for BBM 6th Smester.pdf' (search-snippet fragments; the full PDF could not be opened)", "url": "https://fomecd.edu.np/cms/dhurbas/Model%20Question%20for%20BBM%206th%20Smester.pdf", "note": "Only these items were legible in retrievable fragments.", "qs": [{"no": "1", "g": "A", "t": "Write two methods of environmental scanning.", "m": 2, "u": 1}, {"no": "2", "g": "A", "t": "Mention the impact of organisational culture on business.", "m": 2, "u": 2}, {"no": "17", "g": "B", "t": "Explain the role of the Small and Cottage Industry Development Board (SCIDB) in business development within Nepal.", "m": 5, "u": 8}]}], "notes": {"1": "<h3>1.1 Concept and components of business environment<\/h3>\n<p>Business environment = all internal and external factors that affect a firm. <strong>Components:<\/strong> internal (mission, structure, culture, resources) and external — <strong>micro/task<\/strong> (customers, suppliers, competitors, intermediaries, publics) and <strong>macro/general<\/strong> (economic, political-legal, socio-cultural, technological, natural, global).\n<strong>Nature:<\/strong> dynamic · complex · uncertain · interrelated · relative (differs by place).<\/p>\n<h3>1.2 Classification and framework<\/h3>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 178\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Global environment<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Macro: Economic · Political-legal · Socio-cultural · Technological · Natural<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Task: customers · suppliers · competitors · intermediaries · financiers<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Internal: mission · structure · culture · resources · HR<\/text><\/svg><\/div>\n\n<p><strong>Framework:<\/strong> inputs from the environment → business processes → outputs to the environment, with feedback; the firm adapts to (and sometimes shapes) its environment.<\/p>\n<h3>1.3 Environmental scanning<\/h3>\n<p>Monitoring the environment to identify opportunities and threats.\n<strong>Process:<\/strong> identify factors → gather information → analyse → forecast → link to strategy.\n<strong>Techniques:<\/strong> SWOT · PESTEL · ETOP · QUEST · Delphi · scenario building · trend extrapolation · benchmarking.\n<strong>Methods (Fahey &amp; King):<\/strong> irregular (ad hoc) · periodic (regular) · continuous (systematic).\n<strong>Types:<\/strong> internal and external scanning; <strong>uses:<\/strong> early warning, strategy formulation, risk reduction.<\/p>\n<h3>1.4 Emerging business environment in Nepal<\/h3>\n<p>Federal structure (three tiers of government) · liberalisation and private-sector growth · digital economy (wallets, e-commerce) · hydropower surplus and exports · remittance-based consumption · LDC graduation (scheduled 2026) · new investment laws (FITTA 2075, IEA 2076) · infrastructure (airports, roads) · political instability as a persistent risk.<\/p>\n<p><strong>Key points:<\/strong> components and nature · layered framework · scanning process, techniques, methods · emerging trends in Nepal.<\/p>", "2": "<h3>2.1 Scope of the firm-specific environment<\/h3>\n<p>Factors inside the firm that management controls: vision/mission, structure, culture, leadership, resources (human, financial, physical, technological), systems and processes, brand image.<\/p>\n<h3>2.2 Organisational structure and culture<\/h3>\n<p><strong>Structures:<\/strong> functional · divisional · matrix · team-based · network.\n<strong>Culture:<\/strong> shared values, beliefs and norms (Schein: artefacts, espoused values, basic assumptions). <strong>Types (Cameron &amp; Quinn):<\/strong> clan, adhocracy, market, hierarchy.<\/p>\n<h3>2.3 Role of culture in behaviour and performance; cultural alignment<\/h3>\n<p>A strong culture guides behaviour, builds commitment, reduces control costs and improves performance — <strong>if aligned<\/strong> with strategy and environment. <strong>Cultural alignment<\/strong> means values, practices and rewards support strategic goals (e.g. a customer-first culture in a bank). Misalignment causes resistance and poor execution.<\/p>\n<h3>2.4 Operations management<\/h3>\n<ul>\n<li><strong>Production management:<\/strong> planning and controlling conversion of inputs to outputs.<\/li>\n<li><strong>Capacity planning:<\/strong> matching capacity with demand (lead, lag, match strategies).<\/li>\n<li><strong>Supply chain and logistics:<\/strong> sourcing, inventory, transport, distribution.<\/li>\n<li><strong>Quality management:<\/strong> TQM, Six Sigma, ISO 9001, Kaizen.<\/li>\n<\/ul>\n<h3>2.5 Human resource management<\/h3>\n<p>HR planning · recruitment and selection · training and development · performance appraisal · compensation · labour relations · compliance with the Labour Act, 2074 and the Social Security Fund.<\/p>\n<p><strong>Key points:<\/strong> scope · five structures · culture levels/types · alignment · operations elements · HRM functions.<\/p>", "3": "<h3>3a.1 Economic dimensions of Nepal<\/h3>\n<p>Mixed, agriculture-dependent but services-dominated economy; large remittance inflows; persistent trade deficit (imports far exceed exports, India the largest partner); low industrial share; informal sector; inflation influenced by India.<\/p>\n<h3>3a.2 Employment and labour market; labour migration<\/h3>\n<p>High under-employment and youth unemployment; large informal employment; foreign labour migration to Gulf countries, Malaysia and India; remittances support consumption and foreign-exchange reserves but cause domestic labour shortages and a consumption-led import economy.<\/p>\n<h3>3a.3 Development plans<\/h3>\n<p>Periodic plans since 1956; the current <strong>16th Plan (FY 2081/82–2085/86)<\/strong> emphasises good governance, social justice and prosperity, with targets for growth, employment, infrastructure, energy and digital transformation. Plans guide public investment and priority sectors.<\/p>\n<h3>3a.4 Performance of industry and agriculture<\/h3>\n<p>Agriculture employs the largest share of workers but has low productivity (fragmented land, irrigation gaps, low mechanisation). Industry (manufacturing) contributes a small share of GDP and faces power, labour and competition problems; construction and hydropower are growing.<\/p>\n<h3>3a.5 Economic policies<\/h3>\n<ul>\n<li><strong>Industrial policy<\/strong> — promote private investment, SEZs, incentives, priority industries.<\/li>\n<li><strong>Privatisation policy<\/strong> (Privatisation Act, 2050) — methods: share sale, management contract, lease, liquidation.<\/li>\n<li><strong>Trade policy<\/strong> — export promotion, trade facilitation, reducing the trade deficit; Nepal Trade Integration Strategy.<\/li>\n<li><strong>Tourism policy<\/strong> — increase arrivals, length of stay and spending; diversification and branding.<\/li>\n<li><strong>Monetary policy<\/strong> — announced annually by NRB; interest-rate corridor, CRR, SLR, priority-sector lending.<\/li>\n<li><strong>Fiscal policy<\/strong> — the annual budget: taxation and expenditure.<\/li>\n<\/ul>\n<h3>3a.6 Liberalisation and capital-market reforms<\/h3>\n<p>Liberalisation since 1990s: deregulation, private banks, open trade and FDI. <strong>Capital market:<\/strong> SEBON, NEPSE, CDS &amp; Clearing (demat), online trading (TMS), Mero Share/ASBA, book building, credit rating.<\/p>\n<h3>3a.7 Competitiveness<\/h3>\n<p>Determinants (Porter's diamond): factor conditions · demand conditions · related and supporting industries · firm strategy and rivalry · plus government and chance. Nepal's constraints: infrastructure, productivity, governance, landlocked logistics.<\/p>\n<h3>3a.8 Constitutional provisions on the economy<\/h3>\n<p>The Constitution of Nepal (2015) aims at a socialism-oriented, self-reliant economy through <strong>public, private and cooperative<\/strong> sectors; directive principles on industry, agriculture, labour and natural resources; fundamental rights to employment, labour, food and social security.<\/p>\n<p><strong>Key points:<\/strong> economic structure · migration impacts · 16th Plan · agriculture/industry problems · six policies · capital-market reforms · Porter's diamond · constitutional provisions.<\/p>", "4": "<h3>3b.1 Political structure of Nepal<\/h3>\n<p>Federal democratic republic (Constitution 2015): <strong>federal, 7 provincial and 753 local governments<\/strong>; parliamentary system; bicameral federal parliament (House of Representatives, National Assembly); multiparty democracy; independent judiciary.<\/p>\n<h3>3b.2 Business–government relations at different levels<\/h3>\n<p>Government as regulator, promoter, customer, competitor (public enterprises) and planner. Federal level: national policy, tax, trade; provinces: provincial industries and taxes; local level: business registration, local taxes and permits. Issues: overlapping jurisdictions and multiple taxation; need for coordination.<\/p>\n<h3>3b.3 Political risks<\/h3>\n<p>Instability and frequent government change · policy reversals · strikes and bandhs · corruption · expropriation risk · conflict. <strong>Management:<\/strong> risk assessment, insurance, local partners, diversification, lobbying through FNCCI/CNI.<\/p>\n<h3>3b.4 Laws related to start-ups, market regulation and competition<\/h3>\n<p>Companies Act, 2063 · Industrial Enterprises Act, 2076 · Competition Promotion and Market Protection Act, 2063 · Consumer Protection Act, 2075 · Black Marketing and Some Other Social Offences Act.<\/p>\n<h3>3b.5 Legislation on labour, finance, investment, IP, e-business and consumers<\/h3>\n<ul>\n<li><strong>Labour:<\/strong> Labour Act, 2074; Social Security Act, 2075; Trade Union Act.<\/li>\n<li><strong>Finance:<\/strong> Nepal Rastra Bank Act, 2058; Bank and Financial Institutions Act, 2073; Securities Act, 2063; Insurance Act.<\/li>\n<li><strong>Investment:<\/strong> FITTA, 2075; Public–Private Partnership and Investment Act, 2075; Special Economic Zone Act, 2073.<\/li>\n<li><strong>IP:<\/strong> Patent, Design and Trademark Act, 2022 BS; Copyright Act, 2059.<\/li>\n<li><strong>E-business:<\/strong> Electronic Transactions Act, 2063; Individual Privacy Act, 2075.<\/li>\n<li><strong>Consumer protection:<\/strong> Consumer Protection Act, 2075.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> three tiers of government · roles of government · political risks and management · law list with years.<\/p>", "5": "<h3>3c.1 Changing marriage age<\/h3>\n<p>Later marriage (education, careers, urbanisation) → more young single consumers, rental housing, lifestyle products, a delayed family market.<\/p>\n<h3>3c.2 Female education<\/h3>\n<p>Rising female literacy and higher education → more working women, dual-income households, demand for convenience goods, childcare, banking and fashion; a larger skilled workforce; women entrepreneurs.<\/p>\n<h3>3c.3 Changing family structure<\/h3>\n<p>Joint → nuclear families; elderly left behind by migration → more households, demand for apartments, appliances, packaged food, elderly care and remittance services.<\/p>\n<h3>3c.4 Social organisations<\/h3>\n<p>NGOs, community groups, cooperatives, mothers' groups, trade unions, consumer associations — they influence awareness, rights, CSR expectations and local business.<\/p>\n<h3>3c.5 Class structure<\/h3>\n<p>Traditional caste/ethnic stratification is weakening; an emerging urban middle class with higher purchasing power; income inequality and a rural–urban divide affect market segmentation.<\/p>\n<h3>3c.6 Acculturation and assimilation<\/h3>\n<p><strong>Acculturation<\/strong> — adopting traits of another culture while retaining one's own (Western food, dress, festivals). <strong>Assimilation<\/strong> — full absorption into the dominant culture. Both change tastes and demand.<\/p>\n<h3>3c.7 Socio-cultural change and business impact<\/h3>\n<p>Urbanisation, migration, digital lifestyle, health consciousness, consumerism → new markets (e-commerce, fitness, branded goods); firms must adapt products, communication and HR practices (diversity, gender).<\/p>\n<p><strong>Key points:<\/strong> seven changes and their business effects · acculturation vs assimilation.<\/p>", "6": "<h3>3d.1 Status of technology and technology transfer in Nepal<\/h3>\n<p>Low R&amp;D spending, dependence on imported technology, rapid mobile and internet penetration, growing IT services and fintech. <strong>Transfer modes:<\/strong> FDI, joint ventures, licensing, franchising, turnkey projects, technical assistance, imports of machinery. <strong>Issues:<\/strong> appropriateness, cost and royalties, dependence, low absorptive capacity, restrictive clauses, weak IPR (FITTA, 2075 governs agreements).<\/p>\n<h3>3d.2 IT policy<\/h3>\n<p>National ICT Policy, 2072 (2015) · <strong>Digital Nepal Framework (2019)<\/strong> · National Cyber Security Policy (2023) · Electronic Transactions Act, 2063 — goals: broadband for all, e-governance, digital literacy, IT industry and exports.<\/p>\n<h3>3d.3 Natural environment issues<\/h3>\n<p>Air pollution (Kathmandu Valley), deforestation, river pollution, waste management, climate change (glacier melt, GLOFs, floods, landslides), biodiversity loss. Business faces EIA/IEE rules (Environment Protection Act, 2076) and green expectations.<\/p>\n<h3>3d.4 Energy situation<\/h3>\n<p>Large hydropower potential; installed capacity has grown rapidly; load-shedding ended around 2017–18; seasonal surplus exported to India and Bangladesh; heavy dependence on imported petroleum; biomass in rural areas; dry-season deficits.<\/p>\n<h3>3d.5 Environment and energy management<\/h3>\n<p>Renewables (hydro, solar, wind), energy efficiency, electric vehicles and electric cooking, transmission-line expansion, cleaner production, carbon markets, environmental management systems (ISO 14001).<\/p>\n<h3>3d.6 AI and the future of business in Nepal<\/h3>\n<p>Uses: chatbots in banks and telecoms, credit scoring, fraud detection, agriculture advisory, Nepali NLP, IT outsourcing. Challenges: data, skills, regulation, job displacement, ethics.<\/p>\n<p><strong>Key points:<\/strong> tech-transfer modes and issues · IT policies · environmental issues · energy facts · energy management · AI uses and challenges.<\/p>", "7": "<h3>3e.1 Regional groupings<\/h3>\n<p>Economic integration levels: preferential trade area → free trade area → customs union → common market → economic union (EU). Benefits: market access, scale, investment, bargaining power.<\/p>\n<h3>3e.2 South Asian trade agreements<\/h3>\n<ul>\n<li><strong>SAARC<\/strong> (1985; secretariat in Kathmandu) — eight members.<\/li>\n<li><strong>SAPTA<\/strong> (signed 1993, effective 1995) — preferential tariffs.<\/li>\n<li><strong>SAFTA<\/strong> (signed 2004, effective 2006) — tariff reduction, special treatment for LDCs.<\/li>\n<li><strong>BIMSTEC<\/strong> (1997; Nepal joined 2004) — seven members around the Bay of Bengal; 14 cooperation sectors.\n<strong>Issues for Nepal:<\/strong> long sensitive lists, non-tariff barriers, weak supply capacity, SAARC inactivity, dependence on India, rules of origin.<\/li>\n<\/ul>\n<h3>3e.3 Globalisation<\/h3>\n<p>Integration of economies through trade, investment, technology, finance and migration. <strong>Positive:<\/strong> markets, technology, FDI, competition; <strong>negative:<\/strong> competition for domestic industry, external shocks, cultural erosion, inequality.<\/p>\n<h3>3e.4 FDI trends and reasons for low FDI in Nepal<\/h3>\n<p>FDI inflows to Nepal have been small relative to GDP, concentrated in energy, manufacturing, tourism and services, with India and China as major sources. <strong>Reasons for low FDI:<\/strong> political instability, policy inconsistency, bureaucracy, infrastructure, labour disputes, small market, repatriation and foreign-exchange restrictions, minimum investment thresholds, corruption, land acquisition.<\/p>\n<h3>3e.5 WTO membership<\/h3>\n<p>Nepal joined on <strong>23 April 2004 as the 147th member<\/strong>. Benefits: MFN market access, LDC special and differential treatment, transit rights, dispute settlement, technical assistance. Challenges: competition, compliance (TRIPS, SPS), limited export capacity, LDC graduation.<\/p>\n<p><strong>Key points:<\/strong> integration levels · SAARC/SAPTA/SAFTA/BIMSTEC dates · issues · globalisation pros/cons · FDI reasons · WTO 2004/147th.<\/p>", "8": "<h3>4.1 Department of Industry (DoI)<\/h3>\n<p>Registers industries and foreign investment, approves technology-transfer agreements, registers patents, designs and trademarks, provides one-stop services and facilitation, and grants incentives under the Industrial Enterprises Act.<\/p>\n<h3>4.2 Nepal Rastra Bank (NRB)<\/h3>\n<p>Central bank (NRB Act, 2058): monetary policy, currency issue, regulation and supervision of banks and financial institutions, foreign-exchange management, payment-system oversight, banker and adviser to the government, financial inclusion.<\/p>\n<h3>4.3 Nepal Chamber of Commerce (NCC)<\/h3>\n<p>One of the oldest private-sector bodies (1952): represents traders, provides information, certificates of origin, training, trade fairs, policy advocacy.<\/p>\n<h3>4.4 Trade and Export Promotion Centre (TEPC)<\/h3>\n<p>Export promotion, trade information, trade fairs, exporter training, product development, policy recommendations, branding Nepali products.<\/p>\n<h3>4.5 FNCCI<\/h3>\n<p>Federation of Nepalese Chambers of Commerce and Industry (1965): apex umbrella of the private sector; policy dialogue with the government; international representation; business information; dispute mediation.<\/p>\n<h3>4.6 Small and Cottage Industry Development Board (SCIDB)<\/h3>\n<p>Promotes cottage and small industries: registration support, skill and entrepreneurship training, technology and marketing help, access to credit, rural self-employment.<\/p>\n<h3>4.7 Nepal Trade Information Portal (NTIP)<\/h3>\n<p>Online one-stop portal (Ministry of Industry, Commerce and Supplies) giving laws, procedures, tariffs, required documents and forms for import/export — improves transparency and trade facilitation.<\/p>\n<h3>4.8 Ministry of Labour, Employment and Social Security<\/h3>\n<p>Labour policy and law, employment programmes (e.g. Prime Minister Employment Programme), foreign-employment regulation (Department of Foreign Employment), social security, occupational safety.<\/p>\n<h3>4.9 Ministry of Industry, Commerce and Supplies<\/h3>\n<p>Industrial, trade and supply policy; regulates markets and supplies; oversees DoI, TEPC, the Department of Commerce, Supply Management and Consumer Protection; trade negotiations.<\/p>\n<p><strong>Key points:<\/strong> one-line role of each of the nine agencies.<\/p>"}, "qa": [{"id": "MGT236-01", "t": "Business environment: concept, components, plans", "u": 1, "q": "Discuss the concept of business environment. How do economic development plans influence the business environment?", "m": 10, "p": "High", "ty": "Concept + analysis", "seen": {"E25": "Q18"}, "rep": false, "src": "Apr 2025 exam Q18", "a": "<p><strong>Business environment<\/strong> is the sum of all internal and external factors, forces and institutions that influence a business's decisions, operations and performance.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"38.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.8749537379655\" y2=\"94.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.87495373796554\" y2=\"205.99999999999997\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"262.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"206.00000000000003\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"93.99999999999999\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><ellipse cx=\"260.0\" cy=\"150.0\" rx=\"78\" ry=\"30\" fill=\"#3b5b8c\"/><text x=\"260.0\" y=\"154.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">Business firm<\/text><rect x=\"198.0\" y=\"21.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"35.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Internal: culture,<\/text><text x=\"260.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">structure, HR<\/text><rect x=\"366.8749537379655\" y=\"77.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.8749537379655\" y=\"91.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Task: customers,<\/text><text x=\"428.8749537379655\" y=\"104.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">suppliers,<\/text><rect x=\"366.87495373796554\" y=\"188.99999999999997\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.87495373796554\" y=\"209.99999999999997\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Economic<\/text><rect x=\"198.0\" y=\"245.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Political-legal<\/text><rect x=\"29.125046262034488\" y=\"189.00000000000003\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"210.00000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Socio-cultural<\/text><rect x=\"29.125046262034488\" y=\"76.99999999999999\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"91.49999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Technological &amp;<\/text><text x=\"91.12504626203449\" y=\"104.49999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">global<\/text><\/svg><\/div>\n\n<p><strong>Classification<\/strong><\/p>\n<ul>\n<li><strong>Internal (firm-specific):<\/strong> mission, structure, culture, resources, HR.<\/li>\n<li><strong>External — task/micro:<\/strong> customers, suppliers, competitors, intermediaries, financiers.<\/li>\n<li><strong>External — general/macro:<\/strong> economic, political-legal, socio-cultural, technological, natural and global (PESTEL).<\/li>\n<\/ul>\n<p><strong>Characteristics:<\/strong> dynamic, complex, uncertain, interrelated, and varies by place and time.<\/p>\n<p><strong>How development plans influence business<\/strong>\nNepal prepares periodic plans (the current 16th Plan covers FY 2081/82–2085/86) that set national targets for growth, investment, infrastructure and priority sectors.<\/p>\n<ol>\n<li><strong>Priority sectors<\/strong> (energy, tourism, agriculture, IT) receive incentives, so businesses enter these areas.<\/li>\n<li><strong>Public investment<\/strong> in roads, power and digital infrastructure lowers business costs.<\/li>\n<li><strong>Policy direction<\/strong> on trade, industry and investment shapes regulation.<\/li>\n<li><strong>Demand creation:<\/strong> government projects buy goods and services.<\/li>\n<li><strong>Employment and income targets<\/strong> raise purchasing power.<\/li>\n<li><strong>Regional balance:<\/strong> provincial projects open new markets.<\/li>\n<li><strong>Weak implementation<\/strong> of plans (budget under-spending, delays) creates uncertainty for business.<\/li>\n<\/ol>\n<p><strong>Conclusion:<\/strong> plans provide direction and opportunity, but their benefit depends on implementation.<\/p>"}, {"id": "MGT236-02", "t": "Environmental scanning: techniques and methods", "u": 1, "q": "Define environmental scanning. Explain its process, techniques and methods.", "m": 5, "p": "High", "ty": "Definition + list", "seen": {"E25": "A1, A3", "M": "A1"}, "rep": true, "src": "Apr 2025 exam A1, A3; TU model (partial) A1", "a": "<p><strong>Environmental scanning<\/strong> is the systematic monitoring and analysis of internal and external environments to detect opportunities and threats early.<\/p>\n<p><strong>Process:<\/strong> identify environmental factors → collect information → analyse → forecast → feed into strategy.<\/p>\n<p><strong>Techniques:<\/strong> SWOT analysis · PESTEL analysis · ETOP (Environmental Threat and Opportunity Profile) · scenario building · Delphi technique (expert opinion) · trend extrapolation · benchmarking · QUEST (quick environmental scanning technique).<\/p>\n<p><strong>Methods / approaches:<\/strong> <em>systematic<\/em> (continuous) · <em>regular / periodic<\/em> · <em>ad-hoc / irregular<\/em>. Information sources include verbal (meetings), written (reports, newspapers), spying and formal forecasting.<\/p>\n<p><strong>Types:<\/strong> internal scanning vs external scanning.<\/p>\n<p><strong>Importance:<\/strong> early warning, better strategy, competitive advantage, reduced uncertainty.<\/p>"}, {"id": "MGT236-03", "t": "Task environment factors", "u": 1, "q": "Describe how task environment factors influence business.", "m": 5, "p": "High", "ty": "Describe", "seen": {"E25": "Q11"}, "rep": false, "src": "Apr 2025 exam Q11", "a": "<p>The <strong>task (operating) environment<\/strong> consists of stakeholders a firm interacts with directly.<\/p>\n<ul>\n<li><strong>Customers:<\/strong> demand, preferences and bargaining power decide sales and prices.<\/li>\n<li><strong>Suppliers:<\/strong> cost, quality and timeliness of inputs; supplier power can squeeze margins.<\/li>\n<li><strong>Competitors:<\/strong> pricing, innovation and market share battles.<\/li>\n<li><strong>Intermediaries:<\/strong> distributors, retailers and logistics affect reach.<\/li>\n<li><strong>Financiers:<\/strong> banks and investors affect the cost and availability of capital.<\/li>\n<li><strong>Regulators and local community.<\/strong><\/li>\n<\/ul>\n<p><em>Example:<\/em> a Nepali tea company depends on Indian buyers (customers), estate workers (labour), packaging suppliers and competing Darjeeling brands.<\/p>\n<p>Porter's Five Forces is a useful frame for analysing these factors.<\/p>"}, {"id": "MGT236-04", "t": "Firm-specific environment", "u": 2, "q": "Explain the major firm-specific business environment factors.", "m": 10, "p": "High", "ty": "Explanation", "seen": {"E25": "Q21", "M": "A2"}, "rep": true, "src": "Apr 2025 exam Q21; TU model (partial) A2", "a": "<p>The <strong>firm-specific (internal) environment<\/strong> consists of factors inside the organisation that management can largely control.<\/p>\n<ol>\n<li><strong>Vision, mission and objectives<\/strong> — give direction.<\/li>\n<li><strong>Organisational structure<\/strong> — functional, divisional, matrix; it decides authority and communication.<\/li>\n<li><strong>Organisational culture<\/strong> — shared values and beliefs. A strong, aligned culture improves motivation, behaviour and performance; <em>cultural alignment<\/em> means the culture supports strategy (e.g. an innovation culture for a tech firm).<\/li>\n<li><strong>Operations management<\/strong> — production system, capacity planning, supply chain and logistics, quality management (TQM, ISO).<\/li>\n<li><strong>Human resource management<\/strong> — recruitment, training, compensation, labour relations.<\/li>\n<li><strong>Financial resources<\/strong> — capital structure and liquidity.<\/li>\n<li><strong>Physical and technological resources<\/strong> — plant, IT systems.<\/li>\n<li><strong>Management and board, leadership style.<\/strong><\/li>\n<li><strong>Corporate image and brand.<\/strong><\/li>\n<\/ol>\n<p><strong>Conclusion:<\/strong> internal strengths and weaknesses determine how well a firm exploits external opportunities (the S and W of SWOT).<\/p>"}, {"id": "MGT236-05", "t": "Macroeconomic indicators; inflation; fiscal policy", "u": 3, "q": "Explain inflation, the key indicators of the macroeconomic environment, and the objectives of fiscal policy.", "m": 5, "p": "High", "ty": "Definitions", "seen": {"E25": "A2, A4, A8"}, "rep": false, "src": "Apr 2025 exam A2, A4, A8", "a": "<p><strong>Inflation:<\/strong> a sustained rise in the general price level, reducing the purchasing power of money. In Nepal it is measured by the consumer price index and monitored by Nepal Rastra Bank.<\/p>\n<p><strong>Key macroeconomic indicators:<\/strong> GDP growth rate · inflation · unemployment · interest rates · exchange rate · balance of payments / trade deficit · remittance inflow · fiscal deficit and public debt · foreign-exchange reserves.<\/p>\n<p><strong>Fiscal policy<\/strong> is the government's use of taxation and public expenditure. <strong>Objectives:<\/strong> economic growth · price stability · employment generation · reduction of income inequality · resource mobilisation · balanced regional development · capital formation.<\/p>\n<p><strong>Monetary policy<\/strong> (NRB, announced annually) controls money supply, interest rates and credit to maintain price and financial stability.<\/p>"}, {"id": "MGT236-06", "t": "Capital market reforms in Nepal", "u": 3, "q": "Explain how capital market reforms affect Nepalese business.", "m": 5, "p": "High", "ty": "Explain", "seen": {"E25": "Q15"}, "rep": false, "src": "Apr 2025 exam Q15", "a": "<p><strong>Major reforms:<\/strong> the Securities Board of Nepal (SEBON) as regulator; the Securities Act, 2063; central depository (CDS &amp; Clearing) and <strong>dematerialisation<\/strong>; <strong>online trading (NOTS/TMS)<\/strong>; <strong>Mero Share<\/strong> and <strong>ASBA<\/strong> for IPO applications; book-building for IPO pricing; credit-rating requirements; broker licensing expansion.<\/p>\n<p><strong>Effects on business<\/strong><\/p>\n<ul>\n<li>Easier <strong>equity financing<\/strong> through IPOs and right shares.<\/li>\n<li>Lower <strong>cost of capital<\/strong> and less dependence on bank loans.<\/li>\n<li>Greater <strong>transparency and corporate governance<\/strong> (disclosure rules).<\/li>\n<li><strong>Wider public participation<\/strong>, mobilising domestic savings.<\/li>\n<li><strong>Liquidity<\/strong> for investors, which makes investment more attractive.<\/li>\n<li>Valuation and <strong>mergers/acquisitions<\/strong> become easier.<\/li>\n<li>Risks: speculative bubbles and volatility can affect firm valuation.<\/li>\n<\/ul>"}, {"id": "MGT236-07", "t": "Nepal's economic policies (industrial, trade, privatisation, tourism, monetary)", "u": 3, "q": "Explain the major economic policies of Nepal and their impact on business.", "m": 10, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<table>\n<thead>\n<tr>\n<th>Policy<\/th>\n<th>Main features<\/th>\n<th>Business impact<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Industrial policy<\/strong><\/td>\n<td>Promote private investment, priority industries, SEZs, incentives; Industrial Enterprises Act 2076<\/td>\n<td>Encourages manufacturing and investment<\/td>\n<\/tr>\n<tr>\n<td><strong>Privatisation policy<\/strong> (Privatisation Act 2050)<\/td>\n<td>Transfer public enterprises to private sector; methods: share sale, management contract, lease, liquidation<\/td>\n<td>Efficiency, but job-loss concerns<\/td>\n<\/tr>\n<tr>\n<td><strong>Trade policy<\/strong><\/td>\n<td>Export promotion, import substitution, trade facilitation, reduce trade deficit<\/td>\n<td>Market access for exporters<\/td>\n<\/tr>\n<tr>\n<td><strong>Tourism policy<\/strong><\/td>\n<td>Increase arrivals, diversify products, infrastructure, branding campaigns<\/td>\n<td>Hotels, airlines, trekking businesses<\/td>\n<\/tr>\n<tr>\n<td><strong>Monetary policy<\/strong> (NRB, yearly)<\/td>\n<td>Interest rates, CRR, credit to priority sectors<\/td>\n<td>Cost and availability of loans<\/td>\n<\/tr>\n<tr>\n<td><strong>Liberalisation<\/strong> (from the 1990s)<\/td>\n<td>Deregulation, open trade and FDI<\/td>\n<td>More competition and choice<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Methods of privatisation (often asked):<\/strong> sale of shares to the public or a strategic investor · management contract · lease · liquidation/dissolution · joint venture.<\/p>"}, {"id": "MGT236-08", "t": "Labour market, migration, constitution", "u": 3, "q": "Explain labour migration and its impact on Nepalese business.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>Large numbers of Nepali youths work abroad (Gulf countries, Malaysia, India and others). Remittances form a major share of GDP.<\/p>\n<p><strong>Positive impacts:<\/strong> higher household consumption and demand, foreign exchange, investment in housing and small businesses, skills brought back by returnees.\n<strong>Negative impacts:<\/strong> shortage of labour in agriculture and industry, rising wages, consumption-driven imports widening the trade deficit, low productive investment, social costs.<\/p>\n<p><strong>Constitutional provisions:<\/strong> the Constitution of Nepal (2015) envisages a socialism-oriented economy built on the public, private and cooperative sectors and guarantees the right to employment and labour rights.<\/p>"}, {"id": "MGT236-09", "t": "CASE: Tourism industry of Nepal", "u": 3, "q": "Case (April 2025): Tourism in Nepal. (a) What are the major issues of the tourism industry? (b) What are the prospects and challenges of Nepal's tourism industry? (c) What action plan is needed for its further development? (d) Does technology support the promotion of tourism? Explain. [4×5]", "m": 20, "p": "High", "ty": "Case study", "seen": {"E25": "Q22"}, "rep": false, "src": "Apr 2025 exam Q22", "a": "<p><strong>(a) Major issues:<\/strong> weak infrastructure (roads, airports, connectivity) · poor service quality and a shortage of trained manpower · inadequate emergency, rescue and health services · seasonality · air-safety concerns (EU air-safety list) · political instability and strikes · limited marketing budget · environmental damage and waste in trekking areas · slow post-earthquake heritage reconstruction.<\/p>\n<p><strong>(b) Prospects:<\/strong> Himalayas (8 of the 14 highest peaks), trekking and mountaineering · cultural and religious heritage (Lumbini, Pashupatinath, UNESCO sites) · adventure tourism (rafting, paragliding) · eco- and wildlife tourism (national parks) · huge neighbouring markets (India, China) · new international airports (Bhairahawa, Pokhara) · homestays and rural tourism.\n<strong>Challenges:<\/strong> connectivity, cost, competition from other destinations, image after disasters, low per-tourist spending, short average stay.<\/p>\n<p><strong>(c) Action plan<\/strong><\/p>\n<ol>\n<li>Improve infrastructure: roads, airports, trails, internet, sanitation.<\/li>\n<li>Human-resource training in hospitality and guiding.<\/li>\n<li>Product diversification: MICE, wellness, adventure, rural homestays.<\/li>\n<li>Aggressive digital marketing and targeted campaigns in India, China and overseas markets.<\/li>\n<li>Safety: air safety, rescue, insurance, health posts on trekking routes.<\/li>\n<li>Public–private partnership with the Nepal Tourism Board.<\/li>\n<li>Sustainable tourism: waste management, carrying-capacity limits.<\/li>\n<li>Policy stability and easier visa/entry procedures.<\/li>\n<\/ol>\n<p><strong>(d) Role of technology — yes, strongly<\/strong><\/p>\n<ul>\n<li>Online booking and travel portals, OTAs, mobile apps.<\/li>\n<li>Social media and influencer marketing, virtual tours.<\/li>\n<li>Digital payments, e-visa/online arrival forms.<\/li>\n<li>GPS tracking and safety apps for trekkers; online permits (TIMS).<\/li>\n<li>Data analytics to understand tourist preferences.<\/li>\n<li>Reviews (TripAdvisor) build trust.\n<strong>Conclusion:<\/strong> technology lowers marketing costs and improves tourist experience and safety.<\/li>\n<\/ul>"}, {"id": "MGT236-10", "t": "Political stability and political risk", "u": 4, "q": "Define political risk. Does political stability lead to business development? Justify your view.", "m": 5, "p": "High", "ty": "Justify", "seen": {"E25": "Q12, A7"}, "rep": false, "src": "Apr 2025 exam Q12, A7", "a": "<p><strong>Political risk<\/strong> is the possibility that political decisions, events or instability will hurt business operations or profitability — e.g. sudden policy change, expropriation, strikes (bandh), corruption, conflict.<\/p>\n<p><strong>Yes — political stability supports business development because:<\/strong><\/p>\n<ol>\n<li><strong>Policy continuity<\/strong> lets firms plan long-term investment.<\/li>\n<li><strong>Investor confidence<\/strong> — domestic and foreign investors prefer predictable environments; frequent government changes in Nepal have discouraged FDI.<\/li>\n<li><strong>Law and order<\/strong> reduce security costs and disruptions.<\/li>\n<li><strong>Faster decision-making<\/strong> on projects and licences.<\/li>\n<li><strong>Effective implementation<\/strong> of development plans and infrastructure.<\/li>\n<li><strong>Better macroeconomic management<\/strong> (stable fiscal policy).<\/li>\n<\/ol>\n<p><em>Qualification:<\/em> stability alone is not enough; good governance, rule of law and sound policy are also needed. A stable but corrupt or protectionist government can still hamper business.<\/p>"}, {"id": "MGT236-11", "t": "Legal provisions for business start-ups; business laws", "u": 4, "q": "Describe the major legal provisions for starting a business in Nepal.", "m": 5, "p": "High", "ty": "Describe", "seen": {"E25": "Q14"}, "rep": false, "src": "Apr 2025 exam Q14", "a": "<ol>\n<li><strong>Choose a legal form:<\/strong> sole proprietorship/partnership (registered under the Private Firm Registration Act 2014 BS / Partnership Act 2020 BS, at the Department of Commerce or local office) or <strong>company<\/strong> under the <strong>Companies Act, 2063<\/strong> at the Office of the Company Registrar.<\/li>\n<li><strong>Industry registration<\/strong> under the <strong>Industrial Enterprises Act, 2076<\/strong> (Department of Industry / provincial offices) for industrial enterprises.<\/li>\n<li><strong>PAN/VAT registration<\/strong> with the Inland Revenue Department (Income Tax Act 2058, VAT Act 2052).<\/li>\n<li><strong>Local-level registration/permit<\/strong> from the municipality or ward.<\/li>\n<li><strong>Sector licences<\/strong> (e.g. NRB for financial services, NTA for telecom, Department of Tourism for travel agencies).<\/li>\n<li><strong>Foreign investment approval<\/strong> under <strong>FITTA 2075<\/strong> (Department of Industry or Investment Board Nepal).<\/li>\n<li><strong>Labour compliance:<\/strong> <strong>Labour Act 2074<\/strong>, contributions to the Social Security Fund.<\/li>\n<li><strong>Environmental clearance<\/strong> (IEE/EIA under the Environment Protection Act 2076) where required.<\/li>\n<li><strong>Other laws:<\/strong> Competition Promotion and Market Protection Act 2063 · Consumer Protection Act 2075 · Patent, Design and Trademark Act 2022 · Copyright Act 2059 · Electronic Transactions Act 2063.<\/li>\n<\/ol>"}, {"id": "MGT236-12", "t": "Social changes; acculturation and assimilation", "u": 5, "q": "Describe the social changes in Nepal that influence business. Define acculturation.", "m": 5, "p": "High", "ty": "Describe", "seen": {"E25": "Q13, A5"}, "rep": false, "src": "Apr 2025 exam Q13, A5", "a": "<p><strong>Acculturation:<\/strong> the process by which a group adopts some cultural traits of another culture through contact, while retaining its own (e.g. adopting Western dress and fast food). <strong>Assimilation:<\/strong> the complete absorption of a group into the dominant culture, losing its original identity.<\/p>\n<p><strong>Social changes influencing business<\/strong><\/p>\n<ol>\n<li><strong>Rising marriage age<\/strong> → young single consumers, demand for lifestyle products and rental housing.<\/li>\n<li><strong>Female education and employment<\/strong> → more working women, demand for convenience goods, childcare and banking services; larger talent pool.<\/li>\n<li><strong>Nuclear families replacing joint families<\/strong> → more households, demand for apartments, appliances and packaged food.<\/li>\n<li><strong>Urbanisation and migration<\/strong> → urban markets, e-commerce, delivery services.<\/li>\n<li><strong>Changing class structure<\/strong> → a growing middle class with higher purchasing power.<\/li>\n<li><strong>Social organisations and awareness<\/strong> → consumer rights, CSR expectations.<\/li>\n<li><strong>Westernisation and digital lifestyle<\/strong> → demand for branded goods, online entertainment.<\/li>\n<\/ol>\n<p>Business must adapt products, marketing and HR practices to these changes.<\/p>"}, {"id": "MGT236-13", "t": "Technology transfer issues", "u": 6, "q": "Discuss the various issues related to technology transfer in Nepal.", "m": 5, "p": "High", "ty": "Discuss", "seen": {"E25": "Q17"}, "rep": false, "src": "Apr 2025 exam Q17", "a": "<p><strong>Technology transfer<\/strong> is the movement of technology, know-how and skills from one country or organisation to another (through FDI, licensing, franchising, turnkey projects, joint ventures, technical assistance).<\/p>\n<p><strong>Issues<\/strong><\/p>\n<ol>\n<li><strong>Appropriateness:<\/strong> imported technology may not suit Nepal's labour-abundant, small-scale economy.<\/li>\n<li><strong>High cost:<\/strong> royalties and licence fees drain foreign exchange.<\/li>\n<li><strong>Dependence<\/strong> on foreign suppliers for spare parts and upgrades.<\/li>\n<li><strong>Lack of absorptive capacity:<\/strong> shortage of skilled manpower and R&amp;D.<\/li>\n<li><strong>Restrictive clauses<\/strong> (export bans, tie-in purchases).<\/li>\n<li><strong>Outdated technology dumping.<\/strong><\/li>\n<li><strong>Weak legal framework and IPR enforcement.<\/strong><\/li>\n<li><strong>Environmental impact<\/strong> of polluting technologies.<\/li>\n<li><strong>Poor infrastructure<\/strong> (power, internet).<\/li>\n<\/ol>\n<p><strong>Legal basis:<\/strong> FITTA 2075 governs technology-transfer agreements, which require approval. <strong>Remedies:<\/strong> select appropriate technology, train manpower, strengthen R&amp;D and IPR protection, negotiate fair agreements.<\/p>"}, {"id": "MGT236-14", "t": "Energy situation: opportunities and threats", "u": 6, "q": "Highlight Nepal's energy situation. Analyse its opportunities and threats for Nepalese business.", "m": 10, "p": "High", "ty": "Analysis", "seen": {"E25": "Q20"}, "rep": false, "src": "Apr 2025 exam Q20", "a": "<p><strong>Energy situation<\/strong><\/p>\n<ul>\n<li>Nepal's hydropower potential is very large (commonly cited as about 83,000 MW theoretical and about 42,000 MW economically feasible).<\/li>\n<li>Installed capacity has grown rapidly in recent years; long load-shedding ended around 2017–18, and Nepal now <strong>exports surplus electricity to India and Bangladesh<\/strong> in the wet season.<\/li>\n<li>Dependence on <strong>imported petroleum<\/strong> (from India) remains high and is a major cause of the trade deficit.<\/li>\n<li>Traditional biomass is still widely used in rural areas.<\/li>\n<li>Dry-season shortfall: run-of-river plants produce less in winter.<\/li>\n<\/ul>\n<p><strong>Opportunities for business<\/strong><\/p>\n<ul>\n<li>Investment in hydropower (IPPs) and public listing of hydro companies.<\/li>\n<li><strong>Electricity export<\/strong> earnings and cross-border transmission lines.<\/li>\n<li>Energy-intensive industries (cement, steel, data centres).<\/li>\n<li><strong>Electric vehicles<\/strong> and charging stations (EV imports have grown quickly).<\/li>\n<li>Electric cooking appliances, solar and other renewables.<\/li>\n<li>Green-hydrogen and clean-energy branding.<\/li>\n<\/ul>\n<p><strong>Threats<\/strong><\/p>\n<ul>\n<li>Seasonal supply variation and transmission bottlenecks.<\/li>\n<li>Delays in project approvals, land acquisition and local disputes.<\/li>\n<li>Climate change (glacial lake outburst floods, variable river flow).<\/li>\n<li>Dependence on the Indian market and its regulations for exports.<\/li>\n<li>Petroleum price shocks.<\/li>\n<li>High investment cost and long payback.<\/li>\n<\/ul>\n<p><strong>Conclusion:<\/strong> energy is shifting from a constraint into a potential competitive advantage for Nepali business.<\/p>"}, {"id": "MGT236-15", "t": "IT policy, environment, AI and business", "u": 6, "q": "Explain the IT policy of Nepal and the role of AI in the future of Nepalese business.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>IT policy framework:<\/strong> National ICT Policy 2072 (2015); the <strong>Digital Nepal Framework (2019)<\/strong> with sectors such as digital foundation, agriculture, health, education, energy, tourism, finance and urban infrastructure; the Electronic Transactions Act 2063; the National Cyber Security Policy (2023).<\/p>\n<p><strong>Objectives:<\/strong> expand broadband, promote e-governance and digital literacy, develop IT industry and exports, ensure cyber security.<\/p>\n<p><strong>AI and business in Nepal:<\/strong> chatbots in banking and telecom, credit scoring, agricultural advisories, demand forecasting, translation/Nepali NLP, IT-outsourcing services. <strong>Challenges:<\/strong> data scarcity, skills, regulation and ethics, job displacement.<\/p>\n<p><strong>Natural-environment issues:<\/strong> air pollution in the Kathmandu Valley, deforestation, climate change, waste management — businesses face environmental regulation (EIA/IEE) and pressure for green practices.<\/p>"}, {"id": "MGT236-16", "t": "FDI: rationale and reasons for low inflow", "u": 7, "q": "Considering that FDI plays a vital role in economic development, explain its rationale and the reasons for its poor inflow into Nepal.", "m": 10, "p": "High", "ty": "Explain", "seen": {"E25": "Q19"}, "rep": false, "src": "Apr 2025 exam Q19", "a": "<p><strong>Foreign Direct Investment (FDI):<\/strong> investment by a foreign entity to own and control a business in the host country (usually 10% or more of equity), e.g. joint ventures and wholly-owned subsidiaries.<\/p>\n<p><strong>Rationale (why Nepal needs FDI)<\/strong><\/p>\n<ol>\n<li><strong>Fills the savings–investment gap.<\/strong><\/li>\n<li><strong>Technology and know-how transfer.<\/strong><\/li>\n<li><strong>Employment<\/strong> creation.<\/li>\n<li><strong>Infrastructure development<\/strong> (hydropower, telecom).<\/li>\n<li><strong>Export promotion and foreign exchange.<\/strong><\/li>\n<li><strong>Management skills and competition<\/strong> raise efficiency.<\/li>\n<li><strong>Integration with global value chains.<\/strong><\/li>\n<\/ol>\n<p><strong>Reasons for poor FDI inflow into Nepal<\/strong><\/p>\n<ol>\n<li><strong>Political instability<\/strong> and frequent government change.<\/li>\n<li><strong>Policy inconsistency and bureaucratic delays<\/strong> in approvals.<\/li>\n<li><strong>Weak infrastructure:<\/strong> roads, power reliability in the past, logistics.<\/li>\n<li><strong>Labour issues:<\/strong> militant unions, strikes, low productivity.<\/li>\n<li><strong>Small domestic market<\/strong> and landlocked geography (high transport costs).<\/li>\n<li><strong>Restrictions on repatriation<\/strong> of profits and foreign-exchange controls; high minimum investment thresholds.<\/li>\n<li><strong>Negative list<\/strong> of sectors closed to FDI.<\/li>\n<li><strong>Corruption and weak rule of law.<\/strong><\/li>\n<li><strong>Land acquisition problems.<\/strong><\/li>\n<li><strong>Weak investor protection and dispute-resolution mechanisms.<\/strong><\/li>\n<\/ol>\n<p><strong>Measures:<\/strong> FITTA 2075, an automatic approval route, one-stop service centre, Investment Board Nepal, SEZs, investment summits — but implementation must improve.<\/p>"}, {"id": "MGT236-17", "t": "SAARC, SAFTA, BIMSTEC; regional groupings", "u": 7, "q": "Name the objectives of SAFTA. Explain regional trade groupings and issues for Nepal.", "m": 5, "p": "High", "ty": "Explain", "seen": {"E25": "A6"}, "rep": false, "src": "Apr 2025 exam A6", "a": "<p><strong>SAARC<\/strong> (1985): South Asian Association for Regional Cooperation — Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka. Secretariat in <strong>Kathmandu<\/strong>.<\/p>\n<p><strong>SAPTA<\/strong> (1993/1995): South Asian Preferential Trading Arrangement — tariff concessions.<\/p>\n<p><strong>SAFTA<\/strong> (signed 2004, effective 2006): South Asian Free Trade Area. <strong>Objectives:<\/strong> reduce and eliminate tariff and non-tariff barriers · promote fair competition · increase intra-regional trade · special treatment for least-developed members (such as Nepal) · cooperation for mutual benefit.<\/p>\n<p><strong>BIMSTEC<\/strong> (1997): Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation — Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka, Thailand (Nepal joined 2004).<\/p>\n<p><strong>Issues for Nepal:<\/strong> long sensitive lists, non-tariff barriers (quarantine, testing in India), weak supply capacity, SAARC inactivity due to India–Pakistan tensions, trade dependence on India, rules-of-origin complexity.<\/p>"}, {"id": "MGT236-18", "t": "WTO membership advantages; globalisation", "u": 7, "q": "Explain the advantages and challenges of WTO membership for Nepal.", "m": 5, "p": "High", "ty": "List/Explain", "seen": {"E25": "A10"}, "rep": false, "src": "Apr 2025 exam A10", "a": "<p>Nepal became the <strong>147th member of the WTO in April 2004<\/strong> — the first least-developed country to join through the full accession process.<\/p>\n<p><strong>Advantages:<\/strong> market access under the most-favoured-nation (MFN) principle · special and differential treatment as an LDC · dispute-settlement mechanism · transit rights (important for a landlocked country) · technical assistance (Enhanced Integrated Framework) · predictable trade rules that attract FDI · pressure for policy reform.<\/p>\n<p><strong>Challenges:<\/strong> competition for domestic industries from cheap imports · reduced ability to protect infant industries · compliance costs (TRIPS, SPS standards) · limited export capacity · LDC graduation (scheduled for 2026) will remove some preferences.<\/p>\n<p><strong>Globalisation<\/strong> — integration of world economies through trade, investment, technology and migration — offers markets and technology but exposes Nepal to external shocks.<\/p>"}, {"id": "MGT236-19", "t": "TEPC functions", "u": 8, "q": "Explain the functions of the Trade and Export Promotion Centre (TEPC), Nepal.", "m": 5, "p": "High", "ty": "Explain", "seen": {"E25": "Q16"}, "rep": false, "src": "Apr 2025 exam Q16", "a": "<p><strong>TEPC<\/strong> is the national trade-promotion organisation under the Ministry of Industry, Commerce and Supplies (formed by merging earlier trade-promotion bodies).<\/p>\n<p><strong>Functions<\/strong><\/p>\n<ol>\n<li>Promote exports of Nepali products and identify export markets.<\/li>\n<li>Collect and disseminate trade information and statistics.<\/li>\n<li>Organise and support participation in international trade fairs and exhibitions.<\/li>\n<li>Provide export-development training and advisory services to exporters.<\/li>\n<li>Product development and quality improvement support.<\/li>\n<li>Recommend export-promotion policy to the government.<\/li>\n<li>Promote Nepali brands and products (e.g. pashmina, carpets, tea, coffee, handicrafts).<\/li>\n<li>Coordinate with foreign trade-promotion agencies and buyers.<\/li>\n<li>Manage export-related programmes and the Nepal Trade Information Portal coordination.<\/li>\n<\/ol>"}, {"id": "MGT236-20", "t": "Business support agencies (NRB, FNCCI, SCIDB, DoI…)", "u": 8, "q": "List the institutions that support business in Nepal and explain the roles of Nepal Rastra Bank, FNCCI and SCIDB.", "m": 10, "p": "High", "ty": "Explain", "seen": {"E25": "A9", "M": "Q17"}, "rep": true, "src": "Apr 2025 exam A9; TU model (partial) Q17", "a": "<p><strong>Institutions:<\/strong> Department of Industry · Nepal Rastra Bank · Nepal Chamber of Commerce · TEPC · FNCCI · Small and Cottage Industry Development Board · Nepal Trade Information Portal · Ministry of Labour, Employment and Social Security · Ministry of Industry, Commerce and Supplies · Investment Board Nepal · CNI.<\/p>\n<p><strong>Nepal Rastra Bank (central bank):<\/strong> formulates monetary policy · issues currency · regulates and supervises banks and financial institutions · manages foreign-exchange reserves · licenses payment systems · banker to the government · directed lending to priority sectors.<\/p>\n<p><strong>FNCCI (Federation of Nepalese Chambers of Commerce and Industry):<\/strong> apex body of the private sector · policy advocacy with the government · represents business in international forums · trade information, training and fairs · dispute mediation · issues certificates of origin.<\/p>\n<p><strong>SCIDB (Small and Cottage Industry Development Board):<\/strong> promotes cottage and small industries · registration support · skill and entrepreneurship training · technical and marketing assistance · facilitates credit and technology · promotes rural employment and self-employment.<\/p>\n<p><strong>Department of Industry:<\/strong> industry and foreign-investment registration, technology-transfer approval, IP (patent, design, trademark) registration, facilitation.<\/p>\n<p><strong>Nepal Trade Information Portal:<\/strong> online one-stop source for trade laws, procedures, tariffs and documents.<\/p>\n<p><strong>Ministry of Labour, Employment and Social Security:<\/strong> labour policy, foreign-employment regulation, social security, occupational safety.<\/p>"}], "defs": [["Business environment", "All internal and external forces affecting a business."], ["Environmental scanning", "Systematic monitoring of the environment to identify opportunities and threats."], ["Task environment", "Direct stakeholders: customers, suppliers, competitors, intermediaries."], ["Inflation", "Sustained rise in the general price level."], ["Fiscal p
