<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TU BIM Semester 6 & 8 (NC) — Complete Study Guide, December 2026</title>
<style>
:root{--ink:#1d2433;--muted:#5b6b85;--navy:#14284b;--navy2:#22406f;--gold:#c9a227;--bg:#f5f7fb;--card:#fff;--line:#dfe5ef;
--hi:#c62828;--hib:#fde2e1;--me:#a86b00;--meb:#fff1cc;--lo:#2e7d32;--lob:#e3f1e5;--co:#4b5a73;--cob:#e8ecf3}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
a{color:var(--navy2)}button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header.top .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap;cursor:pointer}header.top .brand span{color:var(--gold)}
#menuBtn{display:none;background:none;border:1px solid #4a6390;color:#fff;border-radius:6px;padding:4px 10px}
.searchbox{flex:1;min-width:140px;max-width:520px;margin-left:auto;position:relative}
.searchbox input{width:100%;padding:8px 12px;border-radius:8px;border:0;font:inherit}
.by{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}.by img{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}.top .pbtn{background:var(--gold);color:#14284b;border:0;border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav.side{width:270px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
nav.side h4{margin:14px 8px 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
nav.side a{display:block;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14px}
nav.side a:hover{background:#eef3fb}nav.side a.on{background:var(--navy);color:#fff}
nav.side a small{display:block;color:inherit;opacity:.7;font-size:11.5px}
main{flex:1;min-width:0;padding:22px clamp(14px,3vw,36px) 60px;max-width:1150px}
h1{color:var(--navy);font-size:26px;margin:4px 0 6px}h2{color:var(--navy);font-size:20px;margin:22px 0 8px}h3{color:var(--navy);font-size:16.5px}
.sub{color:var(--muted);margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{border-color:var(--navy2);box-shadow:0 3px 12px rgba(20,40,75,.08)}
.card .code{font-weight:700;color:var(--gold)}.card .t{font-weight:600;color:var(--navy);margin:2px 0 6px}
.kpi{font-size:28px;font-weight:700;color:var(--navy)}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted)}
.bar{height:7px;background:#e9edf4;border-radius:5px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--lo)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tabs button{background:none;border:0;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px;margin-right:4px;vertical-align:1px}
.p-High{background:var(--hib);color:var(--hi)}.p-Medium{background:var(--meb);color:var(--me)}.p-Low{background:var(--lob);color:var(--lo)}.p-Coverage{background:var(--cob);color:var(--co)}
.rep{background:var(--navy);color:#fff}.ty{background:#eef3fb;color:#2c4a7c}.cat{background:#fff;color:var(--navy);border:1px solid #9fb3d1}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.filters select,.filters input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px;background:#fff}
.filters label{font-size:14px;display:flex;align-items:center;gap:5px}
details.qa{background:#fff;border:1px solid var(--line);border-left:5px solid #3b5b8c;border-radius:9px;margin:10px 0;overflow:hidden}
details.qa.High{border-left-color:var(--hi)}details.qa.Medium{border-left-color:#e0a100}details.qa.Coverage{border-left-color:#8592a8}details.qa.Low{border-left-color:var(--lo)}
details.qa summary{list-style:none;padding:11px 14px;cursor:pointer}details.qa summary::-webkit-details-marker{display:none}
details.qa summary .q{font-weight:600;color:var(--navy)}details.qa summary .m{font-size:12.5px;color:var(--muted);margin-top:4px}
details.qa .ans{padding:4px 18px 14px;border-top:1px dashed var(--line)}
details.qa.done{opacity:.8}details.qa.done summary .q:after{content:"  ✓ mastered";color:var(--lo);font-size:12px}
.mast{float:right;font-size:12.5px;margin-left:10px}
table{border-collapse:collapse;width:100%;margin:10px 0 14px;font-size:14px;background:#fff}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px}td{border-bottom:1px solid var(--line);padding:6px 9px;vertical-align:top}
tr:nth-child(even) td{background:#f8fafd}
.tblwrap{overflow-x:auto}
pre{background:#0f1b33;color:#e8eefc;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.45}
code{font-family:"Cascadia Code",Consolas,Menlo,monospace;font-size:13px;background:#eef2f8;padding:0 4px;border-radius:4px}pre code{background:none;padding:0}
.diagram{text-align:center;margin:12px 0}.diagram svg{max-width:100%;height:auto;max-height:320px}.diagram svg.dgv{max-width:min(100%,460px)}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}.box.warn{background:#fffaf0;border-color:#e2b93b}
.check li{list-style:none;margin:6px 0}.check{padding-left:4px}
.result{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:8px 0;cursor:pointer}.result:hover{border-color:var(--navy2)}
mark{background:#ffe58a;padding:0 1px}
.countdown{font-weight:700;color:var(--hi)}
.unit-h{background:var(--navy);color:#fff;padding:7px 12px;border-radius:8px;margin:18px 0 6px;font-weight:600}
footer{color:var(--muted);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:860px){nav.side{position:fixed;left:-290px;top:52px;z-index:30;transition:.2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}nav.side.open{left:0}#menuBtn{display:block}header.top .brand{font-size:14px}header.top .long{display:none}.by span{display:none}.by{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}.by img{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}.top .pbtn{display:none}}
@media print{.noteswrap .unit-h{break-before:auto}header.top,nav.side,.filters,.tabs,.mast,.noprint{display:none!important}main{max-width:none;padding:0}body{background:#fff;font-size:11pt}
details.qa{break-inside:auto;border:1px solid #ccc}details.qa .ans{display:block!important}pre{white-space:pre-wrap}.card{break-inside:avoid}h2,h3{break-after:avoid}}
</style></head><body>

<script>
const DATA = {"subjects": [{"code": "IT 248", "id": "IT248", "title": "IT Entrepreneurship and Management", "sem": 8, "exam": "2026-12-01", "official": "IT 248: IT Entrepreneurship and Management (syllabus); printed as 'IT 248: Entrepreneurship and Management' on the TU Model Question 2026", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, Office of the Dean, dated November 2025) — 3 credit hours, 48 lecture hours", "note": "Routine and syllabus agree on code IT 248. The TU Model Question 2026 header drops the word 'IT' ('Entrepreneurship and Management'). Same course; no action needed.", "marks": "Full Marks 100, Pass 50, 3 hrs (TU Model Question 2026). Group A 10×2=20 (all) · Group B 6×5=30 (any 6 of Q11–17) · Group C 3×10=30 (any 3 of Q18–21) · Group D 1×20 case (Q22).", "objectives": "Equip students to launch and manage IT-based startups through case studies and experiential projects, building practical understanding of the challenges and opportunities in the ICT sector.", "units": [{"n": 1, "t": "Foundations of Entrepreneurship", "lh": 6, "topics": "Definition and importance of entrepreneurship; types of entrepreneurs and traits of successful entrepreneurs; entrepreneurship ecosystem; role of ICT in entrepreneurship; case: e-Sewa or Khalti and their impact on fintech."}, {"n": 2, "t": "Idea Generation and Market Research", "lh": 10, "topics": "Creative thinking techniques; identifying market needs; evaluating business ideas; analysing technology trends; prototype development; target market; competitor analysis tools; consumer behaviour; case: Pathao's market entry and adaptation in Nepal."}, {"n": 3, "t": "Business Model Development and Business Planning", "lh": 10, "topics": "Business Model Canvas; revenue streams and cost structure; sustainable business models; elements of a business plan; financial projections, marketing strategy, operations plan; risk management; case: business plans of emerging Nepali tech startups."}, {"n": 4, "t": "Legal and Regulatory Framework", "lh": 6, "topics": "Nepali business laws for startups; intellectual property rights; licences and permits; basic business taxation; labour law compliance; case: legal challenges of Nepali IT startups."}, {"n": 5, "t": "Financial Management and Marketing for Startups", "lh": 10, "topics": "Startup funding sources; budgeting; cash-flow management; financial reporting requirements; marketing strategy and digital marketing; sales techniques; CRM; brand building; case: MakeMyTrip's marketing."}, {"n": 6, "t": "Leadership and Corporate Social Responsibility", "lh": 6, "topics": "Leadership styles in entrepreneurship; building and motivating teams; conflict resolution; networking; CSR; sustainability and ethical marketing; case: Tata Group CSR."}], "avail": "<p><strong>No actual NC examination paper exists for IT 248.<\/strong> The BIM 8th-semester NC courses were first published in November 2025, and the TU Model Question 2026 is marked <em>\"Only for 2021 AD admitted — Regular\"<\/em>. December 2026 is therefore the <strong>first<\/strong> sitting of this course. Frequency analysis across real exams is impossible (<strong>insufficient data<\/strong>). The only official signal is the TU Model Question 2026, and for 6th-semester NC subjects TU did reuse model-question topics in the real April 2025 papers (see the Repeated-Question Report), so the model paper is the best available guide — not a guarantee.<\/p>\n<p>The old-course paper <em>IT 229: IT Entrepreneurship and Supply Chain Management<\/em> (2017 syllabus) is <strong>OC<\/strong> and has deliberately <strong>not<\/strong> been used.<\/p>", "pattern": "<p><strong>Question-type pattern (TU Model Question 2026 only — one paper, so treat as indicative):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Count<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Definitions<\/td>\n<td>10<\/td>\n<td>Group A<\/td>\n<\/tr>\n<tr>\n<td>Explanations / \"explain the role of\"<\/td>\n<td>6<\/td>\n<td>Group B<\/td>\n<\/tr>\n<tr>\n<td>Lists + explain (\"explain any three\")<\/td>\n<td>2<\/td>\n<td>Q18, Q19<\/td>\n<\/tr>\n<tr>\n<td>Two-part combined questions<\/td>\n<td>2<\/td>\n<td>Q20, Q21<\/td>\n<\/tr>\n<tr>\n<td>Nepal-based case (ride-sharing / Pathao)<\/td>\n<td>1<\/td>\n<td>Q22 (20 marks)<\/td>\n<\/tr>\n<tr>\n<td>Numerical<\/td>\n<td>0<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Unit spread in the model:<\/strong> Unit 1: 3 · Unit 2: 6 (incl. 20-mark case) · Unit 3: 2 · Unit 4: 2 · Unit 5: 5 · Unit 6: 4. Units 2 and 5 carry the most weight. The case is built on a syllabus case study (Pathao), so expect the real case to draw on one of the named syllabus cases: e-Sewa/Khalti, Pathao, Nepali tech startups, MakeMyTrip or Tata CSR.<\/p>", "papers": [{"id": "M26", "label": "TU Model Question 2026", "cat": "C", "session": "Model (issued 2026)", "source": "TU FOM, 'Model Question for BITM 1st and BBA BIM and BBM 8th Semester Final.pdf'", "url": "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf", "note": "Official TU model question, not an exam paper. Wording below was retrieved through a text-extraction tool and may differ slightly from the printed PDF; marks and numbering are as printed.", "qs": [{"no": "1", "g": "A", "t": "Define entrepreneurship.", "m": 2, "u": 1}, {"no": "2", "g": "A", "t": "What is an entrepreneurship ecosystem?", "m": 2, "u": 1}, {"no": "3", "g": "A", "t": "Mention any two creative-thinking techniques.", "m": 2, "u": 2}, {"no": "4", "g": "A", "t": "What is a target market?", "m": 2, "u": 2}, {"no": "5", "g": "A", "t": "What is the Business Model Canvas?", "m": 2, "u": 3}, {"no": "6", "g": "A", "t": "What are intellectual property rights (IPR)?", "m": 2, "u": 4}, {"no": "7", "g": "A", "t": "Mention any two sources of startup funding.", "m": 2, "u": 5}, {"no": "8", "g": "A", "t": "What is digital marketing?", "m": 2, "u": 5}, {"no": "9", "g": "A", "t": "What is a leadership style?", "m": 2, "u": 6}, {"no": "10", "g": "A", "t": "What is corporate social responsibility (CSR)?", "m": 2, "u": 6}, {"no": "11", "g": "B", "t": "Explain three key characteristics of successful entrepreneurs.", "m": 5, "u": 1}, {"no": "12", "g": "B", "t": "How do you identify market needs for a new IT idea?", "m": 5, "u": 2}, {"no": "13", "g": "B", "t": "Write a short note on competitor analysis.", "m": 5, "u": 2}, {"no": "14", "g": "B", "t": "Explain the role of trend analysis in idea generation.", "m": 5, "u": 2}, {"no": "15", "g": "B", "t": "Explain the basics of taxation for IT startups in Nepal.", "m": 5, "u": 4}, {"no": "16", "g": "B", "t": "Explain the role of CRM in startups.", "m": 5, "u": 5}, {"no": "17", "g": "B", "t": "Explain conflict-resolution techniques within a team.", "m": 5, "u": 6}, {"no": "18", "g": "C", "t": "What are the sources of startup funding? Explain any three.", "m": 10, "u": 5}, {"no": "19", "g": "C", "t": "Explain the leadership styles used in startups.", "m": 10, "u": 6}, {"no": "20", "g": "C", "t": "How can employees be motivated in startups? Also explain digital marketing and sales techniques.", "m": 10, "u": 5}, {"no": "21", "g": "C", "t": "Discuss ethical marketing strategies. What are the essential elements of a business plan?", "m": 10, "u": 3}, {"no": "22", "g": "D", "t": "Case: You are the promotion manager of a new ride-sharing app in Nepal similar to Pathao. (a) Steps for idea generation (b) How will you analyse the market? (c) How will you ensure rider benefit and trust? (d) What complexities may arise from Nepal's policies and laws?", "m": 20, "u": 2}]}], "notes": {"1": "<h3>1.1 Definition of entrepreneurship<\/h3>\n<p>Entrepreneurship is the process of <strong>spotting an opportunity, organising resources (money, people, technology) and taking risk<\/strong> to create a new venture that creates value. The word comes from the French <em>entreprendre<\/em> — \"to undertake\".<\/p>\n<ul>\n<li><strong>Schumpeter:<\/strong> the entrepreneur is an <em>innovator<\/em> who brings \"creative destruction\" — new products, methods, markets, sources of supply or organisation.<\/li>\n<li><strong>Drucker:<\/strong> the entrepreneur searches for change, responds to it and exploits it as an opportunity.<\/li>\n<\/ul>\n<h3>1.2 Importance of entrepreneurship<\/h3>\n<ul>\n<li><strong>Job creation<\/strong> — new firms absorb youth who might otherwise migrate abroad.<\/li>\n<li><strong>Innovation<\/strong> — new products and processes (digital payments, ride-hailing).<\/li>\n<li><strong>Economic growth and GDP<\/strong> — new output, exports and tax revenue.<\/li>\n<li><strong>Use of idle resources<\/strong> — local talent, capital and raw materials.<\/li>\n<li><strong>Balanced regional development<\/strong> — businesses outside big cities.<\/li>\n<li><strong>Better standard of living<\/strong> — cheaper, better and more convenient goods and services.<\/li>\n<li><strong>Social change<\/strong> — role models, empowerment of women and youth.<\/li>\n<\/ul>\n<h3>1.3 Types of entrepreneurs<\/h3>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Types<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Innovation (Danhof)<\/td>\n<td>Innovative · Imitative · Fabian (cautious) · Drone (refuses change)<\/td>\n<\/tr>\n<tr>\n<td>Motive<\/td>\n<td>Commercial · Social<\/td>\n<\/tr>\n<tr>\n<td>Ownership<\/td>\n<td>Private · Intrapreneur (inside a company) · Corporate<\/td>\n<\/tr>\n<tr>\n<td>Scale/goal<\/td>\n<td>Small-business/lifestyle · Scalable startup<\/td>\n<\/tr>\n<tr>\n<td>Technology<\/td>\n<td>Technopreneur · Traditional<\/td>\n<\/tr>\n<tr>\n<td>Gender/others<\/td>\n<td>Women entrepreneur · Rural entrepreneur<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>1.4 Traits of successful entrepreneurs<\/h3>\n<p>Vision · opportunity seeking · calculated risk-taking · persistence and resilience · creativity · leadership · self-confidence · need for achievement (McClelland) · tolerance for ambiguity · customer focus · financial discipline · networking ability.<\/p>\n<h3>1.5 Entrepreneurship ecosystem<\/h3>\n<p>The network of <strong>policy, finance, markets, human capital, support organisations, infrastructure and culture<\/strong> that enables startups (Isenberg's model).<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"38.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.8749537379655\" y2=\"94.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.87495373796554\" y2=\"205.99999999999997\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"262.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"206.00000000000003\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"93.99999999999999\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><ellipse cx=\"260.0\" cy=\"150.0\" rx=\"78\" ry=\"30\" fill=\"#3b5b8c\"/><text x=\"260.0\" y=\"154.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">Ecosystem<\/text><rect x=\"198.0\" y=\"21.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Policy<\/text><rect x=\"366.8749537379655\" y=\"77.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.8749537379655\" y=\"98.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Finance<\/text><rect x=\"366.87495373796554\" y=\"188.99999999999997\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.87495373796554\" y=\"209.99999999999997\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Culture<\/text><rect x=\"198.0\" y=\"245.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Supports<\/text><rect x=\"29.125046262034488\" y=\"189.00000000000003\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"210.00000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Human capital<\/text><rect x=\"29.125046262034488\" y=\"76.99999999999999\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"97.99999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Markets<\/text><\/svg><\/div>\n\n<p>Nepal: OCR and Department of Industry (policy), banks and VC/PE funds (finance), incubators and co-working spaces (support), engineering and BIM graduates (talent), a growing digital-payments infrastructure.<\/p>\n<h3>1.6 Role of ICT in entrepreneurship<\/h3>\n<p>ICT <strong>creates new business models<\/strong> (apps, platforms, SaaS), <strong>lowers entry costs<\/strong> (cloud, social media), enables <strong>digital marketing<\/strong>, <strong>e-payments<\/strong>, <strong>remote teams<\/strong>, <strong>data-driven decisions<\/strong> and <strong>global reach<\/strong> (IT outsourcing, freelancing).<\/p>\n<h3>1.7 Case: e-Sewa / Khalti and fintech<\/h3>\n<ul>\n<li><strong>Problem:<\/strong> a cash-based economy, queues for bills, limited banking reach.<\/li>\n<li><strong>Solution:<\/strong> mobile wallets licensed by Nepal Rastra Bank as Payment Service Providers — bill pay, top-up, transfers, QR merchant payments, tickets.<\/li>\n<li><strong>Impact:<\/strong> financial inclusion, convenience, digital records, a base for e-commerce.<\/li>\n<li><strong>Lessons:<\/strong> regulatory compliance, partnerships with banks and billers, trust and security, network effects (more merchants ↔ more users).<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> definition (opportunity + resources + risk) · 7 importance points · Danhof types · 10 traits · six ecosystem pillars · ICT roles · e-Sewa/Khalti lessons.<\/p>", "2": "<h3>2.1 Creative thinking techniques<\/h3>\n<p><strong>Creativity<\/strong> is generating novel and useful ideas.<\/p>\n<ul>\n<li><strong>Brainstorming<\/strong> — quantity first, no criticism.<\/li>\n<li><strong>Mind mapping<\/strong> — branch ideas from a central problem.<\/li>\n<li><strong>SCAMPER<\/strong> — Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse.<\/li>\n<li><strong>Six Thinking Hats<\/strong> (de Bono) — look at a problem from six perspectives.<\/li>\n<li><strong>Design thinking<\/strong> — Empathise → Define → Ideate → Prototype → Test.<\/li>\n<li><strong>Lateral thinking, analogies, \"what if\" questions, problem inventory.<\/strong><\/li>\n<\/ul>\n<h3>2.2 Identifying market needs<\/h3>\n<p>Sources of opportunity: customer pain points · changing demographics and lifestyle · new technology · regulatory changes · gaps in competitors' offerings · unexpected events (COVID → telemedicine). Methods: observation, interviews, surveys, social listening, search trends, app reviews, MVP tests.<\/p>\n<h3>2.3 Evaluating business ideas<\/h3>\n<p><strong>Feasibility analysis:<\/strong> <em>product/service<\/em> feasibility (desirability, demand) · <em>industry/market<\/em> feasibility (size, growth, attractiveness) · <em>organisational<\/em> feasibility (skills, resources) · <em>financial<\/em> feasibility (capital, returns). Tools: SWOT, scoring matrix, break-even analysis, the desirable–feasible–viable test.<\/p>\n<h3>2.4 Analysing technology trends<\/h3>\n<p>Trend analysis studies patterns over time to spot opportunities: AI and automation, cloud/SaaS, mobile-first services, fintech, e-commerce, edtech, healthtech, IoT, green tech. Tools: Google Trends, Gartner hype cycle, industry reports, PESTEL.<\/p>\n<h3>2.5 Prototype development<\/h3>\n<p>A <strong>prototype<\/strong> is an early model for testing. Levels: sketch/wireframe → mock-up (Figma) → functional prototype → <strong>MVP<\/strong>. Benefits: cheap learning, user feedback, investor demos. <em>Lean startup<\/em> loop: <strong>Build → Measure → Learn<\/strong>, then pivot or persevere.<\/p>\n<h3>2.6 Target market<\/h3>\n<p>Process <strong>STP<\/strong>: <em>Segmentation<\/em> (demographic, geographic, psychographic, behavioural) → <em>Targeting<\/em> (choose attractive segments) → <em>Positioning<\/em> (distinct place in customers' minds). Market sizing: <strong>TAM<\/strong> (total addressable) → <strong>SAM<\/strong> (serviceable) → <strong>SOM<\/strong> (obtainable).<\/p>\n<h3>2.7 Competitor analysis tools<\/h3>\n<p>SWOT · Porter's Five Forces · feature/price comparison matrix · perceptual (positioning) map · competitor profiling · digital tools (SimilarWeb, SEMrush, app-store analytics).<\/p>\n<h3>2.8 Consumer behaviour<\/h3>\n<p>How consumers choose, buy, use and dispose of products. <strong>Influences:<\/strong> cultural, social (family, reference groups), personal (age, income, lifestyle), psychological (motivation, perception, attitude). <strong>Buying process:<\/strong> need recognition → information search → evaluation of alternatives → purchase → post-purchase behaviour.<\/p>\n<h3>2.9 Case: Pathao in Nepal<\/h3>\n<p>Entered with <strong>bike ride-hailing<\/strong> to address traffic and unreliable public transport, then expanded to food, parcels and payments. <strong>Adaptations:<\/strong> cash payments, local pricing, helmets for riders, rider verification, a bike-first model suited to narrow roads. <strong>Challenges:<\/strong> regulation of private vehicles for commercial use, opposition from transport syndicates, safety and trust.<\/p>\n<p><strong>Key points:<\/strong> creative techniques · feasibility (product, market, organisation, finance) · trend tools · MVP + lean loop · STP and TAM/SAM/SOM · competitor tools · buying process · Pathao adaptations.<\/p>", "3": "<h3>3.1 Business Model Canvas (BMC)<\/h3>\n<p>A one-page tool by Osterwalder &amp; Pigneur with <strong>nine blocks<\/strong>:\n| Left (efficiency) | Centre | Right (value) |\n|---|---|---|\n| Key partners · Key activities · Key resources | <strong>Value proposition<\/strong> | Customer relationships · Channels · Customer segments |\n| <strong>Cost structure<\/strong> (bottom left) | | <strong>Revenue streams<\/strong> (bottom right) |\nThe <strong>Lean Canvas<\/strong> (Ash Maurya) replaces some blocks with Problem, Solution, Key metrics and Unfair advantage — useful for startups.<\/p>\n<h3>3.2 Revenue streams and cost structure<\/h3>\n<p><strong>Revenue models:<\/strong> sales · subscription · freemium · commission/transaction fee · advertising · licensing · pay-per-use · data services.\n<strong>Cost structure:<\/strong> fixed vs variable costs; economies of scale and scope; cost-driven vs value-driven businesses. <strong>Unit economics:<\/strong> CAC (customer acquisition cost) vs LTV (lifetime value); LTV/CAC above about 3 is healthy.<\/p>\n<h3>3.3 Sustainable business models<\/h3>\n<p>Models that create <strong>economic, social and environmental value<\/strong> (triple bottom line): circular economy (reuse, recycle), sharing economy, product-as-a-service, social enterprises, inclusive fintech.<\/p>\n<h3>3.4 Elements of a business plan<\/h3>\n<p>Executive summary · company description · products/services · market analysis · competitive analysis · marketing and sales plan · operations plan · management team · financial plan · risk analysis · appendices.\n<strong>Purposes:<\/strong> a roadmap for founders, a document to raise funds, and a benchmark for measuring performance.<\/p>\n<h3>3.5 Financial projections<\/h3>\n<p>Start-up cost budget · sales forecast · projected income statement · cash-flow statement · balance sheet · <strong>break-even point<\/strong> = Fixed cost ÷ (Price − Variable cost per unit). <em>Example:<\/em> FC Rs 600,000, price Rs 500, VC Rs 300 → BEP = 3,000 units.<\/p>\n<h3>3.6 Marketing strategy and operational planning<\/h3>\n<p>Marketing mix <strong>4Ps/7Ps<\/strong> (product, price, place, promotion, people, process, physical evidence), go-to-market plan, digital channels. Operations plan: location, technology stack, suppliers, processes, milestones, staffing.<\/p>\n<h3>3.7 Risk management<\/h3>\n<p>Risk types: market · technology · financial · legal/regulatory · operational · people. Process: identify → assess (likelihood × impact) → respond (<strong>avoid, reduce, transfer, accept<\/strong>) → monitor. Tools: risk register, contingency fund, insurance, contracts.<\/p>\n<h3>3.8 Case: business plans of Nepali tech startups<\/h3>\n<p>Typical features: digital solutions for local problems (payments, delivery, edtech, agritech); low-cost MVPs; bootstrapping or angel funding; heavy reliance on social-media marketing; challenges in foreign payments, regulation and scaling.<\/p>\n<p><strong>Key points:<\/strong> BMC nine blocks · revenue models · LTV/CAC · triple bottom line · 11 plan elements · BEP formula · 7Ps · four risk responses.<\/p>", "4": "<h3>4.1 Nepali business laws for startups<\/h3>\n<table>\n<thead>\n<tr>\n<th>Law<\/th>\n<th>Relevance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Companies Act, 2063 (2006)<\/td>\n<td>Company registration at OCR; private/public limited<\/td>\n<\/tr>\n<tr>\n<td>Private Firm Registration Act, 2014 BS / Partnership Act, 2020 BS<\/td>\n<td>Sole proprietorships and partnerships<\/td>\n<\/tr>\n<tr>\n<td>Industrial Enterprises Act, 2076 (2020)<\/td>\n<td>Industry registration, incentives, CSR obligations<\/td>\n<\/tr>\n<tr>\n<td>Foreign Investment and Technology Transfer Act, 2075 (2019)<\/td>\n<td>Foreign investment and technology agreements<\/td>\n<\/tr>\n<tr>\n<td>Electronic Transactions Act, 2063 (2008)<\/td>\n<td>E-records, digital signatures, cybercrime<\/td>\n<\/tr>\n<tr>\n<td>Individual Privacy Act, 2075 (2018)<\/td>\n<td>Personal-data protection<\/td>\n<\/tr>\n<tr>\n<td>Consumer Protection Act, 2075<\/td>\n<td>Fair dealing with consumers<\/td>\n<\/tr>\n<tr>\n<td>Competition Promotion and Market Protection Act, 2063<\/td>\n<td>Anti-cartel, fair competition<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>4.2 Intellectual property rights (IPR)<\/h3>\n<p>Legal rights over creations of the mind. <strong>Copyright<\/strong> (Copyright Act, 2059 — software, content) · <strong>Trademark<\/strong> (Patent, Design and Trademark Act, 2022 BS — registered at the Department of Industry) · <strong>Patent<\/strong> (inventions) · <strong>Industrial design<\/strong> · <strong>Trade secret<\/strong> (protected by NDAs). Startups should register their brand early and use contracts that assign IP from employees and freelancers.<\/p>\n<h3>4.3 Licences and permits<\/h3>\n<p>Company registration certificate · PAN/VAT certificate · local ward/municipality business registration · sector licences (NRB for payments, NTA for telecom/ISP, Department of Tourism for travel, Department of Commerce for trade) · environmental clearance where applicable · renewal and annual returns.<\/p>\n<h3>4.4 Basic business taxation<\/h3>\n<p><strong>PAN<\/strong> (mandatory) · <strong>VAT<\/strong> (registration above the threshold) · <strong>corporate income tax<\/strong> (Income Tax Act, 2058; concessions for IT and exports set by annual Finance Acts) · <strong>TDS<\/strong> on salaries, rent, services · monthly/periodic VAT and TDS returns · annual tax return and audit · Social Security Fund contributions.<\/p>\n<h3>4.5 Labour law compliance<\/h3>\n<p><strong>Labour Act, 2074<\/strong>: written employment contracts, working hours and overtime, minimum wage, leave, gratuity, occupational safety, no discrimination; <strong>Social Security Act, 2075<\/strong> contributions; <strong>Bonus Act<\/strong>; rules for foreign employees (work permits).<\/p>\n<h3>4.6 Case: legal challenges of Nepali IT startups<\/h3>\n<p>Unclear rules for new models (ride-sharing, digital lending, crypto — crypto is banned by NRB) · difficulty receiving and sending foreign payments (PayPal not available; foreign-exchange controls) · high minimum thresholds for foreign investment · slow registration and licensing · tax ambiguity on digital services · weak IP enforcement.<\/p>\n<p><strong>Key points:<\/strong> eight laws with years · five IPR types · licence list · PAN, VAT, income tax, TDS · Labour Act essentials · six legal challenges.<\/p>", "5": "<h3>5.1 Startup funding sources<\/h3>\n<p>Bootstrapping · friends and family · angel investors · venture capital · private equity · bank loans (including subsidised schemes) · crowdfunding · grants and competitions · incubators/accelerators · corporate venture capital · revenue-based financing.\n<strong>Funding stages:<\/strong> pre-seed → seed → Series A → B → C → IPO or acquisition (exit).\n<strong>Equity vs debt:<\/strong> equity = no repayment but dilution of ownership; debt = keeps control but needs repayment and collateral.<\/p>\n<h3>5.2 Budgeting for new ventures<\/h3>\n<p>Start-up budget (one-time: registration, equipment, development) · operating budget (monthly salaries, rent, cloud, marketing) · cash budget · zero-based budgeting · variance analysis (budget vs actual).<\/p>\n<h3>5.3 Cash-flow management<\/h3>\n<p><strong>Cash is king<\/strong> — profitable startups can still fail from cash shortages. <strong>Burn rate<\/strong> = monthly net cash outflow; <strong>runway<\/strong> = cash ÷ burn rate. Tips: collect receivables fast, delay payables ethically, lease instead of buy, keep a reserve, forecast weekly.<\/p>\n<h3>5.4 Financial reporting requirements<\/h3>\n<p>Books of accounts under NFRS/NAS for SMEs · income statement, balance sheet, cash-flow statement · statutory audit for companies · annual return to OCR · tax returns to IRD · investor reports.<\/p>\n<h3>5.5 Marketing strategy development and digital marketing<\/h3>\n<p>Marketing strategy: define the target → value proposition → positioning → marketing mix → budget → metrics.\n<strong>Digital marketing channels:<\/strong> SEO, SEM/PPC, social media, content, email, influencer, affiliate, mobile/SMS. <strong>Metrics:<\/strong> reach, CTR, conversion rate, CAC, ROAS, retention. <strong>Growth hacking:<\/strong> low-cost creative tactics (referrals, virality).<\/p>\n<h3>5.6 Sales techniques<\/h3>\n<p>Consultative selling · solution selling · SPIN selling (Situation, Problem, Implication, Need-payoff) · demos and free trials · AIDA funnel · upselling and cross-selling · referral programmes · B2B account management.<\/p>\n<h3>5.7 Customer relationship management (CRM)<\/h3>\n<p>Strategy and software to manage customer interactions: contact management, sales pipeline, marketing automation, support tickets, analytics. Benefits: retention, personalisation, higher lifetime value.<\/p>\n<h3>5.8 Brand building<\/h3>\n<p>Brand = name, logo, promise and experience. Steps: purpose and values → identity (name, logo, colours, tone) → consistent customer experience → storytelling and content → community and reviews → brand equity (Aaker: awareness, perceived quality, associations, loyalty).<\/p>\n<h3>5.9 Case: MakeMyTrip<\/h3>\n<p>Online-first travel booking; built trust through secure payments and support; heavy digital marketing and search presence; offers and loyalty programmes; mobile-app focus; expanded from flights to hotels, buses and holidays. <strong>Lesson:<\/strong> digital marketing + trust + continuous expansion.<\/p>\n<p><strong>Key points:<\/strong> funding sources and stages · equity vs debt · budgets · burn rate/runway · reporting duties · digital channels and metrics · SPIN/AIDA · CRM · brand equity · MakeMyTrip lessons.<\/p>", "6": "<h3>6.1 Leadership styles in entrepreneurship<\/h3>\n<p>Autocratic · democratic/participative · laissez-faire · transformational (vision and inspiration) · transactional (rewards and penalties) · servant · charismatic · situational (Hersey–Blanchard: telling, selling, participating, delegating — chosen by follower readiness).<\/p>\n<h3>6.2 Building and motivating teams<\/h3>\n<p><strong>Team building:<\/strong> hire for complementary skills and culture fit; clear roles and goals; trust; communication. <strong>Tuckman's stages:<\/strong> forming → storming → norming → performing (→ adjourning).\n<strong>Motivation theories:<\/strong> Maslow (needs hierarchy) · Herzberg (hygiene vs motivators) · McClelland (achievement, affiliation, power) · Vroom (expectancy). <strong>Practices:<\/strong> ESOPs, recognition, autonomy, learning, flexible work, a clear mission.<\/p>\n<h3>6.3 Conflict resolution<\/h3>\n<p>Sources: limited resources, role ambiguity, personality clashes, goal differences. <strong>Thomas–Kilmann modes:<\/strong> competing · collaborating · compromising · avoiding · accommodating. Steps: listen → identify the issue → focus on interests → generate options → agree → follow up.<\/p>\n<h3>6.4 Networking skills<\/h3>\n<p>Building professional relationships for customers, investors, mentors and talent: events, hackathons, LinkedIn, alumni networks, industry associations; give value first; follow up.<\/p>\n<h3>6.5 Corporate social responsibility (CSR)<\/h3>\n<p>A firm's voluntary commitment to society beyond profit. <strong>Carroll's pyramid:<\/strong> economic → legal → ethical → philanthropic. <strong>Stakeholder theory:<\/strong> consider employees, customers, community and environment. Nepal: the Industrial Enterprises Act, 2076 requires certain industries to allocate profit to CSR.<\/p>\n<h3>6.6 Sustainability practices and ethical marketing<\/h3>\n<p>Sustainability: energy efficiency, e-waste recycling, paperless operations, inclusive hiring (ESG). <strong>Ethical marketing:<\/strong> truthful ads, no dark patterns, data consent, fair pricing, respecting vulnerable groups, transparency with influencers.<\/p>\n<h3>6.7 Case: Tata Group CSR<\/h3>\n<p>Tata Sons is majority-owned by philanthropic trusts, so profits fund education, healthcare, rural development and research institutions; it is known for employee welfare and community programmes. <strong>Lesson:<\/strong> CSR built into ownership and culture creates long-term trust and brand value.<\/p>\n<p><strong>Key points:<\/strong> leadership styles + situational model · Tuckman · four motivation theories · Thomas–Kilmann modes · networking · Carroll's pyramid · ESG and ethical marketing · Tata.<\/p>"}, "qa": [{"id": "IT248-01", "t": "Entrepreneurship: meaning and importance", "u": 1, "q": "Define entrepreneurship. Explain its importance, with reference to Nepal.", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"M26": "Q1"}, "rep": false, "src": "TU Model Question 2026 Q1", "a": "<p><strong>Entrepreneurship<\/strong> is the process of identifying an opportunity, mobilising resources and taking risk to create a new venture that delivers value to customers and earns profit. An <strong>entrepreneur<\/strong> is the person who does this.<\/p>\n<p><strong>Importance<\/strong><\/p>\n<ul>\n<li><strong>Employment creation:<\/strong> startups hire young people and reduce dependence on foreign labour migration.<\/li>\n<li><strong>Innovation:<\/strong> new products and processes (for example digital wallets replacing cash queues).<\/li>\n<li><strong>Economic growth and tax revenue:<\/strong> new firms add output and widen the tax base.<\/li>\n<li><strong>Use of local resources and talent:<\/strong> IT services can be exported without physical transport costs.<\/li>\n<li><strong>Social change:<\/strong> better access to services such as payments, transport and education.<\/li>\n<li><strong>Balanced regional development:<\/strong> digital businesses can operate outside Kathmandu.<\/li>\n<\/ul>\n<p><strong>Nepal example:<\/strong> e-Sewa and Khalti turned mobile phones into payment tools, enabling bill payment, transfers and merchant QR payments, and created a whole fintech ecosystem around them.<\/p>\n<p><strong>Conclusion:<\/strong> entrepreneurship turns ideas into jobs, products and growth, which is why the ecosystem around it matters.<\/p>"}, {"id": "IT248-02", "t": "Characteristics / traits of successful entrepreneurs", "u": 1, "q": "Explain three key characteristics of successful entrepreneurs.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q11"}, "rep": false, "src": "TU Model Question 2026 Q11", "a": "<p>Successful entrepreneurs share some recognisable traits:<\/p>\n<ol>\n<li><strong>Opportunity orientation / vision<\/strong> – they see unmet needs (e.g. the absence of reliable on-demand transport) and imagine a solution.<\/li>\n<li><strong>Calculated risk-taking<\/strong> – they accept uncertainty but reduce it through research, prototypes and staged investment.<\/li>\n<li><strong>Persistence and resilience<\/strong> – early products often fail; they learn and pivot instead of quitting.<\/li>\n<li><strong>Creativity and innovation<\/strong> – they combine existing technologies in new ways.<\/li>\n<li><strong>Leadership and team building<\/strong> – they attract co-founders and employees and keep them motivated.<\/li>\n<li><strong>Customer focus<\/strong> – they test ideas with users and listen to feedback.<\/li>\n<li><strong>Financial discipline<\/strong> – they track cash flow closely because startups die when cash runs out.<\/li>\n<\/ol>\n<p><em>For 5 marks, explain three traits properly (2–3 lines each, with an example) rather than listing seven.<\/em><\/p>"}, {"id": "IT248-03", "t": "Types of entrepreneurs", "u": 1, "q": "Explain the different types of entrepreneurs.", "m": 5, "p": "Coverage", "ty": "Classification", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Types<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Innovation<\/td>\n<td><strong>Innovative<\/strong><\/td>\n<td>Introduces new products or methods (first digital wallet)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Imitative / adoptive<\/strong><\/td>\n<td>Copies successful ideas and adapts them locally (ride-sharing in Nepal)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Fabian<\/strong><\/td>\n<td>Cautious; changes only when forced<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Drone<\/strong><\/td>\n<td>Refuses to change even at a loss<\/td>\n<\/tr>\n<tr>\n<td>Motive<\/td>\n<td><strong>Social entrepreneur<\/strong><\/td>\n<td>Primary aim is social impact<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Commercial<\/strong><\/td>\n<td>Primary aim is profit<\/td>\n<\/tr>\n<tr>\n<td>Ownership<\/td>\n<td><strong>Intrapreneur<\/strong><\/td>\n<td>Innovates inside an existing company<\/td>\n<\/tr>\n<tr>\n<td>Scale<\/td>\n<td><strong>Small-business / lifestyle<\/strong><\/td>\n<td>Aims for stable income<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Scalable startup<\/strong><\/td>\n<td>Aims for rapid growth with investors<\/td>\n<\/tr>\n<tr>\n<td>Technology<\/td>\n<td><strong>Technopreneur<\/strong><\/td>\n<td>Builds a business around technology (IT startups)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT248-04", "t": "Entrepreneurship ecosystem", "u": 1, "q": "What is an entrepreneurship ecosystem? Explain its components in the Nepali context.", "m": 5, "p": "High", "ty": "Explanation + diagram", "seen": {"M26": "Q2"}, "rep": false, "src": "TU Model Question 2026 Q2", "a": "<p>An <strong>entrepreneurship ecosystem<\/strong> is the network of people, institutions, policies, finance and culture that together determine how easily new ventures can start and grow.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"38.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.8749537379655\" y2=\"94.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.87495373796554\" y2=\"205.99999999999997\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"262.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"206.00000000000003\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"93.99999999999999\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><ellipse cx=\"260.0\" cy=\"150.0\" rx=\"78\" ry=\"30\" fill=\"#3b5b8c\"/><text x=\"260.0\" y=\"147.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">Startup<\/text><text x=\"260.0\" y=\"161.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">ecosystem<\/text><rect x=\"198.0\" y=\"21.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"35.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Policy &amp;<\/text><text x=\"260.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">regulation<\/text><rect x=\"366.8749537379655\" y=\"77.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.8749537379655\" y=\"91.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Finance (angels,<\/text><text x=\"428.8749537379655\" y=\"104.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">VC, banks)<\/text><rect x=\"366.87495373796554\" y=\"188.99999999999997\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.87495373796554\" y=\"203.49999999999997\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Markets &amp;<\/text><text x=\"428.87495373796554\" y=\"216.49999999999997\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">customers<\/text><rect x=\"198.0\" y=\"245.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"259.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Human capital &amp;<\/text><text x=\"260.0\" y=\"272.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">universities<\/text><rect x=\"29.125046262034488\" y=\"189.00000000000003\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"203.50000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Support<\/text><text x=\"91.12504626203449\" y=\"216.50000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(incubators,<\/text><rect x=\"29.125046262034488\" y=\"76.99999999999999\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"97.99999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Culture &amp; networks<\/text><\/svg><\/div>\n\n<p><strong>Components<\/strong><\/p>\n<ul>\n<li><strong>Policy and government:<\/strong> company registration (OCR), the Department of Industry, tax rules, startup-support policies and loan schemes.<\/li>\n<li><strong>Finance:<\/strong> personal savings, family, angel investors, venture capital and private equity funds, bank loans, crowdfunding.<\/li>\n<li><strong>Markets:<\/strong> domestic customers, export markets for IT services.<\/li>\n<li><strong>Human capital:<\/strong> universities (e.g. BIM, BSc CSIT graduates), skilled developers.<\/li>\n<li><strong>Support organisations:<\/strong> incubators, accelerators, co-working spaces, mentors, hackathons.<\/li>\n<li><strong>Culture:<\/strong> social attitude towards risk and failure, role-model founders.<\/li>\n<li><strong>Infrastructure:<\/strong> internet, digital payments, electricity.<\/li>\n<\/ul>\n<p>A strong ecosystem lowers the cost and risk of starting a business.<\/p>"}, {"id": "IT248-05", "t": "Role of ICT in entrepreneurship; e-Sewa/Khalti case", "u": 1, "q": "Explain the role of ICT in entrepreneurship with reference to e-Sewa or Khalti.", "m": 10, "p": "Medium", "ty": "Explanation + case", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>ICT lowers the cost of starting, operating and scaling a business.<\/strong><\/p>\n<p><strong>Roles of ICT<\/strong><\/p>\n<ol>\n<li><strong>New business models:<\/strong> platforms, apps and marketplaces that could not exist before (digital wallets, ride-hailing).<\/li>\n<li><strong>Low-cost market entry:<\/strong> a website or app reaches the whole country without branches.<\/li>\n<li><strong>Digital marketing:<\/strong> social media and search ads target customers precisely at low cost.<\/li>\n<li><strong>Operational efficiency:<\/strong> cloud tools, accounting software, CRM.<\/li>\n<li><strong>Data-driven decisions:<\/strong> analytics on customer behaviour.<\/li>\n<li><strong>Access to finance and payments:<\/strong> online payments, crowdfunding.<\/li>\n<li><strong>Global reach:<\/strong> outsourcing and IT services exports.<\/li>\n<\/ol>\n<p><strong>Case: e-Sewa / Khalti (fintech)<\/strong><\/p>\n<ul>\n<li>Problem: cash-dependent economy, queues for utility bills, limited banking access.<\/li>\n<li>Solution: mobile wallets linked to banks, offering bill payment, top-ups, transfers, tickets and merchant QR payments.<\/li>\n<li>Impact: convenience for users, digital records for merchants, wider financial inclusion, and a base for other startups (e-commerce checkouts use wallets).<\/li>\n<li>Lessons: regulatory compliance (Nepal Rastra Bank licensing for payment service providers), partnerships with banks and billers, and building user trust and security.<\/li>\n<\/ul>\n<p><strong>Conclusion:<\/strong> ICT is both the <em>product<\/em> and the <em>tool<\/em> of modern entrepreneurship.<\/p>"}, {"id": "IT248-06", "t": "Creative thinking techniques", "u": 2, "q": "Explain creative-thinking techniques used for generating business ideas.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q3"}, "rep": false, "src": "TU Model Question 2026 Q3", "a": "<ul>\n<li><strong>Brainstorming:<\/strong> a group lists as many ideas as possible without criticism, then evaluates them.<\/li>\n<li><strong>Mind mapping:<\/strong> a central problem is written in the middle and related ideas branch out visually.<\/li>\n<li><strong>SCAMPER:<\/strong> Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse — applied to an existing product.<\/li>\n<li><strong>Design thinking:<\/strong> Empathise → Define → Ideate → Prototype → Test.<\/li>\n<li><strong>Problem inventory / pain-point analysis:<\/strong> list daily frustrations of a target group.<\/li>\n<li><strong>Lateral thinking / \"what if\" questions:<\/strong> challenge assumptions.<\/li>\n<li><strong>Analogy / borrowing models:<\/strong> apply a model from another country or industry (\"Uber for X\").<\/li>\n<\/ul>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Empathise<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Define<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Ideate<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Prototype<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Test<\/text><\/svg><\/div>\n\n<p><em>Example:<\/em> SCAMPER applied to taxis → <em>Combine<\/em> taxis with a smartphone GPS app → ride-hailing.<\/p>"}, {"id": "IT248-07", "t": "Identifying market needs and evaluating ideas", "u": 2, "q": "How do you identify market needs for a new IT idea? How are business ideas evaluated?", "m": 5, "p": "High", "ty": "Process", "seen": {"M26": "Q12"}, "rep": false, "src": "TU Model Question 2026 Q12", "a": "<p><strong>Identifying market needs<\/strong><\/p>\n<ol>\n<li>Observe customer pain points (interviews, field observation).<\/li>\n<li>Run surveys and online polls.<\/li>\n<li>Study search trends, app-store reviews and social media complaints.<\/li>\n<li>Analyse gaps in competitors' offerings.<\/li>\n<li>Talk to domain experts and potential buyers.<\/li>\n<li>Test demand with a landing page or a minimum viable product (MVP).<\/li>\n<\/ol>\n<p><strong>Evaluating an idea (screening criteria)<\/strong><\/p>\n<ul>\n<li><strong>Desirability:<\/strong> do customers really want it and will they pay?<\/li>\n<li><strong>Feasibility:<\/strong> can we build it with available technology and skills?<\/li>\n<li><strong>Viability:<\/strong> is the market large enough and the revenue model profitable?<\/li>\n<li><strong>Legal fit:<\/strong> is it allowed under Nepali law and licensing?<\/li>\n<li><strong>Competition and differentiation<\/strong><\/li>\n<li><strong>Scalability<\/strong> and <strong>risk<\/strong><\/li>\n<\/ul>\n<p>Tools: SWOT analysis, a feasibility study, a scoring matrix, MVP testing.<\/p>"}, {"id": "IT248-08", "t": "Technology trend analysis", "u": 2, "q": "Explain the role of trend analysis in idea generation.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q14"}, "rep": false, "src": "TU Model Question 2026 Q14", "a": "<p><strong>Trend analysis<\/strong> is the study of changes in technology, consumer behaviour and the market over time to predict future opportunities.<\/p>\n<p><strong>Role in idea generation<\/strong><\/p>\n<ul>\n<li><strong>Spotting emerging opportunities early<\/strong> (e.g. the rise of smartphones led to mobile apps; QR payments led to merchant fintech).<\/li>\n<li><strong>Timing market entry<\/strong> — not too early, not too late.<\/li>\n<li><strong>Avoiding declining markets.<\/strong><\/li>\n<li><strong>Understanding changing consumer behaviour<\/strong> (online shopping, remote work).<\/li>\n<li><strong>Guiding product features<\/strong> (AI chatbots, cloud-based SaaS).<\/li>\n<\/ul>\n<p><strong>Tools:<\/strong> Google Trends, industry reports, PESTEL analysis, technology hype cycles, startup databases.<\/p>\n<p><strong>Current trends relevant to Nepal:<\/strong> digital payments, e-commerce, AI and automation, cloud SaaS, edtech, healthtech, IT outsourcing.<\/p>"}, {"id": "IT248-09", "t": "Prototype development and MVP", "u": 2, "q": "What is prototype development? Explain its importance for IT startups.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>A <strong>prototype<\/strong> is an early sample or model of a product built to test a concept. A <strong>Minimum Viable Product (MVP)<\/strong> is the simplest working version that real customers can use.<\/p>\n<p><strong>Types:<\/strong> paper sketches / wireframes → clickable mock-ups → functional prototype → MVP.<\/p>\n<p><strong>Importance<\/strong><\/p>\n<ul>\n<li>Tests the idea cheaply before full investment.<\/li>\n<li>Gathers real user feedback.<\/li>\n<li>Attracts investors with something they can see.<\/li>\n<li>Reveals technical problems early.<\/li>\n<li>Supports the <em>build–measure–learn<\/em> cycle of the lean startup.<\/li>\n<\/ul>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 606 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Build<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Measure<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Learn<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Pivot or<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">persevere<\/text><\/svg><\/div>"}, {"id": "IT248-10", "t": "Target market and consumer behaviour", "u": 2, "q": "What is a target market? How is it defined, and why is consumer behaviour important?", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"M26": "Q4"}, "rep": false, "src": "TU Model Question 2026 Q4", "a": "<p>A <strong>target market<\/strong> is the specific group of customers a business aims to serve.<\/p>\n<p><strong>Segmentation bases:<\/strong> demographic (age, income), geographic (city/rural), psychographic (lifestyle), behavioural (usage rate, benefits sought).<\/p>\n<p><strong>Steps:<\/strong> Segmentation → Targeting → Positioning (STP).<\/p>\n<p><strong>Consumer behaviour<\/strong> is the study of how people choose, buy, use and dispose of products. It is influenced by cultural, social, personal and psychological factors. Understanding it helps startups design features, set prices, choose channels and write marketing messages.<\/p>\n<p><em>Example:<\/em> a food-delivery startup might target urban professionals aged 20–40 who own smartphones and value convenience.<\/p>"}, {"id": "IT248-11", "t": "Competitor analysis", "u": 2, "q": "Write a short note on competitor analysis.", "m": 5, "p": "High", "ty": "Short note", "seen": {"M26": "Q13"}, "rep": false, "src": "TU Model Question 2026 Q13", "a": "<p><strong>Competitor analysis<\/strong> is the systematic study of current and potential competitors to understand their strengths, weaknesses and strategies.<\/p>\n<p><strong>Steps:<\/strong> identify direct and indirect competitors → collect information (website, pricing, reviews, social media) → compare features, prices and customers → find gaps → plan differentiation.<\/p>\n<p><strong>Tools<\/strong><\/p>\n<ul>\n<li><strong>SWOT<\/strong> of each competitor<\/li>\n<li><strong>Feature/price comparison matrix<\/strong><\/li>\n<li><strong>Porter's Five Forces<\/strong> (rivalry, new entrants, substitutes, buyer power, supplier power)<\/li>\n<li><strong>Perceptual (positioning) map<\/strong><\/li>\n<li>Digital tools: SimilarWeb, SEMrush, Google Trends, app-store analytics<\/li>\n<\/ul>\n<p><strong>Benefit:<\/strong> helps a startup find its unique value proposition and avoid head-on competition.<\/p>"}, {"id": "IT248-12", "t": "CASE: Ride-sharing app in Nepal (Pathao-type)", "u": 2, "q": "You are the promotion manager of a new ride-sharing app in Nepal similar to Pathao. (a) What steps would you follow for idea generation? (b) How would you analyse the market? (c) How would you ensure rider benefit and trust? (d) What complexities may arise from Nepal's policies and laws? [20]", "m": 20, "p": "High", "ty": "Case study", "seen": {"M26": "Q22"}, "rep": false, "src": "TU Model Question 2026 Q22", "a": "<p><strong>(a) Steps for idea generation (5)<\/strong><\/p>\n<ol>\n<li>Identify the problem: unreliable public transport, taxi bargaining, traffic congestion.<\/li>\n<li>Brainstorm solutions: bike/car ride-hailing, carpooling, parcel delivery, food delivery as an add-on.<\/li>\n<li>Study analogous models abroad and in Nepal (Pathao, inDrive, Tootle).<\/li>\n<li>Screen ideas for desirability, feasibility and viability.<\/li>\n<li>Build an MVP in one city and test with early users; refine.<\/li>\n<\/ol>\n<p><strong>(b) Market analysis (5)<\/strong><\/p>\n<ul>\n<li><strong>Market size:<\/strong> urban population, smartphone penetration, daily commuters in Kathmandu Valley, Pokhara and other cities.<\/li>\n<li><strong>Segmentation:<\/strong> students, office workers, women riders (safety), tourists.<\/li>\n<li><strong>Competitor analysis:<\/strong> pricing, coverage, driver incentives and ratings of existing apps; SWOT.<\/li>\n<li><strong>Consumer research:<\/strong> surveys on price sensitivity, safety concerns and payment preferences (cash vs wallet).<\/li>\n<li><strong>PESTEL:<\/strong> fuel prices, regulation, traffic, digital payment growth.<\/li>\n<\/ul>\n<p><strong>(c) Ensuring rider benefit and trust (5)<\/strong><\/p>\n<ul>\n<li>Driver verification (licence, citizenship, vehicle documents), training.<\/li>\n<li>Real-time GPS tracking, ride sharing with family, SOS button.<\/li>\n<li>Transparent upfront fares, digital receipts.<\/li>\n<li>Ratings and feedback for both riders and drivers.<\/li>\n<li>Insurance coverage and a 24/7 support line.<\/li>\n<li>Data privacy and secure payment through licensed wallets.<\/li>\n<li>Loyalty discounts and promotions.<\/li>\n<\/ul>\n<p><strong>(d) Policy and legal complexities in Nepal (5)<\/strong><\/p>\n<ul>\n<li><strong>Vehicle registration rules:<\/strong> use of private (white-plate) vehicles for commercial transport has been a contested issue with transport authorities.<\/li>\n<li><strong>Licensing and registration<\/strong> with the Office of the Company Registrar and relevant ministries; the regulatory framework for ride-sharing has been unclear and changing.<\/li>\n<li><strong>Opposition from traditional taxi and transport associations<\/strong> (syndicate pressure).<\/li>\n<li><strong>Taxation:<\/strong> VAT/income tax obligations and driver income reporting.<\/li>\n<li><strong>Digital payment regulation<\/strong> by Nepal Rastra Bank.<\/li>\n<li><strong>Data protection and privacy<\/strong> obligations (Individual Privacy Act, 2075).<\/li>\n<li><strong>Labour status of drivers:<\/strong> are they employees or independent contractors?<\/li>\n<\/ul>\n<p><strong>Conclusion:<\/strong> success depends on trust, local adaptation and proactive engagement with regulators.<\/p>"}, {"id": "IT248-13", "t": "Business Model Canvas", "u": 3, "q": "What is the Business Model Canvas? Explain its nine building blocks with an example of an IT startup.", "m": 10, "p": "High", "ty": "Explanation + diagram", "seen": {"M26": "Q5"}, "rep": false, "src": "TU Model Question 2026 Q5", "a": "<p>The <strong>Business Model Canvas (BMC)<\/strong>, developed by Alexander Osterwalder, is a one-page visual tool describing how a business creates, delivers and captures value.<\/p>\n<table>\n<thead>\n<tr>\n<th>Block<\/th>\n<th>Question<\/th>\n<th>Example: online tutoring app<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Customer segments<\/td>\n<td>Who are our customers?<\/td>\n<td>+2 and Bachelor students<\/td>\n<\/tr>\n<tr>\n<td>2. Value proposition<\/td>\n<td>What problem do we solve?<\/td>\n<td>Affordable expert tutors anytime<\/td>\n<\/tr>\n<tr>\n<td>3. Channels<\/td>\n<td>How do we reach customers?<\/td>\n<td>App, social media, college partnerships<\/td>\n<\/tr>\n<tr>\n<td>4. Customer relationships<\/td>\n<td>How do we keep them?<\/td>\n<td>Community, chat support, reminders<\/td>\n<\/tr>\n<tr>\n<td>5. Revenue streams<\/td>\n<td>How do we earn?<\/td>\n<td>Subscriptions, pay-per-session<\/td>\n<\/tr>\n<tr>\n<td>6. Key resources<\/td>\n<td>What do we need?<\/td>\n<td>Platform, tutors, content<\/td>\n<\/tr>\n<tr>\n<td>7. Key activities<\/td>\n<td>What must we do?<\/td>\n<td>App development, tutor recruitment, marketing<\/td>\n<\/tr>\n<tr>\n<td>8. Key partnerships<\/td>\n<td>Who helps us?<\/td>\n<td>Colleges, payment wallets, cloud providers<\/td>\n<\/tr>\n<tr>\n<td>9. Cost structure<\/td>\n<td>What are the main costs?<\/td>\n<td>Tutor fees, servers, marketing, salaries<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Advantages:<\/strong> simple, visual, easy to revise, encourages team discussion.\n<strong>Limitation:<\/strong> does not cover competition or detailed finance — a full business plan is still needed.<\/p>"}, {"id": "IT248-14", "t": "Revenue streams and cost structure; sustainable models", "u": 3, "q": "Explain revenue streams and cost structure analysis. What is a sustainable business model?", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Revenue streams for IT startups:<\/strong> subscription (SaaS), freemium, transaction/commission fee (ride-hailing, marketplaces), advertising, licensing, pay-per-use, data and analytics services.<\/p>\n<p><strong>Cost structure:<\/strong> fixed costs (salaries, rent, servers) vs variable costs (payment gateway fees, commissions); cost-driven vs value-driven models. <strong>Unit economics<\/strong> compares customer acquisition cost (CAC) with customer lifetime value (LTV) — a healthy startup has LTV well above CAC.<\/p>\n<p><strong>Sustainable business model:<\/strong> a model that creates economic value while also protecting social and environmental value (triple bottom line: people, planet, profit). Examples: refurbished electronics, digital services replacing paper, inclusive fintech.<\/p>"}, {"id": "IT248-15", "t": "Business plan elements; ethical marketing", "u": 3, "q": "Discuss ethical marketing strategies. What are the essential elements of a business plan?", "m": 10, "p": "High", "ty": "Two-part long answer", "seen": {"M26": "Q21"}, "rep": false, "src": "TU Model Question 2026 Q21", "a": "<p><strong>Part 1 — Ethical marketing strategies<\/strong>\nEthical marketing means promoting products honestly, fairly and responsibly.<\/p>\n<ul>\n<li>Truthful advertising: no false claims or hidden charges.<\/li>\n<li>Respect customer privacy: consent before collecting data; no spam.<\/li>\n<li>Fair pricing: no price gouging or deceptive discounts.<\/li>\n<li>Avoid targeting vulnerable groups with harmful products.<\/li>\n<li>Social and environmental responsibility (cause marketing, green products).<\/li>\n<li>Transparency about sponsored content and influencer endorsements.<\/li>\n<li>Respect for competitors: no misleading comparisons.<\/li>\n<\/ul>\n<p><strong>Part 2 — Essential elements of a business plan<\/strong><\/p>\n<ol>\n<li><strong>Executive summary<\/strong> — the business in one page.<\/li>\n<li><strong>Company description<\/strong> — mission, vision, legal form, location.<\/li>\n<li><strong>Product/service description<\/strong> — features, value proposition, IP.<\/li>\n<li><strong>Market analysis<\/strong> — industry, target market, competitors.<\/li>\n<li><strong>Marketing and sales plan<\/strong> — 4Ps, digital strategy, sales process.<\/li>\n<li><strong>Operations plan<\/strong> — technology, processes, suppliers, milestones.<\/li>\n<li><strong>Management and organisation<\/strong> — founders, team, structure.<\/li>\n<li><strong>Financial plan<\/strong> — start-up costs, projected income statement, cash flow, balance sheet, break-even, funding needed.<\/li>\n<li><strong>Risk analysis and mitigation.<\/strong><\/li>\n<li><strong>Appendices<\/strong> — CVs, market data, legal documents.<\/li>\n<\/ol>\n<p><strong>Conclusion:<\/strong> a business plan is a roadmap for founders and a persuasion document for investors.<\/p>"}, {"id": "IT248-16", "t": "Financial projections and risk management", "u": 3, "q": "Explain financial projections and risk-management strategies in a business plan.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Financial projections<\/strong> forecast 3–5 years of sales, costs, profit and cash flow. Components: sales forecast, start-up cost budget, projected income statement, cash-flow statement, balance sheet, break-even analysis (Break-even units = Fixed cost ÷ (Price − Variable cost per unit)).<\/p>\n<p><strong>Risk management strategies<\/strong><\/p>\n<ul>\n<li>Identify risks: market, technology, financial, legal, people.<\/li>\n<li>Assess likelihood and impact (risk matrix).<\/li>\n<li>Respond: <strong>avoid<\/strong>, <strong>reduce<\/strong> (testing, backups), <strong>transfer<\/strong> (insurance, contracts), <strong>accept<\/strong> (contingency fund).<\/li>\n<li>Monitor continuously.<\/li>\n<\/ul>"}, {"id": "IT248-17", "t": "Legal framework for startups; IPR; licences", "u": 4, "q": "Explain the legal and regulatory framework for starting an IT business in Nepal, including intellectual property rights.", "m": 10, "p": "High", "ty": "Explanation", "seen": {"M26": "Q6"}, "rep": false, "src": "TU Model Question 2026 Q6", "a": "<p><strong>Main legal steps and laws (Nepal)<\/strong><\/p>\n<ul>\n<li><strong>Company registration<\/strong> under the <em>Companies Act, 2063 (2006)<\/em> at the Office of the Company Registrar (OCR); private limited is the usual form for startups.<\/li>\n<li><strong>PAN/VAT registration<\/strong> with the Inland Revenue Department.<\/li>\n<li><strong>Industry registration<\/strong> under the <em>Industrial Enterprises Act, 2076 (2020)<\/em> where applicable.<\/li>\n<li><strong>Local ward/municipality business permit.<\/strong><\/li>\n<li><strong>Foreign investment<\/strong> under the <em>Foreign Investment and Technology Transfer Act, 2075 (2019)<\/em> if foreign capital is involved.<\/li>\n<li><strong>Sector licences:<\/strong> e.g. Nepal Rastra Bank licence for payment services; Nepal Telecommunications Authority for telecom/ISP services.<\/li>\n<li><strong>Labour Act, 2074 (2017)<\/strong> and <strong>Social Security Fund<\/strong> contributions for employees.<\/li>\n<li><strong>Electronic Transactions Act, 2063 (2008)<\/strong> for digital records, signatures and cybercrime.<\/li>\n<li><strong>Individual Privacy Act, 2075 (2018)<\/strong> for personal data.<\/li>\n<\/ul>\n<p><strong>Intellectual Property Rights (IPR)<\/strong> — legal rights over creations of the mind:<\/p>\n<ul>\n<li><strong>Copyright<\/strong> (<em>Copyright Act, 2059<\/em>): software code, content, designs.<\/li>\n<li><strong>Trademark<\/strong> (<em>Patent, Design and Trademark Act, 2022 BS<\/em>): brand name and logo — registered at the Department of Industry.<\/li>\n<li><strong>Patent:<\/strong> new inventions.<\/li>\n<li><strong>Trade secrets:<\/strong> algorithms and customer lists protected through NDAs.<\/li>\n<\/ul>\n<p><strong>Common legal challenges for Nepali IT startups:<\/strong> unclear rules for new models (ride-sharing, digital lending), restrictions on foreign payments and investment, slow registration, ambiguous tax treatment of digital services.<\/p>"}, {"id": "IT248-18", "t": "Taxation basics for IT startups in Nepal", "u": 4, "q": "Explain the basics of taxation for IT startups in Nepal.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q15"}, "rep": false, "src": "TU Model Question 2026 Q15", "a": "<ul>\n<li><strong>PAN registration<\/strong> is mandatory for every business; <strong>VAT registration<\/strong> is required once turnover crosses the legal threshold, or voluntarily.<\/li>\n<li><strong>Income tax:<\/strong> companies pay corporate income tax under the <em>Income Tax Act, 2058<\/em>; concessional rates and exemptions have been offered to certain IT businesses and IT-service exports through annual Finance Acts — <strong>check the current Finance Act<\/strong> because these rates change every budget.<\/li>\n<li><strong>VAT<\/strong> on taxable sales; input VAT credit is available.<\/li>\n<li><strong>TDS (tax deducted at source)<\/strong> on salaries, rent, contracts and service payments.<\/li>\n<li><strong>Social Security Fund<\/strong> contributions for employees.<\/li>\n<li><strong>Filing:<\/strong> monthly VAT/TDS returns and an annual income tax return; keep audited accounts.<\/li>\n<li><strong>Digital Services Tax<\/strong> applies to certain foreign digital service providers.<\/li>\n<\/ul>\n<p><em>Exam tip:<\/em> explain categories (PAN, VAT, income tax, TDS, compliance) rather than quoting rates you are unsure of.<\/p>"}, {"id": "IT248-19", "t": "Startup funding sources", "u": 5, "q": "What are the sources of startup funding? Explain any three.", "m": 10, "p": "High", "ty": "List + explain", "seen": {"M26": "Q7, Q18"}, "rep": false, "src": "TU Model Question 2026 Q7, Q18", "a": "<p>Startups need money for development, marketing and operations before they earn revenue.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Bootstrapping<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Friends &amp; family<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Angel investors<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Venture capital<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">IPO / exit<\/text><\/svg><\/div>\n\n<p><strong>Sources<\/strong><\/p>\n<ol>\n<li><strong>Bootstrapping (self-funding):<\/strong> founders' savings and early revenue. <em>Pros:<\/em> full control. <em>Cons:<\/em> slow growth.<\/li>\n<li><strong>Friends and family:<\/strong> quick, flexible, but risk to relationships.<\/li>\n<li><strong>Angel investors:<\/strong> wealthy individuals investing early for equity, often adding mentorship.<\/li>\n<li><strong>Venture capital (VC):<\/strong> professional funds investing large amounts in high-growth startups for equity and board seats. Nepal now has VC and private equity funds.<\/li>\n<li><strong>Bank loans:<\/strong> debt that requires collateral and interest; government-subsidised loan schemes for youth or startups may help.<\/li>\n<li><strong>Crowdfunding:<\/strong> many small contributions through online platforms.<\/li>\n<li><strong>Grants and competitions:<\/strong> government startup funds, donor programmes, hackathon prizes.<\/li>\n<li><strong>Incubators/accelerators:<\/strong> small funding plus training in exchange for equity.<\/li>\n<li><strong>Strategic/corporate investors.<\/strong><\/li>\n<\/ol>\n<p><em>For \"explain any three\", give three sources with meaning, advantages, disadvantages and a Nepali or global example each.<\/em><\/p>"}, {"id": "IT248-20", "t": "Budgeting, cash flow, financial reporting", "u": 5, "q": "Explain budgeting and cash-flow management for new ventures.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Budgeting<\/strong> is planning expected income and expenses for a period. Types: start-up budget (one-time costs), operating budget (monthly), capital budget (equipment).<\/p>\n<p><strong>Cash-flow management<\/strong><\/p>\n<ul>\n<li>Prepare a monthly cash-flow forecast (inflows vs outflows).<\/li>\n<li>Track <strong>burn rate<\/strong> (monthly net cash outflow) and <strong>runway<\/strong> = cash balance ÷ burn rate.<\/li>\n<li>Collect receivables quickly; negotiate longer payment terms with suppliers.<\/li>\n<li>Keep an emergency reserve; avoid unnecessary fixed costs.<\/li>\n<\/ul>\n<p><strong>Financial reporting requirements:<\/strong> maintain books of accounts, prepare financial statements, get them audited (companies), and file tax returns and annual returns with OCR.<\/p>"}, {"id": "IT248-21", "t": "Digital marketing, sales techniques, motivating employees", "u": 5, "q": "How can employees be mot
