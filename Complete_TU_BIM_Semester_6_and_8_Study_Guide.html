 the importance of the stages of business analytics (descriptive, predictive, prescriptive) in decision-making with example.", "m": 5, "p": "High", "ty": "Explain with example", "seen": {"E25": "A8, C19", "M": "A9, B15"}, "rep": true, "src": "2025 exam A8, C19; TU model question A9, B15", "a": "<p><strong>Managers need IT support because<\/strong> the number of alternatives is increasing, decisions must be made under time pressure, decisions are more complex, uncertainty is higher, decision-makers may be in different locations, and data must be analysed from many sources.<\/p>\n<p><strong>Business analytics (BA):<\/strong> the process of developing actionable decisions or recommendations through insights from historical data. <strong>Process:<\/strong> identify the problem → collect and prepare data (data warehouse) → analyse → present → act.<\/p>\n<p><strong>Stages<\/strong><\/p>\n<ol>\n<li><strong>Descriptive analytics — \"What happened?\"<\/strong> Summarises historical data: reports, OLAP, dashboards, data visualisation. <em>Example:<\/em> a retailer's report shows sales fell 15% last quarter in Pokhara. → identifies problems and opportunities.<\/li>\n<li><strong>Predictive analytics — \"What will happen?\"<\/strong> Uses statistical models, data mining and machine learning to forecast. <em>Example:<\/em> forecasting Dashain–Tihar demand per product; predicting which customers will churn. → proactive planning.<\/li>\n<li><strong>Prescriptive analytics — \"What should we do?\"<\/strong> Uses optimisation and simulation to recommend actions. <em>Example:<\/em> recommending optimal stock levels and discounts for each store; airline dynamic pricing. → best decision.<\/li>\n<\/ol>\n<p><strong>Presentation tools:<\/strong> dashboards, data visualisation, geographic information systems (GIS), reality mining, scorecards.<\/p>"}, {"id": "IT245-20", "t": "Cloud computing: definition, types, services, benefits, risks; SaaS", "u": 9, "q": "Define cloud computing. Explain its types, services, benefits and risks.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "A9, B16", "M": "A10"}, "rep": true, "src": "2025 exam A9, B16; TU model question A10", "a": "<p><strong>Cloud computing:<\/strong> a model in which IT resources (servers, storage, software) are delivered as services over the Internet, on demand and pay-per-use.\n<strong>Essential characteristics:<\/strong> on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service.<\/p>\n<p><strong>Types (deployment):<\/strong> public (AWS, Azure) · private (one organisation) · hybrid · community/vertical.\n<strong>Services:<\/strong><\/p>\n<ul>\n<li><strong>IaaS:<\/strong> virtual servers, storage, networks (Amazon EC2).<\/li>\n<li><strong>PaaS:<\/strong> development platforms (Google App Engine, Azure App Service).<\/li>\n<li><strong>SaaS:<\/strong> ready-to-use applications via the browser — Gmail, Microsoft 365, Salesforce CRM. <em>SaaS = software delivered over the Internet on a subscription basis; no installation or maintenance by the user.<\/em><\/li>\n<\/ul>\n<p><strong>Benefits:<\/strong> reduced capital cost (pay-as-you-go) · scalability and elasticity · access anywhere, any device · faster deployment and innovation · automatic updates and maintenance · disaster recovery and backup · collaboration.\n<strong>Concerns and risks:<\/strong> security and privacy · legal/regulatory and data-sovereignty issues · vendor lock-in · dependence on Internet connectivity · outages and reliability · hidden costs · loss of control.<\/p>\n<p><strong>The \"Big Three\" vendors:<\/strong> Amazon Web Services, Microsoft Azure, Google Cloud Platform.<\/p>"}, {"id": "IT245-21", "t": "Web services and SOA", "u": 9, "q": "Explain service-oriented architecture (SOA) in brief, with web services.", "m": 3, "p": "High", "ty": "Short explanation", "seen": {"M": "B16"}, "rep": false, "src": "TU model question B16", "a": "<p><strong>Web services<\/strong> are applications delivered over the Internet that users can select and combine through almost any device; they communicate via open standards — <strong>XML/JSON, SOAP, WSDL, REST<\/strong> over HTTP.<\/p>\n<p><strong>SOA (Service-Oriented Architecture):<\/strong> an IT architecture that makes it possible to construct business applications from <strong>reusable, loosely coupled software services<\/strong>, each performing a specific function (e.g. \"check credit\", \"calculate shipping\"), which can be combined and reused across applications.\n<strong>Benefits:<\/strong> reuse, interoperability across platforms, flexibility to change processes, faster development, easier integration with partners.\n<em>Example:<\/em> an e-commerce site combines a payment service (wallet gateway), a shipping-rate service and a map service.<\/p>"}, {"id": "IT245-22", "t": "CASE: ABC Corp — IS, analytics, cloud, KM, social, CRM", "u": 2, "q": "Case 'ABC Corp' (2025): (21.1) How did ABC Corp use information systems to gain competitive advantage? (21.2) What role did business analytics, cloud computing and knowledge management play in improving operations? (21.3) How did social computing and CRM enhance customer engagement and satisfaction?", "m": 20, "p": "High", "ty": "Case study", "seen": {"E25": "D21"}, "rep": false, "src": "2025 exam D21", "a": "<p><em>(The case text was not reproduced in the source, so this is a model answer built on the concepts the sub-questions name — adapt it to the details in the paper you get.)<\/em><\/p>\n<p><strong>21.1 IS for competitive advantage<\/strong><\/p>\n<ul>\n<li>Used <strong>strategic IS<\/strong> aligned with business goals (business–IT alignment).<\/li>\n<li><strong>Cost leadership:<\/strong> automation, ERP and TPS cut operating costs.<\/li>\n<li><strong>Differentiation:<\/strong> personalised products and online services.<\/li>\n<li><strong>Innovation:<\/strong> new digital channels (mobile app, e-commerce).<\/li>\n<li><strong>Customer orientation:<\/strong> a 360° view of customers through integrated data.<\/li>\n<li>Countered Porter's forces — loyalty programmes reduced buyer power; e-procurement reduced supplier power; integrated systems raised entry barriers.<\/li>\n<\/ul>\n<p><strong>21.2 Analytics, cloud and KM<\/strong><\/p>\n<ul>\n<li><strong>Business analytics:<\/strong> descriptive dashboards tracked KPIs; predictive models forecast demand; prescriptive tools optimised pricing and inventory → faster, fact-based decisions.<\/li>\n<li><strong>Cloud computing:<\/strong> scalable infrastructure on demand, lower IT capital cost, remote access, quick deployment of SaaS tools, disaster recovery.<\/li>\n<li><strong>Knowledge management:<\/strong> a knowledge repository captured best practices and tacit expertise → faster problem-solving, consistent service, less dependence on individuals.<\/li>\n<\/ul>\n<p><strong>21.3 Social computing and CRM<\/strong><\/p>\n<ul>\n<li><strong>Social computing:<\/strong> social-media pages, reviews and ratings, social shopping and communities → two-way engagement, viral marketing, customer feedback for product improvement.<\/li>\n<li><strong>CRM:<\/strong> operational CRM (call centre, sales force automation, campaign management) and analytical CRM (segmentation, churn prediction) → personalised offers, quick complaint resolution, loyalty programmes.<\/li>\n<li>Combined as <strong>social CRM<\/strong>: monitoring social channels and responding promptly → higher satisfaction and retention.<\/li>\n<\/ul>"}], "defs": [["Information system", "System that collects, processes, stores, analyses and disseminates information."], ["Business process", "Related activities that create value for customers."], ["BPR", "Radical redesign of business processes for dramatic improvement."], ["Competitive advantage", "Advantage over rivals in cost, quality or speed leading to superior profit."], ["Strategic IS", "IS that provides competitive advantage."], ["Business–IT alignment", "Integration of IT with the organisation's strategy and goals."], ["Data mart", "Small departmental data warehouse."], ["Big Data", "High-volume, high-velocity, high-variety data."], ["Knowledge management", "Creating, capturing, sharing and applying organisational knowledge."], ["M-commerce", "E-commerce through wireless mobile devices."], ["IoT", "Network of physical objects that collect and exchange data via the Internet."], ["Web 2.0", "Interactive, user-generated, participatory web."], ["Social commerce", "E-commerce delivered through social computing."], ["TPS", "System recording routine business transactions."], ["ERP", "Integrated system spanning all functional areas with a common database."], ["Customer touch point", "Any point of interaction between a customer and the firm."], ["SCM", "Planning and optimising flows across the supply chain."], ["Predictive analytics", "Analytics forecasting what is likely to happen."], ["SaaS", "Software delivered over the Internet on subscription."], ["SOA", "Architecture building applications from reusable services."]], "revision": "<p><strong>IT 245 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> IS components (HW, SW, data, network, procedures, people) · TPS/MIS/DSS/EIS/ERP pyramid · IT impacts (flatter, jobs, productivity, privacy).<\/li>\n<li><strong>U2:<\/strong> business process ↔ IS · BPR 7 steps, BPI, BPM · pressures &amp; responses · competitive advantage · Porter forces + value chain · 5 strategies (cost, differentiation, innovation, operational effectiveness, customer orientation) · alignment characteristics.<\/li>\n<li><strong>U3:<\/strong> database approach · DB vs DW · data mart · Big Data Vs + competitive uses · KM (tacit/explicit, cycle, importance).<\/li>\n<li><strong>U4:<\/strong> Wi-Fi, Bluetooth, NFC, RFID, 4G/5G, satellite · short/medium/wide range · m-commerce drivers (7) · IoT + 2 benefits · \"networking transformed business\" examples.<\/li>\n<li><strong>U5:<\/strong> Web 1.0 vs 2.0 · social computing in shopping, marketing, CRM, HRM · social-commerce benefits and risks.<\/li>\n<li><strong>U6:<\/strong> TPS characteristics · functional-area IS (accounting, marketing, POM, HRIS) · ERP modules, process support (procure-to-pay, order-to-cash), pros/cons.<\/li>\n<li><strong>U7:<\/strong> CRM, touch points, operational vs analytical, other CRM types · SCM segments, bullwhip · IT support (EDI, extranet, RFID, VMI).<\/li>\n<li><strong>U8:<\/strong> why managers need IT · BA process · descriptive / predictive / prescriptive with examples · presentation tools.<\/li>\n<li><strong>U9:<\/strong> cloud characteristics, deployment, IaaS/PaaS/SaaS, benefits, risks, Big Three · web services, SOA.<\/li>\n<\/ul>", "practice": ["[AI practice] Differentiate BPR and BPI. (3)", "[AI practice] Explain Porter's value-chain model and how IT supports each activity. (5)", "[AI practice] Explain the bullwhip effect and how IT reduces it. (3)", "[AI practice] Differentiate operational and analytical CRM. (3)", "[AI practice] Case: A Nepali supermarket chain wants to adopt ERP, CRM and cloud analytics. Advise on benefits, risks and an implementation approach. (10)"], "checklist": ["List IS components and types", "Explain IT impacts on organisations", "Explain BPR steps and BPM", "Explain 5 competitive strategies + Porter", "Explain business–IT alignment", "Compare DB vs DW; define data mart", "Explain Big Data Vs and uses", "Explain KM importance", "Explain 3+ wireless technologies", "Explain IoT benefits", "Compare Web 1.0 vs 2.0; social commerce risks", "Explain ERP process support and pros/cons", "Explain CRM types and touch points", "Justify IT support for SCM", "Explain 3 analytics stages with examples", "Explain cloud services and SOA"], "sources": [["TU FOM — BIM 6th Semester Syllabus 2024", "https://www.fomecd.edu.np/syllabuses/BIM%206th%20Semester%20Syllabus%202024.pdf"], ["bimstudies — IT 245 Exam Question Solution 2025", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-information-systems-exam-question-solution-bitm-6th-sem-2025/"], ["bimstudies — IT 245 Model Question Solution (TU model)", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-information-systems-model-question-solution-bitm-6th-sem/"], ["Rainer & Prince, Introduction to Information Systems (9th ed., 2022) — prescribed text", "—"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "IT 277", "id": "IT277", "title": "Cloud Computing", "sem": 8, "exam": "2026-12-10", "official": "IT 277: Cloud Computing (Elective II)", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, with lab", "note": "Matches routine. IT 277 shares 10 Dec 2026 with IT 278 — both are Elective II options.", "marks": "Full Marks 60, Pass 30, 3 hrs (TU Model Question 2026). Group A 10×1 · Group B 5×3 (any 5 of 6) · Group C 3×5 (any 3 of 4) · Group D 2×10.", "objectives": "Provide theoretical and practical knowledge of designing, implementing and managing cloud computing systems.", "units": [{"n": 1, "t": "Introduction to Cloud Computing", "lh": 5, "topics": "Evolution; characteristics; cloud types and services; benefits, challenges, applications; cloud storage; cloud service requirements; dynamic infrastructure; cloud adoption."}, {"n": 2, "t": "Cloud Computing Architecture", "lh": 5, "topics": "IaaS, PaaS, SaaS; public, private, community, hybrid clouds; SOA-based cloud design; security, trust and privacy."}, {"n": 3, "t": "Cloud Applications", "lh": 5, "topics": "Cloud migration; software licensing; cloud cost models; service levels (SLA), security and web-application design."}, {"n": 4, "t": "Cloud Virtualization Technology", "lh": 8, "topics": "Virtualisation concepts and types; implementation levels; server virtualisation and software; hypervisor types; load balancing; infrastructure requirements."}, {"n": 5, "t": "MapReduce and Applications", "lh": 7, "topics": "Parallel computing; MapReduce model; applications; parallel efficiency; enterprise batch processing."}, {"n": 6, "t": "Cloud Security", "lh": 6, "topics": "Security issues, challenges and risks; SaaS security; security monitoring; security architecture design; data, application and VM security; legal and multi-tenancy issues."}, {"n": 7, "t": "Cloud Platforms and Applications", "lh": 12, "topics": "Web services; Google AppEngine, Microsoft Azure, Aneka; open challenges; scientific, business and consumer applications."}], "avail": "<p><strong>No actual NC paper exists<\/strong> (first sitting December 2026) — <strong>insufficient data<\/strong> for frequency. The <strong>TU Model Question 2026<\/strong> (Category C) is complete. A separate <em>'BIM Model question 2025'<\/em> file on the TU FOM site contains a scenario asking which of IaaS/PaaS/SaaS suits a startup hosting a web application. Its course could not be confirmed because the PDF would not open, so it is noted but not counted.<\/p>", "pattern": "<p><strong>Model 2026:<\/strong> definitions (10) · compare/explain (6) · requirements, security, MapReduce, architecture (4) · two 10-markers: <strong>virtualisation + hypervisors<\/strong> and <strong>cloud security risks + mitigation<\/strong>.<\/p>\n<p><strong>Unit spread:<\/strong> U1: 4 · U2: 4 · U3: 0 · U4: 4 (incl. a 10-marker) · U5: 3 · U6: 6 (incl. a 10-marker) · U7: 1. <strong>Security (U6) and virtualisation (U4) dominate.<\/strong> Unit 7 has 12 LH but only one model item, so expect AppEngine/Azure/Aneka in Group B/C in the real paper. Unit 3 (migration, licensing, cost models, SLA) is untested in the model — cover it anyway.<\/p>", "papers": [{"id": "M26", "label": "TU Model Question 2026", "cat": "C", "session": "Model (2026)", "source": "TU FOM Model Question 2026", "url": "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf", "note": "Wording retrieved through a text-extraction tool; meaning and marks as printed.", "qs": [{"no": "1", "g": "A", "t": "Define cloud computing.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "What is SaaS?", "m": 1, "u": 2}, {"no": "3", "g": "A", "t": "What is a private cloud?", "m": 1, "u": 2}, {"no": "4", "g": "A", "t": "What is cloud storage?", "m": 1, "u": 1}, {"no": "5", "g": "A", "t": "What is SOA?", "m": 1, "u": 2}, {"no": "6", "g": "A", "t": "What is virtualisation?", "m": 1, "u": 4}, {"no": "7", "g": "A", "t": "What is virtual machine security?", "m": 1, "u": 6}, {"no": "8", "g": "A", "t": "What is parallel computing?", "m": 1, "u": 5}, {"no": "9", "g": "A", "t": "What is security monitoring?", "m": 1, "u": 6}, {"no": "10", "g": "A", "t": "What is AppEngine?", "m": 1, "u": 7}, {"no": "11", "g": "B", "t": "Compare PaaS with IaaS. Define public cloud.", "m": 3, "u": 2}, {"no": "12", "g": "B", "t": "Explain the advantages and disadvantages of cloud computing.", "m": 3, "u": 1}, {"no": "13", "g": "B", "t": "Explain the types of hypervisors.", "m": 3, "u": 4}, {"no": "14", "g": "B", "t": "Explain the types of virtualisation with examples.", "m": 3, "u": 4}, {"no": "15", "g": "B", "t": "Explain the parallel efficiency of MapReduce.", "m": 3, "u": 5}, {"no": "16", "g": "B", "t": "Explain common data-security issues in the cloud.", "m": 3, "u": 6}, {"no": "17", "g": "C", "t": "Explain cloud service requirements with an example.", "m": 5, "u": 1}, {"no": "18", "g": "C", "t": "Explain cloud security concepts.", "m": 5, "u": 6}, {"no": "19", "g": "C", "t": "Explain the working of MapReduce architecture.", "m": 5, "u": 5}, {"no": "20", "g": "C", "t": "Explain cloud security architecture.", "m": 5, "u": 6}, {"no": "21", "g": "D", "t": "Explain virtualisation and its role in cloud computing, with hypervisor types and examples.", "m": 10, "u": 4}, {"no": "22", "g": "D", "t": "Explain the risks of cloud security and strategies to mitigate them.", "m": 10, "u": 6}]}], "notes": {"1": "<p>Earlier, every organisation had to buy servers, install software and hire staff to maintain them. Cloud computing lets organisations rent computing power, storage and software over the Internet, paying only for what they use.<\/p>\n<h3>1.1 What is cloud computing?<\/h3>\n<p><strong>Definitions<\/strong><\/p>\n<ul>\n<li><strong>NIST:<\/strong> a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources that can be rapidly provisioned and released with minimal management effort or provider interaction.<\/li>\n<li><strong>Buyya et al.:<\/strong> a type of parallel and distributed system of interconnected, virtualised computers that are dynamically provisioned and presented as unified computing resources based on service-level agreements.<\/li>\n<\/ul>\n<h3>1.2 Evolution<\/h3>\n<p>Mainframes and time-sharing (1960s) → client–server (1980s) → cluster and grid computing (1990s) → utility computing and virtualisation → SOA and web services → commercial cloud (AWS 2006, Google App Engine 2008, Azure 2010) → serverless, containers and edge computing.<\/p>\n<h3>1.3 Characteristics<\/h3>\n<p>On-demand self-service · broad network access · resource pooling (multi-tenancy) · rapid elasticity · measured service; plus scalability, reliability, automatic maintenance.<\/p>\n<h3>1.4 Cloud types and services<\/h3>\n<p>Deployment: public, private, community, hybrid (multi-cloud). Service models: IaaS, PaaS, SaaS (plus FaaS/serverless, DaaS).<\/p>\n<h3>1.5 Benefits, challenges and applications<\/h3>\n<p>Benefits: cost savings, agility, scalability, global reach, reliability, collaboration. Challenges: security, privacy, compliance, lock-in, outages, latency, cost control. Applications: business (CRM, ERP, email), scientific computing, consumer (storage, streaming), education, healthcare, government.<\/p>\n<h3>1.6 Cloud storage<\/h3>\n<p>Object (S3, Blob), block (EBS), file (EFS); consumer services (Drive, OneDrive); features: durability through replication, lifecycle tiers (hot, cool, archive), versioning.<\/p>\n<h3>1.7 Cloud service requirements<\/h3>\n<p>Scalability, availability, security, performance, multi-tenancy isolation, interoperability, manageability, SLA, cost transparency, backup and compliance.<\/p>\n<h3>1.8 Dynamic infrastructure and cloud adoption<\/h3>\n<p><strong>Dynamic infrastructure<\/strong> automatically allocates and releases virtualised resources based on demand (auto-scaling, load balancing, self-healing). <strong>Cloud adoption:<\/strong> assess readiness → business case/TCO → choose model and provider → pilot → migrate → govern and optimise; barriers: security fears, skills, legacy systems, regulation.<\/p>\n<p><strong>Key points:<\/strong> two definitions · evolution timeline · five characteristics · types and services · benefits/challenges · storage types · requirements · dynamic infrastructure · adoption steps.<\/p>", "2": "<p>Cloud services are organised in layers, from raw infrastructure to complete applications, and can be deployed in different ways depending on who shares the resources.<\/p>\n<h3>2.1 IaaS, PaaS and SaaS<\/h3>\n<ul>\n<li><strong>IaaS:<\/strong> virtual machines, storage, networks on demand — customer manages OS and apps (Amazon EC2, Azure VMs, Google Compute Engine).<\/li>\n<li><strong>PaaS:<\/strong> managed platform for developing and deploying apps — customer manages code and data (Google App Engine, Azure App Service, Heroku).<\/li>\n<li><strong>SaaS:<\/strong> complete applications over the Internet — customer just uses them (Gmail, Microsoft 365, Salesforce, Zoom).\nResponsibility shifts from customer to provider as we move IaaS → PaaS → SaaS.<\/li>\n<\/ul>\n<h3>2.2 Public, private, community and hybrid clouds<\/h3>\n<p>Public (shared, provider-owned, cheapest) · private (single organisation, control and compliance) · community (shared by organisations with common concerns) · hybrid (combination with workload portability; cloud bursting).<\/p>\n<h3>2.3 SOA-based cloud design and implementation<\/h3>\n<p>Cloud systems are built from loosely coupled services exposed via APIs (REST/SOAP). Design: identify business capabilities as services → define contracts (WSDL/OpenAPI) → implement as microservices/containers → orchestrate with an API gateway/ESB → register and discover services → deploy on elastic cloud resources → monitor. Benefits: reuse, scalability, independent deployment, interoperability.<\/p>\n<h3>2.4 Security, trust and privacy<\/h3>\n<p>Shared-responsibility model; identity federation and access control; encryption; provider certifications (ISO 27001, SOC 2) build trust; privacy laws and data residency; transparency through SLAs and audits.<\/p>\n<p><strong>Key points:<\/strong> service-model responsibilities and examples · deployment models · SOA design steps · security/trust/privacy.<\/p>", "3": "<p>Moving applications to the cloud involves technical, legal and financial decisions — how to migrate, how software is licensed, how costs are charged and what service levels are guaranteed.<\/p>\n<h3>3.1 Cloud migration<\/h3>\n<p>Strategies (the R's): rehost (lift-and-shift), replatform, refactor/re-architect, repurchase (SaaS), retire, retain. Steps: discover and assess → plan (TCO, dependencies, risk) → pilot → migrate data and apps → validate → optimise. Tools: AWS Migration Hub, Azure Migrate, database migration services.<\/p>\n<h3>3.2 Software licensing<\/h3>\n<p>Subscription (per user/month) · pay-as-you-go · BYOL (bring your own licence) · enterprise agreements · open-source licences; issues: licence portability to virtual/multi-tenant environments, compliance audits.<\/p>\n<h3>3.3 Cloud cost models<\/h3>\n<p>On-demand · reserved/committed use · spot/pre-emptible · savings plans · free tier · subscription; charges for compute, storage, requests and data egress; cost management (FinOps): tagging, budgets, right-sizing, auto-scaling.<\/p>\n<h3>3.4 Service levels, security and web-application design<\/h3>\n<p><strong>SLA<\/strong> elements: availability (e.g. 99.9%), performance, support, data protection, responsibilities, credits/penalties. <strong>Cloud web-app design:<\/strong> stateless app tier, load balancer + auto-scaling group, managed database with replicas, caching (Redis), CDN, object storage for media, secure configuration (IAM, TLS, WAF), monitoring and logging.<\/p>\n<p><strong>Key points:<\/strong> migration R's and steps · licensing types · cost models · SLA elements · cloud web-app architecture.<\/p>", "4": "<p>Virtualisation is the technology that makes cloud computing possible: it lets one physical server act as many independent virtual machines that can be created and moved in minutes.<\/p>\n<h3>4.1 What is virtualisation?<\/h3>\n<p>Creating a virtual version of a computing resource (server, storage, network, desktop, OS) so that multiple isolated environments share the same physical hardware. <strong>Benefits:<\/strong> consolidation, utilisation, isolation, fast provisioning, live migration, easier backup and DR, lower power and space.<\/p>\n<h3>4.2 Types of virtualisation<\/h3>\n<p>Server · desktop (VDI) · storage · network (VLAN, SDN, NFV) · application · OS-level/containers · memory · data virtualisation. By technique: full, para-virtualisation, hardware-assisted.<\/p>\n<h3>4.3 Implementation levels<\/h3>\n<p>ISA level (emulation) · hardware abstraction level (hypervisors) · OS level (containers) · library/API level (WINE) · application level (JVM, CLR).<\/p>\n<h3>4.4 Server virtualisation and virtualisation software<\/h3>\n<p>Partitioning a physical server into multiple VMs, each with its own OS. Software: VMware vSphere/ESXi, Microsoft Hyper-V, KVM, Xen, Oracle VirtualBox, Docker (containers), Kubernetes (orchestration).<\/p>\n<h3>4.5 Hypervisor types<\/h3>\n<p>Type 1 (bare-metal: ESXi, Hyper-V, Xen, KVM) — production data centres; Type 2 (hosted: VirtualBox, VMware Workstation) — desktops and testing.<\/p>\n<h3>4.6 Load balancing<\/h3>\n<p>Distributes workload across servers/VMs for availability and performance; algorithms: round-robin, weighted, least connections, IP hash; static vs dynamic; hardware vs software vs cloud load balancers; health checks; works with auto-scaling.<\/p>\n<h3>4.7 Infrastructure requirements<\/h3>\n<p>Virtualisation-capable CPUs (Intel VT-x/AMD-V), ample RAM, shared storage (SAN/NAS), high-speed redundant networks, hypervisor and management software, monitoring, backup, power and cooling.<\/p>\n<p><strong>Key points:<\/strong> definition and benefits · types · five levels · server virtualisation software · Type 1 vs Type 2 · load balancing · infrastructure needs.<\/p>", "5": "<p>Some jobs — like analysing billions of web pages — are far too big for one computer. Parallel computing splits the work across many machines, and MapReduce makes this simple for programmers.<\/p>\n<h3>5.1 Parallel computing<\/h3>\n<p>Simultaneous use of multiple processors to solve a problem faster. Types: bit-level, instruction-level, data parallelism, task parallelism. Architectures: shared memory (multicore), distributed memory (clusters). <strong>Amdahl's law:<\/strong> speed-up is limited by the sequential portion: S = 1 / ((1 − P) + P/N).<\/p>\n<h3>5.2 The MapReduce model<\/h3>\n<p>Programming model (Google, 2004; Apache Hadoop) with two user functions: <strong>map<\/strong> (input record → intermediate key–value pairs) and <strong>reduce<\/strong> (key + list of values → aggregated output). The framework handles splitting, scheduling, shuffling/sorting, fault tolerance and data locality.<\/p>\n<h3>5.3 MapReduce applications<\/h3>\n<p>Word count, inverted index for search engines, log analysis, distributed sort, joins, ETL, recommendation pre-computation, graph processing (iterative), machine-learning preprocessing.<\/p>\n<h3>5.4 Parallel efficiency<\/h3>\n<p>Speed-up S = T₁/Tₚ; efficiency E = S/p. Overheads: shuffle network traffic, start-up, disk I/O, stragglers (speculative execution helps), data skew; combiners and good partitioning improve efficiency.<\/p>\n<h3>5.5 Enterprise batch processing<\/h3>\n<p>Large periodic jobs (billing, payroll, reporting, ETL, risk calculations) run on clusters; MapReduce/Hadoop and Spark batch jobs; scheduling with workflow tools (Oozie, Airflow); cloud services (AWS EMR, Azure HDInsight, Google Dataproc).<\/p>\n<p><strong>Key points:<\/strong> parallelism types · Amdahl's law · map/reduce functions · applications · speed-up and efficiency · enterprise batch.<\/p>", "6": "<p>Putting data and applications on someone else's infrastructure raises new security questions: who protects what, how tenants are isolated, and which laws apply.<\/p>\n<h3>6.1 Security issues, challenges and risks<\/h3>\n<p>Data breaches, misconfiguration, insecure APIs, account hijacking, insider threats, data loss, DDoS, multi-tenancy leakage, lack of visibility, compliance and data residency, vendor lock-in.<\/p>\n<h3>6.2 SaaS security<\/h3>\n<p>Provider secures the application stack; customers handle identity (SSO, MFA), access permissions, data sharing settings, CASB monitoring, vendor assessment, contracts.<\/p>\n<h3>6.3 Security monitoring<\/h3>\n<p>Continuous logging (CloudTrail, Azure Monitor), SIEM correlation, intrusion detection, anomaly detection, vulnerability scanning, alerts and incident response.<\/p>\n<h3>6.4 Security architecture design<\/h3>\n<p>Layered (defence in depth): governance and compliance, IAM, application security (WAF, secure SDLC), data security (encryption, KMS), host/VM/container security, network security (VPC, security groups, firewalls), physical security; zero-trust principles.<\/p>\n<h3>6.5 Data, application and virtual-machine security<\/h3>\n<p>Data: encryption at rest/in transit, key management, classification, backup, secure deletion. Application: secure coding, OWASP Top 10, API security, testing. VM: hypervisor hardening, patching, image security, isolation, preventing VM escape and sprawl.<\/p>\n<h3>6.6 Legal issues and multi-tenancy issues<\/h3>\n<p>Legal: jurisdiction, data-protection laws, e-discovery, contracts and SLAs, liability. Multi-tenancy: logical isolation of compute, storage and network between customers; noisy-neighbour effects; side-channel risks.<\/p>\n<p><strong>Key points:<\/strong> risk list · SaaS security duties · monitoring tools · layered architecture · data/app/VM controls · legal and multi-tenancy issues.<\/p>", "7": "<p>Major providers offer ready-made platforms on which developers build cloud applications, used in science, business and everyday consumer services.<\/p>\n<h3>7.1 Web services<\/h3>\n<p>Software services accessible over the web via standard protocols: SOAP (XML, WSDL, UDDI) and REST (HTTP verbs, JSON, stateless). Cloud services expose REST APIs that applications combine (mashups, microservices).<\/p>\n<h3>7.2 Google App Engine<\/h3>\n<p>PaaS for scalable web apps; Standard (sandboxed runtimes, scale to zero) and Flexible (containers) environments; automatic scaling and load balancing; Datastore/Firestore, Cloud SQL, Memcache, task queues; versioning and traffic splitting.<\/p>\n<h3>7.3 Microsoft Azure<\/h3>\n<p>Public cloud with IaaS (VMs), PaaS (App Service, Functions, Azure SQL, Cosmos DB), storage (Blob, Files), containers (AKS), identity (Entra ID), AI services, hybrid (Azure Arc, Stack); organised by regions and availability zones.<\/p>\n<h3>7.4 Aneka<\/h3>\n<p>.NET-based cloud application platform (Manjrasoft / University of Melbourne) for building private and hybrid clouds; supports task, thread and MapReduce programming models; container-based services for scheduling, execution, storage, accounting, dynamic provisioning to public clouds.<\/p>\n<h3>7.5 Open challenges<\/h3>\n<p>Interoperability and standards, security and privacy, portability and lock-in, energy efficiency, performance predictability, SLA management, legal/regulatory issues, programming models, cost management, edge integration.<\/p>\n<h3>7.6 Scientific, business and consumer applications<\/h3>\n<p>Scientific: healthcare (ECG analysis), genomics/protein structure, satellite imagery, climate modelling. Business: CRM/ERP SaaS, collaboration and productivity, analytics, e-commerce. Consumer: storage, streaming, social media, gaming, email.<\/p>\n<p><strong>Key points:<\/strong> SOAP vs REST · App Engine features · Azure services · Aneka models · open challenges · application examples.<\/p>"}, "qa": [{"id": "IT277-01", "t": "Cloud computing: definition, evolution, characteristics", "u": 1, "q": "Define cloud computing. Explain its evolution and essential characteristics.", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"M26": "A1"}, "rep": false, "src": "TU Model Question 2026 A1", "a": "<p><strong>Cloud computing (NIST):<\/strong> a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (networks, servers, storage, applications, services) that can be rapidly provisioned and released with minimal management effort or service-provider interaction.<\/p>\n<p><strong>Evolution:<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 354\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Mainframes &amp; time-sharing<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Client–server<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Grid &amp; cluster computing<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Utility computing &amp; virtualisation<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">SOA / web services<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Cloud computing (AWS 2006 onward)<\/text><\/svg><\/div>\n\n<p><strong>Essential characteristics (NIST)<\/strong><\/p>\n<ol>\n<li><strong>On-demand self-service<\/strong> — provision resources without human interaction.<\/li>\n<li><strong>Broad network access<\/strong> — via the Internet from any device.<\/li>\n<li><strong>Resource pooling<\/strong> — multi-tenant shared resources, location independence.<\/li>\n<li><strong>Rapid elasticity<\/strong> — scale up/down quickly.<\/li>\n<li><strong>Measured service<\/strong> — metered, pay-per-use.<\/li>\n<\/ol>\n<p><em>Other features:<\/em> high availability, automatic updates, scalability, and service models (IaaS, PaaS, SaaS) delivered through deployment models (public, private, hybrid, community).<\/p>"}, {"id": "IT277-02", "t": "Advantages and disadvantages; applications; adoption", "u": 1, "q": "Explain the advantages and disadvantages of cloud computing.", "m": 3, "p": "High", "ty": "List", "seen": {"M26": "Q12"}, "rep": false, "src": "TU Model Question 2026 Q12", "a": "<p><strong>Advantages:<\/strong> lower capital cost (OPEX instead of CAPEX) · pay-as-you-go · scalability and elasticity · anywhere access and mobility · faster deployment and time-to-market · automatic updates and maintenance by the provider · disaster recovery and backup · collaboration · green IT (shared resources) · focus on core business.\n<strong>Disadvantages / challenges:<\/strong> security and privacy concerns · dependence on Internet connectivity · downtime/outages · vendor lock-in · limited control and customisation · data-location and legal compliance issues · hidden or unpredictable costs · performance variability (latency).\n<strong>Applications:<\/strong> email and office apps, storage and backup, e-commerce hosting, big-data analytics, ERP/CRM SaaS, e-learning, healthcare records, banking, IoT back-ends, AI/ML services.<\/p>"}, {"id": "IT277-03", "t": "Cloud storage; dynamic infrastructure", "u": 1, "q": "What is cloud storage? Explain dynamic infrastructure.", "m": 3, "p": "Medium", "ty": "Definition", "seen": {"M26": "A4"}, "rep": false, "src": "TU Model Question 2026 A4", "a": "<p><strong>Cloud storage:<\/strong> storing data on remote servers managed by a provider and accessed over the Internet, paid per use. Types: <strong>object storage<\/strong> (Amazon S3, Azure Blob — unstructured data, scalable), <strong>block storage<\/strong> (EBS — disks for VMs), <strong>file storage<\/strong> (EFS, Azure Files). Consumer examples: Google Drive, OneDrive, Dropbox. Benefits: scalability, durability through replication, anywhere access; concerns: security, bandwidth, cost of egress.<\/p>\n<p><strong>Dynamic infrastructure:<\/strong> an IT infrastructure that automatically adapts to changing workloads — resources are virtualised, pooled and allocated or released automatically (auto-scaling, load balancing, self-healing). It underpins elasticity, efficiency and resilience in the cloud.<\/p>"}, {"id": "IT277-04", "t": "Cloud service requirements", "u": 1, "q": "Explain cloud service requirements with an example.", "m": 5, "p": "High", "ty": "Explanation + example", "seen": {"M26": "Q17"}, "rep": false, "src": "TU Model Question 2026 Q17", "a": "<p>Requirements a cloud service must satisfy for consumers and providers:<\/p>\n<ol>\n<li><strong>Scalability and elasticity<\/strong> — handle peak loads automatically.<\/li>\n<li><strong>Availability and reliability<\/strong> — high uptime (e.g. 99.9%+), redundancy, failover.<\/li>\n<li><strong>Security and privacy<\/strong> — authentication, encryption, access control, compliance.<\/li>\n<li><strong>Performance<\/strong> — low latency, adequate throughput.<\/li>\n<li><strong>Multi-tenancy with isolation.<\/strong><\/li>\n<li><strong>Interoperability and portability<\/strong> — standard APIs; avoid lock-in.<\/li>\n<li><strong>Manageability and monitoring<\/strong> — dashboards, logging, metering.<\/li>\n<li><strong>Service Level Agreement (SLA)<\/strong> — measurable commitments and penalties.<\/li>\n<li><strong>Cost-effectiveness / transparent billing<\/strong> (metered usage).<\/li>\n<li><strong>Data backup, recovery and legal compliance<\/strong> (data location).<\/li>\n<\/ol>\n<p><strong>Example — an online exam portal hosted in the cloud for a university:<\/strong> it must auto-scale for 20,000 simultaneous students during exams (elasticity), stay available (99.9% SLA, multi-zone deployment), protect question papers and results (encryption, IAM roles), keep response time under 2 seconds (performance, CDN), back up answer data (recovery), and cost little outside exam periods (pay-per-use).<\/p>"}, {"id": "IT277-05", "t": "IaaS, PaaS, SaaS; PaaS vs IaaS", "u": 2, "q": "Explain IaaS, PaaS and SaaS. Compare PaaS with IaaS.", "m": 5, "p": "High", "ty": "Comparison + diagram", "seen": {"M26": "A2, Q11"}, "rep": false, "src": "TU Model Question 2026 A2, Q11", "a": "<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 178\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">SaaS — complete applications (Gmail, Microsoft 365, Salesforce)<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">PaaS — runtime, middleware, databases, dev tools (Google App Engine, Azure App Service, Heroku)<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">IaaS — virtual machines, storage, networks (Amazon EC2, Azure VMs, Google Compute Engine)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Physical data centre: servers, storage, network, virtualisation layer<\/text><\/svg><\/div>\n\n<table>\n<thead>\n<tr>\n<th>Layer managed by →<\/th>\n<th>IaaS<\/th>\n<th>PaaS<\/th>\n<th>SaaS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Applications<\/td>\n<td>Customer<\/td>\n<td>Customer<\/td>\n<td>Provider<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td>Customer<\/td>\n<td>Customer<\/td>\n<td>Provider (customer owns)<\/td>\n<\/tr>\n<tr>\n<td>Runtime / middleware<\/td>\n<td>Customer<\/td>\n<td>Provider<\/td>\n<td>Provider<\/td>\n<\/tr>\n<tr>\n<td>OS<\/td>\n<td>Customer<\/td>\n<td>Provider<\/td>\n<td>Provider<\/td>\n<\/tr>\n<tr>\n<td>Virtualisation, servers, storage, network<\/td>\n<td>Provider<\/td>\n<td>Provider<\/td>\n<td>Provider<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>SaaS:<\/strong> software delivered over the Internet on subscription; no installation; accessed through a browser.<\/p>\n<p><strong>PaaS vs IaaS<\/strong>\n| Basis | IaaS | PaaS |\n|---|---|---|\n| Provides | Raw infrastructure (VMs, storage) | Platform to develop/deploy apps |\n| Control | High (OS, middleware) | Lower (only code and data) |\n| Management effort | High — patching OS | Low — provider manages stack |\n| Users | System administrators | Developers |\n| Flexibility | Maximum | Limited to supported languages |\n| Example | Amazon EC2 | Google App Engine |<\/p>\n<p><strong>Startup scenario tip:<\/strong> a small startup with a web app and few admins → <strong>PaaS<\/strong> (fast deployment, auto-scaling, no server management); needs full OS control → IaaS; needs only email/CRM → SaaS.<\/p>"}, {"id": "IT277-06", "t": "Deployment models: public, private, community, hybrid", "u": 2, "q": "Explain public, private, community and hybrid clouds.", "m": 3, "p": "High", "ty": "Comparison", "seen": {"M26": "A3, Q11"}, "rep": false, "src": "TU Model Question 2026 A3, Q11", "a": "<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Meaning<\/th>\n<th>Pros<\/th>\n<th>Cons<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Public<\/strong><\/td>\n<td>Resources owned by a provider, shared by the general public over the Internet<\/td>\n<td>Cheap, scalable, no maintenance<\/td>\n<td>Less control, security concerns<\/td>\n<td>AWS, Azure, GCP<\/td>\n<\/tr>\n<tr>\n<td><strong>Private<\/strong><\/td>\n<td>Cloud used exclusively by one organisation (on-premise or hosted)<\/td>\n<td>Control, security, compliance<\/td>\n<td>Costly, less elastic<\/td>\n<td>A bank's internal cloud, Nepal's Government Integrated Data Centre<\/td>\n<\/tr>\n<tr>\n<td><strong>Community<\/strong><\/td>\n<td>Shared by organisations with common concerns (regulation, mission)<\/td>\n<td>Shared cost, common compliance<\/td>\n<td>Limited users, governance complexity<\/td>\n<td>Shared cloud for universities or hospitals<\/td>\n<\/tr>\n<tr>\n<td><strong>Hybrid<\/strong><\/td>\n<td>Combination of two or more clouds bound by technology allowing data/app portability<\/td>\n<td>Flexibility, cloud bursting, keep sensitive data private<\/td>\n<td>Complexity, integration<\/td>\n<td>Bank core in private cloud, website on public cloud<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT277-07", "t": "SOA-based cloud design; security, trust, privacy", "u": 2, "q": "What is SOA? Explain SOA-based cloud design and implementation.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "A5"}, "rep": false, "src": "TU Model Question 2026 A5", "a": "<p><strong>SOA (Service-Oriented Architecture):<\/strong> an architectural style in which applications are built from <strong>loosely coupled, reusable services<\/strong> that communicate over a network through standard interfaces (SOAP/WSDL or REST/JSON).\n<strong>Principles:<\/strong> loose coupling, reusability, abstraction, interoperability, discoverability (service registry), composability.\n<strong>SOA in the cloud:<\/strong> cloud services are themselves exposed as services through APIs (e.g. storage API, compute API). Cloud applications are designed as services/microservices composed through an <strong>enterprise service bus<\/strong> or API gateway; each service scales independently on cloud infrastructure.\n<strong>Security, trust and privacy concerns:<\/strong> identity federation across services, secure APIs (OAuth tokens, TLS), trust in third-party providers (certifications such as ISO 27001, SOC 2), data privacy and location (GDPR, local laws).<\/p>"}, {"id": "IT277-08", "t": "Cloud migration, licensing, cost models, SLA", "u": 3, "q": "Explain cloud migration strategies, software licensing and cloud cost models. What is an SLA?", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Migration strategies (the \"R\"s):<\/strong> <strong>Rehost<\/strong> (lift-and-shift VMs) · <strong>Replatform<\/strong> (minor changes, e.g. managed DB) · <strong>Refactor/Re-architect<\/strong> (cloud-native microservices) · <strong>Repurchase<\/strong> (move to SaaS) · <strong>Retire<\/strong> · <strong>Retain<\/strong>.\n<strong>Migration steps:<\/strong> assess and plan (inventory, TCO, dependencies) → choose provider and model → pilot → migrate data and apps → test → optimise and monitor.<\/p>\n<p><strong>Software licensing in the cloud:<\/strong> subscription (per user/month) · pay-as-you-go (per hour/usage) · <strong>BYOL<\/strong> (bring your own licence) · open-source licences · licence restrictions on virtualised/multi-tenant environments.<\/p>\n<p><strong>Cost models:<\/strong> pay-as-you-go (on-demand) · reserved/committed instances (discount for 1–3 year commitment) · spot/pre-emptible instances (cheap, interruptible) · subscription · freemium. Cost factors: compute hours, storage GB-month, data transfer (egress), requests. <strong>TCO<\/strong> comparison with on-premise.<\/p>\n<p><strong>SLA (Service Level Agreement):<\/strong> a contract defining service levels — availability (e.g. 99.95%), performance, support response times, data protection, responsibilities, and penalties/credits if missed. <strong>Web-application design for the cloud:<\/strong> stateless app servers, auto-scaling groups, load balancers, managed databases, CDN, caching, secure configuration.<\/p>"}, {"id": "IT277-09", "t": "Virtualisation concept and types", "u": 4, "q": "What is virtualisation? Explain the types of virtualisation with examples.", "m": 3, "p": "High", "ty": "Classification + examples", "seen": {"M26": "A6, Q14"}, "rep": false, "src": "TU Model Question 2026 A6, Q14", "a": "<p><strong>Virtualisation<\/strong> is the creation of virtual (software-based) versions of computing resources — servers, storage, networks, desktops — so that one physical resource can run many isolated virtual instances.<\/p>\n<p><strong>Types<\/strong><\/p>\n<ol>\n<li><strong>Server/hardware virtualisation<\/strong> — many VMs on one physical server (VMware ESXi, Hyper-V, KVM).<\/li>\n<li><strong>Desktop virtualisation (VDI)<\/strong> — desktops hosted centrally, accessed remotely (Citrix, VMware Horizon).<\/li>\n<li><strong>Storage virtualisation<\/strong> — pooling physical storage into one logical pool (SAN, vSAN).<\/li>\n<li><strong>Network virtualisation<\/strong> — virtual networks independent of hardware (VLANs, SDN, VMware NSX).<\/li>\n<li><strong>Application virtualisation<\/strong> — apps run in isolated environments without installation (App-V); <strong>containers<\/strong> (Docker) virtualise at OS level.<\/li>\n<li><strong>Memory and data virtualisation.<\/strong><\/li>\n<\/ol>\n<p><strong>By technique:<\/strong> full virtualisation (unmodified guest OS; binary translation/hardware assist) · para-virtualisation (guest OS modified to cooperate — Xen) · hardware-assisted virtualisation (Intel VT-x, AMD-V) · OS-level virtualisation (containers).<\/p>"}, {"id": "IT277-10", "t": "Implementation levels; server virtualisation; load balancing", "u": 4, "q": "Explain the implementation levels of virtualisation, server virtualisation and load balancing.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Implementation levels<\/strong><\/p>\n<ol>\n<li><strong>Instruction Set Architecture (ISA) level<\/strong> — emulation of one ISA on another (QEMU, Bochs).<\/li>\n<li><strong>Hardware Abstraction level<\/strong> — hypervisor virtualises hardware directly (VMware ESXi, Xen, Hyper-V).<\/li>\n<li><strong>Operating-system level<\/strong> — containers share one OS kernel (Docker, LXC, OpenVZ).<\/li>\n<li><strong>Library (API) level<\/strong> — virtualises the user-level API (WINE, vCUDA).<\/li>\n<li><strong>Application level<\/strong> — process-level VMs (JVM, .NET CLR).<\/li>\n<\/ol>\n<p><strong>Server virtualisation:<\/strong> partitions a physical server into multiple VMs, each with its own OS. Benefits: server consolidation, higher utilisation, lower power and space, fast provisioning, live migration (vMotion), isolation, easier backup and DR. Software: VMware vSphere, Microsoft Hyper-V, KVM, Xen, Oracle VirtualBox (desktop).<\/p>\n<p><strong>Load balancing:<\/strong> distributing incoming requests across multiple servers/VMs to optimise resource use, maximise throughput and avoid overload. Algorithms: round-robin, least connections, weighted, IP hash; static vs dynamic. Cloud examples: AWS Elastic Load Balancer, Azure Load Balancer. Works with auto-scaling for elasticity and fault tolerance.<\/p>\n<p><strong>Infrastructure requirements:<\/strong> CPUs with virtualisation support, ample RAM, shared storage (SAN/NAS), high-speed networking, hypervisor licences, management tools, backup and monitoring.<\/p>"}, {"id": "IT277-11", "t": "Virtualisation's role in cloud; hypervisor types", "u": 4, "q": "Explain virtualisation and its role in cloud computing, with hypervisor types and examples.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M26": "Q13, Q21"}, "rep": false, "src": "TU Model Question 2026 Q13, Q21", "a": "<p><strong>Virtualisation<\/strong> abstracts physical hardware into multiple isolated virtual machines (VMs), each running its own OS and applications.<\/p>\n<p><strong>Hypervisor (Virtual Machine Monitor, VMM):<\/strong> the software layer that creates, runs and manages VMs and allocates CPU, memory, storage and network to them.<\/p>\n<p><strong>Type 1 — bare-metal (native) hypervisor:<\/strong> runs directly on the hardware without a host OS.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 134\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">VM 1 (Linux) · VM 2 (Windows) · VM 3<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Type 1 hypervisor<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Physical hardware<\/text><\/svg><\/div>\n\n<p><em>Examples:<\/em> VMware ESXi, Microsoft Hyper-V, Xen, KVM (Linux kernel-based), Citrix Hypervisor. <em>Features:<\/em> high performance, security, used in data centres and clouds (AWS uses Xen/Nitro (KVM-based), Azure uses Hyper-V).<\/p>\n<p><strong>Type 2 — hosted hypervisor:<\/strong> runs as an application on a host operating system.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 178\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">VM 1 · VM 2<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Type 2 hypervisor<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Host OS (Windows/macOS/Linux)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Physical hardware<\/text><\/svg><\/div>\n\n<p><em>Examples:<\/em> Oracle VirtualBox, VMware Workstation/Fusion, Parallels. <em>Features:<\/em> easy to install, good for testing and development, lower performance.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Type 1<\/th>\n<th>Type 2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Runs on<\/td>\n<td>Hardware<\/td>\n<td>Host OS<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>High<\/td>\n<td>Lower (extra layer)<\/td>\n<\/tr>\n<tr>\n<td>Security<\/td>\n<td>Stronger<\/td>\n<td>Depends on host OS<\/td>\n<\/tr>\n<tr>\n<td>Use<\/td>\n<td>Production data centres, clouds<\/td>\n<td>Desktops, labs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Role of virtualisation in cloud computing<\/strong><\/p>\n<ol>\n<li><strong>Foundation of IaaS<\/strong> — VMs are what customers rent.<\/li>\n<li><strong>Resource pooling and multi-tenancy<\/strong> — many customers share hardware securely.<\/li>\n<li><strong>Rapid elasticity<\/strong> — VMs are created/destroyed in minutes; auto-scaling.<\/li>\n<li><strong>Higher utilisation and lower cost<\/strong> — server consolidation.<\/li>\n<li><strong>Isolation and security<\/strong> between tenants.<\/li>\n<li><strong>Live migration and high availability<\/strong> — move VMs without downtime.<\/li>\n<li><strong>Snapshots, backup and disaster recovery.<\/strong><\/li>\n<li><strong>Metering<\/strong> — usage per VM enables pay-per-use billing.<\/li>\n<li><strong>Containers<\/strong> (Docker, Kubernetes) extend virtualisation for PaaS and microservices.<\/li>\n<\/ol>\n<p><strong>Conclusion:<\/strong> without virtualisation, the on-demand, elastic, shared nature of the cloud would not be possible.<\/p>"}, {"id": "IT277-12", "t": "Parallel computing; MapReduce working", "u": 5, "q": "What is parallel computing? Explain the working of MapReduce architecture.", "m": 5, "p": "High", "ty": "Architecture + example", "seen": {"M26": "A8, Q19"}, "rep": false, "src": "TU Model Question 2026 A8, Q19", "a": "<p><strong>Parallel computing:<\/strong> solving a problem by dividing it into parts that are executed <strong>simultaneously<\/strong> on multiple processors/machines to reduce execution time (data parallelism, task parallelism; shared-memory vs distributed-memory).<\/p>\n<p><strong>MapReduce<\/strong> (Google, 2004; implemented in Apache Hadoop) is a programming model for processing huge datasets in parallel across a cluster of commodity machines.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Input splits<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(HDFS)<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Map tasks: (key,<\/text><text x=\"224.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">value)<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Shuffle &amp; sort<\/text><text x=\"382.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(group by key)<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Reduce tasks:<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">aggregate<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Output (HDFS)<\/text><\/svg><\/div>\n\n<p><strong>Working (word-count example)<\/strong><\/p>\n<ol>\n<li><strong>Input split:<\/strong> a large file is split into blocks (e.g. 128 MB) stored on HDFS nodes.<\/li>\n<li><strong>Map phase:<\/strong> each mapper processes its split and emits intermediate key–value pairs: \"cloud is big cloud\" → (cloud,1), (is,1), (big,1), (cloud,1).<\/li>\n<li><strong>Combiner (optional):<\/strong> local aggregation → (cloud,2).<\/li>\n<li><strong>Shuffle and sort:<\/strong> pairs are transferred to reducers and grouped by key: cloud → [2, 1, …].<\/li>\n<li><strong>Reduce phase:<\/strong> each reducer aggregates values: (cloud, 3).<\/li>\n<li><strong>Output<\/strong> written to HDFS.<\/li>\n<\/ol>\n<p><strong>Architecture (Hadoop 1):<\/strong> a <strong>JobTracker<\/strong> (master) schedules tasks; <strong>TaskTrackers<\/strong> (slaves) run map/reduce tasks; in Hadoop 2+ <strong>YARN<\/strong> (ResourceManager + NodeManagers + ApplicationMaster) manages resources. <strong>Data locality:<\/strong> computation moves to where the data lives. <strong>Fault tolerance:<\/strong> failed tasks are re-executed on other nodes.<\/p>"}, {"id": "IT277-13", "t": "Parallel efficiency; applications; batch processing", "u": 5, "q": "Explain the parallel efficiency of MapReduce and its applications in enterprise batch processing.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "Q15"}, "rep": false, "src": "TU Model Question 2026 Q15", "a": "<p><strong>Speed-up<\/strong> S(p) = T₁ / Tₚ (time on one machine ÷ time on p machines). <strong>Parallel efficiency<\/strong> E = S(p) / p — ideally 1 (100%).\nFor MapReduce, efficiency is high when data is large and work is evenly divided. It drops because of <strong>overheads<\/strong>: the shuffle (network transfer), job start-up and scheduling, disk I/O between phases, <strong>stragglers<\/strong> (slow tasks — mitigated by speculative execution), and data skew (unequal keys). Using combiners, data locality and balanced partitioning improves efficiency.\n<em>Example:<\/em> if a job takes 100 min on 1 node and 12.5 min on 10 nodes, S = 8 and E = 0.8 (80%).<\/p>\n<p><strong>Applications / enterprise batch processing:<\/strong> log analysis, indexing web pages, ETL for data warehouses, recommendation computation, fraud-pattern detection over transactions, billing and payroll batch runs, large-scale sorting and joining, scientific simulations. MapReduce suits <strong>batch<\/strong> (not real-time) jobs; Spark is used for faster in-memory processing.<\/p>"}, {"id": "IT277-14", "t": "Cloud security: issues, challenges, concepts", "u": 6, "q": "Explain cloud security concepts and the security issues and challenges in the cloud.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q18"}, "rep": false, "src": "TU Model Question 2026 Q18", "a": "<p><strong>Core concepts<\/strong><\/p>\n<ul>\n<li><strong>CIA triad<\/strong> — confidentiality, integrity, availability.<\/li>\n<li><strong>Shared responsibility model<\/strong> — the provider secures the cloud (physical, hypervisor, infrastructure); the customer secures what is in the cloud (data, identities, configurations, applications). Responsibility shifts with IaaS → PaaS → SaaS.<\/li>\n<li><strong>Identity and Access Management (IAM)<\/strong> — least privilege, MFA, roles.<\/li>\n<li><strong>Encryption<\/strong> — at rest and in transit; key management (KMS, HSM).<\/li>\n<li><strong>Network security<\/strong> — firewalls, security groups, VPN, VPC isolation.<\/li>\n<li><strong>Monitoring, logging and auditing.<\/strong><\/li>\n<li><strong>Compliance<\/strong> — ISO 27001, SOC 2, PCI-DSS, GDPR.<\/li>\n<\/ul>\n<p><strong>Issues and challenges:<\/strong> data breaches · misconfiguration (open storage buckets) · insecure APIs · account hijacking · insider threats · multi-tenancy and data leakage between tenants · data loss · DDoS · lack of visibility and control · compliance and data location · vendor lock-in · shadow IT.<\/p>"}, {"id": "IT277-15", "t": "Data security issues; VM security; security monitoring; SaaS security", "u": 6, "q": "Explain common data-security issues in the cloud. What are VM security and security monitoring?", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "A7, A9, Q16"}, "rep": false, "src": "TU Model Question 2026 A7, A9, Q16", "a": "<p><strong>Data-security issues:<\/strong> confidentiality (unauthorised access, breaches) · integrity (tampering) · data loss (deletion, provider failure) · data location and sovereignty · data remanence (residual data after deletion) · data leakage between tenants · insecure transfer · weak key management · backup and retention · lawful access by foreign governments.\n<strong>Controls:<\/strong> encryption, tokenisation, access controls, data classification, DLP, backups, secure deletion.<\/p>\n<p><strong>Virtual machine security:<\/strong> protecting VMs and the hypervisor — patching guest OS and hypervisor, isolation between VMs, preventing VM escape and VM sprawl, securing VM images and snapshots, anti-malware, virtual firewalls, monitoring inter-VM traffic.<\/p>\n<p><strong>Security monitoring:<\/strong> continuous collection and analysis of logs and events to detect threats — CloudTrail/Azure Monitor logs, SIEM, intrusion detection, alerts, anomaly detection, vulnerability scanning.<\/p>\n<p><strong>SaaS security:<\/strong> the provider controls most of the stack, so customers focus on identity (SSO, MFA), data access permissions, CASB tools, vendor assessment and contract/SLA terms.<\/p>"}, {"id": "IT277-16", "t": "Cloud security architecture", "u": 6, "q": "Explain cloud security architecture.", "m": 5, "p": "High", "ty": "Architecture", "seen": {"M26": "Q20"}, "rep": false, "src": "TU Model Question 2026 Q20", "a": "<p>A <strong>cloud security architecture<\/strong> is the layered set of controls, tools and policies that protect cloud resources.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Governance, risk &amp; compliance (policies, audits, SLA)<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Identity &amp; access management (IAM, SSO, MFA, RBAC)<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Application security (secure SDLC, WAF, API gateway)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data security (encryption, KMS, DLP, backup)<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Host / VM / container security (hardening, patching, hypervisor isolation)<\/text><rect x=\"2\" y=\"222\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#fafbfe\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"245.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Network security (VPC, security groups, firewalls, IDS/IPS, DDoS protection)<\/text><rect x=\"2\" y=\"266\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#fafbfe\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"289.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Physical data-centre security (provider)<\/text><\/svg><\/div>\n\n<p><strong>Cross-cutting:<\/strong> security monitoring and SIEM, incident response, vulnerability management.\n<strong>Design principles:<\/strong> defence in depth · least privilege · zero trust (\"never trust, always verify\") · secure by default · automation (infrastructure as code with security checks) · shared-responsibility awareness · encryption everywhere.\n<strong>Legal and multi-tenancy issues:<\/strong> data protection laws, jurisdiction and e-discovery, contracts and SLAs; ensuring logical isolation between tenants in compute, storage and network.<\/p>"}, {"id": "IT277-17", "t": "Cloud security risks and mitigation strategies", "u": 6, "q": "Explain the risks of cloud security and strategies to mitigate them.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M26": "Q22"}, "rep": false, "src": "TU Model Question 2026 Q22", "a": "<table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>Description<\/th>\n<th>Mitigation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Data breach / loss of confidentiality<\/strong><\/td>\n<td>Unauthorised access to sensitive data<\/td>\n<td>Encryption at rest and in transit, strong IAM, data classification, DLP<\/td>\n<\/tr>\n<tr>\n<td><strong>Misconfiguration<\/strong><\/td>\n<td>Public storage buckets, open ports<\/td>\n<td>Configuration audits, CSPM tools, infrastructure as code, least-privilege defaults<\/td>\n<\/tr>\n<tr>\n<td><strong>Insecure APIs/interfaces<\/strong><\/td>\n<td>Weak authentication, injection<\/td>\n<td>API gateways, OAuth 2.0, input validation, rate limiting, security testing<\/td>\n<\/tr>\n<tr>\n<td><strong>Account hijacking<\/strong><\/td>\n<td>Stolen credentials, phishing<\/td>\n<td>MFA, strong password policies, monitoring for anomalies, no shared accounts<\/td>\n<\/tr>\n<tr>\n<td><strong>Insider threats<\/strong><\/td>\n<td>Malicious or careless employees (customer or provider)<\/td>\n<td>Role-based access, separation of duties, logging and audits, background checks<\/td>\n<\/tr>\n<tr>\n<td><strong>Data loss<\/strong><\/td>\n<td>Accidental deletion, disasters, ransomware<\/td>\n<td>Backups (3-2-1), versioning, multi-region replication, DR plans<\/td>\n<\/tr>\n<tr>\n<td><strong>DDoS / availability attacks<\/strong><\/td>\n<td>Service unavailable<\/td>\n<td>DDoS protection (AWS Shield, Cloudflare), auto-scaling, CDN<\/td>\n<\/tr>\n<tr>\n<td><strong>Multi-tenancy / VM escape<\/strong><\/td>\n<td>Data leakage between tenants<\/td>\n<td>Hypervisor hardening, isolation, provider certifications<\/td>\n<\/tr>\n<tr>\n<td><strong>Vendor lock-in &amp; provider failure<\/strong><\/td>\n<td>Difficult exit<\/td>\n<td>Open standards, multi-cloud strategy, exit clauses in contracts<\/td>\n<\/tr>\n<tr>\n<td><strong>Compliance / legal risk<\/strong><\/td>\n<td>Data location, regulations<\/td>\n<td>Choose regions, compliance certifications, contracts, data-residency controls<\/td>\n<\/tr>\n<tr>\n<td><strong>Lack of visibility<\/strong><\/td>\n<td>Shadow IT<\/td>\n<td>CASB, centralised logging, SIEM<\/td>\n<\/tr>\n<tr>\n<td><strong>Malware / ransomware<\/strong><\/td>\n<td>Infected workloads<\/td>\n<td>Endpoint protection, patching, immutable backups<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Overall strategy:<\/strong> understand the shared-responsibility model · risk assessment · security policies and governance · zero-trust architecture · continuous monitoring and incident response · employee training · regular penetration testing and audits · strong SLAs with providers.<\/p>\n<p><strong>Conclusion:<\/strong> cloud can be more secure than on-premise when customers correctly configure and manage their side of the responsibility.<\/p>"}, {"id": "IT277-18", "t": "Web services; AppEngine, Azure, Aneka", "u": 7, "q": "What is Google AppEngine? Explain the cloud platforms AppEngine, Microsoft Azure and Aneka.", "m": 5, "p": "High", "ty": "Platform comparison", "seen": {"M26": "A10"}, "rep": false, "src": "TU Model Question 2026 A10", "a": "<p><strong>Web services<\/strong> — software components accessible over the web through standard protocols (SOAP/WSDL, REST/HTTP, JSON/XML); the basis for integrating cloud applications.<\/p>\n<p><strong>Google App Engine (GAE)<\/strong> — Google's <strong>PaaS<\/strong> for building and hosting web applications on Google's infrastructure. Features: automatic scaling, load balancing, managed runtimes (Python, Java, Go, Node.js, PHP, .NET), Standard and Flexible environments, Datastore/Firestore and Cloud SQL, task queues, versioning and traffic splitting, pay per use. Developers only upload code.<\/p>\n<p><strong>Microsoft Azure<\/strong> — Microsoft's public cloud offering IaaS, PaaS and SaaS: Virtual Machines, App Service, Azure Functions (serverless), Azure SQL Database, Blob Storage, Cosmos DB, AKS (Kubernetes), Azure AD (Entra ID) identity, AI services; strong integration with Windows/.NET and hybrid (Azure Arc, Azure Stack).<\/p>\n<p><strong>Aneka<\/strong> — a <strong>.NET-based cloud application platform (PaaS middleware)<\/strong> developed at the University of Melbourne (CLOUDS Lab) and commercialised by Manjrasoft. It builds private/hybrid clouds from desktops, clusters and public-cloud VMs. Supports multiple programming models: <strong>task<\/strong>, <strong>thread<\/strong> and <strong>MapReduce<\/strong>; components include a container with services for scheduling, execution, storage, accounting and resource provisioning (it can burst to public clouds).<\/p>\n<table>\n<thead>\n<tr>\n<th>Platform<\/th>\n<th>Type<\/th>\n<th>Key strength<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>App Engine<\/td>\n<td>PaaS<\/td>\n<td>Zero server management, auto-scaling web apps<\/td>\n<\/tr>\n<tr>\n<td>Azure<\/td>\n<td>IaaS + PaaS + SaaS<\/td>\n<td>Enterprise and hybrid, .NET integration<\/td>\n<\/tr>\n<tr>\n<td>Aneka<\/td>\n<td>PaaS middleware<\/td>\n<td>Multiple programming models, private/hybrid clouds for compute-intensive jobs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT277-19", "t": "Open challenges; scientific, business, consumer applications", "u": 7, "q": "Explain the open challenges of cloud computing and its scientific, business and consumer applications.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Open challenges:<\/strong> cloud interoperability and standards · security, privacy and trust · data lock-in and portability · energy efficiency (green clouds) · performance unpredictability · SLA management · legal and regulatory issues (jurisdiction) · scalable programming models · cost management (FinOps) · edge–cloud integration.<\/p>\n<p><strong>Scientific applications:<\/strong> healthcare (ECG analysis in the cloud), genomics/protein structure prediction, satellite image processing, climate modelling, high-energy physics data analysis.\n<strong>Business applications:<\/strong> CRM and ERP (Salesforce, SAP on cloud), productivity and collaboration (Microsoft 365, Google Workspace), e-commerce hosting, analytics and BI, backup and DR.\n<strong>Consumer applications:<\/strong> online storage (Google Drive, iCloud), streaming (Netflix, Spotify), social networking, online gaming, photo services, email.<\/p>"}], "defs": [["Cloud computing", "On-demand network access to a shared pool of configurable resources, rapidly provisioned, pay-per-use."], ["SaaS", "Software delivered over the Internet on subscription."], ["PaaS", "Platform for developing and deploying applications without managing infrastructure."], ["IaaS", "Rented virtual infrastructure: servers, storage, networks."], ["Public cloud", "Cloud open to the general public, owned by a provider."], ["Private cloud", "Cloud used exclusively by one organisation."], ["Hybrid cloud", "Combination of public and private clouds with portability."], ["SOA", "Architecture of loosely coupled reusable services."], ["Cloud storage", "Remote, provider-managed data storage accessed over the Internet."], ["Virtualisation", "Creating virtual versions of computing resources."], ["Hypervisor", "Software that creates and manages virtual machines (Type 1 bare-metal; Type 2 hosted)."], ["Load balancing", "Distributing workload across servers."], ["Parallel computing", "Simultaneous execution of parts of a problem on multiple processors."], ["MapReduce", "Programming model of map, shuffle and reduce for parallel big-data processing."], ["Parallel efficiency", "Speed-up divided by number of processors."], ["VM security", "Protection of virtual machines and the hypervisor."], ["Security monitoring", "Continuous analysis of logs and events to detect threats."], ["SLA", "Contract specifying service levels and penalties."], ["Google App Engine", "Google's PaaS for hosting scalable web apps."], ["Aneka", ".NET-based cloud middleware supporting task, thread and MapReduce models."]], "revision": "<p><strong>IT 277 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> NIST definition + 5 characteristics · evolution · pros/cons · cloud storage (object/block/file) · dynamic infrastructure · 10 service requirements + example.<\/li>\n<li><strong>U2:<\/strong> IaaS/PaaS/SaaS stack + responsibility table · PaaS vs IaaS · public/private/community/hybrid · SOA principles · trust and privacy.<\/li>\n<li><strong>U3:<\/strong> 6 R's of migration · licensing (subscription, PAYG, BYOL) · cost models (on-demand, reserved, spot) · SLA · cloud web-app design.<\/li>\n<li><strong>U4:<\/strong> virtualisation types (server, desktop, storage, network, application, container) · full/para/hardware-assisted · 5 implementation levels · Type 1 vs Type 2 hypervisor (examples) · role in cloud (9 points) · load-balancing algorithms.<\/li>\n<li><strong>U5:<\/strong> parallel computing · MapReduce flow (split → map → combine → shuffle/sort → reduce) with word count · JobTracker/TaskTracker, YARN · speed-up and efficiency, overheads.<\/li>\n<li><strong>U6:<\/strong> CIA, shared responsibility, IAM, encryption · issues · data security · VM security · monitoring/SIEM · layered security architecture · risk–mitigation table.<\/li>\n<li><strong>U7:<\/strong> web services · App Engine vs Azure vs Aneka · open challenges · scientific/business/consumer apps.<\/li>\n<\/ul>", "practice": ["[AI practice] Define hybrid cloud. (1)", "[AI practice] Differentiate virtual machines and containers. (3)", "[AI practice] A startup wants to host its web application with minimal administration. Which service model would you recommend and why? (5)", "[AI practice] Explain cloud migration strategies with examples. (5)", "[AI practice] A hospital in Nepal plans to move patient records to the cloud. Discuss the deployment model, security architecture and risks. (10)"], "checklist": ["State NIST definition and 5 characteristics", "List pros/cons", "Explain service requirements with example", "Draw the IaaS/PaaS/SaaS stack", "Compare PaaS vs IaaS", "Compare deployment models", "Explain SOA", "Explain migration, licensing, cost models, SLA", "Explain virtualisation types", "Draw Type 1 and Type 2 hypervisors", "Explain MapReduce with word count", "Compute parallel efficiency", "Explain shared responsibility and security architecture", "Tabulate security risks and mitigations", "Compare App Engine, Azure and Aneka"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question 2026 (IT 277)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BI
