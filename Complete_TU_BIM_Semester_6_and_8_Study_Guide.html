o you mean by financial risk?", "m": 2, "u": 8}, {"no": "5", "g": "A", "t": "Why is preferred stock called a hybrid security?", "m": 2, "u": 5}, {"no": "6", "g": "A", "t": "What are the merits of the payback technique of project evaluation?", "m": 2, "u": 6}, {"no": "7", "g": "A", "t": "Delta Company: cash and bank Rs 50,000; inventory Rs 350,000; receivables Rs 400,000; current liabilities Rs 480,000. Find the current ratio.", "m": 2, "u": 3}, {"no": "8", "g": "A", "t": "How does net working capital differ from gross working capital?", "m": 2, "u": 9}, {"no": "9", "g": "A", "t": "Rs 10,000 deposited now at 10% p.a. — how much at the end of year 3?", "m": 2, "u": 4}, {"no": "10", "g": "A", "t": "Healthy Noodles: raw-material conversion 30 days, credit to customers 40 days, pays suppliers in 20 days. Find the cash conversion cycle.", "m": 2, "u": 9}, {"no": "11", "g": "B", "t": "Explain the responsibilities of the financial manager in a business firm.", "m": 5, "u": 1}, {"no": "12", "g": "B", "t": "What are financial markets? Discuss the major types of financial markets.", "m": 5, "u": 2}, {"no": "13", "g": "B", "t": "Describe the factors affecting the size of working capital.", "m": 5, "u": 9}, {"no": "14", "g": "B", "t": "Explain the methods of selling (issuing) securities.", "m": 5, "u": 7}, {"no": "15", "g": "B", "t": "City Bank account: (a) Rs 10,000 deposited per year for 5 years at 10% — value at end of year 5? (b) What rate is earned if Rs 50,000 doubles in 6 years?", "m": 5, "u": 4}, {"no": "18", "g": "C", "t": "Explain the major sources of long-term financing. Also discuss the merits and demerits of common-stock financing.", "m": 10, "u": 7}]}], "notes": {"1": "<h3>1.1 Nature of corporate finance<\/h3>\n<p>Corporate finance deals with <strong>raising funds, investing them and managing them<\/strong> to maximise firm value. It is an applied field drawing on economics and accounting; decisions are made under uncertainty and must consider risk and the time value of money.<\/p>\n<h3>1.2 Functions of financial management<\/h3>\n<ul>\n<li><strong>Investment decision<\/strong> — capital budgeting and working-capital investment.<\/li>\n<li><strong>Financing decision<\/strong> — sources and capital structure.<\/li>\n<li><strong>Dividend decision<\/strong> — payout vs retention.<\/li>\n<li><strong>Liquidity decision<\/strong> — balancing liquidity and profitability.<\/li>\n<li>Routine functions: cash management, record keeping, credit administration.<\/li>\n<\/ul>\n<h3>1.3 Financial goal<\/h3>\n<p><strong>Wealth maximisation<\/strong> (maximise share price) — considers timing, risk and cash flows. <strong>Profit maximisation<\/strong> — ignores timing and risk, is ambiguous and short-term. Agency problem → corporate governance, incentives, monitoring. Stakeholder view and ESG add social responsibility.<\/p>\n<h3>1.4 Responsibilities of the financial manager<\/h3>\n<p>Forecasting and planning · investment, financing and dividend decisions · working-capital management · dealing with financial markets · risk management · coordination and control · financial reporting and compliance.<\/p>\n<h3>1.5 Relation with other functional areas<\/h3>\n<p>Finance ↔ economics (micro: pricing, marginal analysis; macro: interest rates) · accounting (data vs decisions; accrual vs cash flow) · marketing (credit policy, budgets) · production (capital equipment, inventory) · HR (payroll, pensions).<\/p>\n<p><strong>Key points:<\/strong> four decisions · wealth vs profit table · agency problem · duties · links.<\/p>", "2": "<h3>2.1 Money-market instruments<\/h3>\n<p>Short-term (≤ 1 year), highly liquid, low risk: Treasury bills · commercial paper · certificates of deposit · banker's acceptance · repurchase agreements · call/interbank money.<\/p>\n<h3>2.2 Capital-market instruments<\/h3>\n<p>Long-term: common stock · preferred stock · corporate bonds and debentures · government bonds (development bonds in Nepal) · convertibles.<\/p>\n<h3>2.3 Derivatives<\/h3>\n<p>Value derived from an underlying asset: <strong>forwards<\/strong> (customised OTC), <strong>futures<\/strong> (standardised, exchange-traded), <strong>options<\/strong> (right, not obligation — call/put), <strong>swaps<\/strong> (exchange of cash flows). Uses: hedging, speculation, arbitrage.<\/p>\n<h3>2.4 Mutual-fund units<\/h3>\n<p>Pooled savings invested by professional managers; investors hold units; NAV = (assets − liabilities) ÷ units. Types: open-ended vs close-ended; equity, debt, balanced. Benefits: diversification, professional management, liquidity.<\/p>\n<h3>2.5 Financial markets: functions and types<\/h3>\n<p><strong>Functions:<\/strong> mobilise savings · price discovery · liquidity · lower transaction costs · risk sharing · efficient capital allocation.\n<strong>Types:<\/strong> money vs capital · primary vs secondary · organised exchange vs OTC · spot vs derivatives · domestic vs international · forex market. Nepal: NEPSE (secondary), SEBON (regulator), CDS &amp; Clearing.<\/p>\n<h3>2.6 Financial institutions<\/h3>\n<p><strong>Depository:<\/strong> commercial banks (\"A\" class), development banks (\"B\"), finance companies (\"C\"), microfinance (\"D\"), cooperatives. <strong>Non-depository:<\/strong> insurance companies, pension and provident funds (EPF, CIT, SSF), mutual funds, investment banks / merchant bankers, brokers.<\/p>\n<p><strong>Key points:<\/strong> instruments by market · four derivatives · NAV · market functions and types · institution classes.<\/p>", "3": "<h3>3.1 Financial statements<\/h3>\n<ul>\n<li><strong>Balance sheet:<\/strong> Assets = Liabilities + Equity at a point in time.<\/li>\n<li><strong>Income statement:<\/strong> Revenue − expenses = net income over a period.<\/li>\n<li><strong>Cash-flow statement:<\/strong> operating, investing and financing activities.<\/li>\n<li><strong>Statement of shareholders' equity:<\/strong> changes in capital, retained earnings and reserves.<\/li>\n<\/ul>\n<h3>3.2 Framework for financial analysis<\/h3>\n<p>Users (owners, creditors, managers) → objectives → tools (ratio analysis, common-size, trend analysis) → comparisons (time series, cross-section/industry) → interpretation.<\/p>\n<h3>3.3 Need for ratio analysis<\/h3>\n<p>Simplifies data, measures liquidity, efficiency, solvency and profitability, enables comparison, helps planning and control, and is used by lenders and investors.<\/p>\n<h3>3.4 Ratio groups (see formula sheet)<\/h3>\n<p>Liquidity · asset management (activity) · debt management (leverage) · profitability · market value. Example: current ratio 1.67 (Delta Company, 2025 exam).<\/p>\n<h3>3.5 DuPont analysis<\/h3>\n<p>ROE = net profit margin × total asset turnover × equity multiplier (TA/Equity). Shows whether ROE comes from profitability, efficiency or leverage. <em>Example:<\/em> 8% × 1.5 × 2 = 24%.<\/p>\n<h3>3.6 Limitations of ratio analysis<\/h3>\n<p>Historical data · accounting-policy differences · inflation · window dressing · lack of standard benchmarks · seasonal effects · ignores qualitative factors · ratios are only indicators.<\/p>\n<p><strong>Key points:<\/strong> four statements · framework · ratio groups · DuPont · limitations.<\/p>", "4": "<h3>4.1 Concept and cash-flow timelines<\/h3>\n<p>Money has time value because of <strong>opportunity cost (interest), inflation and risk<\/strong>. A <strong>timeline<\/strong> shows cash flows at periods 0, 1, 2, …; outflows negative, inflows positive.<\/p>\n<h3>4.2 Future and present value of a single sum<\/h3>\n<p>FV = PV(1+i)ⁿ (compounding); PV = FV/(1+i)ⁿ (discounting). Solving for <strong>i<\/strong> or <strong>n<\/strong> rearranges the same formula (e.g. doubling at 12.25% in 6 years; Rule of 72).<\/p>\n<h3>4.3 Annuities<\/h3>\n<p><strong>Ordinary annuity<\/strong> (end-of-period) vs <strong>annuity due<\/strong> (beginning). FVA, PVA formulas; annuity due = ordinary × (1+i). <strong>Annuity payment:<\/strong> PMT = PVA ÷ PVIFA (loan instalments).<\/p>\n<h3>4.4 Perpetuity<\/h3>\n<p>PV = PMT ÷ i (e.g. preferred dividends). Growing perpetuity: PV = PMT₁ ÷ (i − g).<\/p>\n<h3>4.5 Uneven cash flows<\/h3>\n<p>Discount each cash flow separately and add.<\/p>\n<h3>4.6 Semi-annual and other compounding<\/h3>\n<p>Rate per period = i/m; periods = m × n; EAR = (1 + i/m)^m − 1 (12% monthly → 12.68%). Continuous compounding: FV = PV·e^(in).<\/p>\n<h3>4.7 Loan amortisation<\/h3>\n<p>Equal payments; each payment = interest on the opening balance + principal repayment; the balance falls to zero (worked example N13).<\/p>\n<h3>4.8 Applications<\/h3>\n<p>Loans and EMIs, savings plans, retirement planning, bond and stock valuation, capital budgeting, leasing decisions.<\/p>\n<p><strong>Key points:<\/strong> reasons for TVM · single-sum formulas · annuity types · perpetuity · EAR · amortisation.<\/p>", "5": "<h3>5.1 Financial assets and their features<\/h3>\n<ul>\n<li><strong>Bonds:<\/strong> par value, coupon, maturity, indenture, call provision, sinking fund, convertibility, rating.<\/li>\n<li><strong>Common stock:<\/strong> residual claim, voting rights, limited liability, pre-emptive right, no maturity.<\/li>\n<li><strong>Preferred stock:<\/strong> fixed dividend, priority over common, cumulative/non-cumulative, usually non-voting, may be convertible/redeemable — a hybrid.<\/li>\n<\/ul>\n<h3>5.2 Valuation models<\/h3>\n<p>Value = present value of expected cash flows discounted at the required return. <strong>Book value, market value, intrinsic value, liquidation value, going-concern value.<\/strong><\/p>\n<h3>5.3 Bond valuation<\/h3>\n<p>Perpetual (I/kd) · zero-coupon (M/(1+kd)ⁿ) · finite coupon · semi-annual. <strong>Price–yield relationship:<\/strong> inverse; discount bond (kd &gt; coupon), premium bond (kd &lt; coupon), par bond (kd = coupon); longer maturity → more interest-rate risk.<\/p>\n<h3>5.4 Bond yields<\/h3>\n<p>Current yield · capital-gains yield · <strong>YTM<\/strong> (IRR of the bond) · <strong>YTC<\/strong> (to the first call date). Approximate YTM formula in the formula sheet.<\/p>\n<h3>5.5 Dividend discount models<\/h3>\n<p>Single-period: P0 = (D1 + P1)/(1+ks). Multi-period: PV of all dividends. <strong>Zero growth:<\/strong> D/ks. <strong>Normal growth (Gordon):<\/strong> D1/(ks − g). <strong>Super-normal growth:<\/strong> discount dividends during high growth + terminal price.\nExpected return: ks = D1/P0 + g (dividend yield + growth).<\/p>\n<h3>5.6 Preferred stock valuation<\/h3>\n<p>Vp = Dp/kp; expected return kp = Dp/Vp.<\/p>\n<p><strong>Key points:<\/strong> features table · five value concepts · bond formulas and price–yield logic · yields · DDM variants · preferred valuation.<\/p>", "6": "<h3>6.1 Concept and decision process<\/h3>\n<p>Capital budgeting = evaluating and selecting long-term investments. <strong>Process:<\/strong> generate ideas → estimate cash flows (incremental, after-tax) → evaluate → select → implement → post-audit.<\/p>\n<h3>6.2 Project types<\/h3>\n<p>Replacement (maintenance or cost-reduction) · expansion (existing or new products/markets) · safety/environmental (mandatory) · research and development · <strong>independent vs mutually exclusive<\/strong> · normal vs non-normal cash flows.<\/p>\n<h3>6.3 Evaluation techniques<\/h3>\n<table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>Formula/rule<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Payback<\/td>\n<td>years to recover cost; accept if ≤ target<\/td>\n<\/tr>\n<tr>\n<td>Discounted payback<\/td>\n<td>payback using PVs<\/td>\n<\/tr>\n<tr>\n<td>NPV<\/td>\n<td>ΣPV(inflows) − cost; accept if &gt; 0<\/td>\n<\/tr>\n<tr>\n<td>PI<\/td>\n<td>PV(inflows)/cost; accept if &gt; 1<\/td>\n<\/tr>\n<tr>\n<td>IRR<\/td>\n<td>rate where NPV = 0; accept if &gt; k<\/td>\n<\/tr>\n<tr>\n<td>MIRR<\/td>\n<td>(TV/PV cost)^(1/n) − 1; accept if &gt; k<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>6.4 Merits and limitations<\/h3>\n<p>NPV is theoretically best (wealth, TVM, all cash flows, reinvestment at k). IRR is intuitive but can give multiple IRRs and conflicts with NPV for mutually exclusive projects of different size/timing. Payback is simple and measures liquidity but ignores TVM and later flows. PI suits capital rationing.<\/p>\n<p><strong>Key points:<\/strong> process · project types · six techniques · conflicts and the NPV preference.<\/p>", "7": "<h3>7.1 Sources of long-term financing<\/h3>\n<p>Internal: retained earnings, depreciation. External: common stock, preferred stock, debentures/bonds, term loans, leasing, venture capital, hybrid securities.<\/p>\n<h3>7.2 Long-term debt<\/h3>\n<p>Pros: tax-deductible interest, lower cost, no dilution, leverage. Cons: fixed obligation, bankruptcy risk, covenants, reduced flexibility.<\/p>\n<h3>7.3 Preferred stock<\/h3>\n<p>Pros: no default risk, no dilution of control, flexible. Cons: costlier than debt, dividends not tax-deductible, cumulative arrears.<\/p>\n<h3>7.4 Common stock<\/h3>\n<p>Pros: permanent capital, no fixed charge, improves borrowing capacity. Cons: highest cost, dilution of control and EPS, flotation costs, disclosure obligations.<\/p>\n<h3>7.5 Public offering<\/h3>\n<p>Sale to the general public through an issue manager (merchant banker) and underwriter; IPO/FPO; fixed-price or book-building; SEBON approval; ASBA/Mero Share application; allotment by lottery when oversubscribed.<\/p>\n<h3>7.6 Rights offering<\/h3>\n<p>New shares offered to existing shareholders pro rata at a discount; protects control; low cost; shareholders may sell or forfeit rights.<\/p>\n<h3>7.7 Private placement<\/h3>\n<p>Direct sale to a small group of institutional investors; quick and cheap; less disclosure; limited liquidity.<\/p>\n<p><strong>Key points:<\/strong> source list · pros/cons of debt, preferred, common · three issue methods.<\/p>", "8": "<h3>8.1 Concept of capital structure<\/h3>\n<p>Mix of long-term debt, preferred stock and equity. <strong>Financial structure<\/strong> includes short-term liabilities as well.<\/p>\n<h3>8.2 Optimal capital structure<\/h3>\n<p>The mix that minimises WACC and maximises share price. Theories (awareness level): Net Income, Net Operating Income, traditional view, Modigliani–Miller (with and without taxes), trade-off theory, pecking-order theory.<\/p>\n<h3>8.3 Determinants<\/h3>\n<p>Business risk · tax position · financial flexibility · management attitude · growth · profitability · asset structure · control · market conditions · lenders and rating agencies.<\/p>\n<h3>8.4 Business risk vs financial risk<\/h3>\n<p>Business risk: variability of EBIT (demand, prices, costs, operating leverage). Financial risk: extra risk to shareholders from debt (financial leverage).<\/p>\n<h3>8.5 Leverage<\/h3>\n<p>DOL = %ΔEBIT/%ΔSales = Contribution/EBIT · DFL = %ΔEPS/%ΔEBIT = EBIT/EBT · DTL = DOL × DFL. Worked example: DOL 2.0, DFL 1.33, DTL 2.67.<\/p>\n<p><strong>Key points:<\/strong> definitions · theories list · ten determinants · risk comparison · leverage formulas.<\/p>", "9": "<h3>9.1 Concepts and types of working capital<\/h3>\n<p><strong>Gross WC<\/strong> = total current assets; <strong>net WC<\/strong> = CA − CL. <strong>Permanent<\/strong> (minimum level) vs <strong>temporary/variable<\/strong> (seasonal). Positive vs negative NWC.<\/p>\n<h3>9.2 Factors affecting size<\/h3>\n<p>Nature of business · scale · operating cycle · credit policy · supplier credit · seasonality · growth · inventory policy · inflation · efficiency.<\/p>\n<h3>9.3 Significance<\/h3>\n<p>Smooth operations, solvency, cash discounts, creditworthiness, ability to face crises; excess WC lowers profitability, inadequate WC causes insolvency — the <strong>risk–return trade-off<\/strong>. Financing policies: matching (hedging), conservative, aggressive.<\/p>\n<h3>9.4 Operating cycle and cash conversion cycle<\/h3>\n<p>OC = inventory conversion period + receivables collection period. CCC = OC − payables deferral period (Healthy Noodles: 30 + 40 − 20 = 50 days).<\/p>\n<h3>9.5 Working-capital requirement<\/h3>\n<p>Estimate from the CCC and daily operating costs, or percentage-of-sales methods; add a safety margin.<\/p>\n<p><strong>Key points:<\/strong> GWC/NWC · permanent/temporary · factors · trade-off and policies · OC/CCC.<\/p>"}, "qa": [{"id": "FIN229-01", "t": "Corporate finance: meaning, functions, goal", "u": 1, "q": "Write the meaning of corporate finance. Explain the functions and the financial goal of a firm.", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"E25": "Q1"}, "rep": false, "src": "2025 exam (partial) Q1", "a": "<p><strong>Corporate finance<\/strong> deals with how corporations raise funds, invest them and manage their financial resources to maximise shareholders' wealth.<\/p>\n<p><strong>Functions (decisions):<\/strong> (1) <strong>investment decision<\/strong> (capital budgeting, working capital) · (2) <strong>financing decision<\/strong> (debt vs equity, capital structure) · (3) <strong>dividend decision<\/strong> (pay out vs retain) · (4) <strong>liquidity decision<\/strong> (cash management).<\/p>\n<p><strong>Financial goal — shareholders' wealth maximisation<\/strong> (maximising the market price per share) is preferred over profit maximisation because it considers the <strong>time value of money<\/strong>, <strong>risk<\/strong> and <strong>cash flows<\/strong>, and has a long-term focus. Profit maximisation ignores timing and risk and is vague.<\/p>\n<p><strong>Agency problem:<\/strong> a conflict between managers and shareholders, reduced by incentives, monitoring and governance.<\/p>"}, {"id": "FIN229-02", "t": "Responsibilities of the financial manager", "u": 1, "q": "Explain the responsibilities of the financial manager in a business firm.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "Q11"}, "rep": false, "src": "2025 exam (partial) Q11", "a": "<ol>\n<li><strong>Forecasting and planning<\/strong> — estimating funds needed; budgeting.<\/li>\n<li><strong>Investment decisions<\/strong> — evaluating projects using NPV/IRR.<\/li>\n<li><strong>Financing decisions<\/strong> — choosing sources and the optimal capital structure.<\/li>\n<li><strong>Dividend decisions<\/strong> — the payout policy.<\/li>\n<li><strong>Working-capital management<\/strong> — cash, receivables, inventory, payables.<\/li>\n<li><strong>Dealing with financial markets<\/strong> — issuing securities, bank relations.<\/li>\n<li><strong>Risk management<\/strong> — interest-rate and currency risk, insurance.<\/li>\n<li><strong>Coordination and control<\/strong> — with production, marketing and HR; performance analysis.<\/li>\n<li><strong>Financial reporting and compliance.<\/strong><\/li>\n<\/ol>\n<p><strong>Relation with other functions:<\/strong> marketing (credit policy), production (capital equipment), HR (pay budgets), accounting (data).<\/p>"}, {"id": "FIN229-03", "t": "Financial markets: types; capital vs money market", "u": 2, "q": "What are financial markets? Discuss their major types. What is meant by capital market?", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "Q2, Q12"}, "rep": false, "src": "2025 exam (partial) Q2, Q12", "a": "<p><strong>Financial markets<\/strong> are markets where financial assets (securities, money) are created and traded, transferring funds from savers to borrowers.<\/p>\n<p><strong>Functions:<\/strong> price discovery, liquidity, lower transaction costs, efficient allocation of capital, risk sharing.<\/p>\n<p><strong>Types<\/strong><\/p>\n<ul>\n<li><strong>Money market:<\/strong> short-term (≤ 1 year) instruments — Treasury bills, commercial paper, certificates of deposit, call money, repos.<\/li>\n<li><strong>Capital market:<\/strong> long-term funds — shares, bonds, debentures. <em>In Nepal: NEPSE, regulated by SEBON.<\/em><\/li>\n<li><strong>Primary market:<\/strong> new securities issued (IPO, right shares).<\/li>\n<li><strong>Secondary market:<\/strong> trading of existing securities (stock exchange).<\/li>\n<li><strong>Derivatives market:<\/strong> futures, options, forwards, swaps.<\/li>\n<li><strong>Foreign-exchange market.<\/strong><\/li>\n<li><strong>Organised exchange vs OTC (over-the-counter).<\/strong><\/li>\n<\/ul>\n<p><strong>Financial institutions:<\/strong> <em>depository<\/em> (commercial banks, development banks, finance companies, cooperatives) and <em>non-depository<\/em> (insurance companies, pension funds such as the EPF and CIT, mutual funds, investment banks / merchant bankers).<\/p>"}, {"id": "FIN229-04", "t": "Financial instruments: money/capital market, derivatives, mutual funds", "u": 2, "q": "Explain money-market and capital-market instruments, derivatives and mutual-fund units.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Money-market instruments:<\/strong> Treasury bills (government, discounted) · commercial paper (unsecured corporate promissory notes) · certificates of deposit · banker's acceptance · repurchase agreements · call money.<\/p>\n<p><strong>Capital-market instruments:<\/strong> common stock · preferred stock · bonds and debentures (government and corporate) · convertible securities.<\/p>\n<p><strong>Derivatives<\/strong> — securities whose value derives from an underlying asset: forwards, futures, options (call/put), swaps. Used for hedging and speculation.<\/p>\n<p><strong>Mutual-fund units<\/strong> — pooled investment; investors buy units of a fund managed professionally; types: open-ended, close-ended (both exist in Nepal).<\/p>"}, {"id": "FIN229-05", "t": "Financial statements and ratio analysis", "u": 3, "q": "Explain the major groups of financial ratios with formulas. What are the limitations of ratio analysis?", "m": 10, "p": "Medium", "ty": "Explanation + numerical", "seen": {"E25": "Q7"}, "rep": false, "src": "2025 exam (partial) Q7", "a": "<table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>Ratio<\/th>\n<th>Formula<\/th>\n<th>Shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Liquidity<\/td>\n<td>Current ratio<\/td>\n<td>CA / CL<\/td>\n<td>short-term solvency<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Quick ratio<\/td>\n<td>(CA − Inventory) / CL<\/td>\n<td>strict liquidity<\/td>\n<\/tr>\n<tr>\n<td>Asset management<\/td>\n<td>Inventory turnover<\/td>\n<td>Sales (or COGS) / Inventory<\/td>\n<td>efficiency<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Days sales outstanding<\/td>\n<td>Receivables / (Sales/360)<\/td>\n<td>collection period<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Fixed / total asset turnover<\/td>\n<td>Sales / FA ; Sales / TA<\/td>\n<td>asset use<\/td>\n<\/tr>\n<tr>\n<td>Debt<\/td>\n<td>Debt ratio<\/td>\n<td>Total debt / Total assets<\/td>\n<td>leverage<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Times interest earned<\/td>\n<td>EBIT / Interest<\/td>\n<td>ability to pay interest<\/td>\n<\/tr>\n<tr>\n<td>Profitability<\/td>\n<td>Net profit margin<\/td>\n<td>NI / Sales<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>ROA<\/td>\n<td>NI / Total assets<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>ROE<\/td>\n<td>NI / Equity<\/td>\n<td>return to owners<\/td>\n<\/tr>\n<tr>\n<td>Market value<\/td>\n<td>P/E<\/td>\n<td>Price / EPS<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Market/book<\/td>\n<td>Price / Book value per share<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>DuPont:<\/strong> ROE = (NI/Sales) × (Sales/TA) × (TA/Equity). It shows whether ROE comes from profitability, efficiency or leverage.<\/p>\n<p><strong>Example:<\/strong> Delta's current ratio = 800,000 / 480,000 = 1.67.<\/p>\n<p><strong>Limitations:<\/strong> based on historical data · different accounting policies · inflation distorts values · window dressing · industry benchmarks are hard to find · seasonal effects · a single ratio can mislead · qualitative factors are ignored.<\/p>"}, {"id": "FIN229-06", "t": "TVM: concepts, annuities, perpetuity, amortisation", "u": 4, "q": "You opened an account in City Bank. (a) If you deposit Rs 10,000 per year for 5 years at 10%, how much will it grow to at the end of year 5? (b) What rate will you earn if Rs 50,000 doubles in 6 years?", "m": 5, "p": "High", "ty": "Numerical", "seen": {"E25": "Q9, Q15"}, "rep": false, "src": "2025 exam (partial) Q9, Q15", "a": "<p><strong>Time value of money:<\/strong> a rupee today is worth more than a rupee tomorrow because of its earning capacity, inflation and risk.<\/p>\n<p><strong>(a)<\/strong> Ordinary annuity: FVA = 10,000 × [(1.10⁵ − 1) / 0.10] = 10,000 × 6.1051 = <strong>Rs 61,051<\/strong>.\n<em>(If deposits are made at the beginning of each year — annuity due — 61,051 × 1.10 = Rs 67,156.10.)<\/em><\/p>\n<p><strong>(b)<\/strong> 50,000(1+i)⁶ = 100,000 → (1+i)⁶ = 2 → 1 + i = 2^(1/6) = 1.1225 → <strong>i ≈ 12.25% p.a.<\/strong><\/p>\n<p><strong>Interpretation:<\/strong> regular saving of Rs 50,000 in total grows to Rs 61,051 because of compound interest; money doubles in 6 years only at about 12.25%.<\/p>\n<p>See the formula sheet for the PV, annuity-due, perpetuity, EAR and amortisation-schedule formulas (worked examples N1, N4, N5, N13, N14).<\/p>"}, {"id": "FIN229-07", "t": "Bond features and valuation; yields", "u": 5, "q": "Explain the features of bonds. A Rs 1,000 bond pays a 10% annual coupon and matures in 5 years. Find its value if the required return is 12%. What are current yield and YTM?", "m": 10, "p": "Medium", "ty": "Numerical", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Features of bonds:<\/strong> par/face value · coupon rate · maturity · indenture (trust deed) · call provision · sinking fund · convertibility · seniority/security · credit rating.<\/p>\n<p><strong>Valuation:<\/strong> V = 100 × PVIFA(12%,5) + 1,000 × PVIF(12%,5) = 360.48 + 567.43 = <strong>Rs 927.90<\/strong>.\nThe bond sells at a <strong>discount<\/strong> because the required return (12%) is above the coupon rate (10%). If kd = coupon rate → par; if kd &lt; coupon → premium.<\/p>\n<p><strong>Yields<\/strong><\/p>\n<ul>\n<li><strong>Current yield<\/strong> = annual interest / price = 100/927.90 = <strong>10.78%<\/strong>.<\/li>\n<li><strong>Capital-gains yield<\/strong> = YTM − current yield.<\/li>\n<li><strong>YTM<\/strong> — the rate that equates price with the PV of all future payments (here 12%, because the price was computed at 12%).<\/li>\n<li><strong>YTC<\/strong> — return if the bond is called at the earliest call date.<\/li>\n<\/ul>\n<p><strong>Bond types:<\/strong> perpetual (V = I/kd), zero-coupon (V = M/(1+kd)ⁿ), semi-annual (halve rate, double periods).<\/p>"}, {"id": "FIN229-08", "t": "Stock valuation (DDM; super-normal growth); preferred as hybrid", "u": 5, "q": "Why is preferred stock called a hybrid security? Explain the dividend discount models for common stock with examples.", "m": 10, "p": "High", "ty": "Numerical + theory", "seen": {"E25": "Q5"}, "rep": false, "src": "2025 exam (partial) Q5", "a": "<p><strong>Preferred stock is a hybrid security<\/strong> because it has features of both <strong>debt<\/strong> (fixed dividend, priority over common stock, no voting rights normally, may be redeemable) and <strong>equity<\/strong> (dividends are not tax-deductible, non-payment does not cause bankruptcy, no fixed maturity in perpetual form, shown in equity). Value: Vp = Dp / kp (e.g. 12/0.10 = Rs 120).<\/p>\n<p><strong>Dividend discount models (DDM)<\/strong> — the value of a share = PV of expected future dividends.<\/p>\n<ol>\n<li><strong>Zero growth:<\/strong> P0 = D / ks.<\/li>\n<li><strong>Constant (normal) growth — Gordon model:<\/strong> P0 = D1 / (ks − g). <em>Example:<\/em> D0 = 20, g = 6%, ks = 14% → D1 = 21.20 → P0 = <strong>Rs 265<\/strong>.<\/li>\n<li><strong>Super-normal (non-constant) growth:<\/strong> find the dividends during the high-growth period, the terminal price at the end using Gordon, and discount everything.\n<em>Example:<\/em> D0 = 2, g = 20% for 3 years, then 5%; ks = 12% → D1 = 2.40, D2 = 2.88, D3 = 3.456; P3 = 3.6288/0.07 = 51.84; <strong>P0 = Rs 43.80<\/strong>.<\/li>\n<\/ol>\n<p><strong>Assumptions of Gordon:<\/strong> constant g, ks &gt; g, dividends grow forever.<\/p>"}, {"id": "FIN229-09", "t": "Capital budgeting techniques; merits of payback", "u": 6, "q": "Explain the capital-budgeting techniques with their merits and limitations. Evaluate a Rs 100,000 project with inflows of 30,000, 40,000, 50,000 and 20,000 at a 10% cost of capital.", "m": 10, "p": "High", "ty": "Numerical + theory", "seen": {"E25": "Q6"}, "rep": false, "src": "2025 exam (partial) Q6", "a": "<p><strong>Capital budgeting<\/strong> is the process of evaluating and selecting long-term investment projects.\n<strong>Process:<\/strong> idea generation → estimation of cash flows → evaluation → selection → implementation → post-audit.\n<strong>Project types:<\/strong> replacement, expansion, new product, regulatory; independent vs mutually exclusive.<\/p>\n<table>\n<thead>\n<tr>\n<th>Technique<\/th>\n<th>Rule<\/th>\n<th>Merits<\/th>\n<th>Limitations<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Payback period<\/td>\n<td>Accept if ≤ target<\/td>\n<td>Simple; measures liquidity and risk; quick screening<\/td>\n<td>Ignores TVM and cash flows after payback<\/td>\n<\/tr>\n<tr>\n<td>Discounted payback<\/td>\n<td>Accept if ≤ target<\/td>\n<td>Considers TVM<\/td>\n<td>Ignores later cash flows<\/td>\n<\/tr>\n<tr>\n<td>NPV<\/td>\n<td>Accept if NPV &gt; 0<\/td>\n<td>TVM, all cash flows, adds to wealth<\/td>\n<td>Needs k; absolute measure<\/td>\n<\/tr>\n<tr>\n<td>PI<\/td>\n<td>Accept if &gt; 1<\/td>\n<td>Useful for capital rationing<\/td>\n<td>Can conflict with NPV<\/td>\n<\/tr>\n<tr>\n<td>IRR<\/td>\n<td>Accept if IRR &gt; k<\/td>\n<td>Percentage is easy to understand<\/td>\n<td>Multiple IRRs; reinvestment-at-IRR assumption<\/td>\n<\/tr>\n<tr>\n<td>MIRR<\/td>\n<td>Accept if &gt; k<\/td>\n<td>Realistic reinvestment at k<\/td>\n<td>Less familiar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Solution (see worked example N11):<\/strong> payback 2.6 years · discounted payback 3.15 years · <strong>NPV Rs 11,557<\/strong> · PI 1.12 · IRR 15.33% · MIRR 13.05% → <strong>accept<\/strong> on every criterion.<\/p>\n<p><strong>Merits of payback (2025 Q6):<\/strong> simple to calculate and understand; emphasises liquidity; a crude measure of risk (early recovery); useful for firms short of cash or with rapidly changing technology.<\/p>"}, {"id": "FIN229-10", "t": "Long-term financing sources; common-stock merits/demerits", "u": 7, "q": "Explain the major sources of long-term financing. Also discuss the merits and demerits of common-stock financing.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "Q18"}, "rep": false, "src": "2025 exam (partial) Q18", "a": "<p><strong>Sources of long-term financing<\/strong><\/p>\n<ol>\n<li><strong>Common (equity) stock<\/strong> — ownership capital.<\/li>\n<li><strong>Preferred stock<\/strong> — hybrid.<\/li>\n<li><strong>Long-term debt<\/strong> — bonds, debentures, term loans from banks/financial institutions.<\/li>\n<li><strong>Retained earnings<\/strong> — internal equity.<\/li>\n<li><strong>Lease financing, venture capital, convertible securities.<\/strong><\/li>\n<\/ol>\n<p><strong>Long-term debt — pros:<\/strong> interest is tax-deductible, no dilution of control, cheaper, financial leverage. <strong>Cons:<\/strong> fixed obligation, bankruptcy risk, restrictive covenants.\n<strong>Preferred stock — pros:<\/strong> no fixed obligation, no dilution of voting. <strong>Cons:<\/strong> dividends are not tax-deductible, costlier than debt.<\/p>\n<p><strong>Common stock financing<\/strong>\n<em>Merits (to the firm):<\/em> no fixed charge (dividends are discretionary) · no maturity — permanent capital · increases creditworthiness and borrowing capacity · no mortgage of assets · easy to sell when the market is good.\n<em>Demerits:<\/em> highest cost of capital (shareholders bear the most risk; dividends are not tax-deductible) · dilution of control and EPS · high flotation costs · over-capitalisation risk · possible takeover threats · more disclosure requirements.<\/p>"}, {"id": "FIN229-11", "t": "Methods of issuing securities", "u": 7, "q": "Explain the methods of selling (issuing) securities.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "Q14"}, "rep": false, "src": "2025 exam (partial) Q14", "a": "<ol>\n<li><strong>Public offering (IPO / FPO):<\/strong> securities sold to the general public through an investment bank / issue manager.\n - <em>Underwriting:<\/em> firm commitment (the underwriter buys the whole issue) vs best-efforts (sells what it can).\n - <em>Pricing:<\/em> fixed-price or <strong>book-building<\/strong>.\n - In Nepal: applications via <strong>ASBA / Mero Share<\/strong>; regulated by SEBON; allotment by lottery when oversubscribed.<\/li>\n<li><strong>Rights offering:<\/strong> new shares offered first to existing shareholders in proportion to their holdings (pre-emptive right), usually below market price; maintains control; low cost.<\/li>\n<li><strong>Private placement:<\/strong> direct sale to a few institutional investors (banks, insurance, pension funds) — quick, low cost, less disclosure, but limited investors.<\/li>\n<li>Others: bonus shares (capitalisation of reserves, no fresh cash), employee share plans, auctions (for government bonds).<\/li>\n<\/ol>"}, {"id": "FIN229-12", "t": "Capital structure; financial structure; business vs financial risk", "u": 8, "q": "Define financial structure and capital structure. Differentiate business risk and financial risk. What determines capital structure?", "m": 5, "p": "High", "ty": "Definitions", "seen": {"E25": "Q3, Q4"}, "rep": false, "src": "2025 exam (partial) Q3, Q4", "a": "<p><strong>Financial structure:<\/strong> the composition of all sources of financing — short-term and long-term liabilities plus equity (the entire liabilities side of the balance sheet).\n<strong>Capital structure:<\/strong> the mix of <strong>long-term<\/strong> sources only — long-term debt, preferred stock and common equity.\n<strong>Optimal capital structure:<\/strong> the mix that minimises the weighted-average cost of capital and maximises share price.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Business risk<\/th>\n<th>Financial risk<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Meaning<\/td>\n<td>Variability of EBIT from operations<\/td>\n<td>Extra risk to shareholders from using debt<\/td>\n<\/tr>\n<tr>\n<td>Cause<\/td>\n<td>Demand, price, cost variability, <strong>operating leverage<\/strong><\/td>\n<td>Fixed interest — <strong>financial leverage<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Measured by<\/td>\n<td>DOL, σ of EBIT/ROA<\/td>\n<td>DFL<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Industry-driven, less controllable<\/td>\n<td>Management choice<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Determinants of capital structure:<\/strong> business risk · tax position (interest shield) · financial flexibility · growth rate · profitability · asset structure (tangible assets support debt) · control considerations · market conditions · management attitude · lenders' and rating-agency attitudes.<\/p>"}, {"id": "FIN229-13", "t": "Leverage: DOL, DFL, DTL", "u": 8, "q": "A firm sells 10,000 units at Rs 100; variable cost is Rs 60 per unit, fixed cost Rs 200,000 and interest Rs 50,000. Compute DOL, DFL and DTL and interpret them.", "m": 5, "p": "Medium", "ty": "Numerical", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>Sales = 1,000,000 · VC = 600,000 · <strong>Contribution = 400,000<\/strong> · FC = 200,000 · <strong>EBIT = 200,000<\/strong> · Interest = 50,000 · <strong>EBT = 150,000<\/strong>.<\/p>\n<ul>\n<li><strong>DOL<\/strong> = Contribution / EBIT = 400,000/200,000 = <strong>2.0<\/strong> → a 1% change in sales → 2% change in EBIT.<\/li>\n<li><strong>DFL<\/strong> = EBIT / EBT = 200,000/150,000 = <strong>1.33<\/strong> → a 1% change in EBIT → 1.33% change in EPS.<\/li>\n<li><strong>DTL<\/strong> = DOL × DFL = <strong>2.67<\/strong> → a 1% change in sales → 2.67% change in EPS.\n<strong>Interpretation:<\/strong> higher leverage magnifies returns in good years and losses in bad years — higher risk.<\/li>\n<\/ul>"}, {"id": "FIN229-14", "t": "Working capital: concepts, NWC vs GWC, factors", "u": 9, "q": "How does net working capital differ from gross working capital? Describe the factors affecting the size of working capital.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "Q8, Q13"}, "rep": false, "src": "2025 exam (partial) Q8, Q13", "a": "<p><strong>Gross working capital (GWC):<\/strong> total current assets (cash, receivables, inventory, marketable securities).\n<strong>Net working capital (NWC):<\/strong> current assets − current liabilities; positive NWC indicates a liquidity cushion.\nOther types: <strong>permanent<\/strong> (minimum level always needed) vs <strong>temporary/variable<\/strong> (seasonal).<\/p>\n<p><strong>Factors affecting the size of working capital<\/strong><\/p>\n<ol>\n<li><strong>Nature of business<\/strong> — trading and manufacturing need more than service and utility firms.<\/li>\n<li><strong>Size and scale of operations.<\/strong><\/li>\n<li><strong>Length of the production/operating cycle.<\/strong><\/li>\n<li><strong>Credit policy<\/strong> — liberal credit to customers raises receivables.<\/li>\n<li><strong>Credit available from suppliers.<\/strong><\/li>\n<li><strong>Seasonality<\/strong> of demand or supply.<\/li>\n<li><strong>Growth and expansion plans.<\/strong><\/li>\n<li><strong>Inventory policy and raw-material availability.<\/strong><\/li>\n<li><strong>Inflation / price-level changes.<\/strong><\/li>\n<li><strong>Operating efficiency<\/strong> and dividend policy.<\/li>\n<\/ol>\n<p><strong>Significance:<\/strong> adequate working capital ensures smooth operations, solvency, discounts on purchases and creditworthiness; excess working capital lowers profitability.<\/p>"}, {"id": "FIN229-15", "t": "Operating cycle and cash conversion cycle", "u": 9, "q": "Explain the operating cycle and cash conversion cycle. Healthy Noodles converts raw materials in 30 days, allows 40 days' credit and pays suppliers in 20 days. Find its CCC.", "m": 5, "p": "High", "ty": "Numerical", "seen": {"E25": "Q10"}, "rep": false, "src": "2025 exam (partial) Q10", "a": "<p><strong>Operating cycle<\/strong> = inventory conversion period + receivables collection period — the time from buying materials to collecting cash from sales.\n<strong>Cash conversion cycle (CCC)<\/strong> = operating cycle − payables deferral period — the time cash is actually tied up.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Buy materials<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(credit)<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Inventory<\/text><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">conversion 30<\/text><text x=\"224.0\" y=\"55.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">days<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Sale on credit<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Collection 40<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">days<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Cash received<\/text><\/svg><\/div>\n\n<p>Operating cycle = 30 + 40 = 70 days; <strong>CCC = 70 − 20 = 50 days.<\/strong><\/p>\n<p><strong>Working-capital requirement<\/strong> ≈ (CCC / 360) × annual cost of sales (simple approach).<\/p>\n<p>Reducing the CCC (faster inventory turnover, quicker collection, longer supplier credit) frees cash.<\/p>"}], "defs": [["Corporate finance", "Study of how firms raise, invest and manage funds to maximise shareholder wealth."], ["Wealth maximisation", "Goal of maximising the market price of the firm's shares."], ["Capital market", "Market for long-term funds: shares, bonds, debentures."], ["Money market", "Market for short-term (≤1 year) instruments."], ["Derivative", "Security whose value depends on an underlying asset."], ["Time value of money", "A rupee today is worth more than a rupee in future."], ["Annuity", "Series of equal payments at equal intervals (ordinary = end of period; due = beginning)."], ["Perpetuity", "Annuity that continues forever."], ["YTM", "Rate that equates a bond's price with the PV of its cash flows."], ["Hybrid security", "Security with features of debt and equity, e.g. preferred stock."], ["NPV", "PV of inflows minus initial investment."], ["IRR", "Discount rate making NPV zero."], ["Rights offering", "Issue of new shares first to existing shareholders."], ["Capital structure", "Mix of long-term debt, preferred and common equity."], ["Financial risk", "Additional risk to shareholders from using debt."], ["Net working capital", "Current assets minus current liabilities."], ["Cash conversion cycle", "Operating cycle minus payables deferral period."]], "revision": "<p><strong>FIN 229 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> functions (investment, financing, dividend, liquidity) · wealth vs profit maximisation · financial manager's duties · agency problem.<\/li>\n<li><strong>U2:<\/strong> money vs capital market instruments · primary/secondary · derivatives · mutual funds · depository vs non-depository institutions.<\/li>\n<li><strong>U3:<\/strong> 5 ratio groups (formulas) · DuPont = margin × turnover × equity multiplier · limitations.<\/li>\n<li><strong>U4:<\/strong> FV, PV, FVA, PVA, due ×(1+i), perpetuity, EAR, amortisation table. <em>Practise!<\/em><\/li>\n<li><strong>U5:<\/strong> bond V, discount/premium logic · current yield, YTM (approx formula), YTC · Vp = Dp/kp · Gordon D1/(ks−g) · super-normal steps.<\/li>\n<li><strong>U6:<\/strong> payback, DPB, NPV, PI, IRR (interpolation), MIRR; merits/limitations table.<\/li>\n<li><strong>U7:<\/strong> sources · debt vs preferred vs common pros/cons · IPO (underwriting, book-building, ASBA), rights, private placement.<\/li>\n<li><strong>U8:<\/strong> financial vs capital structure · business vs financial risk · determinants · DOL = C/EBIT, DFL = EBIT/EBT, DTL.<\/li>\n<li><strong>U9:<\/strong> GWC vs NWC · permanent vs temporary · 10 factors · OC and CCC.<\/li>\n<\/ul>", "practice": ["[AI practice] Find the PV of Rs 5,000 received annually for 6 years at 8% (ordinary annuity). (5)", "[AI practice] A perpetual bond pays Rs 120 a year; required return 10%. Value it. (2)", "[AI practice] Prepare a loan amortisation schedule for Rs 200,000 at 12% for 4 years. (10)", "[AI practice] A share just paid Rs 15; dividends grow at 8%; required return 15%. Find its price. What if growth is 25% for 2 years and then 8%? (10)", "[AI practice] Two mutually exclusive projects conflict on NPV and IRR. Explain why, and which method to follow. (5)", "[AI practice] Compute DuPont ROE: net margin 8%, asset turnover 1.5, equity multiplier 2. (2)", "[AI practice] Compare public offering, rights offering and private placement. (5)"], "checklist": ["Explain wealth maximisation vs profit maximisation", "List money and capital market instruments", "Write all ratio formulas from memory", "Solve FV/PV/annuity/perpetuity problems", "Build an amortisation schedule", "Value bonds (annual, semi-annual, zero) and compute YTM", "Value stock with zero, constant and super-normal growth", "Compute payback, NPV, PI, IRR and MIRR", "Explain methods of issuing securities", "Compute DOL, DFL, DTL", "Compute operating cycle and CCC"], "sources": [["TU FOM — BIM 6th Semester Syllabus 2024", "https://www.fomecd.edu.np/syllabuses/BIM%206th%20Semester%20Syllabus%202024.pdf"], ["bimstudies — FIN 229 Exam Question Solution BITM 6th Sem 2025", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/fundamentals-of-corporate-finance-exam-question-solution-bitm-6th-sem-2025/"], ["TU BIM 6th sem exam routine, December 2025 (Collegesansar)", "https://collegesansar.com/bbm-bba-bim-4th-and-6th-sem-exam-routine-tu/"]], "extra": "<h3>Formula sheet<\/h3>\n<table>\n<thead>\n<tr>\n<th>Topic<\/th>\n<th>Formula<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FV single sum<\/td>\n<td>FV = PV(1+i)ⁿ<\/td>\n<\/tr>\n<tr>\n<td>PV single sum<\/td>\n<td>PV = FV / (1+i)ⁿ<\/td>\n<\/tr>\n<tr>\n<td>FV ordinary annuity<\/td>\n<td>FVA = PMT × [(1+i)ⁿ − 1] / i<\/td>\n<\/tr>\n<tr>\n<td>PV ordinary annuity<\/td>\n<td>PVA = PMT × [1 − (1+i)⁻ⁿ] / i<\/td>\n<\/tr>\n<tr>\n<td>Annuity due<\/td>\n<td>multiply the ordinary-annuity value by (1+i)<\/td>\n<\/tr>\n<tr>\n<td>Perpetuity<\/td>\n<td>PV = PMT / i<\/td>\n<\/tr>\n<tr>\n<td>m compounding periods<\/td>\n<td>FV = PV(1 + i/m)^(m·n) ; EAR = (1 + i/m)^m − 1<\/td>\n<\/tr>\n<tr>\n<td>Bond value<\/td>\n<td>V = I × PVIFA(kd, n) + M × PVIF(kd, n) (semi-annual: I/2, kd/2, 2n)<\/td>\n<\/tr>\n<tr>\n<td>Perpetual bond<\/td>\n<td>V = I / kd<\/td>\n<\/tr>\n<tr>\n<td>Zero-coupon bond<\/td>\n<td>V = M / (1+kd)ⁿ<\/td>\n<\/tr>\n<tr>\n<td>Current yield<\/td>\n<td>Annual interest ÷ price<\/td>\n<\/tr>\n<tr>\n<td>YTM (approx.)<\/td>\n<td>[I + (M − P)/n] ÷ [(M + P)/2]<\/td>\n<\/tr>\n<tr>\n<td>Preferred stock<\/td>\n<td>Vp = Dp / kp<\/td>\n<\/tr>\n<tr>\n<td>Zero growth<\/td>\n<td>P0 = D / ks<\/td>\n<\/tr>\n<tr>\n<td>Constant growth (Gordon)<\/td>\n<td>P0 = D1 / (ks − g), with D1 = D0(1+g)<\/td>\n<\/tr>\n<tr>\n<td>NPV<\/td>\n<td>Σ CFt/(1+k)ᵗ − initial cost<\/td>\n<\/tr>\n<tr>\n<td>PI<\/td>\n<td>PV of inflows ÷ initial cost<\/td>\n<\/tr>\n<tr>\n<td>IRR<\/td>\n<td>rate at which NPV = 0 (interpolate)<\/td>\n<\/tr>\n<tr>\n<td>MIRR<\/td>\n<td>(TV of inflows at k ÷ PV of costs)^(1/n) − 1<\/td>\n<\/tr>\n<tr>\n<td>DOL<\/td>\n<td>Contribution ÷ EBIT<\/td>\n<\/tr>\n<tr>\n<td>DFL<\/td>\n<td>EBIT ÷ (EBIT − Interest) [− Dp/(1−T) if preferred]<\/td>\n<\/tr>\n<tr>\n<td>DTL<\/td>\n<td>DOL × DFL = Contribution ÷ EBT<\/td>\n<\/tr>\n<tr>\n<td>Operating cycle<\/td>\n<td>Inventory conversion period + Receivable collection period<\/td>\n<\/tr>\n<tr>\n<td>CCC<\/td>\n<td>Operating cycle − Payables deferral period<\/td>\n<\/tr>\n<tr>\n<td>Current ratio<\/td>\n<td>CA / CL ; Quick ratio = (CA − Inventory)/CL<\/td>\n<\/tr>\n<tr>\n<td>DuPont<\/td>\n<td>ROE = Net margin × Total asset turnover × Equity multiplier<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Solved numericals (all re-computed)<\/h3>\n<p><strong>N1. FV single sum (2025 Q9).<\/strong> FV = 10,000 × 1.10³ = <strong>Rs 13,310<\/strong>.<\/p>\n<p><strong>N2. Current ratio (2025 Q7).<\/strong> CA = 50,000 + 350,000 + 400,000 = 800,000. CR = 800,000 / 480,000 = <strong>1.67 : 1<\/strong> — Delta can cover short-term debts 1.67 times (just below the conventional 2:1 benchmark).<\/p>\n<p><strong>N3. CCC (2025 Q10).<\/strong> Operating cycle = 30 + 40 = 70 days; CCC = 70 − 20 = <strong>50 days<\/strong> — cash is tied up for 50 days.<\/p>\n<p><strong>N4. FV of annuity (2025 Q15a).<\/strong> FVA = 10,000 × [(1.10⁵ − 1)/0.10] = 10,000 × 6.1051 = <strong>Rs 61,051<\/strong> (end-of-year deposits). If deposits are at the start of each year (annuity due): 61,051 × 1.10 = <strong>Rs 67,156.10<\/strong>. <em>State your assumption in the exam.<\/em><\/p>\n<p><strong>N5. Rate when money doubles (2025 Q15b).<\/strong> 50,000(1+i)⁶ = 100,000 → (1+i)⁶ = 2 → i = 2^(1/6) − 1 = <strong>12.25%<\/strong> (Rule of 72 check: 72/6 = 12%).<\/p>\n<p><strong>N6. Bond value.<\/strong> Rs 1,000 par, 10% annual coupon, 5 years, required return 12%.\nV = 100 × PVIFA(12%,5) + 1,000 × PVIF(12%,5) = 100 × 3.6048 + 1,000 × 0.5674 = <strong>Rs 927.90<\/strong> → a <strong>discount<\/strong> bond because kd &gt; coupon rate.\nSemi-annual: V = 50 × PVIFA(6%,10) + 1,000 × PVIF(6%,10) = 50 × 7.3601 + 1,000 × 0.5584 = <strong>Rs 926.40<\/strong>.\nZero-coupon, 5 years at 10%: V = 1,000 / 1.10⁵ = <strong>Rs 620.92<\/strong>.<\/p>\n<p><strong>N7. YTM.<\/strong> Price Rs 950, 9% annual coupon, 10 years, par 1,000.\nApproximate YTM = [90 + (1,000 − 950)/10] ÷ [(1,000 + 950)/2] = 95 / 975 = <strong>9.74%<\/strong> (the exact value by trial is <strong>9.81%<\/strong>). Current yield = 90/950 = <strong>9.47%<\/strong>.<\/p>\n<p><strong>N8. Gordon model.<\/strong> D0 = Rs 20, g = 6%, ks = 14%. D1 = 21.20; P0 = 21.20 / (0.14 − 0.06) = <strong>Rs 265<\/strong>.<\/p>\n<p><strong>N9. Super-normal growth.<\/strong> D0 = Rs 2; g = 20% for 3 years, then 5% forever; ks = 12%.\nD1 = 2.40, D2 = 2.88, D3 = 3.456. P3 = D3(1.05)/(0.12 − 0.05) = 3.6288/0.07 = 51.84.\nP0 = 2.40/1.12 + 2.88/1.12² + (3.456 + 51.84)/1.12³ = 2.143 + 2.296 + 39.359 = <strong>Rs 43.80<\/strong>.<\/p>\n<p><strong>N10. Preferred stock.<\/strong> Dp = Rs 12, kp = 10% → Vp = <strong>Rs 120<\/strong>.<\/p>\n<p><strong>N11. Capital budgeting.<\/strong> Cost Rs 100,000; cash inflows Y1–Y4: 30,000; 40,000; 50,000; 20,000; k = 10%.<\/p>\n<table>\n<thead>\n<tr>\n<th>Year<\/th>\n<th>CF<\/th>\n<th>PVIF 10%<\/th>\n<th>PV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>30,000<\/td>\n<td>0.9091<\/td>\n<td>27,273<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>40,000<\/td>\n<td>0.8264<\/td>\n<td>33,058<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>50,000<\/td>\n<td>0.7513<\/td>\n<td>37,566<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>20,000<\/td>\n<td>0.6830<\/td>\n<td>13,660<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Total PV<\/td>\n<td>111,557<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Payback<\/strong> = 2 + (100,000 − 70,000)/50,000 = <strong>2.6 years<\/strong><\/li>\n<li><strong>Discounted payback<\/strong> = 3 + (100,000 − 97,897)/13,660 = <strong>3.15 years<\/strong><\/li>\n<li><strong>NPV<\/strong> = 111,557 − 100,000 = <strong>Rs 11,557<\/strong> → accept<\/li>\n<li><strong>PI<\/strong> = 111,557 / 100,000 = <strong>1.12<\/strong> → accept<\/li>\n<li><strong>IRR:<\/strong> NPV at 15% = +644; at 16% = −1,333 → IRR ≈ 15% + 644/(644 + 1,333) = <strong>15.33%<\/strong> &gt; 10% → accept<\/li>\n<li><strong>MIRR:<\/strong> TV = 30,000(1.1)³ + 40,000(1.1)² + 50,000(1.1) + 20,000 = 163,330; MIRR = (163,330/100,000)^(1/4) − 1 = <strong>13.05%<\/strong><\/li>\n<\/ul>\n<p><strong>N12. Leverage.<\/strong> 10,000 units at Rs 100; VC Rs 60/unit; fixed cost Rs 200,000; interest Rs 50,000.\nContribution = 400,000; EBIT = 200,000; EBT = 150,000.\nDOL = 400,000/200,000 = <strong>2.0<\/strong>; DFL = 200,000/150,000 = <strong>1.33<\/strong>; DTL = <strong>2.67<\/strong> — a 10% rise in sales raises EPS by 26.7%.<\/p>\n<p><strong>N13. Loan amortisation.<\/strong> Rs 100,000 at 10% for 3 years, equal annual payments.\nPMT = 100,000 / PVIFA(10%,3) = 100,000 / 2.4869 = <strong>Rs 40,211.48<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Year<\/th>\n<th>Payment<\/th>\n<th>Interest<\/th>\n<th>Principal<\/th>\n<th>Balance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>40,211.48<\/td>\n<td>10,000.00<\/td>\n<td>30,211.48<\/td>\n<td>69,788.52<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>40,211.48<\/td>\n<td>6,978.85<\/td>\n<td>33,232.63<\/td>\n<td>36,555.89<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>40,211.48<\/td>\n<td>3,655.59<\/td>\n<td>36,555.89<\/td>\n<td>0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>N14. EAR.<\/strong> 12% compounded monthly: EAR = (1.01)¹² − 1 = <strong>12.68%<\/strong>.<\/p>\n<p><strong>Common calculation mistakes:<\/strong> using the annual rate with semi-annual periods · forgetting D1 = D0(1+g) in Gordon · mixing ordinary annuity and annuity due · not stating accept/reject after NPV/IRR · in CCC adding instead of subtracting the payables period · rounding PVIF too early.<\/p>", "extra_title": "Formula sheet and solved numericals"}, {"code": "IT 249", "id": "IT249", "title": "Business Intelligence", "sem": 8, "exam": "2026-12-06", "official": "IT 249: Business Intelligence", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — 3 credit hours, 48 LH, with laboratory work", "note": "Matches routine. No discrepancy.", "marks": "Full Marks 60, Pass 30, 3 hrs (TU Model Question 2026). Group A 10×1=10 · Group B 5×3=15 (any 5 of Q11–16) · Group C 3×5=15 (any 3 of Q17–20) · Group D 2×10=20 (Q21–22, both).", "objectives": "Teach the role of BI in organisations, data warehousing, data mining and visualisation, and give hands-on experience with BI tools for data-driven decision-making.", "units": [{"n": 1, "t": "Introduction to Business Intelligence", "lh": 5, "topics": "Definition and scope of BI; role of BI in decision-making; overview of BI tools and technologies."}, {"n": 2, "t": "Data Warehousing", "lh": 8, "topics": "Concepts and architecture; ETL processes; data modelling for BI."}, {"n": 3, "t": "Data Mining", "lh": 8, "topics": "Concepts; data preprocessing; classification and clustering algorithms; association rule mining."}, {"n": 4, "t": "Data Visualization", "lh": 7, "topics": "Principles of visualisation; tools and techniques; dashboard design and best practices."}, {"n": 5, "t": "BI Tools and Technologies", "lh": 12, "topics": "Popular BI tools (Tableau, Power BI); hands-on data analysis and reporting; introduction to OLAP."}, {"n": 6, "t": "BI Implementation", "lh": 8, "topics": "Best practices; challenges and considerations; case studies of successful implementations."}], "avail": "<p><strong>No actual NC paper exists<\/strong> — December 2026 is the first sitting (the model is marked \"Only for 2021 AD admitted\"). <strong>Insufficient data<\/strong> for frequency across exams. The <strong>TU Model Question 2026<\/strong> (Category C) is fully available and is used as the main evidence. In 6th-semester NC subjects TU reused model-question topics in the real exam (e.g. RCH 201: applied research, telephone interview, research-design types, probability sampling), so model topics deserve priority — but nothing is guaranteed.<\/p>\n<p>Old-course BI or \"Data Warehousing and Data Mining (IT 274, 7th sem)\" papers were not used.<\/p>", "pattern": "<p><strong>Model 2026 question types:<\/strong> definitions (10) · explain/compare (6) · architecture/compare/worked example/design (4) · <strong>two 10-mark scenario designs<\/strong> (retail forecasting; healthcare BI rollout).<\/p>\n<p><strong>Unit spread:<\/strong> U1: 2 · U2: 6 · U3: 6 · U4: 3 · U5: 2 · U6: 3 (incl. both 10-markers). Data warehousing and data mining carry the most questions; Unit 6 (implementation) carries the most marks (Group D). Unit 5 has 12 LH but only Group A items — expect OLAP operations and Power BI/Tableau in some form.<\/p>\n<p><strong>Prepare a numerical:<\/strong> support/confidence/lift calculation (Q19) is the only computational item.<\/p>", "papers": [{"id": "M26", "label": "TU Model Question 2026", "cat": "C", "session": "Model (2026)", "source": "TU FOM Model Question 2026 (BITM 1st and BBA/BIM/BBM 8th semester)", "url": "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf", "note": "Wording retrieved through a text-extraction tool; meaning and marks as printed.", "qs": [{"no": "1", "g": "A", "t": "Define Business Intelligence.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "Mention two benefits of BI in decision-making.", "m": 1, "u": 1}, {"no": "3", "g": "A", "t": "Define a data warehouse.", "m": 1, "u": 2}, {"no": "4", "g": "A", "t": "Expand ETL.", "m": 1, "u": 2}, {"no": "5", "g": "A", "t": "Define data mining in one sentence.", "m": 1, "u": 3}, {"no": "6", "g": "A", "t": "Name one classification and one clustering algorithm.", "m": 1, "u": 3}, {"no": "7", "g": "A", "t": "State one principle of data visualisation.", "m": 1, "u": 4}, {"no": "8", "g": "A", "t": "Name one popular BI tool.", "m": 1, "u": 5}, {"no": "9", "g": "A", "t": "What are the uses of OLAP?", "m": 1, "u": 5}, {"no": "10", "g": "A", "t": "Define metadata in BI.", "m": 1, "u": 2}, {"no": "11", "g": "B", "t": "Explain the role of ETL in a BI system.", "m": 3, "u": 2}, {"no": "12", "g": "B", "t": "Explain the star schema and its components.", "m": 3, "u": 2}, {"no": "13", "g": "B", "t": "What is data preprocessing and why is it important?", "m": 3, "u": 3}, {"no": "14", "g": "B", "t": "Differentiate supervised and unsupervised learning.", "m": 3, "u": 3}, {"no": "15", "g": "B", "t": "Explain three dashboard-design best practices.", "m": 3, "u": 4}, {"no": "16", "g": "B", "t": "What are the challenges in implementing BI?", "m": 3, "u": 6}, {"no": "17", "g": "C", "t": "Explain data-warehouse architecture and its layers.", "m": 5, "u": 2}, {"no": "18", "g": "C", "t": "Compare decision trees and Naive Bayes.", "m": 5, "u": 3}, {"no": "19", "g": "C", "t": "Explain association rule mining with support and confidence, using a retail example.", "m": 5, "u": 3}, {"no": "20", "g": "C", "t": "Design a monthly sales dashboard for an online retailer.", "m": 5, "u": 4}, {"no": "21", "g": "D", "t": "Propose an end-to-end BI approach for a mid-size retailer's sales forecasting and inventory planning.", "m": 10, "u": 6}, {"no": "22", "g": "D", "t": "Discuss BI best practices and challenges, and propose a phased implementation plan for a healthcare provider.", "m": 10, "u": 6}]}], "notes": {"1": "<p>Organisations today collect huge amounts of data from sales, customers, websites and operations, but data alone does not help managers. Business Intelligence turns this data into timely, accurate information so that decisions are based on facts rather than guesswork.<\/p>\n<h3>1.1 What is Business Intelligence?<\/h3>\n<p><strong>Definitions<\/strong><\/p>\n<ul>\n<li>BI is a set of methodologies, processes, architectures and technologies that transform raw data into meaningful and useful information for business decisions.<\/li>\n<li>Gartner describes BI as an umbrella term that includes the applications, infrastructure, tools and best practices that enable access to and analysis of information to improve decisions and performance.<\/li>\n<li>Simply: <strong>BI = getting the right information to the right people at the right time.<\/strong><\/li>\n<\/ul>\n<p><strong>Scope of BI:<\/strong> data sourcing and integration (ETL) · data warehousing · querying and reporting · OLAP · data mining and analytics · dashboards and scorecards · performance management.<\/p>\n<h3>1.2 Role of BI in decision-making<\/h3>\n<p>Decisions occur at three levels — <strong>strategic<\/strong> (top management, long-term), <strong>tactical<\/strong> (middle management) and <strong>operational<\/strong> (day-to-day). BI supports all three:<\/p>\n<ul>\n<li>gives a single version of the truth from integrated data;<\/li>\n<li>reveals trends, patterns and exceptions;<\/li>\n<li>measures performance against KPIs;<\/li>\n<li>speeds up decisions with self-service reports;<\/li>\n<li>supports what-if and forecasting.\n<em>Example:<\/em> a retail chain's dashboard shows that a product sells out every Friday in Pokhara, so the manager increases Thursday deliveries.<\/li>\n<\/ul>\n<h3>1.3 Overview of BI tools and technologies<\/h3>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Source systems<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">ETL tools<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data warehouse /<\/text><text x=\"382.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">marts<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">OLAP &amp; mining<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Reports &amp;<\/text><text x=\"698.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">dashboards<\/text><\/svg><\/div>\n\n<ul>\n<li><strong>ETL:<\/strong> SSIS, Informatica, Talend, Azure Data Factory.<\/li>\n<li><strong>Storage:<\/strong> relational warehouses (SQL Server, Oracle), cloud warehouses (Snowflake, BigQuery, Redshift).<\/li>\n<li><strong>Analysis:<\/strong> OLAP cubes, data-mining tools (Python, R, Weka, RapidMiner).<\/li>\n<li><strong>Presentation:<\/strong> Power BI, Tableau, Qlik, Excel.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> definitions · scope · three decision levels · BI pipeline · tool categories.<\/p>", "2": "<p>Operational databases are designed to record transactions quickly, not to answer analytical questions across years of data. A data warehouse solves this by collecting cleaned, integrated, historical data in one place for analysis.<\/p>\n<h3>2.1 What is a data warehouse?<\/h3>\n<p><strong>Definitions<\/strong><\/p>\n<ul>\n<li><strong>W. H. Inmon:<\/strong> \"A data warehouse is a subject-oriented, integrated, time-variant and non-volatile collection of data in support of management's decision-making process.\"<\/li>\n<li><strong>Ralph Kimball:<\/strong> \"A data warehouse is a copy of transaction data specifically structured for query and analysis.\"<\/li>\n<\/ul>\n<p><strong>Characteristics<\/strong><\/p>\n<ol>\n<li><strong>Subject-oriented<\/strong> — organised around subjects such as sales, customers, products.<\/li>\n<li><strong>Integrated<\/strong> — consistent naming, units and formats from many sources.<\/li>\n<li><strong>Time-variant<\/strong> — stores history (5–10 years) with time stamps.<\/li>\n<li><strong>Non-volatile<\/strong> — data is loaded and read, not updated in place.<\/li>\n<\/ol>\n<p><strong>OLTP vs OLAP:<\/strong> OLTP handles current, detailed, normalised data for many short transactions; OLAP handles historical, summarised, denormalised data for complex queries by fewer analysts.<\/p>\n<h3>2.2 Data warehouse architecture<\/h3>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Front-end tools: reporting, OLAP, mining, dashboards<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">OLAP server (ROLAP / MOLAP / HOLAP)<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data warehouse + data marts + metadata repository<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Staging area (ETL)<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Operational and external data sources<\/text><\/svg><\/div>\n\n<p><strong>Components<\/strong><\/p>\n<ul>\n<li><strong>Data sources:<\/strong> ERP, CRM, POS, spreadsheets, external data.<\/li>\n<li><strong>Staging area:<\/strong> temporary area where data is cleaned and transformed.<\/li>\n<li><strong>Warehouse database:<\/strong> the central integrated store.<\/li>\n<li><strong>Data marts:<\/strong> subject/department subsets — <em>dependent<\/em> (fed from the warehouse) or <em>independent<\/em>.<\/li>\n<li><strong>Metadata repository:<\/strong> describes data sources, definitions, mappings, refresh schedules.<\/li>\n<li><strong>OLAP server and front-end tools<\/strong> for users.\n<strong>Approaches:<\/strong> Inmon top-down (enterprise warehouse first) vs Kimball bottom-up (dimensional marts linked by conformed dimensions).<\/li>\n<\/ul>\n<h3>2.3 ETL process<\/h3>\n<ol>\n<li><strong>Extract<\/strong> — read data from sources (full or incremental, change data capture).<\/li>\n<li><strong>Transform<\/strong> — cleanse (duplicates, errors, missing values), standardise, integrate, derive, aggregate, assign surrogate keys, apply business rules.<\/li>\n<li><strong>Load<\/strong> — initial load and periodic refreshes; maintain indexes and logs.\nETL ensures data quality and consistency; ELT loads first and transforms inside modern cloud warehouses.<\/li>\n<\/ol>\n<h3>2.4 Data modelling for BI<\/h3>\n<p><strong>Dimensional modelling<\/strong> uses <strong>fact tables<\/strong> (measures and foreign keys at a declared grain) and <strong>dimension tables<\/strong> (descriptive attributes).<\/p>\n<ul>\n<li><strong>Star schema<\/strong> — one fact table surrounded by denormalised dimensions (simple, fast).<\/li>\n<li><strong>Snowflake schema<\/strong> — normalised dimensions (less redundancy, more joins).<\/li>\n<li><strong>Fact constellation / galaxy<\/strong> — several fact tables sharing dimensions.<\/li>\n<li><strong>Slowly changing dimensions:<\/strong> Type 1 overwrite, Type 2 add a new row (keep history), Type 3 add a column.<\/li>\n<li><strong>Fact types:<\/strong> additive, semi-additive, non-additive; factless fact tables.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> Inmon's four characteristics · OLTP vs OLAP · architecture components · ETL steps · star/snowflake/galaxy · SCD types.<\/p>", "3": "<p>Even after data is stored in a warehouse, valuable patterns remain hidden among millions of records. Data mining uses statistics and machine learning to discover these patterns automatically.<\/p>\n<h3>3.1 What is data mining?<\/h3>\n<p><strong>Definitions<\/strong><\/p>\n<ul>\n<li>Data mining is the process of discovering interesting, previously unknown and potentially useful patterns from large amounts of data.<\/li>\n<li>It is the analysis of (often large) observational data sets to find unsuspected relationships and to summarise the data in novel ways that are understandable and useful.<\/li>\n<li>Data mining is one step of <strong>Knowledge Discovery in Databases (KDD)<\/strong>.<\/li>\n<\/ul>\n<p><strong>KDD process<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 354\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data cleaning &amp; integration<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Selection<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Transformation<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data mining<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Pattern evaluation<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Knowledge presentation<\/text><\/svg><\/div>\n\n<p><strong>Applications:<\/strong> market-basket analysis, fraud detection, customer segmentation, churn prediction, credit scoring, medical diagnosis.<\/p>\n<h3>3.2 Data preprocessing<\/h3>\n<p>Real data is <strong>incomplete, noisy and inconsistent<\/strong>.<\/p>\n<ul>\n<li><strong>Cleaning:<\/strong> fill missing values (ignore, mean/median, most probable value), smooth noise (binning, regression), remove outliers.<\/li>\n<li><strong>Integration:<\/strong> merge sources, resolve entity and schema conflicts, remove redundancy (correlation analysis).<\/li>\n<li><strong>Transformation:<\/strong> normalisation (min–max: v' = (v − min)/(max − min); z-score), aggregation, discretisation, encoding.<\/li>\n<li><strong>Reduction:<\/strong> dimensionality reduction (PCA, feature selection), numerosity reduction (sampling, clustering), compression.<\/li>\n<\/ul>\n<h3>3.3 Classification algorithms<\/h3>\n<p><strong>Classification<\/strong> predicts a categorical class label from labelled training data (supervised).<\/p>\n<ul>\n<li><strong>Decision tree<\/strong> — splits on the attribute with the highest information gain (ID3/C4.5) or lowest Gini (CART). Entropy = −Σ pᵢ log₂ pᵢ.<\/li>\n<li><strong>Naive Bayes<\/strong> — Bayes' theorem with an independence assumption.<\/li>\n<li><strong>k-Nearest Neighbour<\/strong> — class of the majority among the k closest points.<\/li>\n<li><strong>Support Vector Machine, neural networks, logistic regression.<\/strong>\n<strong>Evaluation:<\/strong> confusion matrix, accuracy, precision, recall, F1; train/test split and cross-validation; overfitting and pruning.<\/li>\n<\/ul>\n<h3>3.4 Clustering algorithms<\/h3>\n<p><strong>Clustering<\/strong> groups similar objects without labels (unsupervised).<\/p>\n<ul>\n<li><strong>Partitioning:<\/strong> k-means (assign to the nearest centroid, recompute centroids, repeat), k-medoids.<\/li>\n<li><strong>Hierarchical:<\/strong> agglomerative (bottom-up) and divisive (top-down); dendrogram.<\/li>\n<li><strong>Density-based:<\/strong> DBSCAN (finds arbitrary shapes, handles noise).\nDistance measures: Euclidean, Manhattan.<\/li>\n<\/ul>\n<h3>3.5 Association rule mining<\/h3>\n<p>Finds items frequently bought together: rule X → Y with <strong>support<\/strong>, <strong>confidence<\/strong> and <strong>lift<\/strong>. <strong>Apriori:<\/strong> generate frequent itemsets level-wise using the Apriori property (all subsets of a frequent itemset are frequent), then generate strong rules. <strong>FP-Growth<\/strong> avoids candidate generation using an FP-tree.<\/p>\n<p><strong>Key points:<\/strong> definitions and KDD · four preprocessing tasks · classifiers and metrics · k-means, hierarchical, DBSCAN · support/confidence/lift · Apriori vs FP-Growth.<\/p>", "4": "<p>Numbers in a table are hard to understand quickly; the human eye recognises patterns in pictures far faster. Data visualisation presents data graphically so that insights are obvious.<\/p>\n<h3>4.1 What is data visualisation? Principles<\/h3>\n<p><strong>Definition:<\/strong> the graphical representation of data and information using charts, graphs, maps and dashboards to make patterns, trends and outliers easy to see.\n<strong>Principles<\/strong><\/p>\n<ul>\n<li>Know the audience and the message.<\/li>\n<li>Choose the right chart for the data type.<\/li>\n<li>Simplicity — maximise the <em>data-ink ratio<\/em> and avoid chart junk (Edward Tufte).<\/li>\n<li>Accuracy — honest scales, bar axes starting at zero.<\/li>\n<li>Use colour purposefully and consistently; colour-blind safe palettes.<\/li>\n<li>Provide context — titles, labels, units, targets.<\/li>\n<li>Use pre-attentive attributes (size, colour, position) to highlight what matters.<\/li>\n<\/ul>\n<h3>4.2 Tools and techniques<\/h3>\n<p><strong>Chart selection:<\/strong> comparison → bar/column · trend → line/area · composition → stacked bar/pie/treemap · distribution → histogram/box plot · relationship → scatter/bubble · geography → choropleth map · KPIs → cards, gauges, bullet charts · flows → Sankey.\n<strong>Tools:<\/strong> Power BI, Tableau, Qlik, Excel, Google Looker Studio, Python (matplotlib, seaborn, plotly), D3.js.\n<strong>Techniques:<\/strong> drill-down, filtering/slicers, tooltips, small multiples, storytelling with data.<\/p>\n<h3>4.3 Dashboard design and best practices<\/h3>\n<p>A <strong>dashboard<\/strong> is a visual display of the most important information needed to achieve objectives, arranged on a single screen (Stephen Few).\n<strong>Types:<\/strong> strategic (executive KPIs), analytical (exploration), operational (real-time monitoring).\n<strong>Best practices:<\/strong> define KPIs first · 5–9 visuals · most important at top-left · group related items · consistent layout and colours · context (targets, variance) · interactivity · fast refresh · mobile-friendly · test with users.<\/p>\n<p><strong>Key points:<\/strong> definition · seven principles · chart selection table · tools · dashboard types and best practices.<\/p>", "5": "<p>Modern BI tools let business users connect to data, model it and build interactive reports themselves, without waiting for IT. OLAP gives fast multidimensional views behind many of these tools.<\/p>\n<h3>5.1 Popular BI tools<\/h3>\n<ul>\n<li><strong>Microsoft Power BI:<\/strong> Power BI Desktop (Power Query for ETL, data model with relationships, DAX measures, visuals), Power BI Service (sharing, dashboards, scheduled refresh, row-level security), mobile apps; integrates with Excel, Azure and Microsoft 365.<\/li>\n<li><strong>Tableau:<\/strong> drag-and-drop visual analytics, VizQL engine, calculated fields, dashboards and stories, Tableau Server/Cloud, strong visual design.<\/li>\n<li><strong>Qlik Sense<\/strong> (associative engine), <strong>Looker<\/strong>, <strong>Google Looker Studio<\/strong>, <strong>SAP BusinessObjects<\/strong>, <strong>Oracle Analytics<\/strong>.\n<em>Comparison:<\/em> Power BI is low-cost and Microsoft-integrated; Tableau is strong in visual exploration; Qlik excels at associative search.<\/li>\n<\/ul>\n<h3>5.2 Hands-on data analysis and reporting<\/h3>\n<p>Workflow: connect to sources → clean and shape (remove nulls, change types, merge/append) → model (star schema, relationships, hierarchies) → create measures (e.g. <code>Total Sales = SUM(Sales[Amount])<\/code>, <code>Sales LY = CALCULATE([Total Sales], SAMEPERIODLASTYEAR('Date'[Date]))<\/code>) → build visuals → add slicers and drill-through → publish → schedule refresh → share.\n<strong>Report types:<\/strong> static/scheduled reports, ad-hoc queries, interactive dashboards, paginated reports, alerts.<\/p>\n<h3>5.3 Introduction to OLAP<\/h3>\n<p>OLAP enables interactive multidimensional analysis using <strong>data cubes<\/strong> (dimensions × measures).\n<strong>Operations:<\/strong> roll-up · drill-down · slice · dice · pivot (also drill-across, drill-through).\n<strong>Types:<\/strong> MOLAP (cube storage, fastest), ROLAP (relational, scalable), HOLAP (hybrid).\n<strong>Codd's OLAP rules<\/strong> (selected): multidimensional view, transparency, accessibility, consistent performance, client–server architecture, multi-user support.<\/p>\n<p><strong>Key points:<\/strong> tool features and comparison · analysis workflow · sample DAX · cube operations · MOLAP/ROLAP/HOLAP.<\/p>", "6": "<p>Many BI projects fail not because of technology but because of unclear goals, poor data and low user adoption. Successful BI implementation needs careful planning, governance and change management.<\/p>\n<h3>6.1 Implementation best practices<\/h3>\n<ul>\n<li>Align BI with business strategy; define q
