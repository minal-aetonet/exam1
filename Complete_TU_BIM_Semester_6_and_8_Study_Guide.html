es.<\/p>", "8": "<p>When a cybercrime happens, investigators must find and preserve digital evidence that will stand up in court. Digital forensics provides the scientific methods to do this.<\/p>\n<h3>8.1 Computer forensics vs digital forensics<\/h3>\n<p><strong>Computer forensics<\/strong> — recovery and investigation of material found on computers. <strong>Digital forensics<\/strong> — the broader science covering all digital devices: computers, mobiles, networks, cloud, IoT, memory. Branches: computer, mobile, network, database, cloud, memory forensics.<\/p>\n<h3>8.2 Stages of digital forensics<\/h3>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 354\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Identification<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Preservation<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Collection<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Examination<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Analysis<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Reporting / presentation<\/text><\/svg><\/div>\n\n<h3>8.3 Digital evidence<\/h3>\n<p>Any probative information stored or transmitted digitally. Properties: admissible, authentic, complete, reliable, believable. Volatility order: CPU registers and cache → RAM → network state → disk → backups.<\/p>\n<h3>8.4 Forensic methods and labs<\/h3>\n<p>Imaging (bit-stream copies), hashing, keyword search, file carving, timeline analysis, log analysis. Lab requirements: secure facility, write blockers, imaging hardware, validated software (EnCase, FTK, Autopsy), trained staff, accreditation (ISO/IEC 17025).<\/p>\n<h3>8.5 Collecting, seizing and protecting evidence<\/h3>\n<p>Legal authority (warrant/consent), photograph the scene, live acquisition of volatile data, use write blockers, hash values, chain-of-custody forms, anti-static and Faraday bags, secure storage.<\/p>\n<h3>8.6 Data recovery<\/h3>\n<p>Recovering deleted, damaged or hidden data from unallocated space, slack space, damaged media or backups; file signatures and carving.<\/p>\n<h3>8.7 Mobile forensics<\/h3>\n<p>Logical, file-system and physical extraction; tools such as Cellebrite; challenges of encryption, many OS versions, cloud sync and remote wipe.<\/p>\n<h3>8.8 Legal aspects<\/h3>\n<p>Admissibility, authenticity of electronic records, privacy rights, search-and-seizure law, expert testimony, cross-border evidence (mutual legal assistance).<\/p>\n<h3>8.9 Cyber forensics in Nepal<\/h3>\n<p>Nepal Police Cyber Bureau (2018), Central Police Forensic Science Laboratory; prosecution mainly under the Electronic Transactions Act, 2063; gaps in labs, experts, SOPs and international cooperation.<\/p>\n<p><strong>Key points:<\/strong> definitions and branches · six stages · evidence properties and volatility · lab essentials · handling procedures · recovery · mobile · legal · Nepal.<\/p>", "9": "<p>As more Nepalis shop, bank and communicate online, crimes using computers have grown. Cyber law sets the legal rules for electronic transactions and punishes cybercrime.<\/p>\n<h3>9.1 Legal perspective of cybercrime<\/h3>\n<p>Cybercrime = crime in which a computer is the <strong>target<\/strong>, the <strong>tool<\/strong>, or <strong>incidental<\/strong> to the offence. Categories: crimes against persons (harassment, defamation), property (fraud, hacking, piracy), government (cyber terrorism) and society (obscenity). Legal elements: offence definitions, jurisdiction, evidence, penalties.<\/p>\n<h3>9.2 Electronic Transactions Act (ETA), 2063 (2008)<\/h3>\n<p>Main cyber law of Nepal: legal recognition of electronic records and digital signatures; provisions on certifying authorities and the Controller of Certification; duties of subscribers and network service providers; offences relating to computers (e.g. piracy/alteration of source code, unauthorised access, damage to computers and information systems, publishing illegal material electronically, breach of confidentiality, computer fraud); an Information Technology Tribunal and Appellate Tribunal. <em>(Verify section numbers and penalties in the Act text.)<\/em><\/p>\n<h3>9.3 Electronic Transaction Rules, 2064<\/h3>\n<p>Operational rules for the Act: licensing of certifying authorities, digital-certificate procedures, record keeping, fees.<\/p>\n<h3>9.4 IT Policy<\/h3>\n<p>IT Policy 2057 and 2067 → National ICT Policy 2072 (2015) → Digital Nepal Framework (2019) → National Cyber Security Policy (2023): goals of access, e-governance, IT industry, security.<\/p>\n<h3>9.5 Information security policies<\/h3>\n<p>Organisational documents that define how information is protected: acceptable-use, access-control, password, data-classification, backup and recovery, incident-response, BYOD, remote-access policies; aligned with ISO/IEC 27001; supported by awareness and audits.<\/p>\n<p><strong>Key points:<\/strong> cybercrime categories · ETA purposes and offence types · Rules 2064 · policy timeline · security-policy types.<\/p>"}, "qa": [{"id": "IT246-01", "t": "Ethics vs law; ethics in business; importance", "u": 1, "q": "Define ethics. Differentiate ethics and law. Explain the importance of ethics in the business world with example.", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"E25": "A?, B?", "M": "B11"}, "rep": true, "src": "2025 exam (fragments) A?, B?; TU model question B11", "a": "<p><strong>Ethics<\/strong> is a set of beliefs about right and wrong behaviour within a society; <strong>morals<\/strong> are personal principles; <strong>integrity<\/strong> is acting in line with one's principles.<\/p>\n<table>\n<thead>\n<tr>\n<th>Ethics<\/th>\n<th>Law<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Moral principles guiding behaviour<\/td>\n<td>Formal rules enacted and enforced by the state<\/td>\n<\/tr>\n<tr>\n<td>Based on values, culture, conscience<\/td>\n<td>Based on legislation and courts<\/td>\n<\/tr>\n<tr>\n<td>Voluntary; violation → social disapproval<\/td>\n<td>Mandatory; violation → legal penalty<\/td>\n<\/tr>\n<tr>\n<td>May vary by person or culture<\/td>\n<td>Uniform within a jurisdiction<\/td>\n<\/tr>\n<tr>\n<td>Broader — something legal may still be unethical<\/td>\n<td>Minimum standard of behaviour<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Importance of ethics in business<\/strong><\/p>\n<ol>\n<li><strong>Gaining the goodwill of the community<\/strong> — trust and reputation.<\/li>\n<li><strong>Creating an organisation that operates consistently<\/strong> — shared values guide decisions.<\/li>\n<li><strong>Fostering good business practices<\/strong> — fair treatment of customers builds loyalty and repeat business.<\/li>\n<li><strong>Protecting the organisation and employees from legal action<\/strong> (e.g. corruption, fraud, harassment).<\/li>\n<li><strong>Avoiding unfavourable publicity<\/strong> and loss of market value.<\/li>\n<li><strong>Attracting and retaining talented employees and investors.<\/strong><\/li>\n<\/ol>\n<p><em>Example:<\/em> a bank that transparently discloses all charges and protects customer data earns trust; one that hides fees or leaks data faces penalties, lost customers and reputational damage.<\/p>"}, {"id": "IT246-02", "t": "CSR; fostering CSR; improving business ethics; ethical decision-making", "u": 1, "q": "Define corporate social responsibility. How can organisations foster CSR and improve business ethics? Explain an ethical decision-making process.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "A1"}, "rep": false, "src": "TU model question A1", "a": "<p><strong>CSR:<\/strong> the concept that an organisation should act ethically by taking responsibility for the impact of its actions on the environment, the community and the welfare of its employees, beyond profit. Related: <strong>supply-chain sustainability<\/strong>.<\/p>\n<p><strong>Improving corporate ethics (Reynolds)<\/strong><\/p>\n<ol>\n<li><strong>Appoint a corporate ethics officer.<\/strong><\/li>\n<li><strong>Board of directors<\/strong> sets the tone and oversees ethics.<\/li>\n<li><strong>Establish a corporate code of ethics.<\/strong><\/li>\n<li><strong>Conduct social audits.<\/strong><\/li>\n<li><strong>Require employees to take ethics training.<\/strong><\/li>\n<li><strong>Include ethical criteria in employee appraisals.<\/strong><\/li>\n<li><strong>Create an ethical work environment<\/strong> (leaders model behaviour; protect whistle-blowers).<\/li>\n<\/ol>\n<p><strong>Ethical decision-making steps<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 416\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Gather facts<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Identify stakeholders and their positions<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Consider consequences<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Weigh guidelines and principles<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Develop and evaluate options<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Decide and implement<\/text><line x1=\"182.0\" y1=\"353\" x2=\"182.0\" y2=\"370\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"374\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"398.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Evaluate results<\/text><\/svg><\/div>\n\n<p><strong>Approaches:<\/strong> virtue ethics · utilitarian (greatest good) · fairness/justice · common good · rights-based (deontology).<\/p>"}, {"id": "IT246-03", "t": "IT professionalism; IT-worker relationships", "u": 2, "q": "State the role of professionalism in IT. Explain the relationships an IT worker must manage.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {"M": "A2"}, "rep": false, "src": "TU model question A2", "a": "<p><strong>Professional:<\/strong> one who requires advanced training and experience, exercises discretion and judgement, and whose work cannot be standardised. <strong>Professionalism in IT<\/strong> means competence, integrity, accountability and adherence to codes of conduct, which builds trust in IT services and protects the public.<\/p>\n<p><strong>Relationships IT workers must manage<\/strong><\/p>\n<ul>\n<li><strong>IT worker ↔ employer:<\/strong> loyalty, protecting trade secrets, honest reporting; issues — software piracy, conflicts of interest, whistle-blowing.<\/li>\n<li><strong>IT worker ↔ client:<\/strong> honest advice, delivering quality on time; issues — fraud, misrepresentation, breach of contract.<\/li>\n<li><strong>IT worker ↔ suppliers:<\/strong> avoiding bribery; gifts policy.<\/li>\n<li><strong>IT worker ↔ other professionals:<\/strong> respect, no résumé inflation, sharing knowledge.<\/li>\n<li><strong>IT worker ↔ IT users:<\/strong> preventing piracy and misuse, setting a good example.<\/li>\n<li><strong>IT worker ↔ society:<\/strong> safe, reliable systems.<\/li>\n<\/ul>\n<p><strong>Encouraging professionalism:<\/strong> professional codes of ethics (ACM, IEEE-CS, AITP), professional organisations, certification (CISSP, CompTIA), licensing (in some fields), continuing education.<\/p>"}, {"id": "IT246-04", "t": "Ethical issues for IT users; ethical use of IT resources", "u": 2, "q": "List ethical issues for IT users. How can organisations encourage the ethical use of IT resources?", "m": 3, "p": "High", "ty": "Explanation", "seen": {"E25": "A?", "M": "B12"}, "rep": true, "src": "2025 exam (fragments) A?; TU model question B12", "a": "<p><strong>Common ethical issues for IT users:<\/strong> software piracy · inappropriate use of computing resources (personal browsing, games, pornography at work) · inappropriate sharing of information (private data or confidential company information) · plagiarism · cyberbullying · privacy invasion.<\/p>\n<p><strong>Supporting ethical use of IT resources<\/strong><\/p>\n<ol>\n<li><strong>Establish guidelines/policies<\/strong> — an Acceptable Use Policy (AUP) defining permitted and prohibited use.<\/li>\n<li><strong>Define and limit appropriate use<\/strong> — e.g. access rights by role.<\/li>\n<li><strong>Educate employees<\/strong> about the policy and its importance.<\/li>\n<li><strong>Install and maintain a corporate firewall<\/strong> and web filters.<\/li>\n<li><strong>Monitor compliance<\/strong> (with employees' knowledge) and enforce consequences.<\/li>\n<li><strong>Software licence management<\/strong> to prevent piracy.<\/li>\n<li>Leaders set examples.<\/li>\n<\/ol>"}, {"id": "IT246-05", "t": "Privacy, anonymity, social-networking ethics", "u": 2, "q": "Explain privacy and anonymity issues and the ethics of social networking.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Privacy<\/strong> — the right to be left alone and to control personal information. <strong>Issues:<\/strong> data collection and profiling by companies, government surveillance, data breaches, workplace monitoring, cookies and tracking, data brokers.\n<strong>Anonymity<\/strong> — communicating without revealing identity (anonymous remailers, Tor). It protects whistle-blowers and free speech but can shield cyberbullying, defamation and crime; courts may order disclosure (\"John Doe\" lawsuits).\n<strong>Nepal:<\/strong> the Individual Privacy Act, 2075 (2018) protects personal information.\n<strong>Ethics of social networking:<\/strong> cyberbullying, cyberstalking, sexual predators, fake news, uploading inappropriate content, privacy of others' photos, employers screening candidates' profiles, addiction. Platforms should have terms of use, content moderation and reporting tools; users should respect others' privacy and verify information.<\/p>"}, {"id": "IT246-06", "t": "IP; copyright vs patent; trade secrets", "u": 3, "q": "Differentiate copyright and patent. What are trade secrets and how do they help businesses?", "m": 5, "p": "High", "ty": "Comparison", "seen": {"M": "A3, B13"}, "rep": false, "src": "TU model question A3, B13", "a": "<p><strong>Intellectual property (IP):<\/strong> works of the mind — art, books, films, formulas, inventions, music, processes — that are distinct and owned or created by an individual or organisation.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Copyright<\/th>\n<th>Patent<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Protects<\/td>\n<td>Original expression — books, music, software code, designs<\/td>\n<td>New, useful, non-obvious inventions and processes<\/td>\n<\/tr>\n<tr>\n<td>Requirement<\/td>\n<td>Originality, fixed in tangible form<\/td>\n<td>Novelty, inventive step, industrial application<\/td>\n<\/tr>\n<tr>\n<td>Registration<\/td>\n<td>Automatic (registration optional)<\/td>\n<td>Must be applied for and granted<\/td>\n<\/tr>\n<tr>\n<td>Duration<\/td>\n<td>Long (author's life + years after death, per national law)<\/td>\n<td>Limited (typically 20 years internationally)<\/td>\n<\/tr>\n<tr>\n<td>Protects idea?<\/td>\n<td>No — only the expression<\/td>\n<td>Yes — the invention itself<\/td>\n<\/tr>\n<tr>\n<td>Nepal law<\/td>\n<td>Copyright Act, 2059<\/td>\n<td>Patent, Design and Trademark Act, 2022 BS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Trade secret:<\/strong> business information that is confidential, has economic value because it is not generally known, and is protected by reasonable secrecy efforts — formulas, algorithms, source code, customer lists, pricing strategies (e.g. the Coca-Cola formula, Google's search algorithm).\n<strong>How they help businesses:<\/strong> no registration cost; protection lasts indefinitely while secret; protects valuable know-how that cannot be patented; competitive advantage. <strong>Protection measures:<\/strong> non-disclosure agreements (NDAs), non-compete clauses, access controls, employee training.\n<strong>Risk:<\/strong> no protection if independently discovered or reverse-engineered.<\/p>"}, {"id": "IT246-07", "t": "Trademark infringement and cybersquatting", "u": 3, "q": "Explain trademark infringement and cybersquatting and their impact on businesses and consumers.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "C20"}, "rep": false, "src": "TU model question C20", "a": "<p><strong>Trademark:<\/strong> a logo, package design, phrase, sound or word that identifies and distinguishes a product or service.\n<strong>Trademark infringement:<\/strong> unauthorised use of a trademark (or a confusingly similar one) in a way that misleads consumers about the source — fake branded goods, copycat logos, using a competitor's brand in ads.\n<strong>Cybersquatting:<\/strong> registering domain names that are famous trademarks or company names, in bad faith, to sell them at high prices, divert traffic or damage the brand. Variants: <strong>typosquatting<\/strong> (gooogle.com) and new top-level domains.<\/p>\n<p><strong>Impact on businesses:<\/strong> loss of sales and market share, brand dilution, reputational damage, legal and domain-recovery costs, customer confusion.\n<strong>Impact on consumers:<\/strong> deception and buying counterfeit or low-quality goods, phishing and fraud through look-alike sites, loss of trust, privacy and financial harm.\n<strong>Remedies:<\/strong> trademark registration; domain-dispute resolution under ICANN's <strong>UDRP<\/strong>; legal action; defensive domain registration; brand monitoring.<\/p>"}, {"id": "IT246-08", "t": "Plagiarism, reverse engineering, open source, competitive intelligence", "u": 3, "q": "Explain plagiarism, reverse engineering, open-source code and competitive intelligence as IP issues.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li><strong>Plagiarism:<\/strong> stealing someone's ideas or words and passing them off as one's own; detected by tools such as Turnitin; avoid by citing sources.<\/li>\n<li><strong>Reverse engineering:<\/strong> taking apart a product to understand how it works, in order to build a copy or a compatible product. Legal for interoperability in many jurisdictions but may violate licence agreements or trade-secret law if used to copy.<\/li>\n<li><strong>Open-source code:<\/strong> software whose source code is freely available to use, modify and distribute under licences (GPL — copyleft; MIT/Apache — permissive). Issues: licence compliance, quality and support, security.<\/li>\n<li><strong>Competitive intelligence:<\/strong> legally gathering information about competitors from public sources (annual reports, websites, trade shows). It becomes unethical/illegal (<strong>industrial espionage<\/strong>) when using theft, bribery or hacking.<\/li>\n<\/ul>"}, {"id": "IT246-09", "t": "Software quality and strategies", "u": 4, "q": "Explain the importance of software quality and strategies for developing quality software.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Software quality:<\/strong> the degree to which a system meets requirements and user expectations. <strong>Importance:<\/strong> defects can cause financial loss, safety hazards (medical, aviation), legal liability and reputational damage; business relies on information systems.\n<strong>Strategies<\/strong><\/p>\n<ul>\n<li>Use a <strong>software development methodology<\/strong> (SDLC, Agile) with defined processes.<\/li>\n<li><strong>Quality assurance (QA)<\/strong> — reviews, inspections, standards.<\/li>\n<li><strong>Testing:<\/strong> unit, integration, system, user acceptance; static and dynamic testing; black-box and white-box.<\/li>\n<li><strong>Capability Maturity Model Integration (CMMI)<\/strong> — process-improvement levels.<\/li>\n<li><strong>ISO 9001<\/strong> quality standards.<\/li>\n<li><strong>Safety-critical system practices<\/strong> — risk analysis, redundancy.<\/li>\n<li>Proper requirements, documentation and change management.\n<strong>Ethical issue:<\/strong> the trade-off between cost, schedule and quality — releasing buggy software knowingly is unethical.<\/li>\n<\/ul>"}, {"id": "IT246-10", "t": "Contingent workers; outsourcing; whistle-blowing", "u": 4, "q": "What is the main ethical concern in using contingent workers? Explain outsourcing and whistle-blowing.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "A4, A10"}, "rep": false, "src": "TU model question A4, A10", "a": "<p><strong>Contingent workers:<\/strong> temporary or contract staff without long-term employment (freelancers, consultants, temps). <strong>Main ethical concern:<\/strong> employers may use them to avoid paying benefits and providing job security — unequal pay, lack of training, no career path — while they do the same work as permanent staff; legal risk of misclassification.<\/p>\n<p><strong>Outsourcing / offshore outsourcing:<\/strong> contracting business functions (software development, support) to external firms, possibly in other countries. Pros: cost savings, access to expertise, focus on core work. Ethical issues: job losses at home, data-security and privacy risks, quality, exploitation of offshore workers, cultural and communication problems. <strong>H-1B<\/strong>-type visa debates.<\/p>\n<p><strong>Whistle-blowing:<\/strong> an employee's effort to attract public attention to a negligent, illegal, unethical, abusive or dangerous act by a company that threatens the public interest.\n<strong>Process:<\/strong> assess the seriousness → begin documentation → attempt to address it internally → consider escalation within the firm → assess the implications → use experts to develop a plan → execute the plan → live with the consequences. Whistle-blowers may face retaliation, so protection laws and anonymous hotlines matter.<\/p>"}, {"id": "IT246-11", "t": "Green computing into the SDLC", "u": 4, "q": "Explain green computing and how organisations can incorporate it into the software development lifecycle.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "C18"}, "rep": false, "src": "TU model question C18", "a": "<p><strong>Green computing<\/strong> is the efficient and environmentally responsible design, manufacture, operation and disposal of IT products and services — reducing energy use and e-waste. Standards/ratings: <strong>EPEAT<\/strong>, Energy Star.<\/p>\n<p><strong>Incorporating green computing into the SDLC<\/strong><\/p>\n<ol>\n<li><strong>Requirements:<\/strong> include energy efficiency and sustainability as non-functional requirements; measure carbon impact.<\/li>\n<li><strong>Design:<\/strong> energy-efficient architectures — efficient algorithms and data structures, minimal data transfer, caching, serverless/auto-scaling cloud designs, dark-mode and low-power UI for mobile.<\/li>\n<li><strong>Development:<\/strong> write optimised code, avoid unnecessary computation and polling, use efficient libraries, lazy loading.<\/li>\n<li><strong>Testing:<\/strong> include energy/performance profiling; use virtualised and cloud test environments instead of extra hardware.<\/li>\n<li><strong>Deployment:<\/strong> green data centres and cloud regions using renewable energy, virtualisation and consolidation, right-sizing resources.<\/li>\n<li><strong>Maintenance/operation:<\/strong> monitor resource usage, power-management settings, remove unused services.<\/li>\n<li><strong>Retirement:<\/strong> responsible disposal and e-waste recycling; data migration.\n<strong>Organisational practices:<\/strong> paperless processes, remote work, procurement of EPEAT devices, extending device life.<\/li>\n<\/ol>"}, {"id": "IT246-12", "t": "Cyberspace, cybersecurity; perspectives; risks mitigated; outsourcing breach", "u": 5, "q": "Describe the risks cybersecurity mitigates. A company's outsourced IT vendor caused a data breach — evaluate the cybersecurity risks of outsourcing IT operations and recommend mitigation strategies.", "m": 10, "p": "High", "ty": "Scenario", "seen": {"M": "D22"}, "rep": false, "src": "TU model question D22", "a": "<p><strong>Cyberspace:<\/strong> the interconnected digital environment of computers, networks, the Internet and data. <strong>Cybersecurity:<\/strong> protecting systems, networks, devices and data from digital attacks, unauthorised access and damage — ensuring <strong>confidentiality, integrity and availability (CIA)<\/strong>. Perspectives differ for individuals, businesses and nations (national security).<\/p>\n<p><strong>Risks cybersecurity mitigates<\/strong><\/p>\n<ul>\n<li><strong>Cyberwarfare<\/strong> and attacks on critical infrastructure.<\/li>\n<li><strong>Cybercrime<\/strong> — theft of money and data, fraud.<\/li>\n<li><strong>Data breaches<\/strong> and privacy violations.<\/li>\n<li><strong>Business disruption<\/strong> (ransomware, DDoS) and <strong>financial loss<\/strong>.<\/li>\n<li><strong>Reputational damage<\/strong> and loss of customer trust.<\/li>\n<li><strong>Legal and regulatory penalties<\/strong>.<\/li>\n<li><strong>Espionage<\/strong> — theft of trade secrets.<\/li>\n<li><strong>Physical harm<\/strong> through attacks on IoT/medical/industrial systems.<\/li>\n<\/ul>\n<p><strong>Risks of outsourcing IT operations (scenario evaluation)<\/strong><\/p>\n<ol>\n<li><strong>Loss of direct control<\/strong> over security practices.<\/li>\n<li><strong>Third-party access<\/strong> — vendor staff hold privileged credentials (insider-threat risk).<\/li>\n<li><strong>Supply-chain attacks<\/strong> — attackers compromise the weaker vendor to reach the client.<\/li>\n<li><strong>Data-location and legal/jurisdiction issues<\/strong> with offshore vendors.<\/li>\n<li><strong>Inconsistent security standards<\/strong> and patching.<\/li>\n<li><strong>Unclear responsibilities and slow incident response.<\/strong><\/li>\n<li><strong>Compliance violations<\/strong> (privacy laws) — the client remains accountable.<\/li>\n<li><strong>Reputational damage<\/strong> falls on the client, not the vendor.<\/li>\n<\/ol>\n<p><strong>Mitigation strategies<\/strong><\/p>\n<ul>\n<li><strong>Vendor due diligence<\/strong> — assess security posture, certifications (ISO 27001, SOC 2) before signing.<\/li>\n<li><strong>Strong contracts and SLAs<\/strong> — security requirements, breach-notification deadlines, audit rights, liability and penalties, data-return/destruction on exit.<\/li>\n<li><strong>Least-privilege access<\/strong> for vendor staff, MFA, privileged-access management, time-limited accounts.<\/li>\n<li><strong>Encryption<\/strong> of data at rest and in transit; data minimisation.<\/li>\n<li><strong>Continuous monitoring and audits<\/strong> — logs, SIEM, periodic penetration testing.<\/li>\n<li><strong>Segregate networks<\/strong> — vendor access through controlled jump servers/VPN.<\/li>\n<li><strong>Joint incident-response plan<\/strong> and drills.<\/li>\n<li><strong>Third-party risk-management programme<\/strong> and cyber insurance.<\/li>\n<\/ul>\n<p><em>After the breach:<\/em> contain, investigate (forensics), notify affected parties and regulators, review the vendor relationship, remediate gaps.<\/p>"}, {"id": "IT246-13", "t": "Technological change, economic-model shifts, outsourcing — impact on security", "u": 5, "q": "What role do shifts in economic models play in the development of cybersecurity?", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M": "B15"}, "rep": false, "src": "TU model question B15", "a": "<ul>\n<li><strong>Shift to digital and online business models<\/strong> (e-commerce, digital banking, platforms) → valuable data and money move online → more attacks → stronger security needed.<\/li>\n<li><strong>Cloud and \"as-a-service\" economy<\/strong> → data held by third parties → shared-responsibility security, cloud-security tools.<\/li>\n<li><strong>Gig and remote-work economy<\/strong> → employees on personal devices and home networks → endpoint security, VPNs, zero trust.<\/li>\n<li><strong>Data as an economic asset<\/strong> → data theft becomes profitable (black markets) → privacy laws and encryption.<\/li>\n<li><strong>Cybercrime-as-a-service / ransomware economy<\/strong> → professionalised attackers → threat intelligence, incident response.<\/li>\n<li><strong>Outsourcing and global supply chains<\/strong> → third-party risks → vendor risk management.<\/li>\n<li><strong>Cyber insurance market<\/strong> → incentives for better controls.\n<strong>Technological change<\/strong> (IoT, AI, 5G) expands the attack surface faster than defences mature.<\/li>\n<\/ul>"}, {"id": "IT246-14", "t": "Common cyberattacks; poisoned web service; network infrastructure poisoning; techniques", "u": 5, "q": "Explain common cyberattacks, including poisoned web-service attacks and network-infrastructure poisoning.", "m": 5, "p": "Medium", "ty": "Classification", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Common cyberattacks:<\/strong> malware (virus, worm, Trojan, spyware) · <strong>ransomware<\/strong> · <strong>phishing<\/strong> (spear phishing, whaling, smishing, vishing) · <strong>DoS/DDoS<\/strong> · <strong>man-in-the-middle<\/strong> · <strong>SQL injection<\/strong> and <strong>cross-site scripting (XSS)<\/strong> · password attacks (brute force, credential stuffing) · zero-day exploits · botnets · data destruction · insider attacks.<\/p>\n<p><strong>Poisoned web-service attacks:<\/strong> attackers compromise a legitimate website or web service, or create a malicious look-alike, so that visitors are served malware or manipulated content — <strong>watering-hole attacks<\/strong>, malvertising, compromised third-party scripts, poisoned search results (SEO poisoning), poisoned software updates.<\/p>\n<p><strong>Network-infrastructure poisoning:<\/strong> corrupting the infrastructure that directs traffic:<\/p>\n<ul>\n<li><strong>DNS poisoning (cache poisoning):<\/strong> false DNS records send users to fake sites.<\/li>\n<li><strong>ARP spoofing/poisoning:<\/strong> links an attacker's MAC address to a legitimate IP on a LAN to intercept traffic.<\/li>\n<li><strong>BGP hijacking:<\/strong> false routing announcements divert Internet traffic.<\/li>\n<li>Rogue Wi-Fi access points.<\/li>\n<\/ul>\n<p><strong>Technical attack techniques:<\/strong> malware, social engineering, exploiting vulnerabilities, brute-force, session hijacking, advanced persistent threats (APT).<\/p>"}, {"id": "IT246-15", "t": "Hackers' coloured hats", "u": 5, "q": "Who are white-hat hackers? Explain cyberattackers and their coloured hats.", "m": 3, "p": "High", "ty": "Classification", "seen": {"M": "A5"}, "rep": false, "src": "TU model question A5", "a": "<table>\n<thead>\n<tr>\n<th>Hat<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>White hat<\/strong><\/td>\n<td>Ethical hackers who test systems <strong>with permission<\/strong> to find and fix vulnerabilities (penetration testers, bug-bounty hunters)<\/td>\n<\/tr>\n<tr>\n<td><strong>Black hat<\/strong><\/td>\n<td>Malicious hackers who break in illegally for profit, damage or theft<\/td>\n<\/tr>\n<tr>\n<td><strong>Grey hat<\/strong><\/td>\n<td>Hack without permission but without malicious intent; may disclose or ask a fee<\/td>\n<\/tr>\n<tr>\n<td><strong>Green hat<\/strong><\/td>\n<td>Novices learning to hack<\/td>\n<\/tr>\n<tr>\n<td><strong>Blue hat<\/strong><\/td>\n<td>Outside security testers hired to test before launch, or attackers seeking revenge<\/td>\n<\/tr>\n<tr>\n<td><strong>Red hat<\/strong><\/td>\n<td>Vigilantes who attack black-hat hackers<\/td>\n<\/tr>\n<tr>\n<td><strong>Other attackers:<\/strong> script kiddies, hacktivists, cybercriminals, nation-state actors, insiders, cyberterrorists.<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT246-16", "t": "Personal cybersecurity: home, mobile, IoT, physical, remote work, passwords", "u": 6, "q": "Why is physical security important? How can IoT devices pose personal cybersecurity risks? Explain securing accounts and passwords.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "A6, B16"}, "rep": false, "src": "TU model question A6, B16", "a": "<p><strong>Physical security<\/strong> matters because anyone with physical access can steal or tamper with devices, install keyloggers, copy data or bypass software controls — \"if someone can touch it, they can own it\". Measures: locking devices and rooms, screen locks, device encryption, not leaving laptops unattended, secure disposal, shoulder-surfing awareness.<\/p>\n<p><strong>IoT risks to personal cybersecurity:<\/strong> default or weak passwords · no or rare security updates · insecure communication (unencrypted data) · always-listening cameras and smart speakers (privacy invasion) · devices recruited into <strong>botnets<\/strong> (e.g. Mirai) · an entry point into the home network to attack laptops and phones · data collection by manufacturers.\n<strong>Mitigation:<\/strong> change default passwords, update firmware, put IoT on a separate guest network, disable unused features, buy reputable brands.<\/p>\n<p><strong>Home computers and mobile devices:<\/strong> OS and app updates, antivirus, firewall, backups, app-store-only installs, device encryption, remote wipe.\n<strong>Remote-work security:<\/strong> VPN, secure Wi-Fi (WPA2/WPA3), company-managed devices, MFA, avoid public Wi-Fi.<\/p>\n<p><strong>Securing accounts and passwords:<\/strong> long, unique passphrases for every account · <strong>password manager<\/strong> · <strong>multi-factor authentication (MFA)<\/strong> · never share passwords · watch for phishing · check breach notifications (haveibeenpwned) · secure account-recovery options.<\/p>"}, {"id": "IT246-17", "t": "Social engineering: definition, threat, trust building, prevention", "u": 7, "q": "Define social engineering and explain why it is a major cybersecurity threat. Explain how attackers build trust and how such attacks can be prevented.", "m": 5, "p": "High", "ty": "Long answer", "seen": {"M": "A7, B14, C17"}, "rep": false, "src": "TU model question A7, B14, C17", "a": "<p><strong>Social engineering<\/strong> is the manipulation of people into revealing confidential information or performing actions (clicking a link, transferring money) that compromise security — it exploits <strong>human psychology rather than technical flaws<\/strong>.<\/p>\n<p><strong>Why it is a major threat:<\/strong> humans are the weakest link; it bypasses firewalls and encryption; it is cheap and scalable (mass phishing); it is hard to detect; it is the entry point of most breaches (credential theft, ransomware); it targets everyone, from staff to executives.<\/p>\n<p><strong>Motives:<\/strong> financial gain, data theft, espionage, revenge, access for further attacks.<\/p>\n<p><strong>Attack life cycle:<\/strong> research the target (OSINT, social media) → <strong>build trust<\/strong> → <strong>exploit the relationship<\/strong> → <strong>execute the attack<\/strong> → exit without detection.<\/p>\n<p><strong>Building trust (techniques):<\/strong> impersonating authority (boss, IT support, bank, police) · using insider details gathered from social media for credibility · creating urgency or fear (\"your account will be blocked\") · reciprocity (offering help or gifts first) · liking and friendliness · social proof (\"your colleagues already did this\") · pretexting (a believable story) · spoofed emails/caller IDs and look-alike websites.<\/p>\n<p><strong>Types:<\/strong> phishing, spear phishing, whaling, vishing, smishing, pretexting, baiting (infected USB), quid pro quo, tailgating/piggybacking, business email compromise.<\/p>\n<p><strong>Prevention / countermeasures:<\/strong> security-awareness training and phishing simulations · verify requests through a separate channel · policies for money transfers and password resets · MFA · email filtering, SPF/DKIM/DMARC · limit information shared publicly · physical-access controls (badges, no tailgating) · encourage reporting without blame.<\/p>"}, {"id": "IT246-18", "t": "Cyber terrorism: types, effects on infrastructure, countering", "u": 7, "q": "Describe the effects and types of cyber terrorism. Explain strategies for countering it.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "?"}, "rep": false, "src": "2025 exam (fragments) ?", "a": "<p><strong>Cyber terrorism<\/strong> is the use of computers and networks by terrorist groups or politically motivated actors to cause fear, disruption or physical harm, or to intimidate governments and societies.<\/p>\n<p><strong>Types / forms<\/strong><\/p>\n<ol>\n<li><strong>Attacks on critical infrastructure<\/strong> — power grids, water supply, transport, telecom, financial systems (e.g. through SCADA/ICS malware).<\/li>\n<li><strong>Disruptive attacks<\/strong> — DDoS on government and banking websites.<\/li>\n<li><strong>Destructive attacks<\/strong> — data-wiping malware, ransomware on hospitals.<\/li>\n<li><strong>Website defacement and propaganda<\/strong> — spreading fear and ideology.<\/li>\n<li><strong>Cyber espionage<\/strong> for planning attacks.<\/li>\n<li><strong>Use of the Internet for recruitment, financing, communication and training.<\/strong><\/li>\n<li><strong>Disinformation campaigns.<\/strong><\/li>\n<\/ol>\n<p><strong>Effects<\/strong><\/p>\n<ul>\n<li>Disruption of essential services (electricity, water, healthcare, payments).<\/li>\n<li>Economic losses and market instability.<\/li>\n<li>Loss of life or physical damage when industrial systems are manipulated.<\/li>\n<li>Public fear and loss of confidence in government.<\/li>\n<li>Threat to national security and sovereignty.<\/li>\n<li>Data theft and privacy violations.<\/li>\n<\/ul>\n<p><strong>Countering cyber terrorism<\/strong><\/p>\n<ol>\n<li><strong>National cybersecurity policy and strategy<\/strong> (Nepal: National Cyber Security Policy, 2023) and a national CERT/CSIRT.<\/li>\n<li><strong>Protecting critical infrastructure<\/strong> — segmentation of ICS networks, monitoring, redundancy, regular audits.<\/li>\n<li><strong>Strong legal framework<\/strong> and enforcement (Electronic Transactions Act; specialised police units such as Nepal Police Cyber Bureau).<\/li>\n<li><strong>International cooperation<\/strong> — information sharing, extradition, treaties (e.g. Budapest Convention).<\/li>\n<li><strong>Threat intelligence and early warning.<\/strong><\/li>\n<li><strong>Public–private partnership<\/strong> with telecoms, banks and ISPs.<\/li>\n<li><strong>Awareness and capacity building<\/strong> — training professionals, public education.<\/li>\n<li><strong>Incident-response and recovery plans<\/strong>, backups and drills.<\/li>\n<li><strong>Counter-propaganda<\/strong> and content takedown.<\/li>\n<\/ol>"}, {"id": "IT246-19", "t": "Digital forensics: stages, evidence, labs", "u": 8, "q": "Differentiate computer forensics and digital forensics. Explain the stages of digital forensics and the role of digital evidence.", "m": 5, "p": "High", "ty": "Process", "seen": {"M": "A8"}, "rep": false, "src": "TU model question A8", "a": "<p><strong>Computer forensics<\/strong> — investigation of computers and storage media. <strong>Digital forensics<\/strong> — the broader discipline covering all digital devices: computers, mobiles, networks, cloud, IoT, memory. Both aim to identify, preserve, analyse and present digital evidence in a legally acceptable manner.<\/p>\n<p><strong>Digital evidence:<\/strong> any information of probative value stored or transmitted in digital form — files, emails, logs, chat messages, browser history, metadata, deleted data, CCTV footage. <strong>Role:<\/strong> establishes facts of a crime, links suspects to actions (who, what, when, where), supports or refutes testimony, and is used in court. It must be <strong>authentic, reliable, complete and admissible<\/strong>, with an unbroken <strong>chain of custody<\/strong>.<\/p>\n<p><strong>Stages (forensic process)<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 354\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Identification<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Preservation / collection<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Examination<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Analysis<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Documentation &amp; reporting<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Presentation in court<\/text><\/svg><\/div>\n\n<ol>\n<li><strong>Identification<\/strong> of potential evidence sources.<\/li>\n<li><strong>Collection and preservation<\/strong> — seize devices, create forensic images (bit-stream copies) with write blockers, compute <strong>hash values (MD5/SHA-256)<\/strong> to prove integrity, maintain chain of custody.<\/li>\n<li><strong>Examination<\/strong> — extract data, recover deleted files, decrypt.<\/li>\n<li><strong>Analysis<\/strong> — reconstruct events, timelines, link evidence.<\/li>\n<li><strong>Reporting<\/strong> — document methods and findings.<\/li>\n<li><strong>Presentation<\/strong> — expert testimony.<\/li>\n<\/ol>\n<p><strong>Forensic labs and tools:<\/strong> controlled environment, write blockers, imaging hardware; software such as EnCase, FTK, Autopsy/Sleuth Kit, Cellebrite (mobile), Volatility (memory).<\/p>"}, {"id": "IT246-20", "t": "IP laws + cyber regulation; handling digital evidence; challenges", "u": 8, "q": "Explain how IP laws and cybersecurity regulations work together to prevent cybercrime, the key methods of handling digital evidence, and the challenges involved.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M": "D21"}, "rep": false, "src": "TU model question D21", "a": "<p><strong>1. IP laws and cybersecurity regulations working together<\/strong><\/p>\n<ul>\n<li><strong>IP laws<\/strong> (copyright, patent, trademark, trade-secret laws; in Nepal the Copyright Act 2059 and the Patent, Design and Trademark Act 2022 BS) define <strong>ownership<\/strong> and make <strong>piracy, counterfeiting, cybersquatting and theft of trade secrets<\/strong> illegal, with civil and criminal remedies.<\/li>\n<li><strong>Cybersecurity regulations<\/strong> (the Electronic Transactions Act 2063 in Nepal, data-protection laws, sector rules such as NRB IT guidelines for banks) make <strong>unauthorised access, hacking, data theft and damage to systems<\/strong> offences, and require organisations to implement security controls and report incidents.<\/li>\n<li><strong>Together:<\/strong> IP law protects the <em>value<\/em> of digital assets; cyber law protects the <em>systems and data<\/em> that hold them. Stealing source code by hacking violates both. Security obligations (access control, encryption) also count as the \"reasonable measures\" needed for trade-secret protection. Legal deterrence plus technical prevention reduces cybercrime, and both depend on sound digital evidence for enforcement.<\/li>\n<\/ul>\n<p><strong>2. Key methods of handling digital evidence<\/strong><\/p>\n<ul>\n<li><strong>Secure the scene<\/strong> and identify devices (including volatile memory).<\/li>\n<li><strong>Live acquisition<\/strong> of volatile data (RAM, running processes) before shutdown where needed.<\/li>\n<li><strong>Forensic imaging<\/strong> with <strong>write blockers<\/strong>; never work on the original.<\/li>\n<li><strong>Hashing<\/strong> (SHA-256/MD5) before and after to prove integrity.<\/li>\n<li><strong>Chain-of-custody documentation<\/strong> — who handled the evidence, when and why.<\/li>\n<li><strong>Proper packaging and storage<\/strong> — anti-static bags, Faraday bags for mobiles, secure lockers.<\/li>\n<li><strong>Validated tools and documented procedures<\/strong> (ISO/IEC 27037 guidelines).<\/li>\n<li><strong>Legal authority<\/strong> — warrants/consent; respect privacy.<\/li>\n<li><strong>Detailed reporting<\/strong> for court.<\/li>\n<\/ul>\n<p><strong>3. Challenges<\/strong><\/p>\n<ul>\n<li><strong>Encryption<\/strong> and password-protected devices.<\/li>\n<li><strong>Volume<\/strong> of data and variety of devices (IoT, cloud).<\/li>\n<li><strong>Cloud and cross-border data<\/strong> — jurisdiction and slow mutual legal assistance.<\/li>\n<li><strong>Anti-forensics<\/strong> — data wiping, steganography, log tampering.<\/li>\n<li><strong>Volatile, easily altered evidence.<\/strong><\/li>\n<li><strong>Rapidly changing technology<\/strong> and tool costs.<\/li>\n<li><strong>Shortage of trained examiners and accredited labs<\/strong> (a major issue in Nepal).<\/li>\n<li><strong>Legal gaps<\/strong> — outdated laws, admissibility standards, privacy concerns.<\/li>\n<\/ul>"}, {"id": "IT246-21", "t": "Data recovery; mobile forensics; legal aspects; cyber forensics in Nepal", "u": 8, "q": "Explain data recovery, mobile forensics, the legal aspects of digital forensics and the status of cyber forensics in Nepal.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "?"}, "rep": false, "src": "2025 exam (fragments) ?", "a": "<p><strong>Data recovery:<\/strong> retrieving deleted, corrupted or hidden data — undelete from file-system metadata, file carving (signatures), recovery from slack space, unallocated space, damaged media and backups.\n<strong>Mobile forensics:<\/strong> extraction of call logs, SMS, contacts, app data (WhatsApp, Viber), GPS locations and photos from phones — logical, file-system and physical extraction; challenges: encryption, many models/OS versions, remote wipe (use Faraday bags).\n<strong>Legal aspects:<\/strong> lawful seizure (warrant/consent), chain of custody, admissibility and authenticity of electronic records (the Electronic Transactions Act gives legal recognition to electronic records and digital signatures), expert testimony, privacy rights.<\/p>\n<p><strong>Cyber forensics in Nepal<\/strong><\/p>\n<ul>\n<li><strong>Nepal Police Cyber Bureau<\/strong> (established 2018) investigates cybercrime; the Central Police Forensic Science Laboratory handles digital forensics.<\/li>\n<li>Cases are prosecuted under the <strong>Electronic Transactions Act 2063<\/strong> and related laws (e.g. Muluki Criminal Code for some offences).<\/li>\n<li><strong>Gaps:<\/strong> limited accredited labs and trained experts, lack of standard operating procedures and procedural rigour, slow cross-border cooperation with foreign platforms, outdated laws relative to new crimes, and low awareness among the judiciary and public.<\/li>\n<\/ul>"}, {"id": "IT246-22", "t": "Cyber law in Nepal: ETA, Rules, IT policy; legal perspective of cybercrime", "u": 9, "q": "Define cyber law. Describe the legal perspective of cybercrime in Nepal and the significance (purpose) of the Electronic Transaction Act. What is the current state of cyber law in Nepal?", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "A?, A?, C?", "M": "A9, C19"}, "rep": true, "src": "2025 exam (fragments) A?, A?, C?; TU model question A9, C19", "a": "<p><strong>Cyber law<\/strong> is the body of law governing activities in cyberspace — electronic transactions, digital signatures, data protection, intellectual property online and cybercrime.<\/p>\n<p><strong>Legal perspective of cybercrime:<\/strong> a <strong>cybercrime<\/strong> is an unlawful act in which a computer or network is the <strong>tool<\/strong>, the <strong>target<\/strong> or <strong>incidental<\/strong> to the offence. Common cybercrimes addressed under Nepalese law include: unauthorised access (hacking) · damage to computers or information systems (viruses, malware) · piracy, destruction or alteration of computer source code · publication of illegal or objectionable material in electronic form (defamation, obscenity, hate) · breach of confidentiality · computer fraud and identity theft · online harassment/cyberbullying · phishing and financial fraud.<\/p>\n<p><strong>Electronic Transactions Act, 2063 (2008) — purpose / significance<\/strong><\/p>\n<ol>\n<li><strong>Legal recognition<\/strong> of electronic records and <strong>digital signatures<\/strong>, equal to paper documents and handwritten signatures.<\/li>\n<li>Framework for <strong>e-commerce and e-governance<\/strong>.<\/li>\n<li><strong>Certifying authorities<\/strong> and the Office of the Controller of Certification to issue and regulate digital certificates.<\/li>\n<li>Defines <strong>computer-related offences<\/strong> and penalties, deterring cybercrime.<\/li>\n<li>Provides for an <strong>Information Technology Tribunal<\/strong> (adjudication) and appellate mechanism.<\/li>\n<li>Rules on retention of electronic records, network-service providers' responsibilities.\n<strong>Electronic Transactions Rules, 2064<\/strong> operationalise the Act (certifying authorities, licensing, procedures).<\/li>\n<\/ol>\n<p><strong>IT Policy framework:<\/strong> IT Policy 2057/2067, <strong>National ICT Policy 2072 (2015)<\/strong>, <strong>Digital Nepal Framework (2019)<\/strong>, <strong>National Cyber Security Policy (2023)<\/strong>; the Individual Privacy Act 2075 and sector directives (NRB IT guidelines).\n<strong>Information-security policies<\/strong> (organisational): acceptable-use, access-control, password, backup, incident-response and data-classification policies — implement the CIA triad.<\/p>\n<p><strong>Current state of cyber law in Nepal<\/strong><\/p>\n<ul>\n<li>The <strong>ETA 2063 is the main law<\/strong> but is old; it does not adequately cover newer threats (ransomware, cryptocurrency fraud, deepfakes, large data breaches, social-media crimes).<\/li>\n<li>The broadly worded offence on publishing illegal material in electronic form has been <strong>criticised for misuse<\/strong> against free expression on social media.<\/li>\n<li>Replacement legislation (an Information Technology / Cyber Security bill) has been <strong>debated for years<\/strong> but, as of the latest information available here, the ETA remains the primary statute — <strong>check the current status before the exam<\/strong>.<\/li>\n<li><strong>Institutions:<\/strong> Nepal Police Cyber Bureau, Nepal Telecommunications Authority, NRB, the IT Tribunal, Department of Information Technology; a national CERT capacity is being developed.<\/li>\n<li><strong>Challenges:<\/strong> weak enforcement capacity, shortage of forensic experts, jurisdiction over foreign platforms, low awareness, slow courts.<\/li>\n<li><strong>Way forward:<\/strong> comprehensive cyber-security and data-protection law, institutional capacity, international cooperation (e.g. joining conventions), public awareness.<\/li>\n<\/ul>"}], "defs": [["Ethics", "Beliefs about right and wrong behaviour in a society."], ["CSR", "Organisation's responsibility for its impact on society and environment."], ["Professionalism", "Competent, accountable, ethical conduct in a profession."], ["Acceptable Use Policy", "Rules on permitted use of organisational IT resources."], ["Intellectual property", "Creations of the mind protected by law."], ["Copyright", "Exclusive right over original expression of works."], ["Patent", "Exclusive right over a new, non-obvious invention."], ["Trade secret", "Confidential business information with economic value."], ["Cybersquatting", "Bad-faith registration of domain names matching trademarks."], ["Contingent worker", "Temporary or contract worker without long-term employment."], ["Whistle-blowing", "Exposing illegal or unethical acts of an organisation in the public interest."], ["Green computing", "Environmentally responsible use and disposal of IT."], ["Cybersecurity", "Protection of systems, networks and data from digital attacks."], ["White-hat hacker", "Ethical hacker who tests systems with permission."], ["Social engineering", "Manipulating people to divulge information or take unsafe actions."], ["Cyber terrorism", "Politically motivated use of cyberattacks to cause fear or harm."], ["Digital evidence", "Information of probative value stored or transmitted digitally."], ["Chain of custody", "Documented record of evidence handling."], ["Cyber law", "Law governing activities in cyberspace."], ["Electronic Transactions Act 2063", "Nepal's main law recognising e-records/digital signatures and defining computer offences."]], "revision": "<p><strong>IT 246 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> ethics vs law table · importance of business ethics (goodwill, consistency, good practices, legal protection, publicity) · CSR · 7 ways to improve ethics · decision-making steps.<\/li>\n<li><strong>U2:<\/strong> professional; worker relationships (employer, client, supplier, peers, users, society) · codes/certification · user issues (piracy, misuse, sharing) · AUP measures · privacy, anonymity, social-networking ethics; Individual Privacy Act 2075.<\/li>\n<li><strong>U3:<\/strong> IP · copyright vs patent table · trade secrets + NDAs · trademark infringement, cybersquatting (UDRP) · plagiarism, reverse engineering, open source, competitive intelligence.<\/li>\n<li><strong>U4:<\/strong> software quality strategies (testing, CMMI, ISO 9001) · contingent workers concern · outsourcing issues · whistle-blowing steps · green computing across the SDLC.<\/li>\n<li><strong>U5:<\/strong> cyberspace, CIA · risks mitigated · economic-model shifts · attacks (phishing, ransomware, DDoS, SQLi, XSS, MITM) · poisoned web service, DNS/ARP/BGP poisoning · hats · outsourcing-breach scenario (risks + mitigations).<\/li>\n<li><strong>U6:<\/strong> physical security · IoT risks · home/mobile/remote · passwords, MFA, password manager.<\/li>\n<li><strong>U7:<\/strong> social engineering cycle, trust techniques, types, countermeasures · cyber terrorism types, effects, countering.<\/li>\n<li><strong>U8:<\/strong> computer vs digital forensics · stages · evidence handling (imaging, write blocker, hash, chain of custody) · data recovery, mobile forensics · legal aspects · Nepal: Cyber Bureau 2018, gaps.<\/li>\n<li><strong>U9:<\/strong> cyber law definition · cybercrime types · ETA 2063 purposes · ETR 2064 · ICT Policy 2072, Digital Nepal, Cyber Security Policy 2023 · current state and criticisms.<\/li>\n<\/ul>", "practice": ["[AI practice] Differentiate ethics and morals. (1)", "[AI practice] Explain the ACM/IEEE code of ethics for software engineers. (5)", "[AI practice] Explain DNS cache poisoning with a diagram. (3)", "[AI practice] Explain the steps a whistle-blower should follow. (5)", "[AI practice] Case: An employee of a Nepali bank received a call from 'IT support' and shared her OTP, leading to fraud. Analyse the attack, the legal provisions applicable and preventive measures. (10)"], "checklist": ["Compare ethics and law", "Explain importance of business ethics with example", "Explain CSR and ways to improve ethics", "Explain IT-worker relationships", "List AUP measures", "Compare copyright and patent", "Explain trade secrets, trademark infringement, cybersquatting", "Explain contingent workers, outsourcing, whistle-blowing", "Explain green computing in the SDLC", "Explain risks cybersecurity mitigates + outsourcing scenario", "Classify hackers' hats", "Explain IoT risks and password security", "Explain social engineering and trust building", "Explain cyber terrorism and countermeasures", "Explain forensic stages and evidence handling", "Explain ETA 2063 and the state of cyber law in Nepal"], "sources": [["TU FOM — BIM 6th Semester Syllabus 2024", "https://www.fomecd.edu.np/syllabuses/BIM%206th%20Semester%20Syllabus%202024.pdf"], ["bimstudies — IT 246 Model Question Solution (TU model)", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/it-ethics-and-cybersecurity-model-question-solution-bitm-6th-sem/"], ["bimstudies — IT 246 Exam Question Solution 2025 (page did not load; fragments from search)", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/it-ethics-and-cybersecurity-exam-question-solution-bitm-6th-sem-2025/"], ["Nepal Law Commission — Electronic Transactions Act 2063 and other Acts (verify sections)", "https://lawcommission.gov.np"], ["Reynolds, G. — Ethics in Information Technology (6th ed.) — prescribed text", "—"]], "extra": "", "extra_title": "Formulas and worked examples"}], "reports": {"key": "<ol>\n<li><strong>All 12 course codes and titles were verified<\/strong> against TU FOM's official NC syllabi: <em>BIM 6th Semester Syllabus 2024<\/em> (dated October 2024) and <em>BIM 8th Semester Syllabus 2025<\/em> (dated November 2025). No newer revision of either document was found, so these are treated as the applicable versions for December 2026.<\/li>\n<li><strong>One title discrepancy:<\/strong> your routine says <em>\"Business Environment in Nepal\"<\/em> for MGT 236. The official NC title is <strong>\"Business Environment\"<\/strong>. \"Business Environment in Nepal\" was the <strong>old-course<\/strong> title (MGT 206). The code MGT 236 is the NC course, so the materials follow the NC syllabus.<\/li>\n<li><strong>8th semester = first-ever sitting.<\/strong> TU's <em>Model Question 2026<\/em> for 8th-semester BIM is marked <em>\"Only for 2021 AD admitted — Regular\"<\/em>, and the 8th-semester NC syllabus was issued in November 2025. <strong>No real NC past papers exist<\/strong> for IT 248, 249, 250, 275, 276, 277 or 278. Official model questions exist for six of them; <strong>IT 250 has none<\/strong>.<\/li>\n<li><strong>6th semester:<\/strong> NC exams were held in <strong>April 2025<\/strong> and <strong>December 2025<\/strong>. April 2025 papers were found (complete for MGT 236, RCH 201 and IT 245; partial for FIN 229; fragments for IT 246). <strong>No December 2025 NC paper could be found<\/strong> for any subject.<\/li>\n<li><strong>TU reuses model-question concepts.<\/strong> In RCH 201 and IT 245, a large share of the April 2025 questions repeat concepts from TU's model questions (some almost word for word). This is the main reason the 8th-semester guides lean on the 2026 model papers.<\/li>\n<li><strong>Electives:<\/strong> IT 275 / 276 / 277 / 278 are alternatives for <em>Elective II<\/em> — students normally sit <strong>one<\/strong>. The routine puts IT 275 and IT 276 on 8 Dec and IT 277 and IT 278 on 10 Dec. Guides for all four are included as you asked; the revision plan assumes you sit one.<\/li>\n<li><strong>Routine image:<\/strong> only your text prompt was attached, not the routine image. The dates and codes you transcribed were used and cross-checked against the syllabi.<\/li>\n<li><strong>Wording caveat:<\/strong> past-paper and model questions were retrieved through a text-extraction tool, which keeps meaning and marks but may change a word here and there. Check the source PDF if exact wording matters.<\/li>\n<\/ol>", "syl": "<table><tr><th>Sem<\/th><th>Code<\/th><th>Routine title<\/th><th>Official title<\/th><th>Applicable syllabus<\/th><th>Size<\/th><th>Verification note<\/th><\/tr><tr><td>8<\/td><td><b>IT 248<\/b><\/td><td>IT Entrepreneurship and Management<\/td><td>IT 248: IT Entrepreneurship and Management (syllabus); printed as &#x27;IT 248: Entrepreneurship and Management&#x27; on the TU Model Question 2026<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, Office of the Dean, dated November 2025) — 3 credit hours, 48 lecture hours<\/td><td>6 units / 48 LH<\/td><td>Routine and syllabus agree on code IT 248. The TU Model Question 2026 header drops the word &#x27;IT&#x27; (&#x27;Entrepreneurship and Management&#x27;). Same course; no action needed.<\/td><\/tr><tr><td>6<\/td><td><b>MGT 236<\/b><\/td><td>Business Environment in Nepal<\/td><td>MGT 236: Business Environment (official NC title in the BIM 6th Semester Syllabus 2024)<\/td><td>BIM 6th Semester Syllabus 2024 (TU FOM, Office of the Dean, dated October 2024) — 3 credit hours, 48 LH. Shared with BBM 6th semester (MGT 236).<\/td><td>8 units / 48 LH<\/td><td>DISCREPANCY: your routine says &#x27;Business Environment in Nepal&#x27;. In the official NC syllabus and on the April 2025 NC paper the title is &#x27;MGT 236: Business Environment&#x27;. &#x27;Business Environment in Nepal&#x27; is the OLD-COURSE title (MGT 206); the TU Dec-2025 routine lists &#x27;MGT 206 (OC) Business Environment in Nepal / MGT 236 (NC) Business Environment&#x27;. The code MGT 236 is correct for NC, and this guide follows the NC syllabus.<\/td><\/tr><tr><td>8<\/td><td><b>IT 250<\/b><\/td><td>Digital Economy<\/td><td>IT 250: Digital Economy<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, dated November 2025) — 3 credit hours, 48 LH<\/td><td>6 units / 48 LH<\/td><td>Code and title match the routine and syllabus. No discrepancy.<\/td><\/tr><tr><td>6<\/td><td><b>FIN 229<\/b><\/td><td>Fundamentals of Corporate Finance<\/td><td>FIN 229: Fundamentals of Corporate Finance<\/td><td>BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH<\/td><td>9 units / 48 LH<\/td><td>Matches routine. Note: the OC equivalent is FIN 201 Business Finance (the TU Dec-2025 routine shows &#x27;FIN 201 (OC) / FIN 229 (NC)&#x27;). FIN 201 papers were NOT used.<\/td><\/tr><tr><td>8<\/td><td><b>IT 249<\/b><\/td><td>Business Intelligence<\/td><td>IT 249: Business Intelligence<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — 3 credit hours, 48 LH, with laboratory work<\/td><td>6 units / 48 LH<\/td><td>Matches routine. No discrepancy.<\/td><\/tr><tr><td>6<\/td><td><b>RCH 201<\/b><\/td><td>Business Research Methods<\/td><td>RCH 201: Business Research Methods (common to BBA/BIM 6th semester)<\/td><td>BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH<\/td><td>6 units / 48 LH<\/td><td>Matches routine. The April 2025 paper header reads &#x27;BBA / BIM, Sixth Semester, RCH 201&#x27; — the same paper serves both programmes.<\/td><\/tr><tr><td>8<\/td><td><b>IT 275<\/b><\/td><td>.NET Programming<\/td><td>IT 275: .NET Programming (cover list) — written &#x27;Dot Net Programming&#x27; in the course-detail page; Elective II<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, with laboratory work<\/td><td>6 units / 48 LH<\/td><td>Same course under two spellings (&#x27;.NET&#x27; / &#x27;Dot Net&#x27;). IMPORTANT: IT 275–278 are alternatives for Elective II. Students normally sit only ONE of them, and IT 275 shares 8 Dec 2026 with IT 276. Confirm which elective you are registered for.<\/td><\/tr><tr><td>8<\/td><td><b>IT 276<\/b><\/td><td>Database Administration<\/td><td>IT 276: Database Administration (Elective II, Oracle-based)<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, laboratory on all topics<\/td><td>8 units / 48 LH<\/td><td>Matches routine. IT 276 shares 8 Dec 2026 with IT 275; both are Elective II options — you would normally sit only one.<\/td><\/tr><tr><td>6<\/td><td><b>IT 245<\/b><\/td><td>Business Information Systems<\/td><td>IT 245: Business Information Systems<\/td><td>BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH, with lab (Big Data, analytics tools, cloud)<\/td><td>9 units / 48 LH<\/td><td>Matches routine. OC counterpart on the same exam day in Dec 2025 was IT 224 Software Engineering — not used.<\/td><\/tr><tr><td>8<\/td><td><b>IT 277<\/b><\/td><td>Cloud Computing<\/td><td>IT 277: Cloud Computing (Elective II)<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, with lab<\/td><td>7 units / 48 LH<\/td><td>Matches routine. IT 277 shares 10 Dec 2026 with IT 278 — both are Elective II options.<\/td><\/tr><tr><td>8<\/td><td><b>IT 278<\/b><\/td><td>Big Data and Analytics<\/td><td>IT 278: Big Data and Analytics (Elective II)<\/td><td>BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, lab with Hadoop and a NoSQL database<\/td><td>6 units / 48 LH<\/td><td>Matches routine. IT 278 shares 10 Dec 2026 with IT 277 — both are Elective II options.<\/td><\/tr><tr><td>6<\/td><td><b>IT 246<\/b><\/td><td>IT Ethics and Cybersecurity<\/td><td>IT 246: IT Ethics and Cybersecurity<\/td><td>BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH, with lab (scanning, SQLi/XSS, SET phishing, password cracking, firewalls, incident response)<\/td><td>9 units / 48 LH<\/td><td>Matches routine. OLD-COURSE WARNING: a repository lists &#x27;IT-ethics-and-cybersecurity-2022/2023&#x27; pages that are actually IT 225 Computer Security and Cyber Law (OC, 40 marks). They were deliberately EXCLUDED.<\/td><\/tr><\/table><h2>Unit lists<\/h2><h3>IT 248 — IT Entrepreneurship and Management<\/h3><ol><li><b>Foundations of Entrepreneurship<\/b> (6 LH): <span class=\"small\">Definition and importance of entrepreneurship; types of entrepreneurs and traits of successful entrepreneurs; entrepreneurship ecosystem; role of ICT in entrepreneurship; case: e-Sewa or Khalti and their impact on fintech.<\/span><\/li><li><b>Idea Generation and Market Research<\/b> (10 LH): <span class=\"small\">Creative thinking techniques; identifying market needs; evaluating business ideas; analysing technology trends; prototype development; target market; competitor analysis tools; consumer behaviour; case: Pathao&#x27;s market entry and adaptation in Nepal.<\/span><\/li><li><b>Business Model Development and Business Planning<\/b> (10 LH): <span class=\"small\">Business Model Canvas; revenue streams and cost structure; sustainable business models; elements of a business plan; financial projections, marketing strategy, operations plan; risk management; case: business plans of emerging Nepali tech startups.<\/span><\/li><li><b>Legal and Regulatory Framework<\/b> (6 LH): <span class=\"small\">Nepali business laws for startups; intellectual property rights; licences and permits; basic business taxation; labour law compliance; case: legal challenges of Nepali IT startups.<\/span><\/li><li><b>Financial Management and Marketing for Startups<\/b> (10 LH): <span class=\"small\">Startup funding sources; budgeting; cash-flow management; financial reporting requirements; marketing strategy and digital marketing; sales techniques; CRM; brand building; case: MakeMyTrip&#x27;s marketing.<\/span><\/li><li><b>Leadership and Corporate Social Responsibility<\/b> (6 LH): <span class=\"small\">Leadership styles in entrepreneurship; building and motivating teams; conflict resolution; networking; CSR; sustainability and ethical marketing; case: Tata Group CSR.<\/span><\/li><\/ol><h3>MGT 236 — Business Environment in Nepal<\/h3><ol><li><b>Introduction and Framework of Business Environment<\/b> (4 LH): <span class=\"small\">Components and classification of business environment; framework; environmental scanning — process, techniques, methods, types; emerging business environment in Nepal.<\/span><\/li><li><b>Firm-specific Environment<\/b> (4 LH): <span class=\"small\">Scope; organisational structure and culture; role of culture in behaviour and performance; cultural alignment; operations management (production, capacity planning, supply chain and logistics, quality management); HRM.<\/span><\/li><li><b>(Unit 3a) Macroeconomic Environment<\/b> (12 LH): <span class=\"small\">Economic dimensions of Nepal; employment and labour market; labour migration; development plans; performance of industry and agriculture; industrial, privatisation, trade, tourism and monetary policies; liberalisation and capital-market reforms; competitiveness; constitutional provisions on the economy.<\/span><\/li><li><b>(Unit 3b) Political-Legal Environment<\/b> (5 LH): <span class=\"small\">Political structure of Nepal; business–government relations at federal, provincial and local levels; political risk; laws on start-ups, market regulation and competition; labour, finance, investment, IP, e-business and consumer-protection legislation.<\/span><\/li><li><b>(Unit 3c) Socio-cultural Environment<\/b> (5 LH): <span class=\"small\">Changing marriage age; female education; family structure; social organisations; class structure; acculturation and assimilation; socio-cultural change and business impact.<\/span><\/li><li><b>(Unit 3d) Technology, Energy and Natural Environment<\/b> (4 LH): <span class=\"small\">Status of technology and technology transfer in Nepal; IT policy; natural-environment issues; energy situation; environment and energy management; AI and the future of business in Nepal.<\/span><\/li><li><b>(Unit 3e) Global Environment and Nepalese Business<\/b> (6 LH): <span class=\"small\">Regional groupings; SAARC, SAPTA, SAFTA, BIMSTEC and issues for Nepal; globalisation; FDI trends and reasons for low FDI; WTO membership.<\/span><\/li><li><b>(Unit 4) Business Support Agencies in Nepal<\/b> (8 LH): <span class=\"small\">Department of Industry; Nepal Rastra Bank; Nepal Chamber of Commerce; TEPC; FNCCI; SCIDB; Nepal Trade Information Portal; Ministry of Labour, Employment and Social Security; Ministry of Industry, Commerce and Supplies.<\/span><\/li><\/ol><h3>IT 250 — Digital Economy<\/h3><ol><li><b>Introduction<\/b> (8 LH): <span class=\"small\">Digital economics: concept, drivers, ecosystem; knowledge economy (K-economy): concept, drivers; digital economy vs K-economy; Fourth Industrial Revolution: drivers, opportunities, challenges; effects on sustainability, privacy, regulation and strategy.<\/span><\/li><li><b>Fundamentals of Digital Economy<\/b> (7 LH): <span class=\"small\">Multi-sided platforms; network effects; positive feedback; lock-in and switching costs; monopoly formation; Digital Adoption Index; OECD government digital adoption index.<\/span><\/li><li><b>Digital Markets, Strategy and Innovation<\/b> (10 LH): <span class=\"small\">Competition and cooperation; layered internet model; digital innovation; digital business models; value-creation models; modelling digital markets.<\/span><\/li><li><b>Digital Transformation<\/b> (8 LH): <span class=\"small\">Concept and drivers; digital transformation for SDGs; technological revolution in the world economy; globalisation and growth in the digital age; digital currencies: concept and types.<\/span><\/li><li><b>Economics of Information<\/b> (8 LH): <span class=\"small\">Asymmetric information: concept, determinants; asymmetric information and digitalisation; search engines and AI; strategy and the new economics of information; impact on consumer choice and labour markets; IP in a digital context.<\/span><\/li><li><b>Digitalisation in the Nepalese Perspective<\/b> (7 LH): <span class=\"small\">E-governance: concept, process, structure; e-governance in Nepal; digital financial inclusion in Nepal; opportunities and challenges of public-sector digital transformation; digital transformation and economic performance in trade, tourism, agriculture and SMEs.<\/span><\/li><\/ol><h3>FIN 229 — Fundamentals of Corporate Finance<\/h3><ol><li><b>Introduction to Corporate Finance<\/b> (4 LH): <span class=\"small\">Nature of corporate finance; functions of financial management; financial goal; responsibilities of the financial manager; relation with other functional areas.<\/span><\/li><li><b>Financial Instruments, Markets and Institutions<\/b> (4 LH): <span class=\"small\">Money-market and capital-market instruments; derivatives; mutual-fund units; functions and types of financial markets; depository and non-depository institutions.<\/span><\/li><li><b>Financial Statement Analysis<\/b> (6 LH): <span class=\"small\">Balance sheet, income statement, cash-flow statement, statement of shareholders&#x27; equity; framework; need for ratio analysis; liquidity, asset-management, debt, profitability and market-value ratios; DuPont analysis; limitations.<\/span><\/li><li><b>Time Value of Money<\/b> (6 LH): <span class=\"small\">Concept, timelines; FV and PV of single sums; solving for rate and time; ordinary annuity and annuity due; annuity payments; perpetuity; uneven cash flows; semi-annual and other compounding; amortisation schedule; applications.<\/span><\/li><li><b>Financial Assets Valuation<\/b> (8 LH): <span class=\"small\">Features of bonds, common and preferred stock; valuation models; bond valuation (perpetual, zero-coupon, finite, semi-annual); yields (current, capital gain, YTM, YTC); dividend discount models (zero, normal, super-normal growth); preferred-stock valuation.<\/span><\/li><li><b>Basics of Capital Budgeting<\/b> (6 LH): <span class=\"small\">Concept and process; project types; payback, discounted payback, NPV, PI, IRR, MIRR — merits and limitations.<\/span><\/li><li><b>Raising Capital<\/b> (5 LH): <span class=\"small\">Sources of long-term financing; long-term debt, preferred stock, common stock — pros and cons; public offering, rights offering, private placement.<\/span><\/li><li><b>Capital Structure and Leverage<\/b> (5 LH): <span class=\"small\">Concept; optimal capital structure; determinants; business vs financial risk; DOL, DFL, DTL.<\/span><\/li><li><b>Working Capital Management<\/b> (4 LH): <span class=\"small\">Concepts and types; factors affecting size; significance; operating cycle; cash conversion cycle; working-capital requirement.<\/span><\/li><\/ol><h3>IT 249 — Business Intelligence<\/h3><ol><li><b>Introduction to Business Intelligence<\/b> (5 LH): <span class=\"small\">Definition and scope of BI; role of BI in decision-making; overview of BI tools and technologies.<\/span><\/li><li><b>Data Warehousing<\/b> (8 LH): <span class=\"small\">Concepts and architecture; ETL processes; data modelling for BI.<\/span><\/li><li><b>Data Mining<\/b> (8 LH): <span class=\"small\">Concepts; data preprocessing; classification and clustering algorithms; association rule mining.<\/span><\/li><li><b>Data Visualization<\/b> (7 LH): <span class=\"small\">Principles of visualisation; tools and te
