M%20and%20BBM%208th%20Semester%20Final.pdf"], ["NIST SP 800-145 — The NIST Definition of Cloud Computing", "https://csrc.nist.gov/publications/detail/sp/800-145/final"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "IT 278", "id": "IT278", "title": "Big Data and Analytics", "sem": 8, "exam": "2026-12-10", "official": "IT 278: Big Data and Analytics (Elective II)", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, lab with Hadoop and a NoSQL database", "note": "Matches routine. IT 278 shares 10 Dec 2026 with IT 277 — both are Elective II options.", "marks": "Full Marks 60, Pass 30, 3 hrs (TU Model Question 2026). Group A 10×1 · Group B 5×3 (any 5 of 6) · Group C 3×5 (any 3 of 4) · Group D 2×10.", "objectives": "Introduce big-data concepts and technologies — Hadoop, NoSQL, data lakes — and their applications.", "units": [{"n": 1, "t": "Overview of Big Data", "lh": 5, "topics": "Introduction; types of data; evolution; characteristics; big data vs data warehouse; advantages, disadvantages, obstacles; impact."}, {"n": 2, "t": "Challenges of Big Data", "lh": 6, "topics": "Integration; storage; data quality; analysis; security and privacy; access and sharing."}, {"n": 3, "t": "Big Data Analytics", "lh": 6, "topics": "Introduction and applications; types of analytics; comparison of analytics stages."}, {"n": 4, "t": "Hadoop and NoSQL Databases", "lh": 14, "topics": "Hadoop introduction and ecosystem — storage, processing, access, management components; Apache Spark; NoSQL types — key-value, column-oriented, document, graph; BASE model; advantages and disadvantages."}, {"n": 5, "t": "Data Lakes", "lh": 7, "topics": "Introduction, architecture, usage, challenges; advantages/disadvantages; lakehouse; data warehouse vs data lake vs lakehouse; best practices."}, {"n": 6, "t": "Big Data Applications", "lh": 10, "topics": "Healthcare; fraud detection; social-media analytics; novel applications."}], "avail": "<p><strong>No actual NC paper exists<\/strong> (first sitting December 2026) — <strong>insufficient data<\/strong> for frequency. The <strong>TU Model Question 2026<\/strong> (Category C) is complete and drives the priorities.<\/p>", "pattern": "<p><strong>Model 2026:<\/strong> definitions (10) · compare/explain (6) · analytics types, data lakes, social media (4) · two 10-markers: <strong>NoSQL types with examples<\/strong> and <strong>big data in healthcare and fraud detection<\/strong>.<\/p>\n<p><strong>Unit spread:<\/strong> U1: 3 · U2: 2 · U3: 4 · U4: 5 (incl. a 10-marker) · U5: 5 · U6: 3 (incl. a 10-marker). <strong>Data lakes appear four times<\/strong> — learn the architecture, pros/cons and the DW/lake/lakehouse comparison thoroughly. Hadoop has the most lecture hours (14 LH) — know HDFS, YARN, MapReduce, Hive, Pig, HBase, Sqoop, Flume, ZooKeeper, Oozie and Spark.<\/p>", "papers": [{"id": "M26", "label": "TU Model Question 2026", "cat": "C", "session": "Model (2026)", "source": "TU FOM Model Question 2026", "url": "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf", "note": "Wording retrieved through a text-extraction tool; meaning and marks as printed.", "qs": [{"no": "1", "g": "A", "t": "Define big data.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "Mention the characteristics of big data.", "m": 1, "u": 1}, {"no": "3", "g": "A", "t": "What is big data integration?", "m": 1, "u": 2}, {"no": "4", "g": "A", "t": "Mention the steps of big data analysis.", "m": 1, "u": 3}, {"no": "5", "g": "A", "t": "Define big data analytics.", "m": 1, "u": 3}, {"no": "6", "g": "A", "t": "List Hadoop ecosystem components.", "m": 1, "u": 4}, {"no": "7", "g": "A", "t": "What are NoSQL databases?", "m": 1, "u": 4}, {"no": "8", "g": "A", "t": "What is a data lake?", "m": 1, "u": 5}, {"no": "9", "g": "A", "t": "What is a lakehouse?", "m": 1, "u": 5}, {"no": "10", "g": "A", "t": "Mention novel applications of big data.", "m": 1, "u": 6}, {"no": "11", "g": "B", "t": "Compare big data with a data warehouse; mention the benefits of big data.", "m": 3, "u": 1}, {"no": "12", "g": "B", "t": "How is big-data quality maintained?", "m": 3, "u": 2}, {"no": "13", "g": "B", "t": "Explain applications of big data analytics.", "m": 3, "u": 3}, {"no": "14", "g": "B", "t": "Explain Hadoop data-storage components.", "m": 3, "u": 4}, {"no": "15", "g": "B", "t": "Explain the advantages of NoSQL databases.", "m": 3, "u": 4}, {"no": "16", "g": "B", "t": "Explain data-lake architecture.", "m": 3, "u": 5}, {"no": "17", "g": "C", "t": "Explain the types of big data analytics.", "m": 5, "u": 3}, {"no": "18", "g": "C", "t": "Explain the advantages and disadvantages of data lakes.", "m": 5, "u": 5}, {"no": "19", "g": "C", "t": "Why are data lakes important, and how do they compare with data warehouses?", "m": 5, "u": 5}, {"no": "20", "g": "C", "t": "Explain big data analytics in social media.", "m": 5, "u": 6}, {"no": "21", "g": "D", "t": "Explain the types of NoSQL databases with an example of each.", "m": 10, "u": 4}, {"no": "22", "g": "D", "t": "Explain the use of big data in healthcare and fraud detection.", "m": 10, "u": 6}]}], "notes": {"1": "<p>Every day the world generates enormous amounts of data from phones, sensors, social media and transactions. Big data refers to these data sets and to the technologies needed to store and analyse them.<\/p>\n<h3>1.1 What is big data?<\/h3>\n<p><strong>Definitions<\/strong><\/p>\n<ul>\n<li><strong>Gartner:<\/strong> \"high-volume, high-velocity and/or high-variety information assets that demand cost-effective, innovative forms of information processing for enhanced insight and decision-making.\"<\/li>\n<li><strong>McKinsey:<\/strong> datasets whose size is beyond the ability of typical database software tools to capture, store, manage and analyse.<\/li>\n<\/ul>\n<h3>1.2 Types of data<\/h3>\n<p>Structured (tables), semi-structured (JSON, XML, logs), unstructured (text, images, audio, video). Sources: machine-generated (sensors, logs) and human-generated (social media, documents, transactions).<\/p>\n<h3>1.3 Evolution of big data<\/h3>\n<p>Manual records → relational databases (1970s) → data warehouses (1990s) → web-scale data and Google's GFS (2003) and MapReduce (2004) papers → Hadoop (2006) → NoSQL and cloud → Spark (in-memory, 2010s) → real-time streaming, data lakes, lakehouses and AI.<\/p>\n<h3>1.4 Characteristics of big data<\/h3>\n<p>Volume · Velocity · Variety · Veracity · Value · Variability (and sometimes Visualisation).<\/p>\n<h3>1.5 Big data vs data warehouses<\/h3>\n<p>Data types, schema-on-write vs schema-on-read, scale, cost, processing style, users and purpose (see comparison table in answers). They are complementary: many firms use both.<\/p>\n<h3>1.6 Advantages, disadvantages and obstacles<\/h3>\n<p>Advantages: better decisions, personalisation, efficiency, innovation, risk control. Disadvantages: privacy risks, cost, complexity, skills shortage. Obstacles: data quality, integration, governance, security, culture, regulation.<\/p>\n<h3>1.7 Impact of big data<\/h3>\n<p>On business (data-driven strategies), government (smart cities, policy), healthcare, science, and society (privacy, surveillance, jobs).<\/p>\n<p><strong>Key points:<\/strong> two definitions · data types · evolution timeline · Vs · big data vs DW · pros/cons/obstacles · impact.<\/p>", "2": "<p>Big data's size, speed and variety create serious practical problems. Organisations must solve them before they can extract value.<\/p>\n<h3>2.1 Integration<\/h3>\n<p>Combining data from many sources with different formats, schemas, speeds and semantics. Approaches: ETL/ELT pipelines, data virtualisation, ingestion tools (Sqoop, Flume, Kafka, NiFi), schema mapping, metadata catalogues, master data management.<\/p>\n<h3>2.2 Storage<\/h3>\n<p>Exponential growth needs scalable, fault-tolerant, low-cost storage: distributed file systems (HDFS), cloud object storage (S3, ADLS), NoSQL databases; compression, columnar formats (Parquet, ORC), tiering and lifecycle policies.<\/p>\n<h3>2.3 Data quality<\/h3>\n<p>Problems: incomplete, inaccurate, duplicate, inconsistent, outdated data. Dimensions: accuracy, completeness, consistency, timeliness, validity, uniqueness. Practices: profiling, validation at ingestion, cleansing, MDM, lineage, governance, monitoring.<\/p>\n<h3>2.4 Analysis<\/h3>\n<p>Need for distributed algorithms, real-time analytics, handling unstructured data (NLP, image analysis), scalable machine learning, and skilled data scientists; risk of false correlations.<\/p>\n<h3>2.5 Security and privacy<\/h3>\n<p>Protecting huge volumes of sensitive data: access control, encryption, anonymisation/pseudonymisation, auditing, compliance with privacy laws (e.g. GDPR; Nepal's Individual Privacy Act, 2075); securing distributed clusters (Kerberos, Ranger).<\/p>\n<h3>2.6 Access and sharing<\/h3>\n<p>Data silos, ownership, permissions, interoperability, data-sharing agreements, open data initiatives, governance frameworks.<\/p>\n<p><strong>Key points:<\/strong> six challenges with solutions · quality dimensions · security techniques.<\/p>", "3": "<p>Collecting big data is only useful if it is analysed to answer questions and guide action. Big data analytics covers the methods and stages of this analysis.<\/p>\n<h3>3.1 What is big data analytics? Introduction and applications<\/h3>\n<p><strong>Definition:<\/strong> the use of advanced analytic techniques (statistics, data mining, machine learning, NLP) on very large, diverse data sets to uncover patterns, correlations and insights. <strong>Process:<\/strong> problem → ingestion → storage → preparation → analysis → visualisation → action. <strong>Applications:<\/strong> retail, banking, healthcare, telecom, manufacturing, transport, government, media, agriculture, education.<\/p>\n<h3>3.2 Types of analytics<\/h3>\n<p>Descriptive (what happened) · diagnostic (why) · predictive (what will happen) · prescriptive (what to do). Also real-time/streaming vs batch analytics, and text, social, web, spatial analytics.<\/p>\n<h3>3.3 Comparison of analytics stages<\/h3>\n<p>As organisations move from descriptive to prescriptive analytics, difficulty and value increase (Gartner's analytics ascendancy model): hindsight → insight → foresight. Tools also change: reports/dashboards → drill-down/statistics → machine learning → optimisation/simulation.<\/p>\n<p><strong>Key points:<\/strong> definition and process · application sectors · four analytics types · ascendancy model.<\/p>", "4": "<p>Hadoop and NoSQL databases are the core technologies of big data: Hadoop stores and processes huge data across clusters, while NoSQL databases store flexible data at scale.<\/p>\n<h3>4.1 Hadoop introduction<\/h3>\n<p>Apache Hadoop is an open-source framework for distributed storage and processing of large data sets across clusters of commodity computers. Principles: scale out, move computation to data, fault tolerance through replication, write-once read-many.<\/p>\n<h3>4.2 Hadoop ecosystem components<\/h3>\n<ul>\n<li><strong>Storage:<\/strong> HDFS (NameNode, DataNodes, blocks, replication); HBase (column-oriented NoSQL on HDFS).<\/li>\n<li><strong>Processing:<\/strong> MapReduce; YARN (ResourceManager, NodeManager, ApplicationMaster); Tez; Spark.<\/li>\n<li><strong>Access:<\/strong> Hive (SQL/HiveQL), Pig (Pig Latin scripts), Impala, Mahout (ML), Sqoop (RDBMS import/export), Flume (log ingestion), Kafka (streaming).<\/li>\n<li><strong>Management:<\/strong> ZooKeeper (coordination), Oozie (workflow scheduling), Ambari (provisioning and monitoring).<\/li>\n<\/ul>\n<h3>4.3 Apache Spark<\/h3>\n<p>In-memory distributed engine; RDDs, DataFrames, Datasets; DAG scheduler and lazy evaluation; components Spark SQL, Structured Streaming, MLlib, GraphX; much faster than MapReduce for iterative workloads.<\/p>\n<h3>4.4 NoSQL introduction and types<\/h3>\n<p>Non-relational databases: horizontally scalable, schema-flexible, distributed. Types: key-value (Redis, DynamoDB), column-oriented (Cassandra, HBase), document (MongoDB, CouchDB), graph (Neo4j).<\/p>\n<h3>4.5 BASE model<\/h3>\n<p>Basically Available, Soft state, Eventually consistent — contrasts with ACID; related to the CAP theorem (consistency, availability, partition tolerance — choose two under partition).<\/p>\n<h3>4.6 Advantages and disadvantages of NoSQL<\/h3>\n<p>Pros: scalability, flexibility, availability, performance, handles unstructured data, cheap hardware. Cons: weaker consistency, limited joins/transactions, no standard query language, less mature tooling, data duplication.<\/p>\n<p><strong>Key points:<\/strong> Hadoop principles · ecosystem by layer · Spark components · four NoSQL types · BASE vs ACID, CAP · pros/cons.<\/p>", "5": "<p>Organisations want to keep all their data — logs, images, sensor readings — cheaply, and analyse it later in ways they cannot predict today. Data lakes, and now lakehouses, make this possible.<\/p>\n<h3>5.1 What is a data lake? Introduction, architecture, usage and challenges<\/h3>\n<p><strong>Definition:<\/strong> a centralised repository that stores large amounts of raw data in native format until needed, applying schema on read (James Dixon coined the term).\n<strong>Architecture:<\/strong> sources → ingestion (batch and streaming) → raw/landing zone → cleansed/standardised zone → curated/trusted zone → consumption (BI, ML, data science), with a metadata catalogue, governance, security and monitoring across all zones (bronze/silver/gold).\n<strong>Usage:<\/strong> data science and ML, exploratory analytics, IoT and log analytics, archiving, 360° customer view.\n<strong>Challenges:<\/strong> data swamps, quality, governance, security, performance for BI, skills.<\/p>\n<h3>5.2 Advantages and disadvantages<\/h3>\n<p>Pros: all data types, low cost, scalability, flexibility, supports advanced analytics, fast ingestion, breaks silos. Cons: swamp risk, quality, security, BI performance, specialised skills, governance complexity.<\/p>\n<h3>5.3 Lakehouses<\/h3>\n<p>Combine data-lake storage with warehouse features — ACID transactions, schema enforcement and evolution, time travel, indexing, governance and fast SQL — using open table formats (Delta Lake, Apache Iceberg, Apache Hudi). Platforms: Databricks, Microsoft Fabric, Snowflake (Iceberg tables).<\/p>\n<h3>5.4 Data warehouse vs data lake vs lakehouse<\/h3>\n<p>Compare data types, schema approach, cost, users, workloads, transactions, quality and agility (see the comparison table in the answers).<\/p>\n<h3>5.5 Best practices<\/h3>\n<p>Clear strategy and use cases · zoned architecture · metadata catalogue and lineage · governance, access control and encryption · quality checks at ingestion · open columnar formats · lifecycle and retention policies · cost monitoring · self-service with guardrails.<\/p>\n<p><strong>Key points:<\/strong> definition and zones · usage and challenges · pros/cons · lakehouse features and formats · three-way comparison · best practices.<\/p>", "6": "<p>Big data is already transforming many industries. The syllabus highlights healthcare, fraud detection and social media, plus emerging \"novel\" applications.<\/p>\n<h3>6.1 Healthcare<\/h3>\n<p>Sources: EHRs, imaging, genomics, wearables, claims. Uses: disease prediction and outbreak surveillance, precision medicine, AI-assisted diagnosis, remote monitoring, hospital operations, drug discovery, population health, claims analysis. Issues: privacy, interoperability, data quality, ethics.<\/p>\n<h3>6.2 Fraud detection<\/h3>\n<p>Sources: transactions, device/location data, behaviour logs, networks of accounts. Techniques: real-time stream analytics, anomaly detection, supervised risk scoring, graph analytics for fraud rings, rule + ML hybrids. Areas: card and wallet fraud, insurance, tax, telecom, AML. Issues: imbalanced data, evolving patterns, false positives, explainability.<\/p>\n<h3>6.3 Social-media analytics<\/h3>\n<p>Collecting and analysing posts, comments, likes, shares, networks and multimedia. Techniques: sentiment analysis, topic modelling, trend detection, social network analysis, influencer identification, image recognition. Uses: brand monitoring, customer service, campaign measurement, product feedback, crisis detection, public opinion. Issues: noisy multilingual text, bots, sarcasm, privacy, API limits.<\/p>\n<h3>6.4 Novel applications<\/h3>\n<p>Smart cities, precision agriculture, smart grids, sports analytics, personalised education, disaster management, autonomous vehicles, supply-chain digital twins, astronomy, tourism forecasting.<\/p>\n<p><strong>Key points:<\/strong> data sources, uses and issues for healthcare, fraud and social media · novel applications list.<\/p>"}, "qa": [{"id": "IT278-01", "t": "Big data: definition, types of data, evolution, characteristics", "u": 1, "q": "Define big data. Explain the types of data and the characteristics of big data.", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"M26": "A1, A2"}, "rep": false, "src": "TU Model Question 2026 A1, A2", "a": "<p><strong>Big data<\/strong> refers to data sets so large, fast-moving or varied that traditional data-processing tools (relational databases, single servers) cannot capture, store, manage and analyse them within acceptable time and cost.<\/p>\n<p><strong>Types of data<\/strong><\/p>\n<ul>\n<li><strong>Structured<\/strong> — fixed schema, rows and columns (RDBMS tables, spreadsheets).<\/li>\n<li><strong>Semi-structured<\/strong> — tags/keys but no rigid schema (JSON, XML, logs, emails).<\/li>\n<li><strong>Unstructured<\/strong> — no predefined model (text, images, audio, video, social-media posts) — about 80% of data.<\/li>\n<\/ul>\n<p><strong>Evolution:<\/strong> paper records → databases (1970s RDBMS) → data warehouses (1990s) → web and social data (2000s; Google's GFS/MapReduce papers; Hadoop 2006) → mobile, IoT and cloud (2010s) → real-time streaming and AI (Spark, data lakehouses).<\/p>\n<p><strong>Characteristics — the Vs<\/strong>\n| V | Meaning | Example |\n|---|---|---|\n| <strong>Volume<\/strong> | Huge scale (TB–PB–ZB) | Facebook photos, telecom call records |\n| <strong>Velocity<\/strong> | Speed of generation and processing | Stock ticks, sensor streams |\n| <strong>Variety<\/strong> | Many formats | Text, video, logs, transactions |\n| <strong>Veracity<\/strong> | Uncertainty and quality | Fake reviews, noisy sensors |\n| <strong>Value<\/strong> | Useful insight extracted | Better decisions, revenue |\n| <strong>Variability<\/strong> | Changing meaning/flow rates | Seasonal spikes, slang sentiment |<\/p>"}, {"id": "IT278-02", "t": "Big data vs data warehouse; benefits; obstacles", "u": 1, "q": "Compare big data with a data warehouse. Mention the advantages, disadvantages and impact of big data.", "m": 3, "p": "High", "ty": "Comparison", "seen": {"M26": "Q11"}, "rep": false, "src": "TU Model Question 2026 Q11", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Data warehouse<\/th>\n<th>Big data (platform)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Data type<\/td>\n<td>Structured<\/td>\n<td>Structured + semi + unstructured<\/td>\n<\/tr>\n<tr>\n<td>Schema<\/td>\n<td>Schema-on-write (defined first)<\/td>\n<td>Schema-on-read<\/td>\n<\/tr>\n<tr>\n<td>Volume<\/td>\n<td>GB–TB<\/td>\n<td>TB–PB+<\/td>\n<\/tr>\n<tr>\n<td>Processing<\/td>\n<td>SQL, OLAP, batch ETL<\/td>\n<td>Distributed (Hadoop, Spark), batch + real-time<\/td>\n<\/tr>\n<tr>\n<td>Storage<\/td>\n<td>Expensive, RDBMS<\/td>\n<td>Cheap commodity clusters / cloud object storage<\/td>\n<\/tr>\n<tr>\n<td>Users<\/td>\n<td>Business analysts<\/td>\n<td>Data scientists and analysts<\/td>\n<\/tr>\n<tr>\n<td>Purpose<\/td>\n<td>Reporting, BI on historical data<\/td>\n<td>Exploration, ML, real-time analytics<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Advantages:<\/strong> better decisions · customer insight and personalisation · cost reduction · new products · real-time responses (fraud alerts) · risk management · innovation.\n<strong>Disadvantages / obstacles:<\/strong> high skills requirement (shortage of data scientists) · privacy and security risks · data quality problems · integration complexity · infrastructure cost · regulatory issues · organisational resistance.\n<strong>Impact:<\/strong> data-driven business models, smarter cities and healthcare, targeted marketing, scientific discovery — but also surveillance and privacy concerns.<\/p>"}, {"id": "IT278-03", "t": "Challenges: integration, storage, quality, analysis, security, sharing", "u": 2, "q": "Explain the challenges of big data, including integration and how data quality is maintained.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "A3, Q12"}, "rep": false, "src": "TU Model Question 2026 A3, Q12", "a": "<ol>\n<li><strong>Integration:<\/strong> combining data from heterogeneous sources (databases, logs, sensors, social media) with different formats, schemas and speeds into a unified view. <em>Big data integration<\/em> uses ETL/ELT pipelines, data ingestion tools (Sqoop, Kafka, Flume, NiFi), metadata catalogues and schema mapping.<\/li>\n<li><strong>Storage:<\/strong> exponential growth; need for scalable, cheap, fault-tolerant storage (HDFS, cloud object storage), tiering and compression.<\/li>\n<li><strong>Data quality:<\/strong> inaccuracies, duplicates, missing values, inconsistencies.<\/li>\n<li><strong>Analysis:<\/strong> need for distributed algorithms, real-time processing and skilled people; extracting value from unstructured data.<\/li>\n<li><strong>Security and privacy:<\/strong> protecting sensitive personal data at scale, regulatory compliance, anonymisation.<\/li>\n<li><strong>Access and sharing:<\/strong> governance of who can access what, data silos, interoperability, data-sharing agreements.<\/li>\n<\/ol>\n<p><strong>Maintaining big-data quality<\/strong><\/p>\n<ul>\n<li><strong>Data profiling<\/strong> to understand completeness and patterns.<\/li>\n<li><strong>Validation rules at ingestion<\/strong> (schema checks, ranges).<\/li>\n<li><strong>Cleansing:<\/strong> deduplication, standardisation, handling missing values.<\/li>\n<li><strong>Master data management<\/strong> (single version of key entities).<\/li>\n<li><strong>Metadata and lineage tracking.<\/strong><\/li>\n<li><strong>Data governance<\/strong> — stewards, policies, quality KPIs (accuracy, completeness, timeliness, consistency).<\/li>\n<li><strong>Continuous monitoring and automated quality checks<\/strong> in pipelines.<\/li>\n<\/ul>"}, {"id": "IT278-04", "t": "Big data analytics: definition, steps", "u": 3, "q": "Define big data analytics. Mention the steps of big data analysis.", "m": 3, "p": "High", "ty": "Definition/process", "seen": {"M26": "A4, A5"}, "rep": false, "src": "TU Model Question 2026 A4, A5", "a": "<p><strong>Big data analytics<\/strong> is the process of examining large and varied data sets to uncover hidden patterns, correlations, trends and customer preferences that support better decisions.<\/p>\n<p><strong>Steps<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 416\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Define problem<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data acquisition / ingestion<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Storage<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Cleaning &amp; preparation<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Analysis &amp; modelling<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Visualisation &amp; interpretation<\/text><line x1=\"182.0\" y1=\"353\" x2=\"182.0\" y2=\"370\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"374\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"398.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Action / deployment<\/text><\/svg><\/div>"}, {"id": "IT278-05", "t": "Applications of big data analytics", "u": 3, "q": "Explain applications of big data analytics.", "m": 3, "p": "High", "ty": "List", "seen": {"M26": "Q13"}, "rep": false, "src": "TU Model Question 2026 Q13", "a": "<ul>\n<li><strong>Retail and e-commerce:<\/strong> recommendation engines, market-basket analysis, dynamic pricing, demand forecasting.<\/li>\n<li><strong>Banking and finance:<\/strong> fraud detection, credit scoring, risk management, algorithmic trading.<\/li>\n<li><strong>Healthcare:<\/strong> disease prediction, personalised medicine, hospital resource planning.<\/li>\n<li><strong>Telecom:<\/strong> churn prediction, network optimisation, usage-based offers.<\/li>\n<li><strong>Manufacturing:<\/strong> predictive maintenance, quality control.<\/li>\n<li><strong>Transport and logistics:<\/strong> route optimisation, ride-hailing demand prediction.<\/li>\n<li><strong>Government:<\/strong> smart cities, tax-fraud detection, disaster management.<\/li>\n<li><strong>Media and social networks:<\/strong> sentiment analysis, targeted advertising.<\/li>\n<li><strong>Agriculture:<\/strong> yield prediction, weather-based advisories.<\/li>\n<li><strong>Education:<\/strong> learning analytics, dropout prediction.<\/li>\n<\/ul>"}, {"id": "IT278-06", "t": "Types of analytics and comparison of stages", "u": 3, "q": "Explain the types of big data analytics and compare the analytics stages.", "m": 5, "p": "High", "ty": "Classification", "seen": {"M26": "Q17"}, "rep": false, "src": "TU Model Question 2026 Q17", "a": "<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Question<\/th>\n<th>Techniques<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Descriptive<\/strong><\/td>\n<td>What happened?<\/td>\n<td>Reports, dashboards, aggregation, OLAP<\/td>\n<td>Monthly sales report<\/td>\n<\/tr>\n<tr>\n<td><strong>Diagnostic<\/strong><\/td>\n<td>Why did it happen?<\/td>\n<td>Drill-down, correlation, root-cause analysis<\/td>\n<td>Why sales fell in one region<\/td>\n<\/tr>\n<tr>\n<td><strong>Predictive<\/strong><\/td>\n<td>What will happen?<\/td>\n<td>Regression, ML, time-series forecasting<\/td>\n<td>Predicting customer churn<\/td>\n<\/tr>\n<tr>\n<td><strong>Prescriptive<\/strong><\/td>\n<td>What should we do?<\/td>\n<td>Optimisation, simulation, recommendation engines<\/td>\n<td>Optimal price or inventory level<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Comparison:<\/strong> as we move from descriptive → prescriptive, <strong>value and complexity increase<\/strong>, more advanced skills and tools are required, and the focus shifts from hindsight to insight to foresight. Descriptive and diagnostic analytics are <strong>reactive<\/strong>; predictive and prescriptive are <strong>proactive<\/strong>. (Some texts also add <em>cognitive<\/em> analytics using AI.)<\/p>"}, {"id": "IT278-07", "t": "Hadoop ecosystem; storage components (HDFS)", "u": 4, "q": "List the Hadoop ecosystem components. Explain Hadoop data-storage components.", "m": 5, "p": "High", "ty": "Architecture", "seen": {"M26": "A6, Q14"}, "rep": false, "src": "TU Model Question 2026 A6, Q14", "a": "<p><strong>Hadoop<\/strong> is an open-source Apache framework for distributed storage and processing of big data on clusters of commodity hardware, designed for scalability and fault tolerance.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 266\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Management &amp; coordination: ZooKeeper, Oozie, Ambari<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data access: Hive (SQL), Pig (scripts), HBase (NoSQL), Mahout (ML), Spark<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data ingestion: Sqoop (RDBMS), Flume (logs), Kafka<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Processing: MapReduce, Spark, Tez<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Resource management: YARN<\/text><rect x=\"2\" y=\"222\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#fafbfe\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"245.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Storage: HDFS<\/text><\/svg><\/div>\n\n<p><strong>Storage components<\/strong><\/p>\n<ol>\n<li><strong>HDFS (Hadoop Distributed File System)<\/strong> — master–slave architecture:\n - <strong>NameNode (master):<\/strong> stores metadata (file names, block locations, permissions); manages the namespace.\n - <strong>DataNodes (slaves):<\/strong> store the actual data blocks; send heartbeats and block reports to the NameNode.\n - <strong>Secondary NameNode / Standby NameNode:<\/strong> checkpointing / high availability.\n - Files are split into <strong>blocks (default 128 MB)<\/strong> and each block is <strong>replicated (default factor 3)<\/strong> across nodes and racks → fault tolerance. Optimised for write-once, read-many, large sequential reads.<\/li>\n<li><strong>HBase<\/strong> — a column-oriented NoSQL database on top of HDFS for random, real-time read/write access to huge tables.<\/li>\n<\/ol>\n<p><strong>Processing:<\/strong> MapReduce (batch), YARN (ResourceManager, NodeManager, ApplicationMaster). <strong>Access:<\/strong> Hive (SQL-like HiveQL), Pig (Pig Latin). <strong>Ingestion:<\/strong> Sqoop, Flume. <strong>Management:<\/strong> ZooKeeper (coordination), Oozie (workflow scheduling), Ambari (cluster management).<\/p>"}, {"id": "IT278-08", "t": "Apache Spark", "u": 4, "q": "What is Apache Spark? How is it different from MapReduce?", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Apache Spark<\/strong> is a fast, general-purpose, in-memory distributed computing engine for big data. Core abstraction: <strong>RDD<\/strong> (Resilient Distributed Dataset) and DataFrames; a DAG execution engine.\n<strong>Components:<\/strong> Spark Core · Spark SQL · Spark Streaming (Structured Streaming) · MLlib (machine learning) · GraphX (graph processing). Runs on YARN, Kubernetes, Mesos or standalone; reads HDFS, S3, Cassandra, etc.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>MapReduce<\/th>\n<th>Spark<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Processing<\/td>\n<td>Disk-based between stages<\/td>\n<td>In-memory<\/td>\n<\/tr>\n<tr>\n<td>Speed<\/td>\n<td>Slower<\/td>\n<td>Up to ~100× faster in memory (commonly cited)<\/td>\n<\/tr>\n<tr>\n<td>Workloads<\/td>\n<td>Batch only<\/td>\n<td>Batch, streaming, ML, graph, SQL<\/td>\n<\/tr>\n<tr>\n<td>Ease<\/td>\n<td>Verbose Java<\/td>\n<td>High-level APIs in Scala, Python, Java, R<\/td>\n<\/tr>\n<tr>\n<td>Iterative algorithms<\/td>\n<td>Poor<\/td>\n<td>Excellent (ML)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT278-09", "t": "NoSQL: definition, BASE, advantages/disadvantages", "u": 4, "q": "What are NoSQL databases? Explain the BASE model and the advantages and disadvantages of NoSQL.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "A7, Q15"}, "rep": false, "src": "TU Model Question 2026 A7, Q15", "a": "<p><strong>NoSQL (\"Not only SQL\")<\/strong> databases are non-relational databases designed for large-scale, distributed, flexible-schema data — horizontally scalable across many servers.<\/p>\n<p><strong>BASE model<\/strong> (vs ACID of RDBMS):<\/p>\n<ul>\n<li><strong>Basically Available<\/strong> — the system guarantees availability (responds even during partial failures).<\/li>\n<li><strong>Soft state<\/strong> — the state may change over time without input, due to replication.<\/li>\n<li><strong>Eventually consistent<\/strong> — all replicas become consistent eventually if no new updates.\n<em>CAP theorem:<\/em> a distributed system can guarantee only two of Consistency, Availability and Partition tolerance at the same time; most NoSQL systems favour AP.<\/li>\n<\/ul>\n<p><strong>Advantages:<\/strong> horizontal scalability on commodity hardware · flexible/dynamic schema · high availability and replication · high performance for big data and real-time apps · handles unstructured and semi-structured data · cost-effective · suited to agile development and cloud.\n<strong>Disadvantages:<\/strong> weaker consistency (eventual) · limited support for complex joins and transactions · no standard query language · less mature tools and smaller skill base · data duplication · harder reporting/analytics.<\/p>"}, {"id": "IT278-10", "t": "Types of NoSQL databases with examples", "u": 4, "q": "Explain the types of NoSQL databases with an example of each.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M26": "Q21"}, "rep": false, "src": "TU Model Question 2026 Q21", "a": "<p><strong>1. Key–value stores<\/strong> — data stored as a unique key mapped to a value (blob). Very fast lookups.<\/p>\n<ul>\n<li><em>Examples:<\/em> <strong>Redis<\/strong>, Amazon DynamoDB, Riak.<\/li>\n<li><em>Data:<\/em> <code>session:7841 → {\"user\":\"asha\",\"cart\":[101,205]}<\/code><\/li>\n<li><em>Use:<\/em> caching, session management, shopping carts, leaderboards.<\/li>\n<\/ul>\n<p><strong>2. Column-oriented (wide-column) stores<\/strong> — data stored by column families; rows can have different columns; efficient for aggregations over huge datasets.<\/p>\n<ul>\n<li><em>Examples:<\/em> <strong>Apache Cassandra<\/strong>, <strong>HBase<\/strong>, Google Bigtable.<\/li>\n<li><em>Data:<\/em> row key <code>user101<\/code> → family <em>profile<\/em> {name, city}, family <em>activity<\/em> {last_login, clicks}.<\/li>\n<li><em>Use:<\/em> time-series, IoT sensor data, analytics, messaging (Facebook inbox originally used Cassandra).<\/li>\n<\/ul>\n<p><strong>3. Document-oriented stores<\/strong> — semi-structured documents (JSON/BSON/XML) with nested fields; flexible schema; queries on document content.<\/p>\n<ul>\n<li><em>Examples:<\/em> <strong>MongoDB<\/strong>, CouchDB, Firebase Firestore.<\/li>\n<li><em>Data:<\/em><\/li>\n<\/ul>\n<pre><code class=\"language-json\">{ &quot;_id&quot;: 1, &quot;name&quot;: &quot;Asha&quot;, &quot;faculty&quot;: &quot;BIM&quot;,\n  &quot;courses&quot;: [ {&quot;code&quot;: &quot;IT 278&quot;, &quot;marks&quot;: 82}, {&quot;code&quot;: &quot;IT 249&quot;, &quot;marks&quot;: 76} ] }\n<\/code><\/pre>\n<ul>\n<li><em>Use:<\/em> content management, e-commerce catalogues, user profiles, mobile apps.<\/li>\n<\/ul>\n<p><strong>4. Graph databases<\/strong> — data stored as <strong>nodes<\/strong> (entities), <strong>edges<\/strong> (relationships) and properties; optimised for traversing relationships.<\/p>\n<ul>\n<li><em>Examples:<\/em> <strong>Neo4j<\/strong>, Amazon Neptune, ArangoDB.<\/li>\n<li><em>Data:<\/em> (Asha)-[:FRIEND_OF]-&gt;(Bikash)-[:WORKS_AT]-&gt;(Khalti)<\/li>\n<li><em>Use:<\/em> social networks, recommendation engines, fraud rings detection, network topology, knowledge graphs.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Data model<\/th>\n<th>Strength<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Key–value<\/td>\n<td>key → value<\/td>\n<td>Speed, simplicity<\/td>\n<td>Redis<\/td>\n<\/tr>\n<tr>\n<td>Column<\/td>\n<td>column families<\/td>\n<td>Write-heavy, scalable analytics<\/td>\n<td>Cassandra<\/td>\n<\/tr>\n<tr>\n<td>Document<\/td>\n<td>JSON documents<\/td>\n<td>Flexible schema, rich queries<\/td>\n<td>MongoDB<\/td>\n<\/tr>\n<tr>\n<td>Graph<\/td>\n<td>nodes + edges<\/td>\n<td>Relationship queries<\/td>\n<td>Neo4j<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Conclusion:<\/strong> choose the type by data shape and access pattern (\"polyglot persistence\").<\/p>"}, {"id": "IT278-11", "t": "Data lake: definition, architecture, usage", "u": 5, "q": "What is a data lake? Explain data-lake architecture.", "m": 5, "p": "High", "ty": "Architecture", "seen": {"M26": "A8, Q16"}, "rep": false, "src": "TU Model Question 2026 A8, Q16", "a": "<p>A <strong>data lake<\/strong> is a centralised repository that stores large volumes of <strong>raw data in its native format<\/strong> — structured, semi-structured and unstructured — at low cost, applying structure only when the data is read (<strong>schema-on-read<\/strong>).<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 266\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Consumption: BI dashboards, data science, ML, APIs<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Processing/analytics: Spark, Hive, Presto, ML engines<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Curated / refined zone (cleaned, aggregated, business-ready)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Raw zone (landing / bronze) — original data as ingested<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Ingestion: batch (Sqoop, ETL) and streaming (Kafka, Flume)<\/text><rect x=\"2\" y=\"222\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#fafbfe\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"245.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Sources: databases, logs, IoT, social media, files<\/text><\/svg><\/div>\n\n<p><strong>Cross-cutting layers:<\/strong> metadata catalogue (data discovery), <strong>governance and security<\/strong> (access control, encryption, lineage), monitoring.\nZones are often called <strong>bronze → silver → gold<\/strong> (raw → cleaned → business-level).\n<strong>Storage:<\/strong> HDFS or cloud object storage (Amazon S3, Azure Data Lake Storage, Google Cloud Storage).\n<strong>Usage:<\/strong> data science and ML, exploratory analytics, archiving, IoT analytics, 360° customer view.\n<strong>Challenges:<\/strong> risk of becoming a <strong>\"data swamp\"<\/strong> (no metadata, poor quality), governance, security, performance for BI queries, skills.<\/p>"}, {"id": "IT278-12", "t": "Data lake: advantages and disadvantages", "u": 5, "q": "Explain the advantages and disadvantages of data lakes.", "m": 5, "p": "High", "ty": "Pros/cons", "seen": {"M26": "Q18"}, "rep": false, "src": "TU Model Question 2026 Q18", "a": "<p><strong>Advantages<\/strong><\/p>\n<ol>\n<li>Stores <strong>all types of data<\/strong> in native form.<\/li>\n<li><strong>Low-cost, scalable storage<\/strong> (commodity/cloud object storage).<\/li>\n<li><strong>Schema-on-read<\/strong> — flexibility; no need to design the schema up front.<\/li>\n<li>Supports <strong>advanced analytics, ML and data science<\/strong> on raw data.<\/li>\n<li><strong>Fast ingestion<\/strong> of streaming and batch data.<\/li>\n<li>Breaks down <strong>data silos<\/strong> — a single repository.<\/li>\n<li>Retains historical raw data for future, unknown uses.<\/li>\n<li>Democratises data access for many users and tools.<\/li>\n<\/ol>\n<p><strong>Disadvantages<\/strong><\/p>\n<ol>\n<li>Risk of a <strong>data swamp<\/strong> without governance and metadata.<\/li>\n<li><strong>Data-quality<\/strong> problems (raw, uncleaned data).<\/li>\n<li><strong>Security and privacy<\/strong> challenges — sensitive data in one place.<\/li>\n<li>Slower and harder for <strong>business users and BI<\/strong> compared with a warehouse.<\/li>\n<li>Needs <strong>specialised skills<\/strong> (data engineers, data scientists).<\/li>\n<li><strong>Governance, lineage and compliance<\/strong> complexity.<\/li>\n<li>Weak transaction support/consistency (addressed by lakehouses).<\/li>\n<\/ol>"}, {"id": "IT278-13", "t": "Importance of data lakes; DW vs data lake vs lakehouse", "u": 5, "q": "Why are data lakes important, and how do they compare with data warehouses? What is a lakehouse?", "m": 5, "p": "High", "ty": "Comparison", "seen": {"M26": "A9, Q19"}, "rep": false, "src": "TU Model Question 2026 A9, Q19", "a": "<p><strong>Importance:<\/strong> organisations now generate massive unstructured and streaming data that warehouses cannot store cost-effectively; data lakes keep everything cheaply, enable ML/AI and exploratory analytics, and support agility.<\/p>\n<p><strong>Lakehouse:<\/strong> an architecture that combines the low-cost, flexible storage of a data lake with the data-management and performance features of a data warehouse — <strong>ACID transactions, schema enforcement, indexing, governance and fast SQL/BI<\/strong> directly on lake storage, using open table formats (<strong>Delta Lake, Apache Iceberg, Apache Hudi<\/strong>). Platforms: Databricks, Snowflake (hybrid), Microsoft Fabric.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Data warehouse<\/th>\n<th>Data lake<\/th>\n<th>Lakehouse<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Data<\/td>\n<td>Structured, processed<\/td>\n<td>All types, raw<\/td>\n<td>All types, raw + curated<\/td>\n<\/tr>\n<tr>\n<td>Schema<\/td>\n<td>On write<\/td>\n<td>On read<\/td>\n<td>Both (enforced tables on lake)<\/td>\n<\/tr>\n<tr>\n<td>Storage cost<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td>Users<\/td>\n<td>Business analysts<\/td>\n<td>Data scientists/engineers<\/td>\n<td>Both<\/td>\n<\/tr>\n<tr>\n<td>Use<\/td>\n<td>BI, reporting<\/td>\n<td>ML, exploration<\/td>\n<td>BI + ML on one platform<\/td>\n<\/tr>\n<tr>\n<td>Transactions<\/td>\n<td>ACID<\/td>\n<td>Limited<\/td>\n<td>ACID (Delta/Iceberg)<\/td>\n<\/tr>\n<tr>\n<td>Quality<\/td>\n<td>High (curated)<\/td>\n<td>Variable<\/td>\n<td>Managed tiers<\/td>\n<\/tr>\n<tr>\n<td>Agility<\/td>\n<td>Low (schema changes costly)<\/td>\n<td>High<\/td>\n<td>High<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Best practices for data lakes:<\/strong> define a clear strategy and use cases · organise zones (raw/clean/curated) · strong metadata catalogue and lineage · governance, access control and encryption · data-quality checks at ingestion · lifecycle and retention policies · use open formats (Parquet, Delta) · monitor costs and usage.<\/p>"}, {"id": "IT278-14", "t": "Big data in healthcare and fraud detection", "u": 6, "q": "Explain the use of big data in healthcare and fraud detection.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M26": "Q22"}, "rep": false, "src": "TU Model Question 2026 Q22", "a": "<p><strong>A. Big data in healthcare<\/strong>\n<em>Data sources:<\/em> electronic health records (EHR), medical imaging, lab results, genomics, wearable/IoT devices, insurance claims, pharmacy data, public-health data.\n<em>Uses<\/em><\/p>\n<ol>\n<li><strong>Predictive analytics<\/strong> — predicting disease risk, hospital readmissions and outbreaks (epidemic surveillance, e.g. COVID-19 tracking).<\/li>\n<li><strong>Personalised (precision) medicine<\/strong> — treatment based on genetic and clinical profiles.<\/li>\n<li><strong>Clinical decision support<\/strong> — AI analysing imaging (radiology, pathology) and suggesting diagnoses.<\/li>\n<li><strong>Remote patient monitoring<\/strong> — wearables stream vital signs; alerts for abnormal readings.<\/li>\n<li><strong>Hospital operations<\/strong> — bed management, staff scheduling, reducing waiting time, supply/drug inventory forecasting.<\/li>\n<li><strong>Drug discovery and clinical trials<\/strong> — analysing molecular and trial data faster.<\/li>\n<li><strong>Population health management<\/strong> — identify high-risk groups for prevention programmes.<\/li>\n<li><strong>Cost reduction and claims analysis.<\/strong>\n<em>Challenges:<\/em> privacy and confidentiality of patient data, interoperability of systems, data quality, ethical use of AI.<\/li>\n<\/ol>\n<p><strong>B. Big data in fraud detection<\/strong>\n<em>Data sources:<\/em> transaction records, customer profiles, device/IP/location data, behaviour logs, social-network links, call records.\n<em>Techniques<\/em><\/p>\n<ol>\n<li><strong>Real-time transaction monitoring<\/strong> — streaming analytics (Spark Streaming, Kafka) flags suspicious card or wallet transactions within milliseconds.<\/li>\n<li><strong>Anomaly detection<\/strong> — ML models learn normal behaviour and flag deviations (unusual amount, location, time, device).<\/li>\n<li><strong>Predictive scoring<\/strong> — supervised models (logistic regression, random forest, gradient boosting) trained on past fraud cases assign risk scores.<\/li>\n<li><strong>Graph / network analytics<\/strong> — graph databases reveal fraud rings (shared devices, addresses, accounts).<\/li>\n<li><strong>Rule-based + ML hybrid systems.<\/strong><\/li>\n<li><strong>Text and social analytics<\/strong> — detect fake reviews and phishing.\n<em>Applications:<\/em> credit/debit card fraud, mobile-wallet and online-banking fraud, insurance claim fraud, tax evasion, telecom SIM-box fraud, e-commerce return fraud, anti-money laundering (AML).\n<em>Benefits:<\/em> faster detection, fewer false positives, reduced losses, better customer trust. <em>Challenges:<\/em> class imbalance (fraud is rare), evolving fraud patterns, privacy, explainability of models.<\/li>\n<\/ol>\n<p><strong>Conclusion:<\/strong> in both sectors big data shifts organisations from reactive to proactive decisions.<\/p>"}, {"id": "IT278-15", "t": "Social-media analytics", "u": 6, "q": "Explain big data analytics in social media.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q20"}, "rep": false, "src": "TU Model Question 2026 Q20", "a": "<p><strong>Social-media analytics<\/strong> collects and analyses data from platforms (Facebook, X/Twitter, Instagram, TikTok, YouTube, LinkedIn) to support decisions.<\/p>\n<p><strong>Data:<\/strong> posts, comments, likes, shares, hashtags, followers, images/videos, location and time.\n<strong>Techniques:<\/strong> <strong>sentiment analysis<\/strong> (NLP classifies opinions as positive/negative/neutral) · <strong>trend and hashtag analysis<\/strong> · <strong>social-network analysis<\/strong> (influencers, communities) · <strong>topic modelling<\/strong> · <strong>image/video recognition<\/strong> · engagement metrics (reach, impressions, CTR).\n<strong>Tools:<\/strong> platform APIs, Hootsuite, Brandwatch, Spark/Hadoop with NLP libraries, Python (NLTK, spaCy).<\/p>\n<p><strong>Applications:<\/strong> brand monitoring and reputation management · customer service (responding to complaints) · campaign performance measurement · competitor analysis · product feedback and innovation · influencer marketing · crisis detection · political and public-opinion analysis.\n<strong>Challenges:<\/strong> volume and velocity, noisy/slang/multilingual text (Nepali–English mix), sarcasm, fake accounts and bots, privacy and platform API restrictions.<\/p>"}, {"id": "IT278-16", "t": "Novel applications of big data", "u": 6, "q": "Mention novel applications of big data.", "m": 3, "p": "Medium", "ty": "List", "seen": {"M26": "A10"}, "rep": false, "src": "TU Model Question 2026 A10", "a": "<p>Smart cities (traffic and energy management) · precision agriculture · smart grids · predictive policing · sports analytics (player performance) · personalised education · disaster management and climate modelling · autonomous vehicles · recommendation in streaming services · supply-chain digital twins · space and astronomy · tourism demand forecasting.<\/p>"}], "defs": [["Big data", "Data too large, fast or varied for traditional tools."], ["Volume/Velocity/Variety", "Size, speed and diversity of big data."], ["Veracity", "Uncertainty or trustworthiness of data."], ["Big data integration", "Combining heterogeneous data sources into a unified view."], ["Big data analytics", "Examining big data to uncover patterns and insights."], ["Hadoop", "Open-source framework for distributed storage (HDFS) and processing (MapReduce/YARN)."], ["HDFS", "Hadoop Distributed File System: NameNode + DataNodes, replicated blocks."], ["YARN", "Hadoop's resource-management layer."], ["Spark", "In-memory distributed processing engine."], ["NoSQL", "Non-relational, horizontally scalable databases with flexible schema."], ["BASE", "Basically Available, Soft state, Eventually consistent."], ["CAP theorem", "Only two of consistency, availability and partition tolerance can be guaranteed."], ["Data lake", "Central repository of raw data in native format, schema-on-read."], ["Lakehouse", "Data lake with warehouse-like ACID, governance and performance."], ["Data swamp", "Ungoverned, unusable data lake."], ["Sentiment analysis", "NLP technique classifying opinions in text."]], "revision": "<p><strong>IT 278 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> definition · structured/semi/unstructured · evolution · 6 Vs table · big data vs DW table · pros, obstacles, impact.<\/li>\n<li><strong>U2:<\/strong> integration, storage, quality, analysis, security/privacy, access/sharing · quality practices (profiling, validation, cleansing, MDM, lineage, governance).<\/li>\n<li><strong>U3:<\/strong> definition + 7 steps · applications by sector · descriptive/diagnostic/predictive/prescriptive table.<\/li>\n<li><strong>U4:<\/strong> Hadoop stack diagram · HDFS (NameNode, DataNodes, 128 MB blocks, replication 3) · YARN, MapReduce · Hive, Pig, HBase, Sqoop, Flume, ZooKeeper, Oozie · Spark components + vs MapReduce · NoSQL, BASE, CAP · 4 NoSQL types with examples (Redis, Cassandra/HBase, MongoDB, Neo4j).<\/li>\n<li><strong>U5:<\/strong> data lake definition, zones (raw → curated; bronze/silver/gold), architecture, data swamp · pros/cons · lakehouse (Delta, Iceberg, Hudi) · DW vs lake vs lakehouse table · best practices.<\/li>\n<li><strong>U6:<\/strong> healthcare (EHR, predictive, precision medicine, monitoring, operations) · fraud (real-time, anomaly detection, scoring, graph analytics) · social-media analytics (sentiment, SNA, trends) · novel apps.<\/li>\n<\/ul>", "practice": ["[AI practice] Define veracity. (1)", "[AI practice] Explain the CAP theorem. (3)", "[AI practice] Differentiate HDFS NameNode and DataNode. (3)", "[AI practice] Explain the role of Hive, Pig and Sqoop in the Hadoop ecosystem. (5)", "[AI practice] A Nepali e-commerce company wants to analyse clickstream, orders and social reviews. Propose a big-data architecture using a data lake and Spark. (10)"], "checklist": ["Define big data and explain 6 Vs", "Classify types of data", "Compare big data vs DW", "Explain 6 challenges and quality practices", "List analytics steps and 4 types", "Draw the Hadoop ecosystem", "Explain HDFS architecture", "Compare Spark vs MapReduce", "Explain NoSQL, BASE, CAP", "Explain 4 NoSQL types with examples", "Draw data-lake architecture", "List data-lake pros/cons", "Compare DW, lake, lakehouse", "Explain healthcare and fraud-detection uses", "Explain social-media analytics"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question 2026 (IT 278)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf"], ["Apache Hadoop documentation", "https://hadoop.apache.org/docs/"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "IT 246", "id": "IT246", "title": "IT Ethics and Cybersecurity", "sem": 6, "exam": "2026-12-11", "official": "IT 246: IT Ethics and Cybersecurity", "syllabus": "BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH, with lab (scanning, SQLi/XSS, SET phishing, password cracking, firewalls, incident response)", "note": "Matches routine. OLD-COURSE WARNING: a repository lists 'IT-ethics-and-cybersecurity-2022/2023' pages that are actually IT 225 Computer Security and Cyber Law (OC, 40 marks). They were deliberately EXCLUDED.", "marks": "Full Marks 60. Group A 10×1 · Group B 5×3 (any 5 of 6) · Group C 3×5 (any 3 of 4) · Group D 2×10 (TU model question).", "objectives": "Provide knowledge of IT-related ethics, ethics for IT workers and organisations, intellectual property, cyber threats, cybersecurity, digital forensics and cyber law in Nepal.", "units": [{"n": 1, "t": "An Overview of Ethics", "lh": 5, "topics": "Ethics; ethics in the business world; CSR; fostering CSR and good business ethics; improving business ethics; ethical decision-making."}, {"n": 2, "t": "Ethics for IT Workers and IT Users", "lh": 5, "topics": "Managing IT-worker relationships; professionalism; ethical use of IT resources; privacy and anonymity; ethics of social networking."}, {"n": 3, "t": "Intellectual Property", "lh": 6, "topics": "Intellectual property; copyright; patent; trade secrets; plagiarism, reverse engineering, open-source code, competitive intelligence, trademark infringement, cybersquatting."}, {"n": 4, "t": "Ethical Decisions in Software Development and Ethics of IT Organisations", "lh": 5, "topics": "Software quality and its importance; strategies for quality software; contingent workers; outsourcing; whistle-blowing; green computing."}, {"n": 5, "t": "Fundamentals of Cybersecurity", "lh": 6, "topics": "Cyberspace and cybersecurity; perspectives; impact of technological change, economic-model shifts and outsourcing; risks cybersecurity mitigates; common cyberattacks; poisoned web-service and network-infrastructure attacks; technical attack techniques; attackers' coloured hats."}, {"n": 6, "t": "Personal Cybersecurity", "lh": 5, "topics": "Security of home computers, mobile devices and IoT devices; physical security; remote-work security; securing accounts and passwords."}, {"n": 7, "t": "Social Engineering and Cyber Terrorism", "lh": 5, "topics": "Social engineering — motives, building trust, exploiting relationships, executing the attack, countermeasures; cyber terrorism — types, impact on infrastructure, countering it."}, {"n": 8, "t": "Digital Forensics", "lh": 7, "topics": "Computer vs digital forensics; stages; digital evidence; methods and labs; collecting, seizing and protecting evidence; data recovery; mobile forensics; legal aspects; cyber forensics in Nepal."}, {"n": 9, "t": "Cyber Law in the Context of Nepal", "lh": 4, "topics": "Legal perspective of cybercrime; Electronic Transaction Act; Electronic Transaction Rules; IT Policy; information-security policies."}], "avail": "<p><strong>Actual NC paper found: 1, but only in fragments.<\/strong> The 2025 IT 246 paper exists on bimstudies.com, but the page <strong>failed to load twice<\/strong>; only fragments were recovered from search snippets: several Group A items, one Group B/C item on ethics in business, a cyber-terrorism question and a cyber-law-in-Nepal question. Question numbers and marks for these fragments are <strong>unknown<\/strong> (shown as \"?\"). The rest of the paper is <strong>unavailable<\/strong>. <em>If you can download it, upload it and I will map it in.<\/em><\/p>\n<p><strong>TU Model Question (6th semester)<\/strong> for IT 246 is fully available (Category C, via bimstudies).<\/p>\n<p>December 2025 NC sitting (17 Dec 2025) paper: <strong>not found — unavailable<\/strong>.<\/p>\n<p><strong>Legal note:<\/strong> Nepali laws are cited by name and year; section numbers and penalty amounts are deliberately <strong>not<\/strong> quoted where they could not be verified — check the Act text (Nepal Law Commission, lawcommission.gov.np) before quoting a section in the exam.<\/p>", "pattern": "<p><strong>Model → exam repetitions (from available fragments):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Model<\/th>\n<th>2025 exam<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ethics and its importance in business<\/td>\n<td>B11<\/td>\n<td>\"Importance of ethics in business with example\"<\/td>\n<\/tr>\n<tr>\n<td>Cyber law in Nepal / Electronic Transaction Act<\/td>\n<td>A9, C19<\/td>\n<td>\"Define cyber law\", \"types of cybercrime under Nepalese cyber law\", \"current state of cyber law in Nepal\"<\/td>\n<\/tr>\n<tr>\n<td>Social engineering / cyber terrorism (Unit 7)<\/td>\n<td>A7, B14, C17<\/td>\n<td>Cyber-terrorism types, effects and countering<\/td>\n<\/tr>\n<tr>\n<td>Digital forensics<\/td>\n<td>A8, D21<\/td>\n<td>Cyber-forensics-in-Nepal item<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cyber law in Nepal is the most consistently tested area<\/strong> (in the model and at least three items of the 2025 fragments). Questions are conceptual (Reynolds' <em>Ethics in IT<\/em> and <em>Cybersecurity All-in-One<\/em> style), often with \"explain with example\" or a scenario (outsourcing breach). Because the 2025 paper is incomplete, frequency counts are a <strong>lower bound<\/strong>.<\/p>", "papers": [{"id": "E25", "label": "2025 exam (fragments)", "cat": "A", "session": "2025 (presumed April regular)", "source": "bimstudies.com — fragments recovered from search snippets only (page did not load)", "url": "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/it-ethics-and-cybersecurity-exam-question-solution-bitm-6th-sem-2025/", "note": "Numbering and marks not recoverable; group placement is inferred from the snippet headings.", "qs": [{"no": "A?", "g": "A", "t": "List the differences between ethics and law.", "m": "?", "u": 1}, {"no": "A?", "g": "A", "t": "List any two ethical issues for IT users.", "m": "?", "u": 2}, {"no": "A?", "g": "A", "t": "Define cyber law.", "m": "?", "u": 9}, {"no": "A?", "g": "A", "t": "List the common types of cybercrime covered under Nepalese cyber law.", "m": "?", "u": 9}, {"no": "B?", "g": "B", "t": "Explain the importance of ethics in the business world with example.", "m": "?", "u": 1}, {"no": "?", "g": "C/D", "t": "Describe the effects and types of cyber terrorism. Explain strategies for countering it.", "m": "?", "u": 7}, {"no": "?", "g": "C", "t": "Describe the current state of cyber law in the context of Nepal.", "m": "?", "u": 9}, {"no": "?", "g": "B/C", "t": "(Item on cyber forensics in Nepal — text not recoverable; solution discussed gaps in procedural rigour and standards.)", "m": "?", "u": 8}]}, {"id": "M", "label": "TU model question", "cat": "C", "session": "TU FOM model question, BIM 6th sem", "source": "bimstudies.com (TU model question with solutions)", "url": "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/it-ethics-and-cybersecurity-model-question-solution-bitm-6th-sem/", "note": "", "qs": [{"no": "1", "g": "A", "t": "Define corporate social responsibility.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "State the role of professionalism in IT.", "m": 1, "u": 2}, {"no": "3", "g": "A", "t": "Differentiate copyright and patent.", "m": 1, "u": 3}, {"no": "4", "g": "A", "t": "What is the main ethical concern in using contingent workers?", "m": 1, "u": 4}, {"no": "5", "g": "A", "t": "Who are white-hat hackers?", "m": 1, "u": 5}, {"no": "6", "g": "A", "t": "Why is physical security important in cybersecurity?", "m": 1, "u": 6}, {"no": "7", "g": "A", "t": "How can social-engineering attacks be prevented?", "m": 1, "u": 7}, {"no": "8", "g": "A", "t": "State the role of digital evidence.", "m": 1, "u": 8}, {"no": "9", "g": "A", "t": "State the purpose of the Electronic Transaction Act.", "m": 1, "u": 9}, {"no": "10", "g": "A", "t": "Define whistle-blowing.", "m": 1, "u": 4}, {"no": "11", "g": "B", "t": "Define ethics and explain its importance in business.", "m": 3, "u": 1}, {"no": "12", "g": "B", "t": "How can organisations encourage the ethical use of IT resources?", "m": 3, "u": 2}, {"no": "13", "g": "B", "t": "What are trade secrets and how do they help businesses?", "m": 3, "u": 3}, {"no": "14", "g": "B", "t": "Explain the concept of building trust in social-engineering attacks.", "m": 3, "u": 7}, {"no": "15", "g": "B", "t": "What role do shifts in economic models play in the development of cybersecurity?", "m": 3, "u": 5}, {"no": "16", "g": "B", "t": "How can IoT devices pose personal cybersecurity risks?", "m": 3, "u": 6}, {"no": "17", "g": "C", "t": "Define social engineering and explain why it is a major cybersecurity threat.", "m": 5, "u": 7}, {"no": "18", "g": "C", "t": "Explain how organisations can incorporate green computing into the software development lifecycle.", "m": 5, "u": 4}, {"no": "19", "g": "C", "t": "Describe the legal perspective of cybercrime in Nepal and the significance of the Electronic Transaction Act.", "m": 5, "u": 9}, {"no": "20", "g": "C", "t": "Explain trademark infringement and cybersquatting and their impact on businesses and consumers.", "m": 5, "u": 3}, {"no": "21", "g": "D", "t": "Explain how IP laws and cybersecurity regulations work together to prevent cybercrime, the key methods of handling digital evidence, and the challenges involved.", "m": 10, "u": 8}, {"no": "22", "g": "D", "t": "Describe the risks cybersecurity mitigates; evaluate the cybersecurity risks of outsourcing IT operations after a vendor-caused breach and recommend mitigation strategies.", "m": 10, "u": 5}]}], "notes": {"1": "<p>Technology gives people and businesses great power — and great responsibility. Ethics helps decide what is right and wrong in using that power.<\/p>\n<h3>1.1 What is ethics?<\/h3>\n<p><strong>Definitions<\/strong><\/p>\n<ul>\n<li>Ethics is a set of beliefs about right and wrong behaviour within a society.<\/li>\n<li><strong>Morals<\/strong> are one's personal beliefs about right and wrong; <strong>integrity<\/strong> is acting in accordance with a personal code of principles.<\/li>\n<li><strong>Law<\/strong> is a system of rules that tells us what we can and cannot do, enforced by the state.\nA <strong>code of ethics<\/strong> is a written statement of principles and core values guiding decision-making.<\/li>\n<\/ul>\n<h3>1.2 Ethics in the business world<\/h3>\n<p>Businesses face ethical issues such as bribery, conflicts of interest, fraud, misrepresentation, discrimination, privacy violations and environmental harm. Rising business ethics is driven by risks of scandals, social media scrutiny and regulation.<\/p>\n<h3>1.3 Corporate social responsibility (CSR)<\/h3>\n<p>The concept that an organisation should act ethically by taking responsibility for its impact on shareholders, consumers, employees, community, environment and suppliers. Related idea: <strong>supply-chain sustainability<\/strong>.<\/p>\n<h3>1.4 Fostering CSR and good business ethics<\/h3>\n<p>Reasons: gaining community goodwill · creating an organisation that operates consistently · fostering good business practices · protecting the organisation and employees from legal action · avoiding unfavourable publicity.<\/p>\n<h3>1.5 Improving business ethics<\/h3>\n<p>Appoint a corporate ethics officer · board oversight · code of ethics · social audits · ethics training · ethical criteria in appraisals · an ethical work environment.<\/p>\n<h3>1.6 Ethical decision-making<\/h3>\n<p>Steps: develop a problem statement → identify alternatives → choose an alternative (using approaches below) → implement → monitor results.\n<strong>Approaches:<\/strong> virtue ethics · utilitarian (consequences) · fairness · common good · deontology/rights.<\/p>\n<p><strong>Key points:<\/strong> definitions · CSR · five reasons for business ethics · seven improvements · decision steps and approaches.<\/p>", "2": "<p>IT workers handle systems and data that affect millions of people, so their conduct matters. IT users also face ethical choices about how they use technology.<\/p>\n<h3>2.1 Managing IT-worker relationships<\/h3>\n<p>Relationships with <strong>employers<\/strong> (trade secrets, whistle-blowing, piracy), <strong>clients<\/strong> (fraud, misrepresentation, breach of contract), <strong>suppliers<\/strong> (bribery vs gifts), <strong>other professionals<\/strong> (résumé inflation, sharing), <strong>IT users<\/strong> (piracy prevention) and <strong>society<\/strong> (safe systems).<\/p>\n<h3>2.2 Professionalism<\/h3>\n<p>Professionals have advanced training, exercise discretion and judgement and accept responsibility. Encouraged through <strong>professional codes of ethics<\/strong> (ACM, IEEE-CS, AITP), <strong>professional organisations<\/strong>, <strong>certification<\/strong> (vendor and industry), <strong>licensing<\/strong> (where applicable) and <strong>continuing education<\/strong>. Professional malpractice and negligence carry legal liability.<\/p>\n<h3>2.3 Ethical use of IT resources by users<\/h3>\n<p>Issues: software piracy, inappropriate use of computing resources, inappropriate sharing of information. Supporting ethical practices: policies (acceptable-use policy), awareness, firewalls, monitoring, enforcement.<\/p>\n<h3>2.4 Privacy and anonymity<\/h3>\n<p><strong>Privacy<\/strong> — the right to be left alone and to control information about oneself. Issues: data brokers, consumer profiling, cookies, workplace monitoring, surveillance cameras, data breaches. <strong>Anonymity<\/strong> — protects free speech and whistle-blowers but enables abuse; anonymous remailers and Tor; John Doe lawsuits.<\/p>\n<h3>2.5 Ethics of social networking<\/h3>\n<p>Cyberbullying, cyberstalking, online predators, uploading inappropriate material, fake news, privacy of others' content, employers screening profiles; platform responsibilities (moderation, reporting tools).<\/p>\n<p><strong>Key points:<\/strong> six relationships · professionalism mechanisms · user issues and AUP · privacy vs anonymity · social-networking issues.<\/p>", "3": "<p>Ideas, software, music and brands are valuable assets that are easy to copy in the digital world. Intellectual property law protects the creators.<\/p>\n<h3>3.1 What is intellectual property?<\/h3>\n<p>Works of the mind — art, books, films, formulas, inventions, music, processes — that are distinct and owned or created by a person or organisation. Protected by copyright, patents, trade secrets and trademarks. International framework: WIPO, TRIPS (WTO).<\/p>\n<h3>3.2 Copyright<\/h3>\n<p>Protects original authored works fixed in a tangible form (including software code). Grants exclusive rights to copy, distribute, perform, display and create derivatives. <strong>Fair use<\/strong> permits limited use for criticism, teaching and research (purpose, nature, amount, market effect). Nepal: Copyright Act, 2059.<\/p>\n<h3>3.3 Patent<\/h3>\n<p>Grants the owner exclusive rights to an invention that is new, useful and non-obvious, for a limited term (typically 20 years). Software patents are controversial; <strong>prior art<\/strong> searches; cross-licensing. Nepal: Patent, Design and Trademark Act, 2022 BS.<\/p>\n<h3>3.4 Trade secrets<\/h3>\n<p>Confidential business information with economic value, protected by reasonable secrecy measures (NDAs, non-compete agreements, access control). No registration and no fixed term, but no protection against independent discovery or reverse engineering.<\/p>\n<h3>3.5 IP issues<\/h3>\n<ul>\n<li><strong>Plagiarism<\/strong> — passing off others' work as one's own.<\/li>\n<li><strong>Reverse engineering<\/strong> — disassembling a product to understand or copy it; often legal for interoperability.<\/li>\n<li><strong>Open-source code<\/strong> — freely available source under licences (GPL, MIT, Apache).<\/li>\n<li><strong>Competitive intelligence<\/strong> — legal gathering of public information (vs illegal industrial espionage).<\/li>\n<li><strong>Trademark infringement<\/strong> — unauthorised use of a mark causing confusion.<\/li>\n<li><strong>Cybersquatting<\/strong> — bad-faith registration of domain names matching trademarks (UDRP remedy).<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> IP types · copyright and fair use · patent criteria · trade-secret protection · six IP issues.<\/p>", "4": "<p>Software runs aircraft, hospitals and banks, so quality failures can be costly or deadly. IT organisations also face ethical questions about their workforce and their environmental impact.<\/p>\n<h3>4.1 Software quality and its importance<\/h3>\n<p>High-quality software meets user needs, performs reliably and is safe. Poor quality causes financial loss, safety risks, legal liability and reputational damage. The developer's dilemma: cost, time and quality trade-offs; ethical duty not to ship knowingly defective software.<\/p>\n<h3>4.2 Strategies for developing quality software<\/h3>\n<p>Software development methodology (waterfall, agile) · quality assurance · testing (unit, integration, system, user acceptance; static and dynamic; black-box and white-box) · <strong>CMMI<\/strong> maturity levels · <strong>ISO 9001<\/strong> · safety-critical practices (risk analysis, redundancy, reliability) · quality management standards.<\/p>\n<h3>4.3 Use of contingent workers<\/h3>\n<p>Temporary and contract workers give flexibility and specialised skills, but raise ethical concerns: lack of benefits and security, unequal treatment, misclassification, loyalty and confidentiality issues.<\/p>\n<h3>4.4 Outsourcing<\/h3>\n<p>Contracting work to outside firms, possibly offshore. Pros: cost savings, expertise, focus. Cons: domestic job losses, security and privacy risks, quality, communication, cultural issues; strategies to succeed: clear contracts, protection of data, careful vendor selection.<\/p>\n<h3>4.5 Whistle-blowing<\/h3>\n<p>An employee's attempt to attract public attention to a negligent, illegal, unethical, abusive or dangerous act by a company. Protection laws vary; process: assess seriousness → document → attempt internal resolution → consider escalation → assess implications → use experts → execute → live with consequences.<\/p>\n<h3>4.6 Green computing<\/h3>\n<p>Efficient, environmentally responsible design, manufacture, operation and disposal of IT — energy-efficient hardware (EPEAT, Energy Star), virtualisation, cloud, power management, e-waste recycling, longer device life.<\/p>\n<p><strong>Key points:<\/strong> quality importance · QA strategies · contingent-worker concerns · outsourcing pros/cons · whistle-blowing steps · green computing.<\/p>", "5": "<p>Almost every part of modern life now passes through cyberspace, so attacks on digital systems can hurt individuals, businesses and whole nations. Cybersecurity protects against these threats.<\/p>\n<h3>5.1 Cyberspace and cybersecurity<\/h3>\n<p><strong>Cyberspace<\/strong> — the global network of interconnected IT infrastructure, including the Internet, telecom networks, computers and embedded systems. <strong>Cybersecurity<\/strong> — the practice of protecting systems, networks and data from digital attacks to ensure <strong>confidentiality, integrity and availability<\/strong>.<\/p>\n<h3>5.2 Perspectives on cybersecurity<\/h3>\n<p>Different stakeholders see it differently: individuals (privacy, identity theft), businesses (data, continuity, reputation), governments (national security, critical infrastructure), security professionals (risk management).<\/p>\n<h3>5.3 Impact of technological change, economic-model shifts and outsourcing<\/h3>\n<p>New technologies (cloud, mobile, IoT, AI) expand the attack surface; shifts to digital and data-driven economic models make data valuable to criminals; outsourcing and supply chains add third-party risk.<\/p>\n<h3>5.4 Risks cybersecurity mitigates<\/h3>\n<p>Cyberwarfare · cybercrime · espionage · data breaches · business disruption · financial loss · reputational damage · regulatory penalties · physical harm through cyber-physical systems.<\/p>\n<h3>5.5 Common cyberattacks<\/h3>\n<p>Malware (viruses, worms, Trojans, spyware, ransomware) · phishing · DoS/DDoS · man-in-the-middle · SQL injection · XSS · password attacks · zero-days · botnets · data destruction · insider attacks.<\/p>\n<h3>5.6 Poisoned web service and network infrastructure poisoning<\/h3>\n<p>Compromised or fake websites and services deliver malware (watering-hole, malvertising, SEO poisoning, poisoned updates). Infrastructure poisoning corrupts traffic routing: DNS cache poisoning, ARP spoofing, BGP hijacking, rogue access points.<\/p>\n<h3>5.7 Technical attack techniques<\/h3>\n<p>Exploiting vulnerabilities, brute force, session hijacking, privilege escalation, lateral movement, APTs.<\/p>\n<h3>5.8 Cyberattackers and their coloured hats<\/h3>\n<p>White, black, grey, green, blue, red hats; script kiddies, hacktivists, criminals, nation-states, insiders.<\/p>\n<p><strong>Key points:<\/strong> definitions and CIA · perspectives · risk drivers · risks mitigated · attack types · poisoning attacks · hats.<\/p>", "6": "<p>Individuals are now frequent targets of cyberattacks through their computers, phones and smart devices. Simple personal-security habits prevent most incidents.<\/p>\n<h3>6.1 Securing home computers<\/h3>\n<p>Keep the OS and apps updated, use antivirus and a firewall, standard (non-admin) accounts, full-disk encryption, regular backups (3-2-1 rule), secure Wi-Fi (WPA2/WPA3, strong router password).<\/p>\n<h3>6.2 Mobile devices<\/h3>\n<p>Screen lock and biometrics, official app stores only, app-permission review, updates, encryption, remote locate/wipe, avoid public Wi-Fi or use a VPN.<\/p>\n<h3>6.3 IoT devices<\/h3>\n<p>Change default passwords, update firmware, separate guest network, disable unused features, buy reputable brands; risks: botnets (Mirai), spying cameras, data collection.<\/p>\n<h3>6.4 Physical security<\/h3>\n<p>Lock devices and rooms, never leave laptops unattended, privacy screens, shred documents, secure disposal of storage, beware of shoulder surfing and tailgating.<\/p>\n<h3>6.5 Remote-work security<\/h3>\n<p>Company-managed devices, VPN, MFA, secure home network, separation of work and personal use, awareness of phishing, cloud collaboration tools with access controls.<\/p>\n<h3>6.6 Securing accounts and passwords<\/h3>\n<p>Long unique passphrases, password managers, MFA (authenticator apps or hardware keys preferred over SMS), avoid reuse, monitor breach alerts, secure recovery options, beware of credential phishing.<\/p>\n<p><strong>Key points:<\/strong> controls for computers, mobiles, IoT, physical, remote work, accounts.<\/p>", "7": "<p>The weakest link in security is often a person, not a machine. Social engineers trick people, while cyber terrorists aim to cause fear and disrupt society through digital attacks.<\/p>\n<h3>7.1 Social engineering<\/h3>\n<p>The manipulation of people into performing actions or revealing information.<\/p>\n<ul>\n<li><strong>Motives:<\/strong> money, data, access, espionage, revenge.<\/li>\n<li><strong>Building trust:<\/strong> authority impersonation, insider details from OSINT, urgency, reciprocity, liking, social proof, pretexting.<\/li>\n<li><strong>Exploiting relationships:<\/strong> using trusted contacts or compromised accounts to reach targets.<\/li>\n<li><strong>Executing the attack:<\/strong> phishing links, malicious attachments, fake invoices, requests for OTPs or transfers.<\/li>\n<li><strong>Types:<\/strong> phishing, spear phishing, whaling, vishing, smishing, pretexting, baiting, quid pro quo, tailgating, business-email compromise.<\/li>\n<li><strong>Countermeasures:<\/strong> awareness training, verification procedures, MFA, email filtering (SPF/DKIM/DMARC), limiting public information, reporting culture, physical controls.<\/li>\n<\/ul>\n<h3>7.2 Cyber terrorism<\/h3>\n<p>Politically or ideologically motivated cyberattacks intended to cause fear, disruption or harm.<\/p>\n<ul>\n<li><strong>Types:<\/strong> attacks on critical infrastructure (power, water, transport, finance, health), DDoS, destructive malware, defacement and propaganda, espionage, online recruitment and financing.<\/li>\n<li><strong>Impact on infrastructure:<\/strong> outages, economic loss, public panic, risks to life.<\/li>\n<li><strong>Countering:<\/strong> national strategy and CERT, critical-infrastructure protection, laws and enforcement, international cooperation, public–private partnership, threat intelligence, awareness, incident response and recovery.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> SE life cycle and trust techniques · SE types and defences · cyber-terrorism types, impact, countermeasur
