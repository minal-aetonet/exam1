 length of relationship) — changes the strength of the effect of service quality on satisfaction.<\/p>\n<ul>\n<li><strong>Independent variables (IV):<\/strong> the five SERVQUAL dimensions — tangibility, reliability, responsiveness, assurance, empathy.<\/li>\n<li><strong>Dependent variable (DV):<\/strong> customer satisfaction.<\/li>\n<li><strong>Moderating variable:<\/strong> customer demographics (age, gender, income).<\/li>\n<\/ul>\n<p><em>In the exam:<\/em> draw five IV boxes with arrows to one DV box, and a moderating box with an arrow pointing at the middle of that relationship arrow.<\/p>"}, {"id": "RCH201-09", "t": "Research problem, objectives, hypothesis", "u": 2, "q": "What is a research problem? Explain research objectives and hypothesis formulation with examples.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M": "A9, D22d"}, "rep": false, "src": "TU model 2025 (partial) A9, D22d", "a": "<p><strong>Research problem:<\/strong> a gap, difficulty or issue that needs a solution and can be investigated empirically. A good problem is clear, specific, researchable, significant and feasible.<\/p>\n<p><strong>Research objectives:<\/strong> specific statements of what the study aims to achieve. <em>Example:<\/em> \"To examine the effect of service quality dimensions on customer satisfaction in commercial banks of Bharatpur.\"<\/p>\n<p><strong>Hypothesis:<\/strong> a tentative, testable statement about the relationship between two or more variables.<\/p>\n<ul>\n<li><strong>Null (H0):<\/strong> no relationship. <em>H0: there is no significant relationship between empathy and customer satisfaction.<\/em><\/li>\n<li><strong>Alternative (H1):<\/strong> <em>H1: empathy has a significant positive effect on customer satisfaction.<\/em><\/li>\n<li>Types: directional vs non-directional; descriptive vs relational.\n<strong>Criteria of a good hypothesis:<\/strong> testable, clear, specific, consistent with theory, states the expected relationship.<\/li>\n<\/ul>"}, {"id": "RCH201-10", "t": "Deductive vs inductive approaches", "u": 2, "q": "Define deductive and inductive approaches.", "m": 2, "p": "High", "ty": "Definition", "seen": {"E25": "A8"}, "rep": false, "src": "Apr 2025 exam A8", "a": "<p><strong>Deductive approach:<\/strong> moves from <strong>theory → hypotheses → data → confirmation/rejection<\/strong> (general to specific); used in quantitative, positivist research.\n<strong>Inductive approach:<\/strong> moves from <strong>observation → patterns → theory<\/strong> (specific to general); used in qualitative, interpretivist research such as grounded theory.<\/p>"}, {"id": "RCH201-11", "t": "Research design and quantitative designs", "u": 3, "q": "What is research design? Describe the different types of quantitative research designs.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "Q19", "M": "B14"}, "rep": true, "src": "Apr 2025 exam Q19; TU model 2025 (partial) B14", "a": "<p><strong>Research design<\/strong> is the blueprint or master plan for conducting a study — it specifies the type of study, the variables, sampling, data-collection methods and analysis, so that the research questions are answered validly and economically.<\/p>\n<p><strong>Types of quantitative research design<\/strong><\/p>\n<ol>\n<li><strong>Descriptive design<\/strong> — describes characteristics of a population or phenomenon (who, what, when, where, how much). Uses surveys and observation. <em>Example:<\/em> customer profile of a mobile wallet. Types: cross-sectional (one time) and longitudinal (repeated over time, e.g. a <strong>cohort study<\/strong> that follows the same group).<\/li>\n<li><strong>Correlational design<\/strong> — measures the degree of relationship between variables without manipulating them (correlation, regression). <em>Example:<\/em> relationship between training hours and productivity. It does not prove causation.<\/li>\n<li><strong>Causal-comparative (ex-post-facto) design<\/strong> — compares existing groups that differ on an independent variable to infer possible causes after the fact. <em>Example:<\/em> comparing the performance of employees who did and did not receive training last year.<\/li>\n<li><strong>Experimental design<\/strong> — manipulates an independent variable and controls other factors to establish cause and effect; random assignment to treatment and control groups. Types: pre-experimental, true experimental (pre-test/post-test control group), quasi-experimental; laboratory vs field experiments. <em>Example:<\/em> testing whether a discount offer increases sales in randomly chosen branches.<\/li>\n<\/ol>\n<p><strong>Choosing a design<\/strong> depends on the research objective, the nature of the variables, time and cost, and the control possible.<\/p>"}, {"id": "RCH201-12", "t": "Qualitative designs: case study, ethnography, grounded theory", "u": 3, "q": "Explain qualitative research designs: case study, ethnography and grounded theory. What is a cohort study?", "m": 5, "p": "High", "ty": "Definitions", "seen": {"E25": "A3, A6", "M": "A10"}, "rep": true, "src": "Apr 2025 exam A3, A6; TU model 2025 (partial) A10", "a": "<ul>\n<li><strong>Case study:<\/strong> in-depth study of one or a few units (an organisation, event or person) using multiple sources (interviews, documents, observation). <em>Example:<\/em> how Khalti scaled its operations.<\/li>\n<li><strong>Ethnography:<\/strong> the researcher immerses in a group's natural setting for an extended period to understand its culture, behaviour and meanings through participant observation. <em>Example:<\/em> studying the work culture of a software company by working inside it.<\/li>\n<li><strong>Grounded theory:<\/strong> an inductive approach in which theory is developed from systematically collected and analysed data, through open, axial and selective coding and constant comparison, rather than testing an existing theory.<\/li>\n<\/ul>\n<p><strong>Cohort study:<\/strong> a longitudinal study that follows a group sharing a common characteristic (e.g. employees hired in 2024) over time to observe changes or outcomes.<\/p>"}, {"id": "RCH201-13", "t": "Variables: dependent, independent, moderating", "u": 4, "q": "Define a dependent variable with an example. Give two examples of moderating variables.", "m": 2, "p": "High", "ty": "Definition + example", "seen": {"E25": "A4, A9"}, "rep": false, "src": "Apr 2025 exam A4, A9", "a": "<p><strong>Dependent variable (DV):<\/strong> the main variable of interest that the researcher wants to explain or predict; it changes in response to other variables. <em>Example:<\/em> <strong>employee performance<\/strong> in a study of the effect of training.<\/p>\n<p><strong>Independent variable (IV):<\/strong> the variable that influences the DV (e.g. training).<\/p>\n<p><strong>Moderating variable:<\/strong> a variable that changes the <strong>strength or direction<\/strong> of the relationship between an IV and a DV.\n<em>Examples:<\/em> (1) <strong>Age<\/strong> moderating the effect of social-media advertising on purchase intention; (2) <strong>experience<\/strong> moderating the effect of training on performance; (also gender, income, firm size).<\/p>\n<p><strong>Mediating (intervening) variable:<\/strong> explains <em>how<\/em> the IV affects the DV (training → skills → performance).<\/p>"}, {"id": "RCH201-14", "t": "Measurement scales; attitude scales; Likert", "u": 4, "q": "Give a brief note on the different types of measurement scales with examples, including attitude scales.", "m": 5, "p": "High", "ty": "Explanation + examples", "seen": {"E25": "Q14, A5"}, "rep": false, "src": "Apr 2025 exam Q14, A5", "a": "<table>\n<thead>\n<tr>\n<th>Scale<\/th>\n<th>Property<\/th>\n<th>Example<\/th>\n<th>Allowed statistics<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Nominal<\/strong><\/td>\n<td>Categories only<\/td>\n<td>Gender, bank name<\/td>\n<td>Frequency, mode, chi-square<\/td>\n<\/tr>\n<tr>\n<td><strong>Ordinal<\/strong><\/td>\n<td>Order/rank<\/td>\n<td>Ranking of brands, education level<\/td>\n<td>Median, percentile, rank correlation<\/td>\n<\/tr>\n<tr>\n<td><strong>Interval<\/strong><\/td>\n<td>Equal intervals, no true zero<\/td>\n<td>Temperature °C, Likert-type scores<\/td>\n<td>Mean, SD, correlation<\/td>\n<\/tr>\n<tr>\n<td><strong>Ratio<\/strong><\/td>\n<td>Equal intervals + true zero<\/td>\n<td>Income, age, sales<\/td>\n<td>All statistics incl. ratios<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Attitude scales<\/strong><\/p>\n<ul>\n<li><strong>Rank-order scale:<\/strong> respondents rank items (rank five smartphone brands 1–5).<\/li>\n<li><strong>Semantic differential:<\/strong> bipolar adjectives on a 7-point scale (Modern <strong><em>_ Old-fashioned; Reliable <\/em><\/strong>_ Unreliable).<\/li>\n<li><strong>Likert scale:<\/strong> agreement with statements on 5 points — e.g. <em>\"Mobile banking is easy to use\":<\/em> 1 Strongly disagree, 2 Disagree, 3 Neutral, 4 Agree, 5 Strongly agree.<\/li>\n<\/ul>\n<p><strong>Validity<\/strong> = measuring what we intend to measure (content, criterion, construct). <strong>Reliability<\/strong> = consistency of measurement (test–retest, internal consistency — Cronbach's alpha ≥ 0.7).<\/p>"}, {"id": "RCH201-15", "t": "Sampling; probability techniques", "u": 4, "q": "What is probability sampling? Explain its techniques.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "Q20", "M": "B15"}, "rep": true, "src": "Apr 2025 exam Q20; TU model 2025 (partial) B15", "a": "<p><strong>Sampling<\/strong> is selecting a subset of a population to draw conclusions about the whole. <strong>Probability sampling<\/strong> gives every element a known, non-zero chance of selection, which allows statistical generalisation and estimation of sampling error.<\/p>\n<p><strong>Sampling process:<\/strong> define the population → identify the sampling frame → choose the sampling method → determine sample size → select the sample → collect data.<\/p>\n<p><strong>Techniques<\/strong><\/p>\n<ol>\n<li><strong>Simple random sampling<\/strong> — every element has an equal chance; lottery method or random-number tables/software. <em>Example:<\/em> 100 of 1,000 customers chosen by random numbers. <em>Pros:<\/em> unbiased; <em>cons:<\/em> needs a complete frame.<\/li>\n<li><strong>Systematic sampling<\/strong> — select every k-th element after a random start, k = N/n. <em>Example:<\/em> N = 1,000, n = 100 → k = 10; start at 7 → 7, 17, 27… <em>Pros:<\/em> easy; <em>cons:<\/em> periodicity bias.<\/li>\n<li><strong>Stratified random sampling<\/strong> — divide the population into homogeneous strata (gender, branch, income) and randomly sample from each, proportionately or disproportionately. <em>Pros:<\/em> precise, represents subgroups.<\/li>\n<li><strong>Cluster sampling<\/strong> — divide into heterogeneous clusters (branches, districts), randomly select clusters, study all or some elements in them; multistage/area sampling. <em>Pros:<\/em> cheap for scattered populations; <em>cons:<\/em> higher sampling error.<\/li>\n<\/ol>\n<p><strong>Non-probability sampling<\/strong> (contrast): convenience, judgemental (purposive), quota, snowball — cheaper but not generalisable.<\/p>\n<p><strong>Errors:<\/strong> <em>sampling error<\/em> (difference between sample and population values due to chance) vs <em>non-sampling errors<\/em> (non-response, measurement, coding, interviewer bias).<\/p>"}, {"id": "RCH201-16", "t": "Sample size and sampling errors", "u": 4, "q": "Explain sampling and non-sampling errors and the factors determining sample size.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Sampling error<\/strong> arises because a sample, not the whole population, is studied; it falls as sample size rises. <strong>Non-sampling errors<\/strong> come from other sources: non-response, wrong frame, poorly worded questions, interviewer bias, data-entry mistakes — they do not fall with sample size.<\/p>\n<p><strong>Determinants of sample size:<\/strong> desired confidence level and precision · population variability · population size · type of analysis · budget and time · expected response rate.\n<strong>Formula (proportion, large population):<\/strong> n = Z²·p·q / e². With 95% confidence (Z = 1.96), p = 0.5, e = 0.05 → n = 1.96² × 0.25 / 0.0025 ≈ <strong>384<\/strong>.<\/p>"}, {"id": "RCH201-17", "t": "Primary/secondary data; questionnaire design", "u": 5, "q": "Differentiate primary and secondary data. Explain the principles of questionnaire design.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Primary data<\/th>\n<th>Secondary data<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Meaning<\/td>\n<td>Collected first-hand for the current study<\/td>\n<td>Already collected by others<\/td>\n<\/tr>\n<tr>\n<td>Sources<\/td>\n<td>Survey, interview, observation, experiment<\/td>\n<td>Reports, NRB/CBS publications, journals, company records<\/td>\n<\/tr>\n<tr>\n<td>Cost/time<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td>Relevance<\/td>\n<td>Specific<\/td>\n<td>May not fit exactly<\/td>\n<\/tr>\n<tr>\n<td>Accuracy control<\/td>\n<td>High<\/td>\n<td>Unknown<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Questionnaire design principles:<\/strong> link every question to an objective · simple, clear, unambiguous language · avoid leading, loaded and double-barrelled questions · logical sequence (funnel — general to specific; sensitive and demographic questions at the end) · suitable question types (closed, open, Likert) · keep it short · clear instructions · <strong>pre-test (pilot)<\/strong> before use.<\/p>"}, {"id": "RCH201-18", "t": "Interviews: face-to-face, telephone, CAI", "u": 5, "q": "What is a research interview? Discuss face-to-face, telephone and computer-assisted interviews.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "A7", "M": "A6, B16"}, "rep": true, "src": "Apr 2025 exam A7; TU model 2025 (partial) A6, B16", "a": "<p>A <strong>research interview<\/strong> is a purposeful conversation in which the interviewer asks questions to obtain information from a respondent. Types by structure: structured, semi-structured, unstructured.<\/p>\n<p><strong>Face-to-face (personal) interview<\/strong> — in person. <em>Pros:<\/em> rapport, can clarify questions, observe non-verbal cues, high response rate, long and complex questionnaires possible. <em>Cons:<\/em> costly, time-consuming, interviewer bias, geographic limits. <em>Example:<\/em> interviewing bank customers at branches.<\/p>\n<p><strong>Telephone interview<\/strong> — conducted over the phone. <em>Pros:<\/em> fast, cheaper, wide geographic reach, easy call-backs, more anonymity. <em>Cons:<\/em> short duration, no visual aids, lower rapport, refusals, limited to people with phones.<\/p>\n<p><strong>Computer-assisted interviews<\/strong> — CATI (telephone with screen script), CAPI (personal interview using a tablet/laptop), CAWI (self-completed web surveys). <em>Pros:<\/em> automatic skip logic, instant data entry, fewer errors. <em>Cons:<\/em> equipment cost, needs digital access.<\/p>\n<p><strong>Observation<\/strong> — recording behaviour rather than asking (participant/non-participant, structured/unstructured).<\/p>"}, {"id": "RCH201-19", "t": "Qualitative data collection and analysis methods", "u": 5, "q": "Explain the methods of collecting qualitative data and analysing it.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"E25": "Q13"}, "rep": false, "src": "Apr 2025 exam Q13", "a": "<p><strong>Collection methods<\/strong><\/p>\n<ul>\n<li><strong>In-depth interviews<\/strong> (unstructured or semi-structured).<\/li>\n<li><strong>Focus-group discussions<\/strong> (6–10 participants with a moderator).<\/li>\n<li><strong>Participant and non-participant observation<\/strong> (ethnography).<\/li>\n<li><strong>Case studies.<\/strong><\/li>\n<li><strong>Document and archival analysis<\/strong> (reports, social-media posts).<\/li>\n<li><strong>Projective techniques<\/strong> (word association, sentence completion).<\/li>\n<\/ul>\n<p><strong>Analysis methods<\/strong><\/p>\n<ul>\n<li><strong>Content analysis:<\/strong> systematic coding and counting of themes or words in text.<\/li>\n<li><strong>Narrative analysis:<\/strong> interprets the stories people tell and their structure.<\/li>\n<li><strong>Discourse analysis:<\/strong> studies how language is used in social context to construct meaning and power.<\/li>\n<li><strong>Grounded-theory analysis:<\/strong> open, axial and selective coding to build theory from data.<\/li>\n<li><strong>Thematic analysis:<\/strong> identifying patterns (themes) across data.<\/li>\n<\/ul>"}, {"id": "RCH201-20", "t": "Descriptive vs inferential statistics; use in case", "u": 5, "q": "Explain descriptive and inferential statistics. Why did the Bharatpur bank study use inferential statistics?", "m": 5, "p": "High", "ty": "Case reasoning", "seen": {"E25": "D22b"}, "rep": false, "src": "Apr 2025 exam D22b", "a": "<p><strong>Descriptive statistics<\/strong> summarise sample data: frequency, percentage, mean, median, mode, standard deviation, tables and charts.\n<strong>Inferential statistics<\/strong> use sample data to draw conclusions (generalise) about the population and test hypotheses: t-test, ANOVA, chi-square, correlation, regression, with significance levels (p-values).<\/p>\n<p><strong>Why the study used inferential statistics<\/strong><\/p>\n<ol>\n<li>The study surveyed only a <strong>sample of 421 customers<\/strong> but wanted conclusions about <strong>all bank customers<\/strong> in Bharatpur — generalisation needs inference.<\/li>\n<li>It had <strong>hypotheses<\/strong> about relationships between service-quality dimensions and satisfaction; testing them requires significance tests.<\/li>\n<li>It measured <strong>relationships<\/strong> (correlation between empathy and satisfaction) — bivariate inferential analysis.<\/li>\n<li><strong>Probability random sampling<\/strong> was used, which makes inferential statistics valid.<\/li>\n<li>To judge whether observed gaps (e.g. tangibility) are <strong>statistically significant<\/strong> or due to chance.<\/li>\n<\/ol>"}, {"id": "RCH201-21", "t": "CASE: Bank service quality study (2025)", "u": 5, "q": "Case (April 2025): A quantitative study in Bharatpur surveyed 421 bank customers on service quality and satisfaction. (a) List five possible research questions (b) Why were inferential statistics used? (c) Draw the theoretical framework with dependent, independent and moderating variables (d) Justify why the design is quantitative. [4×5]", "m": 20, "p": "High", "ty": "Case study", "seen": {"E25": "Q22"}, "rep": false, "src": "Apr 2025 exam Q22", "a": "<p><strong>(a) Five research questions<\/strong><\/p>\n<ol>\n<li>What is the level of customer satisfaction with commercial banks in Bharatpur?<\/li>\n<li>Is there a gap between customers' expectations and perceptions of service quality?<\/li>\n<li>Which service-quality dimension has the largest gap?<\/li>\n<li>What is the relationship between reliability (and responsiveness, assurance, empathy, tangibility) and customer satisfaction?<\/li>\n<li>Does the relationship differ by customer age or gender?\n<em>(Survey-question version: \"The bank has modern-looking equipment\" — Likert 1–5, etc.)<\/em><\/li>\n<\/ol>\n<p><strong>(b)<\/strong> See the previous answer: sample-to-population generalisation, hypothesis testing, measuring relationships, probability sampling, and checking the significance of gaps.<\/p>\n<p><strong>(c) Theoretical framework:<\/strong> IVs = tangibility, reliability, responsiveness, assurance, empathy → DV = customer satisfaction; moderating variable = customer demographics (age/gender/income). <em>(Draw as in the theoretical-framework answer.)<\/em><\/p>\n<p><strong>(d) Why quantitative<\/strong><\/p>\n<ul>\n<li>Variables were <strong>measured numerically<\/strong> with a structured questionnaire (Likert scales).<\/li>\n<li>A <strong>large sample (421)<\/strong> selected by <strong>probability sampling<\/strong>.<\/li>\n<li><strong>Statistical analysis<\/strong> (descriptive, inferential, bivariate correlation).<\/li>\n<li><strong>Hypothesis testing<\/strong> (deductive approach, positivist philosophy).<\/li>\n<li>Aim to <strong>generalise<\/strong> findings and measure gaps objectively.<\/li>\n<li>Results are expressed as numbers (gap scores, correlation coefficients).<\/li>\n<\/ul>"}, {"id": "RCH201-22", "t": "Chi-square tests", "u": 5, "q": "Explain the chi-square test of goodness of fit and of independence with an example.", "m": 5, "p": "Medium", "ty": "Numerical", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Chi-square (χ²)<\/strong> is a non-parametric test on frequency data: χ² = Σ (O − E)² / E.<\/p>\n<ul>\n<li><strong>Goodness of fit:<\/strong> does the observed distribution match an expected distribution? df = k − 1.<\/li>\n<li><strong>Test of independence:<\/strong> are two categorical variables associated? E = (row total × column total)/N; df = (r − 1)(c − 1).\n<strong>Decision:<\/strong> if calculated χ² &gt; critical value, reject H0.<\/li>\n<\/ul>\n<p>See the worked examples in the formulas section: independence χ² = 3.43 &lt; 3.841 → not significant; goodness of fit χ² = 11.67 &gt; 7.815 → reject uniformity.<\/p>"}, {"id": "RCH201-23", "t": "Data presentation: tables, charts, graphs", "u": 5, "q": "Explain the methods of presenting data in tables, charts and graphs.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li><strong>Tables:<\/strong> title, number, stub (row heads), caption (column heads), body, source note; simple, one-way, two-way (cross-tab).<\/li>\n<li><strong>Bar/column charts:<\/strong> compare categories. <strong>Pie charts:<\/strong> parts of a whole (few categories). <strong>Line graphs:<\/strong> trends over time. <strong>Histogram/frequency polygon/ogive:<\/strong> distributions of continuous data. <strong>Scatter diagram:<\/strong> relationship between two variables.<\/li>\n<li>Principles: clear titles, labelled axes and units, source cited, no distortion.<\/li>\n<\/ul>"}, {"id": "RCH201-24", "t": "Research proposal: purpose, types, structure; report writing", "u": 6, "q": "What is a research proposal? Explain the procedure for writing a research report.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "Q21"}, "rep": false, "src": "Apr 2025 exam Q21", "a": "<p>A <strong>research proposal<\/strong> is a written plan that describes what the researcher intends to study, why, and how, submitted for approval or funding.\n<strong>Purposes:<\/strong> convince the reader the study is worth doing · show the researcher's competence · serve as a contract/plan.\n<strong>Types:<\/strong> solicited vs unsolicited; internal vs external; academic vs business.\n<strong>Structure:<\/strong> title · introduction/background · problem statement · objectives/research questions · hypotheses · literature review · research methodology (design, population and sample, data sources and collection, tools of analysis) · significance · limitations · time schedule · budget · references.<\/p>\n<p><strong>Procedure for writing a research report<\/strong><\/p>\n<ol>\n<li><strong>Logical analysis of the subject<\/strong> and planning an outline.<\/li>\n<li><strong>Preparing the final outline<\/strong> (chapters and headings).<\/li>\n<li><strong>Writing the rough draft<\/strong> — what was done, how, findings, limitations.<\/li>\n<li><strong>Rewriting and polishing<\/strong> — clarity, coherence, grammar, consistency.<\/li>\n<li><strong>Preparing the bibliography/references<\/strong> (APA).<\/li>\n<li><strong>Writing the final draft<\/strong> — concise, objective language; tables and figures.<\/li>\n<li><strong>Typing and layout<\/strong> — format, numbering, margins, headings.<\/li>\n<\/ol>\n<p><strong>Typical report layout:<\/strong> preliminary pages (title page, declaration, recommendation, acknowledgement, abstract, contents, lists of tables/figures) → Chapter 1 Introduction → Chapter 2 Literature review → Chapter 3 Methodology → Chapter 4 Results and discussion → Chapter 5 Summary, conclusion and recommendations → references → appendices.<\/p>"}, {"id": "RCH201-25", "t": "Essentials/qualities of a good research report", "u": 6, "q": "Outline the essentials of a good research report in management research.", "m": 5, "p": "High", "ty": "Outline", "seen": {"E25": "Q17"}, "rep": false, "src": "Apr 2025 exam Q17", "a": "<ol>\n<li><strong>Clear purpose and problem statement.<\/strong><\/li>\n<li><strong>Logical structure<\/strong> — standard chapters and headings.<\/li>\n<li><strong>Accuracy and objectivity<\/strong> — facts, not opinions; honest reporting.<\/li>\n<li><strong>Clarity and simplicity<\/strong> — concise language, defined terms, little jargon.<\/li>\n<li><strong>Adequate methodology description<\/strong> so the study can be replicated.<\/li>\n<li><strong>Proper presentation of data<\/strong> — tables and figures with titles and sources.<\/li>\n<li><strong>Sound analysis and interpretation<\/strong> linked to the objectives.<\/li>\n<li><strong>Conclusions and actionable recommendations<\/strong> for managers.<\/li>\n<li><strong>Proper citation and referencing (APA)<\/strong> — no plagiarism.<\/li>\n<li><strong>Executive summary / abstract<\/strong> for busy readers.<\/li>\n<li><strong>Acknowledgement of limitations<\/strong> and suggestions for future research.<\/li>\n<li><strong>Professional layout<\/strong> — consistent formatting, page numbers, appendices.<\/li>\n<\/ol>"}, {"id": "RCH201-26", "t": "APA referencing", "u": 6, "q": "Provide an example of referencing an article using APA format.", "m": 2, "p": "High", "ty": "Example", "seen": {"E25": "A10"}, "rep": false, "src": "Apr 2025 exam A10", "a": "<p><strong>Format:<\/strong> Author, A. A., &amp; Author, B. B. (Year). Title of the article. <em>Name of Journal, Volume<\/em>(Issue), page range. https://doi.org/…<\/p>\n<p><strong>Example:<\/strong> Sharma, R., &amp; Thapa, S. (2023). Service quality and customer satisfaction in Nepalese banks. <em>Journal of Business and Management Research, 8<\/em>(1), 45–60. <em>(Illustrative reference — invented names, for format practice.)<\/em><\/p>\n<p><strong>In-text citation:<\/strong> (Sharma &amp; Thapa, 2023).<\/p>"}], "defs": [["Research", "Systematic, objective investigation to find answers to a problem."], ["Applied research", "Research aimed at solving a specific, current problem."], ["Basic research", "Research aimed at expanding general knowledge."], ["Positivism", "Philosophy that reality is objective and measurable; uses quantitative methods."], ["Interpretivism", "Philosophy that reality is socially constructed; uses qualitative methods."], ["Theoretical framework", "Conceptual model of relationships among variables based on theory."], ["Hypothesis", "Tentative, testable statement about the relationship between variables."], ["Research design", "Blueprint for collecting and analysing data."], ["Ethnography", "Immersive study of a group's culture in its natural setting."], ["Grounded theory", "Inductive method of building theory from data."], ["Dependent variable", "Variable explained or predicted in a study."], ["Moderating variable", "Variable altering the strength/direction of an IV–DV relationship."], ["Likert scale", "Agreement scale, typically 5 points from strongly disagree to strongly agree."], ["Reliability", "Consistency of a measure."], ["Validity", "Extent to which an instrument measures what it intends to."], ["Probability sampling", "Sampling where every element has a known non-zero chance of selection."], ["Chi-square test", "Non-parametric test comparing observed and expected frequencies."]], "revision": "<p><strong>RCH 201 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> scientific research hallmarks · 10-step process · basic vs applied · positivism vs interpretivism table · \"formalised curiosity\" · ethics (consent, confidentiality, no harm, no plagiarism).<\/li>\n<li><strong>U2:<\/strong> literature review — purpose + 7 steps · research problem, objectives, H0/H1 · theoretical framework (draw IV → DV with moderator) · deductive vs inductive.<\/li>\n<li><strong>U3:<\/strong> design definition · quantitative: descriptive (cross-sectional, longitudinal, cohort), correlational, causal-comparative, experimental · qualitative: case study, ethnography, grounded theory.<\/li>\n<li><strong>U4:<\/strong> IV/DV/moderating/mediating · NOIR scales · rank-order, semantic differential, Likert · validity vs reliability · probability (SRS, systematic, stratified, cluster) vs non-probability (convenience, judgemental, quota) · errors · n = Z²pq/e².<\/li>\n<li><strong>U5:<\/strong> primary vs secondary · questionnaire rules · interviews (F2F, telephone, CATI/CAPI/CAWI), observation · descriptive vs inferential · qualitative methods and content/narrative/discourse/grounded analysis · chi-square formula, df, decision.<\/li>\n<li><strong>U6:<\/strong> proposal structure · report-writing steps · report layout · qualities · APA format.<\/li>\n<li><strong>Case drill:<\/strong> 5 research questions · why inferential · framework diagram · justify quantitative / design · hypotheses.<\/li>\n<\/ul>", "practice": ["[AI practice] Differentiate between descriptive and experimental research design with examples. (5)", "[AI practice] Construct a semantic-differential scale to measure the image of a Nepali airline. (5)", "[AI practice] Explain non-probability sampling techniques. (10)", "[AI practice] Develop three hypotheses for a study on 'social-media marketing and purchase intention among Nepali youth'. (5)", "[AI practice] Case: A study on 'work–life balance and job satisfaction of nurses in Kathmandu' used interviews with 15 nurses. Identify the research philosophy, design and analysis method, and justify. (20)"], "checklist": ["Explain the 10-step research process", "Compare basic and applied research", "Compare positivism and interpretivism", "List ethical issues", "Explain literature-survey steps", "Draw a theoretical framework with moderator", "Write H0 and H1", "Explain 4 quantitative and 3 qualitative designs", "Explain NOIR scales and Likert example", "Explain 4 probability techniques", "Explain interview types", "Solve a chi-square problem", "Write an APA reference", "Outline proposal and report structure"], "sources": [["TU FOM — BIM 6th Semester Syllabus 2024", "https://www.fomecd.edu.np/syllabuses/BIM%206th%20Semester%20Syllabus%202024.pdf"], ["April 2025 RCH 201 paper (tupapers mirror)", "https://tupapers-com.pages.dev/course/bba/sixth-semester/business-research-methods/business-research-methods-2025"], ["bimstudies — RCH 201 Exam Question Solution 2025", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-research-methods-exam-question-solution-bitm-6th-sem-2025/"], ["TU FOM — Model Question for BBA BIM and BBM 6th Semester 2025 (fragments)", "https://fomecd.edu.np/cms/dhurbas/Model%20Question%20for%20BBA%20BIM%20and%20BBM%206th%20Semester%202025.pdf"]], "extra": "<h3>Chi-square test of independence (2×2)<\/h3>\n<p>A survey of 120 customers: is gender associated with preference for digital banking?<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Prefers digital<\/th>\n<th>Prefers branch<\/th>\n<th>Total<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Male<\/td>\n<td>40<\/td>\n<td>20<\/td>\n<td>60<\/td>\n<\/tr>\n<tr>\n<td>Female<\/td>\n<td>30<\/td>\n<td>30<\/td>\n<td>60<\/td>\n<\/tr>\n<tr>\n<td>Total<\/td>\n<td>70<\/td>\n<td>50<\/td>\n<td>120<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>H0: gender and preference are independent. H1: they are associated. α = 0.05.\nExpected E = (row total × column total) / N → Male–digital 35, Male–branch 25, Female–digital 35, Female–branch 25.\nχ² = Σ(O−E)²/E = (25/35) + (25/25) + (25/35) + (25/25) = 0.714 + 1 + 0.714 + 1 = <strong>3.43<\/strong>\ndf = (r−1)(c−1) = 1; critical χ²(0.05, 1) = <strong>3.841<\/strong>. Since 3.43 &lt; 3.841, <strong>do not reject H0<\/strong> — no significant association at 5%.<\/p>\n<h3>Chi-square goodness of fit<\/h3>\n<p>Sales of four brands among 120 customers: 30, 20, 25, 45. H0: preference is uniform (E = 30 each).\nχ² = (0 + 100 + 25 + 225)/30 = <strong>11.67<\/strong>; df = 3; critical χ²(0.05, 3) = <strong>7.815<\/strong> → <strong>reject H0<\/strong>: preferences are not equal.<\/p>\n<p><strong>Conditions:<\/strong> frequencies (not percentages), independent observations, expected count ≥ 5 in each cell.<\/p>\n<h3>APA 7th style — common formats<\/h3>\n<ul>\n<li>\n<p><strong>Journal article:<\/strong> Author, A. A., &amp; Author, B. B. (Year). Title of article. <em>Journal Name, Volume<\/em>(Issue), pages. https://doi.org/xxxx\n <em>Example:<\/em> Sharma, R., &amp; Thapa, S. (2023). Service quality and customer satisfaction in Nepalese banks. <em>Journal of Business and Management Research, 8<\/em>(1), 45–60.<\/p>\n<\/li>\n<li>\n<p><strong>Book:<\/strong> Author, A. A. (Year). <em>Title of work<\/em> (ed.). Publisher.<\/p>\n<\/li>\n<li><strong>Website:<\/strong> Organisation. (Year, Month Day). <em>Title<\/em>. Site. URL<\/li>\n<li><strong>In-text:<\/strong> (Sharma &amp; Thapa, 2023) or Sharma and Thapa (2023); three or more authors → (Sharma et al., 2023).<\/li>\n<\/ul>\n<h3>Five-point Likert example<\/h3>\n<p>\"Mobile banking services are easy to use.\" — 1 Strongly disagree · 2 Disagree · 3 Neutral · 4 Agree · 5 Strongly agree.<\/p>\n<p><em>(The example article reference above is illustrative — the names are invented for format practice.)<\/em><\/p>", "extra_title": "Chi-square worked examples and APA quick guide"}, {"code": "IT 275", "id": "IT275", "title": ".NET Programming", "sem": 8, "exam": "2026-12-08", "official": "IT 275: .NET Programming (cover list) — written 'Dot Net Programming' in the course-detail page; Elective II", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, with laboratory work", "note": "Same course under two spellings ('.NET' / 'Dot Net'). IMPORTANT: IT 275–278 are alternatives for Elective II. Students normally sit only ONE of them, and IT 275 shares 8 Dec 2026 with IT 276. Confirm which elective you are registered for.", "marks": "Full Marks 60, Pass 30, 3 hrs (TU Model Question 2026). Group A 10×1 · Group B 5×3 (any 5 of 6) · Group C 3×5 (any 3 of 4) · Group D 2×10.", "objectives": "Explain the .NET ecosystem for GUI application development, teach object-oriented programming in C#, and build user-friendly desktop and web applications.", "units": [{"n": 1, "t": "Introduction to .NET", "lh": 4, "topics": ".NET Framework features and architecture; CLR and Class Library; .NET Framework vs .NET Core; Visual Studio and VS Code; development environment; IntelliSense; project types."}, {"n": 2, "t": "Basics of C#", "lh": 12, "topics": "Data types, operators, variables; control statements; arrays; classes, structures, enumerations; partial, static and sealed classes; constructors and destructors; inheritance and polymorphism; interfaces; virtual methods and abstract classes; exception handling."}, {"n": 3, "t": "Delegates and Strings", "lh": 6, "topics": "Delegates; lambda expressions; events and asynchronous tasks; string manipulation and StringBuilder; generic and non-generic collections."}, {"n": 4, "t": "Entity Framework and LINQ", "lh": 6, "topics": "EF purpose and functionality; Database-First, Code-First, Model-First; LINQ fundamentals and implementation."}, {"n": 5, "t": "Introduction to ASP.NET", "lh": 10, "topics": "ASP.NET vs ASP.NET Core; Web Forms, MVC, Web Pages; simple Web Forms app; MVC architecture — models, views, controllers, URL routing; layouts and Razor syntax; variables, loops, logic in Razor; database interaction in MVC."}, {"n": 6, "t": "Database Programming", "lh": 10, "topics": "ADO.NET architecture; DataReader, DataSet, DataTable, DataAdapter; SqlConnection, SqlCommand, SqlTransaction; CRUD; ExecuteNonQuery, ExecuteReader, ExecuteScalar; stored procedures; working with Entity Framework."}], "avail": "<p><strong>No actual NC paper exists<\/strong> (first sitting December 2026) — <strong>insufficient data<\/strong> for real-exam frequency. The <strong>TU Model Question 2026<\/strong> (Category C) is complete and drives the priorities.<\/p>\n<p><strong>Code note:<\/strong> the code examples in this guide were written to standard C# / ASP.NET syntax and checked by reading, but they <strong>could not be compiled here<\/strong> because no .NET SDK is installed. Test them in Visual Studio during practice.<\/p>\n<p>The old-course 'Dot Net Technology' and BSc CSIT 'NET Centric Computing' papers were <strong>not<\/strong> used.<\/p>", "pattern": "<p><strong>Model 2026:<\/strong> definitions (10) · compare/explain with snippet (6) · architecture with diagram, CRUD, comparison (4) · <strong>two 10-mark application designs<\/strong> (MVC + EF Core CRUD; Web Forms events + StringBuilder).<\/p>\n<p><strong>Unit spread:<\/strong> U1: 5 · U2: 2 · U3: 5 · U4: 3 · U5: 5 · U6: 2. Prepare <strong>code<\/strong> for: exception handling, abstract class vs interface, delegate/event, lambda + LINQ, StringBuilder, EF Code-First DbContext + controller CRUD, ADO.NET CRUD with SqlCommand. TU expects short, correct snippets, not full programs.<\/p>", "papers": [{"id": "M26", "label": "TU Model Question 2026", "cat": "C", "session": "Model (2026)", "source": "TU FOM Model Question 2026", "url": "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf", "note": "Wording retrieved through a text-extraction tool; meaning and marks as printed.", "qs": [{"no": "1", "g": "A", "t": "Define .NET Framework.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "What is CLR?", "m": 1, "u": 1}, {"no": "3", "g": "A", "t": "Name two project types in Visual Studio.", "m": 1, "u": 1}, {"no": "4", "g": "A", "t": "List four generic collections in C#.", "m": 1, "u": 3}, {"no": "5", "g": "A", "t": "Define a delegate.", "m": 1, "u": 3}, {"no": "6", "g": "A", "t": "What is StringBuilder and why is it used?", "m": 1, "u": 3}, {"no": "7", "g": "A", "t": "Name two Entity Framework approaches.", "m": 1, "u": 4}, {"no": "8", "g": "A", "t": "What is Razor syntax?", "m": 1, "u": 5}, {"no": "9", "g": "A", "t": "Name the three main Execute methods of SqlCommand.", "m": 1, "u": 6}, {"no": "10", "g": "A", "t": "What is LINQ?", "m": 1, "u": 4}, {"no": "11", "g": "B", "t": "Compare .NET Framework with .NET Core.", "m": 3, "u": 1}, {"no": "12", "g": "B", "t": "Differentiate an abstract class and an interface with an example.", "m": 3, "u": 2}, {"no": "13", "g": "B", "t": "Explain exception handling with a code snippet.", "m": 3, "u": 2}, {"no": "14", "g": "B", "t": "What are lambda expressions? Give a practical use.", "m": 3, "u": 3}, {"no": "15", "g": "B", "t": "Differentiate Database-First and Code-First approaches.", "m": 3, "u": 4}, {"no": "16", "g": "B", "t": "Write a short note on URL routing in ASP.NET MVC.", "m": 3, "u": 5}, {"no": "17", "g": "C", "t": "Explain .NET Framework architecture (Class Library and CLR).", "m": 5, "u": 1}, {"no": "18", "g": "C", "t": "Explain ASP.NET MVC architecture with a diagram.", "m": 5, "u": 5}, {"no": "19", "g": "C", "t": "Explain how ADO.NET components work together to perform CRUD operations.", "m": 5, "u": 6}, {"no": "20", "g": "C", "t": "Compare Web Forms, MVC and Web Pages; which would you choose for an enterprise application?", "m": 5, "u": 5}, {"no": "21", "g": "D", "t": "Student result management system using ASP.NET MVC and Entity Framework Core: (a) folder structure and role of each layer (b) step-by-step Code-First CRUD for the 'Student' entity.", "m": 10, "u": 5}, {"no": "22", "g": "D", "t": "Online quiz application using ASP.NET Web Forms: (a) use of delegates and events for the 'Submit Answer' click (b) why StringBuilder is better than string for building the result summary.", "m": 10, "u": 3}]}], "notes": {"1": "<p>Microsoft .NET is one of the most widely used platforms for building Windows desktop, web and cloud applications. It provides a runtime, a huge class library and tools so developers can write reliable programs in languages such as C#.<\/p>\n<h3>1.1 What is the .NET Framework? Features<\/h3>\n<p><strong>Definition:<\/strong> the .NET Framework is a software development platform from Microsoft that provides a managed execution environment (the CLR) and an extensive class library for building and running applications on Windows.\n<strong>Features:<\/strong> language interoperability · automatic memory management (garbage collection) · type safety · rich base class library · exception handling · security (code access, role-based) · versioning through assemblies and the GAC · simplified deployment (XCOPY).<\/p>\n<h3>1.2 Architecture and components<\/h3>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Languages: C#, VB.NET, F#<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Applications: WinForms, WPF, ASP.NET, Console, Services<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Framework Class Library (FCL)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Common Language Runtime (CLR)<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Windows OS<\/text><\/svg><\/div>\n\n<ul>\n<li><strong>CLR<\/strong> — execution engine: JIT compiler, garbage collector, CTS, CLS, security, exception handling, thread management, class loader.<\/li>\n<li><strong>FCL/BCL<\/strong> — reusable types organised in namespaces (System, System.IO, System.Collections.Generic, System.Data, System.Linq, System.Net).<\/li>\n<li><strong>Assembly<\/strong> — compiled unit (.exe/.dll) containing MSIL, metadata and a manifest.\n<strong>Execution:<\/strong> source → language compiler → MSIL + metadata → JIT → native code. <em>Managed code<\/em> runs under the CLR; <em>unmanaged code<\/em> runs outside it.<\/li>\n<\/ul>\n<h3>1.3 .NET Framework vs .NET Core<\/h3>\n<p>Framework: Windows-only, mature, Web Forms/WCF support, now in maintenance. .NET Core (now .NET 5/6/7/8+): cross-platform, open source, high performance, side-by-side deployment, <code>dotnet<\/code> CLI, ideal for cloud and microservices.<\/p>\n<h3>1.4 Visual Studio and Visual Studio Code<\/h3>\n<p><strong>Visual Studio:<\/strong> full IDE — designers, debugger, IntelliSense, refactoring, NuGet, Git, testing, profiling. <strong>VS Code:<\/strong> lightweight, cross-platform editor with extensions (C# Dev Kit) and an integrated terminal.<\/p>\n<h3>1.5 Setting up the development environment<\/h3>\n<p>Install Visual Studio with workloads (\".NET desktop development\", \"ASP.NET and web development\") or install the .NET SDK + VS Code; verify with <code>dotnet --version<\/code>; create projects with <code>dotnet new console -n Demo<\/code>, run with <code>dotnet run<\/code>.<\/p>\n<h3>1.6 IntelliSense<\/h3>\n<p>Context-aware code completion: member lists, parameter info, quick info, complete word; reduces typing errors and helps discover APIs.<\/p>\n<h3>1.7 Project types<\/h3>\n<p>Console App · Windows Forms · WPF · ASP.NET Web Forms/MVC · ASP.NET Core (MVC, Razor Pages, Web API, Blazor) · Class Library · Unit Test · Worker Service · MAUI (cross-platform apps).<\/p>\n<p><strong>Key points:<\/strong> definition and features · stack diagram · CLR parts · compilation flow · Framework vs Core · VS/VS Code · project types.<\/p>", "2": "<p>C# (pronounced \"C sharp\") is a modern, type-safe, object-oriented language and the main language of .NET. Mastering its basics — types, control flow and OOP — is essential for every later unit.<\/p>\n<h3>2.1 Data types, operators and variables<\/h3>\n<p><strong>Value types:<\/strong> int, long, float, double, decimal, char, bool, struct, enum. <strong>Reference types:<\/strong> string, object, class, interface, delegate, array. <code>var<\/code> for implicit typing; <code>const<\/code> and <code>readonly<\/code>; nullable types (<code>int?<\/code>).\n<strong>Operators:<\/strong> arithmetic, relational, logical (&amp;&amp;, ||, !), assignment, increment/decrement, conditional (?:), null-coalescing (??), <code>is<\/code>/<code>as<\/code>.\n<strong>Type conversion:<\/strong> implicit, explicit (casting), <code>Convert.ToInt32<\/code>, <code>int.Parse<\/code>, <code>int.TryParse<\/code>; boxing and unboxing.<\/p>\n<h3>2.2 Control statements<\/h3>\n<p>Selection: <code>if<\/code>, <code>if-else<\/code>, <code>switch<\/code> (including switch expressions). Iteration: <code>for<\/code>, <code>while<\/code>, <code>do-while<\/code>, <code>foreach<\/code>. Jump: <code>break<\/code>, <code>continue<\/code>, <code>return<\/code>, <code>goto<\/code>.<\/p>\n<h3>2.3 Arrays<\/h3>\n<p>Single-dimensional <code>int[] a = new int[5];<\/code> · multi-dimensional <code>int[,] m = new int[3,3];<\/code> · jagged <code>int[][] j<\/code>; <code>Length<\/code>, <code>Array.Sort<\/code>, <code>Array.Reverse<\/code>.<\/p>\n<h3>2.4 Classes, structures and enumerations<\/h3>\n<p><strong>Class<\/strong> — blueprint with fields, properties, methods, events; supports inheritance. <strong>Struct<\/strong> — lightweight value type, no inheritance. <strong>Enum<\/strong> — named constants. Access modifiers: public, private, protected, internal, protected internal. Properties with get/set; auto-properties.<\/p>\n<h3>2.5 Partial, static and sealed classes<\/h3>\n<p>Partial — split across files. Static — only static members, cannot be instantiated. Sealed — cannot be inherited.<\/p>\n<h3>2.6 Constructors and destructors<\/h3>\n<p>Constructor types: default, parameterised, copy, static, private; constructor chaining with <code>this(...)<\/code> and <code>base(...)<\/code>. Destructor/finaliser <code>~ClassName()<\/code> called by the GC; prefer <code>IDisposable<\/code> and <code>using<\/code>.<\/p>\n<h3>2.7 Inheritance and polymorphism<\/h3>\n<p>Inheritance (<code>class B : A<\/code>), single class inheritance, multiple interfaces. Polymorphism: compile-time (overloading) and run-time (overriding with <code>virtual<\/code>/<code>override<\/code>); method hiding with <code>new<\/code>.<\/p>\n<h3>2.8 Interfaces<\/h3>\n<p>Contracts declared with <code>interface<\/code>; a class can implement many; used for loose coupling and dependency injection.<\/p>\n<h3>2.9 Virtual methods and abstract classes<\/h3>\n<p>Virtual methods have a default implementation that can be overridden; abstract methods have none and must be overridden; an abstract class cannot be instantiated.<\/p>\n<h3>2.10 Exception handling<\/h3>\n<p><code>try<\/code>, <code>catch<\/code>, <code>finally<\/code>, <code>throw<\/code>; specific to general catch order; custom exceptions derived from <code>Exception<\/code>; <code>using<\/code> for resource cleanup.<\/p>\n<p><strong>Key points:<\/strong> value vs reference types · operators · control flow · arrays · class/struct/enum · special classes · constructors · OOP pillars · interfaces vs abstract · exceptions.<\/p>", "3": "<p>Delegates and events let one piece of code call another without being tightly connected — the basis of GUI event handling. Strings and collections are used in almost every program.<\/p>\n<h3>3.1 Delegates<\/h3>\n<p>A <strong>delegate<\/strong> is a type-safe reference to a method. Steps: declare (<code>delegate int Calc(int a, int b);<\/code>), instantiate (<code>Calc c = Add;<\/code>), invoke (<code>c(2, 3)<\/code>). <strong>Multicast delegates<\/strong> hold several methods (<code>+=<\/code>). Built-in generic delegates: <code>Func&lt;&gt;<\/code> (returns a value), <code>Action&lt;&gt;<\/code> (void), <code>Predicate&lt;T&gt;<\/code> (bool).<\/p>\n<h3>3.2 Lambda expressions<\/h3>\n<p>Anonymous functions <code>(x, y) =&gt; x + y<\/code>; expression and statement lambdas; used with LINQ, delegates and events; capture outer variables (closures).<\/p>\n<h3>3.3 Event handling<\/h3>\n<p>An <strong>event<\/strong> is a delegate-based notification. Publisher declares <code>public event EventHandler Clicked;<\/code> and raises it (<code>Clicked?.Invoke(this, EventArgs.Empty)<\/code>); subscribers attach handlers (<code>obj.Clicked += Handler;<\/code>). The standard handler signature is <code>(object sender, EventArgs e)<\/code>.<\/p>\n<h3>3.4 Asynchronous tasks<\/h3>\n<p><code>Task<\/code> and <code>Task&lt;T&gt;<\/code> represent asynchronous work; <code>async<\/code>/<code>await<\/code> keep UIs responsive and servers scalable during I/O (web calls, database queries); <code>Task.Run<\/code> for CPU work; <code>Task.WhenAll<\/code> for parallel tasks.<\/p>\n<h3>3.5 String manipulation and StringBuilder<\/h3>\n<p>Strings are immutable. Methods: <code>Length, ToUpper, ToLower, Trim, Substring, IndexOf, Replace, Split, Contains, StartsWith, string.Join, string.Format<\/code>, interpolation <code>$\"...\"<\/code>. <strong>StringBuilder<\/strong> (System.Text) is mutable and efficient for repeated appends: <code>Append, AppendLine, Insert, Remove, Replace, ToString<\/code>.<\/p>\n<h3>3.6 Generic and non-generic collections<\/h3>\n<p><strong>Generic<\/strong> (type-safe): <code>List&lt;T&gt;, Dictionary&lt;K,V&gt;, Queue&lt;T&gt;, Stack&lt;T&gt;, HashSet&lt;T&gt;, LinkedList&lt;T&gt;, SortedList&lt;K,V&gt;<\/code>. <strong>Non-generic<\/strong>: <code>ArrayList, Hashtable, Queue, Stack<\/code> (store object, need casting). Generics give type safety, no boxing and better performance.<\/p>\n<p><strong>Key points:<\/strong> delegate steps and built-ins · lambdas · event pattern · async/await · string methods vs StringBuilder · collection types.<\/p>", "4": "<p>Writing raw SQL for every database operation is slow and error-prone. Entity Framework maps tables to C# classes, and LINQ lets programmers query any data source with the same C# syntax.<\/p>\n<h3>4.1 Entity Framework: purpose and functionality<\/h3>\n<p>EF/EF Core is an <strong>ORM (object-relational mapper)<\/strong>. Functions: mapping classes ↔ tables, LINQ-to-Entities queries translated to SQL, change tracking, <code>SaveChanges()<\/code> for inserts/updates/deletes, migrations, relationships (one-to-many, many-to-many), lazy/eager loading (<code>Include<\/code>). Core pieces: <strong>DbContext<\/strong> and <strong>DbSet<T><\/strong>.<\/p>\n<h3>4.2 Database-First approach<\/h3>\n<p>Start from an existing database; generate entity classes and context (<code>Scaffold-DbContext \"connection\" Microsoft.EntityFrameworkCore.SqlServer -OutputDir Models<\/code>). Good for legacy systems.<\/p>\n<h3>4.3 Code-First approach<\/h3>\n<p>Write POCO classes and a DbContext first; EF creates/updates the database through migrations (<code>Add-Migration Initial<\/code>, <code>Update-Database<\/code>). Configuration by conventions, data annotations (<code>[Key]<\/code>, <code>[Required]<\/code>, <code>[MaxLength]<\/code>) or the Fluent API.<\/p>\n<h3>4.4 Model-First approach<\/h3>\n<p>Design an EDMX visual model, then generate the database and classes (EF6; not supported in EF Core).<\/p>\n<h3>4.5 LINQ fundamentals and implementation<\/h3>\n<p><strong>LINQ<\/strong> queries collections, databases (LINQ to Entities/SQL), XML and more. Syntax: query (<code>from … where … select<\/code>) and method (<code>.Where().Select()<\/code>). Operators: filtering (Where), projection (Select), ordering (OrderBy), grouping (GroupBy), joining (Join), aggregation (Count, Sum, Average, Max), element (First, Single), quantifiers (Any, All). <strong>Deferred execution<\/strong> — the query runs when enumerated; <code>ToList()<\/code> forces execution.<\/p>\n<p><strong>Key points:<\/strong> ORM functions · DbContext/DbSet · three approaches and commands · LINQ syntaxes and operators · deferred execution.<\/p>", "5": "<p>ASP.NET is Microsoft's framework for building dynamic websites and web applications. It offers several programming models, of which MVC is the most widely used for large applications.<\/p>\n<h3>5.1 ASP.NET vs ASP.NET Core<\/h3>\n<p>ASP.NET (on .NET Framework) — Windows/IIS, Web Forms, MVC 5, Web API 2. ASP.NET Core — cross-platform, open source, unified MVC + Web API, built-in dependency injection, middleware pipeline, Kestrel server, high performance, cloud-ready.<\/p>\n<h3>5.2 Web Forms, ASP.NET MVC and ASP.NET Web Pages<\/h3>\n<ul>\n<li><strong>Web Forms:<\/strong> event-driven pages (.aspx) with server controls, ViewState and postbacks; rapid development; less control over HTML.<\/li>\n<li><strong>MVC:<\/strong> separation into models, views and controllers; testable; clean URLs.<\/li>\n<li><strong>Web Pages:<\/strong> simple single-page model with Razor (.cshtml), suited for small sites.<\/li>\n<\/ul>\n<h3>5.3 Building a simple Web Forms application<\/h3>\n<p>Create an ASP.NET Web Application (Web Forms) → add a page → drag server controls (<code>asp:TextBox<\/code>, <code>asp:Button<\/code>, <code>asp:Label<\/code>) → double-click the button to create <code>btnSubmit_Click<\/code> → write code-behind (<code>lblMsg.Text = \"Hello \" + txtName.Text;<\/code>) → run. <strong>Page life cycle:<\/strong> PreInit → Init → Load → control events → PreRender → Render → Unload; <code>IsPostBack<\/code> to distinguish first load.<\/p>\n<h3>5.4 MVC architecture<\/h3>\n<p>Models (data and rules), Views (UI), Controllers (handle requests, return <code>ActionResult<\/code> such as <code>View()<\/code>, <code>RedirectToAction()<\/code>, <code>Json()<\/code>). Passing data: strongly typed models, ViewBag, ViewData, TempData. Model binding and validation (data annotations, <code>ModelState.IsValid<\/code>).<\/p>\n<h3>5.5 URL routing<\/h3>\n<p>Conventional routes <code>{controller=Home}/{action=Index}/{id?}<\/code> and attribute routes <code>[Route(\"products/{id:int}\")]<\/code>; constraints and defaults; SEO-friendly URLs.<\/p>\n<h3>5.6 Layouts and Razor syntax<\/h3>\n<p><code>_Layout.cshtml<\/code> defines the common page shell with <code>@RenderBody()<\/code> and sections; <code>_ViewStart.cshtml<\/code> sets the layout; partial views for reuse. Razor uses <code>@<\/code> for expressions, <code>@{ }<\/code> for code blocks, <code>@model<\/code> for strong typing, and tag helpers (<code>asp-for<\/code>, <code>asp-action<\/code>).<\/p>\n<h3>5.7 Variables, loops and logical expressions in Razor<\/h3>\n<p><code>@{ var total = 0; }<\/code> · <code>@foreach (var p in Model) { … }<\/code> · <code>@for (int i = 0; i &lt; 5; i++) { … }<\/code> · <code>@if (Model.Count == 0) { &lt;p&gt;No data&lt;/p&gt; } else { … }<\/code> · <code>@switch<\/code>.<\/p>\n<h3>5.8 Database interaction in ASP.NET MVC<\/h3>\n<p>Register DbContext via dependency injection, inject it into controllers, perform CRUD with EF Core (<code>ToListAsync<\/code>, <code>FindAsync<\/code>, <code>Add<\/code>, <code>Update<\/code>, <code>Remove<\/code>, <code>SaveChangesAsync<\/code>), scaffold controllers and views, validate input, protect with anti-forgery tokens.<\/p>\n<p><strong>Key points:<\/strong> ASP.NET vs Core · three models · Web Forms life cycle · MVC roles and results · routing · layouts and Razor · Razor control flow · EF in MVC.<\/p>", "6": "<p>Most business applications store data in a relational database. ADO.NET is the core .NET technology for talking to databases directly; Entity Framework builds on top of it.<\/p>\n<h3>6.1 ADO.NET architecture<\/h3>\n<p>Two parts: <strong>data providers<\/strong> (connected: Connection, Command, DataReader, DataAdapter — e.g. <code>System.Data.SqlClient<\/code> / <code>Microsoft.Data.SqlClient<\/code> for SQL Server) and the <strong>DataSet<\/strong> (disconnected in-memory store). Connected model = fast forward-only reading; disconnected model = work offline and sync later.<\/p>\n<h3>6.2 DataReader, DataSet, DataTable and DataAdapter<\/h3>\n<ul>\n<li><strong>DataReader:<\/strong> forward-only, read-only stream; fastest; needs an open connection.<\/li>\n<li><strong>DataSet:<\/strong> in-memory database with DataTables, DataRelations and constraints; disconnected; supports XML.<\/li>\n<li><strong>DataTable:<\/strong> one in-memory table of rows and columns.<\/li>\n<li><strong>DataAdapter:<\/strong> bridge that <code>Fill()<\/code>s a DataSet and <code>Update()<\/code>s changes back using its Select/Insert/Update/Delete commands.<\/li>\n<\/ul>\n<h3>6.3 Connection classes: SqlConnection, SqlCommand, SqlTransaction<\/h3>\n<p><code>SqlConnection<\/code> (connection string, <code>Open<\/code>, <code>Close<\/code>, use <code>using<\/code>), <code>SqlCommand<\/code> (CommandText, CommandType, Parameters), <code>SqlTransaction<\/code> (<code>BeginTransaction<\/code>, <code>Commit<\/code>, <code>Rollback<\/code>). Connection pooling improves performance.<\/p>\n<h3>6.4 CRUD operations<\/h3>\n<p>INSERT, SELECT, UPDATE, DELETE via commands with <strong>parameterised queries<\/strong> (prevent SQL injection); bind results to grids.<\/p>\n<h3>6.5 Command execution methods<\/h3>\n<p><code>ExecuteNonQuery()<\/code> (rows affected — INSERT/UPDATE/DELETE/DDL) · <code>ExecuteReader()<\/code> (SqlDataReader — SELECT) · <code>ExecuteScalar()<\/code> (single value — COUNT, MAX).<\/p>\n<h3>6.6 Stored procedures<\/h3>\n<p>Precompiled SQL stored in the database. Call with <code>CommandType.StoredProcedure<\/code> and parameters (input and output). Benefits: performance, security, reusability, reduced network traffic.<\/p>\n<h3>6.7 Working with Entity Framework<\/h3>\n<p>Higher-level alternative: DbContext replaces manual connection/command code; LINQ replaces SQL strings; EF can also call stored procedures (<code>FromSqlRaw<\/code>) and run raw SQL when needed.<\/p>\n<p><strong>Key points:<\/strong> connected vs disconnected · object roles · connection/command/transaction · parameterised CRUD · three Execute methods · stored procedures · EF vs ADO.NET.<\/p>"}, "qa": [{"id": "IT275-01", "t": ".NET Framework definition, features, architecture; CLR", "u": 1, "q": "Define .NET Framework and CLR. Explain the .NET Framework architecture (Class Library and CLR).", "m": 5, "p": "High", "ty": "Architecture + diagram", "seen": {"M26": "A1, A2, Q17"}, "rep": false, "src": "TU Model Question 2026 A1, A2, Q17", "a": "<p><strong>.NET Framework<\/strong> is Microsoft's software development platform for building and running Windows desktop, web and service applications. It provides a runtime (the CLR), a large class library and language interoperability (C#, VB.NET, F#).<\/p>\n<p><strong>Features:<\/strong> language interoperability (CLS/CTS) · automatic memory management (garbage collection) · type safety · huge base class library · security · exception handling · versioning (assemblies, GAC) · simplified deployment.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 178\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Applications: Windows Forms, WPF, ASP.NET Web Forms / MVC, Console, Services<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Framework Class Library (FCL/BCL): System, IO, Collections, Data (ADO.NET), Web, Windows.Forms<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Common Language Runtime (CLR)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Operating system (Windows)<\/text><\/svg><\/div>\n\n<p><strong>Compilation and execution<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">C# source code<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">C# compiler (csc)<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">MSIL + metadata<\/text><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(assembly<\/text><text x=\"382.0\" y=\"55.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">.exe/.dll)<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">CLR JIT compiler<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Native machine<\/text><text x=\"698.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">code<\/text><\/svg><\/div>\n\n<p><strong>CLR (Common Language Runtime)<\/strong> — the execution engine. Components/services:<\/p>\n<ul>\n<li><strong>JIT compiler<\/strong> — converts MSIL to native code at run time.<\/li>\n<li><strong>Garbage collector<\/strong> — automatic memory management.<\/li>\n<li><strong>Common Type System (CTS)<\/strong> — common data types across languages.<\/li>\n<li><strong>Common Language Specification (CLS)<\/strong> — rules for language interoperability.<\/li>\n<li><strong>Code access security<\/strong>, <strong>exception manager<\/strong>, <strong>thread support<\/strong>, <strong>class loader<\/strong>, <strong>type checker<\/strong>.<\/li>\n<\/ul>\n<p><strong>Framework Class Library (FCL):<\/strong> reusable classes, interfaces and value types — namespaces such as <code>System<\/code>, <code>System.IO<\/code>, <code>System.Collections.Generic<\/code>, <code>System.Data<\/code>, <code>System.Linq<\/code>, <code>System.Web<\/code>.<\/p>"}, {"id": "IT275-02", "t": ".NET Framework vs .NET Core", "u": 1, "q": "Compare .NET Framework with .NET Core.", "m": 3, "p": "High", "ty": "Comparison", "seen": {"M26": "Q11"}, "rep": false, "src": "TU Model Question 2026 Q11", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>.NET Framework<\/th>\n<th>.NET Core (now \".NET 5+\")<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Platform<\/td>\n<td>Windows only<\/td>\n<td>Cross-platform (Windows, Linux, macOS)<\/td>\n<\/tr>\n<tr>\n<td>Source<\/td>\n<td>Mostly proprietary<\/td>\n<td>Open source (GitHub)<\/td>\n<\/tr>\n<tr>\n<td>Deployment<\/td>\n<td>Machine-wide install<\/td>\n<td>Side-by-side, self-contained possible<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>Good<\/td>\n<td>Higher, optimised<\/td>\n<\/tr>\n<tr>\n<td>App types<\/td>\n<td>WinForms, WPF, Web Forms, WCF<\/td>\n<td>Console, ASP.NET Core, microservices, cloud; WinForms/WPF on Windows<\/td>\n<\/tr>\n<tr>\n<td>Web Forms<\/td>\n<td>Supported<\/td>\n<td>Not supported<\/td>\n<\/tr>\n<tr>\n<td>Containers / microservices<\/td>\n<td>Limited<\/td>\n<td>Designed for Docker/cloud<\/td>\n<\/tr>\n<tr>\n<td>CLI tools<\/td>\n<td>Limited<\/td>\n<td><code>dotnet<\/code> CLI<\/td>\n<\/tr>\n<tr>\n<td>Status<\/td>\n<td>Maintenance (4.8.x final)<\/td>\n<td>Actively developed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT275-03", "t": "Visual Studio, VS Code, IntelliSense, project types", "u": 1, "q": "Give an overview of Visual Studio and VS Code. What is IntelliSense? Name the project types.", "m": 3, "p": "Medium", "ty": "Explanation", "seen": {"M26": "A3"}, "rep": false, "src": "TU Model Question 2026 A3", "a": "<p><strong>Visual Studio:<\/strong> a full IDE (Windows/Mac) with designer, debugger, profiler, NuGet, Git, database tools; editions Community, Professional, Enterprise.\n<strong>Visual Studio Code:<\/strong> a lightweight, cross-platform code editor with extensions (C# Dev Kit) and an integrated terminal; works with the <code>dotnet<\/code> CLI.\n<strong>IntelliSense:<\/strong> code-completion aid that shows member lists, parameter info, quick info and auto-complete as you type — speeds coding and reduces errors.\n<strong>Project types:<\/strong> Console App · Windows Forms App · WPF App · ASP.NET Web Application (Web Forms/MVC) · ASP.NET Core Web App (MVC/Razor Pages/Web API) · Class Library · Unit Test project · Blazor.<\/p>"}, {"id": "IT275-04", "t": "Data types, control statements, arrays", "u": 2, "q": "Explain value types and reference types in C# with control statements and arrays.", "m": 3, "p": "Coverage", "ty": "Code", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Value types<\/strong> (stored on the stack; hold data directly): <code>int, long, float, double, decimal, char, bool, struct, enum<\/code>.\n<strong>Reference types<\/strong> (heap; hold a reference): <code>string, class, interface, delegate, array, object<\/code>.\n<strong>Boxing:<\/strong> value → object; <strong>unboxing:<\/strong> object → value.<\/p>\n<pre><code class=\"language-csharp\">int[] marks = { 78, 92, 65, 88 };\nint total = 0;\nforeach (int m in marks)\n{\n    if (m &gt;= 80) Console.WriteLine($&quot;{m}: Distinction&quot;);\n    else if (m &gt;= 60) Console.WriteLine($&quot;{m}: First division&quot;);\n    else Console.WriteLine($&quot;{m}: Other&quot;);\n    total += m;\n}\nConsole.WriteLine(&quot;Average = &quot; + (total / (double)marks.Length));   // 80.75\nint[,] matrix = new int[2, 3];     // 2-D array\nint[][] jagged = new int[2][];     // jagged array\n<\/code><\/pre>\n<p>Control statements: <code>if/else, switch, for, while, do-while, foreach, break, continue, return, goto<\/code>.<\/p>"}, {"id": "IT275-05", "t": "Classes, struct, enum; partial/static/sealed; constructors/destructors", "u": 2, "q": "Explain classes, structures and enumerations, and partial, static and sealed classes, with constructors and destructors.", "m": 5, "p": "Medium", "ty": "Code", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<pre><code class=\"language-csharp\">enum Grade { A, B, C, F }                       // named constants\n\nstruct Point { public int X, Y; }               // value type, no inheritance\n\npublic partial class Student { public string Name { get; set; } }   // file 1\npublic partial class Student { public void Show() =&gt; Console.WriteLine(Name); } // file 2\n\npublic static class MathUtil                    // cannot be instantiated\n{ public static int Square(int n) =&gt; n * n; }\n\npublic sealed class Config { }                  // cannot be inherited\n\npublic class Account\n{\n    public string Holder; public decimal Balance;\n    public Account() : this(&quot;Unknown&quot;, 0) { }                  // default constructor\n    public Account(string h, decimal b) { Holder = h; Balance = b; }  // parameterised\n    static Account() { Console.WriteLine(&quot;Static ctor runs once&quot;); }\n    ~Account() { Console.WriteLine(&quot;Destructor (finaliser) called by GC&quot;); }\n}\n<\/code><\/pre>\n<ul>\n<li><strong>Class vs struct:<\/strong> reference vs value type; structs can't inherit and are best for small data.<\/li>\n<li><strong>Partial class:<\/strong> one class split across files (designer + user code in Web Forms/WinForms).<\/li>\n<li><strong>Static class:<\/strong> only static members; utility functions.<\/li>\n<li><strong>Sealed class:<\/strong> prevents inheritance (security/design).<\/li>\n<li><strong>Constructor:<\/strong> initialises an object, same name as class, no return type; types: default, parameterised, copy, static, private.<\/li>\n<li><strong>Destructor:<\/strong> <code>~ClassName()<\/code>, called by the garbage collector; use <code>IDisposable<\/code>/<code>using<\/code> for deterministic cleanup.<\/li>\n<\/ul>"}, {"id": "IT275-06", "t": "Inheritance and polymorphism; virtual methods", "u": 2, "q": "Explain inheritance and polymorphism in C# with virtual and override.", "m": 5, "p": "Medium", "ty": "Code", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<pre><code class=\"language-csharp\">public class Shape\n{\n    public virtual double Area() =&gt; 0;          // can be overridden\n}\npublic class Circle : Shape\n{\n    double r; public Circle(double r) { this.r = r; }\n    public override double Area() =&gt; Math.PI * r * r;\n}\npublic class Rectangle : Shape\n{\n    double w, h; public Rectangle(double w, double h) { this.w = w; this.h = h; }\n    public override double Area() =&gt; w * h;\n}\n// Runtime polymorphism (dynamic binding):\nShape[] shapes = { new Circle(1), new Rectangle(2, 3) };\nforeach (Shape s in shapes) Console.WriteLine(s.Area());   // 3.14159..., 6\n<\/code><\/pre>\n<ul>\n<li><strong>Inheritance:<\/strong> a derived class reuses base members (single inheritance of classes; multiple via interfaces).<\/li>\n<li><strong>Compile-time polymorphism:<\/strong> method overloading (same name, different parameters), operator overloading — <em>static binding<\/em>.<\/li>\n<li><strong>Run-time polymorphism:<\/strong> <code>virtual<\/code> + <code>override<\/code>, resolved at run time — <em>dynamic binding<\/em>.<\/li>\n<li><code>base<\/code> calls the parent; <code>new<\/code> hides a member; <code>sealed override<\/code> stops further overriding.<\/li>\n<\/ul>"}, {"id": "IT275-07", "t": "Abstract class vs interface", "u": 2, "q": "Differentiate an abstract class and an interface with an example.", "m": 3, "p": "High", "ty": "Comparison + code", "seen": {"M26": "Q12"}, "rep": false, "src": "TU Model Question 2026 Q12", "a": "<pre><code class=\"language-csharp\">public abstract class Employee                 // abstract class\n{\n    public string Name { get; set; }\n    public abstract decimal Salary();          // no body — must be overridden\n    public void Show() =&gt; Console.WriteLine($&quot;{Name}: {Salary()}&quot;);  // concrete method\n}\npublic interface IBonus { decimal Bonus(); }   // interface: contract only\n\npublic class Manager : Employee, IBonus\n{\n    public override decimal Salary() =&gt; 80000;\n    public decimal Bonus() =&gt; 10000;\n}\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Abstract class<\/th>\n<th>Interface<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Can have abstract <strong>and<\/strong> concrete methods, fields, constructors<\/td>\n<td>Members are a contract (default implementations only from C# 8) ; no instance fields or constructors<\/td>\n<\/tr>\n<tr>\n<td>Single inheritance only<\/td>\n<td>A class can implement many interfaces<\/td>\n<\/tr>\n<tr>\n<td>Access modifiers allowed<\/td>\n<td>Members public by default<\/td>\n<\/tr>\n<tr>\n<td>\"is-a\" relationship, shared base code<\/td>\n<td>\"can-do\" capability<\/td>\n<\/tr>\n<tr>\n<td><code>abstract class<\/code>, <code>override<\/code><\/td>\n<td><code>interface<\/code>, implemented directly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT275-08", "t": "Exception handling", "u": 2, "q": "Explain exception handling in C# with a code snippet.", "m": 3, "p": "High", "ty": "Code", "seen": {"M26": "Q13"}, "rep": false, "src": "TU Model Question 2026 Q13", "a": "<p>An <strong>exception<\/strong> is a run-time error. C# handles it with <code>try<\/code>, <code>catch<\/code>, <code>finally<\/code> and <code>throw<\/code>.<\/p>\n<pre><code class=\"language-csharp\">try\n{\n    Console.Write(&quot;Enter divisor: &quot;);\n    int d = int.Parse(Console.ReadLine());   // may throw FormatException\n    int result = 100 / d;                    // may throw DivideByZeroException\n    Console.WriteLine(&quot;Result = &quot; + result);\n}\ncatch (DivideByZeroException ex) { Console.WriteLine(&quot;Cannot divide by zero: &quot; + ex.Message); }\ncatch (FormatException)          { Console.WriteLine(&quot;Please enter a number.&quot;); }\ncatch (Exception ex)             { Console.WriteLine(&quot;Error: &quot; + ex.Message); }   // general, last\nfinally                          { Console.WriteLine(&quot;Done.&quot;); }  // always runs\n\n// Custom exception\npublic class InsufficientBalanceException : Exception\n{ public InsufficientBalanceException(string msg) : base(msg) { } }\n// throw new InsufficientBalanceException(&quot;Balance too low&quot;);\n<\/code><\/pre>\n<p><strong>Rules:<\/strong> specific catch blocks before general ones; <code>finally<\/code> releases resources; all exceptions derive from <code>System.Exception<\/code>.<\/p>"}, {"id": "IT275-09", "t": "Delegates and events (quiz 'Submit Answer')", "u": 3, "q": "Online quiz application using ASP.NET Web Forms: (a) explain how delegates and events handle the 'Submit Answer' click; (b) why is StringBuilder better than string for building the result summary?", "m": 10, "p": "High", "ty": "Code + design", "seen": {"M26": "A5, Q22"}, "rep": false, "src": "TU Model Question 2026 A5, Q22", "a": "<p><strong>Delegate:<\/strong> a type-safe function pointer — an object that references a method with a specific signature. <strong>Event:<\/strong> a notification mechanism built on delegates; a publisher raises it and subscribers' handlers run.<\/p>\n<p><strong>(a) Delegates and events in Web Forms<\/strong>\nIn Web Forms, a <code>Button<\/code> exposes a <code>Click<\/code> event of type <code>EventHandler<\/code> (a built-in delegate: <code>void (object sender, EventArgs e)<\/code>). We subscribe a handler method; when the user clicks, the page posts back, ASP.NET raises the event and the delegate invokes our method.<\/p>\n<pre><code class=\"language-aspx\">&lt;asp:Label ID=&quot;lblQuestion&quot; runat=&quot;server&quot; /&gt;\n&lt;asp:RadioButtonList ID=&quot;rblOptions&quot; runat=&quot;server&quot; /&gt;\n&lt;asp:Button ID=&quot;btnSubmit&quot; runat=&quot;server&quot; Text=&quot;Submit Answer&quot; OnClick=&quot;btnSubmit_Click&quot; /&gt;\n&lt;asp:Label ID=&quot;lblResult&quot; runat=&quot;server&quot; /&gt;\n<\/code><\/pre>\n<pre><code class=\"language-csharp\">public partial class Quiz : System.Web.UI.Page\n{\n    // custom delegate + event raised when an answer is checked\n    public delegate void AnswerCheckedHandler(bool isCorrect);\n    public event AnswerCheckedHandler AnswerChecked;\n\n    protected void Page_Load(object sender, EventArgs e)\n    {\n        AnswerChecked += UpdateScore;              // subscribe\n    }\n    protected void btnSubmit_Click(object sender, EventArgs e)   // EventHandler delegate\n    {\n        bool correct = rblOptions.SelectedValue == &quot;B&quot;;\n        AnswerChecked?.Invoke(correct);            // raise event\n    }\n    private void UpdateScore(bool isCorrect)\n    {\n        int score = (int)(ViewState[&quot;Score&quot;] ?? 0);\n        if (isCorrect) score++;\n        ViewState[&quot;Score&quot;] = score;                // keep score across postbacks\n        lblResult.Text = isCorrect ? &quot;Correct!&quot; : &quot;Wrong answer&quot;;\n    }\n}\n<\/code><\/pre>\n<p>The <code>OnClick<\/code> attribute wires <code>btnSubmit.Click += btnSubmit_Click;<\/code> (multicast delegates can call several handlers, e.g. score update and logging).<\/p>\n<p><strong>(b) StringBuilder vs string<\/strong>\n<code>string<\/code> is <strong>immutable<\/strong> — each <code>+=<\/code> creates a new string object and copies the text, which is slow and wastes memory in loops. <code>StringBuilder<\/code> (<code>System.Text<\/code>) is <strong>mutable<\/strong> — it appends into an internal buffer.<\/p>\n<pre><code class=\"language-csharp\">var sb = new StringBuilder();\nsb.AppendLine(&quot;Quiz Result Summary&quot;);\nfor (int i = 0; i &lt; answers.Count; i++)\n    sb.AppendLine($&quot;Q{i + 1}: {(answers[i] ? &quot;Correct&quot; : &quot;Wrong&quot;)}&quot;);\nsb.Append(&quot;Total score: &quot;).Append(score).Append(&quot;/&quot;).Append(answers.Count);\nlblResult.Text = sb.ToString().Replace(Environment.NewLine, &quot;&lt;br/&gt;&quot;);\n<\/code><\/pre>\n<p>For many questions, <code>StringBuilder<\/code> avoids creating dozens of temporary strings → better performance and lower memory use.<\/p>"}, {"id": "IT275-10", "t": "Lambda expressions and async tasks", "u": 3, "q": "What are lambda expressions? Give a practical use. How are asynchronous tasks written?", "m": 3, "p": "High", "ty": "Code", "seen": {"M26": "Q14"}, "rep": false, "src": "TU Model Question 2026 Q14", "a": "<p>A <strong>lambda expression<\/strong> is an anonymous function written with <code>=&gt;<\/code>: <code>(parameters) =&gt; expression<\/code> or a statement block. Used with delegates (<code>Func&lt;&gt;<\/code>, <code>Action&lt;&gt;<\/code>), LINQ and event handlers.<\/p>\n<pre><code class=\"language-csharp\">Func&lt;int, int&gt; square = x =&gt; x * x;            // 5 -&gt; 25\nAction&lt;string&gt; greet = n =&gt; Console.WriteLine(&quot;Hi &quot; + n);\nList&lt;int&gt; marks
