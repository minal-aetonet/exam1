chniques; dashboard design and best practices.<\/span><\/li><li><b>BI Tools and Technologies<\/b> (12 LH): <span class=\"small\">Popular BI tools (Tableau, Power BI); hands-on data analysis and reporting; introduction to OLAP.<\/span><\/li><li><b>BI Implementation<\/b> (8 LH): <span class=\"small\">Best practices; challenges and considerations; case studies of successful implementations.<\/span><\/li><\/ol><h3>RCH 201 — Business Research Methods<\/h3><ol><li><b>Introduction<\/b> (8 LH): <span class=\"small\">Meaning and features of scientific research; basic vs applied research; research process; positivism vs interpretivism; management research and decision-making; scientific thinking for business problems; ethics in business research.<\/span><\/li><li><b>Literature Searching and Theoretical Framework<\/b> (5 LH): <span class=\"small\">Literature survey (concept, purpose, steps); online literature search; theoretical framework; research problem; objectives; hypothesis formulation; deductive vs inductive approaches.<\/span><\/li><li><b>Research Design<\/b> (5 LH): <span class=\"small\">Concept; quantitative designs (descriptive, correlational, causal-comparative, experimental); qualitative designs (case study, ethnography, grounded theory).<\/span><\/li><li><b>Measurement, Scaling and Sampling<\/b> (8 LH): <span class=\"small\">Variables (independent, dependent, moderating); scales (nominal, ordinal, interval, ratio); attitude scales — rank order, semantic differential, Likert; validity and reliability; measurement problems; sampling process; probability (simple random, systematic, stratified, cluster) and non-probability (convenience, judgemental, quota) sampling; sampling and non-sampling errors; sample size.<\/span><\/li><li><b>Data Collection and Analysis<\/b> (12 LH): <span class=\"small\">Secondary and primary data; questionnaire design; face-to-face, telephone and computer-assisted interviews; observation; tables, charts, graphs; descriptive and inferential statistics; qualitative data collection; content, narrative, discourse and grounded-theory analysis; chi-square tests (goodness of fit, independence).<\/span><\/li><li><b>Research Proposal and Report Writing<\/b> (10 LH): <span class=\"small\">Topic selection; proposal purpose, types, structure; report-writing process and style; typing and layout; APA citation and referencing; qualities of a good report.<\/span><\/li><\/ol><h3>IT 275 — .NET Programming<\/h3><ol><li><b>Introduction to .NET<\/b> (4 LH): <span class=\"small\">.NET Framework features and architecture; CLR and Class Library; .NET Framework vs .NET Core; Visual Studio and VS Code; development environment; IntelliSense; project types.<\/span><\/li><li><b>Basics of C#<\/b> (12 LH): <span class=\"small\">Data types, operators, variables; control statements; arrays; classes, structures, enumerations; partial, static and sealed classes; constructors and destructors; inheritance and polymorphism; interfaces; virtual methods and abstract classes; exception handling.<\/span><\/li><li><b>Delegates and Strings<\/b> (6 LH): <span class=\"small\">Delegates; lambda expressions; events and asynchronous tasks; string manipulation and StringBuilder; generic and non-generic collections.<\/span><\/li><li><b>Entity Framework and LINQ<\/b> (6 LH): <span class=\"small\">EF purpose and functionality; Database-First, Code-First, Model-First; LINQ fundamentals and implementation.<\/span><\/li><li><b>Introduction to ASP.NET<\/b> (10 LH): <span class=\"small\">ASP.NET vs ASP.NET Core; Web Forms, MVC, Web Pages; simple Web Forms app; MVC architecture — models, views, controllers, URL routing; layouts and Razor syntax; variables, loops, logic in Razor; database interaction in MVC.<\/span><\/li><li><b>Database Programming<\/b> (10 LH): <span class=\"small\">ADO.NET architecture; DataReader, DataSet, DataTable, DataAdapter; SqlConnection, SqlCommand, SqlTransaction; CRUD; ExecuteNonQuery, ExecuteReader, ExecuteScalar; stored procedures; working with Entity Framework.<\/span><\/li><\/ol><h3>IT 276 — Database Administration<\/h3><ol><li><b>Introduction<\/b> (10 LH): <span class=\"small\">Oracle Database and relational concepts; architecture — instance, memory, process and storage structures; DBA roles; Data Guard, RAC, ASM, Oracle Cloud; connecting to an instance; SQL*Plus, SQL Developer, Enterprise Manager; tables, constraints, indexes, views, synonyms, sequences; partitioning and materialised views; initialisation parameter files.<\/span><\/li><li><b>Tablespace and Storage Structures<\/b> (4 LH): <span class=\"small\">Data storage and blocks; tablespaces and datafiles; control files; online redo logs, archive logs, multiplexing.<\/span><\/li><li><b>Managing Users, Roles and Privileges<\/b> (5 LH): <span class=\"small\">Predefined admin accounts; create/modify/lock/drop users; authentication; password change; monitoring users and killing sessions; schema-only accounts; system and object privileges; GRANT/REVOKE; Oracle-supplied and custom roles; PL/SQL and roles.<\/span><\/li><li><b>User Profiles, Resources and Auditing<\/b> (4 LH): <span class=\"small\">Profiles and resource parameters; password management; maintaining profiles; database security and auditing; standard and unified auditing; separation of duties (AUDIT_ADMIN, AUDIT_VIEWER); audit trail and options.<\/span><\/li><li><b>Oracle Network Configuration<\/b> (5 LH): <span class=\"small\">Oracle Net overview; listener configuration and management; naming methods; NetCA, Net Manager, EM; client connections; starting/stopping the listener; TNSPING.<\/span><\/li><li><b>Concurrency, Backup and Recovery<\/b> (8 LH): <span class=\"small\">Locking levels and methods; concurrency, contention, DML locks; preventing, detecting and resolving lock conflicts; undo management, retention, guarantee, Undo Advisor; flashback query; backup and recovery strategy; Data Pump export/import; user-managed backup; RMAN; high availability; multitenant CDB/PDB flashback.<\/span><\/li><li><b>Maintenance, Performance Management and Data Movement<\/b> (8 LH): <span class=\"small\">Alert log and AWR; statistics levels, ADDM; advisors; explain plans, plan hash values, statistics gathering; tuning methodology; memory management; temporary tables; SQL tuning — optimiser, SQL plan directives, adaptive plans, SQL advisors; directory objects and Data Pump; SQL*Loader; external tables.<\/span><\/li><li><b>Resource Management and Task Scheduling<\/b> (4 LH): <span class=\"small\">Database Resource Manager — plans, directives, allocation; default maintenance plan; Scheduler components, privileges, workflow; jobs and job classes; time- and event-based schedules.<\/span><\/li><\/ol><h3>IT 245 — Business Information Systems<\/h3><ol><li><b>Introduction to Information Systems<\/b> (3 LH): <span class=\"small\">Why study IS; computer-based information systems and types; impact of IT on organisations; importance of IS to society.<\/span><\/li><li><b>Organisational Strategy, Competitive Advantage and IS<\/b> (6 LH): <span class=\"small\">Business processes; improvement, reengineering (BPR) and management (BPM); business pressures, organisational responses and IT support; competitive advantage and strategic information systems.<\/span><\/li><li><b>Data and Knowledge Management<\/b> (5 LH): <span class=\"small\">Managing data; database approach; Big Data; data warehouses and data marts; knowledge management.<\/span><\/li><li><b>Wireless, Mobile Computing and Mobile Commerce<\/b> (5 LH): <span class=\"small\">Wireless technologies; wireless networks and Internet access; mobile computing and m-commerce; Internet of Things.<\/span><\/li><li><b>Social Computing<\/b> (4 LH): <span class=\"small\">Web 2.0; social computing in business; shopping, marketing, CRM and HRM applications.<\/span><\/li><li><b>Information Systems within Organisations<\/b> (6 LH): <span class=\"small\">Transaction processing systems; functional-area IS; ERP systems; ERP support for business processes.<\/span><\/li><li><b>CRM and SCM<\/b> (7 LH): <span class=\"small\">Defining CRM; operational CRM; other CRM types; supply chains; SCM; IT support for SCM.<\/span><\/li><li><b>Business Analytics<\/b> (7 LH): <span class=\"small\">Managers and decision-making; business-analytics process; descriptive, predictive and prescriptive analytics; presentation tools.<\/span><\/li><li><b>Cloud Computing<\/b> (5 LH): <span class=\"small\">Basics; types; services; benefits; concerns and risks; &#x27;Big Three&#x27; vendors; web services and SOA.<\/span><\/li><\/ol><h3>IT 277 — Cloud Computing<\/h3><ol><li><b>Introduction to Cloud Computing<\/b> (5 LH): <span class=\"small\">Evolution; characteristics; cloud types and services; benefits, challenges, applications; cloud storage; cloud service requirements; dynamic infrastructure; cloud adoption.<\/span><\/li><li><b>Cloud Computing Architecture<\/b> (5 LH): <span class=\"small\">IaaS, PaaS, SaaS; public, private, community, hybrid clouds; SOA-based cloud design; security, trust and privacy.<\/span><\/li><li><b>Cloud Applications<\/b> (5 LH): <span class=\"small\">Cloud migration; software licensing; cloud cost models; service levels (SLA), security and web-application design.<\/span><\/li><li><b>Cloud Virtualization Technology<\/b> (8 LH): <span class=\"small\">Virtualisation concepts and types; implementation levels; server virtualisation and software; hypervisor types; load balancing; infrastructure requirements.<\/span><\/li><li><b>MapReduce and Applications<\/b> (7 LH): <span class=\"small\">Parallel computing; MapReduce model; applications; parallel efficiency; enterprise batch processing.<\/span><\/li><li><b>Cloud Security<\/b> (6 LH): <span class=\"small\">Security issues, challenges and risks; SaaS security; security monitoring; security architecture design; data, application and VM security; legal and multi-tenancy issues.<\/span><\/li><li><b>Cloud Platforms and Applications<\/b> (12 LH): <span class=\"small\">Web services; Google AppEngine, Microsoft Azure, Aneka; open challenges; scientific, business and consumer applications.<\/span><\/li><\/ol><h3>IT 278 — Big Data and Analytics<\/h3><ol><li><b>Overview of Big Data<\/b> (5 LH): <span class=\"small\">Introduction; types of data; evolution; characteristics; big data vs data warehouse; advantages, disadvantages, obstacles; impact.<\/span><\/li><li><b>Challenges of Big Data<\/b> (6 LH): <span class=\"small\">Integration; storage; data quality; analysis; security and privacy; access and sharing.<\/span><\/li><li><b>Big Data Analytics<\/b> (6 LH): <span class=\"small\">Introduction and applications; types of analytics; comparison of analytics stages.<\/span><\/li><li><b>Hadoop and NoSQL Databases<\/b> (14 LH): <span class=\"small\">Hadoop introduction and ecosystem — storage, processing, access, management components; Apache Spark; NoSQL types — key-value, column-oriented, document, graph; BASE model; advantages and disadvantages.<\/span><\/li><li><b>Data Lakes<\/b> (7 LH): <span class=\"small\">Introduction, architecture, usage, challenges; advantages/disadvantages; lakehouse; data warehouse vs data lake vs lakehouse; best practices.<\/span><\/li><li><b>Big Data Applications<\/b> (10 LH): <span class=\"small\">Healthcare; fraud detection; social-media analytics; novel applications.<\/span><\/li><\/ol><h3>IT 246 — IT Ethics and Cybersecurity<\/h3><ol><li><b>An Overview of Ethics<\/b> (5 LH): <span class=\"small\">Ethics; ethics in the business world; CSR; fostering CSR and good business ethics; improving business ethics; ethical decision-making.<\/span><\/li><li><b>Ethics for IT Workers and IT Users<\/b> (5 LH): <span class=\"small\">Managing IT-worker relationships; professionalism; ethical use of IT resources; privacy and anonymity; ethics of social networking.<\/span><\/li><li><b>Intellectual Property<\/b> (6 LH): <span class=\"small\">Intellectual property; copyright; patent; trade secrets; plagiarism, reverse engineering, open-source code, competitive intelligence, trademark infringement, cybersquatting.<\/span><\/li><li><b>Ethical Decisions in Software Development and Ethics of IT Organisations<\/b> (5 LH): <span class=\"small\">Software quality and its importance; strategies for quality software; contingent workers; outsourcing; whistle-blowing; green computing.<\/span><\/li><li><b>Fundamentals of Cybersecurity<\/b> (6 LH): <span class=\"small\">Cyberspace and cybersecurity; perspectives; impact of technological change, economic-model shifts and outsourcing; risks cybersecurity mitigates; common cyberattacks; poisoned web-service and network-infrastructure attacks; technical attack techniques; attackers&#x27; coloured hats.<\/span><\/li><li><b>Personal Cybersecurity<\/b> (5 LH): <span class=\"small\">Security of home computers, mobile devices and IoT devices; physical security; remote-work security; securing accounts and passwords.<\/span><\/li><li><b>Social Engineering and Cyber Terrorism<\/b> (5 LH): <span class=\"small\">Social engineering — motives, building trust, exploiting relationships, executing the attack, countermeasures; cyber terrorism — types, impact on infrastructure, countering it.<\/span><\/li><li><b>Digital Forensics<\/b> (7 LH): <span class=\"small\">Computer vs digital forensics; stages; digital evidence; methods and labs; collecting, seizing and protecting evidence; data recovery; mobile forensics; legal aspects; cyber forensics in Nepal.<\/span><\/li><li><b>Cyber Law in the Context of Nepal<\/b> (4 LH): <span class=\"small\">Legal perspective of cybercrime; Electronic Transaction Act; Electronic Transaction Rules; IT Policy; information-security policies.<\/span><\/li><\/ol>", "src": "<table><tr><th>Type<\/th><th>Source<\/th><th>Result<\/th><\/tr><tr><td>Official<\/td><td>TU FOM — BIM 8th Semester Syllabus 2025<br><span class=\"small\">https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf<\/span><\/td><td>Read in full<\/td>< tps://bimstudies.com/docs/bitm-6th-sem-model-question-solution/<\/span><\/td><td>Read (IT 246 exam page failed)<\/td><\/tr><tr><td>News/college<\/td><td>Collegesansar — BBM/BBA/BIM 4th &amp; 6th Sem Exam Routine (Dec 2025)<br><span class=\"small\">https://collegesansar.com/bbm-bba-bim-4th-and-6th-sem-exam-routine-tu/<\/span><\/td><td>Read — confirms Dec 2025 NC sitting and OC/NC codes<\/td><\/tr><tr><td>Searched, nothing usable<\/td><td>studynotesnepal, bitmstudynotes, collegenote-type sites, Scribd, CliffsNotes, general web for each code<br><span class=\"small\">—<\/span><\/td><td>No additional verified NC papers found<\/td><\/tr><\/table>", "papers": "<table><tr><th>Subject<\/th><th>A · Actual NC papers found<\/th><th>C · TU model questions<\/th><th>B · Unverified<\/th><th>Unavailable<\/th><\/tr><tr><td><b>IT 248<\/b><\/td><td>None<\/td><td>TU Model Question 2026<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>MGT 236<\/b><\/td><td>Apr 2025 exam (April 2025, regular (BBM/BIM 6th sem, MGT 236))<\/td><td>TU model (partial)<\/td><td>bimstudies &#x27;2025&#x27; copy<\/td><td>Dec 2025 NC paper not found<\/td><\/tr><tr><td><b>IT 250<\/b><\/td><td>None<\/td><td>None found<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>FIN 229<\/b><\/td><td>2025 exam (partial) (2025, presumed April 2025 regular)<\/td><td>None found<\/td><td>—<\/td><td>Dec 2025 NC paper not found; parts of 2025 paper missing<\/td><\/tr><tr><td><b>IT 249<\/b><\/td><td>None<\/td><td>TU Model Question 2026<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>RCH 201<\/b><\/td><td>Apr 2025 exam (April 2025 regular (BBA/BIM 6th sem))<\/td><td>TU model 2025 (partial)<\/td><td>—<\/td><td>Dec 2025 NC paper not found<\/td><\/tr><tr><td><b>IT 275<\/b><\/td><td>None<\/td><td>TU Model Question 2026<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>IT 276<\/b><\/td><td>None<\/td><td>TU Model Question 2026<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>IT 245<\/b><\/td><td>2025 exam (2025 (presumed April regular; not confirmed))<\/td><td>TU model question<\/td><td>—<\/td><td>Dec 2025 NC paper not found<\/td><\/tr><tr><td><b>IT 277<\/b><\/td><td>None<\/td><td>TU Model Question 2026<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>IT 278<\/b><\/td><td>None<\/td><td>TU Model Question 2026<\/td><td>—<\/td><td>No NC exam has been held yet (first sitting Dec 2026)<\/td><\/tr><tr><td><b>IT 246<\/b><\/td><td>2025 exam (fragments) (2025 (presumed April regular))<\/td><td>TU model question<\/td><td>—<\/td><td>Dec 2025 NC paper not found; parts of 2025 paper missing<\/td><\/tr><\/table>", "repeated": "<h2>IT 248 — IT Entrepreneurship and Management<\/h2><p><strong>Question-type pattern (TU Model Question 2026 only — one paper, so treat as indicative):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Count<\/th>\n<th>Where<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Definitions<\/td>\n<td>10<\/td>\n<td>Group A<\/td>\n<\/tr>\n<tr>\n<td>Explanations / \"explain the role of\"<\/td>\n<td>6<\/td>\n<td>Group B<\/td>\n<\/tr>\n<tr>\n<td>Lists + explain (\"explain any three\")<\/td>\n<td>2<\/td>\n<td>Q18, Q19<\/td>\n<\/tr>\n<tr>\n<td>Two-part combined questions<\/td>\n<td>2<\/td>\n<td>Q20, Q21<\/td>\n<\/tr>\n<tr>\n<td>Nepal-based case (ride-sharing / Pathao)<\/td>\n<td>1<\/td>\n<td>Q22 (20 marks)<\/td>\n<\/tr>\n<tr>\n<td>Numerical<\/td>\n<td>0<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Unit spread in the model:<\/strong> Unit 1: 3 · Unit 2: 6 (incl. 20-mark case) · Unit 3: 2 · Unit 4: 2 · Unit 5: 5 · Unit 6: 4. Units 2 and 5 carry the most weight. The case is built on a syllabus case study (Pathao), so expect the real case to draw on one of the named syllabus cases: e-Sewa/Khalti, Pathao, Nepali tech startups, MakeMyTrip or Tata CSR.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>MGT 236 — Business Environment in Nepal<\/h2><p><strong>Question types (April 2025):<\/strong> definitions and \"name two\" items (Group A); describe/explain/justify (Group B); concept + analysis (Group C); a Nepal-based industry case with 4×5 sub-parts (Group D). <strong>No numericals.<\/strong> TU strongly prefers <strong>Nepal-specific<\/strong> answers: policies, institutions, FDI, energy and tourism.<\/p>\n<p><strong>Repeated concepts (model → exam):<\/strong> <em>environmental scanning<\/em> methods/techniques (model A1 → exam A1 and A3) and <em>business support agencies<\/em> (model Q17 SCIDB → exam Q16 TEPC and A9). These are the only cross-paper repetitions the evidence supports.<\/p>\n<p><strong>Weighting:<\/strong> the macro environment (official Unit 3, 32 of 48 LH) dominates — 15 of 22 questions in 2025. Expect FDI, energy, tourism, policies, SAFTA/WTO and political risk again in some form.<\/p><p><b>Topics seen in two or more papers (repeated):<\/b><\/p><ul><li>Environmental scanning: techniques and methods — Apr 2025 exam A1, A3; TU model (partial) A1<\/li><li>Firm-specific environment — Apr 2025 exam Q21; TU model (partial) A2<\/li><li>Business support agencies (NRB, FNCCI, SCIDB, DoI…) — Apr 2025 exam A9; TU model (partial) Q17<\/li><\/ul><h2>IT 250 — Digital Economy<\/h2><p><strong>Insufficient data<\/strong> — no paper of any kind. Expect the TU 60-mark IT pattern: 10 one-line definitions, 6 short \"explain\" questions (any 5), 4 medium questions (any 3), and 2 ten-mark comprehensive questions, often scenario-based (e.g. Nepal e-governance or a platform business).<\/p>\n<p><strong>Syllabus weight:<\/strong> Unit 3 (10 LH) &gt; Units 1, 4, 5 (8 LH each) &gt; Units 2, 6 (7 LH each). The most \"examinable\" concepts are network effects / multi-sided platforms / lock-in (classic Shapiro–Varian ideas), the Fourth Industrial Revolution, digital business models, asymmetric information, digital currencies, and e-governance / digital financial inclusion in Nepal.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>FIN 229 — Fundamentals of Corporate Finance<\/h2><p><strong>Question types (2025, partial):<\/strong> 10 brief items — 7 theory definitions and <strong>3 mini-numericals<\/strong> (current ratio, FV, CCC); Group B mixes theory with a <strong>TVM numerical<\/strong>; Group C seen so far is theory (long-term financing). Missing questions in such papers are typically numericals on <strong>bond/stock valuation, capital budgeting and leverage<\/strong>, so practise them regardless.<\/p>\n<p><strong>Unit coverage in the retrieved questions:<\/strong> U1:2 · U2:2 · U3:1 · U4:2 · U5:1 · U6:1 · U7:2 · U8:2 · U9:3. Every unit appeared, so the examiner samples the <strong>whole syllabus<\/strong>.<\/p>\n<p><strong>Repetition:<\/strong> only one paper, so repetition across sessions cannot be measured — <strong>insufficient data<\/strong>.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>IT 249 — Business Intelligence<\/h2><p><strong>Model 2026 question types:<\/strong> definitions (10) · explain/compare (6) · architecture/compare/worked example/design (4) · <strong>two 10-mark scenario designs<\/strong> (retail forecasting; healthcare BI rollout).<\/p>\n<p><strong>Unit spread:<\/strong> U1: 2 · U2: 6 · U3: 6 · U4: 3 · U5: 2 · U6: 3 (incl. both 10-markers). Data warehousing and data mining carry the most questions; Unit 6 (implementation) carries the most marks (Group D). Unit 5 has 12 LH but only Group A items — expect OLAP operations and Power BI/Tableau in some form.<\/p>\n<p><strong>Prepare a numerical:<\/strong> support/confidence/lift calculation (Q19) is the only computational item.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>RCH 201 — Business Research Methods<\/h2><p><strong>Model → exam repetitions (verified):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>TU Model 2025<\/th>\n<th>April 2025 exam<\/th>\n<th>Type of repeat<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Applied research<\/td>\n<td>A7<\/td>\n<td>A1<\/td>\n<td><strong>Near-identical wording<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Theoretical framework with DV/IV/moderating variables<\/td>\n<td>D22(c)<\/td>\n<td>D22(c)<\/td>\n<td><strong>Identical case sub-question<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Justify the research design used in a study<\/td>\n<td>D22(b)<\/td>\n<td>D22(d)<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Research design and its types<\/td>\n<td>B14<\/td>\n<td>C19 (upgraded to 10 marks)<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Probability sampling techniques<\/td>\n<td>B15<\/td>\n<td>C20 (upgraded to 10 marks)<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Telephone / personal interview<\/td>\n<td>B16<\/td>\n<td>A7<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Importance of literature<\/td>\n<td>A8<\/td>\n<td>B11 (steps of literature survey)<\/td>\n<td>Related concept<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lesson:<\/strong> TU's model paper predicted roughly a third of the real paper's concepts. Expect the Group D case to again ask for <strong>research questions/hypotheses, a theoretical-framework diagram, justification of design and choice of statistics.<\/strong><\/p>\n<p><strong>Question types:<\/strong> definitions with examples (Likert example, APA reference, moderating-variable examples) · describe/differentiate · long theory answers · applied case. <strong>No pure numerical<\/strong> in 2025, but chi-square is in the syllabus — know one worked example.<\/p><p><b>Topics seen in two or more papers (repeated):<\/b><\/p><ul><li>Basic vs applied research — Apr 2025 exam A1; TU model 2025 (partial) A7<\/li><li>Literature survey: purpose and steps; online search — Apr 2025 exam Q11; TU model 2025 (partial) A8<\/li><li>Theoretical framework; variables — Apr 2025 exam A2, D22c; TU model 2025 (partial) D22c<\/li><li>Research design and quantitative designs — Apr 2025 exam Q19; TU model 2025 (partial) B14<\/li><li>Qualitative designs: case study, ethnography, grounded theory — Apr 2025 exam A3, A6; TU model 2025 (partial) A10<\/li><li>Sampling; probability techniques — Apr 2025 exam Q20; TU model 2025 (partial) B15<\/li><li>Interviews: face-to-face, telephone, CAI — Apr 2025 exam A7; TU model 2025 (partial) A6, B16<\/li><\/ul><h2>IT 275 — .NET Programming<\/h2><p><strong>Model 2026:<\/strong> definitions (10) · compare/explain with snippet (6) · architecture with diagram, CRUD, comparison (4) · <strong>two 10-mark application designs<\/strong> (MVC + EF Core CRUD; Web Forms events + StringBuilder).<\/p>\n<p><strong>Unit spread:<\/strong> U1: 5 · U2: 2 · U3: 5 · U4: 3 · U5: 5 · U6: 2. Prepare <strong>code<\/strong> for: exception handling, abstract class vs interface, delegate/event, lambda + LINQ, StringBuilder, EF Code-First DbContext + controller CRUD, ADO.NET CRUD with SqlCommand. TU expects short, correct snippets, not full programs.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>IT 276 — Database Administration<\/h2><p><strong>Model 2026:<\/strong> definitions (10) · explain + <strong>write SQL<\/strong> (6) · architecture/SQL/locking/tuning (4) · two 10-mark long answers (full architecture; backup/HA).<\/p>\n<p><strong>Unit spread:<\/strong> U1: 5 (incl. both architecture long answers) · U2: 4 · U3: 2 · U4: 1 · U5: 2 · U6: 4 · U7: 3 · U8: 1. <strong>Architecture (Unit 1) and backup/recovery (Unit 6) dominate the marks.<\/strong> Memorise the key dynamic-performance views (V$…) and DBA commands — TU explicitly asks for SQL.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>IT 245 — Business Information Systems<\/h2><p><strong>Model → exam repetitions (concept level):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Model<\/th>\n<th>2025 exam<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Competitive advantage<\/td>\n<td>A2, D21<\/td>\n<td>A2, D21.1<\/td>\n<\/tr>\n<tr>\n<td>Data warehouse / data mart<\/td>\n<td>A3<\/td>\n<td>A3<\/td>\n<\/tr>\n<tr>\n<td>Web 2.0<\/td>\n<td>A5<\/td>\n<td>A5<\/td>\n<\/tr>\n<tr>\n<td>TPS<\/td>\n<td>A7<\/td>\n<td>A6<\/td>\n<\/tr>\n<tr>\n<td>Cloud / SaaS<\/td>\n<td>A10<\/td>\n<td>A9, B16<\/td>\n<\/tr>\n<tr>\n<td>IT support for SCM<\/td>\n<td>B14<\/td>\n<td>A7, C18 (upgraded)<\/td>\n<\/tr>\n<tr>\n<td>ERP<\/td>\n<td>D22<\/td>\n<td>C17<\/td>\n<\/tr>\n<tr>\n<td>Business process ↔ IS / BPR<\/td>\n<td>B11<\/td>\n<td>B12<\/td>\n<\/tr>\n<tr>\n<td>Analytics types (descriptive/predictive), managers &amp; decisions<\/td>\n<td>A9, B15<\/td>\n<td>A8, C19<\/td>\n<\/tr>\n<tr>\n<td>Mobile computing / wireless / IoT<\/td>\n<td>A4, B13, C19<\/td>\n<td>A4, B14, C20<\/td>\n<\/tr>\n<tr>\n<td>Social computing applications<\/td>\n<td>A6, C20<\/td>\n<td>B15, D21.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Every Group A topic of the model reappeared in the exam in some form.<\/strong> Questions are conceptual (Rainer &amp; Prince textbook style) and often ask \"justify with example\". There are no numericals.<\/p><p><b>Topics seen in two or more papers (repeated):<\/b><\/p><ul><li>Information system: definition, components, types — 2025 exam A1, B11; TU model question A1<\/li><li>Business process, BPR, BPM; relation with IS — 2025 exam B12; TU model question B11<\/li><li>Competitive advantage; strategic IS; business–IT alignment — 2025 exam A2; TU model question A2, D21<\/li><li>Data management; database approach; DW vs database; data mart — 2025 exam A3; TU model question A3<\/li><li>Wireless technologies; short-range networks — 2025 exam B14; TU model question A4<\/li><li>Mobile computing &amp; m-commerce; drivers — 2025 exam A4; TU model question B13<\/li><li>Networking &amp; mobile computing transforming business; IoT — 2025 exam C20; TU model question C19<\/li><li>Web 2.0; social computing; social shopping/commerce — 2025 exam A5; TU model question A5, A6, C20<\/li><li>TPS: definition and characteristics — 2025 exam A6; TU model question A7<\/li><li>ERP: definition, advantages, drawbacks; support for processes — 2025 exam C17; TU model question D22<\/li><li>SCM and IT support for SCM — 2025 exam A7, C18; TU model question B14<\/li><li>Managers and decisions; business analytics stages — 2025 exam A8, C19; TU model question A9, B15<\/li><li>Cloud computing: definition, types, services, benefits, risks; SaaS — 2025 exam A9, B16; TU model question A10<\/li><\/ul><h2>IT 277 — Cloud Computing<\/h2><p><strong>Model 2026:<\/strong> definitions (10) · compare/explain (6) · requirements, security, MapReduce, architecture (4) · two 10-markers: <strong>virtualisation + hypervisors<\/strong> and <strong>cloud security risks + mitigation<\/strong>.<\/p>\n<p><strong>Unit spread:<\/strong> U1: 4 · U2: 4 · U3: 0 · U4: 4 (incl. a 10-marker) · U5: 3 · U6: 6 (incl. a 10-marker) · U7: 1. <strong>Security (U6) and virtualisation (U4) dominate.<\/strong> Unit 7 has 12 LH but only one model item, so expect AppEngine/Azure/Aneka in Group B/C in the real paper. Unit 3 (migration, licensing, cost models, SLA) is untested in the model — cover it anyway.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>IT 278 — Big Data and Analytics<\/h2><p><strong>Model 2026:<\/strong> definitions (10) · compare/explain (6) · analytics types, data lakes, social media (4) · two 10-markers: <strong>NoSQL types with examples<\/strong> and <strong>big data in healthcare and fraud detection<\/strong>.<\/p>\n<p><strong>Unit spread:<\/strong> U1: 3 · U2: 2 · U3: 4 · U4: 5 (incl. a 10-marker) · U5: 5 · U6: 3 (incl. a 10-marker). <strong>Data lakes appear four times<\/strong> — learn the architecture, pros/cons and the DW/lake/lakehouse comparison thoroughly. Hadoop has the most lecture hours (14 LH) — know HDFS, YARN, MapReduce, Hive, Pig, HBase, Sqoop, Flume, ZooKeeper, Oozie and Spark.<\/p><p><b>Repeated topics:<\/b> insufficient data (only one paper available).<\/p><h2>IT 246 — IT Ethics and Cybersecurity<\/h2><p><strong>Model → exam repetitions (from available fragments):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>Model<\/th>\n<th>2025 exam<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ethics and its importance in business<\/td>\n<td>B11<\/td>\n<td>\"Importance of ethics in business with example\"<\/td>\n<\/tr>\n<tr>\n<td>Cyber law in Nepal / Electronic Transaction Act<\/td>\n<td>A9, C19<\/td>\n<td>\"Define cyber law\", \"types of cybercrime under Nepalese cyber law\", \"current state of cyber law in Nepal\"<\/td>\n<\/tr>\n<tr>\n<td>Social engineering / cyber terrorism (Unit 7)<\/td>\n<td>A7, B14, C17<\/td>\n<td>Cyber-terrorism types, effects and countering<\/td>\n<\/tr>\n<tr>\n<td>Digital forensics<\/td>\n<td>A8, D21<\/td>\n<td>Cyber-forensics-in-Nepal item<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cyber law in Nepal is the most consistently tested area<\/strong> (in the model and at least three items of the 2025 fragments). Questions are conceptual (Reynolds' <em>Ethics in IT<\/em> and <em>Cybersecurity All-in-One<\/em> style), often with \"explain with example\" or a scenario (outsourcing breach). Because the 2025 paper is incomplete, frequency counts are a <strong>lower bound<\/strong>.<\/p><p><b>Topics seen in two or more papers (repeated):<\/b><\/p><ul><li>Ethics vs law; ethics in business; importance — 2025 exam (fragments) A?, B?; TU model question B11<\/li><li>Ethical issues for IT users; ethical use of IT resources — 2025 exam (fragments) A?; TU model question B12<\/li><li>Cyber law in Nepal: ETA, Rules, IT policy; legal perspective of cybercrime — 2025 exam (fragments) A?, A?, C?; TU model question A9, C19<\/li><\/ul>", "plan": "<p>Today is <b>Thursday 19 November 2026<\/b>; the first exam is on <b>Tuesday 1 December<\/b> — <b>12 days<\/b> to prepare. From 1 to 11 December you have an exam almost every day (only 5 December is free), so every subject must get its <b>first full pass before 1 December<\/b>. During the exams you only revise the next day's paper.<\/p>\n<div class=\"box\"><b>Assumptions.<\/b> You sit the five 6th-semester papers plus IT 248, IT 250, IT 249 and <b>one<\/b> Elective II paper (IT 275/276/277/278) — 9 exams. If you really sit more electives, take the 27 Nov slot for the second one and use the 5 Dec free day for it. Plan for about 7–8 focused hours a day: mornings for new material, afternoons for writing answers and numericals, and evenings for recall without notes.<\/div>\n<table><tr><th style=\"width:16%\">Date<\/th><th>What to do<\/th><th style=\"width:26%\">Notes<\/th><\/tr><tr><td><b>Thu 19 Nov<\/b><\/td><td>Read every guide&#x27;s Priority list (1 hr). IT 248: Units 1–3 High answers.<\/td><td class=\"small\">Set up: choose your elective; print or open the revision sheets.<\/td><\/tr><tr><td><b>Fri 20 Nov<\/b><\/td><td>IT 248: Units 4–6 + Pathao case; write two 10-mark answers from memory.<\/td><td class=\"small\">IT 248 is your first exam (1 Dec).<\/td><\/tr><tr><td><b>Sat 21 Nov<\/b><\/td><td>MGT 236: all High answers (FDI, energy, tourism case, agencies, laws).<\/td><td class=\"small\">Make a one-page list of Nepali laws and years.<\/td><\/tr><tr><td><b>Sun 22 Nov<\/b><\/td><td>IT 250: all 25 answers (no TU evidence — cover the whole syllabus).<\/td><td class=\"small\">Focus on network effects, lock-in, e-governance and financial inclusion.<\/td><\/tr><tr><td><b>Mon 23 Nov<\/b><\/td><td>FIN 229: formula sheet + solved numericals N1–N9 (TVM, bonds, stock).<\/td><td class=\"small\">Re-solve each without looking.<\/td><\/tr><tr><td><b>Tue 24 Nov<\/b><\/td><td>FIN 229: N10–N14 (capital budgeting, leverage, amortisation) + theory. Evening: IT 249 Units 1–2.<\/td><td class=\"small\"><\/td><\/tr><tr><td><b>Wed 25 Nov<\/b><\/td><td>IT 249: Units 3–6 incl. support/confidence and both ion.<\/td><td class=\"small\">IT 275 and IT 276 share this date.<\/td><\/tr><tr><td><b>Wed 9 Dec<\/b><\/td><td>EXAM IT 245. Evening: elective revision (if IT 277/278) or IT 246.<\/td><td class=\"small\"><\/td><\/tr><tr><td><b>Thu 10 Dec<\/b><\/td><td>EXAM IT 277 or IT 278 (whichever you take). Evening: IT 246 revision sheet.<\/td><td class=\"small\">IT 277 and IT 278 share this date.<\/td><\/tr><tr><td><b>Fri 11 Dec<\/b><\/td><td>EXAM IT 246.<\/td><td class=\"small\">Done.<\/td><\/tr><\/table>\n<h2>Daily method<\/h2><ol><li>Read the subject's <b>High<\/b>-priority answers, then close the book and write the key points from memory.<\/li><li>Write out at least two full long answers (10 or 20 marks) under time, using about 1.5 minutes per mark.<\/li><li>Finance and coding: solve or type the examples without looking.<\/li><li>Evening: the one-page revision sheet, then the self-assessment checklist.<\/li><li>Night before each exam: revision sheet + definitions table only — no new topics.<\/li><\/ol>"}};

function subject(id, tab){
  const s = byId[id]; if(!s) return home(); side(id); tab = tab || "overview";
  const tabs = [["overview","Overview & syllabus"],["notes","Chapter notes"],["qa","Questions & answers"],["papers","Past papers"],["analysis","Analysis"],["defs","Definitions"]];
  if (s.extra) tabs.push(["extra", s.extra_title.includes("Formula")?"Formulas":"Extra"]);
  tabs.push(["revision","Revision & checklist"],["practice","Practice"],["sources","Sources"]);
  const p = progress(s), d = daysTo(s.exam);
  let h = `<div class="small">Semester ${s.sem} · New Course</div><h1>${s.code} · ${esc(s.title)}</h1>
  <p class="sub">Exam: <b>${fmtDate(s.exam)}</b> · <span class="countdown">${d>0?d+" days left":d===0?"today":"done"}</span> · ${p.n}/${p.t} answers mastered</p>
  <div class="tabs">${tabs.map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="go('#/s/${id}/${k}')">${t}</button>`).join("")}</div><div id="tabbody"></div>`;
  main(h);
  const tb = document.getElementById("tabbody");
  if (tab==="overview"){
    tb.innerHTML = `<div class="tblwrap"><table><tr><th style="width:26%">Item</th><th>Verified information</th></tr>
    <tr><td>Official title</td><td>${esc(s.official)}</td></tr><tr><td>Applicable syllabus</td><td>${esc(s.syllabus)}</td></tr>
    <tr><td>Discrepancy check</td><td>${esc(s.note)}</td></tr><tr><td>Exam structure</td><td>${esc(s.marks)}</td></tr><tr><td>Objectives</td><td>${esc(s.objectives)}</td></tr></table></div>
    <h2>Past-question availability</h2><div class="box">${s.avail}</div>
    <h2>Units</h2>${s.units.map(u=>`<div class="unit-h">Unit ${u.n}: ${esc(u.t)} · ${u.lh} LH</div><p class="small">${esc(u.topics)}</p><p><a href="#/s/${id}/notes/${u.n}">→ Chapter notes</a> · <a href="#/s/${id}/qa/${u.n}">${s.qa.filter(q=>q.u===u.n).length} answered questions</a></p>`).join("")}`;
  } else if (tab==="notes"){
    const sel = location.hash.split("/")[4] || "";
    tb.innerHTML = `<div class="filters noprint"><label>Chapter <select id="nu"><option value="">All units</option>${s.units.map(u=>`<option value="${u.n}" ${sel==u.n?"selected":""}>Unit ${u.n}: ${esc(u.t)}</option>`).join("")}</select></label></div><div id="nlist" class="noteswrap"></div>`;
    const draw = () => { const v = document.getElementById("nu").value; document.getElementById("nlist").innerHTML = s.units.filter(u=>!v||u.n==v).map(u=>`<div class="unit-h">Unit ${u.n}: ${esc(u.t)} · ${u.lh} LH</div><p class="small"><b>Syllabus:</b> ${esc(u.topics)}</p><div class="box">${s.notes[u.n]||"<p>Notes not available.</p>"}</div><p class="noprint"><a href="#/s/${id}/qa/${u.n}">→ Exam questions and answers for Unit ${u.n}</a></p>`).join(""); };
    document.getElementById("nu").onchange = draw; draw();
  } else if (tab==="qa"){ renderQA(s, tb); }
  else if (tab==="papers"){
    const opts = [...new Set(s.papers.map(p=>p.label))];
    tb.innerHTML = s.papers.length ? `<div class="filters"><label>Paper / year <select id="pf"><option value="">All</option>${opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select></label></div><div id="plist"></div>` : `<div class="box"><b>No papers of any kind are available for this subject.</b> See Overview for details.</div>`;
    const draw = () => { const v = (document.getElementById("pf")||{}).value||""; document.getElementById("plist").innerHTML = s.papers.filter(p=>!v||p.label===v).map(p=>`
      <h2>${esc(p.label)} <span class="badge cat">${CAT[p.cat]}</span></h2><p class="small"><b>Session:</b> ${esc(p.session)} · <b>Source:</b> ${esc(p.source)}<br>${esc(p.url)}</p>
      ${p.note?`<div class="box warn small">${esc(p.note)}</div>`:""}<div class="tblwrap"><table><tr><th>Q</th><th>Grp</th><th>Question (as retrieved)</th><th>Marks</th><th>Unit</th></tr>
      ${p.qs.map(q=>`<tr><td><b>${esc(q.no)}</b></td><td>${esc(q.g)}</td><td>${esc(q.t)}</td><td>${esc(q.m)}</td><td>${esc(q.u)}</td></tr>`).join("")}</table></div>`).join(""); };
    if (s.papers.length){ document.getElementById("pf").onchange = draw; draw(); }
  } else if (tab==="analysis"){
    const head = s.papers.map(p=>`<th>${esc(p.label)}</th>`).join("");
    const rows = [...s.qa].sort((a,b)=>PRI.indexOf(a.p)-PRI.indexOf(b.p)||a.u-b.u).map(q=>`<tr><td>${esc(q.t)}</td><td>${q.u}</td>${s.papers.map(p=>`<td>${q.seen[p.id]?"Asked ("+esc(q.seen[p.id])+")":"—"}</td>`).join("")}<td>${Object.keys(q.seen).length||"0 (syllabus)"}</td><td>${badge(q.p)}${q.rep?'<span class="badge rep">Repeated</span>':""}</td></tr>`).join("");
    const ufreq = s.papers.length ? `<div class="tblwrap"><table><tr><th>Unit</th>${head}</tr>${s.units.map(u=>`<tr><td>Unit ${u.n}: ${esc(u.t)}</td>${s.papers.map(p=>`<td>${p.qs.filter(q=>q.u===u.n).length}</td>`).join("")}</tr>`).join("")}</table></div>` : "<p><b>Insufficient data.</b></p>";
    tb.innerHTML = `<div class="box">${s.pattern}</div><h2>Unit frequency (number of questions)</h2>${ufreq}<h2>Topic frequency and priority</h2><div class="tblwrap"><table><tr><th>Topic</th><th>Unit</th>${head}<th>Frequency</th><th>Priority</th></tr>${rows}</table></div>`;
  } else if (tab==="defs"){
    tb.innerHTML = `<div class="filters"><input type="text" id="df" placeholder="Filter definitions…"></div><div class="tblwrap"><table id="dt"><tr><th style="width:30%">Term</th><th>Definition</th></tr>${s.defs.map(([a,b])=>`<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`).join("")}</table></div>`;
    document.getElementById("df").oninput = e => { const v = e.target.value.toLowerCase(); document.querySelectorAll("#dt tr").forEach((r,i)=>{ if(i) r.style.display = r.textContent.toLowerCase().includes(v)?"":"none"; }); };
  } else if (tab==="extra"){ tb.innerHTML = `<div class="box">${s.extra}</div>`; }
  else if (tab==="revision"){
    const c = checks();
    tb.innerHTML = `<h2>One-page revision sheet</h2><div class="box">${s.revision}</div><h2>Self-assessment checklist</h2><ul class="check">${s.checklist.map((x,i)=>{const k=id+"-"+i; return `<li><label><input type="checkbox" data-k="${k}" ${c[k]?"checked":""}> ${esc(x)}</label></li>`;}).join("")}</ul>
    <h2>High-priority list</h2><ol>${s.qa.filter(q=>q.p==="High").map(q=>`<li><a href="#/s/${id}/qa" onclick="setTimeout(()=>openQ('${q.id}'),60)">${esc(q.q)}</a> <span class="small">[${q.m} marks]</span></li>`).join("")}</ol>`;
    tb.querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = () => { const c = checks(); c[cb.dataset.k] = cb.checked; store.set("checks", c); });
  } else if (tab==="practice"){
    tb.innerHTML = `<p class="small">All items are <b>Category D — AI-generated practice questions</b> in the TU pattern; they are not TU questions.</p><ol>${s.practice.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  } else if (tab==="sources"){
    tb.innerHTML = `<ol>${s.sources.map(([t,u])=>`<li>${esc(t)}<br><span class="small">${u.startsWith("http")?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`:esc(u)}</span></li>`).join("")}</ol>`;
  }
}

function renderQA(s, tb, unitPre){
  const types = [...new Set(s.qa.map(q=>q.ty))].sort();
  tb.innerHTML = `<div class="filters noprint">
   <label>Unit <select id="fu"><option value="">All</option>${s.units.map(u=>`<option value="${u.n}">${u.n}. ${esc(u.t)}</option>`).join("")}</select></label>
   <label>Priority <select id="fp"><option value="">All</option>${PRI.map(p=>`<option>${p}</option>`).join("")}</select></label>
   <label>Paper / year <select id="fy"><option value="">All</option>${s.papers.map(p=>`<option value="${p.id}">${esc(p.label)}</option>`).join("")}<option value="__none">Syllabus only (no paper)</option></select></label>
   <label>Type <select id="ft"><option value="">All</option>${types.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
   <label><input type="checkbox" id="fr"> Repeated only</label><label><input type="checkbox" id="fh"> Hide mastered</label>
   <button class="noprint" id="xall" style="margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px">Expand all</button></div><div id="qlist"></div>`;
  if (unitPre) document.getElementById("fu").value = unitPre;
  const draw = () => {
    const u=fu.value, p=fp.value, y=fy.value, t=ft.value, r=fr.checked, hm=fh.checked, m=mastered();
    const items = s.qa.filter(q => (!u||q.u==u)&&(!p||q.p===p)&&(!t||q.ty===t)&&(!r||q.rep)&&(!hm||!m[q.id])&&(!y||(y==="__none"?!Object.keys(q.seen).length:q.seen[y])));
    let html = "", cur = null;
    items.sort((a,b)=>a.u-b.u||PRI.indexOf(a.p)-PRI.indexOf(b.p)).forEach(q => { if(q.u!==cur){cur=q.u; const un=s.units.find(x=>x.n===q.u); html += `<div class="unit-h">Unit ${q.u}: ${esc(un?un.t:"")}</div>`;} html += qaHTML(q, m); });
    qlist.innerHTML = html || `<div class="box">No questions match these filters.</div>`;
    qlist.querySelectorAll(".mast input").forEach(cb => cb.onchange = e => { e.stopPropagation(); const m = mastered(); m[cb.dataset.id] = cb.checked; store.set("mastered", m); cb.closest("details").classList.toggle("done", cb.checked); side(s.id); });
    qlist.querySelectorAll(".mast").forEach(l => l.onclick = e => e.stopPropagation());
  };
  const fu=document.getElementById("fu"),fp=document.getElementById("fp"),fy=document.getElementById("fy"),ft=document.getElementById("ft"),fr=document.getElementById("fr"),fh=document.getElementById("fh"),qlist=document.getElementById("qlist");
  [fu,fp,fy,ft,fr,fh].forEach(e=>e.onchange=draw);
  document.getElementById("xall").onclick = e => { const open = e.target.textContent==="Expand all"; qlist.querySelectorAll("details").forEach(d=>d.open=open); e.target.textContent = open?"Collapse all":"Expand all"; };
  draw();
}
function qaHTML(q, m){
  return `<details class="qa ${q.p} ${m[q.id]?"done":""}" id="${q.id}"><summary><label class="mast"><input type="checkbox" data-id="${q.id}" ${m[q.id]?"checked":""}> mastered</label>
  <div class="q">${esc(q.q)}</div><div class="m">${badge(q.p)}${q.rep?'<span class="badge rep">Repeated</span>':""}<span class="badge ty">${esc(q.ty)}</span> ${q.m} marks · Unit ${q.u} · ${esc(q.src)}</div></summary><div class="ans">${q.a}</div></details>`;
}
function openQ(id){ const d = document.getElementById(id); if(d){ d.open = true; d.scrollIntoView({behavior:"smooth",block:"start"}); } }

function search(term){
  side(""); term = term.trim(); const T = term.toLowerCase();
  if (T.length < 2){ main(`<h1>Search</h1><p class="sub">Type at least two characters.</p>`); return; }
  const strip = h => h.replace(/<[^>]+>/g," ");
  const hl = (txt) => esc(txt).replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), x=>`<mark>${x}</mark>`);
  const res = [];
  S.forEach(s => {
    s.qa.forEach(q => { const body = strip(q.a); const hitQ = (q.q+" "+q.t).toLowerCase().includes(T), i = body.toLowerCase().indexOf(T);
      if (hitQ || i>=0) res.push({score: hitQ?2:1, s, html:`<div class="small">${s.code} · Unit ${q.u} · ${badge(q.p)}</div><b>${hl(q.q)}</b>${i>=0?`<div class="small">…${hl(body.slice(Math.max(0,i-80), i+120))}…</div>`:""}`, go:`#/s/${s.id}/qa`, id:q.id}); });
    Object.entries(s.notes).forEach(([n,h]) => { const body = strip(h); const i = body.toLowerCase().indexOf(T); if (i>=0) { const un = s.units.find(x=>x.n==n); res.push({score:1, s, html:`<div class="small">${s.code} · Chapter notes</div><b>Unit ${n}: ${esc(un?un.t:"")}</b><div class="small">…${hl(body.slice(Math.max(0,i-80), i+120))}…</div>`, go:`#/s/${s.id}/notes/${n}`}); } });
    s.defs.forEach(([a,b]) => { if ((a+" "+b).toLowerCase().includes(T)) res.push({score:2, s, html:`<div class="small">${s.code} · Definition</div><b>${hl(a)}</b> — ${hl(b)}`, go:`#/s/${s.id}/defs`}); });
    s.units.forEach(u => { if ((u.t+" "+u.topics).toLowerCase().includes(T)) res.push({score:1, s, html:`<div class="small">${s.code} · Syllabus</div><b>Unit ${u.n}: ${hl(u.t)}</b><div class="small">${hl(u.topics)}</div>`, go:`#/s/${s.id}/overview`}); });
    s.papers.forEach(p => p.qs.forEach(q => { if (q.t.toLowerCase().includes(T)) res.push({score:1, s, html:`<div class="small">${s.code} · ${esc(p.label)} Q${esc(q.no)}</div>${hl(q.t)}`, go:`#/s/${s.id}/papers`}); }));
  });
  res.sort((a,b)=>b.score-a.score);
  main(`<h1>Search: “${esc(term)}”</h1><p class="sub">${res.length} results across all subjects</p>` + res.slice(0,200).map((r,i)=>`<div class="result" data-i="${i}">${r.html}</div>`).join(""));
  document.querySelectorAll(".result").forEach(el => el.onclick = () => { const r = res[+el.dataset.i]; location.hash = r.go; if (r.id) setTimeout(()=>openQ(r.id), 120); });
}

function reportsView(){ side("reports"); const R = DATA.reports;
  main(`<h1>Research reports</h1><p class="sub">A. Syllabus verification · B. Past-question research · C. Repeated-question analysis</p>
  <h2>Key findings</h2><div class="box">${R.key}</div><h2>A. Syllabus verification</h2><div class="tblwrap">${R.syl}</div>
  <h2>B. Past-question research — sources searched</h2><div class="tblwrap">${R.src}</div><h2>Subject-wise paper coverage</h2><div class="tblwrap">${R.papers}</div>
  <h2>C. Repeated-question analysis</h2>${R.repeated}`); }
function planView(){ side("plan"); main(`<h1>D. Examination revision plan</h1>${DATA.reports.plan}`); }

function main(h){ document.getElementById("main").innerHTML = h; window.scrollTo(0,0); document.getElementById("side").classList.remove("open"); }
function go(h){ location.hash = h; }
function printView(){ document.querySelectorAll("details").forEach(d=>d.open=true); setTimeout(()=>window.print(), 50); }
function route(){
  const h = location.hash.replace(/^#\/?/,"").split("/");
  if (h[0]==="s") { subject(h[1], h[2]); if (h[2]==="qa" && h[3]) renderQA(byId[h[1]], document.getElementById("tabbody"), h[3]); }
  else if (h[0]==="search") search(decodeURIComponent(h.slice(1).join("/")));
  else if (h[0]==="reports") reportsView(); else if (h[0]==="plan") planView(); else home();
}
let t; document.getElementById("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(()=>{ const v=e.target.value; location.hash = v.trim()? "#/search/"+encodeURIComponent(v) : "#/home"; }, 250); });
document.getElementById("menuBtn").onclick = () => document.getElementById("side").classList.toggle("open");
window.addEventListener("hashchange", route); route();
</script></body></html>
