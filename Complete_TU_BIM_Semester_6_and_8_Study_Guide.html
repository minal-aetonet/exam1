uestions and KPIs first.<\/li>\n<li>Secure an executive sponsor; form a BI competency centre (BICC).<\/li>\n<li>Start small with high-value use cases; deliver iteratively (agile).<\/li>\n<li>Invest in data governance, master data and data quality.<\/li>\n<li>Choose scalable, user-friendly tools; enable self-service with guardrails.<\/li>\n<li>Train users; promote a data-driven culture.<\/li>\n<li>Ensure security and privacy (role-based access, row-level security).<\/li>\n<li>Measure adoption and ROI; continuously improve.<\/li>\n<\/ul>\n<p><strong>BI lifecycle:<\/strong> requirements → design (architecture, data model) → ETL development → front-end development → testing → deployment → maintenance and growth.<\/p>\n<h3>6.2 Challenges and considerations<\/h3>\n<p>Data quality and silos · unclear requirements · lack of sponsorship · low adoption · skills shortage · cost and integration with legacy systems · performance at scale · security, privacy and compliance · scope creep · change resistance · build vs buy, cloud vs on-premise decisions.<\/p>\n<h3>6.3 Case studies of successful implementations<\/h3>\n<ul>\n<li><strong>Walmart:<\/strong> an enormous data warehouse of store sales shared with suppliers through Retail Link → collaborative replenishment.<\/li>\n<li><strong>Netflix/Amazon:<\/strong> analytics and recommendations drive engagement and sales.<\/li>\n<li><strong>Banks:<\/strong> NPL monitoring, branch performance, customer segmentation, regulatory reporting.<\/li>\n<li><strong>Hospitals:<\/strong> patient-flow and bed-occupancy dashboards reduce waiting time.<\/li>\n<li><strong>Telecoms:<\/strong> churn analytics and targeted offers.\n<strong>Common success factors:<\/strong> clear goals, executive support, data quality, user involvement, iterative delivery.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> best practices · BI lifecycle · challenges · case lessons.<\/p>"}, "qa": [{"id": "IT249-01", "t": "BI: definition, scope, role in decisions", "u": 1, "q": "Define Business Intelligence. Explain its scope and its role in decision-making.", "m": 5, "p": "High", "ty": "Definition/Explanation", "seen": {"M26": "A1, A2"}, "rep": false, "src": "TU Model Question 2026 A1, A2", "a": "<p><strong>Business Intelligence (BI)<\/strong> is the set of processes, technologies and tools that collect, integrate, analyse and present business data to support better, faster decisions.<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 354\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data sources<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">ETL<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data warehouse<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Analysis (OLAP, mining)<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Reports &amp; dashboards<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Decisions<\/text><\/svg><\/div>\n\n<p><strong>Scope:<\/strong> data integration · data warehousing · reporting and querying · OLAP · data mining and predictive analytics · dashboards and scorecards · performance management (KPIs).<\/p>\n<p><strong>Role in decision-making / benefits<\/strong><\/p>\n<ul>\n<li>A single version of the truth from integrated data.<\/li>\n<li>Faster, fact-based decisions instead of intuition.<\/li>\n<li>Identifying trends, opportunities and problems early.<\/li>\n<li>Performance monitoring through KPIs.<\/li>\n<li>Operational efficiency and cost reduction.<\/li>\n<li>Better customer understanding (segmentation, churn).<\/li>\n<li>Supports strategic, tactical and operational decisions.<\/li>\n<\/ul>\n<p><strong>BI vs business analytics:<\/strong> BI is mainly descriptive (what happened); analytics adds predictive and prescriptive (what will happen, what to do).<\/p>"}, {"id": "IT249-02", "t": "BI tools and technologies overview", "u": 1, "q": "Give an overview of BI tools and technologies.", "m": 3, "p": "Medium", "ty": "List", "seen": {"M26": "A8"}, "rep": false, "src": "TU Model Question 2026 A8", "a": "<ul>\n<li><strong>ETL / data-integration tools:<\/strong> SSIS, Informatica, Talend, Azure Data Factory.<\/li>\n<li><strong>Data warehouses:<\/strong> SQL Server, Oracle, Snowflake, Amazon Redshift, Google BigQuery.<\/li>\n<li><strong>OLAP engines:<\/strong> SSAS, Power BI datasets.<\/li>\n<li><strong>Reporting and visualisation:<\/strong> <strong>Power BI<\/strong>, <strong>Tableau<\/strong>, Qlik Sense, Looker, Excel.<\/li>\n<li><strong>Data mining / ML:<\/strong> Python (scikit-learn), R, RapidMiner, Weka.<\/li>\n<li><strong>Big-data platforms:<\/strong> Hadoop, Spark.<\/li>\n<\/ul>"}, {"id": "IT249-03", "t": "Data warehouse definition; metadata", "u": 2, "q": "Define a data warehouse and its characteristics. What is metadata in BI?", "m": 3, "p": "High", "ty": "Definition", "seen": {"M26": "A3, A10"}, "rep": false, "src": "TU Model Question 2026 A3, A10", "a": "<p><strong>Data warehouse (Inmon):<\/strong> a <strong>subject-oriented, integrated, time-variant and non-volatile<\/strong> collection of data supporting management decisions.<\/p>\n<ul>\n<li><em>Subject-oriented:<\/em> organised around sales, customers, products.<\/li>\n<li><em>Integrated:<\/em> consistent formats from many sources.<\/li>\n<li><em>Time-variant:<\/em> historical data (5–10 years).<\/li>\n<li><em>Non-volatile:<\/em> loaded and read, not updated by transactions.<\/li>\n<\/ul>\n<p><strong>Database (OLTP) vs data warehouse (OLAP):<\/strong> current vs historical; normalised vs denormalised; many small transactions vs complex queries; operational vs analytical.<\/p>\n<p><strong>Metadata<\/strong> is \"data about data\" — it describes source, structure, meaning, transformations and refresh schedules. Types: technical, business and operational metadata.<\/p>"}, {"id": "IT249-04", "t": "ETL process and its role", "u": 2, "q": "Expand ETL and explain its role in a BI system.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "A4, Q11"}, "rep": false, "src": "TU Model Question 2026 A4, Q11", "a": "<p><strong>ETL = Extract, Transform, Load.<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 606 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Extract (ERP,<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">CRM, files, web)<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Staging area<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Transform (clean,<\/text><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">integrate,<\/text><text x=\"382.0\" y=\"55.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">aggregate)<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Load into data<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">warehouse<\/text><\/svg><\/div>\n\n<ul>\n<li><strong>Extract:<\/strong> pull data from heterogeneous sources (full or incremental extraction).<\/li>\n<li><strong>Transform:<\/strong> cleansing (remove duplicates, fix errors, handle missing values), standardising formats, deriving fields, joining, aggregating, applying business rules, generating surrogate keys.<\/li>\n<li><strong>Load:<\/strong> initial (full) load and periodic incremental loads into fact and dimension tables.<\/li>\n<\/ul>\n<p><strong>Role:<\/strong> ensures <strong>data quality and consistency<\/strong>, integrates scattered data into one version of the truth, automates refreshes, and prepares data for fast analysis. Poor ETL leads to wrong reports. <em>ELT<\/em> is a modern variant where data is loaded first and transformed inside a cloud warehouse.<\/p>"}, {"id": "IT249-05", "t": "Data-warehouse architecture and layers", "u": 2, "q": "Explain data-warehouse architecture and its layers.", "m": 5, "p": "High", "ty": "Architecture + diagram", "seen": {"M26": "Q17"}, "rep": false, "src": "TU Model Question 2026 Q17", "a": "<p>Typical three-tier architecture:<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Top tier — front-end tools: reports, dashboards, OLAP clients, data mining<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Middle tier — OLAP server (ROLAP / MOLAP / HOLAP)<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Bottom tier — warehouse database server + data marts + metadata repository<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Staging layer — ETL processing<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data sources — ERP, CRM, POS, files, external data<\/text><\/svg><\/div>\n\n<p><strong>Layers<\/strong><\/p>\n<ol>\n<li><strong>Data-source layer:<\/strong> operational systems and external data.<\/li>\n<li><strong>Staging / ETL layer:<\/strong> extraction, cleansing, transformation.<\/li>\n<li><strong>Storage layer:<\/strong> the central data warehouse (historical, integrated) and <strong>data marts<\/strong> (department subsets — sales mart, finance mart); the metadata repository.<\/li>\n<li><strong>Analysis (OLAP) layer:<\/strong> multidimensional cubes for slicing and aggregation.<\/li>\n<li><strong>Presentation layer:<\/strong> reporting, dashboards, ad-hoc query, mining tools.<\/li>\n<\/ol>\n<p><strong>Approaches:<\/strong> <em>Inmon<\/em> (top-down: enterprise DW first, then marts) vs <em>Kimball<\/em> (bottom-up: dimensional marts integrated through conformed dimensions).<\/p>"}, {"id": "IT249-06", "t": "Star schema, snowflake; data modelling", "u": 2, "q": "Explain the star schema and its components. How does it differ from a snowflake schema?", "m": 3, "p": "High", "ty": "Explanation + diagram", "seen": {"M26": "Q12"}, "rep": false, "src": "TU Model Question 2026 Q12", "a": "<p><strong>Dimensional modelling<\/strong> organises data into <strong>facts<\/strong> (measurable events) and <strong>dimensions<\/strong> (descriptive context).<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"38.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"445.45602067755493\" y2=\"115.3900966300059\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"374.6181241970323\" y2=\"240.60990336999413\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"145.38187580296776\" y2=\"240.60990336999413\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"74.54397932244504\" y2=\"115.3900966300059\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><ellipse cx=\"260.0\" cy=\"150.0\" rx=\"78\" ry=\"30\" fill=\"#3b5b8c\"/><text x=\"260.0\" y=\"147.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">FACT_SALES (qty,<\/text><text x=\"260.0\" y=\"161.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">amount, profit;<\/text><rect x=\"198.0\" y=\"21.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DIM_DATE<\/text><rect x=\"383.45602067755493\" y=\"98.3900966300059\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"445.45602067755493\" y=\"119.3900966300059\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DIM_PRODUCT<\/text><rect x=\"312.6181241970323\" y=\"223.60990336999413\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"374.6181241970323\" y=\"244.60990336999413\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DIM_CUSTOMER<\/text><rect x=\"83.38187580296776\" y=\"223.60990336999413\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"145.38187580296776\" y=\"244.60990336999413\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DIM_STORE<\/text><rect x=\"12.54397932244504\" y=\"98.3900966300059\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"74.54397932244504\" y=\"119.3900966300059\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DIM_PROMOTION<\/text><\/svg><\/div>\n\n<p><strong>Star-schema components<\/strong><\/p>\n<ul>\n<li><strong>Fact table:<\/strong> numeric measures (sales amount, quantity) + foreign keys to the dimensions; large; defined at a declared <strong>grain<\/strong> (e.g. one row per product per store per day).<\/li>\n<li><strong>Dimension tables:<\/strong> descriptive attributes (product name, category, brand; date, month, year); denormalised; provide filters and groupings.<\/li>\n<li><strong>Surrogate keys<\/strong> link facts and dimensions.<\/li>\n<\/ul>\n<p><strong>Snowflake schema:<\/strong> dimensions are normalised into sub-tables (Product → Category → Department). It saves space but needs more joins (slower, more complex). <strong>Fact constellation (galaxy):<\/strong> several fact tables share dimensions.<\/p>\n<p><strong>Star advantages:<\/strong> simple, fast queries, easy for business users.<\/p>"}, {"id": "IT249-07", "t": "Data mining concepts; KDD", "u": 3, "q": "Define data mining. Explain the KDD process.", "m": 3, "p": "High", "ty": "Definition", "seen": {"M26": "A5"}, "rep": false, "src": "TU Model Question 2026 A5", "a": "<p><strong>Data mining<\/strong> is the process of discovering hidden patterns, relationships and useful knowledge from large datasets using statistical and machine-learning techniques.<\/p>\n<p><strong>KDD (Knowledge Discovery in Databases):<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Selection<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Preprocessing<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Transformation<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data mining<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Interpretation /<\/text><text x=\"698.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">evaluation<\/text><\/svg><\/div>\n\n<p><strong>Tasks:<\/strong> classification · clustering · association rules · regression/prediction · anomaly detection.\n<strong>Applications:<\/strong> market-basket analysis, credit scoring, fraud detection, customer segmentation, churn prediction.<\/p>"}, {"id": "IT249-08", "t": "Data preprocessing", "u": 3, "q": "What is data preprocessing and why is it important?", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "Q13"}, "rep": false, "src": "TU Model Question 2026 Q13", "a": "<p><strong>Data preprocessing<\/strong> prepares raw data for mining because real data is incomplete, noisy and inconsistent.<\/p>\n<p><strong>Steps<\/strong><\/p>\n<ol>\n<li><strong>Data cleaning:<\/strong> fill missing values (mean, mode, prediction), smooth noise (binning), remove outliers and duplicates, fix inconsistencies.<\/li>\n<li><strong>Data integration:<\/strong> combine sources and resolve schema and naming conflicts.<\/li>\n<li><strong>Data transformation:<\/strong> normalisation (min-max, z-score), aggregation, discretisation, encoding categories.<\/li>\n<li><strong>Data reduction:<\/strong> feature selection, dimensionality reduction (PCA), sampling.<\/li>\n<\/ol>\n<p><strong>Importance:<\/strong> \"garbage in, garbage out\" — quality data gives accurate, reliable models, faster processing and valid decisions.<\/p>"}, {"id": "IT249-09", "t": "Supervised vs unsupervised learning", "u": 3, "q": "Differentiate supervised and unsupervised learning. Name one classification and one clustering algorithm.", "m": 3, "p": "High", "ty": "Comparison", "seen": {"M26": "Q14, A6"}, "rep": false, "src": "TU Model Question 2026 Q14, A6", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Supervised<\/th>\n<th>Unsupervised<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Data<\/td>\n<td>Labelled (input + known output)<\/td>\n<td>Unlabelled<\/td>\n<\/tr>\n<tr>\n<td>Goal<\/td>\n<td>Predict a label / value<\/td>\n<td>Discover structure / groups<\/td>\n<\/tr>\n<tr>\n<td>Tasks<\/td>\n<td>Classification, regression<\/td>\n<td>Clustering, association<\/td>\n<\/tr>\n<tr>\n<td>Algorithms<\/td>\n<td>Decision tree, Naive Bayes, KNN, SVM, logistic regression<\/td>\n<td><strong>K-means<\/strong>, hierarchical, DBSCAN, Apriori<\/td>\n<\/tr>\n<tr>\n<td>Evaluation<\/td>\n<td>Accuracy, precision, recall<\/td>\n<td>Cluster cohesion, silhouette<\/td>\n<\/tr>\n<tr>\n<td>Example<\/td>\n<td>Loan default yes/no<\/td>\n<td>Customer segmentation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>One classification algorithm:<\/strong> decision tree. <strong>One clustering algorithm:<\/strong> K-means.<\/p>"}, {"id": "IT249-10", "t": "Decision tree vs Naive Bayes; clustering (K-means)", "u": 3, "q": "Compare decision trees and Naive Bayes classifiers. Briefly explain K-means clustering.", "m": 5, "p": "High", "ty": "Comparison", "seen": {"M26": "Q18"}, "rep": false, "src": "TU Model Question 2026 Q18", "a": "<p><strong>Decision tree:<\/strong> a flowchart-like tree; internal nodes test attributes, branches are outcomes, leaves are class labels. Built top-down by choosing the best split using information gain / entropy (ID3, C4.5) or the Gini index (CART).<\/p>\n<p><strong>Naive Bayes:<\/strong> a probabilistic classifier based on Bayes' theorem, P(C|X) ∝ P(X|C)·P(C), assuming attributes are independent given the class.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Decision tree<\/th>\n<th>Naive Bayes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Approach<\/td>\n<td>Rule-based splits<\/td>\n<td>Probability<\/td>\n<\/tr>\n<tr>\n<td>Interpretability<\/td>\n<td>Very high (if–then rules)<\/td>\n<td>Moderate<\/td>\n<\/tr>\n<tr>\n<td>Assumption<\/td>\n<td>None about independence<\/td>\n<td>Attributes independent<\/td>\n<\/tr>\n<tr>\n<td>Speed<\/td>\n<td>Training slower, prediction fast<\/td>\n<td>Very fast, works with small data<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td>Numeric and categorical<\/td>\n<td>Best with categorical/text<\/td>\n<\/tr>\n<tr>\n<td>Overfitting<\/td>\n<td>Prone (needs pruning)<\/td>\n<td>Less prone<\/td>\n<\/tr>\n<tr>\n<td>Use<\/td>\n<td>Credit decisions<\/td>\n<td>Spam filtering, text classification<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>K-means clustering:<\/strong> (1) choose k; (2) initialise k centroids; (3) assign each point to the nearest centroid (Euclidean distance); (4) recompute centroids as cluster means; (5) repeat until assignments stop changing. Used for customer segmentation.<\/p>"}, {"id": "IT249-11", "t": "Association rule mining: support, confidence, lift", "u": 3, "q": "Explain association rule mining with support and confidence using a retail example.", "m": 5, "p": "High", "ty": "Numerical example", "seen": {"M26": "Q19"}, "rep": false, "src": "TU Model Question 2026 Q19", "a": "<p><strong>Association rule mining<\/strong> finds items that frequently occur together in transactions — <em>market-basket analysis<\/em>. A rule has the form X → Y (if X is bought, Y is likely to be bought).<\/p>\n<p><strong>Measures<\/strong><\/p>\n<ul>\n<li><strong>Support(X→Y)<\/strong> = transactions containing X and Y ÷ total transactions.<\/li>\n<li><strong>Confidence(X→Y)<\/strong> = transactions with X and Y ÷ transactions with X.<\/li>\n<li><strong>Lift<\/strong> = Confidence(X→Y) ÷ Support(Y); lift &gt; 1 means a positive association.<\/li>\n<\/ul>\n<p><strong>Retail example (5 transactions):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>TID<\/th>\n<th>Items<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>T1<\/td>\n<td>Bread, Milk<\/td>\n<\/tr>\n<tr>\n<td>T2<\/td>\n<td>Bread, Butter, Milk<\/td>\n<\/tr>\n<tr>\n<td>T3<\/td>\n<td>Bread, Butter<\/td>\n<\/tr>\n<tr>\n<td>T4<\/td>\n<td>Milk, Eggs<\/td>\n<\/tr>\n<tr>\n<td>T5<\/td>\n<td>Bread, Butter, Eggs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rule <strong>Bread → Butter<\/strong>: Bread appears in 4 transactions; {Bread, Butter} in 3; Butter in 3.<\/p>\n<ul>\n<li>Support = 3/5 = <strong>60%<\/strong><\/li>\n<li>Confidence = 3/4 = <strong>75%<\/strong><\/li>\n<li>Lift = 0.75 / (3/5) = <strong>1.25<\/strong> → positive association.<\/li>\n<\/ul>\n<p>With min support 50% and min confidence 70%, the rule is <strong>strong<\/strong>. <strong>Business use:<\/strong> place bread and butter together, run bundle offers, make recommendations.<\/p>\n<p><strong>Apriori algorithm:<\/strong> find all frequent itemsets level by level (pruning using \"every subset of a frequent itemset is frequent\"), then generate rules that meet the confidence threshold.<\/p>"}, {"id": "IT249-12", "t": "Visualisation principles and techniques", "u": 4, "q": "State the principles of data visualisation and common techniques.", "m": 3, "p": "Medium", "ty": "Explanation", "seen": {"M26": "A7"}, "rep": false, "src": "TU Model Question 2026 A7", "a": "<p><strong>Principles:<\/strong> clarity and simplicity · choose the right chart for the message · maximise the data-ink ratio (avoid chart junk — Tufte) · accurate scales (start bar axes at zero) · consistent colours with meaning · highlight what matters · context (labels, titles, units) · accessibility (colour-blind safe).<\/p>\n<p><strong>Choosing charts:<\/strong> comparison → bar/column · trend over time → line · part-to-whole → stacked bar / pie (few slices) · relationship → scatter · distribution → histogram/box plot · geography → map · KPIs → cards, gauges, bullet charts.<\/p>"}, {"id": "IT249-13", "t": "Dashboard design best practices", "u": 4, "q": "Explain three dashboard-design best practices.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "Q15"}, "rep": false, "src": "TU Model Question 2026 Q15", "a": "<ol>\n<li><strong>Know the audience and purpose<\/strong> — show only the KPIs that drive decisions (strategic, tactical or operational dashboards).<\/li>\n<li><strong>Visual hierarchy / layout<\/strong> — most important KPIs top-left; group related charts; the \"5-second rule\".<\/li>\n<li><strong>Keep it simple<\/strong> — limit to about 5–9 visuals; no 3D or decoration.<\/li>\n<li><strong>Use appropriate charts and consistent colours<\/strong> (e.g. red only for alerts).<\/li>\n<li><strong>Provide context<\/strong> — targets, previous period, variance.<\/li>\n<li><strong>Interactivity<\/strong> — filters, slicers, drill-down.<\/li>\n<li><strong>Up-to-date, accurate data and fast loading.<\/strong><\/li>\n<li><strong>Mobile-friendly<\/strong> design.<\/li>\n<\/ol>"}, {"id": "IT249-14", "t": "Monthly sales dashboard for online retailer", "u": 4, "q": "Design a monthly sales dashboard for an online retailer.", "m": 5, "p": "High", "ty": "Design", "seen": {"M26": "Q20"}, "rep": false, "src": "TU Model Question 2026 Q20", "a": "<p><strong>Users:<\/strong> sales manager and management. <strong>Data:<\/strong> orders, products, customers, web traffic, returns.<\/p>\n<p><strong>Layout<\/strong>\n| Zone | Visual | Purpose |\n|---|---|---|\n| Top row — KPI cards | Revenue, orders, average order value, conversion rate, returns % — each vs target and last month | At-a-glance health |\n| Middle-left | Line chart: daily revenue this month vs last month | Trend |\n| Middle-right | Bar chart: revenue by product category | Best/worst categories |\n| Bottom-left | Map or bar: sales by region/city | Geography |\n| Bottom-right | Table: top 10 products; funnel: visits → cart → checkout → purchase | Conversion problems |\n| Filters (slicers) | Month, category, channel, device | Interactivity |<\/p>\n<p><strong>Design rules:<\/strong> consistent colours, red/green only for variance, drill-down from category to product, refresh daily through ETL from the e-commerce database, built in Power BI or Tableau.<\/p>\n<p><strong>Decisions supported:<\/strong> stock popular items, fix funnel drop-offs, target regional marketing, plan promotions.<\/p>"}, {"id": "IT249-15", "t": "OLAP: uses and operations", "u": 5, "q": "What is OLAP? Explain its operations and types.", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "A9"}, "rep": false, "src": "TU Model Question 2026 A9", "a": "<p><strong>OLAP (Online Analytical Processing)<\/strong> enables fast, interactive, multidimensional analysis of data organised in <strong>cubes<\/strong> (dimensions such as time, product and region; measures such as sales).<\/p>\n<p><strong>Uses:<\/strong> sales and budget analysis, financial reporting, forecasting, what-if analysis, trend analysis across dimensions.<\/p>\n<p><strong>Operations<\/strong><\/p>\n<ul>\n<li><strong>Roll-up (drill-up):<\/strong> aggregate to a higher level (city → country; month → year).<\/li>\n<li><strong>Drill-down:<\/strong> move to more detail (year → quarter → month).<\/li>\n<li><strong>Slice:<\/strong> fix one dimension (sales for 2025 only).<\/li>\n<li><strong>Dice:<\/strong> select a sub-cube on several dimensions (2025, Kathmandu and Pokhara, electronics).<\/li>\n<li><strong>Pivot (rotate):<\/strong> reorient the axes for a different view.<\/li>\n<\/ul>\n<p><strong>Types:<\/strong> <strong>MOLAP<\/strong> (multidimensional storage, fast, pre-aggregated) · <strong>ROLAP<\/strong> (relational tables, scalable) · <strong>HOLAP<\/strong> (hybrid).<\/p>\n<p><strong>OLTP vs OLAP:<\/strong> transactions vs analysis; current vs historical; normalised vs dimensional.<\/p>"}, {"id": "IT249-16", "t": "Power BI / Tableau; analysis and reporting", "u": 5, "q": "Explain popular BI tools such as Power BI and Tableau and the steps of hands-on data analysis and reporting.", "m": 5, "p": "Medium", "ty": "Tool knowledge", "seen": {"M26": "A8"}, "rep": false, "src": "TU Model Question 2026 A8", "a": "<p><strong>Power BI (Microsoft):<\/strong> Power Query (ETL), data model (relationships, DAX measures such as <code>Total Sales = SUM(Sales[Amount])<\/code>), report canvas with visuals, Power BI Service for sharing and scheduled refresh; integrates with Excel and Azure; low cost.<\/p>\n<p><strong>Tableau:<\/strong> drag-and-drop visual analytics, strong visualisation, calculated fields, dashboards and stories, Tableau Server/Cloud.<\/p>\n<p><strong>Others:<\/strong> Qlik Sense (associative engine), Looker, Google Looker Studio, Excel pivot tables.<\/p>\n<p><strong>Steps of analysis/reporting:<\/strong> connect to data → clean/transform (Power Query) → model (star schema, relationships) → create measures/KPIs → build visuals → add filters/drill-through → publish and share → schedule refresh → collect feedback.<\/p>"}, {"id": "IT249-17", "t": "BI challenges and best practices", "u": 6, "q": "Discuss BI best practices and challenges, and propose a phased implementation plan for a healthcare provider.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"M26": "Q16, Q22"}, "rep": false, "src": "TU Model Question 2026 Q16, Q22", "a": "<p><strong>Challenges in implementing BI<\/strong><\/p>\n<ul>\n<li>Poor data quality and data silos.<\/li>\n<li>Unclear business objectives / KPIs.<\/li>\n<li>Lack of executive sponsorship.<\/li>\n<li>Low user adoption and skills.<\/li>\n<li>High cost and complex integration with legacy systems.<\/li>\n<li>Data security and privacy (critical for patient data).<\/li>\n<li>Scope creep and long timelines.<\/li>\n<li>Change resistance.<\/li>\n<\/ul>\n<p><strong>Best practices<\/strong><\/p>\n<ul>\n<li>Align BI with business strategy; define KPIs first.<\/li>\n<li>Secure an executive sponsor; create a BI competency centre.<\/li>\n<li>Start small — quick wins — then scale (iterative, agile).<\/li>\n<li>Invest in data governance and data quality.<\/li>\n<li>Choose scalable, user-friendly tools.<\/li>\n<li>Train users and promote self-service BI.<\/li>\n<li>Ensure security, role-based access and compliance.<\/li>\n<li>Monitor usage and continuously improve.<\/li>\n<\/ul>\n<p><strong>Phased plan for a healthcare provider (hospital)<\/strong><\/p>\n<ol>\n<li><strong>Assessment &amp; strategy (month 1–2):<\/strong> identify goals (reduce waiting time, bed occupancy, readmissions, revenue-cycle leakage); KPIs; data audit of HMIS, lab, pharmacy and billing; privacy requirements.<\/li>\n<li><strong>Pilot (month 3–4):<\/strong> one department (OPD); ETL from HMIS to a small data mart; OPD dashboard (patient flow, waiting time, doctor utilisation).<\/li>\n<li><strong>Data-warehouse build (month 5–8):<\/strong> an integrated patient-centric warehouse; master patient index; star schemas for admissions, billing, pharmacy; data-governance and de-identification.<\/li>\n<li><strong>Rollout &amp; training (month 9–10):<\/strong> dashboards for management, finance and wards; self-service reports; staff training.<\/li>\n<li><strong>Advanced analytics (month 11+):<\/strong> predictive models for readmission and drug-stock forecasting; alerts.<\/li>\n<li><strong>Review &amp; optimise:<\/strong> usage metrics, feedback, ROI measurement.<\/li>\n<\/ol>\n<p><strong>Expected benefits:<\/strong> shorter waits, better resource use, lower costs, improved patient outcomes.<\/p>"}, {"id": "IT249-18", "t": "End-to-end BI for retail forecasting and inventory", "u": 6, "q": "Propose an end-to-end BI approach for a mid-size retailer's sales forecasting and inventory planning.", "m": 10, "p": "High", "ty": "Scenario design", "seen": {"M26": "Q21"}, "rep": false, "src": "TU Model Question 2026 Q21", "a": "<p><strong>1. Business objectives:<\/strong> accurate weekly demand forecasts per product and store; reduce stock-outs and overstock; improve turnover.<\/p>\n<p><strong>2. Data sources:<\/strong> POS sales, inventory system, purchase orders, supplier lead times, promotions calendar, holidays/festivals (Dashain–Tihar peaks), weather, e-commerce orders.<\/p>\n<p><strong>3. ETL / integration:<\/strong> daily extraction; cleaning (returns, duplicates); standardising product codes; loading into a data warehouse.<\/p>\n<p><strong>4. Data model:<\/strong> star schema — FACT_SALES (date, store, product, qty, revenue), FACT_INVENTORY (snapshot), dimensions: Date, Product, Store, Supplier, Promotion.<\/p>\n<p><strong>5. Analytics<\/strong><\/p>\n<ul>\n<li><strong>Descriptive:<\/strong> sales trends, ABC analysis of products, sell-through.<\/li>\n<li><strong>Predictive:<\/strong> time-series forecasting (moving average, exponential smoothing, ARIMA) or ML regression including promotions and seasonality.<\/li>\n<li><strong>Prescriptive:<\/strong> reorder point = average daily demand × lead time + safety stock; EOQ; automated replenishment suggestions.<\/li>\n<\/ul>\n<p><strong>6. Visualisation:<\/strong> Power BI dashboards — forecast vs actual, stock cover days, stock-out alerts, slow movers, supplier performance.<\/p>\n<p><strong>7. Implementation:<\/strong> pilot in a few stores → evaluate forecast accuracy (MAPE) → roll out; train staff; governance.<\/p>\n<p><strong>8. Benefits:<\/strong> lower holding costs, fewer lost sales, better cash flow, data-driven purchasing.<\/p>"}, {"id": "IT249-19", "t": "Case studies of successful BI", "u": 6, "q": "Give examples of successful BI implementations and the lessons from them.", "m": 5, "p": "Coverage", "ty": "Case", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li><strong>Walmart:<\/strong> a massive data warehouse of POS data shared with suppliers (Retail Link) → efficient replenishment; the famous insight of stocking extra supplies before hurricanes.<\/li>\n<li><strong>Amazon / Netflix:<\/strong> recommendation analytics drive a large share of sales/viewing.<\/li>\n<li><strong>Banks (including in Nepal):<\/strong> dashboards for NPL monitoring, branch performance and customer segmentation; regulatory reporting to NRB.<\/li>\n<li><strong>Telecoms (e.g. Ncell, Nepal Telecom):<\/strong> churn analysis, usage-based offers, network-performance dashboards.\n<strong>Lessons:<\/strong> clear objectives, executive support, high data quality, user adoption, iterative delivery.<\/li>\n<\/ul>"}], "defs": [["Business Intelligence", "Technologies and processes turning data into actionable information for decisions."], ["Data warehouse", "Subject-oriented, integrated, time-variant, non-volatile data store for decision support."], ["Data mart", "Departmental subset of a data warehouse."], ["ETL", "Extract, Transform, Load — process of moving data into the warehouse."], ["Metadata", "Data about data: source, meaning, structure, transformations."], ["Fact table", "Table of numeric measures with foreign keys to dimensions."], ["Dimension table", "Descriptive attributes giving context to facts."], ["Star schema", "Central fact table linked to denormalised dimension tables."], ["Data mining", "Discovering patterns and knowledge from large data."], ["Classification", "Supervised assignment of records to predefined classes."], ["Clustering", "Unsupervised grouping of similar records."], ["Support", "Fraction of transactions containing an itemset."], ["Confidence", "P(Y | X) for rule X→Y."], ["OLAP", "Multidimensional, interactive analysis of data cubes."], ["Dashboard", "Single-screen visual display of key KPIs."], ["KPI", "Key performance indicator — measurable value tracking objectives."]], "revision": "<p><strong>IT 249 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> BI definition, pipeline (sources → ETL → DW → OLAP/mining → dashboards → decisions), benefits; BI vs analytics.<\/li>\n<li><strong>U2:<\/strong> DW = subject-oriented, integrated, time-variant, non-volatile · OLTP vs OLAP · ETL steps · architecture layers (sources, staging, DW + marts + metadata, OLAP, front end) · Inmon vs Kimball · star (fact + dimensions, grain) vs snowflake vs galaxy.<\/li>\n<li><strong>U3:<\/strong> KDD steps · preprocessing (clean, integrate, transform, reduce) · supervised vs unsupervised · decision tree (entropy, Gini) vs Naive Bayes · K-means steps · association: support, confidence, lift; Apriori. <strong>Practise one support/confidence calculation.<\/strong><\/li>\n<li><strong>U4:<\/strong> principles (simplicity, right chart, data-ink, accurate axes) · chart selection · dashboard best practices · design a sales dashboard (KPI cards, trend, category, region, funnel, slicers).<\/li>\n<li><strong>U5:<\/strong> Power BI (Power Query, DAX, Service), Tableau · OLAP ops: roll-up, drill-down, slice, dice, pivot; MOLAP/ROLAP/HOLAP.<\/li>\n<li><strong>U6:<\/strong> challenges (data quality, sponsorship, adoption, cost, privacy) · best practices · phased plan (assess → pilot → build → rollout → advanced → review).<\/li>\n<\/ul>", "practice": ["[AI practice] Differentiate OLTP and OLAP. (3)", "[AI practice] Compute support and confidence for {Milk → Eggs} in the 5-transaction example. (3)", "[AI practice] Draw a star schema for a hospital admissions data mart. (5)", "[AI practice] Explain roll-up, drill-down, slice and dice with an example cube. (5)", "[AI practice] A bank in Nepal wants to reduce loan defaults using BI. Propose the data, model and dashboards. (10)"], "checklist": ["Define BI and draw its pipeline", "List the four DW characteristics", "Explain ETL steps", "Draw DW architecture", "Draw a star schema and explain the grain", "Explain preprocessing steps", "Compare supervised and unsupervised learning", "Compare decision tree and Naive Bayes", "Calculate support, confidence, lift", "Explain dashboard best practices", "Design a sales dashboard", "Explain OLAP operations", "Write a phased BI implementation plan"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question 2026 (IT 249)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "RCH 201", "id": "RCH201", "title": "Business Research Methods", "sem": 6, "exam": "2026-12-07", "official": "RCH 201: Business Research Methods (common to BBA/BIM 6th semester)", "syllabus": "BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH", "note": "Matches routine. The April 2025 paper header reads 'BBA / BIM, Sixth Semester, RCH 201' — the same paper serves both programmes.", "marks": "Full Marks 100, Pass 50, 3 hrs. Group A 10×2=20 · Group B 6×5=30 (any 6 of 7) · Group C 3×10=30 (any 3 of 4) · Group D case 4×5=20.", "objectives": "Introduce business research with an applied problem-solving focus — problem identification, theoretical framework, hypotheses, design, measurement, sampling, data collection and analysis, and report writing.", "units": [{"n": 1, "t": "Introduction", "lh": 8, "topics": "Meaning and features of scientific research; basic vs applied research; research process; positivism vs interpretivism; management research and decision-making; scientific thinking for business problems; ethics in business research."}, {"n": 2, "t": "Literature Searching and Theoretical Framework", "lh": 5, "topics": "Literature survey (concept, purpose, steps); online literature search; theoretical framework; research problem; objectives; hypothesis formulation; deductive vs inductive approaches."}, {"n": 3, "t": "Research Design", "lh": 5, "topics": "Concept; quantitative designs (descriptive, correlational, causal-comparative, experimental); qualitative designs (case study, ethnography, grounded theory)."}, {"n": 4, "t": "Measurement, Scaling and Sampling", "lh": 8, "topics": "Variables (independent, dependent, moderating); scales (nominal, ordinal, interval, ratio); attitude scales — rank order, semantic differential, Likert; validity and reliability; measurement problems; sampling process; probability (simple random, systematic, stratified, cluster) and non-probability (convenience, judgemental, quota) sampling; sampling and non-sampling errors; sample size."}, {"n": 5, "t": "Data Collection and Analysis", "lh": 12, "topics": "Secondary and primary data; questionnaire design; face-to-face, telephone and computer-assisted interviews; observation; tables, charts, graphs; descriptive and inferential statistics; qualitative data collection; content, narrative, discourse and grounded-theory analysis; chi-square tests (goodness of fit, independence)."}, {"n": 6, "t": "Research Proposal and Report Writing", "lh": 10, "topics": "Topic selection; proposal purpose, types, structure; report-writing process and style; typing and layout; APA citation and referencing; qualities of a good report."}], "avail": "<p><strong>Actual NC papers found: 1 — April 2025 regular<\/strong>, confirmed by two independent transcriptions (tupapers, with the official TU header, and bimstudies). The <strong>December 2025<\/strong> NC sitting (12 Dec 2025) paper was <strong>not found — unavailable<\/strong>.<\/p>\n<p><strong>TU Model Question (6th semester, 2025)<\/strong> was retrieved only in part: Group A items 6–10, Group B items 14–16, and parts of the Group D case.<\/p>\n<p>This subject has the <strong>clearest evidence that TU repeats model-question concepts in the real exam<\/strong> (see the analysis section).<\/p>", "pattern": "<p><strong>Model → exam repetitions (verified):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Concept<\/th>\n<th>TU Model 2025<\/th>\n<th>April 2025 exam<\/th>\n<th>Type of repeat<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Applied research<\/td>\n<td>A7<\/td>\n<td>A1<\/td>\n<td><strong>Near-identical wording<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Theoretical framework with DV/IV/moderating variables<\/td>\n<td>D22(c)<\/td>\n<td>D22(c)<\/td>\n<td><strong>Identical case sub-question<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Justify the research design used in a study<\/td>\n<td>D22(b)<\/td>\n<td>D22(d)<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Research design and its types<\/td>\n<td>B14<\/td>\n<td>C19 (upgraded to 10 marks)<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Probability sampling techniques<\/td>\n<td>B15<\/td>\n<td>C20 (upgraded to 10 marks)<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Telephone / personal interview<\/td>\n<td>B16<\/td>\n<td>A7<\/td>\n<td>Same concept<\/td>\n<\/tr>\n<tr>\n<td>Importance of literature<\/td>\n<td>A8<\/td>\n<td>B11 (steps of literature survey)<\/td>\n<td>Related concept<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lesson:<\/strong> TU's model paper predicted roughly a third of the real paper's concepts. Expect the Group D case to again ask for <strong>research questions/hypotheses, a theoretical-framework diagram, justification of design and choice of statistics.<\/strong><\/p>\n<p><strong>Question types:<\/strong> definitions with examples (Likert example, APA reference, moderating-variable examples) · describe/differentiate · long theory answers · applied case. <strong>No pure numerical<\/strong> in 2025, but chi-square is in the syllabus — know one worked example.<\/p>", "papers": [{"id": "E25", "label": "Apr 2025 exam", "cat": "A", "session": "April 2025 regular (BBA/BIM 6th sem)", "source": "tupapers.com mirror (TU header) — matches bimstudies copy", "url": "https://tupapers-com.pages.dev/course/bba/sixth-semester/business-research-methods/business-research-methods-2025", "note": "The case text is summarised.", "qs": [{"no": "1", "g": "A", "t": "Give the concept of applied research.", "m": 2, "u": 1}, {"no": "2", "g": "A", "t": "Define the term theoretical framework.", "m": 2, "u": 2}, {"no": "3", "g": "A", "t": "What is ethnography?", "m": 2, "u": 3}, {"no": "4", "g": "A", "t": "Define a dependent variable with an example.", "m": 2, "u": 4}, {"no": "5", "g": "A", "t": "Provide an example of a five-point Likert scale.", "m": 2, "u": 4}, {"no": "6", "g": "A", "t": "What is grounded theory?", "m": 2, "u": 3}, {"no": "7", "g": "A", "t": "Give the concept of telephone interviews.", "m": 2, "u": 5}, {"no": "8", "g": "A", "t": "Define deductive approaches.", "m": 2, "u": 2}, {"no": "9", "g": "A", "t": "Give any two examples of a moderating variable.", "m": 2, "u": 4}, {"no": "10", "g": "A", "t": "Provide an example of referencing an article in APA format.", "m": 2, "u": 6}, {"no": "11", "g": "B", "t": "Describe the steps of a literature survey.", "m": 5, "u": 2}, {"no": "12", "g": "B", "t": "Describe the ethical issues in business research.", "m": 5, "u": 1}, {"no": "13", "g": "B", "t": "Explain the methods of collecting qualitative data.", "m": 5, "u": 5}, {"no": "14", "g": "B", "t": "Give a brief note on the types of measurement scales with examples.", "m": 5, "u": 4}, {"no": "15", "g": "B", "t": "Differentiate research philosophies: positivism vs interpretivism.", "m": 5, "u": 1}, {"no": "16", "g": "B", "t": "'Research is formalised curiosity… pursued with a purpose.' Justify.", "m": 5, "u": 1}, {"no": "17", "g": "B", "t": "Outline the essentials of a good research report in management research.", "m": 5, "u": 6}, {"no": "18", "g": "C", "t": "Define scientific research. Explain the steps of the scientific research process.", "m": 10, "u": 1}, {"no": "19", "g": "C", "t": "What is research design? Describe the types of quantitative research designs.", "m": 10, "u": 3}, {"no": "20", "g": "C", "t": "What is probability sampling? Explain its techniques.", "m": 10, "u": 4}, {"no": "21", "g": "C", "t": "What is a research proposal? Explain the procedure for writing a research report.", "m": 10, "u": 6}, {"no": "22", "g": "D", "t": "Case — bank service quality and customer satisfaction, Bharatpur (quantitative, questionnaire, 421 customers, probability sampling, descriptive/inferential/bivariate analysis; largest gap in tangibility; weak positive correlation with empathy). (a) List five research/survey questions (b) Why were inferential statistics used? (c) Draw a theoretical framework with dependent, independent and moderating variables (d) Justify why the design is quantitative.", "m": 20, "u": 5}]}, {"id": "M", "label": "TU model 2025 (partial)", "cat": "C", "session": "TU FOM Model Question, BBA/BIM/BBM 6th sem 2025 (fragments)", "source": "TU FOM 'Model Question for BBA BIM and BBM 6th Semester 2025.pdf' — search-result fragments; the full PDF would not open", "url": "https://fomecd.edu.np/cms/dhurbas/Model%20Question%20for%20BBA%20BIM%20and%20BBM%206th%20Semester%202025.pdf", "note": "Only the items below could be read.", "qs": [{"no": "6", "g": "A", "t": "Define face-to-face interview with an example.", "m": 2, "u": 5}, {"no": "7", "g": "A", "t": "Define applied research in your words.", "m": 2, "u": 1}, {"no": "8", "g": "A", "t": "Why is literature essential in research?", "m": 2, "u": 2}, {"no": "9", "g": "A", "t": "What is a research problem?", "m": 2, "u": 2}, {"no": "10", "g": "A", "t": "What do you mean by a cohort study?", "m": 2, "u": 3}, {"no": "14", "g": "B", "t": "What is research design? Explain any two types of research design.", "m": 5, "u": 3}, {"no": "15", "g": "B", "t": "Define sampling. Discuss any two probability sampling techniques.", "m": 5, "u": 4}, {"no": "16", "g": "B", "t": "What is a research interview? Discuss personal and telephone interviews in brief.", "m": 5, "u": 5}, {"no": "22", "g": "D", "t": "Case — study of the impact of CSR activities (partly legible): (b) Which research design is used in this study, and why? (c) Draw a theoretical framework with dependent, independent and moderating variables. (d) Develop research hypotheses.", "m": 20, "u": 2}]}], "notes": {"1": "<h3>1.1 Meaning and features of scientific research<\/h3>\n<p>Systematic, organised, data-based, critical, objective inquiry into a problem in order to find answers. <strong>Hallmarks:<\/strong> purposiveness, rigour, testability, replicability, precision and confidence, objectivity, generalisability, parsimony.<\/p>\n<h3>1.2 Basic vs applied research<\/h3>\n<p>Basic: extends knowledge and theory. Applied: solves a current problem for decision-makers.<\/p>\n<h3>1.3 Research process<\/h3>\n<p>Problem area → preliminary data/literature → problem definition → theoretical framework → hypotheses → research design → data collection → analysis → interpretation → report.<\/p>\n<h3>1.4 Positivism vs interpretivism<\/h3>\n<p>Positivism: objective reality, quantitative, deductive, large samples. Interpretivism: socially constructed reality, qualitative, inductive, small purposive samples. Pragmatism mixes both.<\/p>\n<h3>1.5 Management research and decision-making<\/h3>\n<p>Management research supplies information for planning, problem-solving, evaluating alternatives and monitoring performance in marketing, finance, HR and operations; it reduces uncertainty and risk.<\/p>\n<h3>1.6 Scientific thinking for business problems<\/h3>\n<p>Precise problem definition, evidence over intuition, testing assumptions, objectivity, systematic logic, openness to disconfirming evidence.<\/p>\n<h3>1.7 Ethics in business research<\/h3>\n<p>Informed consent, voluntary participation, confidentiality/anonymity, no harm or deception, honest reporting, no plagiarism or fabrication, protecting the sponsor's confidentiality, avoiding conflicts of interest.<\/p>\n<p><strong>Key points:<\/strong> eight hallmarks · basic vs applied · 10-step process · philosophies · ethics.<\/p>", "2": "<h3>2.1 Literature survey: concept, purpose and steps<\/h3>\n<p>A review of published and unpublished work on the topic. <strong>Purposes:<\/strong> identify the gap, avoid duplication, define the problem, identify variables, choose methods, support discussion. <strong>Steps:<\/strong> keywords → search → screen → read critically → organise → synthesise → write and cite.<\/p>\n<h3>2.2 Online literature search<\/h3>\n<p>Databases: Google Scholar, JSTOR, Emerald, ScienceDirect, EBSCO, NepJOL, TU Central Library repositories. Use Boolean operators (AND, OR, NOT), quotation marks, filters by year; check credibility (peer review, citations); use reference managers (Zotero, Mendeley).<\/p>\n<h3>2.3 Theoretical framework<\/h3>\n<p>A conceptual model of the relationships among variables, drawn from theory. Components: variables, relationships (arrows), explanation of why. Variables: independent, dependent, moderating, mediating.<\/p>\n<h3>2.4 Research problem<\/h3>\n<p>A gap or difficulty to investigate. Criteria: clear, specific, researchable, significant, feasible, ethical.<\/p>\n<h3>2.5 Research objectives<\/h3>\n<p>General objective + specific objectives using action verbs (to examine, to identify, to analyse).<\/p>\n<h3>2.6 Hypothesis formulation<\/h3>\n<p>A testable statement of the relationship between variables: null (H0) and alternative (H1); directional or non-directional. Criteria: testable, clear, specific, theory-based.<\/p>\n<h3>2.7 Deductive vs inductive approaches<\/h3>\n<p>Deductive: theory → hypothesis → observation → confirmation. Inductive: observation → pattern → tentative hypothesis → theory.<\/p>\n<p><strong>Key points:<\/strong> literature-survey purposes and steps · online search tips · framework components · problem criteria · H0/H1 · deduction vs induction.<\/p>", "3": "<h3>3.1 Concept of research design<\/h3>\n<p>The master plan specifying methods for collecting and analysing data. Elements: purpose (exploratory, descriptive, causal), type of investigation, researcher interference, setting (contrived/non-contrived), unit of analysis, time horizon (cross-sectional/longitudinal).<\/p>\n<h3>3.2 Quantitative designs<\/h3>\n<ul>\n<li><strong>Descriptive<\/strong> — describes characteristics (surveys).<\/li>\n<li><strong>Correlational<\/strong> — measures relationships without manipulation.<\/li>\n<li><strong>Causal-comparative (ex-post-facto)<\/strong> — compares existing groups to infer causes.<\/li>\n<li><strong>Experimental<\/strong> — manipulation + control + random assignment (true, quasi, pre-experimental; lab vs field).<\/li>\n<\/ul>\n<h3>3.3 Qualitative designs<\/h3>\n<ul>\n<li><strong>Case study<\/strong> — in-depth study of a single unit with multiple sources.<\/li>\n<li><strong>Ethnography<\/strong> — immersion in a group's natural setting; participant observation.<\/li>\n<li><strong>Grounded theory<\/strong> — theory built from data through coding and constant comparison.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> design elements · four quantitative and three qualitative designs.<\/p>", "4": "<h3>4.1 Variables<\/h3>\n<p>Independent (cause), dependent (outcome), moderating (changes the strength of the relationship), mediating (explains how), control and extraneous variables.<\/p>\n<h3>4.2 Measurement scales<\/h3>\n<p>Nominal · ordinal · interval · ratio (NOIR) — each adds a property (category, order, equal intervals, true zero).<\/p>\n<h3>4.3 Attitude scales<\/h3>\n<p>Rank-order · semantic differential (bipolar adjectives) · Likert (5/7-point agreement) · also Stapel, constant-sum, graphic rating. <strong>Construction:<\/strong> define the construct → generate items → pre-test → item analysis → check reliability and validity.<\/p>\n<h3>4.4 Validity and reliability<\/h3>\n<p>Validity: content, criterion (concurrent, predictive), construct (convergent, discriminant). Reliability: test–retest, parallel forms, split-half, internal consistency (Cronbach's α ≥ 0.7).<\/p>\n<h3>4.5 Measurement problems<\/h3>\n<p>Respondent bias, interviewer bias, instrument wording, situational factors, social desirability, coding errors.<\/p>\n<h3>4.6 Sampling process<\/h3>\n<p>Define population → sampling frame → method → sample size → select → collect.<\/p>\n<h3>4.7 Probability and non-probability sampling<\/h3>\n<p>Probability: simple random, systematic, stratified, cluster (multistage). Non-probability: convenience, judgemental/purposive, quota, snowball.<\/p>\n<h3>4.8 Sampling and non-sampling errors; sample size<\/h3>\n<p>Sampling error falls with larger n; non-sampling errors arise from frame, non-response, measurement and processing. Sample size n = Z²pq/e² (≈ 384 at 95%, ±5%).<\/p>\n<p><strong>Key points:<\/strong> variable types · NOIR · attitude scales · validity/reliability types · sampling methods · errors · n formula.<\/p>", "5": "<h3>5.1 Secondary and primary data<\/h3>\n<p>Secondary: existing data (NRB, CBS/NSO, company reports, journals) — cheap and fast but may be outdated or ill-fitting. Primary: first-hand (survey, interview, observation, experiment) — specific but costly.<\/p>\n<h3>5.2 Questionnaire design and writing<\/h3>\n<p>Objectives → content → question types (open, closed, dichotomous, multiple choice, Likert) → wording (simple, unbiased, single idea) → sequence (funnel) → layout → pre-test → finalise.<\/p>\n<h3>5.3 Interviews<\/h3>\n<p>Face-to-face, telephone and computer-assisted (CATI, CAPI, CAWI); structured, semi-structured, unstructured; pros and cons of each.<\/p>\n<h3>5.4 Observation<\/h3>\n<p>Participant vs non-participant; structured vs unstructured; disguised vs undisguised; natural vs contrived; records actual behaviour; observer bias is a risk.<\/p>\n<h3>5.5 Presenting data<\/h3>\n<p>Tables, bar charts, pie charts, line graphs, histograms, frequency polygons, ogives, scatter diagrams.<\/p>\n<h3>5.6 Descriptive and inferential statistics<\/h3>\n<p>Descriptive: central tendency, dispersion, frequency. Inferential: t-test, ANOVA, chi-square, correlation, regression, p-values and significance.<\/p>\n<h3>5.7 Qualitative data collection and analysis<\/h3>\n<p>In-depth interviews, focus groups, observation, documents. Analysis: content, narrative, discourse, grounded-theory and thematic analysis.<\/p>\n<h3>5.8 Chi-square tests<\/h3>\n<p>Goodness of fit (df = k − 1) and independence (df = (r−1)(c−1)); χ² = Σ(O−E)²/E; compare with the critical value.<\/p>\n<p><strong>Key points:<\/strong> data types · questionnaire steps · interview and observation types · charts · statistics · qualitative analysis · chi-square.<\/p>", "6": "<h3>6.1 Topic selection<\/h3>\n<p>Interest, significance, feasibility (time, cost, data access), researchability, supervisor expertise, ethical acceptability, a gap in the literature.<\/p>\n<h3>6.2 Research proposal: purpose, types and structure<\/h3>\n<p>Purpose: plan and justify the study and obtain approval/funding. Types: solicited/unsolicited, internal/external, academic/business. Structure: title, background, problem, objectives, hypotheses, literature review, methodology, significance, limitations, schedule, budget, references.<\/p>\n<h3>6.3 Report-writing process and style<\/h3>\n<p>Logical analysis → outline → rough draft → revision → references → final draft. Style: objective, third person, past tense for findings, concise, consistent terms, tables and figures numbered and cited.<\/p>\n<h3>6.4 Typing and layout<\/h3>\n<p>A4, consistent fonts and spacing, margins, heading hierarchy, page numbering (Roman for preliminaries), captions, appendices.<\/p>\n<h3>6.5 APA citation and referencing<\/h3>\n<p>In-text (Author, Year); reference list alphabetical with hanging indent; formats for journals, books and websites (see the APA guide).<\/p>\n<h3>6.6 Qualities of a good report<\/h3>\n<p>Clear purpose, logical structure, accuracy, objectivity, clarity, adequate methodology, proper presentation, sound analysis, actionable recommendations, correct citation, executive summary, limitations.<\/p>\n<p><strong>Key points:<\/strong> topic criteria · proposal structure · writing steps · layout · APA · qualities.<\/p>"}, "qa": [{"id": "RCH201-01", "t": "Scientific research: meaning, features, process", "u": 1, "q": "Define scientific research. Explain the steps of the scientific research process.", "m": 10, "p": "High", "ty": "Long answer", "seen": {"E25": "Q18"}, "rep": false, "src": "Apr 2025 exam Q18", "a": "<p><strong>Scientific research<\/strong> is a systematic, controlled, empirical and critical investigation of phenomena, guided by theory and hypotheses, to find answers to problems.<\/p>\n<p><strong>Features (hallmarks — Sekaran):<\/strong> purposiveness · rigour · testability · replicability · precision and confidence · objectivity · generalisability · parsimony.<\/p>\n<p><strong>Steps of the scientific (hypothetico-deductive) research process<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 602\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">1. Identify broad problem area<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">2. Preliminary data gathering / literature review<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">3. Problem definition and objectives<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">4. Theoretical framework<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">5. Hypothesis development<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">6. Research design<\/text><line x1=\"182.0\" y1=\"353\" x2=\"182.0\" y2=\"370\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"374\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"398.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">7. Data collection<\/text><line x1=\"182.0\" y1=\"415\" x2=\"182.0\" y2=\"432\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"436\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"460.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">8. Data analysis<\/text><line x1=\"182.0\" y1=\"477\" x2=\"182.0\" y2=\"494\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"498\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"522.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">9. Interpretation and conclusion<\/text><line x1=\"182.0\" y1=\"539\" x2=\"182.0\" y2=\"556\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"560\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"584.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">10. Report writing<\/text><\/svg><\/div>\n\n<ol>\n<li><strong>Observation / identify the problem area<\/strong> — e.g. falling customer satisfaction.<\/li>\n<li><strong>Preliminary data gathering<\/strong> — interviews and literature survey.<\/li>\n<li><strong>Problem formulation<\/strong> — a clear, researchable problem statement and objectives.<\/li>\n<li><strong>Theoretical framework<\/strong> — variables and their relationships.<\/li>\n<li><strong>Hypotheses<\/strong> — testable statements.<\/li>\n<li><strong>Research design<\/strong> — type, sampling, measurement, data-collection methods.<\/li>\n<li><strong>Data collection.<\/strong><\/li>\n<li><strong>Data analysis<\/strong> — descriptive and inferential statistics.<\/li>\n<li><strong>Deduction / interpretation<\/strong> — accept or reject hypotheses; answer the questions.<\/li>\n<li><strong>Report writing and presentation<\/strong> — and recommendations for management.<\/li>\n<\/ol>\n<p><strong>Conclusion:<\/strong> following these steps makes findings objective, reliable and useful for decisions.<\/p>"}, {"id": "RCH201-02", "t": "Basic vs applied research", "u": 1, "q": "Give the concept of applied research. How is it different from basic research?", "m": 2, "p": "High", "ty": "Definition", "seen": {"E25": "A1", "M": "A7"}, "rep": true, "src": "Apr 2025 exam A1; TU model 2025 (partial) A7", "a": "<p><strong>Applied research<\/strong> is conducted to solve a specific, current problem faced by an organisation or society; its results are used immediately for decisions. <em>Example:<\/em> a study on why a bank's customers are switching to competitors.<\/p>\n<p><strong>Basic (pure/fundamental) research<\/strong> aims to expand general knowledge and theory without immediate practical use. <em>Example:<\/em> developing a general theory of service quality.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Basic<\/th>\n<th>Applied<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Purpose<\/td>\n<td>Generate knowledge<\/td>\n<td>Solve a specific problem<\/td>\n<\/tr>\n<tr>\n<td>Use<\/td>\n<td>Long-term, general<\/td>\n<td>Immediate, specific<\/td>\n<\/tr>\n<tr>\n<td>Generalisability<\/td>\n<td>High<\/td>\n<td>Context-specific<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "RCH201-03", "t": "Research as formalised curiosity", "u": 1, "q": "'Research is formalised curiosity — it is poking and prying with a purpose.' (Zora Neale Hurston) Justify this statement.", "m": 5, "p": "High", "ty": "Justify", "seen": {"E25": "Q16"}, "rep": false, "src": "Apr 2025 exam Q16", "a": "<ul>\n<li><strong>Curiosity<\/strong> — research begins with a question: \"why are sales falling?\"<\/li>\n<li><strong>Formalised<\/strong> — curiosity is channelled through a systematic, scientific process: problem definition, literature review, hypotheses, design, data collection and analysis.<\/li>\n<li><strong>Poking and prying<\/strong> — researchers dig into data and facts, question assumptions and explore relationships rather than accepting opinions.<\/li>\n<li><strong>With a purpose<\/strong> — research is goal-directed: to solve a problem, test a theory or support a decision; it is not random enquiry.<\/li>\n<li><strong>Evidence-based<\/strong> — conclusions rest on empirical evidence, so findings are objective and verifiable.<\/li>\n<\/ul>\n<p><em>Example:<\/em> a manager's curiosity about rising staff turnover becomes a formal study with a questionnaire, a sample of employees and a statistical test of the relationship between pay satisfaction and intention to quit.<\/p>\n<p><strong>Conclusion:<\/strong> the statement correctly captures research as disciplined, purposeful curiosity.<\/p>"}, {"id": "RCH201-04", "t": "Positivism vs interpretivism", "u": 1, "q": "Differentiate the research philosophies of positivism and interpretivism.", "m": 5, "p": "High", "ty": "Comparison", "seen": {"E25": "Q15"}, "rep": false, "src": "Apr 2025 exam Q15", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Positivism<\/th>\n<th>Interpretivism<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reality (ontology)<\/td>\n<td>Single, objective, external<\/td>\n<td>Multiple, socially constructed<\/td>\n<\/tr>\n<tr>\n<td>Knowledge<\/td>\n<td>Observable, measurable facts<\/td>\n<td>Subjective meanings and experiences<\/td>\n<\/tr>\n<tr>\n<td>Researcher<\/td>\n<td>Independent, value-free<\/td>\n<td>Involved, value-laden<\/td>\n<\/tr>\n<tr>\n<td>Approach<\/td>\n<td>Deductive — test theory<\/td>\n<td>Inductive — build theory<\/td>\n<\/tr>\n<tr>\n<td>Methods<\/td>\n<td>Quantitative: surveys, experiments, statistics<\/td>\n<td>Qualitative: interviews, observation, case studies<\/td>\n<\/tr>\n<tr>\n<td>Sample<\/td>\n<td>Large, representative<\/td>\n<td>Small, purposive<\/td>\n<\/tr>\n<tr>\n<td>Outcome<\/td>\n<td>Generalisation, causal laws<\/td>\n<td>Deep understanding of context<\/td>\n<\/tr>\n<tr>\n<td>Example<\/td>\n<td>Effect of advertising spend on sales<\/td>\n<td>How employees experience organisational change<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Conclusion:<\/strong> many business studies use <strong>pragmatism<\/strong> (mixed methods), combining both.<\/p>"}, {"id": "RCH201-05", "t": "Ethics in business research", "u": 1, "q": "Describe the ethical issues in business research.", "m": 5, "p": "High", "ty": "Describe", "seen": {"E25": "Q12"}, "rep": false, "src": "Apr 2025 exam Q12", "a": "<p><strong>Towards respondents/participants:<\/strong> informed consent · voluntary participation and right to withdraw · confidentiality and anonymity · no harm, deception or embarrassment · privacy of personal data.<\/p>\n<p><strong>Researcher's integrity:<\/strong> no fabrication or falsification of data · no plagiarism — proper citation · objectivity, no biased selection of results · honest reporting of limitations.<\/p>\n<p><strong>Towards the sponsor/client:<\/strong> confidentiality of the client's information · no misuse of findings · avoiding conflicts of interest.<\/p>\n<p><strong>Sponsor's ethics:<\/strong> not pressuring the researcher to alter findings; not using research for manipulation.<\/p>\n<p><strong>Practices:<\/strong> ethics approval, consent forms, data security, debriefing participants.<\/p>"}, {"id": "RCH201-06", "t": "Management research and scientific thinking", "u": 1, "q": "Explain the role of management research in decision-making.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>Management research provides <strong>information that reduces uncertainty<\/strong> in decisions:<\/p>\n<ul>\n<li>identifies problems and opportunities (market research);<\/li>\n<li>evaluates alternatives (pricing, location, product design);<\/li>\n<li>monitors performance (employee satisfaction, service quality);<\/li>\n<li>predicts outcomes (demand forecasting);<\/li>\n<li>supports policy formulation and evaluation.\n<strong>Scientific thinking<\/strong> for business problems means defining problems precisely, using evidence rather than intuition, testing assumptions, and being objective and systematic. Managers who understand research can also judge consultants' reports critically.<\/li>\n<\/ul>"}, {"id": "RCH201-07", "t": "Literature survey: purpose and steps; online search", "u": 2, "q": "Describe the steps of a literature survey. Why is literature essential in research?", "m": 5, "p": "High", "ty": "Process", "seen": {"E25": "Q11", "M": "A8"}, "rep": true, "src": "Apr 2025 exam Q11; TU model 2025 (partial) A8", "a": "<p>A <strong>literature survey (review)<\/strong> is the documentation of a comprehensive review of published and unpublished work related to the research topic.<\/p>\n<p><strong>Why it is essential:<\/strong> shows what is already known and the research gap · avoids duplication · helps define the problem and objectives · identifies variables and builds the theoretical framework · suggests methods and instruments · supports discussion of findings.<\/p>\n<p><strong>Steps<\/strong><\/p>\n<ol>\n<li><strong>Identify keywords<\/strong> from the topic.<\/li>\n<li><strong>Search sources<\/strong> — journals, books, theses, reports; online databases (Google Scholar, JSTOR, Emerald, ScienceDirect, NepJOL).<\/li>\n<li><strong>Screen and select<\/strong> relevant, recent and credible works.<\/li>\n<li><strong>Read critically and take notes<\/strong> (purpose, method, findings, limitations).<\/li>\n<li><strong>Organise<\/strong> thematically or chronologically.<\/li>\n<li><strong>Synthesise<\/strong> — compare, contrast and identify the research gap.<\/li>\n<li><strong>Write the review<\/strong> and cite sources properly (APA).<\/li>\n<\/ol>"}, {"id": "RCH201-08", "t": "Theoretical framework; variables", "u": 2, "q": "Define a theoretical framework. Draw a framework showing dependent, independent and moderating variables for a bank service-quality study.", "m": 5, "p": "High", "ty": "Definition + diagram", "seen": {"E25": "A2, D22c", "M": "D22c"}, "rep": true, "src": "Apr 2025 exam A2, D22c; TU model 2025 (partial) D22c", "a": "<p>A <strong>theoretical framework<\/strong> is a conceptual model of how the researcher theorises the relationships among the variables relevant to the problem, based on literature. It identifies variables, shows their relationships and explains why they are expected.<\/p>\n<p><strong>Framework for the 2025 case (service quality → customer satisfaction):<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Tangibility<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Reliability<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Responsiveness<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Assurance<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Empathy<\/text><\/svg><\/div>\n\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 290 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Service quality<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(IV)<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Customer<\/text><text x=\"224.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">satisfaction (DV)<\/text><\/svg><\/div>\n\n<p><em>Moderating variable:<\/em> customer <strong>age / gender / income<\/strong> (or
