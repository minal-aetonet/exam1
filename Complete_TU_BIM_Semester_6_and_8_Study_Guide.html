olicy", "Government's use of taxation and expenditure to achieve economic goals."], ["Monetary policy", "Central bank's control of money supply and interest rates (NRB in Nepal)."], ["Political risk", "Risk that political events or decisions harm business."], ["Acculturation", "Adoption of traits of another culture while retaining one's own."], ["Assimilation", "Complete absorption into a dominant culture."], ["Technology transfer", "Movement of technology and know-how across firms or countries."], ["FDI", "Investment by a foreign entity giving lasting control of a domestic enterprise."], ["SAFTA", "South Asian Free Trade Area (2004/2006)."], ["WTO", "World Trade Organization; Nepal joined in 2004 as the 147th member."], ["Privatisation", "Transfer of ownership/management of public enterprises to the private sector."], ["TEPC", "Trade and Export Promotion Centre — Nepal's export-promotion agency."]], "revision": "<p><strong>MGT 236 — one page<\/strong><\/p>\n<ul>\n<li><strong>Framework:<\/strong> internal / task / general (PESTEL) · characteristics · scanning: SWOT, PESTEL, ETOP, Delphi, scenario, QUEST; systematic / regular / ad-hoc.<\/li>\n<li><strong>Firm-specific:<\/strong> mission, structure, culture (alignment), operations (capacity, SCM, quality), HRM, finance, technology.<\/li>\n<li><strong>Macro-economic:<\/strong> GDP, inflation, unemployment, remittance, trade deficit · fiscal vs monetary · policies (industrial, privatisation, trade, tourism, monetary) · capital-market reforms (SEBON, demat, online trading, ASBA, Mero Share) · migration · 16th Plan.<\/li>\n<li><strong>Political-legal:<\/strong> political risk · stability → investment · start-up laws: Companies Act 2063, IEA 2076, FITTA 2075, Labour Act 2074, Income Tax Act 2058, VAT Act 2052, Consumer Protection Act 2075, Competition Act 2063.<\/li>\n<li><strong>Socio-cultural:<\/strong> marriage age, female education, nuclear families, class, acculturation vs assimilation.<\/li>\n<li><strong>Technology/energy:<\/strong> tech-transfer issues · energy: hydro potential, export to India/Bangladesh, EVs; threats: seasonality, transmission, climate · Digital Nepal Framework · AI.<\/li>\n<li><strong>Global:<\/strong> SAARC 1985 (Kathmandu secretariat), SAPTA, SAFTA 2004/06, BIMSTEC 1997 · WTO 2004 (147th) · FDI rationale vs reasons for low inflow.<\/li>\n<li><strong>Agencies:<\/strong> DoI, NRB, NCC, TEPC, FNCCI, SCIDB, NTIP, MoLESS, MoICS.<\/li>\n<li><strong>Case skill:<\/strong> issues → prospects/challenges → action plan → role of technology.<\/li>\n<\/ul>", "practice": ["[AI practice] Explain the privatisation policy of Nepal and its methods. (10)", "[AI practice] Explain the role of organisational culture in business performance. (5)", "[AI practice] Describe the employment and labour-market situation of Nepal. (5)", "[AI practice] Explain business–government relations in the federal structure of Nepal. (5)", "[AI practice] Case: A Nepali carpet exporter faces falling demand, rising wages due to migration, and Indian non-tariff barriers. Analyse its environment and suggest strategies. (20)", "[AI practice] Explain the role of the Nepal Trade Information Portal. (5)"], "checklist": ["I can classify the business environment with a diagram", "I can explain 6 scanning techniques", "I can explain firm-specific factors including culture", "I can explain fiscal, monetary and 5 economic policies", "I can list capital-market reforms and their effects", "I can justify political stability → business", "I can list start-up laws with years", "I can explain 5 social changes and acculturation", "I can analyse the energy situation (O/T)", "I can explain FDI rationale and 8 reasons for low inflow", "I can explain SAFTA, BIMSTEC and WTO for Nepal", "I can explain TEPC, NRB, FNCCI and SCIDB", "I can answer a 4-part industry case"], "sources": [["TU FOM — BIM 6th Semester Syllabus 2024 (October 2024)", "https://www.fomecd.edu.np/syllabuses/BIM%206th%20Semester%20Syllabus%202024.pdf"], ["April 2025 MGT 236 paper (tupapers mirror)", "https://tupapers-com.pages.dev/course/bbm/sixth-semester/business-environment-in-nepal/business-environment-in-nepal-2025"], ["bimstudies — Business Environment Exam Question Solution BITM 6th Sem 2025", "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/business-environment-exam-question-solution-bitm-6th-sem-2025/"], ["TU FOM — Model Question for BBM 6th Semester (fragments)", "https://fomecd.edu.np/cms/dhurbas/Model%20Question%20for%20BBM%206th%20Smester.pdf"], ["BBM/BBA/BIM 4th & 6th Sem Exam Routine Dec 2025 (Collegesansar)", "https://collegesansar.com/bbm-bba-bim-4th-and-6th-sem-exam-routine-tu/"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "IT 250", "id": "IT250", "title": "Digital Economy", "sem": 8, "exam": "2026-12-03", "official": "IT 250: Digital Economy", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, dated November 2025) — 3 credit hours, 48 LH", "note": "Code and title match the routine and syllabus. No discrepancy.", "marks": "NOT CONFIRMED. No TU model question for IT 250 was found in the 2026 model-question document (which covers IT 248, 249, 275–278). The other IT-coded 8th-semester models (IT 249, IT 275–278) use Full Marks 60: Group A 10×1 · Group B 5×3 (any 5 of 6) · Group C 3×5 (any 3 of 4) · Group D 2×10. IT 250 will probably follow this, but check with your college.", "objectives": "Build cognitive knowledge and practical skills in applying digital technologies to economics and management.", "units": [{"n": 1, "t": "Introduction", "lh": 8, "topics": "Digital economics: concept, drivers, ecosystem; knowledge economy (K-economy): concept, drivers; digital economy vs K-economy; Fourth Industrial Revolution: drivers, opportunities, challenges; effects on sustainability, privacy, regulation and strategy."}, {"n": 2, "t": "Fundamentals of Digital Economy", "lh": 7, "topics": "Multi-sided platforms; network effects; positive feedback; lock-in and switching costs; monopoly formation; Digital Adoption Index; OECD government digital adoption index."}, {"n": 3, "t": "Digital Markets, Strategy and Innovation", "lh": 10, "topics": "Competition and cooperation; layered internet model; digital innovation; digital business models; value-creation models; modelling digital markets."}, {"n": 4, "t": "Digital Transformation", "lh": 8, "topics": "Concept and drivers; digital transformation for SDGs; technological revolution in the world economy; globalisation and growth in the digital age; digital currencies: concept and types."}, {"n": 5, "t": "Economics of Information", "lh": 8, "topics": "Asymmetric information: concept, determinants; asymmetric information and digitalisation; search engines and AI; strategy and the new economics of information; impact on consumer choice and labour markets; IP in a digital context."}, {"n": 6, "t": "Digitalisation in the Nepalese Perspective", "lh": 7, "topics": "E-governance: concept, process, structure; e-governance in Nepal; digital financial inclusion in Nepal; opportunities and challenges of public-sector digital transformation; digital transformation and economic performance in trade, tourism, agriculture and SMEs."}], "avail": "<p><strong>No actual paper and no TU model question are available for IT 250.<\/strong> December 2026 is the first sitting of the 8th-semester NC courses, and the TU Model Question 2026 document contains no IT 250 paper (searched separately as well). Frequency analysis is therefore <strong>impossible — insufficient data<\/strong>.<\/p>\n<p>Priorities in this guide are therefore based on <strong>syllabus weight<\/strong> (lecture hours) and how central a concept is to the course. They are <strong>not<\/strong> based on exam evidence: core concepts are marked <em>Medium (important syllabus topic)<\/em> and the rest <em>Coverage<\/em>. Every question here is Category D (AI-generated practice in the expected TU pattern) unless stated otherwise.<\/p>\n<p><strong>If your college has issued an IT 250 model or pre-board paper, upload it<\/strong> and I can map it into this guide.<\/p>", "pattern": "<p><strong>Insufficient data<\/strong> — no paper of any kind. Expect the TU 60-mark IT pattern: 10 one-line definitions, 6 short \"explain\" questions (any 5), 4 medium questions (any 3), and 2 ten-mark comprehensive questions, often scenario-based (e.g. Nepal e-governance or a platform business).<\/p>\n<p><strong>Syllabus weight:<\/strong> Unit 3 (10 LH) &gt; Units 1, 4, 5 (8 LH each) &gt; Units 2, 6 (7 LH each). The most \"examinable\" concepts are network effects / multi-sided platforms / lock-in (classic Shapiro–Varian ideas), the Fourth Industrial Revolution, digital business models, asymmetric information, digital currencies, and e-governance / digital financial inclusion in Nepal.<\/p>", "papers": [], "notes": {"1": "<h3>1.1 Digital economics: concept, drivers and ecosystem<\/h3>\n<p><strong>Digital economics<\/strong> studies how digital technologies change production, distribution, consumption, markets and policy. Key economic features of digital goods: <strong>near-zero marginal cost<\/strong>, <strong>non-rivalry<\/strong> (one person's use does not reduce another's), <strong>easy copying<\/strong>, <strong>network effects<\/strong>, <strong>data as an input<\/strong>.\n<strong>Drivers:<\/strong> connectivity · smartphones · cloud · data and AI · digital payments · platforms · policy and skills.\n<strong>Ecosystem:<\/strong> infrastructure → platforms → users → data → payments → regulation.<\/p>\n<h3>1.2 Knowledge economy (K-economy): concept and drivers<\/h3>\n<p>An economy based on producing and using knowledge. <strong>World Bank's four pillars:<\/strong> (1) economic and institutional regime, (2) education and skills, (3) innovation system, (4) ICT infrastructure.<\/p>\n<h3>1.3 Digital economy vs K-economy<\/h3>\n<p>The K-economy emphasises human capital and innovation; the digital economy emphasises digital infrastructure, data and online transactions. The digital economy is a technological expression of the knowledge economy.<\/p>\n<h3>1.4 Fourth Industrial Revolution (4IR)<\/h3>\n<p>1IR steam/mechanisation (late 18th century) → 2IR electricity/mass production → 3IR computers/automation → <strong>4IR cyber-physical systems<\/strong> (AI, IoT, robotics, 3D printing, biotech, blockchain).\n<strong>Opportunities:<\/strong> productivity, new business models, personalisation, leapfrogging. <strong>Challenges:<\/strong> job displacement, inequality, cyber risk, ethics, regulation.<\/p>\n<h3>1.5 Effects of the digital economy<\/h3>\n<ul>\n<li><strong>Sustainability:<\/strong> less paper and travel versus energy use and e-waste.<\/li>\n<li><strong>Privacy:<\/strong> surveillance capitalism, data breaches, need for data-protection law.<\/li>\n<li><strong>Regulation:<\/strong> platform competition, digital taxation, cross-border data flows.<\/li>\n<li><strong>Strategy:<\/strong> data-driven, platform and ecosystem strategies; agility.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> properties of digital goods · K-economy pillars · comparison · 1IR→4IR · four effects.<\/p>", "2": "<h3>2.1 Multi-sided platforms (MSPs)<\/h3>\n<p>Intermediaries connecting two or more interdependent groups (buyers–sellers, riders–drivers, users–advertisers). Value comes from <strong>interactions<\/strong>, not ownership of inventory. Pricing: subsidise the side that attracts the other (\"money side\" vs \"subsidy side\").<\/p>\n<h3>2.2 Network effects<\/h3>\n<ul>\n<li><strong>Direct:<\/strong> more users of the same type → more value (messaging apps).<\/li>\n<li><strong>Indirect/cross-side:<\/strong> more users on one side → more value to the other (app stores).<\/li>\n<li><strong>Data network effects:<\/strong> more use → more data → better service.<\/li>\n<li><strong>Negative effects:<\/strong> congestion, spam.<\/li>\n<\/ul>\n<h3>2.3 Positive feedback<\/h3>\n<p>Self-reinforcing growth: success → more users → more value → more success. It leads to <strong>tipping<\/strong>, <strong>critical mass<\/strong> and <strong>winner-take-most<\/strong> markets, and follows an S-shaped adoption curve (Rogers: innovators, early adopters, early majority, late majority, laggards).<\/p>\n<h3>2.4 Lock-in and switching costs<\/h3>\n<p><strong>Switching costs:<\/strong> monetary, learning, data-migration, contractual and social costs of changing supplier. <strong>Lock-in:<\/strong> customers stay because switching is costly. <strong>Lock-in cycle (Shapiro &amp; Varian):<\/strong> brand selection → sampling → entrenchment → lock-in. Firms use loyalty programmes, ecosystems and proprietary formats; customers should negotiate up front.<\/p>\n<h3>2.5 Monopoly formation in the digital economy<\/h3>\n<p>Network effects + economies of scale + data advantages + lock-in + acquisitions → dominant platforms (search, social media, app stores). Concerns: self-preferencing, high fees, reduced innovation → antitrust actions and new regulation (EU Digital Markets Act).<\/p>\n<h3>2.6 Digital Adoption Index (DAI)<\/h3>\n<p>World Bank index (2016) measuring digital adoption by <strong>people<\/strong> (mobile and internet access), <strong>business<\/strong> (websites, broadband, servers) and <strong>government<\/strong> (digital identity, online services, core administrative systems); 0–1 scale.<\/p>\n<h3>2.7 OECD government digital adoption index<\/h3>\n<p>The <strong>OECD Digital Government Index<\/strong> assesses six dimensions: digital by design · data-driven public sector · government as a platform · open by default · user-driven · proactiveness.<\/p>\n<p><strong>Key points:<\/strong> MSP pricing · four network-effect types · tipping/S-curve · switching costs and the lock-in cycle · how monopolies form · DAI three dimensions · OECD six dimensions.<\/p>", "3": "<h3>3.1 Competition and cooperation<\/h3>\n<p>Digital markets combine competition <em>for<\/em> the market with cooperation on standards, APIs and ecosystems (<strong>co-opetition<\/strong>). Examples: rival banks sharing payment switches; smartphone rivals sharing component suppliers; open standards (Wi-Fi, USB).<\/p>\n<h3>3.2 Layered internet model<\/h3>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Applications &amp; content<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Platforms &amp; intermediaries<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Internet services (cloud, hosting, CDN)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Networks (ISPs, mobile operators)<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Devices &amp; hardware<\/text><\/svg><\/div>\n\n<p>Market structure differs by layer: oligopoly in networks, network-effect giants in platforms, competitive application markets. Policy: net neutrality, platform competition, content regulation.<\/p>\n<h3>3.3 Digital innovation<\/h3>\n<p>New products, processes or business models enabled by digital technology. <strong>Characteristics:<\/strong> combinatorial (recombining components), generative (third parties build on platforms), rapid iteration, low cost of experimentation. <strong>Types:<\/strong> product, process, business-model, platform innovation. <em>Disruptive innovation<\/em> (Christensen) starts at the low end and moves up-market.<\/p>\n<h3>3.4 Digital business models<\/h3>\n<p>E-commerce retail · marketplace · subscription/SaaS · freemium · advertising · sharing economy · on-demand · data monetisation · crowdsourcing · direct-to-consumer.<\/p>\n<h3>3.5 Value-creation models<\/h3>\n<ul>\n<li><strong>Value chain<\/strong> (Porter) — sequential transformation (manufacturing).<\/li>\n<li><strong>Value shop<\/strong> — solving unique problems (consulting, software projects, hospitals).<\/li>\n<li><strong>Value network<\/strong> — mediating exchanges between users (platforms, telecoms, banks).\nDigital firms mostly use value networks, where value grows with the number of users.<\/li>\n<\/ul>\n<h3>3.6 Modelling digital markets<\/h3>\n<p>Two-sided pricing models · network-effect adoption models (critical mass) · zero-marginal-cost pricing (versioning, bundling, freemium) · switching-cost models · auctions (online ads) · data feedback loops. They explain free services, subsidies and concentration.<\/p>\n<p><strong>Key points:<\/strong> co-opetition · five-layer model · digital innovation features · business models · chain/shop/network · modelling tools.<\/p>", "4": "<h3>4.1 Digital transformation: concepts and drivers<\/h3>\n<p><strong>Digitisation<\/strong> (analogue → digital) → <strong>digitalisation<\/strong> (digital tools in processes) → <strong>digital transformation<\/strong> (fundamental change in the business model and culture).\n<strong>Drivers:<\/strong> customer expectations · competition · cost pressure · data and AI · cloud · regulation · crises.\n<strong>Pillars:<\/strong> strategy and leadership · customer experience · operations · technology · data · people and culture.<\/p>\n<h3>4.2 Digital transformation for the SDGs<\/h3>\n<p>Fintech → poverty and gender goals (SDG 1, 5) · agritech → SDG 2 · telemedicine → SDG 3 · e-learning → SDG 4 · smart energy → SDG 7/13 · digital infrastructure → SDG 9 · e-governance → SDG 16. <strong>Risk:<\/strong> the digital divide; it must be inclusive.<\/p>\n<h3>4.3 Technological revolution in the world economy<\/h3>\n<p>Productivity gains, new industries (cloud, AI, platforms), shifts in comparative advantage towards skills and data, the rise of intangible assets, the \"productivity paradox\" (Solow) — gains appear with lags.<\/p>\n<h3>4.4 Globalisation and economic growth in the digital age<\/h3>\n<p>Trade in digital services and data grows faster than goods; e-commerce lets SMEs export; IT outsourcing and freelancing create jobs in developing countries; global value chains are coordinated digitally. Issues: data localisation, digital taxes, cyber risk, uneven benefits.<\/p>\n<h3>4.5 Digital currencies: concept and types<\/h3>\n<p>Money in electronic form only. Types: <strong>e-money/mobile money<\/strong> (wallets backed by fiat) · <strong>cryptocurrency<\/strong> (decentralised blockchain — Bitcoin) · <strong>stablecoins<\/strong> (pegged) · <strong>CBDC<\/strong> (central-bank-issued) · <strong>virtual/in-game tokens<\/strong>.\n<strong>Blockchain basics:<\/strong> distributed ledger, blocks linked by hashes, consensus (proof-of-work/stake), immutability.\nNepal: crypto trading and mining are illegal per NRB; licensed wallets are legal.<\/p>\n<p><strong>Key points:<\/strong> three D's · drivers and pillars · SDG mapping · productivity paradox · digital globalisation · currency types + blockchain basics.<\/p>", "5": "<h3>5.1 Asymmetric information: concept and determinants<\/h3>\n<p>One party knows more than the other. <strong>Akerlof's \"market for lemons\"<\/strong> (used cars), <strong>adverse selection<\/strong> (hidden information before a contract), <strong>moral hazard<\/strong> (hidden action after a contract), <strong>principal–agent problem<\/strong>.\n<strong>Determinants:<\/strong> product complexity, experience/credence goods, cost of information, lack of reputation systems, weak disclosure laws.\n<strong>Remedies:<\/strong> signalling (warranties, certificates, brands), screening (credit checks), reputation, regulation.<\/p>\n<h3>5.2 Asymmetric information and digitalisation<\/h3>\n<p>Digital tools <strong>reduce<\/strong> asymmetry (reviews, ratings, comparison sites, digital credit histories, verified profiles) but <strong>create new<\/strong> asymmetry (platforms' data advantage, opaque algorithms, fake reviews).<\/p>\n<h3>5.3 Online search engines and AI<\/h3>\n<p>Search engines lower search costs, intensify price competition, act as attention gatekeepers and monetise via ads. AI recommendations personalise choice but can create filter bubbles and biased outcomes.<\/p>\n<h3>5.4 Strategy and the new economics of information<\/h3>\n<p>Information goods: high fixed cost, low marginal cost → <strong>price by value<\/strong> (personalised pricing), <strong>versioning<\/strong> (basic/pro), <strong>bundling<\/strong>; manage IP rights; use network effects and lock-in; compete on standards (Shapiro &amp; Varian, <em>Information Rules<\/em>).<\/p>\n<h3>5.5 Effects on consumer choice and labour markets<\/h3>\n<p><strong>Consumers:<\/strong> more variety (long tail), lower prices, convenience, personalisation; but manipulation, privacy loss, information overload.\n<strong>Labour:<\/strong> automation of routine tasks; new digital jobs; gig/platform work; remote work; skill-biased technological change; need for reskilling and social protection.<\/p>\n<h3>5.6 Intellectual property in the digital context<\/h3>\n<p>Easy copying → piracy; DRM; open source and Creative Commons; AI-generated content and training-data disputes; cross-border enforcement; Nepal's Copyright Act, 2059.<\/p>\n<p><strong>Key points:<\/strong> lemons/adverse selection/moral hazard · remedies · digital reduces and creates asymmetry · versioning and bundling · consumer and labour effects · digital IP.<\/p>", "6": "<h3>6.1 E-governance: concept, process and structure<\/h3>\n<p>Use of ICT to deliver government services and information. <strong>Models:<\/strong> G2C, G2B, G2G, G2E. <strong>Stages:<\/strong> emerging/information → interaction → transaction → transformation. <strong>Structure:<\/strong> policy/law → infrastructure (data centre, network) → interoperable databases and digital ID → service portals → security → human capacity.\n<strong>Benefits:<\/strong> transparency, efficiency, less corruption, convenience. <strong>Barriers:<\/strong> digital divide, literacy, infrastructure, resistance, privacy.<\/p>\n<h3>6.2 E-governance practices in Nepal<\/h3>\n<p>E-Governance Master Plan · ICT Policy 2072 · <strong>Digital Nepal Framework (2019)<\/strong> · National ID card · <strong>Nagarik App<\/strong> · online tax filing (IRD) · customs ASYCUDA · <strong>e-GP<\/strong> public procurement · online company registration (OCR) · online passport and licence forms · Government Integrated Data Centre · ConnectIPS for government payments.<\/p>\n<h3>6.3 Digital financial inclusion in Nepal<\/h3>\n<p>Wallets (eSewa, Khalti, IME Pay) · mobile/internet banking · QR payments (Fonepay, NepalPay) · ConnectIPS · branchless banking · digital remittances. <strong>Challenges:<\/strong> literacy, connectivity, fraud, trust, cost.<\/p>\n<h3>6.4 Opportunities and challenges of public-sector digital transformation<\/h3>\n<p><strong>Opportunities:<\/strong> faster services across difficult geography, data-driven policy, accountability. <strong>Challenges:<\/strong> legacy processes, system downtime, interoperability, cyber security, skilled staff, funding, political will.<\/p>\n<h3>6.5 Digital transformation and economic performance<\/h3>\n<ul>\n<li><strong>Trade:<\/strong> Nepal National Single Window, e-customs → faster clearance.<\/li>\n<li><strong>Tourism:<\/strong> online booking, digital marketing, e-permits.<\/li>\n<li><strong>Agriculture:<\/strong> price-information apps, advisory SMS, precision farming.<\/li>\n<li><strong>SMEs:<\/strong> social-commerce selling, digital accounting, wallets, access to credit.<\/li>\n<\/ul>\n<p><strong>Key points:<\/strong> G2C/G2B/G2G/G2E · four stages · Nepal examples · inclusion channels and challenges · sector impacts.<\/p>"}, "qa": [{"id": "IT250-01", "t": "Digital economy: concept, drivers, ecosystem", "u": 1, "q": "Define the digital economy. Explain its drivers and ecosystem.", "m": 10, "p": "Medium", "ty": "Concept", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>The <strong>digital economy<\/strong> is economic activity that results from billions of everyday online connections among people, businesses, devices, data and processes, enabled by information and communication technologies. It includes e-commerce, digital platforms, digital payments, cloud services, the app economy and digitally delivered services.<\/p>\n<p><strong>Drivers<\/strong><\/p>\n<ol>\n<li><strong>Internet and mobile connectivity<\/strong> (broadband, 4G/5G, smartphones).<\/li>\n<li><strong>Data<\/strong> as a key resource (\"data is the new oil\").<\/li>\n<li><strong>Cloud computing<\/strong> — cheap scalable infrastructure.<\/li>\n<li><strong>Digital payments and fintech.<\/strong><\/li>\n<li><strong>AI, IoT, big data, blockchain.<\/strong><\/li>\n<li><strong>Digital platforms<\/strong> connecting buyers and sellers.<\/li>\n<li><strong>Supportive policy and digital skills.<\/strong><\/li>\n<li><strong>Changing consumer behaviour<\/strong> (online shopping, remote work).<\/li>\n<\/ol>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 520 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"38.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.8749537379655\" y2=\"94.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"428.87495373796554\" y2=\"205.99999999999997\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"260.0\" y2=\"262.0\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"206.00000000000003\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><line x1=\"260.0\" y1=\"150.0\" x2=\"91.12504626203449\" y2=\"93.99999999999999\" stroke=\"#9fb3d1\" stroke-width=\"1.3\"/><ellipse cx=\"260.0\" cy=\"150.0\" rx=\"78\" ry=\"30\" fill=\"#3b5b8c\"/><text x=\"260.0\" y=\"147.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">Digital<\/text><text x=\"260.0\" y=\"161.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#fff\">ecosystem<\/text><rect x=\"198.0\" y=\"21.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"35.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Infrastructure<\/text><text x=\"260.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(networks, cloud)<\/text><rect x=\"366.8749537379655\" y=\"77.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.8749537379655\" y=\"98.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Platforms &amp; apps<\/text><rect x=\"366.87495373796554\" y=\"188.99999999999997\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"428.87495373796554\" y=\"209.99999999999997\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Users &amp; businesses<\/text><rect x=\"198.0\" y=\"245.0\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Data<\/text><rect x=\"29.125046262034488\" y=\"189.00000000000003\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"210.00000000000003\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Payments &amp; fintech<\/text><rect x=\"29.125046262034488\" y=\"76.99999999999999\" width=\"124\" height=\"34\" rx=\"7\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"91.12504626203449\" y=\"91.49999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Policy &amp;<\/text><text x=\"91.12504626203449\" y=\"104.49999999999999\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">regulation<\/text><\/svg><\/div>\n\n<p><strong>Ecosystem components:<\/strong> digital infrastructure · platforms and service providers · users (consumers, firms, government) · enabling institutions (regulators, standards, cyber security) · skills and innovation (universities, startups).<\/p>\n<p><strong>Characteristics:<\/strong> near-zero marginal cost of digital goods, network effects, data-driven, global reach, rapid innovation, winner-take-most markets.<\/p>"}, {"id": "IT250-02", "t": "Knowledge economy vs digital economy", "u": 1, "q": "What is a knowledge economy? How does the digital economy differ from the knowledge economy?", "m": 5, "p": "Medium", "ty": "Comparison", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>A <strong>knowledge economy (K-economy)<\/strong> is an economy in which the production, distribution and use of knowledge and information are the main drivers of growth, wealth and jobs. <strong>Drivers:<\/strong> education and human capital, R&amp;D and innovation, ICT, an institutional regime (IPR, rule of law).<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Knowledge economy<\/th>\n<th>Digital economy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Core resource<\/td>\n<td>Knowledge, skills, ideas<\/td>\n<td>Digital technologies and data<\/td>\n<\/tr>\n<tr>\n<td>Focus<\/td>\n<td>Innovation and human capital<\/td>\n<td>Online transactions, platforms<\/td>\n<\/tr>\n<tr>\n<td>Measurement<\/td>\n<td>R&amp;D spending, education, patents<\/td>\n<td>E-commerce value, internet users, digital payments<\/td>\n<\/tr>\n<tr>\n<td>Dependence on ICT<\/td>\n<td>Uses ICT as one pillar<\/td>\n<td>Built on ICT<\/td>\n<\/tr>\n<tr>\n<td>Examples<\/td>\n<td>Universities, consulting, biotech<\/td>\n<td>E-commerce, ride-hailing, fintech apps<\/td>\n<\/tr>\n<tr>\n<td>Scope<\/td>\n<td>Broader, older concept<\/td>\n<td>A subset/evolution enabled by digitisation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Relationship:<\/strong> the digital economy is the technological platform through which today's knowledge economy largely operates.<\/p>"}, {"id": "IT250-03", "t": "Fourth Industrial Revolution (4IR)", "u": 1, "q": "Explain the Fourth Industrial Revolution: its drivers, opportunities and challenges.", "m": 10, "p": "Medium", "ty": "Concept + analysis", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>The <strong>Fourth Industrial Revolution (4IR)<\/strong>, a term popularised by Klaus Schwab (World Economic Forum), is the fusion of physical, digital and biological technologies — cyber-physical systems.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 606 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">1IR: steam,<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">mechanisation<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">2IR: electricity,<\/text><text x=\"224.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">mass production<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">3IR: computers,<\/text><text x=\"382.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">internet<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">4IR: AI, IoT,<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">cyber-physical<\/text><\/svg><\/div>\n\n<p><strong>Drivers:<\/strong> artificial intelligence and machine learning · Internet of Things · big data and analytics · cloud and edge computing · robotics and automation · 3D printing · blockchain · 5G · biotechnology.<\/p>\n<p><strong>Opportunities:<\/strong> productivity growth · new products and business models (platforms, smart manufacturing) · personalised services (health, education) · better public services · leapfrogging for developing countries (e.g. mobile money).<\/p>\n<p><strong>Challenges:<\/strong> job displacement and skills gaps · inequality and the digital divide · cyber security and privacy risks · market concentration (big tech) · regulatory lag · ethical issues of AI.<\/p>\n<p><strong>Nepal:<\/strong> an opportunity in IT outsourcing, fintech and agritech; constraints are skills, infrastructure and policy.<\/p>"}, {"id": "IT250-04", "t": "Effects on sustainability, privacy, regulation, strategy", "u": 1, "q": "Explain the effects of the digital economy on sustainability, privacy, regulation and strategy.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li><strong>Sustainability:<\/strong> <em>positive<\/em> — dematerialisation (e-documents), smart grids, remote work; <em>negative<\/em> — energy-hungry data centres, e-waste, rebound effects.<\/li>\n<li><strong>Privacy:<\/strong> massive personal-data collection, profiling and surveillance risks → need for data-protection laws (GDPR; Nepal's Individual Privacy Act 2075).<\/li>\n<li><strong>Regulation:<\/strong> challenges in taxing digital firms (digital services tax), competition law for platforms, cross-border data flows, consumer protection online.<\/li>\n<li><strong>Strategy:<\/strong> firms must become data-driven, platform-oriented and agile; competition shifts to ecosystems and customer experience.<\/li>\n<\/ul>"}, {"id": "IT250-05", "t": "Multi-sided platforms", "u": 2, "q": "What is a multi-sided platform? Explain with examples.", "m": 5, "p": "Medium", "ty": "Concept", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>A <strong>multi-sided platform (MSP)<\/strong> is a business that creates value by enabling direct interactions between two or more distinct customer groups that need each other.<\/p>\n<p><strong>Examples:<\/strong> ride-hailing (riders ↔ drivers), e-commerce marketplaces like Daraz (buyers ↔ sellers), app stores (users ↔ developers), payment wallets (consumers ↔ merchants), food delivery (customers ↔ restaurants ↔ riders), social media (users ↔ advertisers).<\/p>\n<p><strong>Features:<\/strong> cross-side network effects · a \"chicken-and-egg\" problem at launch · pricing asymmetry (one side is often subsidised) · revenue from commissions, fees or ads · governance rules (ratings, verification).<\/p>\n<p><strong>Launch strategies:<\/strong> subsidise one side, seed supply, focus on a niche, piggyback on existing networks.<\/p>"}, {"id": "IT250-06", "t": "Network effects and positive feedback", "u": 2, "q": "Explain network effects and positive feedback in the digital economy.", "m": 10, "p": "Medium", "ty": "Concept + example", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Network effect (network externality):<\/strong> the value of a product to each user increases as more users join.<\/p>\n<ul>\n<li><strong>Direct (same-side):<\/strong> more users → more value to each user (WhatsApp, telephone).<\/li>\n<li><strong>Indirect (cross-side):<\/strong> more users on one side → more value for the other side (more riders attract more drivers).<\/li>\n<li><strong>Negative network effects:<\/strong> congestion or spam when too many users join.<\/li>\n<\/ul>\n<p><strong>Metcalfe's law:<\/strong> the value of a network is roughly proportional to the square of the number of users (n²).<\/p>\n<p><strong>Positive feedback:<\/strong> \"the strong get stronger, the weak get weaker.\" Success attracts more users, which creates more value, which attracts still more users.<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 606 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">More users<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Higher value<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">More attractive<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Even more users<\/text><\/svg><\/div>\n\n<p><strong>Consequences<\/strong><\/p>\n<ul>\n<li>Markets <strong>tip<\/strong> towards one dominant player (winner-take-all/most).<\/li>\n<li><strong>Critical mass<\/strong> must be reached for take-off (an S-shaped adoption curve).<\/li>\n<li><strong>First-mover advantage<\/strong> and aggressive early pricing (free services, discounts).<\/li>\n<li><strong>Standards wars<\/strong> (VHS vs Betamax, iOS vs Android).<\/li>\n<\/ul>\n<p><strong>Example (Nepal):<\/strong> a digital wallet accepted by more merchants attracts more users, and more users push more merchants to accept it.<\/p>"}, {"id": "IT250-07", "t": "Lock-in and switching costs; monopoly formation", "u": 2, "q": "Explain lock-in and switching costs. How do monopolies form in the digital economy?", "m": 10, "p": "Medium", "ty": "Concept", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Switching costs<\/strong> are the costs a customer incurs when changing from one product or supplier to another. <strong>Lock-in<\/strong> occurs when switching costs are so high that customers stay with the current supplier.<\/p>\n<p><strong>Types of switching costs / lock-in (Shapiro &amp; Varian):<\/strong> contractual commitments · durable purchases (hardware) · brand-specific training and learning · information and databases (data migration) · specialised suppliers · search costs · loyalty programmes · network-related (friends on the same platform).<\/p>\n<p><strong>Strategic use:<\/strong> firms invest to build an installed base, then earn from complementary products, upgrades and services. Customers should anticipate lock-in before committing.<\/p>\n<p><strong>How digital monopolies form<\/strong><\/p>\n<ol>\n<li><strong>Network effects and positive feedback<\/strong> → market tipping.<\/li>\n<li><strong>Economies of scale<\/strong> — high fixed cost, near-zero marginal cost.<\/li>\n<li><strong>Data advantage<\/strong> — more users → more data → better algorithms → more users.<\/li>\n<li><strong>Lock-in and ecosystems<\/strong> (devices + apps + cloud).<\/li>\n<li><strong>Acquisitions<\/strong> of potential rivals (\"killer acquisitions\").<\/li>\n<li><strong>Control of standards and gateways<\/strong> (app stores, search).<\/li>\n<\/ol>\n<p><strong>Concerns:<\/strong> high prices or data exploitation, reduced innovation, self-preferencing → antitrust and competition policy.<\/p>"}, {"id": "IT250-08", "t": "Digital Adoption Index and OECD index", "u": 2, "q": "Explain the Digital Adoption Index (DAI) and the OECD government digital index.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Digital Adoption Index (DAI)<\/strong> — developed by the World Bank (World Development Report 2016) — measures how widely digital technologies are adopted across three dimensions: <strong>people, businesses and government<\/strong>, each scored 0–1 and averaged. It helps compare countries and identify gaps.<\/p>\n<p><strong>OECD Digital Government Index (DGI)<\/strong> assesses how mature governments are in becoming digital. Its six dimensions: <em>digital by design, data-driven public sector, government as a platform, open by default, user-driven, and proactiveness<\/em>.<\/p>\n<p><strong>Use:<\/strong> benchmarking, policy priorities, tracking progress of initiatives such as the Digital Nepal Framework.<\/p>"}, {"id": "IT250-09", "t": "Competition and cooperation (co-opetition)", "u": 3, "q": "Explain competition and cooperation in digital markets.", "m": 5, "p": "Medium", "ty": "Concept", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>Digital markets combine fierce competition with cooperation — <strong>co-opetition<\/strong>.<\/p>\n<ul>\n<li><strong>Competition:<\/strong> for users, data and talent; often <em>for<\/em> the market rather than <em>in<\/em> the market (winner-take-most).<\/li>\n<li><strong>Cooperation:<\/strong> on <strong>standards<\/strong> (USB, Wi-Fi, 5G), <strong>interoperability<\/strong> and APIs, alliances and <strong>ecosystems<\/strong> (app developers cooperate with platform owners), and shared infrastructure.<\/li>\n<li><strong>Examples:<\/strong> Samsung competes with Apple in phones but supplies it components; banks compete but share payment networks (NCHL / ConnectIPS in Nepal).<\/li>\n<li><strong>Strategy:<\/strong> decide when to open (attract complements) and when to control (capture value).<\/li>\n<\/ul>"}, {"id": "IT250-10", "t": "Layered internet model", "u": 3, "q": "Explain the layered model of the internet economy.", "m": 5, "p": "Medium", "ty": "Diagram", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>The internet economy can be viewed as layers, each with its own market structure:<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Content &amp; applications (e-commerce, social media, streaming)<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Platforms / intermediaries (search, app stores, marketplaces)<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Internet services (cloud, hosting, DNS, CDN)<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Network / connectivity (ISPs, mobile operators, backbone)<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Devices &amp; hardware (phones, PCs, servers)<\/text><\/svg><\/div>\n\n<p><strong>Economic insights<\/strong><\/p>\n<ul>\n<li>Lower layers have high fixed costs and tend towards oligopoly (telecoms).<\/li>\n<li>Upper layers have low entry costs but strong network effects.<\/li>\n<li>Value often concentrates at the platform layer.<\/li>\n<li>Policy issues differ by layer: net neutrality (network), competition (platforms), content regulation (applications).<\/li>\n<li>Firms may integrate vertically across layers (Google: Android + search + cloud + YouTube).<\/li>\n<\/ul>"}, {"id": "IT250-11", "t": "Digital business models and value creation", "u": 3, "q": "Explain different digital business models and value-creation models.", "m": 10, "p": "Medium", "ty": "Classification", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Digital business models<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>How it earns<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>E-commerce (retail)<\/td>\n<td>Sells products online<\/td>\n<td>Daraz, Amazon<\/td>\n<\/tr>\n<tr>\n<td>Marketplace / platform<\/td>\n<td>Commission per transaction<\/td>\n<td>Pathao, Airbnb<\/td>\n<\/tr>\n<tr>\n<td>Subscription / SaaS<\/td>\n<td>Recurring fee<\/td>\n<td>Netflix, Microsoft 365<\/td>\n<\/tr>\n<tr>\n<td>Freemium<\/td>\n<td>Free basic, paid premium<\/td>\n<td>Spotify, Zoom<\/td>\n<\/tr>\n<tr>\n<td>Advertising<\/td>\n<td>Free service, sells ad space<\/td>\n<td>Google, Facebook<\/td>\n<\/tr>\n<tr>\n<td>Sharing economy<\/td>\n<td>Monetises idle assets<\/td>\n<td>Uber, Airbnb<\/td>\n<\/tr>\n<tr>\n<td>Data monetisation<\/td>\n<td>Sells insights<\/td>\n<td>Analytics firms<\/td>\n<\/tr>\n<tr>\n<td>On-demand<\/td>\n<td>Pay per use<\/td>\n<td>Food delivery<\/td>\n<\/tr>\n<tr>\n<td>Crowdsourcing<\/td>\n<td>User-generated content/work<\/td>\n<td>Wikipedia, Upwork<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Value-creation models (Stabell &amp; Fjeldstad)<\/strong><\/p>\n<ul>\n<li><strong>Value chain:<\/strong> linear transformation of inputs into products (manufacturing).<\/li>\n<li><strong>Value shop:<\/strong> solving specific customer problems (consulting, hospitals, software projects).<\/li>\n<li><strong>Value network:<\/strong> linking customers who want to interact (platforms, telecoms, banks).<\/li>\n<\/ul>\n<p>Digital firms mostly create value through <strong>value networks<\/strong> — connecting users and exploiting network effects.<\/p>"}, {"id": "IT250-12", "t": "Digital innovation; modelling digital markets", "u": 3, "q": "What is digital innovation? How can digital markets be modelled?", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Digital innovation<\/strong> is the creation of new products, services, processes or business models using digital technologies. Types: product (apps), process (automation), business-model (subscription), platform innovation. It is often <em>combinatorial<\/em> (recombining digital components) and <em>generative<\/em> (open platforms allow third parties to innovate).<\/p>\n<p><strong>Modelling digital markets<\/strong> uses economic tools adapted to digital features:<\/p>\n<ul>\n<li><strong>Two-sided market models<\/strong> (pricing to each side considering cross-side effects).<\/li>\n<li><strong>Network-effect / adoption models<\/strong> (S-curve, critical mass, tipping).<\/li>\n<li><strong>Zero-marginal-cost pricing<\/strong> and bundling.<\/li>\n<li><strong>Switching-cost models<\/strong> of lock-in.<\/li>\n<li><strong>Data-driven feedback loops.<\/strong>\nThese explain why free services, subsidies and winner-take-most outcomes are common.<\/li>\n<\/ul>"}, {"id": "IT250-13", "t": "Digital transformation: concept and drivers", "u": 4, "q": "What is digital transformation? Explain its drivers and stages.", "m": 10, "p": "Medium", "ty": "Concept", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Digital transformation<\/strong> is the fundamental change in how an organisation (or economy) operates and delivers value, by integrating digital technology into all areas — strategy, processes, culture and customer experience. It is more than <strong>digitisation<\/strong> (converting analogue to digital) and <strong>digitalisation<\/strong> (using digital tools in processes).<\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 448 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Digitisation<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Digitalisation<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Digital<\/text><text x=\"382.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">transformation<\/text><\/svg><\/div>\n\n<p><strong>Drivers:<\/strong> customer expectations · competition from digital natives · cost reduction and efficiency · data availability · cloud, AI and mobile · regulation (e-invoicing) · crises such as COVID-19.<\/p>\n<p><strong>Key elements:<\/strong> leadership and digital strategy · customer experience · process automation · data and analytics · technology infrastructure · culture and skills · new business models.<\/p>\n<p><strong>Challenges:<\/strong> legacy systems, resistance to change, skills gaps, cost, cyber security.<\/p>"}, {"id": "IT250-14", "t": "Digital transformation and SDGs", "u": 4, "q": "How can digital transformation advance the Sustainable Development Goals (SDGs)?", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li><strong>SDG 1 / 8 (no poverty, decent work):<\/strong> mobile money, digital jobs, gig work, financial inclusion.<\/li>\n<li><strong>SDG 2 (zero hunger):<\/strong> precision agriculture, market-price apps for farmers.<\/li>\n<li><strong>SDG 3 (health):<\/strong> telemedicine, e-health records.<\/li>\n<li><strong>SDG 4 (education):<\/strong> e-learning, digital libraries.<\/li>\n<li><strong>SDG 5 (gender equality):<\/strong> online access to finance and markets for women.<\/li>\n<li><strong>SDG 7 / 13 (energy, climate):<\/strong> smart grids, climate monitoring.<\/li>\n<li><strong>SDG 9 (industry, innovation, infrastructure):<\/strong> broadband, innovation ecosystems.<\/li>\n<li><strong>SDG 16 (institutions):<\/strong> e-governance, transparency, digital identity.\n<strong>Risks:<\/strong> the digital divide may leave some groups behind — inclusion policies are essential.<\/li>\n<\/ul>"}, {"id": "IT250-15", "t": "Technological revolution, globalisation and growth", "u": 4, "q": "Explain globalisation and economic growth in the digital age.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>Digital technology has changed globalisation from trade in goods towards trade in <strong>data and services<\/strong>:<\/p>\n<ul>\n<li>Cross-border e-commerce lets SMEs export directly.<\/li>\n<li>Digitally delivered services (IT outsourcing, freelancing) — an opportunity for countries like Nepal.<\/li>\n<li>Global value chains coordinated by digital tools.<\/li>\n<li>Lower communication and transaction costs.<\/li>\n<li>Growth effects: productivity gains, innovation, new markets.<\/li>\n<li>Concerns: digital trade barriers, data-localisation rules, tax avoidance by multinational platforms, unequal gains.<\/li>\n<\/ul>"}, {"id": "IT250-16", "t": "Digital currencies: concept and types", "u": 4, "q": "What is digital currency? Explain its types with advantages and risks.", "m": 10, "p": "Medium", "ty": "Classification", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Digital currency<\/strong> is money that exists only in electronic form and is transferred electronically.<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Issuer<\/th>\n<th>Example<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>E-money / mobile money<\/strong><\/td>\n<td>Licensed institutions, backed 1:1 by fiat<\/td>\n<td>eSewa and Khalti wallet balances<\/td>\n<td>Regulated by the central bank<\/td>\n<\/tr>\n<tr>\n<td><strong>Cryptocurrency<\/strong><\/td>\n<td>Decentralised, blockchain-based<\/td>\n<td>Bitcoin, Ethereum<\/td>\n<td>Volatile; no central issuer<\/td>\n<\/tr>\n<tr>\n<td><strong>Stablecoin<\/strong><\/td>\n<td>Private, pegged to fiat or assets<\/td>\n<td>USDT, USDC<\/td>\n<td>Less volatile; reserve risks<\/td>\n<\/tr>\n<tr>\n<td><strong>CBDC (Central Bank Digital Currency)<\/strong><\/td>\n<td>Central bank<\/td>\n<td>e-CNY, India's e-rupee<\/td>\n<td>Digital form of legal tender; NRB has studied a CBDC<\/td>\n<\/tr>\n<tr>\n<td><strong>Virtual / in-game currency<\/strong><\/td>\n<td>Private platforms<\/td>\n<td>Game tokens<\/td>\n<td>Closed systems<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Advantages:<\/strong> fast, low-cost transfers; financial inclusion; transparency; programmability.\n<strong>Risks:<\/strong> volatility, fraud and scams, money laundering, cyber attacks, privacy, threat to monetary control.<\/p>\n<p><strong>Nepal:<\/strong> Nepal Rastra Bank has declared transactions in cryptocurrencies illegal; e-money through licensed payment service providers is legal and growing.<\/p>"}, {"id": "IT250-17", "t": "Asymmetric information: concept and determinants", "u": 5, "q": "What is asymmetric information? Explain its determinants and how digitalisation affects it.", "m": 10, "p": "Medium", "ty": "Concept", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Asymmetric information<\/strong> exists when one party to a transaction has more or better information than the other.<\/p>\n<p><strong>Problems it creates<\/strong><\/p>\n<ul>\n<li><strong>Adverse selection<\/strong> (before the transaction): e.g. Akerlof's \"market for lemons\" — buyers cannot judge used-car quality, so good cars leave the market.<\/li>\n<li><strong>Moral hazard<\/strong> (after the transaction): e.g. an insured person takes more risk.<\/li>\n<li><strong>Principal–agent problems.<\/strong><\/li>\n<\/ul>\n<p><strong>Determinants:<\/strong> product complexity · hidden quality (experience and credence goods) · cost of acquiring information · lack of reputation mechanisms · weak disclosure regulation · expertise gaps.<\/p>\n<p><strong>Digitalisation and asymmetric information<\/strong>\n<em>Reduces asymmetry:<\/em> online reviews and ratings, price-comparison sites, search engines, digital credit histories, verified profiles, transparency of platforms.\n<em>Creates new asymmetry:<\/em> platforms know far more about users than users know about platforms (data asymmetry), opaque algorithms, fake reviews, information overload.<\/p>\n<p><strong>Solutions:<\/strong> signalling (warranties, certifications), screening, reputation systems, regulation (disclosure, data protection).<\/p>"}, {"id": "IT250-18", "t": "Search engines and AI; new economics of information", "u": 5, "q": "Explain the role of search engines and AI in the economics of information.", "m": 5, "p": "Coverage", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<ul>\n<li>Information goods have <strong>high fixed cost, near-zero marginal cost<\/strong> → pricing by value, versioning (basic/pro) and bundling.<\/li>\n<li><strong>Search engines<\/strong> reduce search costs, intensify price competition and act as gatekeepers of attention; advertising-funded \"free\" model.<\/li>\n<li><strong>AI<\/strong> filters and personalises information (recommendation systems), predicts demand and automates decisions; it can reduce information gaps but can also create opaque \"black-box\" decisions and filter bubbles.<\/li>\n<li><strong>Strategy (Shapiro &amp; Varian, <em>Information Rules<\/em>):<\/strong> personalise prices and products, version information goods, manage IPR, exploit network effects and lock-in, and compete on standards.<\/li>\n<\/ul>"}, {"id": "IT250-19", "t": "Impact on consumer choice and labour markets; digital IP", "u": 5, "q": "Explain the impact of digitalisation on consumer choice and labour markets. What are the IP issues in a digital context?", "m": 10, "p": "Medium", "ty": "Analysis", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Consumer choice:<\/strong> much wider variety (the \"long tail\") · lower prices and price transparency · convenience (24/7, home delivery) · personalised recommendations · but also manipulation (dark patterns), privacy loss, filter bubbles and impulse buying.<\/p>\n<p><strong>Labour markets:<\/strong> automation of routine jobs · creation of new digital jobs (developers, data analysts, digital marketers) · gig/platform work (flexible but insecure) · remote work and global freelancing (Nepali freelancers on Upwork/Fiverr) · skill-biased change raising inequality · need for reskilling and social protection.<\/p>\n<p><strong>Intellectual property in a digital context:<\/strong> easy copying and piracy of software, music and films · digital rights management (DRM) · open source and Creative Commons licences · disputes about AI-generated content and training data · cross-border enforcement difficulties · Nepal: Copyright Act 2059 and the Patent, Design and Trademark Act 2022 BS, with weak enforcement.<\/p>"}, {"id": "IT250-20", "t": "E-governance: concept, process, structure", "u": 6, "q": "What is e-governance? Explain its models and the structure/stages of e-governance.", "m": 10, "p": "Medium", "ty": "Concept + models", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>E-governance<\/strong> is the use of ICT by government to deliver services, exchange information and interact with citizens, businesses and other government bodies in a convenient, efficient and transparent way.<\/p>\n<p><strong>Interaction models:<\/strong> <strong>G2C<\/strong> (government to citizen: online tax, passport application) · <strong>G2B<\/strong> (government to business: company registration, e-procurement) · <strong>G2G<\/strong> (between agencies: shared databases) · <strong>G2E<\/strong> (government to employees: payroll, training).<\/p>\n<p><strong>Stages of e-governance maturity (UN / Gartner style)<\/strong><\/p>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 606 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Emerging<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">(information)<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Interaction<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Transaction<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Transformation /<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">integration<\/text><\/svg><\/div>\n\n<p><strong>Structure / enablers:<\/strong> policy and legal framework · ICT infrastructure (national data centre, network) · interoperable databases and digital identity · service portals · cyber security · human capacity.<\/p>\n<p><strong>Benefits:<\/strong> transparency, reduced corruption, faster services, lower cost, citizen participation.\n<strong>Challenges:<\/strong> digital divide, low literacy, infrastructure gaps, cyber risk, resistance to change, privacy.<\/p>"}, {"id": "IT250-21", "t": "E-governance practices in Nepal", "u": 6, "q": "Explain e-governance practices in Nepal, with their opportunities and challenges.", "m": 10, "p": "Medium", "ty": "Nepal application", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Policy framework:<\/strong> E-Governance Master Plan (2006 and a later revision), IT/ICT Policy 2072, <strong>Digital Nepal Framework (2019)<\/strong>, Electronic Transactions Act 2063, National Cyber Security Policy (2023).<\/p>\n<p><strong>Practices / examples<\/strong><\/p>\n<ul>\n<li><strong>National ID (Rastriya Parichaya Patra)<\/strong> — biometric digital identity.<\/li>\n<li><strong>Nagarik App<\/strong> — a single citizen app for government services.<\/li>\n<li><strong>Online tax filing and PAN<\/strong> (Inland Revenue Department), customs automation (ASYCUDA).<\/li>\n<li><strong>e-Procurement (e-GP, PPMO)<\/strong> for public tenders.<\/li>\n<li><strong>Online company registration<\/strong> (OCR) and online passport application.<\/li>\n<li><strong>Government Integrated Data Centre<\/strong>, a government cloud.<\/li>\n<li><strong>Online driving-licence application<\/strong>, land-records digitisation, local-government service portals.<\/li>\n<li><strong>ConnectIPS<\/strong> and digital payment of government fees.<\/li>\n<\/ul>\n<p><strong>Opportunities:<\/strong> transparency, reduced queues and corruption, data-driven policy, efficient public services across difficult geography.\n<strong>Challenges:<\/strong> connectivity gaps in rural areas, low digital literacy, frequent system downtime, weak interoperability, cyber-security incidents, limited skilled staff, political commitment and funding.<\/p>"}, {"id": "IT250-22", "t": "Digital financial inclusion in Nepal", "u": 6, "q": "Explain digital financial inclusion in Nepal and the role of digital payments.", "m": 10, "p": "Medium", "ty": "Nepal application", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Digital financial inclusion<\/strong> means access to, and use of, formal financial services (payments, savings, credit, insurance) through digital channels by previously excluded or underserved people.<\/p>\n<p><strong>Nepal's progress<\/strong><\/p>\n<ul>\n<li><strong>Mobile wallets<\/strong> (eSewa, Khalti, IME Pay) licensed by NRB as payment service providers.<\/li>\n<li><strong>Mobile and internet banking<\/strong> by commercial banks.<\/li>\n<li><strong>QR payments<\/strong> (Fonepay, NepalPay QR) widely accepted by merchants.<\/li>\n<li><strong>ConnectIPS / interbank payments<\/strong> (NCHL).<\/li>\n<li><strong>Branchless banking<\/strong> and agent networks in rural areas.<\/li>\n<li>Remittances received through digital channels.<\/li>\n<\/ul>\n<p><strong>Benefits:<\/strong> convenience and low cost, safety from carrying cash, transaction records for credit scoring, access for women and rural people, efficient government payments (social security).<\/p>\n<p><strong>Challenges:<\/strong> digital and financial literacy, connectivity, fraud and cyber scams, trust, interoperability, cost of smartphones and data, regulatory limits.<\/p>\n<p><strong>Policy:<\/strong> NRB's payment-system policies and the National Financial Inclusion strategy; Digital Nepal Framework (finance sector).<\/p>"}, {"id": "IT250-23", "t": "Public-sector transformation; trade, tourism, agriculture, SMEs", "u": 6, "q": "Explain the opportunities and challenges of public-sector digital transformation, and the impact of digital transformation on trade, tourism, agriculture and SMEs in Nepal.", "m": 10, "p": "Medium", "ty": "Analysis", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>Public sector — opportunities:<\/strong> efficient service delivery, transparency, evidence-based policy, cost savings, citizen engagement. <strong>Challenges:<\/strong> legacy processes, bureaucracy, funding, skills, interoperability, cyber security, political will.<\/p>\n<p><strong>Sector impacts in Nepal<\/strong>\n| Sector | Digital applications | Economic effect |\n|---|---|---|\n| <strong>Trade<\/strong> | Nepal National Single Window, ASYCUDA, e-commerce, digital payments | Faster clearance, lower transaction costs |\n| <strong>Tourism<\/strong> | Online booking, digital marketing, e-visas, digital permits, reviews | More arrivals, better experience |\n| <strong>Agriculture<\/strong> | Market-price apps, weather/advisory SMS, e-agriculture, IoT irrigation | Better prices, productivity |\n| <strong>SMEs<\/strong> | Social-media selling, digital accounting, wallets, online marketplaces | Market reach, formalisation, access to credit |<\/p>\n<p><strong>Conclusion:<\/strong> digital transformation can raise productivity and inclusion in Nepal if infrastructure, skills and regulation keep pace.<\/p>"}], "defs": [["Digital economy", "Economic activity enabled by digital technologies, data and online connections."], ["Knowledge economy", "Economy where knowledge creation and use are the main drivers of growth."], ["Fourth Industrial Revolution", "Fusion of digital, physical and biological technologies (AI, IoT, robotics)."], ["Multi-sided platform", "Business enabling interactions between two or more interdependent user groups."], ["Network effect", "Value of a product rises as more people use it."], ["Positive feedback", "Success leads to more success; markets tip to the leader."], ["Switching cost", "Cost of changing from one supplier/product to another."], ["Lock-in", "Situation where high switching costs keep customers with a supplier."], ["Digital Adoption Index", "World Bank index of digital adoption by people, business and government."], ["Digital transformation", "Fundamental change in operations and value delivery through digital technology."], ["CBDC", "Central Bank Digital Currency — digital legal tender issued by a central bank."], ["Asymmetric information", "One party has more information than the other."], ["Adverse selection", "Pre-contract problem from hidden information (market for lemons)."], ["Moral hazard", "Post-contract risk-taking because the other party bears the cost."], ["E-governance", "Use of ICT by government to deliver services and interact with stakeholders."], ["Digital financial inclusion", "Access to formal financial services through digital channels."]], "revision": "<p><strong>IT 250 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> definition, drivers (connectivity, data, cloud, payments, AI, platforms) · K-economy (education, R&amp;D, ICT, institutions) vs digital economy table · 4IR: 1IR→4IR, drivers, opportunities, challenges · effects on sustainability, privacy, regulation, strategy.<\/li>\n<li><strong>U2:<\/strong> MSP (chicken-and-egg, subsidy side) · network effects (direct/indirect, Metcalfe n²) · positive feedback → tipping · switching costs (contracts, training, data, loyalty) → lock-in · monopoly formation · DAI (people, business, government) · OECD DGI (6 dimensions).<\/li>\n<li><strong>U3:<\/strong> co-opetition · layered model (devices → network → services → platforms → content) · business models table · value chain / shop / network.<\/li>\n<li><strong>U4:<\/strong> digitisation → digitalisation → transformation · SDGs mapping · globalisation of services · digital currency types (e-money, crypto, stablecoin, CBDC); crypto illegal in Nepal per NRB.<\/li>\n<li><strong>U5:<\/strong> asymmetric info, adverse selection, moral hazard · digital reduces (reviews) and creates (data) asymmetry · versioning, bundling · consumer choice, gig work, digital IP.<\/li>\n<li><strong>U6:<\/strong> G2C/G2B/G2G/G2E · 4 maturity stages · Nepal: National ID, Nagarik App, e-GP, IRD online, Digital Nepal Framework · financial inclusion (wallets, QR, ConnectIPS) · trade/tourism/agri/SME table.<\/li>\n<\/ul>", "practice": ["[AI practice] Define network effect. (1)", "[AI practice] What is a CBDC? (1)", "[AI practice] Differentiate digitisation, digitalisation and digital transformation. (3)", "[AI practice] Explain the chicken-and-egg problem of multi-sided platforms with a Nepali example. (3)", "[AI practice] How do lock-in and switching costs give firms market power? (5)", "[AI practice] Explain adverse selection and moral hazard with digital examples. (5)", "[AI practice] Scenario: Nepal plans to make all local-government services digital in five years. Discuss the opportunities, challenges and a phased plan. (10)", "[AI practice] Explain how digital financial inclusion can support SDGs in Nepal. (10)"], "checklist": ["Define digital economy + 6 drivers", "Compare K-economy vs digital economy", "Explain 4IR with timeline", "Explain MSPs and network effects", "Explain lock-in and how digital monopolies form", "Describe DAI and the OECD index", "Draw the layered internet model", "Tabulate digital business models", "Explain digital currency types and Nepal's stance", "Explain asymmetric information concepts", "Explain e-governance models and stages", "Give Nepali e-governance examples", "Explain digital financial inclusion in Nepal"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025 (November 2025)", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question 2026 document (checked: no IT 250 paper present)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf"], ["Shapiro, C. & Varian, H. — Information Rules (network effects, lock-in) — standard reference for Unit 2", "—"], ["World Bank — World Development Report 2016: Digital Dividends (Digital Adoption Index)", "—"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "FIN 229", "id": "FIN229", "title": "Fundamentals of Corporate Finance", "sem": 6, "exam": "2026-12-04", "official": "FIN 229: Fundamentals of Corporate Finance", "syllabus": "BIM 6th Semester Syllabus 2024 (TU FOM, October 2024) — 3 credit hours, 48 LH", "note": "Matches routine. Note: the OC equivalent is FIN 201 Business Finance (the TU Dec-2025 routine shows 'FIN 201 (OC) / FIN 229 (NC)'). FIN 201 papers were NOT used.", "marks": "Full Marks 100 (inferred: 6th-semester FOM pattern). 2025 paper shows Group A 10×2=20 · Group B 6×5=30 · Group C 3×10=30; Group D (comprehensive, normally 20) was not visible in the retrieved copy.", "objectives": "Lay the foundation of corporate-finance concepts and principles and equip students with the tools of financial management to resolve corporate financial issues.", "units": [{"n": 1, "t": "Introduction to Corporate Finance", "lh": 4, "topics": "Nature of corporate finance; functions of financial management; financial goal; responsibilities of the financial manager; relation with other functional areas."}, {"n": 2, "t": "Financial Instruments, Markets and Institutions", "lh": 4, "topics": "Money-market and capital-market instruments; derivatives; mutual-fund units; functions and types of financial markets; depository and non-depository institutions."}, {"n": 3, "t": "Financial Statement Analysis", "lh": 6, "topics": "Balance sheet, income statement, cash-flow statement, statement of shareholders' equity; framework; need for ratio analysis; liquidity, asset-management, debt, profitability and market-value ratios; DuPont analysis; limitations."}, {"n": 4, "t": "Time Value of Money", "lh": 6, "topics": "Concept, timelines; FV and PV of single sums; solving for rate and time; ordinary annuity and annuity due; annuity payments; perpetuity; uneven cash flows; semi-annual and other compounding; amortisation schedule; applications."}, {"n": 5, "t": "Financial Assets Valuation", "lh": 8, "topics": "Features of bonds, common and preferred stock; valuation models; bond valuation (perpetual, zero-coupon, finite, semi-annual); yields (current, capital gain, YTM, YTC); dividend discount models (zero, normal, super-normal growth); preferred-stock valuation."}, {"n": 6, "t": "Basics of Capital Budgeting", "lh": 6, "topics": "Concept and process; project types; payback, discounted payback, NPV, PI, IRR, MIRR — merits and limitations."}, {"n": 7, "t": "Raising Capital", "lh": 5, "topics": "Sources of long-term financing; long-term debt, preferred stock, common stock — pros and cons; public offering, rights offering, private placement."}, {"n": 8, "t": "Capital Structure and Leverage", "lh": 5, "topics": "Concept; optimal capital structure; determinants; business vs financial risk; DOL, DFL, DTL."}, {"n": 9, "t": "Working Capital Management", "lh": 4, "topics": "Concepts and types; factors affecting size; significance; operating cycle; cash conversion cycle; working-capital requirement."}], "avail": "<p><strong>Actual NC papers found: 1, incomplete.<\/strong> The 2025 FIN 229 paper was found only on bimstudies.com (page updated 8 Dec 2025, i.e. <em>before<\/em> the 10 Dec 2025 sitting, so it is presumably the <strong>April 2025<\/strong> regular paper). The retrieved copy shows Q1–15 and Q18 only. <strong>Q16, Q17, Q19–21 and any Group D were missing — reported as unavailable.<\/strong> No official TU header was visible, so it is labelled Category A with this caveat. bimstudies' transcriptions of the other 2025 papers (RCH 201, MGT 236) matched TU-headed copies, which supports its reliability.<\/p>\n<p>The <strong>December 2025<\/strong> NC paper (FIN 229, 10 Dec 2025) and the <strong>TU 6th-semester FIN 229 model question<\/strong> could not be retrieved — <strong>unavailable<\/strong>. <em>Upload them if your college has them.<\/em><\/p>\n<p>Because evidence is thin, priorities lean on syllabus weight. Finance exams are always heavy in <strong>numericals<\/strong> — Units 3, 4, 5 and 6 should be practised until automatic.<\/p>", "pattern": "<p><strong>Question types (2025, partial):<\/strong> 10 brief items — 7 theory definitions and <strong>3 mini-numericals<\/strong> (current ratio, FV, CCC); Group B mixes theory with a <strong>TVM numerical<\/strong>; Group C seen so far is theory (long-term financing). Missing questions in such papers are typically numericals on <strong>bond/stock valuation, capital budgeting and leverage<\/strong>, so practise them regardless.<\/p>\n<p><strong>Unit coverage in the retrieved questions:<\/strong> U1:2 · U2:2 · U3:1 · U4:2 · U5:1 · U6:1 · U7:2 · U8:2 · U9:3. Every unit appeared, so the examiner samples the <strong>whole syllabus<\/strong>.<\/p>\n<p><strong>Repetition:<\/strong> only one paper, so repetition across sessions cannot be measured — <strong>insufficient data<\/strong>.<\/p>", "papers": [{"id": "E25", "label": "2025 exam (partial)", "cat": "A", "session": "2025, presumed April 2025 regular", "source": "bimstudies.com transcription", "url": "https://bimstudies.com/docs/bitm-6th-sem-model-question-solution/fundamentals-of-corporate-finance-exam-question-solution-bitm-6th-sem-2025/", "note": "Incomplete copy: Q16, Q17, Q19–21 (and any Group D) not shown. Numerical answers marked ✓ were re-computed for this guide.", "qs": [{"no": "1", "g": "A", "t": "Write the meaning of corporate finance.", "m": 2, "u": 1}, {"no": "2", "g": "A", "t": "What is meant by capital market?", "m": 2, "u": 2}, {"no": "3", "g": "A", "t": "Define the term financial structure.", "m": 2, "u": 8}, {"no": "4", "g": "A", "t": "What d
