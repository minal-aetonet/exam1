= new List&lt;int&gt; { 45, 82, 67, 91 };\nvar passed = marks.Where(m =&gt; m &gt;= 50).OrderBy(m =&gt; m).ToList();   // 67, 82, 91\nbtnSave.Click += (s, e) =&gt; MessageBox.Show(&quot;Saved&quot;);               // inline handler\n<\/code><\/pre>\n<p><strong>Practical use:<\/strong> filtering and sorting collections in LINQ, short event handlers, callbacks.<\/p>\n<p><strong>Async tasks:<\/strong><\/p>\n<pre><code class=\"language-csharp\">public async Task&lt;string&gt; DownloadAsync(string url)\n{\n    using var client = new HttpClient();\n    return await client.GetStringAsync(url);   // UI stays responsive\n}\n<\/code><\/pre>"}, {"id": "IT275-11", "t": "Strings, StringBuilder; collections", "u": 3, "q": "List four generic collections in C#. Differentiate generic and non-generic collections. What is StringBuilder?", "m": 3, "p": "High", "ty": "List + code", "seen": {"M26": "A4, A6"}, "rep": false, "src": "TU Model Question 2026 A4, A6", "a": "<p><strong>Generic collections<\/strong> (<code>System.Collections.Generic<\/code>, type-safe, no boxing): <code>List&lt;T&gt;<\/code>, <code>Dictionary&lt;TKey,TValue&gt;<\/code>, <code>Queue&lt;T&gt;<\/code>, <code>Stack&lt;T&gt;<\/code>, <code>HashSet&lt;T&gt;<\/code>, <code>LinkedList&lt;T&gt;<\/code>, <code>SortedList&lt;TKey,TValue&gt;<\/code>.\n<strong>Non-generic<\/strong> (<code>System.Collections<\/code>, store <code>object<\/code>, need casting, boxing): <code>ArrayList<\/code>, <code>Hashtable<\/code>, <code>Queue<\/code>, <code>Stack<\/code>, <code>SortedList<\/code>.<\/p>\n<pre><code class=\"language-csharp\">var dict = new Dictionary&lt;int, string&gt; { [1] = &quot;Ram&quot;, [2] = &quot;Sita&quot; };\nforeach (var kv in dict) Console.WriteLine($&quot;{kv.Key}: {kv.Value}&quot;);\nArrayList al = new ArrayList { 1, &quot;two&quot;, 3.0 };  // mixed types, unsafe\n<\/code><\/pre>\n<p><strong>String methods:<\/strong> <code>Length, ToUpper, Substring, IndexOf, Replace, Split, Trim, Contains, string.Join<\/code>.\n<strong>StringBuilder:<\/strong> a mutable string class for efficient repeated modification (<code>Append, Insert, Remove, Replace, ToString<\/code>).<\/p>"}, {"id": "IT275-12", "t": "Entity Framework purpose; approaches", "u": 4, "q": "What is Entity Framework? Differentiate the Database-First and Code-First approaches (and mention Model-First).", "m": 3, "p": "High", "ty": "Comparison", "seen": {"M26": "A7, Q15"}, "rep": false, "src": "TU Model Question 2026 A7, Q15", "a": "<p><strong>Entity Framework (EF / EF Core)<\/strong> is Microsoft's <strong>object-relational mapper (ORM)<\/strong>. It lets developers work with a database using C# classes (entities) and LINQ instead of writing SQL; it handles mapping, change tracking, migrations and SQL generation.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Database-First<\/th>\n<th>Code-First<\/th>\n<th>Model-First<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Starting point<\/td>\n<td>Existing database<\/td>\n<td>C# classes<\/td>\n<td>Visual EDMX designer<\/td>\n<\/tr>\n<tr>\n<td>Generates<\/td>\n<td>Classes and context from DB (scaffold)<\/td>\n<td>Database from classes via <strong>migrations<\/strong><\/td>\n<td>DB and classes from the diagram<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Legacy DBs, DBA-controlled schema<\/td>\n<td>New projects, developer-driven<\/td>\n<td>Visual design (EF6 only, not EF Core)<\/td>\n<\/tr>\n<tr>\n<td>Schema changes<\/td>\n<td>Update DB, re-scaffold<\/td>\n<td>Change class → <code>Add-Migration<\/code>, <code>Update-Database<\/code><\/td>\n<td>Update model<\/td>\n<\/tr>\n<tr>\n<td>EF Core command<\/td>\n<td><code>Scaffold-DbContext<\/code><\/td>\n<td><code>Add-Migration InitialCreate<\/code><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "IT275-13", "t": "LINQ fundamentals", "u": 4, "q": "What is LINQ? Write LINQ queries in query and method syntax.", "m": 3, "p": "High", "ty": "Code", "seen": {"M26": "A10"}, "rep": false, "src": "TU Model Question 2026 A10", "a": "<p><strong>LINQ (Language Integrated Query)<\/strong> is a set of C# features for querying data from collections, databases (LINQ to Entities), XML and more using one consistent syntax, with compile-time checking.<\/p>\n<pre><code class=\"language-csharp\">var students = new List&lt;Student&gt; {\n    new Student { Name = &quot;Asha&quot;, Marks = 85, Faculty = &quot;BIM&quot; },\n    new Student { Name = &quot;Bikash&quot;, Marks = 58, Faculty = &quot;BBA&quot; },\n    new Student { Name = &quot;Chandra&quot;, Marks = 92, Faculty = &quot;BIM&quot; } };\n\n// Query syntax\nvar top = from s in students where s.Marks &gt;= 60 orderby s.Marks descending select s.Name;\n// Method (lambda) syntax\nvar top2 = students.Where(s =&gt; s.Marks &gt;= 60).OrderByDescending(s =&gt; s.Marks).Select(s =&gt; s.Name);\n// Output: Chandra, Asha\nvar avgByFaculty = students.GroupBy(s =&gt; s.Faculty)\n                           .Select(g =&gt; new { g.Key, Avg = g.Average(s =&gt; s.Marks) });\n<\/code><\/pre>\n<p>Operators: <code>Where, Select, OrderBy, GroupBy, Join, Count, Sum, Average, First, Any<\/code>. LINQ uses <strong>deferred execution<\/strong> (runs when enumerated).<\/p>"}, {"id": "IT275-14", "t": "ASP.NET vs ASP.NET Core; Web Forms vs MVC vs Web Pages", "u": 5, "q": "Compare Web Forms, MVC and Web Pages. Which would you choose for an enterprise application and why?", "m": 5, "p": "High", "ty": "Comparison", "seen": {"M26": "Q20"}, "rep": false, "src": "TU Model Question 2026 Q20", "a": "<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Web Forms<\/th>\n<th>MVC<\/th>\n<th>Web Pages (Razor)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Model<\/td>\n<td>Event-driven, page controller, server controls<\/td>\n<td>Model–View–Controller separation<\/td>\n<td>Single-page, inline Razor code<\/td>\n<\/tr>\n<tr>\n<td>State<\/td>\n<td>ViewState, postbacks<\/td>\n<td>Stateless (HTTP-friendly)<\/td>\n<td>Simple<\/td>\n<\/tr>\n<tr>\n<td>HTML control<\/td>\n<td>Limited (generated markup)<\/td>\n<td>Full control<\/td>\n<td>Full<\/td>\n<\/tr>\n<tr>\n<td>Testability<\/td>\n<td>Hard<\/td>\n<td>High (unit-testable controllers)<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td>URL<\/td>\n<td>File-based (.aspx)<\/td>\n<td>Clean, routed URLs (SEO-friendly)<\/td>\n<td>File-based (.cshtml)<\/td>\n<\/tr>\n<tr>\n<td>Learning curve<\/td>\n<td>Easy for desktop devs (drag-and-drop)<\/td>\n<td>Moderate<\/td>\n<td>Easiest<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Rapid intranet/legacy apps<\/td>\n<td>Large, complex, scalable apps<\/td>\n<td>Small sites<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Choice for an enterprise application: ASP.NET (Core) MVC<\/strong> — separation of concerns makes large teams productive, unit testing and maintainability are easier, it has clean URLs and full HTML/JS control, works well with Entity Framework and dependency injection, and (as ASP.NET Core) is cross-platform, high-performance and actively supported, whereas Web Forms is legacy and Windows-only.<\/p>\n<p><strong>ASP.NET vs ASP.NET Core:<\/strong> Core is the open-source, cross-platform, modular rewrite (built-in DI, middleware pipeline, Kestrel server); classic ASP.NET runs on .NET Framework/IIS only.<\/p>"}, {"id": "IT275-15", "t": "MVC architecture; layouts and Razor", "u": 5, "q": "Explain ASP.NET MVC architecture with a diagram. What is Razor syntax?", "m": 5, "p": "High", "ty": "Architecture + diagram", "seen": {"M26": "Q18, A8"}, "rep": false, "src": "TU Model Question 2026 Q18, A8", "a": "<p><strong>MVC<\/strong> separates an application into three components:<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 364 354\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ahv\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"7\" orient=\"auto\"><path d=\"M0,0 L8,0 L4,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"2\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"26.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Browser request /Student/Details/5<\/text><line x1=\"182.0\" y1=\"43\" x2=\"182.0\" y2=\"60\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"64\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Routing<\/text><line x1=\"182.0\" y1=\"105\" x2=\"182.0\" y2=\"122\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"126\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Controller (action)<\/text><line x1=\"182.0\" y1=\"167\" x2=\"182.0\" y2=\"184\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"188\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"212.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Model (data, EF)<\/text><line x1=\"182.0\" y1=\"229\" x2=\"182.0\" y2=\"246\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"250\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"274.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">View (Razor)<\/text><line x1=\"182.0\" y1=\"291\" x2=\"182.0\" y2=\"308\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ahv)\"/><rect x=\"2\" y=\"312\" width=\"360\" height=\"40\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"182.0\" y=\"336.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">HTML response<\/text><\/svg><\/div>\n\n<ul>\n<li><strong>Model:<\/strong> data and business logic (entity classes, validation, DbContext).<\/li>\n<li><strong>View:<\/strong> UI (<code>.cshtml<\/code> Razor files) displaying model data.<\/li>\n<li><strong>Controller:<\/strong> handles requests, calls the model, chooses a view, returns an <code>ActionResult<\/code>.<\/li>\n<\/ul>\n<p><strong>Flow:<\/strong> request → routing selects the controller/action → the action uses the model → passes data to the view → the view renders HTML → response.\n<strong>Advantages:<\/strong> separation of concerns, testability, parallel development, clean URLs, full control of HTML.<\/p>\n<p><strong>Razor syntax:<\/strong> a markup syntax that embeds C# in HTML using <code>@<\/code>.<\/p>\n<pre><code class=\"language-cshtml\">@model IEnumerable&lt;Student&gt;\n@{ ViewBag.Title = &quot;Students&quot;; int count = 0; }\n&lt;h2&gt;@ViewBag.Title&lt;/h2&gt;\n&lt;table&gt;\n@foreach (var s in Model) {\n    count++;\n    &lt;tr&gt;&lt;td&gt;@s.Name&lt;/td&gt;&lt;td&gt;@s.Marks&lt;/td&gt;\n        &lt;td&gt;@(s.Marks &gt;= 40 ? &quot;Pass&quot; : &quot;Fail&quot;)&lt;/td&gt;&lt;/tr&gt;\n}\n&lt;/table&gt;\n&lt;p&gt;Total: @count&lt;/p&gt;\n<\/code><\/pre>\n<p><strong>Layouts:<\/strong> <code>_Layout.cshtml<\/code> holds the common header/footer; views render inside <code>@RenderBody()<\/code>; <code>@RenderSection(\"scripts\", false)<\/code>.<\/p>"}, {"id": "IT275-16", "t": "URL routing in MVC", "u": 5, "q": "Write a short note on URL routing in ASP.NET MVC.", "m": 3, "p": "High", "ty": "Short note", "seen": {"M26": "Q16"}, "rep": false, "src": "TU Model Question 2026 Q16", "a": "<p><strong>Routing<\/strong> maps incoming URLs to controller actions instead of physical files.<\/p>\n<p><strong>Conventional routing<\/strong> (<code>RouteConfig.cs<\/code> / <code>Program.cs<\/code>):<\/p>\n<pre><code class=\"language-csharp\">app.MapControllerRoute(\n    name: &quot;default&quot;,\n    pattern: &quot;{controller=Home}/{action=Index}/{id?}&quot;);\n// /Student/Details/5 -&gt; StudentController.Details(5)\n<\/code><\/pre>\n<p><strong>Attribute routing:<\/strong><\/p>\n<pre><code class=\"language-csharp\">[Route(&quot;results/{year:int}&quot;)]\npublic IActionResult ByYear(int year) { ... }\n<\/code><\/pre>\n<p><strong>Benefits:<\/strong> clean, readable, SEO-friendly URLs; decouples URLs from files; supports constraints (<code>{id:int}<\/code>) and defaults.<\/p>"}, {"id": "IT275-17", "t": "Student result system: MVC + EF Core Code-First CRUD", "u": 5, "q": "You are building a student result management system using ASP.NET MVC and Entity Framework Core. (a) Explain the folder structure and the role of each layer. (b) Describe step-by-step Code-First CRUD for the 'Student' entity.", "m": 10, "p": "High", "ty": "Application design + code", "seen": {"M26": "Q21"}, "rep": false, "src": "TU Model Question 2026 Q21", "a": "<p><strong>(a) Folder structure<\/strong><\/p>\n<pre><code>StudentResultApp/\n ├─ Controllers/   StudentController.cs     → handle requests, call DbContext, return views\n ├─ Models/        Student.cs, Result.cs    → entity classes + validation attributes\n ├─ Data/          AppDbContext.cs          → EF Core DbContext (DbSet&lt;Student&gt;)\n ├─ Views/Student/ Index, Create, Edit, Details, Delete .cshtml → Razor UI\n ├─ Views/Shared/  _Layout.cshtml           → common layout\n ├─ Migrations/                             → generated by EF Core\n ├─ wwwroot/       css, js, images          → static files\n ├─ appsettings.json                        → connection string\n └─ Program.cs                              → services (DI), middleware, routing\n<\/code><\/pre>\n<p><strong>(b) Code-First CRUD steps<\/strong>\n<strong>Step 1 — Model<\/strong><\/p>\n<pre><code class=\"language-csharp\">public class Student\n{\n    public int StudentId { get; set; }                  // primary key by convention\n    [Required, StringLength(60)] public string Name { get; set; }\n    [Range(0, 100)] public int Marks { get; set; }\n    public string Grade =&gt; Marks &gt;= 80 ? &quot;A&quot; : Marks &gt;= 60 ? &quot;B&quot; : Marks &gt;= 40 ? &quot;C&quot; : &quot;F&quot;;\n}\n<\/code><\/pre>\n<p><strong>Step 2 — DbContext<\/strong><\/p>\n<pre><code class=\"language-csharp\">public class AppDbContext : DbContext\n{\n    public AppDbContext(DbContextOptions&lt;AppDbContext&gt; options) : base(options) { }\n    public DbSet&lt;Student&gt; Students { get; set; }\n}\n<\/code><\/pre>\n<p><strong>Step 3 — Register and connection string<\/strong> (<code>Program.cs<\/code>)<\/p>\n<pre><code class=\"language-csharp\">builder.Services.AddDbContext&lt;AppDbContext&gt;(o =&gt;\n    o.UseSqlServer(builder.Configuration.GetConnectionString(&quot;Default&quot;)));\n<\/code><\/pre>\n<p><strong>Step 4 — Migrations:<\/strong> <code>Add-Migration InitialCreate<\/code> → <code>Update-Database<\/code> (creates the Students table).\n<strong>Step 5 — Controller CRUD<\/strong><\/p>\n<pre><code class=\"language-csharp\">public class StudentController : Controller\n{\n    private readonly AppDbContext _db;\n    public StudentController(AppDbContext db) =&gt; _db = db;\n\n    public async Task&lt;IActionResult&gt; Index() =&gt; View(await _db.Students.ToListAsync());   // Read\n\n    public IActionResult Create() =&gt; View();\n    [HttpPost, ValidateAntiForgeryToken]\n    public async Task&lt;IActionResult&gt; Create(Student s)                                    // Create\n    {\n        if (!ModelState.IsValid) return View(s);\n        _db.Students.Add(s); await _db.SaveChangesAsync();\n        return RedirectToAction(nameof(Index));\n    }\n    public async Task&lt;IActionResult&gt; Edit(int id) =&gt; View(await _db.Students.FindAsync(id));\n    [HttpPost, ValidateAntiForgeryToken]\n    public async Task&lt;IActionResult&gt; Edit(Student s)                                      // Update\n    {\n        _db.Students.Update(s); await _db.SaveChangesAsync();\n        return RedirectToAction(nameof(Index));\n    }\n    [HttpPost]\n    public async Task&lt;IActionResult&gt; Delete(int id)                                       // Delete\n    {\n        var s = await _db.Students.FindAsync(id);\n        if (s != null) { _db.Students.Remove(s); await _db.SaveChangesAsync(); }\n        return RedirectToAction(nameof(Index));\n    }\n}\n<\/code><\/pre>\n<p><strong>Step 6 — Views:<\/strong> scaffold Razor views (Index lists students in a table; Create/Edit use <code>asp-for<\/code> tag helpers with validation).\n<strong>Step 7 — Run and test<\/strong> each operation.<\/p>"}, {"id": "IT275-18", "t": "ADO.NET architecture and CRUD; Execute methods", "u": 6, "q": "Explain how ADO.NET components work together to perform CRUD operations. Name the three Execute methods of SqlCommand.", "m": 5, "p": "High", "ty": "Architecture + code", "seen": {"M26": "A9, Q19"}, "rep": false, "src": "TU Model Question 2026 A9, Q19", "a": "<p><strong>ADO.NET<\/strong> is the .NET data-access technology. Two models:<\/p>\n<ul>\n<li><strong>Connected:<\/strong> <code>SqlConnection<\/code> + <code>SqlCommand<\/code> + <code>SqlDataReader<\/code> (forward-only, read-only, fast).<\/li>\n<li><strong>Disconnected:<\/strong> <code>SqlDataAdapter<\/code> fills a <code>DataSet<\/code>/<code>DataTable<\/code> in memory; changes are pushed back with <code>Update()<\/code>.<\/li>\n<\/ul>\n<div class=\"diagram\"><svg class=\"dg\" viewBox=\"0 0 764 72\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#3b5b8c\"/><\/marker><\/defs><rect x=\"2\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"66.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Database (SQL<\/text><text x=\"66.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Server)<\/text><line x1=\"132\" y1=\"36.0\" x2=\"157\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"160\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"224.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">SqlConnection<\/text><line x1=\"290\" y1=\"36.0\" x2=\"315\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"318\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"382.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">SqlCommand /<\/text><text x=\"382.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">SqlDataAdapter<\/text><line x1=\"448\" y1=\"36.0\" x2=\"473\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"476\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"540.0\" y=\"32.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DataReader or<\/text><text x=\"540.0\" y=\"47.5\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DataSet/DataTable<\/text><line x1=\"606\" y1=\"36.0\" x2=\"631\" y2=\"36.0\" stroke=\"#3b5b8c\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"634\" y=\"4\" width=\"128\" height=\"64\" rx=\"8\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.4\"/><text x=\"698.0\" y=\"40.0\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Application UI<\/text><\/svg><\/div>\n\n<p><strong>Components:<\/strong> <strong>Connection<\/strong> (opens the link), <strong>Command<\/strong> (executes SQL/stored procedure), <strong>DataReader<\/strong> (streams rows), <strong>DataAdapter<\/strong> (bridge that fills/updates a DataSet), <strong>DataSet<\/strong> (in-memory collection of DataTables with relations), <strong>Transaction<\/strong> (<code>SqlTransaction<\/code> for all-or-nothing operations).<\/p>\n<p><strong>Three Execute methods<\/strong><\/p>\n<ul>\n<li><code>ExecuteNonQuery()<\/code> — INSERT/UPDATE/DELETE/DDL; returns rows affected.<\/li>\n<li><code>ExecuteReader()<\/code> — SELECT; returns a <code>SqlDataReader<\/code>.<\/li>\n<li><code>ExecuteScalar()<\/code> — returns a single value (first column of first row), e.g. <code>COUNT(*)<\/code>.<\/li>\n<\/ul>\n<pre><code class=\"language-csharp\">string cs = &quot;Server=.;Database=College;Trusted_Connection=True;&quot;;\nusing (var con = new SqlConnection(cs))\n{\n    con.Open();\n    // CREATE\n    var ins = new SqlCommand(&quot;INSERT INTO Student(Name, Marks) VALUES(@n, @m)&quot;, con);\n    ins.Parameters.AddWithValue(&quot;@n&quot;, &quot;Asha&quot;); ins.Parameters.AddWithValue(&quot;@m&quot;, 85);\n    ins.ExecuteNonQuery();\n    // READ\n    var sel = new SqlCommand(&quot;SELECT Id, Name, Marks FROM Student&quot;, con);\n    using (SqlDataReader r = sel.ExecuteReader())\n        while (r.Read()) Console.WriteLine($&quot;{r[&quot;Id&quot;]} {r[&quot;Name&quot;]} {r[&quot;Marks&quot;]}&quot;);\n    // UPDATE\n    new SqlCommand(&quot;UPDATE Student SET Marks = 90 WHERE Name = 'Asha'&quot;, con).ExecuteNonQuery();\n    // SCALAR\n    int count = (int)new SqlCommand(&quot;SELECT COUNT(*) FROM Student&quot;, con).ExecuteScalar();\n    // DELETE\n    new SqlCommand(&quot;DELETE FROM Student WHERE Marks &lt; 40&quot;, con).ExecuteNonQuery();\n}\n<\/code><\/pre>\n<p><em>Always use parameters (<code>@n<\/code>) to prevent SQL injection.<\/em><\/p>"}, {"id": "IT275-19", "t": "DataSet/DataAdapter, transactions, stored procedures", "u": 6, "q": "Explain DataSet and DataAdapter, SqlTransaction and calling a stored procedure in ADO.NET.", "m": 5, "p": "Medium", "ty": "Code", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<pre><code class=\"language-csharp\">// Disconnected: DataAdapter + DataSet\nvar da = new SqlDataAdapter(&quot;SELECT * FROM Student&quot;, cs);\nvar ds = new DataSet();\nda.Fill(ds, &quot;Student&quot;);                       // opens/closes connection automatically\nDataTable dt = ds.Tables[&quot;Student&quot;];\ngridStudents.DataSource = dt;                  // bind to UI\n\n// Transaction\nusing var con = new SqlConnection(cs); con.Open();\nSqlTransaction tx = con.BeginTransaction();\ntry\n{\n    new SqlCommand(&quot;UPDATE Account SET Bal = Bal - 500 WHERE Id = 1&quot;, con, tx).ExecuteNonQuery();\n    new SqlCommand(&quot;UPDATE Account SET Bal = Bal + 500 WHERE Id = 2&quot;, con, tx).ExecuteNonQuery();\n    tx.Commit();                               // both succeed\n}\ncatch { tx.Rollback(); }                       // or neither\n\n// Stored procedure\nvar cmd = new SqlCommand(&quot;sp_GetStudentByMarks&quot;, con) { CommandType = CommandType.StoredProcedure };\ncmd.Parameters.AddWithValue(&quot;@MinMarks&quot;, 60);\nusing var rd = cmd.ExecuteReader();\n<\/code><\/pre>\n<p><strong>DataReader vs DataSet:<\/strong> connected, read-only, fast vs disconnected, editable, holds multiple tables and relations.\n<strong>Stored procedure advantages:<\/strong> precompiled (faster), security, reuse, less network traffic.<\/p>"}], "defs": [[".NET Framework", "Microsoft platform: CLR runtime + class library for building Windows apps."], ["CLR", "Common Language Runtime — executes MSIL, JIT compiles, garbage-collects."], ["MSIL", "Microsoft Intermediate Language — CPU-independent code produced by compilers."], ["JIT", "Just-In-Time compiler that converts MSIL to native code at run time."], ["CTS / CLS", "Common Type System / Common Language Specification enabling language interoperability."], ["Delegate", "Type-safe reference to a method."], ["Event", "Delegate-based notification raised by a publisher to subscribers."], ["Lambda expression", "Anonymous function using =>."], ["StringBuilder", "Mutable string class for efficient repeated modification."], ["Generic collection", "Type-safe collection such as List<T>, Dictionary<K,V>."], ["Entity Framework", "Microsoft ORM mapping C# classes to database tables."], ["LINQ", "Language-Integrated Query for collections, databases and XML."], ["Razor", "Syntax for embedding C# in HTML using @."], ["Routing", "Mapping URLs to controller actions."], ["ADO.NET", "Data-access classes: Connection, Command, DataReader, DataAdapter, DataSet."], ["ExecuteScalar", "SqlCommand method returning a single value."]], "revision": "<p><strong>IT 275 — one page<\/strong><\/p>\n<ul>\n<li><strong>U1:<\/strong> .NET Framework stack (OS → CLR → FCL → apps) · CLR parts (JIT, GC, CTS, CLS, security) · compile flow C# → MSIL → JIT → native · Framework vs Core table · VS vs VS Code, IntelliSense, project types.<\/li>\n<li><strong>U2:<\/strong> value vs reference types · class vs struct · partial/static/sealed · constructor types, destructor · inheritance, overloading vs overriding · abstract vs interface table · try/catch/finally/throw, custom exception.<\/li>\n<li><strong>U3:<\/strong> delegate, multicast, event (EventHandler sender, e) · lambda (Func, Action) · async/await · string immutable vs StringBuilder · generic vs non-generic collections.<\/li>\n<li><strong>U4:<\/strong> EF ORM · DB-First (scaffold) vs Code-First (migrations) vs Model-First (EDMX) · LINQ query vs method syntax, deferred execution.<\/li>\n<li><strong>U5:<\/strong> Web Forms vs MVC vs Web Pages (choose MVC for enterprise) · ASP.NET vs Core · MVC flow diagram · Razor @, @model, @foreach · _Layout, RenderBody · routing {controller}/{action}/{id?}, attribute routing.<\/li>\n<li><strong>U6:<\/strong> connected vs disconnected · components · ExecuteNonQuery / ExecuteReader / ExecuteScalar · parameters · transaction commit/rollback · stored procedures · DataSet vs DataReader.<\/li>\n<li><strong>D-questions to rehearse:<\/strong> MVC + EF Core Code-First CRUD (folders + steps + controller) · Web Forms quiz (Click event/delegate + StringBuilder).<\/li>\n<\/ul>", "practice": ["[AI practice] Write a C# program demonstrating method overloading and overriding. (5)", "[AI practice] Differentiate DataReader and DataSet. (3)", "[AI practice] Write LINQ to find the top three students by marks from a List<Student>. (3)", "[AI practice] Explain the page life cycle of ASP.NET Web Forms. (5)", "[AI practice] Build an ADO.NET Windows Forms app to insert and display employee records — outline the code. (10)"], "checklist": ["Draw .NET architecture and the compile flow", "List CLR components", "Compare Framework vs Core", "Write class/struct/enum examples", "Explain virtual/override with code", "Compare abstract class and interface", "Write try-catch-finally", "Write a delegate + event example", "Write lambdas and LINQ queries", "Explain StringBuilder vs string", "Compare EF approaches", "Draw MVC architecture", "Write a routing template", "Write an EF Code-First CRUD controller", "Write ADO.NET CRUD with 3 Execute methods"], "sources": [["TU FOM — BIM 8th Semester Syllabus 2025", "https://fomecd.edu.np/syllabuses/BIM%208th%20Semester%20Syllabus%202025.pdf"], ["TU FOM — Model Question 2026 (IT 275)", "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf"], ["Microsoft Learn — .NET, ASP.NET Core and EF Core documentation (reference for syntax)", "https://learn.microsoft.com/dotnet/"]], "extra": "", "extra_title": "Formulas and worked examples"}, {"code": "IT 276", "id": "IT276", "title": "Database Administration", "sem": 8, "exam": "2026-12-08", "official": "IT 276: Database Administration (Elective II, Oracle-based)", "syllabus": "BIM 8th Semester Syllabus 2025 (TU FOM, November 2025) — Elective, 3 credit hours, 48 LH, laboratory on all topics", "note": "Matches routine. IT 276 shares 8 Dec 2026 with IT 275; both are Elective II options — you would normally sit only one.", "marks": "Full Marks 60, Pass 30, 3 hrs (TU Model Question 2026). Group A 10×1 · Group B 5×3 (any 5 of 6) · Group C 3×5 (any 3 of 4) · Group D 2×10.", "objectives": "Teach the DBA role and Oracle architecture: installation and configuration, database objects, storage, users and security, auditing, networking, backup and recovery, performance tuning and scheduling.", "units": [{"n": 1, "t": "Introduction", "lh": 10, "topics": "Oracle Database and relational concepts; architecture — instance, memory, process and storage structures; DBA roles; Data Guard, RAC, ASM, Oracle Cloud; connecting to an instance; SQL*Plus, SQL Developer, Enterprise Manager; tables, constraints, indexes, views, synonyms, sequences; partitioning and materialised views; initialisation parameter files."}, {"n": 2, "t": "Tablespace and Storage Structures", "lh": 4, "topics": "Data storage and blocks; tablespaces and datafiles; control files; online redo logs, archive logs, multiplexing."}, {"n": 3, "t": "Managing Users, Roles and Privileges", "lh": 5, "topics": "Predefined admin accounts; create/modify/lock/drop users; authentication; password change; monitoring users and killing sessions; schema-only accounts; system and object privileges; GRANT/REVOKE; Oracle-supplied and custom roles; PL/SQL and roles."}, {"n": 4, "t": "User Profiles, Resources and Auditing", "lh": 4, "topics": "Profiles and resource parameters; password management; maintaining profiles; database security and auditing; standard and unified auditing; separation of duties (AUDIT_ADMIN, AUDIT_VIEWER); audit trail and options."}, {"n": 5, "t": "Oracle Network Configuration", "lh": 5, "topics": "Oracle Net overview; listener configuration and management; naming methods; NetCA, Net Manager, EM; client connections; starting/stopping the listener; TNSPING."}, {"n": 6, "t": "Concurrency, Backup and Recovery", "lh": 8, "topics": "Locking levels and methods; concurrency, contention, DML locks; preventing, detecting and resolving lock conflicts; undo management, retention, guarantee, Undo Advisor; flashback query; backup and recovery strategy; Data Pump export/import; user-managed backup; RMAN; high availability; multitenant CDB/PDB flashback."}, {"n": 7, "t": "Maintenance, Performance Management and Data Movement", "lh": 8, "topics": "Alert log and AWR; statistics levels, ADDM; advisors; explain plans, plan hash values, statistics gathering; tuning methodology; memory management; temporary tables; SQL tuning — optimiser, SQL plan directives, adaptive plans, SQL advisors; directory objects and Data Pump; SQL*Loader; external tables."}, {"n": 8, "t": "Resource Management and Task Scheduling", "lh": 4, "topics": "Database Resource Manager — plans, directives, allocation; default maintenance plan; Scheduler components, privileges, workflow; jobs and job classes; time- and event-based schedules."}], "avail": "<p><strong>No actual NC paper exists<\/strong> (first sitting December 2026) — <strong>insufficient data<\/strong> for frequency. The <strong>TU Model Question 2026<\/strong> (Category C) is complete and drives the priorities.<\/p>\n<p><strong>SQL note:<\/strong> commands follow Oracle Database 19c syntax and were checked by reading; they <strong>could not be executed here<\/strong> because no Oracle instance is available. Run them in your lab before the exam.<\/p>", "pattern": "<p><strong>Model 2026:<\/strong> definitions (10) · explain + <strong>write SQL<\/strong> (6) · architecture/SQL/locking/tuning (4) · two 10-mark long answers (full architecture; backup/HA).<\/p>\n<p><strong>Unit spread:<\/strong> U1: 5 (incl. both architecture long answers) · U2: 4 · U3: 2 · U4: 1 · U5: 2 · U6: 4 · U7: 3 · U8: 1. <strong>Architecture (Unit 1) and backup/recovery (Unit 6) dominate the marks.<\/strong> Memorise the key dynamic-performance views (V$…) and DBA commands — TU explicitly asks for SQL.<\/p>", "papers": [{"id": "M26", "label": "TU Model Question 2026", "cat": "C", "session": "Model (2026)", "source": "TU FOM Model Question 2026", "url": "https://www.fomecd.edu.np/noticeattachments/Model%20Question%20for%20BITM%201st%20and%20BBA%20BIM%20and%20BBM%208th%20Semester%20Final.pdf", "note": "Wording retrieved through a text-extraction tool; meaning and marks as printed.", "qs": [{"no": "1", "g": "A", "t": "Define an Oracle instance and an Oracle database.", "m": 1, "u": 1}, {"no": "2", "g": "A", "t": "What is the purpose of initialisation parameter files?", "m": 1, "u": 1}, {"no": "3", "g": "A", "t": "How does a tablespace use datafiles?", "m": 1, "u": 2}, {"no": "4", "g": "A", "t": "Why is multiplexing control files important?", "m": 1, "u": 2}, {"no": "5", "g": "A", "t": "Differentiate a schema-only account from a regular user.", "m": 1, "u": 3}, {"no": "6", "g": "A", "t": "What is the role of the Oracle Net Listener?", "m": 1, "u": 5}, {"no": "7", "g": "A", "t": "What is the undo retention period?", "m": 1, "u": 6}, {"no": "8", "g": "A", "t": "What is flashback query?", "m": 1, "u": 6}, {"no": "9", "g": "A", "t": "What is Explain Plan?", "m": 1, "u": 7}, {"no": "10", "g": "A", "t": "What is the role of Oracle Resource Manager?", "m": 1, "u": 8}, {"no": "11", "g": "B", "t": "Explain Oracle process architecture; give a SQL command to display background processes and describe one process.", "m": 3, "u": 1}, {"no": "12", "g": "B", "t": "Write SQL commands to view control file, redo log and archive log information.", "m": 3, "u": 2}, {"no": "13", "g": "B", "t": "Explain user authentication methods.", "m": 3, "u": 3}, {"no": "14", "g": "B", "t": "Explain database auditing and the unified audit trail.", "m": 3, "u": 4}, {"no": "15", "g": "B", "t": "Explain Oracle Net naming methods with examples.", "m": 3, "u": 5}, {"no": "16", "g": "B", "t": "Explain Data Pump export and import.", "m": 3, "u": 7}, {"no": "17", "g": "C", "t": "Explain Oracle memory architecture (SGA and PGA).", "m": 5, "u": 1}, {"no": "18", "g": "C", "t": "Explain creating tablespaces and managing datafiles, with SQL to create, alter and add datafiles.", "m": 5, "u": 2}, {"no": "19", "g": "C", "t": "Explain data concurrency and locking; how to detect and resolve lock contention.", "m": 5, "u": 6}, {"no": "20", "g": "C", "t": "Explain SQL performance tuning: optimiser, SQL plan directives and adaptive execution plans.", "m": 5, "u": 7}, {"no": "21", "g": "D", "t": "Explain the architecture of a database server supporting multiple applications: instance, memory, process and storage structures, and client–server interaction.", "m": 10, "u": 1}, {"no": "22", "g": "D", "t": "Explain backup and recovery strategies and techniques, including RMAN, Flashback Database, Data Guard and Oracle RAC.", "m": 10, "u": 6}]}], "notes": {"1": "<p>Large organisations store their most valuable information in databases such as Oracle. A Database Administrator (DBA) installs, configures, secures, backs up and tunes these databases so they are always available and fast.<\/p>\n<h3>1.1 Oracle Database and relational concepts<\/h3>\n<p>Oracle Database is a relational database management system (RDBMS) storing data in tables (relations) of rows and columns, linked by keys and queried with SQL. Relational concepts: entities, attributes, primary/foreign keys, normalisation, integrity constraints, transactions with ACID properties.<\/p>\n<h3>1.2 Oracle architecture: instance, memory, processes and storage<\/h3>\n<ul>\n<li><strong>Instance<\/strong> = SGA + background processes; <strong>database<\/strong> = physical files.<\/li>\n<li><strong>Memory:<\/strong> SGA (buffer cache, shared pool, redo log buffer, large/Java/Streams pools) and PGA (per process).<\/li>\n<li><strong>Processes:<\/strong> user, server (dedicated/shared), background (DBWn, LGWR, CKPT, SMON, PMON, ARCn, MMON, RECO).<\/li>\n<li><strong>Storage:<\/strong> physical (datafiles, control files, redo logs, archived logs, parameter and password files) and logical (tablespaces → segments → extents → blocks).<\/li>\n<\/ul>\n<h3>1.3 DBA roles and responsibilities<\/h3>\n<p>Installation and upgrades · database creation · storage management · user and security management · backup and recovery · performance tuning · monitoring · patching · capacity planning · auditing · supporting developers.<\/p>\n<h3>1.4 Data Guard, RAC, ASM and Oracle Cloud<\/h3>\n<p>Data Guard (standby databases for DR) · RAC (multiple instances, one database — HA and scalability) · ASM (Oracle volume manager — striping and mirroring) · Oracle Cloud (Autonomous Database, OCI services).<\/p>\n<h3>1.5 Connecting to an instance<\/h3>\n<p><code>sqlplus / as sysdba<\/code> (OS authentication) · <code>sqlplus sys/pwd@orclpdb as sysdba<\/code> · <code>sqlplus hr/pwd@//host:1521/orclpdb<\/code> (EZConnect); <code>CONNECT<\/code> inside SQL*Plus; multitenant: <code>ALTER SESSION SET CONTAINER = orclpdb;<\/code>.<\/p>\n<h3>1.6 Administrative tools<\/h3>\n<p>SQL*Plus (command line) · SQL Developer (GUI, free) · Enterprise Manager (web: Database Express / Cloud Control) · DBCA (create databases), NetCA, RMAN, Data Pump utilities.<\/p>\n<h3>1.7 Database objects<\/h3>\n<p>Tables · constraints (PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK) · indexes (B-tree, bitmap, function-based) · views · synonyms (private/public) · sequences.<\/p>\n<h3>1.8 Partitioning and materialised views<\/h3>\n<p>Partitioning splits large tables (range, list, hash, composite) for performance and manageability. Materialised views store query results and refresh (complete/fast, on demand/on commit).<\/p>\n<h3>1.9 Initialisation parameter files<\/h3>\n<p>PFILE (text) and SPFILE (binary, server-managed); key parameters: DB_NAME, CONTROL_FILES, MEMORY_TARGET/SGA_TARGET, PROCESSES, UNDO_TABLESPACE; startup stages NOMOUNT → MOUNT → OPEN; shutdown modes.<\/p>\n<p><strong>Key points:<\/strong> relational basics · instance vs database · SGA/PGA · background processes · DBA duties · HA features · connecting · tools · objects · partitioning · parameter files.<\/p>", "2": "<p>Oracle stores data in logical containers called tablespaces, which are made of physical datafiles on disk. Control files and redo logs keep the database consistent and recoverable.<\/p>\n<h3>2.1 Data storage and database blocks<\/h3>\n<p>The <strong>data block<\/strong> is the smallest unit of I/O (DB_BLOCK_SIZE, commonly 8 KB). An <strong>extent<\/strong> is a set of contiguous blocks; a <strong>segment<\/strong> is all extents of one object (table, index, undo, temp). Block structure: header, table directory, row directory, free space, row data.<\/p>\n<h3>2.2 Tablespaces and datafiles<\/h3>\n<p>A tablespace groups related segments; it consists of one or more datafiles. Types: permanent, undo, temporary; bigfile vs smallfile; locally managed extents; default tablespaces SYSTEM, SYSAUX, UNDOTBS1, TEMP, USERS. Operations: create, add datafile, resize, autoextend, offline/online, read-only, drop. Monitoring views: DBA_TABLESPACES, DBA_DATA_FILES, DBA_FREE_SPACE.<\/p>\n<h3>2.3 Control files<\/h3>\n<p>Binary file recording the database name, creation time, datafile and redo-log names and locations, checkpoint information and RMAN metadata. Needed to mount the database; should be <strong>multiplexed<\/strong> on different disks (CONTROL_FILES parameter). View: V$CONTROLFILE.<\/p>\n<h3>2.4 Online redo logs, archive logs and multiplexing<\/h3>\n<p>Redo logs record every change; organised in <strong>groups<\/strong> of identical <strong>members<\/strong>; LGWR writes circularly; a <strong>log switch<\/strong> moves to the next group. In <strong>ARCHIVELOG mode<\/strong> filled logs are copied by ARCn as archived logs, enabling point-in-time recovery. Multiplex members across disks. Views: V$LOG, V$LOGFILE, V$ARCHIVED_LOG.<\/p>\n<p><strong>Key points:<\/strong> block → extent → segment → tablespace · tablespace types and operations · control-file contents · redo groups/members · archiving and multiplexing.<\/p>", "3": "<p>Every person or application that connects to an Oracle database needs a user account with exactly the privileges required — no more. Roles make privilege management easier.<\/p>\n<h3>3.1 Predefined administrative accounts<\/h3>\n<p>SYS (data-dictionary owner, SYSDBA), SYSTEM (administration), plus SYSBACKUP, SYSDG, SYSKM, SYSRAC administrative privileges for separation of duties; many sample/internal accounts are locked by default.<\/p>\n<h3>3.2 Creating, modifying, locking and dropping users<\/h3>\n<p><code>CREATE USER … IDENTIFIED BY … DEFAULT TABLESPACE … QUOTA … PROFILE …;<\/code> · <code>ALTER USER … ACCOUNT LOCK/UNLOCK;<\/code> · <code>ALTER USER … PASSWORD EXPIRE;<\/code> · <code>DROP USER … CASCADE;<\/code> Views: DBA_USERS.<\/p>\n<h3>3.3 Authentication and changing passwords<\/h3>\n<p>Password, OS (external), password-file, global/directory (LDAP), Kerberos/SSL, proxy; <code>ALTER USER hr IDENTIFIED BY newpwd;<\/code> or <code>PASSWORD<\/code> command in SQL*Plus.<\/p>\n<h3>3.4 Monitoring users and terminating sessions<\/h3>\n<p><code>V$SESSION<\/code> (sid, serial#, username, status, machine, program) · <code>ALTER SYSTEM KILL SESSION 'sid,serial#' IMMEDIATE;<\/code> · <code>ALTER SYSTEM DISCONNECT SESSION …<\/code>.<\/p>\n<h3>3.5 Schema-only accounts<\/h3>\n<p><code>CREATE USER app NO AUTHENTICATION;<\/code> — owns objects but cannot log in; administered via privileged users or proxy authentication; reduces attack surface.<\/p>\n<h3>3.6 System and object privileges<\/h3>\n<p>System: CREATE SESSION, CREATE TABLE, CREATE ANY TABLE, ALTER SYSTEM … Object: SELECT, INSERT, UPDATE, DELETE, EXECUTE, REFERENCES, ALTER, INDEX on specific objects.<\/p>\n<h3>3.7 Grant and revoke commands<\/h3>\n<p><code>GRANT … TO … [WITH ADMIN OPTION]<\/code> (system) / <code>[WITH GRANT OPTION]<\/code> (object); <code>REVOKE … FROM …<\/code>. Revoking an object privilege granted WITH GRANT OPTION cascades; revoking system privileges does not.<\/p>\n<h3>3.8 Oracle-supplied and custom roles<\/h3>\n<p>Roles group privileges: CONNECT, RESOURCE, DBA, SELECT_CATALOG_ROLE, AUDIT_ADMIN, AUDIT_VIEWER; custom <code>CREATE ROLE clerk;<\/code> default roles, password-protected roles, <code>SET ROLE<\/code>.<\/p>\n<h3>3.9 PL/SQL and roles<\/h3>\n<p>Definer's-rights stored procedures ignore role privileges (need direct grants); invoker's-rights (<code>AUTHID CURRENT_USER<\/code>) execute with the caller's privileges; code-based access control can grant roles to program units.<\/p>\n<p><strong>Key points:<\/strong> admin accounts · user DDL · authentication methods · session control · schema-only · privilege types · grant options · roles · PL/SQL and roles.<\/p>", "4": "<p>Profiles control how users use passwords and resources, while auditing records what users do — both are essential for security and compliance.<\/p>\n<h3>4.1 Profiles and resource parameters<\/h3>\n<p>A <strong>profile<\/strong> is a named set of limits. Resource parameters: SESSIONS_PER_USER, CPU_PER_SESSION, CPU_PER_CALL, CONNECT_TIME, IDLE_TIME, LOGICAL_READS_PER_SESSION, PRIVATE_SGA, COMPOSITE_LIMIT (enforced when RESOURCE_LIMIT = TRUE).<\/p>\n<h3>4.2 Password management and resource control<\/h3>\n<p>Password parameters: FAILED_LOGIN_ATTEMPTS, PASSWORD_LOCK_TIME, PASSWORD_LIFE_TIME, PASSWORD_GRACE_TIME, PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX, PASSWORD_VERIFY_FUNCTION (complexity, e.g. ORA12C_VERIFY_FUNCTION).<\/p>\n<h3>4.3 Maintaining profiles<\/h3>\n<p><code>CREATE PROFILE<\/code>, <code>ALTER PROFILE<\/code>, <code>DROP PROFILE … CASCADE<\/code>, assign with <code>ALTER USER … PROFILE<\/code>; DEFAULT profile applies otherwise; view DBA_PROFILES.<\/p>\n<h3>4.4 Database security and auditing concepts<\/h3>\n<p>Security layers: authentication, authorisation (least privilege), encryption (TDE, network encryption), auditing, Virtual Private Database, Data Redaction. <strong>Auditing<\/strong> monitors and records selected actions for accountability, investigation and compliance.<\/p>\n<h3>4.5 Standard and unified auditing<\/h3>\n<p>Standard (traditional) auditing uses AUDIT_TRAIL and AUDIT statements (SYS.AUD$, DBA_AUDIT_TRAIL). <strong>Unified auditing<\/strong> (12c+) writes all audit records to a single trail (UNIFIED_AUDIT_TRAIL) using audit policies; mandatory auditing of key admin actions; Fine-Grained Auditing for specific data conditions.<\/p>\n<h3>4.6 Separation of audit duties<\/h3>\n<p>AUDIT_ADMIN: create/alter/enable policies, manage and purge the trail. AUDIT_VIEWER: read audit data only — separates administrators from auditors.<\/p>\n<h3>4.7 Configuring the audit trail and audit options<\/h3>\n<p><code>CREATE AUDIT POLICY … ACTIONS … / PRIVILEGES … / ROLES …;<\/code> <code>AUDIT POLICY … [BY user] [WHENEVER [NOT] SUCCESSFUL];<\/code> <code>NOAUDIT POLICY …;<\/code> trail management with DBMS_AUDIT_MGMT (purge, archive timestamp).<\/p>\n<p><strong>Key points:<\/strong> resource and password parameters · profile maintenance · security layers · standard vs unified auditing · AUDIT_ADMIN vs AUDIT_VIEWER · policy commands.<\/p>", "5": "<p>Users and applications usually connect to Oracle over a network. Oracle Net and the listener make these connections possible.<\/p>\n<h3>5.1 Oracle Net overview<\/h3>\n<p>Oracle Net (Oracle Net Services) is the networking software that establishes and maintains connections between clients and database servers over TCP/IP; it handles connect descriptors, protocol support and session data transfer.<\/p>\n<h3>5.2 Listener configuration and management<\/h3>\n<p>The listener (default port 1521) receives connection requests and hands them to server processes; configured in <code>listener.ora<\/code>; services register dynamically via LREG (or statically).<\/p>\n<h3>5.3 Naming methods<\/h3>\n<p>Local naming (<code>tnsnames.ora<\/code>), Easy Connect (<code>host:port/service<\/code>), directory naming (LDAP), external naming; order set in <code>sqlnet.ora<\/code> (NAMES.DIRECTORY_PATH).<\/p>\n<h3>5.4 Network configuration tools<\/h3>\n<p>Net Configuration Assistant (NetCA — wizard for listener and naming), Net Manager (netmgr — GUI editing), Enterprise Manager (listener monitoring).<\/p>\n<h3>5.5 Client connections<\/h3>\n<p>Client needs Oracle Client/Instant Client, a connect identifier (alias or EZConnect string), and network reachability; dedicated vs shared server connections; connection pooling for applications.<\/p>\n<h3>5.6 Starting and stopping the listener<\/h3>\n<p><code>lsnrctl start | stop | status | services | reload<\/code>.<\/p>\n<h3>5.7 Testing connectivity with TNSPING<\/h3>\n<p><code>tnsping orclpdb<\/code> checks the alias resolves and the listener responds (not that the database or login works); then test with <code>sqlplus user@alias<\/code>.<\/p>\n<p><strong>Key points:<\/strong> Oracle Net role · listener and port · four naming methods · tools · client requirements · lsnrctl · tnsping.<\/p>", "6": "<p>Many users change data at the same time, and failures — from a dropped table to a crashed disk — will happen. Oracle's locking, undo, backup and recovery features keep data correct and recoverable.<\/p>\n<h3>6.1 Locking levels and methods<\/h3>\n<p>Row-level (TX) locks for DML; table-level (TM) locks — RS, RX, S, SRX, X; DDL locks; latches and mutexes internally. Locks are held until COMMIT or ROLLBACK; Oracle never escalates row locks to table locks.<\/p>\n<h3>6.2 Data concurrency, contention causes and DML locks<\/h3>\n<p>Multiversion read consistency: readers see a consistent snapshot via undo. Contention arises from long uncommitted transactions, unindexed foreign keys, explicit LOCK TABLE, hot rows and poor application design.<\/p>\n<h3>6.3 Preventing, detecting and resolving lock conflicts<\/h3>\n<p>Prevent: short transactions, index foreign keys, <code>NOWAIT<\/code>/<code>WAIT n<\/code>. Detect: V$SESSION.BLOCKING_SESSION, V$LOCK, DBA_BLOCKERS/WAITERS, Enterprise Manager. Resolve: commit/rollback or <code>ALTER SYSTEM KILL SESSION<\/code>. Deadlocks: Oracle detects and rolls back one statement (ORA-00060).<\/p>\n<h3>6.4 Undo management<\/h3>\n<p>Undo stores old values for rollback, read consistency, recovery and Flashback. Automatic undo management (UNDO_MANAGEMENT = AUTO, undo tablespace). <strong>UNDO_RETENTION<\/strong>, <strong>RETENTION GUARANTEE<\/strong>, sizing using V$UNDOSTAT and the <strong>Undo Advisor<\/strong>; ORA-01555 \"snapshot too old\" when undo is overwritten.<\/p>\n<h3>6.5 Flashback query retention<\/h3>\n<p>Flashback Query (<code>AS OF TIMESTAMP/SCN<\/code>), Version Query, Transaction Query, Flashback Table and Drop rely on undo retention or the recycle bin.<\/p>\n<h3>6.6 Backup and recovery overview and strategy<\/h3>\n<p>Failure types: statement, user process, network, user error, instance, media. Strategy: ARCHIVELOG mode, full + incremental backups, archived-log backups, multiplexing, off-site copies, tested restores; define RPO/RTO.<\/p>\n<h3>6.7 Data Pump export/import<\/h3>\n<p>Logical backup and migration with <code>expdp<\/code>/<code>impdp<\/code> (full, schema, table, tablespace).<\/p>\n<h3>6.8 User-managed backup and recovery<\/h3>\n<p>OS copies of files: cold (consistent, database shut down) and hot (<code>ALTER DATABASE BEGIN/END BACKUP<\/code>); manual restore and <code>RECOVER DATABASE<\/code>.<\/p>\n<h3>6.9 RMAN configuration, backups and restore/recovery<\/h3>\n<p>RMAN: configure retention, control-file autobackup, channels; backup sets vs image copies; full and incremental (level 0/1); <code>RESTORE<\/code> and <code>RECOVER<\/code>; Fast Recovery Area; recovery catalog.<\/p>\n<h3>6.10 High-availability features<\/h3>\n<p>RAC, Data Guard, Flashback Database, ASM mirroring, Online redefinition, Maximum Availability Architecture.<\/p>\n<h3>6.11 Multitenant architecture and CDB/PDB flashback<\/h3>\n<p>A <strong>CDB<\/strong> (container database) holds the root, seed and multiple <strong>PDBs<\/strong> (pluggable databases); PDBs can be plugged/unplugged/cloned; PDB-level restore points and <code>FLASHBACK PLUGGABLE DATABASE<\/code>.<\/p>\n<p><strong>Key points:<\/strong> lock types · read consistency · contention handling · undo and ORA-01555 · flashback features · failure types and strategy · Data Pump · user-managed vs RMAN · HA · multitenant.<\/p>", "7": "<p>A DBA must keep the database healthy, find and fix slow SQL, and move data in and out efficiently. Oracle provides automated repositories, advisors and utilities for this.<\/p>\n<h3>7.1 Alert log and Automatic Workload Repository<\/h3>\n<p>Alert log: chronological record of startups, errors (ORA-), log switches and structural changes (in the ADR diag trace directory). AWR: hourly performance snapshots kept by MMON (default 8 days); AWR reports compare snapshots.<\/p>\n<h3>7.2 Statistics levels and ADDM<\/h3>\n<p>STATISTICS_LEVEL: BASIC, TYPICAL (default), ALL. ADDM analyses AWR snapshots and reports problems (CPU, I/O, SQL, memory, contention) with recommendations.<\/p>\n<h3>7.3 Advisors and notification rules<\/h3>\n<p>Memory (SGA/PGA), Segment, Undo, MTTR, SQL Tuning, SQL Access advisors; server-generated alerts with thresholds (e.g. tablespace usage) and notification rules in Enterprise Manager.<\/p>\n<h3>7.4 Explain plans, plan hash values and statistics gathering<\/h3>\n<p>EXPLAIN PLAN + DBMS_XPLAN.DISPLAY; actual plans via DBMS_XPLAN.DISPLAY_CURSOR; plan hash values identify plans; optimiser statistics gathered automatically or with DBMS_STATS (table, schema, database, system stats; histograms).<\/p>\n<h3>7.5 Performance-tuning methodology<\/h3>\n<p>Top-down: define goals → find the bottleneck (AWR/ADDM, wait events) → tune the biggest problem first (SQL, design, memory, I/O) → measure → repeat. Information sources: V$ views, AWR, ASH, alert log, trace files (SQL trace + TKPROF).<\/p>\n<h3>7.6 Memory management and temporary tables<\/h3>\n<p>Automatic Memory Management (MEMORY_TARGET) or ASMM (SGA_TARGET + PGA_AGGREGATE_TARGET); advisors for sizing. Global temporary tables store session/transaction-private data with minimal redo; private temporary tables (18c+).<\/p>\n<h3>7.7 SQL tuning<\/h3>\n<p>Cost-based optimiser; access paths and join methods; SQL plan directives; adaptive execution plans; SQL plan management (baselines); SQL Tuning Advisor and SQL Access Advisor; bind variables, indexing, rewriting SQL.<\/p>\n<h3>7.8 Directory objects and Data Pump<\/h3>\n<p><code>CREATE DIRECTORY dp_dir AS '/path';<\/code> with READ/WRITE grants; Data Pump architecture (master control process, master table, worker processes), views (DBA_DATAPUMP_JOBS), interactive mode (attach, STOP_JOB, START_JOB, KILL_JOB), DBMS_DATAPUMP API.<\/p>\n<h3>7.9 SQL*Loader<\/h3>\n<p>Loads flat files into tables using a control file (INFILE, INTO TABLE, FIELDS TERMINATED BY, WHEN for record filtering); command-line parameters (userid, control, log, bad, direct); conventional vs direct-path loads.<\/p>\n<h3>7.10 External tables<\/h3>\n<p>Read-only (ORACLE_LOADER) or unloadable (ORACLE_DATAPUMP) tables defined over external files with <code>ORGANIZATION EXTERNAL<\/code>, queried with SQL without loading.<\/p>\n<p><strong>Key points:<\/strong> alert log · AWR/ADDM · advisors · plans and statistics · methodology · memory · SQL tuning features · Data Pump architecture · SQL*Loader · external tables.<\/p>", "8": "<p>Databases run many workloads at once and need routine jobs done on time. Resource Manager shares resources fairly; the Scheduler automates tasks.<\/p>\n<h3>8.1 Database Resource Manager<\/h3>\n<p>Allocates CPU, parallel execution, sessions, undo and idle time among <strong>consumer groups<\/strong> according to an active <strong>resource plan<\/strong> made of <strong>plan directives<\/strong>. Prevents one workload from starving others. Managed via DBMS_RESOURCE_MANAGER and the pending area.<\/p>\n<h3>8.2 Default maintenance resource plan<\/h3>\n<p>DEFAULT_MAINTENANCE_PLAN is active during maintenance windows to limit automated tasks (optimiser statistics gathering, Segment Advisor, SQL Tuning Advisor) so that user workloads are protected.<\/p>\n<h3>8.3 Scheduler components, access rights and workflow<\/h3>\n<p>Components: <strong>program<\/strong> (what to run), <strong>schedule<\/strong> (when), <strong>job<\/strong> (what + when), <strong>job class<\/strong> (common attributes/consumer group), <strong>window<\/strong> (time period activating a resource plan), <strong>chain<\/strong> (multi-step workflow). Privileges: CREATE JOB, CREATE ANY JOB, MANAGE SCHEDULER, EXECUTE on programs.<\/p>\n<h3>8.4 Creating jobs and job classes<\/h3>\n<p><code>DBMS_SCHEDULER.CREATE_JOB(job_name, job_type =&gt; 'PLSQL_BLOCK'|'STORED_PROCEDURE'|'EXECUTABLE', job_action, start_date, repeat_interval, enabled)<\/code>; <code>CREATE_JOB_CLASS(job_class_name, resource_consumer_group)<\/code>; monitor DBA_SCHEDULER_JOBS and DBA_SCHEDULER_JOB_RUN_DETAILS.<\/p>\n<h3>8.5 Time-based and event-based schedules<\/h3>\n<p>Time-based: calendaring syntax (<code>FREQ=DAILY;BYHOUR=2<\/code>). Event-based: jobs start when a message arrives on a queue (e.g. a file-arrival event), using <code>event_condition<\/code> and <code>queue_spec<\/code>.<\/p>\n<p><strong>Key points:<\/strong> consumer groups, plans, directives · maintenance plan · scheduler components · job creation · time vs event schedules.<\/p>"}, "qa": [{"id": "IT276-01", "t": "Instance vs database; architecture of a DB server", "u": 1, "q": "Define an Oracle instance and database. Explain the architecture of a database server supporting multiple applications: instance, memory, process and storage structures, and client–server interaction.", "m": 10, "p": "High", "ty": "Architecture + diagram", "seen": {"M26": "A1, Q21"}, "rep": false, "src": "TU Model Question 2026 A1, Q21", "a": "<p><strong>Oracle database:<\/strong> the set of <strong>physical files<\/strong> on disk — datafiles, control files, online redo log files (plus parameter, password and archived log files).\n<strong>Oracle instance:<\/strong> the <strong>memory structures (SGA) + background processes<\/strong> that access and manage the database. An instance mounts and opens one database (in RAC, several instances share one database).<\/p>\n<div class=\"diagram\"><svg class=\"dg dgv\" viewBox=\"0 0 424 222\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><rect x=\"2\" y=\"2\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#dce7f7\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Client applications (web app, ERP, SQL Developer)<\/text><rect x=\"2\" y=\"46\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#e6eefa\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"69.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Oracle Net: listener + server (dedicated/shared) processes, PGA<\/text><rect x=\"2\" y=\"90\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#eef3fb\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"113.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">INSTANCE — SGA: buffer cache, shared pool, redo log buffer, large/Java/streams pools<\/text><rect x=\"2\" y=\"134\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f3f6fc\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"157.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">Background processes: DBWn, LGWR, CKPT, SMON, PMON, ARCn, MMON…<\/text><rect x=\"2\" y=\"178\" width=\"420\" height=\"38\" rx=\"5\" fill=\"#f7f9fd\" stroke=\"#3b5b8c\" stroke-width=\"1.2\"/><text x=\"212.0\" y=\"201.0\" text-anchor=\"middle\" font-size=\"12\" font-family=\"Inter,DejaVu Sans,sans-serif\" fill=\"#1d2b44\">DATABASE files: datafiles, control files, online redo logs, archived logs<\/text><\/svg><\/div>\n\n<p><strong>1. Memory structures<\/strong><\/p>\n<ul>\n<li><strong>SGA (System Global Area)<\/strong> — shared by all processes: <em>database buffer cache<\/em> (cached data blocks), <em>shared pool<\/em> (library cache for parsed SQL/PL-SQL, data-dictionary cache), <em>redo log buffer<\/em>, <em>large pool<\/em>, <em>Java pool<\/em>, <em>Streams pool<\/em>.<\/li>\n<li><strong>PGA (Program Global Area)<\/strong> — private to each server process: sort area, session information, cursor state.<\/li>\n<\/ul>\n<p><strong>2. Process structures<\/strong><\/p>\n<ul>\n<li><strong>User/client process<\/strong> — the application.<\/li>\n<li><strong>Server process<\/strong> — executes SQL for the client (dedicated or shared server).<\/li>\n<li><strong>Background processes:<\/strong> DBWn (writes dirty buffers to datafiles) · LGWR (writes the redo buffer to redo logs at commit) · CKPT (checkpoints, updates headers) · SMON (instance recovery) · PMON (cleans failed processes) · ARCn (archives redo logs) · MMON/MMNL (AWR statistics) · RECO (distributed recovery).<\/li>\n<\/ul>\n<p><strong>3. Storage structures<\/strong><\/p>\n<ul>\n<li><em>Physical:<\/em> datafiles, control files, redo log files, archived logs, parameter file (SPFILE), password file, alert log/trace files.<\/li>\n<li><em>Logical:<\/em> database → <strong>tablespaces<\/strong> → <strong>segments<\/strong> → <strong>extents<\/strong> → <strong>data blocks<\/strong>.<\/li>\n<\/ul>\n<p><strong>4. Client–server interaction (supporting multiple applications)<\/strong><\/p>\n<ol>\n<li>The application sends a connect request via Oracle Net (e.g. <code>host:1521/service<\/code>).<\/li>\n<li>The <strong>listener<\/strong> receives it and hands it to a <strong>dedicated server process<\/strong> (or a dispatcher in shared-server mode).<\/li>\n<li>The server process parses SQL (shared pool), reads blocks into the buffer cache, executes and returns rows.<\/li>\n<li>Changes generate redo in the redo buffer; LGWR writes it on COMMIT; DBWn writes blocks later.<\/li>\n<li>Many applications are served concurrently through separate sessions; they share SGA caches. Isolation is achieved through <strong>services<\/strong>, <strong>Resource Manager<\/strong> plans, separate schemas or <strong>PDBs<\/strong> (multitenant), and connection pooling.<\/li>\n<\/ol>\n<p><strong>HA options:<\/strong> RAC (multiple instances), Data Guard (standby), ASM (storage management).<\/p>"}, {"id": "IT276-02", "t": "Process architecture; background processes SQL", "u": 1, "q": "Explain Oracle process architecture. Write a SQL command to display background processes and describe one process.", "m": 3, "p": "High", "ty": "Explanation + SQL", "seen": {"M26": "Q11"}, "rep": false, "src": "TU Model Question 2026 Q11", "a": "<p>Oracle uses <strong>user processes<\/strong>, <strong>server processes<\/strong> and <strong>background processes<\/strong> (listed in the previous answer).<\/p>\n<pre><code class=\"language-sql\">SELECT pname, description\nFROM   v$process\nWHERE  pname IS NOT NULL\nORDER  BY pname;\n-- older style:\nSELECT name, description FROM v$bgprocess WHERE paddr &lt;&gt; '00';\n<\/code><\/pre>\n<p><strong>LGWR (Log Writer):<\/strong> writes redo entries from the redo log buffer to the online redo log files — at COMMIT, every 3 seconds, when the buffer is one-third full, and before DBWn writes. It guarantees committed changes are durable (\"write-ahead logging\").<\/p>"}, {"id": "IT276-03", "t": "Memory architecture: SGA and PGA", "u": 1, "q": "Explain Oracle memory architecture (SGA and PGA).", "m": 5, "p": "High", "ty": "Explanation", "seen": {"M26": "Q17"}, "rep": false, "src": "TU Model Question 2026 Q17", "a": "<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Contents / purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Database buffer cache<\/strong><\/td>\n<td>Copies of data blocks read from datafiles; LRU management; dirty buffers written by DBWn<\/td>\n<\/tr>\n<tr>\n<td><strong>Shared pool<\/strong><\/td>\n<td>Library cache (parsed SQL, execution plans, PL/SQL) and data-dictionary cache — enables SQL reuse (soft parse)<\/td>\n<\/tr>\n<tr>\n<td><strong>Redo log buffer<\/strong><\/td>\n<td>Circular buffer of change records before LGWR writes them<\/td>\n<\/tr>\n<tr>\n<td><strong>Large pool<\/strong><\/td>\n<td>RMAN backup buffers, shared-server session memory, parallel query<\/td>\n<\/tr>\n<tr>\n<td><strong>Java pool / Streams pool<\/strong><\/td>\n<td>Java code; Streams/GoldenGate<\/td>\n<\/tr>\n<tr>\n<td><strong>PGA<\/strong> (per server process)<\/td>\n<td>Sort/hash areas, session variables, cursor state — not shared<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Memory management options:<\/strong> <em>Automatic Memory Management<\/em> (<code>MEMORY_TARGET<\/code> for SGA + PGA), <em>Automatic Shared Memory Management<\/em> (<code>SGA_TARGET<\/code>, <code>PGA_AGGREGATE_TARGET<\/code>), or manual.<\/p>\n<pre><code class=\"language-sql\">SHOW PARAMETER sga_target;\nSELECT * FROM v$sgainfo;\nSELECT name, value FROM v$pgastat WHERE name = 'total PGA allocated';\n<\/code><\/pre>"}, {"id": "IT276-04", "t": "Initialisation parameter files; startup/shutdown; tools", "u": 1, "q": "What is the purpose of initialisation parameter files? Explain startup stages and administrative tools.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "A2"}, "rep": false, "src": "TU Model Question 2026 A2", "a": "<p><strong>Initialisation parameter file<\/strong> — read at instance startup; defines memory sizes, database name, control-file locations, processes, etc.<\/p>\n<ul>\n<li><strong>PFILE<\/strong> (<code>init&lt;SID&gt;.ora<\/code>) — text, edited manually, static.<\/li>\n<li><strong>SPFILE<\/strong> (<code>spfile&lt;SID&gt;.ora<\/code>) — binary, server-managed; changes via <code>ALTER SYSTEM SET … SCOPE=SPFILE|MEMORY|BOTH<\/code>.<\/li>\n<\/ul>\n<pre><code class=\"language-sql\">CREATE PFILE FROM SPFILE;\nALTER SYSTEM SET processes = 400 SCOPE = SPFILE;\n<\/code><\/pre>\n<p><strong>Startup stages:<\/strong> <code>STARTUP NOMOUNT<\/code> (instance started from parameter file) → <code>MOUNT<\/code> (control file read) → <code>OPEN<\/code> (datafiles and redo logs opened).\n<strong>Shutdown modes:<\/strong> NORMAL, TRANSACTIONAL, IMMEDIATE, ABORT.\n<strong>Connecting:<\/strong> <code>sqlplus / as sysdba<\/code> or <code>sqlplus sys@orclpdb as sysdba<\/code>.\n<strong>Tools:<\/strong> SQL*Plus (command line), SQL Developer (GUI), Enterprise Manager (web-based monitoring and administration).<\/p>"}, {"id": "IT276-05", "t": "DBA roles and responsibilities; RAC, Data Guard, ASM", "u": 1, "q": "Explain the roles and responsibilities of a DBA. Give an overview of Data Guard, RAC, ASM and Oracle Cloud.", "m": 5, "p": "Medium", "ty": "Explanation", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>DBA responsibilities:<\/strong> install and upgrade Oracle software · create and configure databases · manage storage (tablespaces, datafiles) · user and security management · backup, recovery and disaster planning · performance monitoring and tuning · patching · auditing and compliance · capacity planning · supporting developers · managing networking and high availability.<\/p>\n<ul>\n<li><strong>RAC (Real Application Clusters):<\/strong> several instances on different servers access one shared database → scalability and high availability.<\/li>\n<li><strong>Data Guard:<\/strong> maintains one or more <strong>standby databases<\/strong> synchronised from the primary using redo; switchover/failover for disaster recovery (physical or logical standby; Active Data Guard allows read-only queries).<\/li>\n<li><strong>ASM (Automatic Storage Management):<\/strong> Oracle's integrated volume manager and file system — striping and mirroring across disk groups.<\/li>\n<li><strong>Oracle Cloud:<\/strong> Autonomous Database and database services on OCI — self-patching, self-tuning, pay-as-you-go.<\/li>\n<\/ul>"}, {"id": "IT276-06", "t": "Schema objects: tables, constraints, indexes, views, synonyms, sequences; partitioning, MVs", "u": 1, "q": "Explain database objects with SQL examples, including partitioning and materialised views.", "m": 5, "p": "Medium", "ty": "SQL", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<pre><code class=\"language-sql\">CREATE TABLE student (\n  id      NUMBER PRIMARY KEY,\n  name    VARCHAR2(60) NOT NULL,\n  email   VARCHAR2(80) UNIQUE,\n  marks   NUMBER CHECK (marks BETWEEN 0 AND 100),\n  dept_id NUMBER REFERENCES department(dept_id));\nCREATE INDEX idx_student_name ON student(name);\nCREATE VIEW v_toppers AS SELECT name, marks FROM student WHERE marks &gt;= 80;\nCREATE SYNONYM stu FOR hr.student;                     -- alias\nCREATE SEQUENCE seq_student START WITH 1 INCREMENT BY 1;\nINSERT INTO student(id, name, marks) VALUES (seq_student.NEXTVAL, 'Asha', 85);\n\n-- Range partitioning\nCREATE TABLE sales (sale_id NUMBER, sale_date DATE, amount NUMBER)\nPARTITION BY RANGE (sale_date) (\n  PARTITION p2025 VALUES LESS THAN (DATE '2026-01-01'),\n  PARTITION p2026 VALUES LESS THAN (DATE '2027-01-01'));\n\n-- Materialised view (stored query result, refreshable)\nCREATE MATERIALIZED VIEW mv_sales_month\nREFRESH COMPLETE ON DEMAND AS\nSELECT TRUNC(sale_date, 'MM') AS mon, SUM(amount) AS total FROM sales GROUP BY TRUNC(sale_date, 'MM');\n<\/code><\/pre>\n<p><strong>Partitioning<\/strong> improves performance (partition pruning) and manageability of large tables. <strong>Materialised views<\/strong> speed up aggregate queries and replication.<\/p>"}, {"id": "IT276-07", "t": "Tablespaces and datafiles: create/alter/add", "u": 2, "q": "Explain how a tablespace uses datafiles. Write SQL to create a tablespace, alter it and add datafiles.", "m": 5, "p": "High", "ty": "SQL", "seen": {"M26": "A3, Q18"}, "rep": false, "src": "TU Model Question 2026 A3, Q18", "a": "<p>A <strong>tablespace<\/strong> is a logical storage container; it is physically made of one or more <strong>datafiles<\/strong>. Segments (tables, indexes) are created in a tablespace and their extents are allocated in its datafiles. Types: permanent, <strong>undo<\/strong>, <strong>temporary<\/strong>; <em>bigfile<\/em> (one huge file) vs <em>smallfile<\/em>. Standard ones: SYSTEM, SYSAUX, UNDOTBS1, TEMP, USERS.<\/p>\n<pre><code class=\"language-sql\">-- Create\nCREATE TABLESPACE app_data\n  DATAFILE '/u01/oradata/ORCL/app_data01.dbf' SIZE 500M\n  AUTOEXTEND ON NEXT 50M MAXSIZE 4G\n  EXTENT MANAGEMENT LOCAL SEGMENT SPACE MANAGEMENT AUTO;\n-- Add a datafile\nALTER TABLESPACE app_data\n  ADD DATAFILE '/u01/oradata/ORCL/app_data02.dbf' SIZE 500M AUTOEXTEND ON;\n-- Resize a datafile\nALTER DATABASE DATAFILE '/u01/oradata/ORCL/app_data01.dbf' RESIZE 1G;\n-- Offline / read only\nALTER TABLESPACE app_data READ ONLY;\n-- Temporary tablespace\nCREATE TEMPORARY TABLESPACE temp2 TEMPFILE '/u01/oradata/ORCL/temp02.dbf' SIZE 200M;\n-- Assign to a user\nALTER USER hr DEFAULT TABLESPACE app_data QUOTA 200M ON app_data;\n-- Monitor\nSELECT tablespace_name, file_name, bytes/1024/1024 AS mb FROM dba_data_files;\nSELECT tablespace_name, SUM(bytes)/1024/1024 AS free_mb FROM dba_free_space GROUP BY tablespace_name;\n-- Drop\nDROP TABLESPACE app_data INCLUDING CONTENTS AND DATAFILES;\n<\/code><\/pre>"}, {"id": "IT276-08", "t": "Control files, redo logs, archive logs, multiplexing", "u": 2, "q": "Why is multiplexing control files important? Write SQL commands to view control file, redo log and archive log information.", "m": 3, "p": "High", "ty": "SQL", "seen": {"M26": "A4, Q12"}, "rep": false, "src": "TU Model Question 2026 A4, Q12", "a": "<p><strong>Control file:<\/strong> a small binary file recording the database structure — name, datafile and redo-log locations, checkpoint SCN, RMAN backup metadata. Without it the database cannot mount. <strong>Multiplexing<\/strong> (keeping identical copies on different disks) protects against loss of one copy from media failure.\n<strong>Online redo logs:<\/strong> record all changes, in groups written in a circular way; multiplexed members per group. <strong>Archive logs:<\/strong> copies of filled redo logs (in ARCHIVELOG mode) needed for point-in-time recovery.<\/p>\n<pre><code class=\"language-sql\">-- Control files\nSELECT name FROM v$controlfile;\nSHOW PARAMETER control_files;\n-- Redo logs\nSELECT group#, sequence#, members, bytes/1024/1024 AS mb, status, archived FROM v$log;\nSELECT group#, member, status FROM v$logfile;\n-- Archive logs\nARCHIVE LOG LIST;\nSELECT name, sequence#, first_time, completion_time FROM v$archived_log ORDER BY sequence#;\nSELECT log_mode FROM v$database;\n-- Multiplex: add a redo member, switch log\nALTER DATABASE ADD LOGFILE MEMBER '/u02/oradata/ORCL/redo01b.log' TO GROUP 1;\nALTER SYSTEM SWITCH LOGFILE;\n<\/code><\/pre>\n<p>Enable archiving: <code>SHUTDOWN IMMEDIATE; STARTUP MOUNT; ALTER DATABASE ARCHIVELOG; ALTER DATABASE OPEN;<\/code><\/p>"}, {"id": "IT276-09", "t": "Users: create/modify/lock/drop; schema-only; sessions", "u": 3, "q": "Explain user management in Oracle with SQL. Differentiate a schema-only account and a regular user.", "m": 5, "p": "High", "ty": "SQL", "seen": {"M26": "A5"}, "rep": false, "src": "TU Model Question 2026 A5", "a": "<p><strong>Predefined administrative accounts:<\/strong> SYS (owner of the data dictionary, SYSDBA), SYSTEM (admin tasks), plus SYSBACKUP, SYSDG, SYSKM, SYSRAC for separation of duties.<\/p>\n<pre><code class=\"language-sql\">CREATE USER ram IDENTIFIED BY &quot;Str0ng#Pass&quot;\n  DEFAULT TABLESPACE users TEMPORARY TABLESPACE temp\n  QUOTA 100M ON users PROFILE app_profile PASSWORD EXPIRE;\nALTER USER ram IDENTIFIED BY &quot;N3w#Pass&quot;;        -- change password\nALTER USER ram ACCOUNT LOCK;                     -- lock / ACCOUNT UNLOCK\nDROP USER ram CASCADE;                           -- drop with objects\n-- Schema-only account (18c+): no password, nobody can log in directly\nCREATE USER app_owner NO AUTHENTICATION;\n-- Monitor and kill sessions\nSELECT sid, serial#, username, status, machine, program FROM v$session WHERE username IS NOT NULL;\nALTER SYSTEM KILL SESSION '135,2241' IMMEDIATE;\n<\/code><\/pre>\n<p><strong>Schema-only account vs regular user:<\/strong> a schema-only account is created <code>NO AUTHENTICATION<\/code> — it owns application objects but <strong>cannot log in<\/strong>, so it cannot be attacked by password guessing; administrators or proxy users manage its objects. A regular user has credentials and can connect.<\/p>"}, {"id": "IT276-10", "t": "Authentication methods", "u": 3, "q": "Explain user authentication methods in Oracle.", "m": 3, "p": "High", "ty": "Explanation", "seen": {"M26": "Q13"}, "rep": false, "src": "TU Model Question 2026 Q13", "a": "<ol>\n<li><strong>Password (database) authentication<\/strong> — the password is stored as a hash in the database: <code>IDENTIFIED BY password<\/code>.<\/li>\n<li><strong>Operating-system (external) authentication<\/strong> — the OS verifies the user: <code>CREATE USER ops$ram IDENTIFIED EXTERNALLY;<\/code> (and OS-group membership, e.g. <code>dba<\/code>, allows <code>sqlplus / as sysdba<\/code>).<\/li>\n<li><strong>Password-file authentication<\/strong> — for SYSDBA/SYSOPER remote connections when the database is down (<code>orapwd<\/code> utility).<\/li>\n<li><strong>Global / directory authentication<\/strong> — centrally via LDAP / Oracle Internet Directory / Active Directory: <code>IDENTIFIED GLOBALLY<\/code>.<\/li>\n<li><strong>Strong authentication<\/strong> — Kerberos, PKI/SSL certificates, RADIUS.<\/li>\n<li><strong>Proxy authentication<\/strong> — a middle-tier user connects on behalf of end users.<\/li>\n<li><strong>No authentication<\/strong> — schema-only accounts.<\/li>\n<\/ol>"}, {"id": "IT276-11", "t": "Privileges, GRANT/REVOKE, roles", "u": 3, "q": "Differentiate system and object privileges. Explain roles with GRANT and REVOKE examples.", "m": 5, "p": "Medium", "ty": "SQL", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p><strong>System privileges<\/strong> allow database-wide actions: <code>CREATE SESSION, CREATE TABLE, CREATE USER, ALTER SYSTEM<\/code>.\n<strong>Object privileges<\/strong> allow actions on a specific object: <code>SELECT, INSERT, UPDATE, DELETE, EXECUTE<\/code> on a table/procedure.<\/p>\n<pre><code class=\"language-sql\">GRANT CREATE SESSION, CREATE TABLE TO ram;\nGRANT SELECT, INSERT ON hr.employees TO ram WITH GRANT OPTION;\nGRANT CREATE VIEW TO ram WITH ADMIN OPTION;\nREVOKE INSERT ON hr.employees FROM ram;\n-- Roles: named group of privileges\nCREATE ROLE clerk;\nGRANT SELECT, INSERT ON hr.employees TO clerk;\nGRANT clerk TO ram;\nSET ROLE clerk;\nSELECT * FROM dba_role_privs WHERE grantee = 'RAM';\n<\/code><\/pre>\n<p><strong>Oracle-supplied roles:<\/strong> CONNECT, RESOURCE, DBA, SELECT_CATALOG_ROLE, AUDIT_ADMIN, AUDIT_VIEWER.\n<strong>PL/SQL and roles:<\/strong> definer's-rights procedures ignore privileges granted through roles — direct grants are required to compile them (invoker's rights use the caller's privileges).<\/p>"}, {"id": "IT276-12", "t": "Profiles and resource/password limits", "u": 4, "q": "What is a profile? Create a profile to control passwords and resources.", "m": 3, "p": "Medium", "ty": "SQL", "seen": {}, "rep": false, "src": "Syllabus coverage (no past-paper evidence)", "a": "<p>A <strong>profile<\/strong> is a named set of password and resource limits assigned to users.<\/p>\n<pre><code class=\"language-sql\">CREATE PROFILE app_profile LIMIT\n  FAILED_LOGIN_ATTEMPTS 5\n  PASSWORD_LOCK_TIME    1          -- days\n  PASSWORD_LIFE_TIME    90\n  PASSWORD_REUSE_MAX    5\n  PASSWORD_GRACE_TIME   7\n  SESSIONS_PER_USER     3\n  IDLE_TIME             30          -- minutes\n  CONNECT_TIME          480\n  CPU_PER_CALL          6000;\nALTER USER ram PROFILE app_profile;\nALTER PROFILE app_profile LIMIT IDLE_TIME 15;\n-- resource limits need: ALTER SYSTEM SET resource_limit = TRUE;\nSELECT * FROM dba_profiles WHERE profile = 'APP_PROFILE';\n<\/code><\/pre>"}, {"id": "IT276-13", "t": "Auditing; unified audit trail; AUDIT_ADMIN/VIEWER", "u": 4, "q": "Explain database auditing and the unified audit trail.", "m": 3, "p": "High", "ty": "Explanation + SQL", "seen": {"M26": "Q14"}, "rep": false, "src": "TU Model Question 2026 Q14", "a": "<p><strong>Auditing<\/strong> records selected database actions (who did what, when, from where) for security, accountability and compliance.<\/p>\n<p><strong>Standard (traditional) auditing<\/strong> — via <code>AUDIT_TRAIL<\/code> parameter and <code>AUDIT<\/code> statements; records go to <code>SYS.AUD$<\/code> or OS files.\n<strong>Unified auditing (12c+)<\/strong> — consolidates all audit records (database, RMAN, Data Pump, Fine-Grained Auditing, etc.) into a single <strong>unified audit trail<\/strong> (<code>UNIFIED_AUDIT_TRAIL<\/code> view), policy-based, more secure and faster.<\/p>\n<pre><code class=\"language-sql\">CREATE AUDIT POLICY pol_hr_dml\n  ACTIONS SELECT, UPDATE, DELETE ON hr.employees;\nAUDIT POLICY pol_hr_dml;                        -- enable (optionally BY user / WHENEVER SUCCESSFUL)\nCREATE AUDIT POLICY pol_logon ACTIONS LOGON;\nAUDIT POLICY pol_logon WHENEVER NOT SUCCESSFUL;  -- failed logins\nSELECT event_timestamp, dbusername, action_name, object_name, return_code\nFROM   unified_audit_trail ORDER BY event_timestamp DESC;\nNOAUDIT POLICY pol_hr_dml;\n<\/code><\/pre>\n<p><strong>Separation of duties:<\/strong> <code>AUDIT_ADMIN<\/code> role can create and manage policies and purge the trail; <code>AUDIT_VIEWER<\/code> role can only view audit data — so auditors and administrators are separated.<\/p>"}, {"id": "IT276-14", "t": "Oracle Net, listener, TNSPING", "u": 5, "q": "What is the role of the Oracle Net Listener? Explain listener configuration, starting/stopping and testing connectivity.", "m": 5, "p": "High", "ty": "Configuration", "seen": {"M26": "A6"}, "rep": false, "src": "TU Model Question 2026 A6", "a": "<p><strong>Oracle Net<\/strong> is the networking layer that establishes and maintains connections between clients and the database. The <strong>listener<\/strong> is a server-side process that listens on a port (default <strong>1521<\/strong>) for incoming connection requests and hands them to a server process (or dispatcher). After the hand-off the listener is no longer involved in the session.<\/p>\n<p><strong>listener.ora (server):<\/strong><\/p>\n<pre><code>LISTENER =\n  (DESCRIPTION_LIST =\n    (DESCRIPTION = (ADDRESS = (PROTOCOL = TCP)(HOST = dbserver)(PORT = 1521))))\n<\/code><\/pre>\n<p>Services register dynamically through the LREG process (static entries via <code>SID_LIST_LISTENER<\/code> are optional).<\/p>\n<p><strong>Managing the listener (lsnrctl):<\/strong><\/p>\n<pre><code>lsnrctl start\nlsnrctl stop\nlsnrctl status\nlsnrctl services\nlsnrctl reload\n<\/code><\/pre>\n<p><strong>Testing:<\/strong> <code>tnsping orclpdb<\/code> (checks the listener is reachable for that alias) and then <code>sqlplus hr@orclpdb<\/code>.\n<strong>Tools:<\/strong> Net Configuration Assistant (NetCA), Net Manager (netmgr), Enterprise Manager.<\/p>"}, {"id": "IT276-15", "t": "Naming methods", "u": 5, "q": "Explain Oracle Net naming methods with examples.", "m": 3, "p": "High", "ty": "Explanation + examples", "seen": {"M26": "Q15"}, "rep": false, "src": "TU Model Question 2026 Q15", "a": "<p>Naming methods resolve a connect identifier to a connect descriptor (host, port, service).<\/p>\n<ol>\n<li><strong>Local naming (tnsnames.ora)<\/strong> — on the client:<\/li>\n<
